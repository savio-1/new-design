<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fillout — Hero (recreation)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet" />
<style>
  :root{
    --gray-900:#171717; --gray-800:#262626; --gray-700:#333333; --gray-500:#737373;
    --gray-400:#9ca3af; --gray-200:#ebebeb; --gray-50:#fbfbfb;
    --yellow:#F6C744; --yellow-hover:#FED645;
    --shadow-marketing:0 12px 32px -6px #0000001f, 0 0 0 1px #6f6b6b1a, 0 1px 3px 0 #3f464b1a;
    --shadow-lg:0 10px 15px -3px #0000001a, 0 4px 6px -4px #0000001a;
    --shadow-outline:0 0 0 1px #0000001a, 0 1px 3px 0 #00000029;
    --shadow-branded:0 0 0 1px #d9a91a55, 0 1px 2px 0 #0000001f;
    --ease:cubic-bezier(.16,1,.3,1);
    --font:'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--font);color:var(--gray-700);background:#fff;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%}
  button{font-family:inherit;cursor:pointer;border:none;background:none}

  /* ===================== HEADER (floating pill) ===================== */
  header.nav{position:fixed;left:0;right:0;top:13px;z-index:50;display:flex;justify-content:center}
  .nav-pill{display:flex;align-items:center;justify-content:space-between;margin:0 16px;width:100%;max-width:1021px;
    border-radius:16px;background:rgba(255,255,255,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    padding:8px;box-shadow:var(--shadow-marketing)}
  .nav-left{display:flex;flex:1;align-items:center;justify-content:flex-start}
  .logo-link{display:flex;align-items:center;border-radius:12px;padding:8px 12px;transition:background .3s var(--ease)}
  .logo-link:hover{background:rgba(255,255,255,.8)}
  .nav-center{display:flex;align-items:center;justify-content:center;gap:4px}
  .nav-item{display:inline-flex;height:36px;align-items:center;justify-content:center;border-radius:10px;
    padding:8px 10px;font-size:14px;font-weight:500;color:var(--gray-700);transition:background .3s var(--ease)}
  .nav-item .chev{margin-left:4px;width:16px;height:16px;color:var(--gray-500);transition:transform .3s var(--ease)}
  .nav-item:hover{background:rgba(255,255,255,.8)}
  .nav-item:hover .chev{transform:translateY(1px)}
  .nav-right{display:flex;flex:1;align-items:center;justify-content:flex-end;gap:12px}
  .login{display:inline-flex;height:34px;align-items:center;padding:0 12px;border-radius:8px;font-size:14px;font-weight:500;color:var(--gray-700);transition:background .3s var(--ease)}
  .login:hover{background:rgba(255,255,255,.8)}
  .btn-yellow{display:inline-flex;height:34px;align-items:center;gap:4px;border-radius:8px;padding:0 14px;
    font-size:14px;font-weight:450;letter-spacing:-.16px;color:var(--gray-700);background:var(--yellow);
    box-shadow:var(--shadow-branded);transition:background .2s var(--ease),color .2s,transform .2s var(--ease),box-shadow .2s}
  .btn-yellow:hover{background:var(--yellow-hover);color:var(--gray-900);transform:translateY(-1px)}
  .btn-yellow:active{transform:translateY(0)}
  @media(max-width:920px){.nav-center{display:none}}

  /* ===================== HERO ===================== */
  .hero{position:relative;overflow:hidden;background:#fff}
  .hero-bg{pointer-events:none;position:absolute;inset:0 0 auto 0;top:0;height:82%;z-index:0}
  .hero-bg img{width:100%;height:100%;object-fit:cover;object-position:center top}
  .hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0) 55%,rgba(255,255,255,.65) 82%,#fff 100%)}
  .hero-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:80px;
    padding:128px 12px 0;max-width:1240px;margin:0 auto}
  .hero-top{display:flex;flex-direction:column;align-items:center;gap:28px;width:100%}
  .hero-copy{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
  .hero h1{font-size:68px;font-weight:600;line-height:1;letter-spacing:-.02em;white-space:nowrap}
  .hero h1 .dim{color:rgba(255,255,255,.7)}
  .hero h1 .solid{color:#fff}
  .hero-sub{font-size:22px;font-weight:400;line-height:1.18;color:#fff;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.08)}

  /* prompt CTA */
  .cta{width:100%;max-width:576px;display:flex;flex-direction:column;align-items:center;gap:12px}
  .cta-outer{width:100%;border-radius:16px;background:rgba(255,255,255,.3);padding:4px}
  .cta-inner{width:100%;border-radius:12px;background:#fff;padding:8px;box-shadow:var(--shadow-lg)}
  .cta-inner textarea{width:100%;resize:none;border:none;background:transparent;padding:4px;font-family:inherit;
    font-size:16px;color:var(--gray-800);outline:none}
  .cta-inner textarea::placeholder{color:var(--gray-400)}
  .cta-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;height:30px;width:30px;border-radius:8px;
    color:var(--gray-500);box-shadow:inset 0 0 0 1px var(--gray-200);transition:color .2s,box-shadow .2s,background .2s}
  .icon-btn:hover{color:var(--gray-700);background:var(--gray-50);box-shadow:inset 0 0 0 1px transparent, var(--shadow-outline)}
  .icon-btn svg{width:16px;height:16px}
  .send-btn{display:inline-flex;align-items:center;justify-content:center;height:30px;width:34px;border-radius:8px;
    background:var(--yellow);color:var(--gray-700);box-shadow:var(--shadow-branded);transition:background .2s,transform .2s var(--ease)}
  .send-btn:hover{background:var(--yellow-hover);transform:translateY(-1px)}
  .send-btn svg{width:16px;height:16px}

  /* product-wrap keeps tabs close above the showcase */
  .product-wrap{width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
  /* product category tabs */
  .prod-tabs{width:100%;max-width:1000px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;
    justify-content:space-between;gap:4px;padding:5px;border-radius:14px;
    background:rgba(255,255,255,.22);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  .ptab{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:10px;
    font-size:16px;font-weight:600;color:var(--gray-500);background:transparent;white-space:nowrap;
    transition:background .2s var(--ease),color .2s var(--ease),box-shadow .2s var(--ease),transform .2s var(--ease)}
  .ptab .ic{display:inline-flex;width:18px;height:18px;color:currentColor}
  .ptab .ic svg{width:100%;height:100%}
  .ptab:hover{color:var(--gray-700);background:rgba(255,255,255,.45)}
  .ptab.active{background:#fff;color:#111;box-shadow:0 1px 3px 0 #3f464b1a,0 0 0 1px #0000000d}
  .ptab.active .ic{color:#4c6ef5}

  /* product showcase */
  .product{width:100%;display:flex;justify-content:center}
  .product img{width:100%;max-width:900px;height:auto;border-radius:16px;
    box-shadow:0 40px 80px -20px rgba(20,40,80,.28), 0 8px 24px -8px rgba(20,40,80,.14)}

  /* ===================== LOGO STRIP ===================== */
  .logos-sec{padding:56px 0 64px;background:#fff}
  .logos-cap{text-align:center;font-size:14px;font-weight:600;letter-spacing:.02em;color:var(--gray-500);margin-bottom:28px}
  .marquee{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
  .marquee-track{display:flex;align-items:center;gap:60px;width:max-content;animation:marq 40s linear infinite}
  .marquee:hover .marquee-track{animation-play-state:paused}
  .logo-word{font-size:24px;font-weight:700;color:#b9c0c4;letter-spacing:-.01em;white-space:nowrap;
    filter:grayscale(1);transition:color .25s var(--ease),transform .25s var(--ease)}
  .logo-word:hover{color:var(--gray-700);transform:translateY(-2px)}
  @keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>
