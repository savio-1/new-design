  const ic = ICONS[name];
  if (!ic) return '';
  return `<svg viewBox="${ic.vb}" width="${size}" height="${size}" aria-hidden="true">${ic.body}</svg>`;
}
document.querySelectorAll('[data-icon]').forEach((el) => {
  el.innerHTML = svg(el.dataset.icon, Number(el.dataset.size) || 16);
});

/* ══════════════════════════════════════════════════════════
   CONTENT — verbatim from Figma node 2246:140053, narrated
   as live activities that settle into the design's end state
   ══════════════════════════════════════════════════════════ */
const GROUPS = [
  { icon:'book14', iconSize:14, label:'Definitions I used',
    activities:['Searching for relevant definitions'],
    note:'Found 3 definitions that match',
    rows:[
      { icon:'bookrow14', name:'Annual Recurring Revenue', open:true,
        def:'Revenue retained from existing customers including expansion' },
      { icon:'bookrow14', name:'Customer Churn Rate',
        def:'Percentage of customers who cancel within a period' },
      { icon:'bookrow14', name:'Net Revenue Retention', badge:'Low relavance',
        def:'Recurring revenue kept after churn, downgrades and expansion' },
    ]},
  { icon:'ontology', iconSize:16, label:'How some terms are related',
    activities:['Now looking for relations between the terms','Searching for the relations'],
    note:'Found 2 relations for Customer Churn Rate',
    rows:[
      { icon:'ontology', name:'Customer Churn Rate', chev:'chev12',
        desc:'Percentage of customers who cancel within a period', graph:true },
    ]},
  { icon:'warehouse', iconSize:16, label:'Where the data came from',
    activities:['Tracing where the data came from','Querying the company warehouse'],
    note:'Pulled 2 live sources from Snowflake',
    rows:[
      { icon:'warehouse', name:'Revenue figures', tag:'Snowflake',
        desc:'Live revenue data from company warehouse' },
      { icon:'warehouse', name:'Customer accounts', tag:'Snowflake' },
    ]},
  { icon:'warehouse', iconSize:16, label:'Applying rules and policies',
    activities:['Checking your disclosure and privacy rules'],
    note:'2 rules apply to this answer',
    rows:[
      { icon:'warehouse', name:'Revenue figures',
        desc:'Live revenue data from company warehouse' },
      { icon:'warehouse', name:'Customer accounts' },
    ]},
];

const PPT_STEPS = [
  { icon:'search', text:'Searching for relavant skills', hold:700,
    chips:[{ icon:'skill', text:'PPT skill' }, { icon:'skill', text:'Writing skill' }] },
  { icon:'ppt',  text:'Create PPT one-pager slide', hold:1100 },
  { icon:'file', text:'Analysing required files for full context', hold:1300 },
  { icon:'web',  text:'Searching relevant web sources', hold:1200 },
  { icon:'edit', text:'Replace/ re-write the content in the one-pager to target the audience', hold:1100 },
];

const CODE_LINES = [
  [['kw','import'],['',' pygame']],
  [['kw','import'],['',' sys']],
  [['kw','import'],['',' random']],
  [],
  [['','pygame.init()']],
  [],
  [['cmt','# Window']],
  [['','WIDTH, HEIGHT = '],['num','600, 600']],
  [['','GRID = '],['num','30']],
  [['','ROWS, COLS = '],['op','HEIGHT // GRID, WIDTH // GRID']],
  [['','screen = pygame.display.set_mode((WIDTH, HEIGHT))']],
  [['','pygame.display.set_caption("'],['str','Mini Pac-Man'],['','")']],
  [],
  [['','clock = pygame.time.Clock()']],
];

const SUMMARY = "I used your company's definitions of ARR and churn rather than the " +
  "industry-standard ones, pulled live revenue from Snowflake, and applied your " +
  "disclosure and privacy rules to how the figures appear.";

const ANSWER = "I reviewed the claim against your policy rules and found two items that " +
  "raise rejection risk: the repair estimate exceeds the pre-authorised limit, and the " +
  "loss date falls outside the notification window. The one-pager I generated breaks " +
  "both down with the exact clauses, and the code renders it for the document.";

/* ══════════════════════════════════════════════════════════
   TIMELINE RUNNER
   ══════════════════════════════════════════════════════════ */
const WORD_MS = 55;    // same cadence as the streaming-text component

const thread   = document.getElementById('thread');
const scroller = document.getElementById('scroller');
const phaseEl  = document.getElementById('phase');
const elapsedT = document.getElementById('elapsed-text');
const reduced  = matchMedia('(prefers-reduced-motion: reduce)').matches;

let run = 0;                                    // cancels an in-flight timeline
let traceInner = null;                          // the collapsible thinking window
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const stale = (mine) => mine !== run;

function follow() {
  scroller.scrollTo({ top: scroller.scrollHeight, behavior: reduced ? 'auto' : 'smooth' });
}

function el(tag, cls, parent) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (parent) parent.append(n);
  return n;
}

/** append words one at a time, each resolving out of blur, with a trailing caret */
async function streamWords(host, text, mine) {
  const caret = el('span', 'caret', host);
  for (const w of text.split(' ')) {
    if (stale(mine)) return;
    const s = el('span', 'word');
    s.textContent = w + ' ';
    host.insertBefore(s, caret);
    follow();
    await wait(WORD_MS);
  }
  caret.remove();
}

/* ---------- the live-activity primitive ----------
   spinner + streamed present-tense text + animated ellipsis;
   narrate() runs one activity and holds it shimmering;
   settle() swaps the spinner for the real icon and the text for
   the design's final label — the line becomes the end state. */
function statusLine(host) {
  const line = el('div', 'status appear', host);
  const sp = el('span', 'logo-spin', line);
  sp.innerHTML = svg('summarylogo', 14);
  el('span', 'status-txt', line);
  el('span', 'dots', line);
  return line;
}

async function narrate(line, text, mine, hold = 1200) {
  const txt = line.querySelector('.status-txt');
  txt.classList.remove('shimmer');
  txt.textContent = '';
  await streamWords(txt, text, mine);
  if (stale(mine)) return;
  txt.textContent = text;            // collapse spans so the shimmer clips cleanly
  txt.classList.add('shimmer');
  follow();
  await wait(hold);
}

function settle(line, icon, size = 16, cls = null, label = null) {
  const dots = line.querySelector('.dots');
  if (dots) dots.remove();
  const txt = line.querySelector('.status-txt');
  txt.classList.remove('shimmer');
  const ico = document.createElement('span');
  ico.className = 'status-ico pop';
  ico.innerHTML = svg(icon, size);
  line.querySelector('.logo-spin').replaceWith(ico);
  if (cls) txt.className = 'status-txt ' + cls;
  if (label != null) txt.textContent = label;
}

/** a trace section: 24px icon rail + streamed title + a working/done tail */
function section(icon, { tile = false, blue = false } = {}) {
  const sec = el('div', 'sec appear', traceInner);
  const rail = el('div', 'sec-rail', sec);
  const ico = el('div', 'sec-ico pop' + (tile ? ' tile' : ''), rail);
  ico.innerHTML = svg(icon, 16);
  el('div', 'sec-connector', rail);
  const body = el('div', 'sec-body', sec);
  const head = el('div', 'sec-head', body);
  const title = el('span', 'sec-title' + (blue ? ' blue' : ''), head);
  const tail = el('span', 'sec-chev', head);
  const fold = el('div', 'sec-fold', body);
  const content = el('div', '', fold);
  const obj = { sec, body, head, title, tail, fold, content, done: false };
  head.style.cursor = 'pointer';
  head.addEventListener('click', () => {          // settled sections crunch/expand on tap
    if (!obj.done) return;
    const folded = obj.fold.classList.toggle('folded');
    obj.tail.innerHTML = svg(folded ? 'chev16' : 'chevup16', 16);
  });
  return obj;
}
function foldSection(s) {
  s.fold.classList.add('folded');
  s.tail.innerHTML = svg('chev16', 16);
}
/* a working section shimmers its title; the loader mark itself only ever
   sits on the newest active status line */
function sectionWorking(s) {
  s.tail.innerHTML = '';
  s.title.textContent = s.title.textContent;   // collapse word spans so the shimmer clips cleanly
  s.title.classList.add('shimmer');
}
function sectionDone(s, chev = 'chevup16') {
  s.title.classList.remove('shimmer');
  s.tail.classList.add('pop');
  s.tail.innerHTML = svg(chev, 16);
  s.done = true;
}

/* ---------- a context group: narrated, then settled ---------- */
async function buildGroup(host, g, mine) {
  const grp = el('div', 'grp', host);
  const head = el('div', 'grp-head', grp);
  const line = statusLine(head);

  for (let i = 0; i < g.activities.length; i++) {
    if (stale(mine)) return;
    await narrate(line, g.activities[i], mine, i === g.activities.length - 1 ? 1400 : 1200);
  }
  if (stale(mine)) return;

  settle(line, g.icon, g.iconSize, 'grp-label', g.label);
  const chev = el('span', 'sec-chev pop', line);
  chev.innerHTML = svg('chev16', 16);
  const fold = el('div', 'grp-fold open', grp);
  const foldInner = el('div', '', fold);
  await wait(150);

  if (g.note) {
    const note = el('div', 'grp-note', foldInner);
    await streamWords(note, g.note, mine);
    if (stale(mine)) return;
    await wait(250);
  }

  const list = el('div', 'grp-list', foldInner);
  for (const r of g.rows) {
    if (stale(mine)) return;
    const row = el('div', 'row rise', list);
    const main = el('div', 'row-main', row);
    const top = el('div', 'row-top', main);
    const name = el('span', 'row-name', top);
    const ni = el('span', 'i', name);
    ni.innerHTML = svg(r.icon, r.icon === 'bookrow14' ? 14 : 16);
    el('span', '', name).textContent = r.name;
    if (r.chev) {
      const c = el('span', 'row-chev', top);
      c.innerHTML = svg(r.chev, 12);
    }
    if (r.tag) el('span', 'row-tag', top).textContent = r.tag;
    if (r.desc) el('div', 'row-desc', main).textContent = r.desc;
    if (r.def) {
      row.classList.add('row-toggle');
      row.setAttribute('role', 'button');
      row.tabIndex = 0;
      row.setAttribute('aria-expanded', String(!!r.open));
      const c = el('span', 'row-chev', top);
      c.innerHTML = svg(r.open ? 'chev12' : 'chevr12', 12);
      const foldWrap = el('div', 'row-fold' + (r.open ? ' open' : ''), main);
      const inner = el('div', '', foldWrap);
      el('div', 'row-desc', inner).textContent = r.def;
      const toggle = () => {
        const open = foldWrap.classList.toggle('open');
        c.innerHTML = svg(open ? 'chev12' : 'chevr12', 12);
        row.setAttribute('aria-expanded', String(open));
      };
      row.addEventListener('click', toggle);
      row.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
      });
    }
    follow();
    await wait(240);

    if (r.badge) {
      const b = el('span', 'badge pop', row);
      b.textContent = r.badge;
      await wait(200);
    }
    if (r.graph) {
      await buildGraph(main, mine);
      if (stale(mine)) return;
    }
  }

  head.classList.add('clickable');
  head.addEventListener('click', () => {
    const open = !fold.classList.contains('open');
    fold.classList.toggle('open', open);
    chev.classList.toggle('closed', !open);
  });
}

/* the ontology canvas: a crunched, inert preview of the graph app with the
   primary node focused; Expand opens the full app in an overlay */
let graphOverlay = null;
function openGraphOverlay() {
  if (!graphOverlay) {
    graphOverlay = el('div', 'graph-overlay', document.body);
    const sheet = el('div', 'sheet', graphOverlay);
    const frame = document.createElement('iframe');
    frame.setAttribute('title', 'Ontology graph');
    frame.setAttribute('allowfullscreen', '');
    frame.srcdoc = GRAPH_HTML + GRAPH_OVERLAY_CSS;
    sheet.append(frame);
    const close = el('button', 'graph-close', graphOverlay);
    close.setAttribute('aria-label', 'Close graph');
    close.innerHTML = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" '
      + 'stroke="currentColor" stroke-width="1.8" stroke-linecap="round">'
      + '<path d="M4 4l8 8M12 4l-8 8"/></svg>';
    const hide = () => graphOverlay.classList.remove('open');
    close.addEventListener('click', hide);
    graphOverlay.addEventListener('click', (e) => { if (e.target === graphOverlay) hide(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hide(); });
  }
  graphOverlay.classList.add('open');
}

async function buildGraph(host, mine) {
  const g = el('div', 'graph appear', host);
  const frame = document.createElement('iframe');
  frame.className = 'graph-preview';
  frame.setAttribute('title', 'Ontology graph preview');
  frame.setAttribute('tabindex', '-1');
  frame.srcdoc = GRAPH_HTML + GRAPH_PREVIEW_CSS;
  g.append(frame);
  const btn = el('button', 'graph-expand', g);
  btn.setAttribute('aria-label', 'Expand graph');
  btn.innerHTML = svg('expand', 16);
  btn.addEventListener('click', openGraphOverlay);
  follow();
  await wait(1000);
}

/* ══════════════════════════════════════════════════════════
   THE LOADING SEQUENCE
   ══════════════════════════════════════════════════════════ */
async function play() {
  const mine = ++run;
  thread.querySelectorAll('.trace, .reasoning-toggle, .answer').forEach((n) => n.remove());
  const traceWrap = el('div', 'trace', thread);
  traceInner = el('div', '', traceWrap);
  scroller.scrollTop = 0;
  elapsedT.textContent = 'Working…';
  document.getElementById('elapsed').classList.add('is-working');

  const setPhase = (n, of) => { phaseEl.textContent = `${n}/${of}`; };
  const OF = 6;

  /* 1 — Thinking: shimmer and hold before anything is shown */
  setPhase(1, OF);
  await wait(500); if (stale(mine)) return;
  const think = section('thinking', { tile:true, blue:true });
  await streamWords(think.title, 'Thinking', mine); if (stale(mine)) return;
  think.title.textContent = 'Thinking';
  think.title.classList.add('shimmer-blue');
  const tdots = el('span', 'dots blue', think.head);
  think.title.after(tdots);
  await wait(2300); if (stale(mine)) return;
  /* answering begins: the label becomes a live answering state and keeps
     shimmering until the whole trace completes */
  think.title.textContent = 'Working on the answer';

  /* 2 — Reading context: each group narrates what it is doing,
         then settles into the design's end state */
  setPhase(2, OF);
  const read = section('docsearch');
  await streamWords(read.title, 'Reading context', mine); if (stale(mine)) return;
  sectionWorking(read);
  await wait(400);

  for (const g of GROUPS) {
    if (stale(mine)) return;
    await buildGroup(read.content, g, mine);
    await wait(380);
  }
  if (stale(mine)) return;

  const comp = statusLine(read.content);
  await narrate(comp, 'Composing answer with 8 grounded items', mine, 1700);
  if (stale(mine)) return;
  settle(comp, 'edit', 16);
  sectionDone(read);
  await wait(500); if (stale(mine)) return;
  foldSection(read);                          // crunch the finished step
  await wait(400);

  /* 3 — Context summary */
  setPhase(3, OF);
  el('div', 'rule appear', traceInner);
  const sum = section('summarylogo');
  await streamWords(sum.title, 'Context summary', mine); if (stale(mine)) return;
  const sumBody = el('div', 'sum-body', sum.content);
  await streamWords(sumBody, SUMMARY, mine); if (stale(mine)) return;
  const meta = el('div', 'sum-meta appear', sum.content);
  el('span', '', meta).textContent = '8 items used';
  el('span', '', meta).textContent = '•';
  el('span', '', meta).textContent = '2 rules applied';
  await wait(700);

  /* 4 — Generate one-pager PPT: every step runs live, then ticks over */
  setPhase(4, OF);
  const ppt = section('ppt');
  await streamWords(ppt.title, 'Generate one-pager PPT', mine); if (stale(mine)) return;
  sectionWorking(ppt);
  const steps = el('div', 'steps', ppt.content);

  for (const s of PPT_STEPS) {
    if (stale(mine)) return;
    const line = statusLine(steps);
    await narrate(line, s.text, mine, s.hold);
    if (stale(mine)) return;
    if (s.chips) {
      const wrap = el('div', 'chips', steps);
      for (const c of s.chips) {
        const chip = el('span', 'chip pop', wrap);
        const cIco = el('span', '', chip);
        cIco.innerHTML = svg(c.icon, 16);
        el('span', '', chip).textContent = c.text;
        follow();
        await wait(220);
      }
      await wait(400);
    }
    settle(line, s.icon, 16);
    await wait(180);
  }
  if (stale(mine)) return;

  const done = el('div', 'step-done appear', ppt.content);
  await streamWords(done, "I’ve created the required one-pager document", mine);
  if (stale(mine)) return;
  const pill = el('span', 'pill pop', ppt.content);
  const pi = el('span', '', pill);
  pi.innerHTML = svg('clock', 16);
  el('span', '', pill).textContent = 'Finished in 3.2 sec';
  follow();
  sectionDone(ppt);
  await wait(600); if (stale(mine)) return;
  foldSection(ppt);                           // crunch the finished step
  await wait(400);

  /* 5 — Create code for the document */
  setPhase(5, OF);
  const code = section('code');
  await streamWords(code.title, 'Create code for the document', mine); if (stale(mine)) return;
  sectionWorking(code);
  const writing = statusLine(code.content);
  await narrate(writing, 'Writing the code', mine, 1300);
  if (stale(mine)) return;
  writing.remove();

  const block = el('div', 'codeblock appear', code.content);
  const exp = el('button', 'graph-expand', block);
  exp.setAttribute('aria-label', 'Expand code');
  exp.innerHTML = svg('expand', 16);

  for (const line of CODE_LINES) {
    if (stale(mine)) return;
    const ln = el('div', 'code-line rise', block);
    if (!line.length) ln.innerHTML = '&nbsp;';
    for (const [cls, txt] of line) {
      const sp = el('span', cls, ln);
      sp.textContent = txt;
    }
    follow();
    await wait(110);
  }
  if (stale(mine)) return;
  sectionDone(code);
  await wait(600); if (stale(mine)) return;

  /* the answer is fully thought through: crunch the entire thinking
     window into a “My reasoning” toggle */
  think.title.classList.remove('shimmer-blue');
  tdots.remove();
  think.title.textContent = 'Thought through the answer';
  /* inside the reasoning everything starts crunched — headers only,
     each expandable on click */
  document.querySelectorAll('.grp-fold').forEach((f) => f.classList.remove('open'));
  document.querySelectorAll('.grp-head .sec-chev').forEach((c) => c.classList.add('closed'));
  document.querySelectorAll('.row-toggle').forEach((row) => {
    row.querySelector('.row-fold')?.classList.remove('open');
    row.setAttribute('aria-expanded', 'false');
    const c = row.querySelector('.row-chev');
    if (c) c.innerHTML = svg('chevr12', 12);
  });
  foldSection(code);
  traceWrap.classList.add('folded');
  const tog = el('button', 'reasoning-toggle appear');
  tog.innerHTML = `<span class="t-ico">${svg('summarylogo', 16)}</span>`
    + '<span>My reasoning</span>'
    + `<span class="chev">${svg('chevr12', 12)}</span>`;
  thread.insertBefore(tog, traceWrap);
  tog.addEventListener('click', () => {
    const open = !traceWrap.classList.toggle('folded');
    tog.classList.toggle('open', open);
  });
  follow();
  await wait(650); if (stale(mine)) return;

  /* 6 — the actual answer */
  setPhase(6, OF);
  const ans = el('div', 'answer appear', thread);
  const ai = el('div', 'answer-ico', ans);
  ai.innerHTML = svg('thinking', 16);
  const abody = el('div', 'answer-body', ans);
  await streamWords(abody, ANSWER, mine);
  if (stale(mine)) return;

  /* settled for good — the Replay button restarts on demand */
  document.getElementById('elapsed').classList.remove('is-working');
  elapsedT.textContent = 'Finished in 3.2 sec';
}

document.getElementById('replay').addEventListener('click', () => play());
play();
</script>
