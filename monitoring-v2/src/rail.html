<!-- ══ Platform rail — monitoring only ══════════════════════════════════
     The rail component is the product's, unchanged. What is missing is
     deliberate: these pages are a standalone module, so the rail carries
     the Monitor group and nothing else. No Home, no Build/Library/
     Evaluate groups, no Marketplace pill — nothing that would navigate
     out of Monitoring or imply a surrounding product that isn't here.
     Its leaves are the three screens in this directory. -->
<aside class="cq-rail" id="rail" aria-label="Monitoring">
  <div class="cq-rail-head">
    <div class="cq-rail-brand">
      <span class="cq-rail-logo">
        <svg class="cq-ic" width="20" height="17.5" viewBox="0 0 20 17.5"><use href="#ic-logoonly"/></svg>
      </span>
      <span class="cq-rail-lbl cq-rail-wordmark">cogentiq</span>
    </div>
    <button class="cq-rail-collapse" id="railCollapse" type="button" aria-label="Collapse panel">
      <svg class="cq-ic" width="20" height="20" viewBox="0 0 20 20"><use href="#ic-pp_closepanel"/></svg>
    </button>
  </div>

  <div class="cq-rail-group" data-group="monitor">
    <button class="cq-rail-ghead" aria-expanded="true" title="Monitor">
      <span class="cq-rail-tile cq-grad-orange"><svg class="cq-ic" width="14" height="14" viewBox="0 0 14 14"><use href="#ic-pp_monitorcog"/></svg></span>
      <span class="cq-rail-lbl">Monitor</span>
      <svg class="cq-ic cq-rail-chev" width="16" height="16" viewBox="0 0 16 16"><use href="#ic-pp_chevron"/></svg>
    </button>
    <div class="cq-rail-stack">
      <button class="cq-rail-btn __RAIL_ACT_MON__" title="Monitoring" __RAIL_CUR_MON__><svg class="cq-ic" width="14" height="14" viewBox="0 0 14 14"><use href="#ic-pp_monitorcog"/></svg><span class="cq-rail-lbl">Monitoring</span></button>
      <button class="cq-rail-btn __RAIL_ACT_CK__" title="Checkpoints" __RAIL_CUR_CK__><svg class="cq-ic" width="16" height="16" viewBox="0 0 16 16"><use href="#i-shield"/></svg><span class="cq-rail-lbl">Checkpoints</span></button>
      <button class="cq-rail-btn __RAIL_ACT_LB__" title="Leaderboard" __RAIL_CUR_LB__><svg class="cq-ic" width="16" height="16" viewBox="0 0 16 16"><use href="#i-bars"/></svg><span class="cq-rail-lbl">Leaderboard</span></button>
    </div>
  </div>
</aside>
