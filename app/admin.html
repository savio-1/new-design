<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cogentiq Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
/*TOKENS*/
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--backgrounds-page-bg-1); color: var(--text-primary); font-family: var(--font-geist); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--strokes-card-selected); outline-offset: 2px; }

/* ── Shell (Figma: Admin flow · Admin- Users) ── */
.ad { display: flex; height: 100vh; }
.ad-side { width: 240px; flex: none; display: flex; flex-direction: column; gap: 20px; padding: 16px 16px 8px; }
.ad-brand { display: flex; align-items: center; gap: 8px; }
.ad-logo { width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--backgrounds-page-bg-2); }
.ad-brand__t { flex: 1 1 auto; display: flex; flex-direction: column; }
.ad-brand__t b { font: 500 18px/22px var(--font-geist); letter-spacing: -0.7px; }
.ad-brand__t small { font: 500 12px/14px var(--font-geist); color: var(--text-secondary); }
.ad-collapse { color: var(--text-teritiary); display: inline-flex; }
.ad-nav { display: flex; flex-direction: column; gap: 8px; }
.ad-top { width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px 0; border-radius: 8px; font: 500 14px/20px var(--font-geist); letter-spacing: -0.56px; text-align: left; }
.ad-top .tile { width: 24px; height: 24px; flex: none; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; color: #fff; }
.ad-top .tile.orange { background: linear-gradient(225deg, #dd7c0e, #fc9e24 55%, #fcd19c); }
.ad-top .tile.purple { background: linear-gradient(225deg, #8638e5, #9747ff 55%, #e4ccff); }
.ad-top .tile.blue { background: linear-gradient(225deg, #007be5, #0d99ff 55%, #bde3ff); }
.ad-top .lbl { flex: 1 1 auto; }
.ad-top .chev { color: var(--text-teritiary); transition: transform .15s; }
.ad-group.is-closed .ad-top .chev { transform: rotate(180deg); }
.ad-group.is-closed .ad-sub { display: none; }
.ad-sub { display: flex; flex-direction: column; gap: 2px; padding-left: 4px; }
.ad-item { width: 100%; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 8px; border: 1px solid transparent;
  color: var(--text-secondary); font: 400 14px/20px var(--font-geist); letter-spacing: -0.56px; text-align: left; }
.ad-item:hover { background: var(--backgrounds-card-bg-4); }
.ad-item.is-on { background: var(--backgrounds-button-tonal-1); border-color: var(--strokes-card-selected); color: var(--text-coloured-blue); }
.ad-item .n { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center;
  background: var(--red-500, #f24822); color: #fff; font: 600 11px/1 var(--font-geist); }
.ad-item .n:empty { display: none; }
.ad-sp { flex: 1 1 auto; }
.ad-portal { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 8px; background: #212121; color: #fff; font: 500 14px/20px var(--font-geist); }
:root[data-mode="light"] .ad-portal { background: #212121; }
.ad-portal .ext { margin-left: auto; opacity: .8; }
.ad-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; margin: 8px 8px 8px 0; border-radius: 12px; overflow: hidden;
  background: var(--backgrounds-page-bg-2); border: 1px solid var(--strokes-line-3); }
.ad-head { flex: none; height: 48px; display: flex; align-items: center; gap: 16px; padding: 0 16px; border-bottom: 1px solid var(--strokes-line-3); background: var(--backgrounds-card-bg-5); }
.ad-head h1 { flex: 0 1 auto; margin: 0; font: 500 18px/24px var(--font-geist); letter-spacing: -0.72px; }
.ad-head .ad-sp2 { flex: 1 1 auto; }
.mk-view { position: relative; margin-left: -4px; }
.mk-view__btn { height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px 0 10px; border-radius: 8px; cursor: pointer; border: 1px solid var(--strokes-card-default); background: none; color: var(--text-secondary); font: 500 13px/18px var(--font-geist); letter-spacing: -0.4px; }
.mk-view__btn:hover, .mk-view__btn[aria-expanded="true"] { background: var(--backgrounds-card-bg-4); color: var(--text-primary); }
.mk-view__menu { position: absolute; left: 0; top: calc(100% + 6px); z-index: 60; width: 280px; padding: 4px; border-radius: 10px; background: var(--backgrounds-page-bg-2); border: 1px solid var(--strokes-card-default); box-shadow: 0 8px 24px rgba(0,0,0,.28); }
.mk-view__menu[hidden] { display: none; }
.mk-view__menu button { width: 100%; display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border: 0; border-radius: 6px; background: none; cursor: pointer; text-align: left; color: var(--text-primary); font-family: var(--font-geist); }
.mk-view__menu button:hover { background: var(--backgrounds-card-bg-4); }
.mk-view__menu b { display: block; font: 500 14px/20px var(--font-geist); letter-spacing: -0.4px; }
.mk-view__menu small { display: block; color: var(--text-teritiary); font: 400 12px/16px var(--font-geist); }
.mk-view__menu .tick { width: 16px; flex: none; margin-top: 2px; color: var(--text-coloured-blue); }
.ad-crumb { color: var(--text-teritiary); }
.ad-icon { width: 32px; height: 32px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: var(--text-secondary); }
.ad-icon:hover { background: var(--backgrounds-card-bg-4); }
.ws-pill { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 8px; font: 400 14px/20px var(--font-geist); }
.ws-pill:hover { background: var(--backgrounds-card-bg-4); }
.ws-pill .av { width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: #f79722; color: #fff; font: 500 11px/1 var(--font-geist); }
.ad-avatar { width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: #5860ed; color: #fff; font: 500 13px/1 var(--font-geist); }
.ad-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 16px 24px 32px; }
.ad-bar { display: flex; align-items: center; gap: 8px; padding: 0 0 16px; }
.ad-filter { height: 36px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px 0 16px; border-radius: 18px; background: var(--backgrounds-card-bg-4); color: var(--text-secondary); font: 400 14px/20px var(--font-geist); }
.ad-search { width: 280px; height: 36px; margin-left: auto; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 8px;
  background: var(--backgrounds-type-default-bg-1); border: 1px solid var(--strokes-type-default); color: var(--text-teritiary); font: 400 14px/20px var(--font-geist); }
.ad-btn { height: 36px; display: inline-flex; align-items: center; gap: 6px; padding: 0 14px; border-radius: 8px; background: var(--backgrounds-button-primary); color: #fff; font: 500 14px/20px var(--font-geist); }
.ad-intro { display: flex; flex-direction: column; gap: 4px; margin: 8px 0 20px; }
.ad-intro h2 { margin: 0; font: 500 20px/28px var(--font-geist); letter-spacing: -0.8px; }
.ad-intro p { margin: 0; max-width: 760px; color: var(--text-secondary); font: 400 14px/20px var(--font-geist); }
.ad-qh { display: flex; align-items: center; gap: 6px; margin: 4px 0 16px; position: relative; }
.ad-qh h2 { margin: 0; font: 500 20px/28px var(--font-geist); letter-spacing: -0.8px; }
.ad-info { width: 24px; height: 24px; border-radius: 6px; border: 0; background: none; cursor: pointer; color: var(--text-teritiary); display: inline-flex; align-items: center; justify-content: center; }
.ad-info:hover, .ad-info[aria-expanded="true"] { background: var(--backgrounds-card-bg-4); color: var(--text-primary); }
.ad-pop { position: absolute; left: 0; top: calc(100% + 6px); z-index: 40; width: 460px; padding: 14px 16px; border-radius: 12px; background: var(--backgrounds-page-bg-2); border: 1px solid var(--strokes-card-default); box-shadow: 0 8px 24px rgba(0,0,0,.28); display: flex; flex-direction: column; gap: 12px; }
.ad-pop[hidden] { display: none; }
.ad-pop p { margin: 0; color: var(--text-secondary); font: 400 12px/16px var(--font-geist); }
.ad-pop h3 { margin: 0 0 6px; font: 500 13px/18px var(--font-geist); }
.ad-pop ol { margin: 0; padding-left: 18px; color: var(--text-secondary); font: 400 12px/18px var(--font-geist); }
.ad-pop li.you { color: var(--text-coloured-blue); font-weight: 500; }
.ad-flow { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
.ad-flowcard { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--strokes-card-default); background: var(--backgrounds-card-bg-2); }
.ad-flowcard h3 { margin: 0; font: 500 14px/20px var(--font-geist); }
.ad-flowcard ol { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ad-flowcard li { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: var(--backgrounds-card-bg-4); color: var(--text-secondary); font: 400 12px/16px var(--font-geist); }
.ad-flowcard li.you { background: var(--backgrounds-badge-blue); color: var(--text-coloured-blue); font-weight: 500; }
.ad-flowcard .arr { color: var(--text-teritiary); font-size: 12px; }
/* Tables (Figma: Users, Workspace) */
.ad-table { width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid var(--strokes-card-default); border-radius: 12px; overflow: hidden; }
.ad-table th { text-align: left; padding: 14px 12px; background: var(--backgrounds-page-bg-3); font: 400 14px/20px var(--font-geist); color: var(--text-primary); border-bottom: 1px solid var(--strokes-card-default); }
.ad-table td { padding: 12px; border-bottom: 1px solid var(--strokes-line-3); font: 400 14px/20px var(--font-geist); color: var(--text-secondary); }
.ad-table tr:last-child td { border-bottom: 0; }
.ad-table td.p { color: var(--text-primary); }
.ad-cb { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--strokes-checkbox-default, #616161); display: inline-block; vertical-align: middle; }
.ad-who { display: inline-flex; align-items: center; gap: 8px; color: var(--text-primary); }
.ad-av { width: 20px; height: 20px; flex: none; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: #fff; font: 500 11px/1 var(--font-geist); }
.ad-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.ad-tag { height: 22px; display: inline-flex; align-items: center; padding: 0 8px; border-radius: 11px; font: 400 12px/16px var(--font-geist); border: 1px solid; }
.ad-tag.blue { background: var(--backgrounds-badge-blue); border-color: var(--strokes-colour-blue); color: var(--text-coloured-blue); }
.ad-tag.green { background: var(--backgrounds-badge-green); border-color: var(--strokes-colour-green); color: var(--text-coloured-green); }
.ad-tag.orange { background: var(--backgrounds-badge-orange); border-color: var(--strokes-colour-orange); color: var(--text-coloured-orange); }
.ad-tag.grey { background: var(--backgrounds-card-bg-4); border-color: var(--strokes-line-1); color: var(--text-teritiary); }
.ad-stack { display: inline-flex; }
.ad-stack .ad-av { margin-left: -6px; box-shadow: 0 0 0 2px var(--backgrounds-page-bg-2); }
.ad-stack .ad-av:first-child { margin-left: 0; }
.ad-acts { display: inline-flex; gap: 14px; color: var(--text-secondary); }
.ad-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
.ad-stat { padding: 16px; border-radius: 12px; border: 1px solid var(--strokes-card-default); background: var(--backgrounds-card-bg-2); display: flex; flex-direction: column; gap: 6px; }
.ad-stat span { color: var(--text-teritiary); font: 400 13px/18px var(--font-geist); }
.ad-stat b { font: 500 28px/34px var(--font-geist-mono); letter-spacing: -1px; }
.ad-stat.is-alert b { color: var(--text-coloured-orange); }
.ad-setbtn { height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--strokes-card-default); background: var(--backgrounds-card-bg-2); color: var(--text-primary); cursor: pointer; font: 500 13px/18px var(--font-geist); }
.ad-setbtn:hover { border-color: var(--strokes-card-selected); }
.ad-set { position: fixed; inset: 0; z-index: 320; pointer-events: none; }
.ad-set__scrim { position: absolute; inset: 0; background: rgba(18,18,18,.5); opacity: 0; transition: opacity .2s ease; }
.ad-set__sheet { position: absolute; top: 8px; right: 8px; bottom: 8px; width: min(440px, calc(100vw - 16px)); display: flex; flex-direction: column; border-radius: 12px; background: var(--backgrounds-page-bg-2); border: 1px solid var(--strokes-card-default); box-shadow: 0 16px 40px rgba(0,0,0,.4); transform: translateX(24px); opacity: 0; transition: transform .22s ease, opacity .2s ease; }
.ad-set.is-open { pointer-events: auto; }
.ad-set.is-open .ad-set__scrim { opacity: 1; }
.ad-set.is-open .ad-set__sheet { transform: none; opacity: 1; }
.ad-set__h { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--strokes-line-3); }
.ad-set__h h2 { flex: 1 1 auto; margin: 0; font: 500 16px/24px var(--font-geist); letter-spacing: -.64px; }
.ad-set__x { width: 28px; height: 28px; border-radius: 6px; border: 0; background: none; color: var(--text-secondary); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.ad-set__x:hover { background: var(--backgrounds-card-bg-4); color: var(--text-primary); }
.ad-set__b { flex: 1 1 auto; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.ad-set__p { margin: 0; color: var(--text-secondary); font: 400 13px/18px var(--font-geist); }
.ad-set__sec { padding: 14px 16px 6px; border-radius: 12px; border: 1px solid var(--strokes-card-default); background: var(--backgrounds-card-bg-2); display: flex; flex-direction: column; gap: 6px; }
.ad-set__sec h3 { margin: 0; font: 500 14px/20px var(--font-geist); }
.ad-set__sec p { margin: 0 0 4px; color: var(--text-teritiary); font: 400 12px/16px var(--font-geist); }
button.ad-sw { border: 0; padding: 0; cursor: pointer; }
.ad-pol { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.ad-pol section { padding: 16px; border-radius: 12px; border: 1px solid var(--strokes-card-default); background: var(--backgrounds-card-bg-2); display: flex; flex-direction: column; gap: 10px; }
.ad-pol h3 { margin: 0; font: 500 15px/22px var(--font-geist); }
.ad-pol p { margin: 0; color: var(--text-secondary); font: 400 13px/18px var(--font-geist); }
.ad-rule { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--strokes-line-3); font: 400 13px/18px var(--font-geist); }
.ad-rule span { flex: 1 1 auto; }
.ad-sw { width: 32px; height: 18px; border-radius: 9px; background: var(--backgrounds-button-primary); position: relative; flex: none; }
.ad-sw::after { content: ""; position: absolute; top: 2px; right: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; }
.ad-sw.off { background: var(--backgrounds-card-bg-4); }
.ad-sw.off::after { left: 2px; right: auto; }
@media (max-width: 1100px) { .ad-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .ad-flow, .ad-pol { grid-template-columns: 1fr; } }
</style>
</head>

    <div class="ad-brand">
      <span class="ad-logo"><svg width="20" height="18" viewBox="0 0 20 17.64" fill="none" aria-hidden="true"><path d="M10.83 17.64H0l5.35-9.64.43.75c.92 1.58 1.69 2.96 2.44 4.3.72 1.29 1.4 2.51 2.18 3.86l.43.73Zm-9.17-.98h7.47c-.61-1.07-1.18-2.08-1.77-3.14-.63-1.12-1.27-2.26-2-3.53l-3.7 6.67Z" fill="#FAB518"/><path d="M20 17.64H9.14l.42-.74c.71-1.24 1.38-2.43 2.08-3.7.77-1.39 1.56-2.82 2.5-4.46l.43-.74.42.75c.88 1.54 1.64 2.9 2.39 4.24.72 1.29 1.43 2.54 2.2 3.92l.42.73Zm-9.17-.98h7.49c-.62-1.1-1.2-2.13-1.8-3.19-.62-1.11-1.26-2.24-1.96-3.49-.76 1.33-1.42 2.53-2.07 3.7-.56 1.01-1.1 1.98-1.66 2.98Z" fill="#EC3225"/><path d="M15.43 9.48H4.53l.41-.73C5.69 7.42 6.41 6.19 7.17 4.88 7.94 3.57 8.73 2.22 9.56.74L9.97 0l.44.74c.83 1.42 1.58 2.75 2.31 4.03.71 1.27 1.46 2.59 2.28 3.98l.43.73Zm-9.22-.98h7.5c-.65-1.13-1.26-2.21-1.85-3.26-.6-1.05-1.21-2.13-1.87-3.27-.68 1.2-1.34 2.32-1.98 3.41-.62 1.06-1.21 2.07-1.8 3.12Z" fill="#098BCB"/></svg></span>

          <svg class="chev" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="m4 10 4-4 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

          <button class="ad-item" data-sec="approvals"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2.5 6.5V13a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V6.5M1.75 3.5l1-1.75h10.5l1 1.75v1a2 2 0 0 1-4 0 2 2 0 0 1-4.25 0 2 2 0 0 1-4.25 0v-1Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M6.5 14v-3.5h3V14" stroke="currentColor" stroke-width="1.3"/></svg>Marketplace<span class="n" id="adApprN"></span></button>
