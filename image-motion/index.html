<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ImageMotion — Playground</title>
  <meta name="description" content="Layout editor and control panel for the ImageMotion image choreography library." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Manrope:wght@200..800&family=Space+Grotesk:wght@300..700&family=Syne:wght@400..800&family=Sora:wght@100..800&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=DM+Serif+Display:ital@0;1&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="image-motion.css" />
  <style>
    :root {
      --ui-bg: #0f1013; --ui-panel: #16181d; --ui-line: #262a33; --ui-line-2: #313743;
      --ui-text: #e8eaf0; --ui-muted: #8b93a5; --ui-accent: #ff3ea5; --ui-accent-2: #7c5cff;
      --ui-radius: 10px; --panel-w: 352px;
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--ui-bg); color: var(--ui-text); display: grid; grid-template-columns: 1fr var(--panel-w); overflow: hidden; }
    body.panel-hidden { grid-template-columns: 1fr 0; }
    body.panel-hidden aside { display: none; }

    /* ── canvas ─────────────────────────────────────────── */
    main { position: relative; min-width: 0; }
    .topbar {
      position: absolute; left: 16px; top: 14px; z-index: 20; display: flex; align-items: center; gap: 8px;
      padding: 6px 8px 6px 12px; background: rgba(15, 16, 19, .72); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.08); border-radius: 999px;
      font-size: 12px; color: #cfd4de;
    }
    .topbar strong { font-weight: 700; letter-spacing: -.01em; color: #fff; margin-right: 6px; }
    .topbar button { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08); color: #e8eaf0; border-radius: 999px; padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer; }
    .topbar button:hover { background: rgba(255,255,255,.14); }
    .topbar kbd { font: 10px ui-monospace, Menlo, monospace; color: var(--ui-muted); margin-left: 4px; }

    .hero { position: absolute; inset: 0; overflow: hidden; background: var(--page-bg, #050507); color: var(--page-fg, #fff); transition: background .4s ease, color .4s ease; }
    #motion.motion-box { position: absolute; }
    #motion.motion-box.is-selectable { cursor: move; }
    .hero .im-ticker { --im-accent: var(--ui-accent); }

    .layer { position: absolute; margin: 0; white-space: pre-wrap; cursor: move; user-select: none; z-index: 2; outline: 1px dashed transparent; outline-offset: 6px; transition: outline-color .15s; }
    .layer:hover { outline-color: rgba(255, 62, 165, .5); }
    .layer.is-editing { cursor: text; user-select: text; outline-color: var(--ui-accent); }
    .layer[data-hidden] { display: none; }
    .layer--button { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; white-space: nowrap; }
    .layer--auto { width: max-content; max-width: 100%; }

    .guides, .zones { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
    .guide { position: absolute; background: var(--ui-accent); box-shadow: 0 0 0 1px rgba(255, 62, 165, .18); }
    .guide.v { top: 0; bottom: 0; width: 1px; }
    .guide.h { left: 0; right: 0; height: 1px; }
    .zone { position: absolute; border: 1px dashed rgba(255, 62, 165, .55); background: rgba(255, 62, 165, .06); border-radius: 4px; }
    .zones[hidden] { display: none; }
    .readout { position: absolute; z-index: 8; pointer-events: none; background: #111318; color: #fff; font: 10.5px/1 ui-monospace, Menlo, monospace; padding: 5px 7px; border-radius: 5px; white-space: nowrap; border: 1px solid rgba(255,255,255,.1); }
    .readout[hidden] { display: none; }

    .frame { position: absolute; z-index: 7; pointer-events: none; outline: 1.5px solid var(--ui-accent); }
    .frame[hidden] { display: none; }
    .frame__label { position: absolute; left: -1.5px; bottom: 100%; margin-bottom: 4px; background: var(--ui-accent); color: #fff; font: 600 10px/1 'Inter', system-ui, sans-serif; padding: 5px 7px; border-radius: 4px; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
    .handle { position: absolute; width: 10px; height: 10px; background: #fff; border: 1.5px solid var(--ui-accent); border-radius: 2px; pointer-events: auto; }
    .handle[data-dir="n"]  { top: -5px; left: 50%; margin-left: -5px; cursor: ns-resize; }
    .handle[data-dir="s"]  { bottom: -5px; left: 50%; margin-left: -5px; cursor: ns-resize; }
    .handle[data-dir="e"]  { right: -5px; top: 50%; margin-top: -5px; cursor: ew-resize; }
    .handle[data-dir="w"]  { left: -5px; top: 50%; margin-top: -5px; cursor: ew-resize; }
    .handle[data-dir="ne"] { top: -5px; right: -5px; cursor: nesw-resize; }
    .handle[data-dir="nw"] { top: -5px; left: -5px; cursor: nwse-resize; }
    .handle[data-dir="se"] { bottom: -5px; right: -5px; cursor: nwse-resize; }
    .handle[data-dir="sw"] { bottom: -5px; left: -5px; cursor: nesw-resize; }
    .frame[data-kind="motion"] .handle { width: 12px; height: 12px; }
    .frame[data-kind="motion"] .handle[data-dir="n"]  { top: 3px; }    .frame[data-kind="motion"] .handle[data-dir="s"]  { bottom: 3px; }
    .frame[data-kind="motion"] .handle[data-dir="e"]  { right: 3px; }  .frame[data-kind="motion"] .handle[data-dir="w"]  { left: 3px; }
    .frame[data-kind="motion"] .handle[data-dir="ne"] { top: 3px; right: 3px; }   .frame[data-kind="motion"] .handle[data-dir="nw"] { top: 3px; left: 3px; }
    .frame[data-kind="motion"] .handle[data-dir="se"] { bottom: 3px; right: 3px; } .frame[data-kind="motion"] .handle[data-dir="sw"] { bottom: 3px; left: 3px; }
    .frame[data-kind="motion"] .frame__label { bottom: auto; top: 6px; left: 22px; margin: 0; border-radius: 4px; }
    .frame[data-kind="text"] .handle:not([data-dir="e"]):not([data-dir="w"]) { display: none; }
    .frame[data-kind="button"] .handle { display: none; }

    /* ── panel ─────────────────────────────────────────── */
    aside { background: var(--ui-panel); border-left: 1px solid var(--ui-line); overflow-y: auto; overflow-x: hidden; font-size: 12.5px; scrollbar-width: thin; scrollbar-color: #2b3038 transparent; }
    .panel__head { position: sticky; top: 0; z-index: 2; background: var(--ui-panel); border-bottom: 1px solid var(--ui-line); padding: 14px 16px 12px; }
    .panel__head h1 { font-size: 14px; margin: 0 0 2px; letter-spacing: -.01em; }
    .panel__head p { margin: 0; color: var(--ui-muted); font-size: 11.5px; }
    details.sec { border-bottom: 1px solid var(--ui-line); }
    details.sec > summary { list-style: none; cursor: pointer; padding: 12px 16px; font-weight: 600; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: #c6ccd8; display: flex; justify-content: space-between; align-items: center; user-select: none; }
    details.sec > summary::-webkit-details-marker { display: none; }
    details.sec > summary::after { content: '+'; color: var(--ui-muted); font-weight: 500; font-size: 14px; }
    details.sec[open] > summary::after { content: '–'; }
    details.sec > summary:hover { background: rgba(255,255,255,.02); }
    .sec__body { padding: 2px 16px 14px; display: grid; gap: 10px; }
    .field { display: grid; gap: 6px; }
    .field__row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .field label { color: #c9cfda; font-weight: 500; }
    .field .val { font: 11px ui-monospace, Menlo, monospace; color: var(--ui-muted); background: #0f1115; padding: 2px 6px; border-radius: 5px; min-width: 42px; text-align: right; }
    .hint { color: var(--ui-muted); font-size: 11px; margin-top: -2px; }
    input[type=range] { width: 100%; height: 22px; margin: 0; -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; }
    input[type=range]::-webkit-slider-runnable-track { height: 3px; background: var(--ui-line-2); border-radius: 2px; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid var(--ui-accent); margin-top: -5.5px; }
    input[type=range]::-moz-range-track { height: 3px; background: var(--ui-line-2); border-radius: 2px; }
    input[type=range]::-moz-range-thumb { width: 8px; height: 8px; border-radius: 50%; background: #fff; border: 3px solid var(--ui-accent); }
    select, input[type=text], textarea, input[type=number] { width: 100%; background: #0f1115; color: var(--ui-text); border: 1px solid var(--ui-line-2); border-radius: 7px; padding: 7px 9px; font: inherit; font-size: 12.5px; }
    textarea { min-height: 64px; resize: vertical; font-family: inherit; font-size: 12.5px; line-height: 1.45; }
    textarea.mono { font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
    select:focus, input:focus, textarea:focus { outline: none; border-color: var(--ui-accent); }
    .switch { position: relative; width: 34px; height: 20px; background: var(--ui-line-2); border-radius: 999px; cursor: pointer; transition: background .2s; flex: none; }
    .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .2s; }
    .switch.on { background: var(--ui-accent); }
    .switch.on::after { transform: translateX(14px); }
    .color { display: flex; align-items: center; gap: 8px; }
    .color input[type=color] { width: 30px; height: 26px; padding: 0; border: 1px solid var(--ui-line-2); border-radius: 6px; background: transparent; cursor: pointer; }
    .color input[type=text] { flex: 1; }
    .chips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .chips button, .seg button, .anchor button, .quick button { text-align: left; background: #0f1115; border: 1px solid var(--ui-line-2); color: #d5dae4; border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 12px; cursor: pointer; line-height: 1.2; }
    .chips button:hover, .seg button:hover, .anchor button:hover, .quick button:hover { border-color: #4a5160; }
    .chips button.on, .seg button.on { border-color: var(--ui-accent); background: rgba(255,62,165,.1); color: #fff; }
    .seg { display: grid; grid-auto-flow: column; gap: 4px; }
    .seg button { text-align: center; padding: 7px 6px; }
    .anchor { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; width: 96px; }
    .anchor button { aspect-ratio: 1; padding: 0; display: grid; place-items: center; }
    .anchor button::after { content: ''; width: 8px; height: 8px; border-radius: 2px; background: #6b7386; }
    .anchor button:hover::after { background: var(--ui-accent); }
    .anchor-row { display: flex; gap: 12px; align-items: flex-start; }
    .anchor-row .quick { display: grid; gap: 4px; flex: 1; }
    .quick button { padding: 6px 9px; }
    .group-label { color: var(--ui-muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; margin-top: 4px; }
    .desc { color: var(--ui-muted); font-size: 11.5px; line-height: 1.45; margin: 0; }
    .btnrow { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn { background: #22262e; border: 1px solid var(--ui-line-2); color: #e8eaf0; border-radius: 7px; padding: 7px 11px; font: inherit; font-size: 12px; cursor: pointer; }
    .btn:hover { background: #2b303a; }
    .btn.primary { background: var(--ui-accent); border-color: var(--ui-accent); color: #fff; }
    .btn.primary:hover { filter: brightness(1.08); }
    .btn.danger { color: #ff8a8a; }
    .layers { display: grid; gap: 4px; }
    .layer-row { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border: 1px solid var(--ui-line-2); border-radius: 8px; background: #0f1115; cursor: pointer; }
    .layer-row:hover { border-color: #4a5160; }
    .layer-row.on { border-color: var(--ui-accent); background: rgba(255,62,165,.08); }
    .layer-row .glyph { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 5px; background: #1c2029; color: #c9cfda; font: 700 10px/1 'Inter', system-ui, sans-serif; flex: none; }
    .layer-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #e3e7ef; }
    .layer-row .icon { background: none; border: 0; color: var(--ui-muted); cursor: pointer; padding: 2px 4px; font-size: 13px; line-height: 1; }
    .layer-row .icon:hover { color: #fff; }
    .layer-row .icon.off { opacity: .35; }
    pre.code { margin: 0; background: #0a0b0e; border: 1px solid var(--ui-line); border-radius: 8px; padding: 10px; font: 10.5px/1.5 ui-monospace, Menlo, monospace; color: #b8c2d4; overflow: auto; max-height: 260px; white-space: pre; }
    .toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 10px); background: #fff; color: #000; padding: 8px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 50; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 860px) {
      body { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      aside { max-height: 46vh; border-left: 0; border-top: 1px solid var(--ui-line); }
      body.panel-hidden { grid-template-rows: 1fr 0; }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero" id="canvas">
      <div class="motion-box is-selectable" id="motion"></div>
      <div class="zones" id="zones" hidden></div>
      <div class="guides" id="guides"></div>
      <div class="frame" id="frame" hidden>
        <div class="frame__label" id="frameLabel">Layer</div>
        <div class="handle" data-dir="nw"></div><div class="handle" data-dir="n"></div><div class="handle" data-dir="ne"></div>
        <div class="handle" data-dir="w"></div><div class="handle" data-dir="e"></div>
        <div class="handle" data-dir="sw"></div><div class="handle" data-dir="s"></div><div class="handle" data-dir="se"></div>
      </div>
      <div class="readout" id="readout" hidden></div>
    </section>
    <div class="topbar">
      <strong>ImageMotion</strong>
      <button id="btnPlay" title="Play / pause (space)">Pause <kbd>␣</kbd></button>
      <button id="btnRestart" title="Restart timeline">Restart <kbd>R</kbd></button>
      <button id="btnPanel" title="Toggle panel (H)">Panel <kbd>H</kbd></button>
      <button id="btnFull" title="Fullscreen (F)">Full <kbd>F</kbd></button>
    </div>
  </main>

  <aside id="panel">
    <div class="panel__head">
      <h1>Control panel</h1>
      <p>Drag anything on the canvas. Pink lines snap to centres and edges. Double-click text to edit in place. Everything is saved to the URL.</p>
    </div>
    <div id="sections"></div>
  </aside>
  <div class="toast" id="toast"></div>

  <script src="image-motion.js"></script>
  <script>
    /* ═══════════════════════ data ═══════════════════════ */
    /* Bundled portrait set. Photographer credits live in images/CREDITS.md. */
    const PEOPLE = [
      ['portrait-01', 'Unattributed'], ['portrait-02', 'Good Faces'], ['portrait-03', 'Brendan Franks'],
      ['portrait-04', 'Davide Aracri'], ['portrait-05', 'Ethan Haddox'], ['portrait-06', 'Jonathan Cosens'],
      ['portrait-07', 'Jorge Salvador'], ['portrait-08', 'M. Brauer'], ['portrait-09', 'Rainer Bleek'],
      ['portrait-10', 'Siavosh Hosseini'], ['portrait-11', 'Sophie Paterson'], ['portrait-12', 'Vicky Hladynets'],
    ];
    const people = () => PEOPLE.map(([file, credit]) => ({ src: `images/${file}.jpg`, alt: 'Portrait', label: credit }));

    const FONTS = [
      { name: 'Inter', css: "'Inter', system-ui, sans-serif", q: 'Inter:wght@100..900' },
      { name: 'Manrope', css: "'Manrope', system-ui, sans-serif", q: 'Manrope:wght@200..800' },
      { name: 'Space Grotesk', css: "'Space Grotesk', system-ui, sans-serif", q: 'Space+Grotesk:wght@300..700' },
      { name: 'Syne', css: "'Syne', system-ui, sans-serif", q: 'Syne:wght@400..800' },
      { name: 'Sora', css: "'Sora', system-ui, sans-serif", q: 'Sora:wght@100..800' },
      { name: 'Bricolage Grotesque', css: "'Bricolage Grotesque', system-ui, sans-serif", q: 'Bricolage+Grotesque:opsz,wght@12..96,200..800' },
      { name: 'Playfair Display', css: "'Playfair Display', Georgia, serif", q: 'Playfair+Display:ital,wght@0,400..900;1,400..900' },
      { name: 'Fraunces', css: "'Fraunces', Georgia, serif", q: 'Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900' },
      { name: 'DM Serif Display', css: "'DM Serif Display', Georgia, serif", q: 'DM+Serif+Display:ital@0;1' },
      { name: 'Instrument Serif', css: "'Instrument Serif', Georgia, serif", q: 'Instrument+Serif:ital@0;1' },
      { name: 'JetBrains Mono', css: "'JetBrains Mono', ui-monospace, monospace", q: 'JetBrains+Mono:wght@100..800' },
      { name: 'System sans', css: "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" },
      { name: 'System serif', css: "Georgia, 'Times New Roman', serif" },
    ];
    const fontCss = (name) => (FONTS.find((f) => f.name === name) || FONTS[0]).css;

    /* ═══════════════════════ layers ═══════════════════════ */
    let uid = 1;
    const ROLE = {
      eyebrow: { size: 12, weight: 600, spacing: 0.18, lineHeight: 1.4, transform: 'uppercase', opacity: .7, auto: true },
      heading: { size: 64, weight: 800, spacing: -0.035, lineHeight: 1.0, transform: 'none', opacity: 1, auto: false },
      text:    { size: 18, weight: 400, spacing: 0, lineHeight: 1.5, transform: 'none', opacity: .78, auto: false },
      button:  { kind: 'button', size: 14, weight: 600, spacing: 0, lineHeight: 1, transform: 'none', opacity: 1, auto: true, radius: 999, padX: 22, padY: 12 },
    };
    function mkLayer(role, o = {}) {
      return {
        id: 'L' + (uid++), kind: 'text', role, text: 'New text', x: 20, y: 40, w: 60, align: 'center', font: 'Inter', italic: false,
        color: '', bg: '', fgColor: '', visible: true, ...ROLE[role], ...o,
      };
    }
    /** A stacked block of copy. y values get resolved by stackGroup() once the text is measured. */
    function copyBlock({ x = 20, w = 60, align = 'center', centerY = 50, font = 'Inter', items = [] }) {
      const layers = items.map((it) => mkLayer(it.role, { x, w: it.role === 'text' ? Math.max(20, w * 0.8) : w, align, font, ...it, role: it.role }));
      return { layers, stack: { ids: layers.map((l) => l.id), x, w, align, centerY } };
    }

    /* ═══════════════════════ presets ═══════════════════════ */
    const PRESETS = {
      'stepping-up':   { label: 'Stepping up (video 1)', page: { bg: '#050507', fg: '#ffffff' }, motion: { x: 0, y: 0, w: 100, h: 100 }, im: { mode: 'stack', count: 8, cardWidth: 150, cardHeight: 178, radius: 16, depthBlur: 0, parallax: .25, params: { groups: 2, period: 1.5, tilt: 28, gap: .46, lift: 1, spread: .24 } }, copy: { items: [{ role: 'eyebrow', text: 'We are' }, { role: 'heading', text: 'stepping up' }] } },
      'level-up':      { label: 'Level up ring (video 1)', page: { bg: '#050507', fg: '#ffffff' }, motion: { x: 0, y: 0, w: 100, h: 100 }, im: { mode: 'burst', count: 14, cardWidth: 120, cardHeight: 150, params: { radius: .36, period: 7, force: 2.6, spin: 1.2 } }, copy: { items: [{ role: 'eyebrow', text: 'So you can' }, { role: 'heading', text: 'level up' }] } },
      'expand':        { label: 'Expand your reach (video 1)', page: { bg: '#2a0709', fg: '#ffffff' }, motion: { x: 0, y: 0, w: 100, h: 100 }, im: { mode: 'converge', count: 12, cardWidth: 140, cardHeight: 170, params: { period: 9, cluster: .1, hold: .45, stagger: .7 } }, copy: { w: 50, x: 25, items: [{ role: 'heading', text: 'EXPAND\nYOUR REACH', size: 60, spacing: -.02 }] } },
      'endless-tools': { label: 'Endless tools ticker (video 1)', page: { bg: '#050507', fg: '#ffffff' }, motion: { x: 0, y: 0, w: 100, h: 100 }, im: { mode: 'ticker', count: 12, cardWidth: 150, cardHeight: 180, radius: 10, params: { period: 1, rowHeight: 40, side: 1, offset: .2, thumb: .8 } }, copy: { items: [{ role: 'heading', text: 'and endless tools', size: 44 }] } },
