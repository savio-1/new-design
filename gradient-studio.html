<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gradient Studio</title>
<meta name="description" content="Design animated gradient-map backgrounds (15 motion types), layer text and images with alignment guides and cropping, add textures and shape masks, and export seamless GIF or MP4 loops up to 4K." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.1/build/mp4-muxer.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/webm-muxer@5.1.3/build/webm-muxer.js" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#0b0c10; --panel:#12131a; --panel-2:#191a23; --panel-3:#20212c; --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.13);
  --text:#e9eaf0; --muted:#8e93a3; --faint:#5d6272;
  --accent:#8b7cff; --accent-2:#ff7ac6; --ok:#4cd6a0; --warn:#ffb454; --danger:#ff5e7a;
  --r:10px; --r-sm:7px;
  --left:272px; --right:336px;
  --font:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.10);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.18);background-clip:padding-box;border:2px solid transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:var(--left) 1fr var(--right);grid-template-rows:52px 1fr;height:100vh}
.top{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em}
.brand .logo{width:22px;height:22px;border-radius:6px;background:conic-gradient(from 200deg,#39d3ee,#c9f25c,#ff5b7f,#f0611a,#8b7cff,#39d3ee);box-shadow:0 0 0 1px rgba(255,255,255,.12) inset}
.brand .pn{color:var(--muted);font-weight:500;margin-left:4px}
.top .mid{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;min-width:0}
.top .mid .scrub{width:min(360px,30vw);display:flex;align-items:center}
.top .mono{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.pane{background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0}
.pane.left{border-right:1px solid var(--line)}
.pane.right{border-left:1px solid var(--line)}
.pane .head{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;font-weight:600;font-size:13px}
.pane .head .sp{flex:1}
.pane .scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 14px 16px}
.stage{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:
  radial-gradient(circle at 1px 1px, rgba(255,255,255,.05) 1px, transparent 1.5px) 0 0/22px 22px, var(--bg)}
.stage .wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 28px 84px;min-height:0}
.frame{position:relative;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);background:transparent;touch-action:none}
.frame canvas{display:block;width:100%;height:100%}
#gl{position:absolute;inset:0;visibility:hidden}
#out{position:relative}
.float{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px;border-radius:14px;background:rgba(18,19,26,.85);border:1px solid var(--line-2);backdrop-filter:blur(14px);box-shadow:0 20px 50px rgba(0,0,0,.45)}
.float .sep{width:1px;height:22px;background:var(--line-2);margin:0 2px}
.float select{height:30px;width:auto;background:var(--panel-3);border-color:transparent}
.stage .status{position:absolute;left:18px;top:14px;font-family:var(--mono);font-size:11px;color:var(--faint);pointer-events:none}
.stage .status b{color:var(--muted);font-weight:500}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--panel-2);color:var(--text);font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--panel-3);border-color:rgba(255,255,255,.22)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:#fff;border-color:transparent;color:#0b0c10}
.btn.primary:hover{background:#e9eaf0}
.btn.accent{background:linear-gradient(135deg,var(--accent),#6e5cff);border-color:transparent;color:#fff}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn.xs{height:22px;padding:0 7px;font-size:11px;border-radius:5px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:rgba(255,255,255,.06);color:var(--text)}
.btn.danger:hover{border-color:var(--danger);color:var(--danger)}
.btn svg{width:15px;height:15px;flex:none}
.btn:disabled{opacity:.45;cursor:default}
.btn.on{background:rgba(139,124,255,.18);border-color:rgba(139,124,255,.6);color:#fff}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:2px;gap:2px}
.seg button{height:24px;padding:0 10px;border:0;background:transparent;border-radius:5px;color:var(--muted);font-size:12px;font-weight:500;white-space:nowrap}
.seg button.on{background:rgba(255,255,255,.10);color:var(--text)}
.seg.fill{display:flex}.seg.fill button{flex:1}

/* ---------- groups (inspector) ---------- */
.grp{border-top:1px solid var(--line)}
.grp:first-child{border-top:0}
.grp>header{display:flex;align-items:center;gap:8px;height:40px;cursor:pointer;user-select:none;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.grp>header:hover{color:var(--text)}
.grp>header .chev{width:14px;height:14px;transition:transform .18s;color:var(--faint);transform:rotate(-90deg)}
.grp.open>header .chev{transform:rotate(0)}
.grp>header .badge{margin-left:auto;font-size:10.5px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--faint)}
.grp>.body{display:none;padding:2px 0 14px}
.grp.open>.body{display:block}
.row{display:flex;align-items:center;gap:8px;margin-top:8px}
.row>label:not(.toggle){width:88px;flex:none;color:var(--muted);font-size:12px}
.row .grow{flex:1;min-width:0}
.hint{color:var(--faint);font-size:11.5px;margin-top:8px;line-height:1.45}
.sub{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:14px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}

/* slider: label | filled track with value inside (reference style) */
.ctl{display:grid;grid-template-columns:88px 1fr;gap:10px;align-items:center;height:30px;margin-top:4px}
.ctl .lab{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default}
.ctl .lab:hover{color:var(--text)}
.ctl .sl{position:relative;height:26px;border-radius:13px;background:var(--panel-3);overflow:hidden}
.ctl .sl .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#3a3550,#514a78);border-radius:13px;min-width:44px;display:flex;align-items:center;justify-content:flex-end;padding-right:9px;font-family:var(--mono);font-size:11px;color:#fff;pointer-events:none;white-space:nowrap}
.ctl .sl input[type=range]{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize}
.ctl .sl .edit{position:absolute;left:0;top:0;bottom:0;width:100%;border:0;background:var(--panel-3);color:#fff;font-family:var(--mono);font-size:11.5px;padding:0 10px;outline:2px solid var(--accent);outline-offset:-2px;border-radius:13px;display:none}
.ctl.editing .sl .edit{display:block}
.ctl.editing .sl .fill,.ctl.editing .sl input[type=range]{visibility:hidden}
.ctl:hover .sl{background:#262735}
.ctl .sl:focus-within{box-shadow:0 0 0 2px rgba(139,124,255,.4)}
/* generic range (scrub) */
input[type=range].plain{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0}
input[type=range].plain::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:rgba(255,255,255,.14)}
input[type=range].plain::-moz-range-track{height:4px;border-radius:4px;background:rgba(255,255,255,.14)}
input[type=range].plain::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;margin-top:-4px;border:0}
input[type=range].plain::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:0}

select,.input,textarea{width:100%;height:30px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:0 9px;color:var(--text);outline:none}
select:focus,.input:focus,textarea:focus{border-color:var(--accent)}
select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%238e93a3' stroke-width='1.5'/></svg>");background-repeat:no-repeat;background-position:right 9px center;padding-right:24px}
textarea{height:auto;min-height:64px;padding:7px 9px;resize:vertical;line-height:1.4}
.input.sm{height:26px;padding:0 7px;font-size:12px}
.color{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 4px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm)}
.color input[type=color]{-webkit-appearance:none;appearance:none;width:22px;height:22px;border:0;padding:0;background:none;border-radius:5px;overflow:hidden;cursor:pointer}
.color input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.color input[type=color]::-webkit-color-swatch{border:0;border-radius:5px}
.color input[type=color]::-moz-color-swatch{border:0;border-radius:5px}
.color .hex{width:66px;background:transparent;border:0;font-family:var(--mono);font-size:11.5px;outline:none}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--muted);font-size:12px;user-select:none;white-space:nowrap}
.toggle input{display:none}
.toggle .sw{width:30px;height:17px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;transition:background .15s;flex:none}
.toggle .sw::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle input:checked+.sw{background:var(--accent)}
.toggle input:checked+.sw::after{transform:translateX(13px)}

/* chips */
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.chips.c4{grid-template-columns:repeat(4,1fr)}
.chip{height:28px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel-2);color:var(--muted);font-size:12px;font-weight:500;padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:all .12s}
.chip:hover{border-color:var(--line-2);color:var(--text)}
.chip.on{background:rgba(139,124,255,.18);border-color:rgba(139,124,255,.6);color:#fff}

/* ---------- left pane: looks ---------- */
.lk-sec{margin-top:6px}
.lk-sec>header{display:flex;align-items:center;gap:6px;height:36px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;cursor:pointer;user-select:none}
.lk-sec>header .chev{width:14px;height:14px;color:var(--faint);transform:rotate(-90deg);transition:transform .18s}
.lk-sec.open>header .chev{transform:rotate(0)}
.lk-sec>.body{display:none;padding-bottom:10px}
.lk-sec.open>.body{display:block}
.circles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 8px;padding:4px 2px}
.circle{width:50px;height:50px;border-radius:50%;border:0;padding:0;cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.08);transition:transform .12s,box-shadow .12s;justify-self:center}
.circle:hover{transform:scale(1.06)}
.circle.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px #fff}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 8px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);transition:all .12s}
.tile .th{width:44px;height:30px;border-radius:6px;background:#222;opacity:.9}
.tile .nm{font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile:hover{border-color:var(--line-2);color:var(--text)}
.tile.on{border-color:#fff;color:#fff;box-shadow:0 0 0 1px #fff}
.starters{display:flex;flex-direction:column;gap:4px}
.starter{display:flex;align-items:center;gap:9px;height:32px;padding:0 8px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);text-align:left}
.starter .sw{width:26px;height:18px;border-radius:5px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.1)}
.starter .nm{flex:1;font-size:12px;font-weight:500;color:var(--text)}
.starter .ty{font-size:10.5px;color:var(--faint)}
.starter:hover{background:var(--panel-2)}
.starter.on{background:rgba(139,124,255,.14);border-color:rgba(139,124,255,.5)}

/* ---------- right pane: layers + inspector ---------- */
.layers{display:flex;flex-direction:column;gap:3px;margin:0 0 6px}
.layer{display:flex;align-items:center;gap:8px;height:34px;padding:0 6px 0 8px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted)}
.layer:hover{background:var(--panel-2)}
.layer.on{background:rgba(139,124,255,.14);border-color:rgba(139,124,255,.5);color:var(--text)}
.layer .ic{width:22px;height:22px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:var(--panel-3);font-size:11px;font-weight:700;flex:none;color:var(--text)}
.layer .ic.img{background-size:cover;background-position:center}
.layer .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--text)}
.layer .t small{color:var(--faint);margin-left:5px;font-size:10.5px}
.layer .ib{width:22px;height:22px;border:0;background:transparent;color:var(--faint);border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.layer .ib:hover{background:rgba(255,255,255,.08);color:var(--text)}
.layer .ib.off{opacity:.35}
.layer.hidden .t{opacity:.45}
.addrow{display:flex;gap:6px;margin:4px 0 10px}
.addrow .btn{flex:1;justify-content:center}
.dropzone{border:1.5px dashed var(--line-2);border-radius:10px;padding:14px;text-align:center;color:var(--faint);font-size:12px;margin-top:8px;transition:all .15s}
.dropzone.over{border-color:var(--accent);color:var(--text);background:rgba(139,124,255,.08)}
.imginfo{display:flex;gap:10px;align-items:center;margin-top:8px}
.imginfo .thumb{width:64px;height:64px;border-radius:8px;background:var(--panel-3) center/cover no-repeat;flex:none;box-shadow:0 0 0 1px var(--line-2)}
.imginfo .meta{flex:1;min-width:0;font-size:12px;color:var(--muted);line-height:1.5}
.imginfo .meta b{display:block;color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alignbar{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px}
.alignbar button{height:28px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.alignbar button:hover{color:var(--text);border-color:var(--line-2)}
.alignbar svg{width:15px;height:15px}

/* palette editor */
.grad{height:26px;border-radius:7px;border:1px solid var(--line-2);margin-top:8px}
.stops{margin-top:6px;display:flex;flex-direction:column;gap:5px}
.stop{display:flex;align-items:center;gap:6px}
.stop .color{height:26px}
.stop input[type=range]{flex:1}
.stop .pos{width:34px;font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right}
.stop .x{width:22px;height:22px;border-radius:5px;border:0;background:transparent;color:var(--faint);display:inline-flex;align-items:center;justify-content:center}
.stop .x:hover{background:rgba(255,94,122,.15);color:var(--danger)}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.swatch{height:24px;border-radius:6px;border:1px solid rgba(255,255,255,.12);padding:0;cursor:pointer;transition:transform .1s}
.swatch:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.4)}
/* ratio grid */
.ratios{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.ratio{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 6px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);transition:all .12s}
.ratio .box{display:inline-flex;align-items:center;justify-content:center;border:1.5px solid currentColor;border-radius:3px;height:22px;width:22px;opacity:.8;font-size:11px}
.ratio .box.custom{border-style:dashed}
.ratio .rn{font-size:11.5px;font-weight:600;color:var(--text);margin-top:2px}
.ratio .rd{font-size:10px;color:var(--faint)}
.ratio:hover{border-color:var(--line-2)}
.ratio.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);color:var(--accent)}
.types-hint{font-size:11.5px;color:var(--faint);margin-top:6px}
.kbd{font-family:var(--mono);font-size:10.5px;background:rgba(255,255,255,.08);border:1px solid var(--line-2);border-radius:4px;padding:0 5px;color:var(--muted)}
.warn{color:var(--warn)}
.empty{padding:22px 10px;text-align:center;color:var(--faint);font-size:12px;line-height:1.5}

/* modal */
.modal{position:fixed;inset:0;background:rgba(5,6,10,.7);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:50}
.modal.open{display:flex}
.dialog{width:520px;max-width:calc(100vw - 32px);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:14px;box-shadow:0 40px 100px rgba(0,0,0,.6)}
.dialog header{display:flex;align-items:center;gap:10px;padding:16px 18px 10px;font-weight:600;font-size:15px}
.dialog header .x{margin-left:auto}
.dialog .content{padding:4px 18px 18px}
.dialog .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:10px}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.est{margin-top:12px;padding:10px 12px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.5}
.est b{color:var(--text);font-weight:500}
.progress{margin-top:14px;display:none}
.progress.on{display:block}
.progress .track{height:6px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
.progress .fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .12s}
.progress .txt{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;font-family:var(--mono)}
.dialog footer{display:flex;gap:8px;justify-content:flex-end;padding:0 18px 18px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#1f2029;border:1px solid var(--line-2);color:var(--text);padding:10px 14px;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:all .25s;z-index:60;font-size:12.5px;max-width:80vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:1180px){:root{--left:220px;--right:300px}.tiles{grid-template-columns:repeat(2,1fr)}.circles{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="logo"></span>Gradient Studio <span class="pn" id="presetName">Base</span></div>
    <div class="mid">
      <div class="seg"><button id="btnPlay" title="Play / pause (Space)">Pause</button><button id="btnRestart" title="Back to start">↺</button></div>

<script>
const FRAG = `#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif

uniform vec2  uRes;        // canvas size in pixels
uniform float uT;          // scalar time (periodic-safe in loop mode)
uniform vec2  uOff;        // noise domain offset (moves on a circle in loop mode)
uniform float uZ;          // noise 3rd dimension
uniform float uFrame;      // frame counter for grain
uniform int   uType;
uniform float uScale;
uniform int   uOct;
uniform float uWarp;
uniform float uContrast;
uniform float uSoft;
uniform float uSteps;
uniform float uAngle;
uniform float uSeed;
uniform vec2  uFlow;
uniform float uFlowT;      // flow displacement (sways in loop mode)
// palette
uniform vec3  uCols[8];
uniform float uPos[8];
uniform int   uCount;
uniform int   uPalMode;    // 0 smooth, 1 linear, 2 hard
uniform int   uSpace;      // 0 srgb, 1 oklab
uniform float uRepeat;
uniform float uPalOff;
uniform int   uMirror;
// post
uniform float uSat;
uniform float uBright;
uniform float uHue;
uniform float uVignette;
// texture
uniform int   uTex;
uniform float uTexAmt;
uniform float uTexScale;
// shape
uniform int   uShape;
uniform float uShapeSize;
uniform float uShapeSoft;
uniform float uShapeRound;
uniform vec3  uBg;

vec2 gOff; // noise offset = time drift + seed

#define PI 3.14159265359
#define TAU 6.28318530718

/* ---------- simplex noise (Ashima / Stefan Gustavson, MIT) ---------- */
vec3 mod289(vec3 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 mod289(vec4 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 permute(vec4 x){ return mod289(((x*34.0)+1.0)*x); }
vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }
float snoise(vec3 v){
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i  = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(
            i.z + vec4(0.0, i1.z, i2.z, 1.0))
          + i.y + vec4(0.0, i1.y, i2.y, 1.0))
          + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0) * 2.0 + 1.0;
  vec4 s1 = floor(b1) * 2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}

float fbm(vec3 p){
  float a = 0.5, s = 0.0, n = 0.0;
  for (int i = 0; i < 8; i++){
    if (i >= uOct) break;
    s += a * snoise(p); n += a;
    p = p * 2.02 + vec3(13.1, 7.7, 3.3); a *= 0.5;
  }
  return s / max(n, 1e-4);
}
float turb(vec3 p){
  float a = 0.5, s = 0.0, n = 0.0;
  for (int i = 0; i < 8; i++){
    if (i >= uOct) break;
    s += a * abs(snoise(p)); n += a;
    p = p * 2.02 + vec3(13.1, 7.7, 3.3); a *= 0.5;
  }
  return s / max(n, 1e-4);
}
vec2 hash2(vec2 p){
  vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.xx + p3.yz) * p3.zy);
}
float hash1(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

// Worley F1 with animated cell points (periodic in uT)
float worley(vec2 q){
  vec2 ip = floor(q), fp = fract(q);
  float d = 8.0;
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++){
    vec2 g = vec2(float(x), float(y));
    vec2 h = hash2(ip + g + uSeed);
    vec2 o = 0.5 + 0.4 * sin(uT + TAU * h);
    vec2 r = g + o - fp;
    d = min(d, dot(r, r));
  }
  return sqrt(d);
}

/* ---------- field functions, all return roughly 0..1 ---------- */
float fieldClouds(vec2 q){
  vec2 w = vec2(fbm(vec3(q + gOff, uZ)), fbm(vec3(q + gOff + vec2(5.2, 1.3), uZ + 2.0)));
  return fbm(vec3(q + uWarp * w * 1.5 + gOff * 0.5, uZ * 0.7)) * 0.5 + 0.5;
}
float fieldBlobs(vec2 q){
  q *= 0.55;
  float w = snoise(vec3(q * 0.8 + gOff * 0.5, uZ)) * uWarp * 0.6;
  float v = snoise(vec3(q + gOff + w, uZ)) * 0.65
          + snoise(vec3(q * 1.7 - gOff.yx + w, uZ * 1.3 + 3.0)) * 0.35;
  return v * 0.5 + 0.5;
}
float fieldBands(vec2 q){
  q *= 0.7;
  float w = fbm(vec3(q * 0.7 + gOff, uZ));
  float v = snoise(vec3(q.x * 0.9 + w * uWarp * 2.0 + gOff.x, q.y * 0.45 + gOff.y * 0.5 + w * 0.5, uZ * 0.5));
  return v * 0.5 + 0.5;
}
float fieldMarble(vec2 q){
  float n = fbm(vec3(q + gOff, uZ));
  float v = 1.0 - abs(sin(q.x * 1.5 + q.y * 0.4 + n * uWarp * 3.0 + gOff.x));
  return pow(v, 1.6);
}
float fieldLiquid(vec2 q){
  vec2 p = q;
  for (int i = 0; i < 3; i++){
    float fi = float(i);
    p += uWarp * 0.7 * vec2(snoise(vec3(p + gOff, uZ + fi)), snoise(vec3(p.yx - gOff, uZ + fi + 7.0)));
  }
  return fbm(vec3(p, uZ)) * 0.5 + 0.5;
}
float fieldPlasma(vec2 q){
  q += uWarp * 0.4 * vec2(fbm(vec3(q * 0.5 + gOff, uZ)), fbm(vec3(q.yx * 0.5 - gOff, uZ + 4.0)));
  vec2 c = vec2(sin(uT) * 1.5, cos(uT * 2.0) * 1.2);
  float v = sin(q.x * 1.6 + uT) + sin(q.y * 1.4 + uT * 2.0)
          + sin((q.x + q.y) * 1.1 + uT * 3.0) + sin(length(q - c) * 2.4 - uT);
  return v * 0.125 + 0.5;
}
float fieldRipples(vec2 q){
  q += uWarp * 0.3 * vec2(fbm(vec3(q * 0.6 + gOff, uZ)), fbm(vec3(q.yx * 0.6 - gOff, uZ + 4.0)));
  vec2 c1 = vec2(sin(uT), cos(uT)) * 1.6;
  vec2 c2 = vec2(cos(uT * 2.0), sin(uT)) * 1.3 + vec2(0.7, -0.4);
  vec2 c3 = vec2(sin(uT * 3.0 + 1.0), cos(uT * 2.0 + 2.0)) * 1.1 - vec2(0.9, 0.5);
  float v = sin(length(q - c1) * 3.0 - uT * 2.0) + sin(length(q - c2) * 2.6 - uT * 3.0) + sin(length(q - c3) * 3.4 - uT);
  return v / 6.0 + 0.5;
}
float fieldAurora(vec2 q){
  float w = fbm(vec3(q * 0.5 + gOff, uZ));
  vec2 p = vec2(q.x * 0.6 + w * uWarp * 1.5, q.y * 3.5 + gOff.y * 0.4 + sin(q.x * 0.9 + uT) * 0.8);
  float v = fbm(vec3(p + gOff, uZ)) * 0.5 + 0.5;
  float curtain = 0.5 + 0.5 * sin(q.x * 2.2 + w * uWarp * 4.0 + uT);
  return mix(v, v * curtain + 0.25, 0.5);
}
float fieldCells(vec2 q){
  q += uWarp * 0.35 * vec2(fbm(vec3(q * 0.5 + gOff, uZ)), fbm(vec3(q.yx * 0.5 - gOff, uZ + 4.0)));
  float d = worley(q * 0.9 + gOff * 0.3);
  return 1.0 - clamp(d * 1.15, 0.0, 1.0);
}
float fieldMeta(vec2 q){
  float s = 0.0;
  for (int i = 0; i < 6; i++){
    float fi = float(i);
    vec2 c = vec2(sin(uT * (1.0 + mod(fi, 3.0)) + fi * 2.1), cos(uT * (1.0 + mod(fi + 1.0, 2.0)) + fi * 1.3)) * (1.1 + 0.4 * fi / 6.0);
    float r = 0.45 + 0.2 * sin(fi * 1.7 + uSeed);
    vec2 d = q - c;
    s += r * r / (dot(d, d) + 0.02);
  }
  s += uWarp * 0.5 * fbm(vec3(q + gOff, uZ));
  return 1.0 - exp(-s * 0.55);
}
float fieldSmoke(vec2 q){
  vec2 w = vec2(fbm(vec3(q * 0.7 + gOff, uZ)), fbm(vec3(q * 0.7 + gOff + vec2(3.1, 9.2), uZ + 5.0)));
  return turb(vec3(q + uWarp * w * 1.6 + gOff, uZ)) ;
}
float fieldSilk(vec2 q){
  float n = fbm(vec3(q * 0.8 + gOff, uZ)) * uWarp * 2.5;
  float v = 0.0;
  for (int k = 1; k <= 3; k++){
    float fk = float(k);
    v += sin(q.x * fk * 1.1 + q.y * (0.6 - 0.2 * fk) + n * (1.0 + 0.3 * fk) + uT * fk) / fk;
  }
  return v * 0.28 + 0.5;
}
float fieldStripes(vec2 q){
  float n = fbm(vec3(q + gOff, uZ));
  float v = sin(q.x * 3.2 + n * uWarp * 5.0 + uT) * 0.5 + 0.5;
  return v;
}
float fieldKaleido(vec2 q){
  float a = atan(q.y, q.x);
  float r = length(q);
  float seg = TAU / 6.0;
  a = abs(mod(a, seg) - seg * 0.5);
  vec2 p = vec2(cos(a), sin(a)) * r;
  vec2 w = vec2(fbm(vec3(p + gOff, uZ)), fbm(vec3(p.yx - gOff, uZ + 3.0)));
  return fbm(vec3(p * 1.2 + w * uWarp + gOff, uZ)) * 0.5 + 0.5;
}
float fieldLava(vec2 q){
  q += uWarp * 0.4 * vec2(fbm(vec3(q * 0.4 + gOff, uZ)), fbm(vec3(q.yx * 0.4 - gOff, uZ + 4.0)));
  float c = 1.0 - clamp(worley(q * 0.7 + gOff * 0.2) * 1.1, 0.0, 1.0);
  float n = fbm(vec3(q * 1.3 + gOff, uZ)) * 0.5 + 0.5;
  return mix(c, n, 0.45);
}

float field(vec2 q){
  if (uType == 0) return fieldClouds(q);
  if (uType == 1) return fieldBlobs(q);
  if (uType == 2) return fieldBands(q);
  if (uType == 3) return fieldMarble(q);
  if (uType == 4) return fieldLiquid(q);
  if (uType == 5) return fieldPlasma(q);
  if (uType == 6) return fieldRipples(q);
  if (uType == 7) return fieldAurora(q);
  if (uType == 8) return fieldCells(q);
  if (uType == 9) return fieldMeta(q);
  if (uType == 10) return fieldSmoke(q);
  if (uType == 11) return fieldSilk(q);
  if (uType == 12) return fieldStripes(q);
  if (uType == 13) return fieldKaleido(q);
  return fieldLava(q);
}

/* ---------- color ---------- */
vec3 lin2srgb(vec3 c){
  c = clamp(c, 0.0, 1.0);
  return mix(12.92 * c, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c));
}
vec3 oklab2rgb(vec3 c){
  float l_ = c.x + 0.3963377774 * c.y + 0.2158037573 * c.z;
  float m_ = c.x - 0.1055613458 * c.y - 0.0638541728 * c.z;
  float s_ = c.x - 0.0894841775 * c.y - 1.2914855480 * c.z;
  float l = l_ * l_ * l_, m = m_ * m_ * m_, s = s_ * s_ * s_;
  vec3 lin = vec3( 4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
                  -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
                  -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s);
  return lin2srgb(lin);
}
vec3 palette(float t){
  vec3 c = uCols[0];
  for (int i = 1; i < 8; i++){
    if (i >= uCount) break;
    float a = uPos[i - 1], b = uPos[i];
    float f = clamp((t - a) / max(b - a, 1e-4), 0.0, 1.0);
    if (uPalMode == 0) f = smoothstep(0.0, 1.0, f);
    else if (uPalMode == 2) f = step(0.5, f);
    c = mix(c, uCols[i], f);
  }
  return uSpace == 1 ? oklab2rgb(c) : c;
}
vec3 hueRotate(vec3 c, float a){
  const vec3 k = vec3(0.57735);
  float ca = cos(a), sa = sin(a);
  return c * ca + cross(k, c) * sa + k * dot(k, c) * (1.0 - ca);
}

/* ---------- shape masks ---------- */
float sdRoundBox(vec2 p, vec2 b, float r){
  vec2 d = abs(p) - b + r;
  return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0) - r;
}
float shapeMask(vec2 s, float aspect){
  if (uShape == 0) return 1.0;
  float d = 0.0;
  float sz = uShapeSize;
  vec2 ext = vec2(aspect >= 1.0 ? aspect : 1.0, aspect >= 1.0 ? 1.0 : 1.0 / aspect);
  if (uShape == 1) d = length(s) - sz;
  else if (uShape == 2) d = sdRoundBox(s, ext * sz, uShapeRound * min(ext.x, ext.y) * sz);
  else if (uShape == 3) { vec2 a = abs(s / sz); d = (pow(pow(a.x, 4.0) + pow(a.y, 4.0), 0.25) - 1.0) * sz; }
  else if (uShape == 4) { float n = snoise(vec3(s * 1.4 + gOff * 0.3, uZ)); d = length(s) - sz * (1.0 + 0.22 * n); }
  else if (uShape == 5) d = abs(s.x) + abs(s.y) - sz;
  else if (uShape == 6) d = abs(length(s) - sz) - uShapeRound * 0.5 * sz;
  else if (uShape == 7) { float w = sin(s.x * 3.0 + uT) * 0.12 + sin(s.x * 5.0 - uT * 2.0) * 0.05; d = (s.y - (1.0 - sz * 1.4) - w); }
  else if (uShape == 8) { float a = atan(s.y, s.x); float r = length(s); float k = 0.5 + 0.5 * cos(a * 5.0); d = r - sz * (0.72 + 0.32 * k); }
  float soft = uShapeSoft * 0.25 + 1.5 / uRes.y;
  return 1.0 - smoothstep(-soft, soft, d);
}

/* ---------- textures ---------- */
vec3 applyTexture(vec3 col, vec2 pix, vec2 uv){
  if (uTex == 0 || uTexAmt <= 0.0) return col;
  float amt = uTexAmt;
  float sc = max(uTexScale, 0.05);
  if (uTex == 1) {            // film grain (animated)
    float g = hash1(pix * 0.37 + fract(uFrame * 0.618) * 100.0 + vec2(uFrame * 0.13, uFrame * 0.71));
    col += (g - 0.5) * amt * 0.5;
  } else if (uTex == 2) {     // halftone
    float cell = 9.0 * sc;
    vec2 p = mat2(0.7071, 0.7071, -0.7071, 0.7071) * pix;
    vec2 f = fract(p / cell) - 0.5;
    float lum = dot(col, vec3(0.299, 0.587, 0.114));
    float r = 0.65 * (1.0 - lum);
    float dots = 1.0 - smoothstep(r - 0.08, r + 0.08, length(f));
    col = mix(col, col * (1.0 - dots * 0.6), amt);
  } else if (uTex == 3) {     // scanlines
    float l = 0.5 + 0.5 * sin(pix.y * PI / (2.0 * sc));
    col *= 1.0 - amt * 0.45 * l;

    const b = boxes.find(t => t.layer === d.l);
    const nx = d.ox / 100 * curW + dx, ny = d.oy / 100 * curH + dy;
    const s = b ? snapMove(d.l, b, nx, ny, curW, curH, e.altKey) : { x: nx, y: ny, guides: null };
    d.l.x = +(s.x / curW * 100).toFixed(2); d.l.y = +(s.y / curH * 100).toFixed(2);
    dragGuides = s.guides;
    syncSliders();
  });
  const end = () => { if (dragState) { dragState = null; dragGuides = null; outCanvas.style.cursor = 'default'; persist(); refreshAll(); } };
  outCanvas.addEventListener('pointerup', end); outCanvas.addEventListener('pointercancel', end);
  outCanvas.addEventListener('dblclick', e => { const l = hitLayer(toCanvasPt(e)); if (l && l.kind === 'text') { const ta = propsEl.querySelector('textarea'); if (ta) { ta.focus(); ta.select(); } } });
  // drop images onto the canvas
  frame.addEventListener('dragover', e => { e.preventDefault(); frame.style.outline = '2px dashed var(--accent)'; });
  frame.addEventListener('dragleave', () => frame.style.outline = '');
  frame.addEventListener('drop', e => { e.preventDefault(); frame.style.outline = ''; const p = toCanvasPt(e); addImageFiles([...e.dataTransfer.files], { x: +(p.x / curW * 100).toFixed(1), y: +(p.y / curH * 100).toFixed(1) }); });
  window.addEventListener('paste', e => { const files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith('image/')); if (files.length) { e.preventDefault(); addImageFiles(files); } });
  window.addEventListener('resize', fitPreview);
  new ResizeObserver(fitPreview).observe($('#wrap'));
}
function syncSliders() { rerenderers.forEach(fn => fn.name === 'sync' && fn()); }

/* ======================================================================
   Top bar, floating bar, keyboard
   ====================================================================== */
function setPlay(v) { playing = v; $('#btnPlay').textContent = playing ? 'Pause' : 'Play'; $('#btnPlay').classList.toggle('on', playing); last = performance.now(); }
function bindChrome() {
  setPlay(true);
  $('#btnPlay').addEventListener('click', () => setPlay(!playing));
  $('#btnRestart').addEventListener('click', () => { time = 0; });
  $('#btnRandom').addEventListener('click', randomize);
  $('#btnReset').addEventListener('click', () => { if (confirm('Reset everything to defaults? Text and image layers will be removed.')) { S = defaultState(); IMAGES.clear(); presetName = 'Base'; time = 0; inspectorKey = ''; refreshAll(); } });
  $('#btnSave').addEventListener('click', () => download(new Blob([JSON.stringify({ S, presetName }, null, 2)], { type: 'application/json' }), `gradient-studio-${presetName.toLowerCase().replace(/\s+/g, '-')}.json`));
  $('#btnLoad').addEventListener('click', () => $('#fileJson').click());
  $('#fileJson').addEventListener('change', async () => {
    const f = $('#fileJson').files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text()); if (!d.S) throw 0;
      S = Object.assign(defaultState(), d.S);
      S.canvas = Object.assign(defaultState().canvas, d.S.canvas || {}); S.export = Object.assign(defaultState().export, d.S.export || {});
      if (d.S.text && d.S.text.layers && !d.S.layers) S.layers = d.S.text.layers;
      S.layers = (S.layers || []).map(normalizeLayer); S.images = S.images || {}; ensureBackgroundLayer(); S.selected = -1;
      S.layers.forEach(l => l.kind === 'text' && ensureFont(l.font));
      IMAGES.clear(); await restoreImages(); fixImageSizes();
      presetName = d.presetName || 'Custom'; inspectorKey = ''; refreshAll(); toast('Design loaded');
    } catch (e) { console.error(e); toast('That file is not a Gradient Studio design'); }
    $('#fileJson').value = '';
  });
  $('#btnExport').addEventListener('click', openExport);
  $('#btnAddText').addEventListener('click', () => addTextLayer());
  $('#btnAddImage').addEventListener('click', () => fileImage.click());
  $('#btnGuides').addEventListener('click', () => { S.guides = !S.guides; refreshAll(); });
  $('#btnSnap').addEventListener('click', () => { S.snap = !S.snap; refreshAll(); });
  const rq = $('#ratioQuick'); RATIOS.forEach(r => rq.append(el('option', { value: r.id }, r.id === 'custom' ? 'Custom size' : `${r.id} · ${r.name}`)));
  rq.addEventListener('change', () => { if (rq.value === 'custom') { S.canvas.ratio = 'custom'; S.selected = -1; refreshAll(); openGroups.add('Canvas'); inspectorKey = ''; refreshAll(); } else setRatio(rq.value); });
  $('#qualitySel').addEventListener('change', e => { S.previewQ = +e.target.value; fitPreview(); persist(); });
  const scrub = $('#scrub');
  scrub.addEventListener('input', () => { time = +scrub.value * (S.loop ? Math.max(0.5, S.duration) : 10); });
  scrub.addEventListener('pointerdown', () => { scrub._was = playing; setPlay(false); });
  scrub.addEventListener('pointerup', () => { if (scrub._was) setPlay(true); });
  window.addEventListener('keydown', e => {
    if (e.target.matches('input,textarea,select')) return;
    const l = selectedLayer(); const meta = e.metaKey || e.ctrlKey;
    if (e.code === 'Space') { e.preventDefault(); setPlay(!playing); }
    else if (e.key === 'r' || e.key === 'R') randomize();
    else if (e.key === 'g' || e.key === 'G') { S.guides = !S.guides; refreshAll(); }
    else if (e.key === 'Escape') { if (modal.classList.contains('open')) closeExport(); else if (S.selected !== -1) { S.selected = -1; refreshAll(); } }
    else if (meta && (e.key === 'd' || e.key === 'D') && l && l.kind !== 'background') { e.preventDefault(); duplicateLayer(S.selected); }
    else if (e.key.startsWith('Arrow') && l && l.kind !== 'background') {
      const d = e.shiftKey ? 2 : 0.25;
      if (e.key === 'ArrowLeft') l.x -= d; if (e.key === 'ArrowRight') l.x += d; if (e.key === 'ArrowUp') l.y -= d; if (e.key === 'ArrowDown') l.y += d;
      l.x = +l.x.toFixed(2); l.y = +l.y.toFixed(2); e.preventDefault(); refreshAll();
    } else if ((e.key === 'Delete' || e.key === 'Backspace') && l && l.kind !== 'background' && hoverCanvas) deleteLayer(S.selected);
    else if (e.key === ']' && l) moveLayer(S.selected, 1);
    else if (e.key === '[' && l) moveLayer(S.selected, -1);
  });
}
function randomize() {
  S.type = Math.floor(Math.random() * TYPES.length);
  const pal = pick(PALETTES); S.palette.stops = paletteFrom([...pal.c].sort(() => Math.random() - 0.5));
  S.scale = +rnd(0.6, 1.8).toFixed(2); S.speed = +rnd(0.5, 1.6).toFixed(2); S.octaves = 3 + Math.floor(Math.random() * 3);
  S.warp = +rnd(0.3, 2).toFixed(2); S.contrast = +rnd(0.9, 2.2).toFixed(2);
  S.steps = Math.random() < 0.25 ? 3 + Math.floor(Math.random() * 5) : 1; S.soft = +rnd(0.2, 1).toFixed(2);
  S.angle = Math.random() < 0.5 ? 0 : Math.round(rnd(-90, 90)); S.seed = Math.random();
  S.palette.repeat = Math.random() < 0.2 ? +rnd(1.5, 3).toFixed(1) : 1; S.palette.mirror = S.palette.repeat !== 1;
  S.texture.type = Math.random() < 0.35 ? 1 + Math.floor(Math.random() * (TEXTURES.length - 1)) : 0; S.texture.amount = +rnd(0.15, 0.5).toFixed(2);
  S.shape.type = Math.random() < 0.2 ? 1 + Math.floor(Math.random() * (SHAPES.length - 1)) : 0;
  presetName = 'Random'; refreshAll();
}

/* ======================================================================
   Boot
   ====================================================================== */
(async function boot() {
  const restored = restore();
  buildLooks(); buildInspector();
  bindStage(); bindChrome(); bindExport();
  if (!restored) addTextLayer({ text: 'GRADIENT\nSTUDIO', size: 8, letter: 0.04, weight: 800, font: 'Inter' });
  S.layers.forEach(l => l.kind === 'text' && ensureFont(l.font));
  await restoreImages();
  fixImageSizes();
  refreshAll();
  requestAnimationFrame(t => { last = t; tick(t); });
})();

</script>
</body>
