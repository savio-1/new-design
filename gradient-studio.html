<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gradient Studio</title>
<meta name="description" content="Design animated gradient-map backgrounds (15 motion types), layer custom-font text on top, add textures and shape masks, and export seamless GIF or MP4 loops." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.1/build/mp4-muxer.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/webm-muxer@5.1.3/build/webm-muxer.js" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#0d0e12; --panel:#14151b; --panel-2:#1a1b23; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --text:#e8e9ef; --muted:#8b8f9d; --faint:#5c6070;
  --accent:#8b7cff; --accent-2:#ff7ac6; --ok:#4cd6a0; --warn:#ffb454; --danger:#ff5e7a;
  --radius:10px; --r-sm:7px;
  --sb:340px;
  --font:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.10);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.18);background-clip:padding-box;border:2px solid transparent}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:var(--sb) 1fr;grid-template-rows:52px 1fr;height:100vh}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em;margin-right:6px}
.brand .logo{width:24px;height:24px;border-radius:7px;background:conic-gradient(from 200deg,#39d3ee,#c9f25c,#ff5b7f,#f0611a,#8b7cff,#39d3ee);box-shadow:0 0 0 1px rgba(255,255,255,.12) inset}
.brand small{color:var(--muted);font-weight:500}
.topbar .spacer{flex:1}
.sidebar{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sidebar .scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:12px}
.sidebar .foot{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;background:var(--panel)}
.stage{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:
  radial-gradient(circle at 1px 1px, rgba(255,255,255,.06) 1px, transparent 1.5px) 0 0/22px 22px, var(--bg)}
.stage .canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:28px;min-height:0}
.frame{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08);background:#000;touch-action:none}
.frame canvas{display:block;width:100%;height:100%}
#gl{position:absolute;inset:0;visibility:hidden}
#out{position:relative;cursor:grab}
#out.dragging{cursor:grabbing}
.stage .bar{display:flex;align-items:center;gap:12px;padding:10px 18px;border-top:1px solid var(--line);background:rgba(20,21,27,.7);backdrop-filter:blur(10px);font-size:12px;color:var(--muted)}
.stage .bar .mono{font-family:var(--mono);font-size:11.5px;color:var(--text)}
.stage .bar .spacer{flex:1}
.timeline{flex:1;max-width:420px;height:22px;display:flex;align-items:center}
.timeline input{width:100%}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--panel-2);color:var(--text);font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:#22232d;border-color:rgba(255,255,255,.22)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,var(--accent),#6e5cff);border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(139,124,255,.25)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:rgba(255,255,255,.06);color:var(--text)}
.btn.danger:hover{border-color:var(--danger);color:var(--danger)}
.btn svg{width:15px;height:15px;flex:none}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:2px;gap:2px}
.seg button{height:24px;padding:0 10px;border:0;background:transparent;border-radius:5px;color:var(--muted);font-size:12px;font-weight:500}
.seg button.on{background:rgba(255,255,255,.10);color:var(--text)}

/* ---------- sections ---------- */
.sec{border-bottom:1px solid var(--line)}
.sec>header{display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;user-select:none;font-weight:600;font-size:12.5px;letter-spacing:.01em}
.sec>header:hover{background:rgba(255,255,255,.02)}
.sec>header .chev{margin-left:auto;color:var(--faint);transition:transform .2s}
.sec>header .badge{font-size:10.5px;font-weight:500;color:var(--muted);background:rgba(255,255,255,.06);padding:1px 7px;border-radius:99px}
.sec.open>header .chev{transform:rotate(90deg)}
.sec>.body{display:none;padding:2px 14px 14px}
.sec.open>.body{display:block}
.row{display:flex;align-items:center;gap:8px;margin-top:8px}
.row.top{align-items:flex-start}
.row>label{width:92px;flex:none;color:var(--muted);font-size:12px}
.row .grow{flex:1;min-width:0}
.hint{color:var(--faint);font-size:11.5px;margin-top:6px;line-height:1.4}
.hr{height:1px;background:var(--line);margin:12px 0 4px}
.sub{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:14px 0 2px}

/* slider control */
.ctl{margin-top:9px}
.ctl .lab{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);margin-bottom:3px}
.ctl .lab b{font-weight:500;color:var(--text)}
.ctl .lab .val{font-family:var(--mono);font-size:11px;color:var(--muted);cursor:text}
.ctl .lab .val input{width:64px;background:transparent;border:0;border-bottom:1px dashed var(--line-2);text-align:right;font-family:var(--mono);font-size:11px;color:var(--text);padding:0;outline:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:rgba(255,255,255,.12)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:rgba(255,255,255,.12)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;margin-top:-5px;box-shadow:0 1px 4px rgba(0,0,0,.5);border:0}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:0}
input[type=range]:focus{outline:none}
input[type=range]:focus::-webkit-slider-thumb{box-shadow:0 0 0 4px rgba(139,124,255,.35)}

select,.input,textarea{width:100%;height:30px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:0 9px;color:var(--text);outline:none}
select:focus,.input:focus,textarea:focus{border-color:var(--accent)}
select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%238b8f9d' stroke-width='1.5'/></svg>");background-repeat:no-repeat;background-position:right 9px center;padding-right:24px}
textarea{height:auto;min-height:64px;padding:7px 9px;resize:vertical;line-height:1.4}
.input.sm{height:26px;padding:0 7px;font-size:12px}
.color{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 4px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm)}
.color input[type=color]{-webkit-appearance:none;appearance:none;width:22px;height:22px;border:0;padding:0;background:none;border-radius:5px;overflow:hidden;cursor:pointer}
.color input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.color input[type=color]::-webkit-color-swatch{border:0;border-radius:5px}
.color input[type=color]::-moz-color-swatch{border:0;border-radius:5px}
.color .hex{width:66px;background:transparent;border:0;font-family:var(--mono);font-size:11.5px;outline:none}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--muted);font-size:12px;user-select:none}
.toggle input{display:none}
.toggle .sw{width:30px;height:17px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;transition:background .15s}
.toggle .sw::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle input:checked+.sw{background:var(--accent)}
.toggle input:checked+.sw::after{transform:translateX(13px)}

/* chips grid */
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.chips.c4{grid-template-columns:repeat(4,1fr)}
.chip{height:30px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel-2);color:var(--muted);font-size:12px;font-weight:500;padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:all .12s}
.chip:hover{border-color:var(--line-2);color:var(--text)}
.chip.on{background:rgba(139,124,255,.18);border-color:rgba(139,124,255,.6);color:#fff}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
.type{border:1px solid var(--line);border-radius:9px;background:var(--panel-2);padding:0;overflow:hidden;text-align:left;transition:all .12s;position:relative}
.type .thumb{height:44px;background:#222}
.type .name{padding:5px 8px 6px;font-size:11.5px;font-weight:500;color:var(--muted)}
.type:hover{border-color:var(--line-2)}
.type:hover .name{color:var(--text)}
.type.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.type.on .name{color:#fff}

/* presets strip */
.presets{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 10px;scrollbar-width:thin}
.preset{flex:none;width:76px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);padding:0;overflow:hidden;text-align:left;transition:all .12s}
.preset .sw{height:52px}
.preset .nm{font-size:10.5px;font-weight:500;color:var(--muted);padding:4px 7px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preset:hover{border-color:var(--line-2)}
.preset.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.preset.on .nm{color:#fff}

/* palette editor */
.grad{height:26px;border-radius:7px;border:1px solid var(--line-2);margin-top:8px}
.stops{margin-top:6px;display:flex;flex-direction:column;gap:5px}
.stop{display:flex;align-items:center;gap:6px}
.stop .color{height:26px}
.stop input[type=range]{flex:1}
.stop .pos{width:34px;font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right}
.stop .x{width:22px;height:22px;border-radius:5px;border:0;background:transparent;color:var(--faint);display:inline-flex;align-items:center;justify-content:center}
.stop .x:hover{background:rgba(255,94,122,.15);color:var(--danger)}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.swatch{height:26px;border-radius:6px;border:1px solid rgba(255,255,255,.12);padding:0;cursor:pointer;transition:transform .1s}
.swatch:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.4)}

/* text layers */
.layers{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.layer{display:flex;align-items:center;gap:8px;height:32px;padding:0 6px 0 10px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel-2);cursor:pointer}
.layer .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.layer.on{border-color:rgba(139,124,255,.6);background:rgba(139,124,255,.12)}
.layer .eye,.layer .del{width:22px;height:22px;border:0;background:transparent;color:var(--faint);border-radius:5px;display:inline-flex;align-items:center;justify-content:center}
.layer .eye:hover,.layer .del:hover{background:rgba(255,255,255,.08);color:var(--text)}
.layer .eye.off{opacity:.35}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(5,6,10,.7);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:50}
.modal.open{display:flex}
.dialog{width:520px;max-width:calc(100vw - 32px);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:14px;box-shadow:0 40px 100px rgba(0,0,0,.6)}
.dialog header{display:flex;align-items:center;gap:10px;padding:16px 18px 10px;font-weight:600;font-size:15px}
.dialog header .x{margin-left:auto}
.dialog .content{padding:4px 18px 18px}
.dialog .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:10px}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.est{margin-top:12px;padding:10px 12px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.5}
.est b{color:var(--text);font-weight:500}
.progress{margin-top:14px;display:none}
.progress.on{display:block}
.progress .track{height:6px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
.progress .fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .12s}
.progress .txt{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;font-family:var(--mono)}
.dialog footer{display:flex;gap:8px;justify-content:flex-end;padding:0 18px 18px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#1f2029;border:1px solid var(--line-2);color:var(--text);padding:10px 14px;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:all .25s;z-index:60;font-size:12.5px;max-width:80vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.kbd{font-family:var(--mono);font-size:10.5px;background:rgba(255,255,255,.08);border:1px solid var(--line-2);border-radius:4px;padding:0 5px;color:var(--muted)}
.warn{color:var(--warn)}
@media (max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:52px 1fr auto}.sidebar{order:3;max-height:48vh;border-right:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><span class="logo"></span>Gradient Studio <small>· gradient-map animator</small></div>
    <div class="seg" id="playSeg">
      <button id="btnPlay" title="Play / pause (Space)">Pause</button>
      <button id="btnRestart" title="Restart from 0">↺</button>
    </div>
    <button class="btn" id="btnRandom" title="Randomize (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>Randomize</button>
    <span class="spacer"></span>
    <span style="color:var(--muted);font-size:12px" title="Preview render quality">Preview</span>
    <div class="seg" id="qualitySeg"><button data-q="0.6">Fast</button><button data-q="1" class="on">Balanced</button><button data-q="1.6">Sharp</button></div>
    <button class="btn" id="btnSave" title="Save preset as JSON"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>Save</button>
    <button class="btn" id="btnLoad" title="Load a saved preset JSON"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3m0 0L8 7m4-4l4 4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>Load</button>
    <button class="btn ghost" id="btnReset" title="Reset everything to defaults">Reset</button>
    <button class="btn primary" id="btnExport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/><path d="M12 4v11m0 0l-4-4m4 4l4-4"/></svg>Export GIF / MP4</button>
  </div>

  <aside class="sidebar">
    <div class="scroll" id="sidebar">
      <div class="presets" id="presets"></div>
      <!-- sections are generated in JS -->
    </div>
    <div class="foot">
      <button class="btn grow" id="btnAddText" style="flex:1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M12 6v14M8 20h8"/></svg>Add text</button>
      <button class="btn primary" id="btnExport2" style="flex:1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/><path d="M12 4v11m0 0l-4-4m4 4l4-4"/></svg>Export</button>
    </div>
  </aside>

  <main class="stage">
    <div class="canvas-wrap" id="wrap">
      <div class="frame" id="frame">
        <canvas id="gl"></canvas>
        <canvas id="out"></canvas>
      </div>
    </div>
    <div class="bar">
      <span class="mono" id="sizeLabel">1080 × 1920</span>
      <span>·</span>
      <span class="mono" id="typeLabel">Soft Clouds</span>
      <span class="spacer"></span>
      <div class="timeline" title="Scrub time"><input type="range" id="scrub" min="0" max="1" step="0.001" value="0"></div>
      <span class="mono" id="timeLabel">0.00s</span>
      <span class="mono" id="fpsLabel" style="color:var(--faint)">60 fps</span>
    </div>
  </main>
</div>

<div class="modal" id="exportModal">
  <div class="dialog">
    <header>Export animation <button class="btn icon ghost x" id="exportClose">✕</button></header>
    <div class="content">
      <div class="seg" id="fmtSeg" style="display:flex">
        <button data-f="gif" class="on" style="flex:1">GIF</button>
        <button data-f="mp4" style="flex:1">MP4 (H.264)</button>
        <button data-f="webm" style="flex:1">WebM</button>
        <button data-f="png" style="flex:1">PNG frame</button>
      </div>
      <div class="grid">
        <div class="field"><label>Resolution</label><select id="exRes"></select></div>
        <div class="field"><label>Frame rate</label><select id="exFps"></select></div>
        <div class="field"><label>Duration (seconds)</label><input class="input" id="exDur" type="number" min="0.5" max="30" step="0.5" value="4"></div>
        <div class="field"><label>Quality</label><select id="exQ"><option value="high">High</option><option value="med">Medium</option><option value="low">Low (small file)</option></select></div>
      </div>
      <div class="row" style="gap:18px;margin-top:12px">
        <label class="toggle"><input type="checkbox" id="exLoop" checked><span class="sw"></span>Seamless loop</label>
        <label class="toggle" id="exDitherWrap"><input type="checkbox" id="exDither" checked><span class="sw"></span>Dither (GIF)</label>
      </div>
      <div class="est" id="exEst"></div>
      <div class="progress" id="exProg"><div class="track"><div class="fill" id="exFill"></div></div><div class="txt"><span id="exStage">Rendering…</span><span id="exPct">0%</span></div></div>
    </div>
    <footer>
      <button class="btn" id="exCancel">Cancel</button>
      <button class="btn primary" id="exGo">Render &amp; download</button>
    </footer>
  </div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="fileFont" accept=".ttf,.otf,.woff,.woff2,font/*" multiple hidden>
<input type="file" id="fileJson" accept="application/json,.json" hidden>

<script>
const FRAG = `#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif

uniform vec2  uRes;        // canvas size in pixels
uniform float uT;          // scalar time (periodic-safe in loop mode)
uniform vec2  uOff;        // noise domain offset (moves on a circle in loop mode)
uniform float uZ;          // noise 3rd dimension
uniform float uFrame;      // frame counter for grain
uniform int   uType;
uniform float uScale;
uniform int   uOct;
uniform float uWarp;
uniform float uContrast;
uniform float uSoft;
uniform float uSteps;
uniform float uAngle;
uniform float uSeed;
uniform vec2  uFlow;
uniform float uFlowT;      // flow displacement (sways in loop mode)
// palette
uniform vec3  uCols[8];
uniform float uPos[8];
uniform int   uCount;
uniform int   uPalMode;    // 0 smooth, 1 linear, 2 hard
uniform int   uSpace;      // 0 srgb, 1 oklab
uniform float uRepeat;
uniform float uPalOff;
uniform int   uMirror;
// post
uniform float uSat;
uniform float uBright;
uniform float uHue;
uniform float uVignette;
// texture
uniform int   uTex;
uniform float uTexAmt;
uniform float uTexScale;
// shape
uniform int   uShape;
uniform float uShapeSize;
uniform float uShapeSoft;
uniform float uShapeRound;
uniform vec3  uBg;

vec2 gOff; // noise offset = time drift + seed

#define PI 3.14159265359
#define TAU 6.28318530718

/* ---------- simplex noise (Ashima / Stefan Gustavson, MIT) ---------- */
vec3 mod289(vec3 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 mod289(vec4 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 permute(vec4 x){ return mod289(((x*34.0)+1.0)*x); }
vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }
float snoise(vec3 v){
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i  = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(
            i.z + vec4(0.0, i1.z, i2.z, 1.0))
          + i.y + vec4(0.0, i1.y, i2.y, 1.0))
          + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0) * 2.0 + 1.0;
  vec4 s1 = floor(b1) * 2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}

float fbm(vec3 p){
  float a = 0.5, s = 0.0, n = 0.0;
  for (int i = 0; i < 8; i++){
    if (i >= uOct) break;
    s += a * snoise(p); n += a;
    p = p * 2.02 + vec3(13.1, 7.7, 3.3); a *= 0.5;
  }
  return s / max(n, 1e-4);
}
float turb(vec3 p){
  float a = 0.5, s = 0.0, n = 0.0;
  for (int i = 0; i < 8; i++){
    if (i >= uOct) break;
    s += a * abs(snoise(p)); n += a;
    p = p * 2.02 + vec3(13.1, 7.7, 3.3); a *= 0.5;
  }
  return s / max(n, 1e-4);
}
vec2 hash2(vec2 p){
  vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.xx + p3.yz) * p3.zy);
}
float hash1(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

// Worley F1 with animated cell points (periodic in uT)
float worley(vec2 q){
  vec2 ip = floor(q), fp = fract(q);
  float d = 8.0;
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++){
    vec2 g = vec2(float(x), float(y));
    vec2 h = hash2(ip + g + uSeed);
    vec2 o = 0.5 + 0.4 * sin(uT + TAU * h);
    vec2 r = g + o - fp;
    d = min(d, dot(r, r));
  }
  return sqrt(d);
}

/* ---------- field functions, all return roughly 0..1 ---------- */
float fieldClouds(vec2 q){
  vec2 w = vec2(fbm(vec3(q + gOff, uZ)), fbm(vec3(q + gOff + vec2(5.2, 1.3), uZ + 2.0)));
  return fbm(vec3(q + uWarp * w * 1.5 + gOff * 0.5, uZ * 0.7)) * 0.5 + 0.5;
}
float fieldBlobs(vec2 q){
  q *= 0.55;
  float w = snoise(vec3(q * 0.8 + gOff * 0.5, uZ)) * uWarp * 0.6;
  float v = snoise(vec3(q + gOff + w, uZ)) * 0.65
          + snoise(vec3(q * 1.7 - gOff.yx + w, uZ * 1.3 + 3.0)) * 0.35;
  return v * 0.5 + 0.5;
}
float fieldBands(vec2 q){
  q *= 0.7;
  float w = fbm(vec3(q * 0.7 + gOff, uZ));
  float v = snoise(vec3(q.x * 0.9 + w * uWarp * 2.0 + gOff.x, q.y * 0.45 + gOff.y * 0.5 + w * 0.5, uZ * 0.5));
  return v * 0.5 + 0.5;
}
float fieldMarble(vec2 q){
  float n = fbm(vec3(q + gOff, uZ));
  float v = 1.0 - abs(sin(q.x * 1.5 + q.y * 0.4 + n * uWarp * 3.0 + gOff.x));
  return pow(v, 1.6);
}
float fieldLiquid(vec2 q){
  vec2 p = q;
  for (int i = 0; i < 3; i++){
    float fi = float(i);
    p += uWarp * 0.7 * vec2(snoise(vec3(p + gOff, uZ + fi)), snoise(vec3(p.yx - gOff, uZ + fi + 7.0)));
  }
  return fbm(vec3(p, uZ)) * 0.5 + 0.5;
}
float fieldPlasma(vec2 q){
  q += uWarp * 0.4 * vec2(fbm(vec3(q * 0.5 + gOff, uZ)), fbm(vec3(q.yx * 0.5 - gOff, uZ + 4.0)));
  vec2 c = vec2(sin(uT) * 1.5, cos(uT * 2.0) * 1.2);
  float v = sin(q.x * 1.6 + uT) + sin(q.y * 1.4 + uT * 2.0)
          + sin((q.x + q.y) * 1.1 + uT * 3.0) + sin(length(q - c) * 2.4 - uT);
  return v * 0.125 + 0.5;
}
float fieldRipples(vec2 q){
  q += uWarp * 0.3 * vec2(fbm(vec3(q * 0.6 + gOff, uZ)), fbm(vec3(q.yx * 0.6 - gOff, uZ + 4.0)));
  vec2 c1 = vec2(sin(uT), cos(uT)) * 1.6;
  vec2 c2 = vec2(cos(uT * 2.0), sin(uT)) * 1.3 + vec2(0.7, -0.4);
  vec2 c3 = vec2(sin(uT * 3.0 + 1.0), cos(uT * 2.0 + 2.0)) * 1.1 - vec2(0.9, 0.5);
  float v = sin(length(q - c1) * 3.0 - uT * 2.0) + sin(length(q - c2) * 2.6 - uT * 3.0) + sin(length(q - c3) * 3.4 - uT);
  return v / 6.0 + 0.5;
}
float fieldAurora(vec2 q){
  float w = fbm(vec3(q * 0.5 + gOff, uZ));
  vec2 p = vec2(q.x * 0.6 + w * uWarp * 1.5, q.y * 3.5 + gOff.y * 0.4 + sin(q.x * 0.9 + uT) * 0.8);
  float v = fbm(vec3(p + gOff, uZ)) * 0.5 + 0.5;
  float curtain = 0.5 + 0.5 * sin(q.x * 2.2 + w * uWarp * 4.0 + uT);
  return mix(v, v * curtain + 0.25, 0.5);
}
float fieldCells(vec2 q){
  q += uWarp * 0.35 * vec2(fbm(vec3(q * 0.5 + gOff, uZ)), fbm(vec3(q.yx * 0.5 - gOff, uZ + 4.0)));
  float d = worley(q * 0.9 + gOff * 0.3);
  return 1.0 - clamp(d * 1.15, 0.0, 1.0);
}
float fieldMeta(vec2 q){
  float s = 0.0;
  for (int i = 0; i < 6; i++){
    float fi = float(i);
    vec2 c = vec2(sin(uT * (1.0 + mod(fi, 3.0)) + fi * 2.1), cos(uT * (1.0 + mod(fi + 1.0, 2.0)) + fi * 1.3)) * (1.1 + 0.4 * fi / 6.0);
    float r = 0.45 + 0.2 * sin(fi * 1.7 + uSeed);
    vec2 d = q - c;
    s += r * r / (dot(d, d) + 0.02);
  }
  s += uWarp * 0.5 * fbm(vec3(q + gOff, uZ));
  return 1.0 - exp(-s * 0.55);
}
float fieldSmoke(vec2 q){
  vec2 w = vec2(fbm(vec3(q * 0.7 + gOff, uZ)), fbm(vec3(q * 0.7 + gOff + vec2(3.1, 9.2), uZ + 5.0)));
  return turb(vec3(q + uWarp * w * 1.6 + gOff, uZ)) ;
}
float fieldSilk(vec2 q){
  float n = fbm(vec3(q * 0.8 + gOff, uZ)) * uWarp * 2.5;
  float v = 0.0;
  for (int k = 1; k <= 3; k++){
    float fk = float(k);
    v += sin(q.x * fk * 1.1 + q.y * (0.6 - 0.2 * fk) + n * (1.0 + 0.3 * fk) + uT * fk) / fk;
  }
  return v * 0.28 + 0.5;
}
float fieldStripes(vec2 q){
  float n = fbm(vec3(q + gOff, uZ));
  float v = sin(q.x * 3.2 + n * uWarp * 5.0 + uT) * 0.5 + 0.5;
  return v;
}
float fieldKaleido(vec2 q){
  float a = atan(q.y, q.x);
  float r = length(q);
  float seg = TAU / 6.0;
  a = abs(mod(a, seg) - seg * 0.5);
  vec2 p = vec2(cos(a), sin(a)) * r;
  vec2 w = vec2(fbm(vec3(p + gOff, uZ)), fbm(vec3(p.yx - gOff, uZ + 3.0)));
  return fbm(vec3(p * 1.2 + w * uWarp + gOff, uZ)) * 0.5 + 0.5;
}
float fieldLava(vec2 q){
  q += uWarp * 0.4 * vec2(fbm(vec3(q * 0.4 + gOff, uZ)), fbm(vec3(q.yx * 0.4 - gOff, uZ + 4.0)));
  float c = 1.0 - clamp(worley(q * 0.7 + gOff * 0.2) * 1.1, 0.0, 1.0);
  float n = fbm(vec3(q * 1.3 + gOff, uZ)) * 0.5 + 0.5;
  return mix(c, n, 0.45);
}

float field(vec2 q){
  if (uType == 0) return fieldClouds(q);
  if (uType == 1) return fieldBlobs(q);
  if (uType == 2) return fieldBands(q);
  if (uType == 3) return fieldMarble(q);
  if (uType == 4) return fieldLiquid(q);
  if (uType == 5) return fieldPlasma(q);
  if (uType == 6) return fieldRipples(q);
  if (uType == 7) return fieldAurora(q);
  if (uType == 8) return fieldCells(q);
  if (uType == 9) return fieldMeta(q);
  if (uType == 10) return fieldSmoke(q);
  if (uType == 11) return fieldSilk(q);
  if (uType == 12) return fieldStripes(q);
  if (uType == 13) return fieldKaleido(q);
  return fieldLava(q);
}

/* ---------- color ---------- */
vec3 lin2srgb(vec3 c){
  c = clamp(c, 0.0, 1.0);
  return mix(12.92 * c, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c));
}
vec3 oklab2rgb(vec3 c){
  float l_ = c.x + 0.3963377774 * c.y + 0.2158037573 * c.z;
  float m_ = c.x - 0.1055613458 * c.y - 0.0638541728 * c.z;
  float s_ = c.x - 0.0894841775 * c.y - 1.2914855480 * c.z;
  float l = l_ * l_ * l_, m = m_ * m_ * m_, s = s_ * s_ * s_;
  vec3 lin = vec3( 4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
                  -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
                  -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s);
  return lin2srgb(lin);
}
vec3 palette(float t){
  vec3 c = uCols[0];
  for (int i = 1; i < 8; i++){
    if (i >= uCount) break;
    float a = uPos[i - 1], b = uPos[i];
    float f = clamp((t - a) / max(b - a, 1e-4), 0.0, 1.0);
    if (uPalMode == 0) f = smoothstep(0.0, 1.0, f);
    else if (uPalMode == 2) f = step(0.5, f);
    c = mix(c, uCols[i], f);
  }
  return uSpace == 1 ? oklab2rgb(c) : c;
}
vec3 hueRotate(vec3 c, float a){
  const vec3 k = vec3(0.57735);
  float ca = cos(a), sa = sin(a);
  return c * ca + cross(k, c) * sa + k * dot(k, c) * (1.0 - ca);
}

/* ---------- shape masks ---------- */
float sdRoundBox(vec2 p, vec2 b, float r){
  vec2 d = abs(p) - b + r;
  return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0) - r;
}
float shapeMask(vec2 s, float aspect){
  if (uShape == 0) return 1.0;
  float d = 0.0;
  float sz = uShapeSize;
  vec2 ext = vec2(aspect >= 1.0 ? aspect : 1.0, aspect >= 1.0 ? 1.0 : 1.0 / aspect);
  if (uShape == 1) d = length(s) - sz;
  else if (uShape == 2) d = sdRoundBox(s, ext * sz, uShapeRound * min(ext.x, ext.y) * sz);
  else if (uShape == 3) { vec2 a = abs(s / sz); d = (pow(pow(a.x, 4.0) + pow(a.y, 4.0), 0.25) - 1.0) * sz; }
  else if (uShape == 4) { float n = snoise(vec3(s * 1.4 + gOff * 0.3, uZ)); d = length(s) - sz * (1.0 + 0.22 * n); }
  else if (uShape == 5) d = abs(s.x) + abs(s.y) - sz;
  else if (uShape == 6) d = abs(length(s) - sz) - uShapeRound * 0.5 * sz;
  else if (uShape == 7) { float w = sin(s.x * 3.0 + uT) * 0.12 + sin(s.x * 5.0 - uT * 2.0) * 0.05; d = (s.y - (1.0 - sz * 1.4) - w); }
  else if (uShape == 8) { float a = atan(s.y, s.x); float r = length(s); float k = 0.5 + 0.5 * cos(a * 5.0); d = r - sz * (0.72 + 0.32 * k); }
  float soft = uShapeSoft * 0.25 + 1.5 / uRes.y;
  return 1.0 - smoothstep(-soft, soft, d);
}

/* ---------- textures ---------- */
vec3 applyTexture(vec3 col, vec2 pix, vec2 uv){
  if (uTex == 0 || uTexAmt <= 0.0) return col;
  float amt = uTexAmt;
  float sc = max(uTexScale, 0.05);
  if (uTex == 1) {            // film grain (animated)
    float g = hash1(pix * 0.37 + fract(uFrame * 0.618) * 100.0 + vec2(uFrame * 0.13, uFrame * 0.71));
    col += (g - 0.5) * amt * 0.5;
  } else if (uTex == 2) {     // halftone
    float cell = 9.0 * sc;
    vec2 p = mat2(0.7071, 0.7071, -0.7071, 0.7071) * pix;
    vec2 f = fract(p / cell) - 0.5;
    float lum = dot(col, vec3(0.299, 0.587, 0.114));
    float r = 0.65 * (1.0 - lum);
    float dots = 1.0 - smoothstep(r - 0.08, r + 0.08, length(f));
    col = mix(col, col * (1.0 - dots * 0.6), amt);
  } else if (uTex == 3) {     // scanlines
    float l = 0.5 + 0.5 * sin(pix.y * PI / (2.0 * sc));
    col *= 1.0 - amt * 0.45 * l;
  } else if (uTex == 4) {     // paper fibres
    float n = snoise(vec3(pix * 0.09 / sc, 1.0)) * 0.6 + snoise(vec3(pix * 0.35 / sc, 7.0)) * 0.4;
    col *= 1.0 + n * amt * 0.35;
  } else if (uTex == 5) {     // dot grid
    float cell = 14.0 * sc;
    vec2 f = fract(pix / cell) - 0.5;
    float d = 1.0 - smoothstep(0.08, 0.14, length(f));
    col = mix(col, col + 0.35, d * amt);
  } else if (uTex == 6) {     // diagonal lines
    float l = 0.5 + 0.5 * sin((pix.x + pix.y) * PI / (4.0 * sc));
    col *= 1.0 - amt * 0.35 * smoothstep(0.4, 0.9, l);
  } else if (uTex == 7) {     // static noise (fine)
    float g = hash1(pix * 0.73 + uSeed);
    col += (g - 0.5) * amt * 0.35;
  }
  return col;
}

void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  float aspect = uRes.x / uRes.y;
  // centered coords; the shorter edge spans [-1,1]
  vec2 s = (uv - 0.5) * 2.0;
  s.x *= aspect;
  if (aspect < 1.0) s /= aspect;

  // rotate + scale + flow for the field
  float ca = cos(uAngle), sa = sin(uAngle);
  vec2 q = mat2(ca, -sa, sa, ca) * s;
  q = q * uScale * 1.4 + uFlow * uFlowT;
  gOff = uOff + vec2(uSeed * 7.31, uSeed * 3.17);

  float v = field(q);
  v = clamp(v, 0.0, 1.0);
  v = clamp(mix(0.5, v, uContrast), 0.0, 1.0);
  if (uSteps > 1.5) {
    float f = v * uSteps;
    float fl = floor(f), fr = f - fl;
    float e = smoothstep(0.5 - uSoft * 0.5, 0.5 + uSoft * 0.5, fr);
    v = clamp((fl + e) / uSteps, 0.0, 1.0);
  }
  float g = v * uRepeat + uPalOff;
  if (uRepeat != 1.0 || uPalOff != 0.0) {
    g = (uMirror == 1) ? 1.0 - abs(fract(g * 0.5) * 2.0 - 1.0) : fract(g);
  }
  vec3 col = palette(g);

  // post
  float lum = dot(col, vec3(0.299, 0.587, 0.114));
  col = mix(vec3(lum), col, uSat) * uBright;
  if (uHue != 0.0) col = hueRotate(col, uHue);
  if (uVignette > 0.0) {
    float vig = 1.0 - smoothstep(0.4, 1.6, length((uv - 0.5) * vec2(aspect, 1.0)) * 1.4) * uVignette;
    col *= vig;
  }
  col = applyTexture(col, gl_FragCoord.xy, uv);
  col = clamp(col, 0.0, 1.0);

  float m = shapeMask(s, aspect);
  col = mix(uBg, col, m);
  gl_FragColor = vec4(col, 1.0);
}
`;

<script>
/* ================= GIF encoder (global palette, median-cut, LZW) ================= */
const GIF = (() => {
  // ---- median cut quantizer ----
  function medianCut(samples, maxColors) {
    // samples: Uint8Array of rgb triples
    const n = samples.length / 3;
    const idx = new Uint32Array(n);
    for (let i = 0; i < n; i++) idx[i] = i;
    const boxes = [{ start: 0, end: n }];
    const stats = (b) => {
      let rmin = 255, rmax = 0, gmin = 255, gmax = 0, bmin = 255, bmax = 0;
      for (let i = b.start; i < b.end; i++) {
        const p = idx[i] * 3;
        const r = samples[p], g = samples[p + 1], bb = samples[p + 2];
        if (r < rmin) rmin = r; if (r > rmax) rmax = r;
        if (g < gmin) gmin = g; if (g > gmax) gmax = g;
        if (bb < bmin) bmin = bb; if (bb > bmax) bmax = bb;
      }
      b.rr = rmax - rmin; b.gr = gmax - gmin; b.br = bmax - bmin;
      b.range = Math.max(b.rr, b.gr, b.br);
      b.count = b.end - b.start;
    };
    stats(boxes[0]);
    while (boxes.length < maxColors) {
      // pick box with largest (range * sqrt(count)) to split
      let best = -1, bestScore = -1;
      for (let i = 0; i < boxes.length; i++) {
        const b = boxes[i];
        if (b.count < 2 || b.range === 0) continue;
        const sc = b.range * Math.sqrt(b.count);
        if (sc > bestScore) { bestScore = sc; best = i; }
      }
      if (best < 0) break;
      const b = boxes[best];
      const ch = b.rr >= b.gr && b.rr >= b.br ? 0 : (b.gr >= b.br ? 1 : 2);
      const sub = idx.subarray(b.start, b.end);
      const arr = Array.from(sub).sort((a, c) => samples[a * 3 + ch] - samples[c * 3 + ch]);
      sub.set(arr);
      const mid = b.start + (b.count >> 1);
      const b2 = { start: mid, end: b.end };
      b.end = mid;
      stats(b); stats(b2);
      boxes.push(b2);
    }
    const pal = new Uint8Array(256 * 3);
    boxes.forEach((b, i) => {
      let r = 0, g = 0, bb = 0;
      for (let k = b.start; k < b.end; k++) { const p = idx[k] * 3; r += samples[p]; g += samples[p + 1]; bb += samples[p + 2]; }
      const c = Math.max(1, b.count);
      pal[i * 3] = Math.round(r / c); pal[i * 3 + 1] = Math.round(g / c); pal[i * 3 + 2] = Math.round(bb / c);
    });
    return { palette: pal, count: boxes.length };
  }

  class Quantizer {
    constructor(samples, maxColors = 256) {

  const fmt = S.export.format;
  const res = $('#exRes'); const cur = S.export.res; res.innerHTML = '';
  const opts = resOptions(); opts.forEach(o => res.append(el('option', { value: o.id }, o.label)));
  res.value = opts.some(o => o.id === cur) ? cur : (fmt === 'gif' ? '540' : '1080'); S.export.res = res.value;
  const fpsSel = $('#exFps'); const fpsList = fmt === 'gif' ? [10, 12, 15, 20, 25, 30, 50] : [24, 25, 30, 50, 60]; fpsSel.innerHTML = '';
  fpsList.forEach(f => fpsSel.append(el('option', { value: f }, f + ' fps')));
  fpsSel.value = fpsList.includes(S.export.fps) ? S.export.fps : (fmt === 'gif' ? 20 : 30); S.export.fps = +fpsSel.value;
  $('#exDur').value = S.duration; $('#exLoop').checked = S.loop; $('#exDither').checked = S.export.dither; $('#exQ').value = S.export.quality;
  $('#exDitherWrap').style.opacity = fmt === 'gif' ? 1 : 0.35;
  $('#exDur').disabled = fmt === 'png'; fpsSel.disabled = fmt === 'png'; $('#exLoop').disabled = fmt === 'png';
  [...$('#fmtSeg').children].forEach(b => b.classList.toggle('on', b.dataset.f === fmt));
  // estimate
  const o = opts.find(x => x.id === S.export.res); const frames = Math.round(S.export.fps * S.duration);
  let est = '';
  if (fmt === 'gif') { const px = o.W * o.H; const bytes = px * frames * 0.32 * (S.export.quality === 'high' ? 1 : S.export.quality === 'med' ? 0.75 : 0.5); est = `<b>${frames} frames</b> at ${o.W}×${o.H}. Rough GIF size: <b>~${fmtBytes(bytes)}</b>. GIF is limited to 256 colours per file; 540p at 15–20 fps is the sweet spot for social posts.`; if (px * frames > 400e6) est += ' <span class="warn">This is a very large GIF and may take a while or run out of memory — consider MP4.</span>'; }
  else if (fmt === 'png') est = `A single ${o.W}×${o.H} PNG of the current frame (t = ${time.toFixed(2)}s).`;
  else { const br = bitrateFor(o.W, o.H, S.export.fps, S.export.quality); est = `<b>${frames} frames</b> at ${o.W}×${o.H}, ~${(br / 1e6).toFixed(1)} Mbps → about <b>${fmtBytes(br / 8 * S.duration)}</b>. ${webCodecsOK() ? 'Encoded offline with WebCodecs at exact frame timing.' : '<span class="warn">WebCodecs is unavailable in this browser — falls back to real-time recording (WebM). Use Chrome, Edge or Safari 16.4+ for MP4.</span>'}`; }
  $('#exEst').innerHTML = est;
  $('#exGo').textContent = fmt === 'png' ? 'Save PNG' : 'Render & download';
}
function bitrateFor(W, H, fps, q) { const px = W * H * fps; const f = q === 'high' ? 0.14 : q === 'med' ? 0.09 : 0.05; return Math.min(60e6, Math.max(1.5e6, Math.round(px * f))); }
function webCodecsOK() { return typeof VideoEncoder !== 'undefined' && typeof VideoFrame !== 'undefined'; }
function openExport() { updateExportUI(); modal.classList.add('open'); }
function closeExport() { if (exporting) { cancelExport = true; return; } modal.classList.remove('open'); }
function bindExport() {
  $('#exportClose').addEventListener('click', closeExport); $('#exCancel').addEventListener('click', closeExport);
  modal.addEventListener('click', e => { if (e.target === modal) closeExport(); });
  [...$('#fmtSeg').children].forEach(b => b.addEventListener('click', () => { S.export.format = b.dataset.f; updateExportUI(); persist(); }));
  $('#exRes').addEventListener('change', e => { S.export.res = e.target.value; updateExportUI(); persist(); });
  $('#exFps').addEventListener('change', e => { S.export.fps = +e.target.value; updateExportUI(); persist(); });
  $('#exDur').addEventListener('change', e => { S.duration = clamp(+e.target.value || 4, 0.5, 30); refreshAll(); updateExportUI(); });
  $('#exQ').addEventListener('change', e => { S.export.quality = e.target.value; updateExportUI(); persist(); });
  $('#exLoop').addEventListener('change', e => { S.loop = e.target.checked; refreshAll(); updateExportUI(); });
  $('#exDither').addEventListener('change', e => { S.export.dither = e.target.checked; persist(); });
  $('#exGo').addEventListener('click', runExport);
}
function setProgress(stage, f) { $('#exProg').classList.add('on'); $('#exStage').textContent = stage; $('#exPct').textContent = Math.round(f * 100) + '%'; $('#exFill').style.width = (f * 100) + '%'; }
const nextTick = () => new Promise(r => setTimeout(r, 0));

async function runExport() {
  if (exporting) return;
  const fmt = S.export.format;
  const o = resOptions().find(x => x.id === S.export.res) || resOptions()[0];
  let W = o.W, H = o.H;
  if (fmt !== 'gif' && fmt !== 'png') { W = Math.round(W / 2) * 2; H = Math.round(H / 2) * 2; }
  const fps = S.export.fps, dur = S.duration, frames = Math.max(1, Math.round(fps * dur));
  const savedW = curW, savedH = curH, savedTime = time, wasPlaying = playing, savedHover = hoverCanvas;
  exporting = true; cancelExport = false; playing = false; hoverCanvas = false;
  $('#exGo').disabled = true; $('#exCancel').textContent = 'Stop';
  const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
  const base = `gradient-${TYPES[S.type].name.toLowerCase().replace(/\s+/g, '-')}-${W}x${H}-${stamp}`;
  try {
    ctx = exportCtx; target = exportCanvas;
    setRenderSize(W, H);
    if (fmt === 'png') {
      renderFrame(savedTime, true);
      const blob = await new Promise(r => target.toBlob(r, 'image/png'));
      download(blob, base + '.png'); toast('PNG saved');
    } else if (fmt === 'gif') {
      // pass 1: sample colours
      setProgress('Analysing colours…', 0);
      const sampleFrames = Math.min(frames, 10);
      const samples = [];
      const stride = Math.max(1, Math.floor(W * H / 6000));
      for (let s = 0; s < sampleFrames; s++) {
        const i = Math.floor(s * frames / sampleFrames);
        renderFrame(i / fps, true);
        const d = ctx.getImageData(0, 0, W, H).data;
        for (let p = 0; p < W * H; p += stride) { const j = p * 4; samples.push(d[j], d[j + 1], d[j + 2]); }
        if (cancelExport) throw new Error('cancelled');
        await nextTick();
      }
      const maxColors = S.export.quality === 'high' ? 256 : S.export.quality === 'med' ? 128 : 64;
      const q = new GIF.Quantizer(Uint8Array.from(samples), maxColors);
      const enc = new GIF.Encoder(W, H, fps, q.palette);
      const t0 = performance.now();
      for (let i = 0; i < frames; i++) {
        renderFrame(i / fps, true);
        const d = ctx.getImageData(0, 0, W, H).data;
        enc.addFrame(q.index(d, W, H, S.export.dither));
        if (i % 2 === 0) { setProgress(`Encoding GIF · frame ${i + 1}/${frames}`, (i + 1) / frames); await nextTick(); }
        if (cancelExport) throw new Error('cancelled');
      }
      const blob = enc.finish();
      download(blob, base + '.gif');
      toast(`GIF saved · ${fmtBytes(blob.size)} · ${((performance.now() - t0) / 1000).toFixed(1)}s`);
    } else {
      await exportVideo(fmt, W, H, fps, frames, base);
    }
  } catch (e) {
    if (e.message === 'cancelled') toast('Export stopped'); else { console.error(e); toast('Export failed: ' + e.message, 5000); }
  } finally {
    exporting = false; playing = wasPlaying; hoverCanvas = savedHover; time = savedTime; last = performance.now();
    ctx = previewCtx; target = outCanvas;
    setRenderSize(savedW, savedH); fitPreview();
    $('#exGo').disabled = false; $('#exCancel').textContent = 'Cancel'; $('#exProg').classList.remove('on');
    if (!cancelExport) modal.classList.remove('open');
  }
}

async function exportVideo(fmt, W, H, fps, frames, base) {
  const bitrate = bitrateFor(W, H, fps, S.export.quality);
  if (webCodecsOK() && ((fmt === 'mp4' && window.Mp4Muxer) || (fmt === 'webm' && window.WebMMuxer))) {
    setProgress('Preparing encoder…', 0);
    const isMp4 = fmt === 'mp4';
    const candidates = isMp4
      ? ['avc1.640033', 'avc1.64002A', 'avc1.640028', 'avc1.4D4028', 'avc1.42E028', 'avc1.42001F']
      : ['vp09.00.51.08', 'vp09.00.40.08', 'vp09.00.31.08', 'vp8'];
    let codec = null;
    for (const c of candidates) {
      try { const r = await VideoEncoder.isConfigSupported({ codec: c, width: W, height: H, bitrate, framerate: fps }); if (r.supported) { codec = c; break; } } catch (e) { /* try next */ }
    }
    if (!codec) {
      if (isMp4) { toast('H.264 encoding is not available in this browser — exporting WebM instead', 4000); return exportVideo('webm', W, H, fps, frames, base); }
      return recordFallback(W, H, fps, frames, base);
    }
    const muxTarget = isMp4 ? new Mp4Muxer.ArrayBufferTarget() : new WebMMuxer.ArrayBufferTarget();
    const muxer = isMp4
      ? new Mp4Muxer.Muxer({ target: muxTarget, video: { codec: 'avc', width: W, height: H }, fastStart: 'in-memory', firstTimestampBehavior: 'offset' })
      : new WebMMuxer.Muxer({ target: muxTarget, video: { codec: codec.startsWith('vp09') ? 'V_VP9' : 'V_VP8', width: W, height: H, frameRate: fps }, firstTimestampBehavior: 'offset' });
    let encError = null;
    const encoder = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: e => { encError = e; } });
    const cfg = { codec, width: W, height: H, bitrate, framerate: fps, latencyMode: 'quality' };
    if (isMp4) cfg.avc = { format: 'avc' };
    encoder.configure(cfg);
    const us = 1e6 / fps;
    for (let i = 0; i < frames; i++) {
      renderFrame(i / fps, true);
      const frame = new VideoFrame(target, { timestamp: Math.round(i * us), duration: Math.round(us) });
      encoder.encode(frame, { keyFrame: i % (fps * 2) === 0 });
      frame.close();
      if (encError) throw encError;
      while (encoder.encodeQueueSize > 6) await nextTick();
      if (i % 2 === 0) { setProgress(`Encoding ${fmt.toUpperCase()} · frame ${i + 1}/${frames}`, (i + 1) / frames); await nextTick(); }
      if (cancelExport) { encoder.close(); throw new Error('cancelled'); }
    }
    setProgress('Finalising…', 1);
    await encoder.flush(); encoder.close();
    muxer.finalize();
    const blob = new Blob([muxTarget.buffer], { type: isMp4 ? 'video/mp4' : 'video/webm' });
    download(blob, `${base}.${fmt}`);
    toast(`${fmt.toUpperCase()} saved · ${fmtBytes(blob.size)}`);
    return;
  }
  return recordFallback(W, H, fps, frames, base);
}

// Real-time fallback using MediaRecorder (when WebCodecs / muxer are unavailable)
async function recordFallback(W, H, fps, frames, base) {
  if (typeof MediaRecorder === 'undefined') throw new Error('This browser cannot encode video. Try Chrome, Edge or Safari.');
  const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  const mime = types.find(t => MediaRecorder.isTypeSupported(t));
  if (!mime) throw new Error('No supported video format for recording.');
  const stream = target.captureStream(0);
  const track = stream.getVideoTracks()[0];
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: bitrateFor(W, H, fps, S.export.quality) });
  const chunks = []; rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  const done = new Promise(r => rec.onstop = r);
  rec.start();
  const frameMs = 1000 / fps;
  for (let i = 0; i < frames; i++) {
    const t0 = performance.now();
    renderFrame(i / fps, true);
    if (track.requestFrame) track.requestFrame();
    setProgress(`Recording (real-time) · ${i + 1}/${frames}`, (i + 1) / frames);
    const wait = Math.max(0, frameMs - (performance.now() - t0));
    await new Promise(r => setTimeout(r, wait));
    if (cancelExport) { rec.stop(); throw new Error('cancelled'); }
  }
  rec.stop(); await done;
  const ext = mime.includes('mp4') ? 'mp4' : 'webm';
  const blob = new Blob(chunks, { type: mime.split(';')[0] });
  download(blob, `${base}.${ext}`);
  toast(`${ext.toUpperCase()} saved (real-time recording) · ${fmtBytes(blob.size)}`);
}

/* ---------- boot ---------- */
(function boot() {
  const restored = restore();
  buildSidebar();
  bindStage(); bindTopbar(); bindExport();
  if (!restored) {
    // a starter text layer so the text feature is discoverable
    addLayer({ text: 'GRADIENT\nSTUDIO', size: 8, letter: 0.04, weight: 800, font: 'Inter' });
  }
  rerenderers.push(() => [...$('#qualitySeg').children].forEach(x => x.classList.toggle('on', +x.dataset.q === S.previewQ)));
  S.text.layers.forEach(l => ensureFont(l.font));
  [...$('#qualitySeg').children].forEach(x => x.classList.toggle('on', +x.dataset.q === S.previewQ));
  refreshAll();
  requestAnimationFrame(t => { last = t; tick(t); });
})();
</script>
