/* ═══════════════════════════════════════════════════════════════════
   COGENTIQ DESIGN SYSTEM  ·  v0.1
   ───────────────────────────────────────────────────────────────────
   Variables and components extracted from the Model hub build, which
   was taken directly off the Figma library (Cogentiq · Builder).
   Token names match the Figma variable names one-for-one, so a value
   changed in Figma maps to exactly one line here.

   USAGE
     Link this stylesheet, then put class="cq" on the body element.
     Dark is the product default; set data-mode="light" on the root
     element to switch.

   Every component is written against tokens only, so both themes come
   free. Never hard-code a colour in a screen; if a value is missing,
   add a token here rather than a literal there.
   ═══════════════════════════════════════════════════════════════════ */


/* ═══════════════════════════════════════════════════════════════════
   1 · TOKENS — DARK  (the default)
   ═══════════════════════════════════════════════════════════════════ */
:root {
  /* ── Backgrounds · page ─────────────────────────────────────── */
  --backgrounds-page-bg-1:            #121212;  /* app ground          */
  --backgrounds-page-bg-2:            #212121;  /* cards, modals       */
  --backgrounds-page-bg-3:            #1b1b1b;  /* tiles, table header */
  --backgrounds-page-bg-4:            #121212;  /* content ground      */

  /* ── Backgrounds · card ─────────────────────────────────────── */
  --backgrounds-card-bg-2:            #212121;
  --backgrounds-card-bg-3:            #323232;
  --backgrounds-card-bg-4:            #323232;  /* hover fill          */
  --backgrounds-card-bg-5:            #1b1b1b;  /* header, sidebar     */

  /* ── Backgrounds · controls ─────────────────────────────────── */
  --backgrounds-button-primary:       #0d99ff;
  --backgrounds-button-tonal-1:       #093077;
  --backgrounds-disabled-tonal-1:     #093077;
  --backgrounds-disabled-tonal-2:     #424242;
  --backgrounds-seg-control-tabs-1:   #424242;
  --backgrounds-checkbox-default:     #1b1b1b;
  --backgrounds-checkbox-focus:       #0d99ff;
  --backgrounds-type-default-bg-1:    #323232;  /* input fill          */
  --backgrounds-type-default-bg-2:    #323232;
  --backgrounds-type-search-default:  #121212;
  --backgrounds-icon-blue-2:          #0d99ff33;
  --backgrounds-table-default:        #121212;
  --backgrounds-table-select:         #0d193f;

  /* ── Backgrounds · tone badges ──────────────────────────────── */
  --backgrounds-badge-blue:           #09112b;
  --backgrounds-badge-cyan:           #051b29;
  --backgrounds-badge-green:          #031d11;
  --backgrounds-badge-indigo:         #0b0f2e;
  --backgrounds-badge-light-green:    #14280c;

  /* ── Strokes ────────────────────────────────────────────────── */
  --strokes-card-default:             #424242;
  --strokes-card-selected:            #0d99ff;
  --strokes-line-1:                   #424242;
  --strokes-line-3:                   #323232;  /* hairline divider    */
  --strokes-type-default:             #424242;
  --strokes-type-focus:               #007be5;
  --strokes-checkbox-default:         #616161;
  --strokes-checkbox-focus:           #0d99ff;
  --strokes-icon-default:             #9e9e9e;
  --strokes-colour-blue:              #093077;
  --strokes-colour-cyan:              #093c53;
  --strokes-colour-green:             #0a3a22;
  --strokes-colour-indigo:            #2b3180;
  --strokes-colour-light-green:       #214314;

  /* ── Text ───────────────────────────────────────────────────── */
  --text-primary:                     #ffffff;
  --text-secondary:                   #bdbdbd;
  --text-teritiary:                   #8c8c8c;  /* spelling per Figma  */
  --text-button-white:                #ffffff;
  --text-button-tonal-1:              #80caff;
  --text-button-tonal-2:              #bdbdbd;
  --text-disabled-tonal-1:            #0768cf;
  --text-disabled-tonal-2:            #757575;
  --text-coloured-blue:               #44aaf3;
  --text-coloured-cyan:               #35caf0;
  --text-coloured-green:              #85e0a3;
  --text-coloured-indigo:             #a0a5f7;
  --text-coloured-light-green:        #7cb342;

  /* ── Effects ────────────────────────────────────────────────── */
  --scrim:          rgba(18, 18, 18, .6);
  --shadow-card:    drop-shadow(0 1px 1.5px rgba(18, 18, 18, .16));
  --shadow-bar:     drop-shadow(0 1px 1px rgba(18, 18, 18, .12));
  --shadow-sidebar: drop-shadow(1px 0 1px rgba(18, 18, 18, .12));
  --shadow-tab:     0 1px 2px rgba(33, 33, 33, .2);
  --shadow-modal:   0 4px 12px rgba(33, 33, 33, .16);
  --shadow-panel:   -8px 0 24px rgba(0, 0, 0, .2);
  --shadow-rail:    8px 0 28px rgba(0, 0, 0, .38);
  --shadow-pop:     0 -1px 2px rgba(0, 0, 0, .04), 0 4px 8px rgba(0, 0, 0, .12), 0 2px 16px rgba(33, 33, 33, .16);
  /* For a surface that floats over another panel. A shadow tuned for white
     ground all but vanishes on a dark one, so this is deliberately heavier
     than --shadow-pop — it is what gives the Tiq bar its hierarchy. */
  /* Carries the Marketplace pill past where its fixed-size art reaches: the
     art is drawn for the 36px tile, so at 208px the right end runs out.
     Transparent under the art, so the crunched tile is untouched. Light is
     sampled from the component (Figma names the fill Gradient/blue but
     returns no value); dark is derived in the art's own family. */
  --gradient-blue-wash: linear-gradient(90deg, rgba(62, 99, 116, 0) 46%, rgba(62, 99, 116, 1) 86%);
  --shadow-tiq:     0 2px 6px rgba(0, 0, 0, .40), 0 14px 32px rgba(0, 0, 0, .52), 0 28px 64px rgba(0, 0, 0, .40);

  /* The exported OpenAI mark is one shape, so it inverts per theme. */
  --logo-openai: #ffffff;

  /* ── Palette ramps · identical in both themes ───────────────── */
  --blue-300: #bde3ff;   --blue-500: #0d99ff;   --blue-600: #007be5;
  --indigo-300: #c2c5fa; --indigo-500: #5860ed; --indigo-600: #454de0;
  --purple-300: #e4ccff; --purple-400: #d9b8ff; --purple-500: #9747ff; --purple-600: #8638e5;
  /* A palette value, not a theme colour: white in both modes, which is
     what a glyph sitting on a coloured tile wants. */
  --white: #ffffff;
  --orange-300: #fcd19c; --orange-600: #fc9e24; --orange-800: #dd7c0e;
  --green-300: #aff4c6;  --green-500: #14ae5c;  --green-600: #009951;
  --cyan-400:  #75d7f0;
  --flag-sheen: rgba(255, 255, 255, .30);
  /* The coach-mark sheen, keyed off the tile it sits on. */
  --coach-sheen: rgba(255, 255, 255, .28);

  /* ── Type ───────────────────────────────────────────────────── */
  --font-geist:      "Geist", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-geist-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --fs-caption: 12px;
  --fs-body-3:  14px;
  --fs-body-2:  16px;
  --lh-body-3:  20px;
  --lh-body-2:  24px;

  /* ── Radius · the four the product actually uses ────────────── */
  --radius-sm:   6px;   /* tags, small tiles     */
  --radius-md:   8px;   /* buttons, inputs       */
  --radius-lg:  12px;   /* cards, modals, pills  */
  --radius-xl:  14px;   /* floating prompt bars  */
  --radius-full: 9999px;

  /* ── Layout constants ───────────────────────────────────────── */
  --rail-w:    68px;
  --rail-w-open: 240px;
  --sidebar-w: 240px;
  --panel-w:   420px;
  --tiq-dock-w: 360px;
  --card-h:    120px;
}

/* ═══════════════════════════════════════════════════════════════════
   2 · TOKENS — LIGHT
   Only the themed values are restated; ramps, type and layout above
   are theme-independent and must not be duplicated here.
   ═══════════════════════════════════════════════════════════════════ */
:root[data-mode="light"] {
  --backgrounds-page-bg-1:            #fafafa;
  --backgrounds-page-bg-2:            #ffffff;
  --backgrounds-page-bg-3:            #f5f5f5;
  --backgrounds-page-bg-4:            #f0f0f0;

  --backgrounds-card-bg-2:            #ffffff;
  --backgrounds-card-bg-3:            #ffffff;
  --backgrounds-card-bg-4:            #f5f5f5;
  --backgrounds-card-bg-5:            #ffffff;

  --backgrounds-button-primary:       #0d99ff;
  --backgrounds-button-tonal-1:       #e5f4ff;
  --backgrounds-disabled-tonal-1:     #e5f4ff;
  --backgrounds-disabled-tonal-2:     #eeeeee;
  --backgrounds-seg-control-tabs-1:   #eeeeee;
  --backgrounds-checkbox-default:     #ffffff;
  --backgrounds-checkbox-focus:       #0d99ff;
  --backgrounds-type-default-bg-1:    #f5f5f5;
  --backgrounds-type-default-bg-2:    #ffffff;
  --backgrounds-type-search-default:  #f5f5f5;
  --backgrounds-icon-blue-2:          #0d99ff33;
  --backgrounds-table-default:        #ffffff;
  --backgrounds-table-select:         #e5f4ff;

  --backgrounds-badge-blue:           #f2f9ff;
  --backgrounds-badge-cyan:           #effcff;
  --backgrounds-badge-green:          #ebffee;
  --backgrounds-badge-indigo:         #f0f1fe;
  --backgrounds-badge-light-green:    #f1f8e9;

  --strokes-card-default:             #eeeeee;
  --strokes-card-selected:            #0d99ff;
  --strokes-line-1:                   #eeeeee;
  --strokes-line-3:                   #f5f5f5;
  --strokes-type-default:             #e0e0e0;
  --strokes-type-focus:               #0d99ff;
  --strokes-checkbox-default:         #bdbdbd;
  --strokes-checkbox-focus:           #0d99ff;
  --strokes-icon-default:             #616161;
  --strokes-colour-blue:              #e5f4ff;
  --strokes-colour-cyan:              #cef0f8;
  --strokes-colour-green:             #aff4c6;
  --strokes-colour-indigo:            #c2c5fa;
  --strokes-colour-light-green:       #c5e1a5;

  --text-primary:                     #121212;
  --text-secondary:                   #616161;
  --text-teritiary:                   #8c8c8c;
  --text-button-white:                #ffffff;
  --text-button-tonal-1:              #007be5;
  --text-button-tonal-2:              #757575;
  --text-disabled-tonal-1:            #80caff;
  --text-disabled-tonal-2:            #bdbdbd;
  --text-coloured-blue:               #0d99ff;
  --text-coloured-cyan:               #00a2c2;
  --text-coloured-green:              #14ae5c;
  --text-coloured-indigo:             #5860ed;
  --text-coloured-light-green:        #689f38;

  --scrim:          rgba(18, 18, 18, .45);
  --shadow-card:    drop-shadow(0 1px 1.5px rgba(18, 18, 18, .08));
  --shadow-bar:     drop-shadow(0 1px 1px rgba(18, 18, 18, .06));
  --shadow-sidebar: drop-shadow(1px 0 1px rgba(18, 18, 18, .06));
  --shadow-tab:     0 1px 2px rgba(33, 33, 33, .12);
  --shadow-modal:   0 4px 12px rgba(33, 33, 33, .12);
  --shadow-panel:   -8px 0 24px rgba(18, 18, 18, .12);
  --shadow-rail:    8px 0 28px rgba(18, 18, 18, .14);
  --shadow-pop:     0 -1px 2px rgba(0, 0, 0, .04), 0 4px 8px rgba(18, 18, 18, .08), 0 2px 16px rgba(33, 33, 33, .10);
  --gradient-blue-wash: linear-gradient(90deg, rgba(188, 235, 249, 0) 46%, rgba(188, 235, 249, 1) 86%);
  --flag-sheen: rgba(13, 153, 255, .28);
  --coach-sheen: rgba(13, 153, 255, .30);
  --shadow-tiq:     0 2px 6px rgba(18, 18, 18, .06), 0 12px 28px rgba(18, 18, 18, .14), 0 24px 56px rgba(33, 33, 33, .10);

  --logo-openai: #121212;
}

/* ═══════════════════════════════════════════════════════════════════
   3 · BASE
   ═══════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; }

/* Put .cq on the body, or on a wrapper when the body is not yours. */
.cq {
  background: var(--backgrounds-page-bg-1);
  color: var(--text-primary);
  font-family: var(--font-geist);
  -webkit-font-smoothing: antialiased;
}
body.cq { margin: 0; }
/* Wrapped in :where() so the reset carries ZERO specificity. A plain
   `.cq button` selector is (0,1,1) and silently outranks a (0,1,0)
   component class — which is how a component that sets its own
   background ends up transparent. Keep new resets in :where() too. */
:where(.cq button) { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:where(.cq input, .cq textarea, .cq select) { font: inherit; color: inherit; background: none; border: 0; outline: 0; }
.cq :focus-visible { outline: 2px solid var(--strokes-type-focus); outline-offset: 2px; }

/* ═══════════════════════════════════════════════════════════════════
   4 · TYPE RAMP
   Named after the Figma text styles. Use these rather than setting
   font-size ad hoc — the ramp is the whole scale the product uses.
   ═══════════════════════════════════════════════════════════════════ */
.cq-subhead1-med { font: 500 24px/32px var(--font-geist); letter-spacing: -0.96px; }
.cq-subhead2-med { font: 500 18px/24px var(--font-geist); letter-spacing: -0.72px; }
.cq-body1-med    { font: 500 var(--fs-body-2)/var(--lh-body-2) var(--font-geist); letter-spacing: -0.64px; }
.cq-body1-reg    { font: 400 var(--fs-body-2)/var(--lh-body-2) var(--font-geist); letter-spacing: -0.64px; }
.cq-body2-med    { font: 500 var(--fs-body-3)/var(--lh-body-3) var(--font-geist); letter-spacing: -0.56px; }
.cq-body2-reg    { font: 400 var(--fs-body-3)/var(--lh-body-3) var(--font-geist); letter-spacing: -0.56px; }
.cq-caption-med  { font: 500 var(--fs-caption)/var(--fs-body-2) var(--font-geist); letter-spacing: -0.24px; }
.cq-caption-reg  { font: 400 var(--fs-caption)/var(--fs-body-2) var(--font-geist); letter-spacing: -0.24px; }
.cq-mono         { font: 400 11px/1 var(--font-geist-mono); letter-spacing: -0.11px; }

.cq-text-primary   { color: var(--text-primary); }
.cq-text-secondary { color: var(--text-secondary); }
.cq-text-tertiary  { color: var(--text-teritiary); }

/* ═══════════════════════════════════════════════════════════════════
   5 · BUTTONS
   Figma strokes sit INSIDE the box, so every bordered control below
   carries an explicit height. Without it a 1px border grows the
   control 2px past its designed size.
   ═══════════════════════════════════════════════════════════════════ */
.cq-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  height: 36px; padding: 0 12px;
  border-radius: var(--radius-md);
  font: 500 var(--fs-body-3)/var(--lh-body-3) var(--font-geist); letter-spacing: -0.56px;
  white-space: nowrap;
  transition: background .15s ease, filter .15s ease, color .15s ease;
}
.cq-btn--sm { height: 32px; }
.cq-btn--wide { width: 140px; }

.cq-btn--primary { background: var(--backgrounds-button-primary); color: var(--text-button-white); }
.cq-btn--primary:hover { filter: brightness(1.08); }

.cq-btn--tonal { background: var(--backgrounds-button-tonal-1); color: var(--text-button-tonal-1); }
.cq-btn--tonal:hover { filter: brightness(1.18); }

.cq-btn--ghost { color: var(--text-secondary); }
.cq-btn--ghost:hover { background: var(--backgrounds-card-bg-4); color: var(--text-primary); }

.cq-btn:disabled,
.cq-btn[aria-disabled="true"] {
  background: var(--backgrounds-disabled-tonal-2);
  color: var(--text-disabled-tonal-2);
  cursor: not-allowed; filter: none;
}

/* Icon-only. 32px is the default; --sm is the 24px in-card size. */
.cq-icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: var(--radius-md);
  color: var(--text-teritiary);
  transition: background .15s ease, color .15s ease;
}
.cq-icon-btn--sm { width: 24px; height: 24px; border-radius: var(--radius-sm); }
.cq-icon-btn:hover { background: var(--backgrounds-card-bg-4); color: var(--text-primary); }

/* ═══════════════════════════════════════════════════════════════════
   6 · FORM FIELDS
   ═══════════════════════════════════════════════════════════════════ */
.cq-field { display: flex; flex-direction: column; gap: 4px; }
.cq-field__label {
  color: var(--text-primary);
  font: 400 var(--fs-body-3)/var(--lh-body-3) var(--font-geist); letter-spacing: -0.56px;
}
.cq-field__label-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

.cq-control {
  width: 100%;
  display: flex; align-items: center; gap: 8px;
  padding: 12px; border-radius: var(--radius-md);
  background: var(--backgrounds-type-default-bg-1);
  border: 1px solid var(--strokes-type-default);
  color: var(--text-primary);
  transition: border-color .15s ease;
}
.cq-control:focus-within { border-color: var(--strokes-type-focus); }
/* The control's own border-color already answers :focus-visible's job;
   left alone, the field's native outline draws a second blue box just
   inside that border, hugging the text — the two together read as one
   focus state that's been drawn twice, not one that's drawn clearly. */
.cq-control > input:focus-visible,
.cq-control > select:focus-visible,
.cq-control > textarea:focus-visible { outline: none; }
.cq-control > input,
.cq-control > select,
.cq-control > textarea {
  flex: 1 1 auto; min-width: 0;
  color: var(--text-primary);
  font: 400 var(--fs-body-3)/var(--lh-body-3) var(--font-geist); letter-spacing: -0.56px;
}
.cq-control input::placeholder,
.cq-control textarea::placeholder { color: var(--text-teritiary); }
.cq-control select { appearance: none; cursor: pointer; }
.cq-control select option { background: var(--backgrounds-page-bg-2); color: var(--text-primary); }
.cq-control--textarea { align-items: flex-start; height: 96px; }
.cq-control--textarea textarea { resize: none; height: 72px; }
.cq-control .cq-ic { color: var(--text-teritiary); flex: none; }

/* Search — a lighter field used in bars and popovers. */
.cq-search {
  display: flex; align-items: center; gap: 8px;
  height: 36px; padding: 0 12px; border-radius: var(--radius-md);
  background: var(--backgrounds-type-search-default);
  border: 1px solid var(--strokes-type-default);
  color: var(--text-teritiary);
  transition: border-color .15s ease;
}
.cq-search--sm { height: 32px; }
.cq-search:focus-within { border-color: var(--strokes-type-focus); }
/* Same reasoning as .cq-control above — the field's own outline would
   double the border it sits inside. */
.cq-search input:focus-visible { outline: none; }
.cq-search input { flex: 1 1 auto; min-width: 0; color: var(--text-primary); }
.cq-search input::placeholder { color: var(--text-teritiary); }

/* Checkbox */
.cq-checkbox {
  width: 16px; height: 16px; flex: none; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  background: var(--backgrounds-checkbox-default);
  border: 1px solid var(--strokes-checkbox-default);
}
.cq-checkbox > svg { display: none; width: 12px; height: 12px; color: #fff; }
.is-checked > .cq-checkbox,
.cq-checkbox.is-checked {
  background: var(--backgrounds-checkbox-focus);
  border-color: var(--backgrounds-checkbox-focus);
}
.is-checked > .cq-checkbox > svg,
.cq-checkbox.is-checked > svg { display: block; }

/* Range — set --fill (a %) to colour the track up to the thumb. */
.cq-range {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 6px; padding: 0; margin: 0;
  border-radius: var(--radius-full); cursor: pointer;
  background: linear-gradient(to right,
    var(--backgrounds-button-primary) 0 var(--fill, 35%),
    var(--strokes-card-default) var(--fill, 35%) 100%);
}
.cq-range::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--backgrounds-button-primary);
  border: 2px solid var(--text-button-white);
  box-shadow: var(--shadow-card);
}
.cq-range::-moz-range-thumb {
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--backgrounds-button-primary);
  border: 2px solid var(--text-button-white);
}

/* ═══════════════════════════════════════════════════════════════════
   7 · FILTER DROPDOWN + POPOVER
   ═══════════════════════════════════════════════════════════════════ */
.cq-filter-group { position: relative; }

.cq-dropdown {
  height: 32px;
  display: inline-flex; align-items: center; gap: 4px;
  padding: 0 8px 0 12px; border-radius: var(--radius-md);
  background: var(--backgrounds-card-bg-5);
  border: 1px solid var(--strokes-line-3);
  color: var(--text-secondary);
  font: 400 var(--fs-body-3)/var(--lh-body-3) var(--font-geist); letter-spacing: -0.56px;
  white-space: nowrap;
}
.cq-dropdown:hover { border-color: var(--strokes-line-1); }
.cq-dropdown.is-open { border-color: var(--strokes-checkbox-focus); }
.cq-dropdown .cq-ic { color: var(--text-teritiary); }
.cq-dropdown__badge {
  display: none;
  min-width: 20px; height: 20px; align-items: center; justify-content: center;
  padding: 0 4px; border-radius: var(--radius-md);
  background: var(--backgrounds-badge-blue);
  border: 1px solid var(--strokes-colour-blue);
  color: var(--text-coloured-blue);
  font: 400 var(--fs-caption)/var(--fs-body-2) var(--font-geist); letter-spacing: -0.24px;
}
.cq-dropdown.has-count .cq-dropdown__badge { display: flex; }

.cq-pop {
  position: absolute; top: 36px; left: 0; z-index: 40; width: 277px;
  max-width: calc(100vw - 32px);
  display: none; flex-direction: column;
  padding: 4px 0 8px;
  background: var(--backgrounds-card-bg-3);
  border: 1px solid var(--strokes-card-default);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-pop);
}
.cq-pop.is-open { display: flex; }
.cq-pop__head { display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
.cq-pop__list { display: flex; flex-direction: column; padding: 0 8px; max-height: 288px; overflow-y: auto; }
.cq-pop__empty { padding: 10px 16px 14px; color: var(--text-teritiary); }

/* One row in a popover — checkbox multi-select or tick single-select. */
.cq-option {
  width: 100%; height: 36px;
  display: flex; align-items: center; gap: 8px;
  padding: 0 16px; border-radius: var(--radius-md);
  color: var(--text-secondary);
  font: 400 var(--fs-body-3)/var(--lh-body-3) var(--font-geist); letter-spacing: -0.56px;
  text-align: left;
}
.cq-option:hover { background: var(--backgrounds-card-bg-4); }
.cq-option.is-checked, .cq-option.is-picked { color: var(--text-primary); }
.cq-option__label { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cq-option__tick { display: none; flex: none; color: var(--text-coloured-blue); }
.cq-option.is-picked .cq-option__tick { display: block; }

/* ═══════════════════════════════════════════════════════════════════
   8 · TAGS, BADGES & PILLS
   Five semantic tones. Set data-tone on the element; the tone drives
   text colour on .cq-tag and text + fill + stroke on .cq-badge.
   ═══════════════════════════════════════════════════════════════════ */

/* Category tag — grey at rest, coloured on an interactive parent that
   carries .cq-tint (cards and table rows apply it on hover/select). */
.cq-tag {
  height: 16px;
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0 6px; border-radius: var(--radius-sm);
  border: 1px solid var(--strokes-line-1);
  font: 400 11px/1 var(--font-geist-mono); letter-spacing: -0.11px;
  color: var(--text-teritiary);
  white-space: nowrap;
  transition: color .15s ease;
}
/* Model-id pill — always neutral, rounder, on the page ground. */
.cq-tag--model {
  border-radius: var(--radius-lg); padding: 0 8px;
  background: var(--backgrounds-page-bg-1);
  border-color: var(--strokes-card-default);
}

.cq-tag[data-tone="blue"].is-tinted,        .cq-tint:hover .cq-tag[data-tone="blue"],        .cq-tint.is-selected .cq-tag[data-tone="blue"]        { color: var(--text-coloured-blue); }
.cq-tag[data-tone="indigo"].is-tinted,      .cq-tint:hover .cq-tag[data-tone="indigo"],      .cq-tint.is-selected .cq-tag[data-tone="indigo"]      { color: var(--text-coloured-indigo); }
.cq-tag[data-tone="green"].is-tinted,       .cq-tint:hover .cq-tag[data-tone="green"],       .cq-tint.is-selected .cq-tag[data-tone="green"]       { color: var(--text-coloured-green); }
.cq-tag[data-tone="cyan"].is-tinted,        .cq-tint:hover .cq-tag[data-tone="cyan"],        .cq-tint.is-selected .cq-tag[data-tone="cyan"]        { color: var(--text-coloured-cyan); }
.cq-tag[data-tone="light-green"].is-tinted, .cq-tint:hover .cq-tag[data-tone="light-green"], .cq-tint.is-selected .cq-tag[data-tone="light-green"] { color: var(--text-coloured-light-green); }

/* Filled tone badge — used where the tag must read without a hover. */
.cq-badge {
  height: 18px;
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0 6px; border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font: 400 var(--fs-caption)/1 var(--font-geist-mono); letter-spacing: -0.12px;
  white-space: nowrap;
}
.cq-badge[data-tone="blue"]        { background: var(--backgrounds-badge-blue);        border-color: var(--strokes-colour-blue);        color: var(--text-coloured-blue); }
.cq-badge[data-tone="indigo"]      { background: var(--backgrounds-badge-indigo);      border-color: var(--strokes-colour-indigo);      color: var(--text-coloured-indigo); }
.cq-badge[data-tone="green"]       { background: var(--backgrounds-badge-green);       border-color: var(--strokes-colour-green);       color: var(--text-coloured-green); }
.cq-badge[data-tone="cyan"]        { background: var(--backgrounds-badge-cyan);        border-color: var(--strokes-colour-cyan);        color: var(--text-coloured-cyan); }
.cq-badge[data-tone="light-green"] { background: var(--backgrounds-badge-light-green); border-color: var(--strokes-colour-light-green); color: var(--text-coloured-light-green); }

/* Count pill — the "32" beside a page title. */
.cq-count {
  height: 24px;
  display: inline-flex; align-items: center; gap: 4px; padding: 0 6px;
  border-radius: var(--radius-md);
  background: var(--backgrounds-card-bg-4);
  border: 1px solid var(--strokes-type-default);
  color: var(--text-teritiary);
  font: 400 var(--fs-caption)/var(--fs-body-2) var(--font-geist); letter-spacing: -0.24px;
}

/* Status pill — semantic, always reads without hover. */
.cq-status {
  height: 24px;
  display: inline-flex; align-items: center; gap: 4px; padding: 0 8px;
  border-radius: var(--radius-lg);
  background: var(--backgrounds-badge-green);
  color: var(--text-coloured-green);
  font: 500 var(--fs-caption)/var(--fs-body-2) var(--font-geist); letter-spacing: -0.24px;
}
.cq-status--dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }

/* Provider pill — logo + vendor + model id, split by a hairline. */
.cq-provider-pill {
  height: 24px;
  display: inline-flex; align-items: center; gap: 4px; padding: 0 8px;
  border-radius: var(--radius-lg);
  background: var(--backgrounds-card-bg-4);
  border: 1px solid var(--strokes-line-3);
  color: var(--text-secondary);
  font: 400 var(--fs-caption)/var(--fs-body-2) var(--font-geist); letter-spacing: -0.24px;
}
.cq-provider-pill__divider { width: 1px; height: 14px; background: var(--strokes-line-1); flex: none; }

/* ═══════════════════════════════════════════════════════════════════
   9 · AVATAR
   ═══════════════════════════════════════════════════════════════════ */
.cq-avatar {
  position: relative; flex: none;
  width: 20px; height: 20px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--indigo-500);
  color: #fff;
  font: 400 var(--fs-caption)/var(--fs-body-2) var(--font-geist); letter-spacing: -0.24px;
}
.cq-avatar--lg { width: 32px; height: 32px; font-size: var(--fs-body-3); }
.cq-avatar img { width: 100%; height: 100%; border-radius: 50%; display: block; }

/* Logo tile — a provider mark centred on a rounded ground. */
.cq-logo-tile {
  width: 32px; height: 32px; flex: none;
  border-radius: var(--radius-sm); overflow: hidden;
  background: var(--backgrounds-page-bg-3);
  display: flex; align-items: center; justify-content: center;
  color: var(--logo-openai);
}
.cq-logo-tile--sm { width: 16px; height: 16px; border-radius: 4px; background: none; }
.cq-logo-tile img, .cq-logo-tile svg { display: block; }

/* Hovering a card eases its mark up a touch inside the tile. Only the mark
   moves — the tile ground is page/bg-3, the same #f5f5f5 as card/bg-4 in
   light mode, so animating the ground would be invisible in that theme.
   Scoped to .cq-card because a card mark sits at 24px inside the 32px tile
   and has room to grow; table rows fill the tile edge to edge, where any
   scale would clip against `overflow: hidden`. */
.cq-logo-tile > * { transition: transform .34s cubic-bezier(.22, .61, .36, 1); }
.cq-card:hover .cq-logo-tile > * { transform: translateY(-1px) scale(1.06); }

/* ══════════════════════════════════════════════════════════════════
   10 · CARD
   ══════════════════════════════════════════════════════════════════ */
.cq-card {
  width: 100%; height: var(--card-h);
  display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
  padding: 16px; border-radius: var(--radius-lg);
  background: var(--backgrounds-page-bg-2);
  border: 1px solid transparent;
  filter: var(--shadow-card);
  text-align: left;
  transition: border-color .15s ease, background .15s ease;
}
.cq-card:hover { border-color: var(--strokes-line-1); }
.cq-card.is-selected, .cq-card.is-selected:hover { border-color: var(--strokes-type-focus); }
.cq-card__head { width: 100%; display: flex; flex-direction: column; gap: 4px; }
.cq-card__title-row { width: 100%; display: flex; align-items: center; gap: 8px; padding: 2px 0; }
.cq-card__title { color: var(--text-primary); }
.cq-card__desc {
  width: 100%;
  font: 400 12px/16px var(--font-geist); letter-spacing: -0.24px;
  color: var(--text-teritiary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  transition: color .15s ease;
}
.cq-card:hover .cq-card__desc, .cq-card.is-selected .cq-card__desc { color: var(--text-secondary); }
.cq-card__foot { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cq-card__tags { display: flex; align-items: center; gap: 6px; min-width: 0; }

/* ══════════════════════════════════════════════════════════════════
   11 · TABLE
   Column widths are the screen's business — set --cq-cols per table.
   ══════════════════════════════════════════════════════════════════ */
.cq-table {
  --cq-cols: 360px minmax(140px, 1fr) 200px 160px minmax(120px, 1fr) 100px;
  border: 1px solid var(--strokes-line-3);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.cq-thead, .cq-row { display: grid; grid-template-columns: var(--cq-cols); align-items: center; }
.cq-thead { height: 32px; background: var(--backgrounds-page-bg-3); }
.cq-thead > * {
  padding: 8px 12px; color: var(--text-secondary);
  font: 500 var(--fs-caption)/var(--fs-body-2) var(--font-geist); letter-spacing: -0.24px;
}
.cq-row {
  width: 100%; height: 66px;
  background: var(--backgrounds-table-default);
  border-top: 1px solid var(--strokes-line-3);
  text-align: left; cursor: pointer;
  transition: background .15s ease;
}
.cq-row:hover { background: var(--backgrounds-page-bg-3); }
.cq-row.is-selected {
  background: var(--backgrounds-table-select);
  box-shadow: inset 3px 0 0 var(--strokes-card-selected);
}
.cq-cell { min-width: 0; padding: 12px; display: flex; align-items: center; gap: 8px; }
.cq-cell--muted { color: var(--text-teritiary); }

/* ══════════════════════════════════════════════════════════════════
   11b · PAGE SHELL
   The frame every module page shares. Widths and surfaces here are
   fixed across modules — see the page guidelines for what may vary.
   ══════════════════════════════════════════════════════════════════ */
/* The gutter is constant because .cq-rail overlays rather than pushes. */
.cq-page {
  display: flex; height: 100vh; padding-left: var(--rail-w);
  background: var(--backgrounds-page-bg-1);
}

.cq-page__rail {
  width: var(--rail-w); flex: none;
  display: flex; flex-direction: column; align-items: flex-start; gap: 16px;
  padding: 8px 16px; overflow: hidden;
  background: var(--backgrounds-page-bg-1);
}

/* The frame is inset 8px from the rail and the window edges, which is
   what gives the product its floating-panel look. */
.cq-page__main { flex: 1 1 auto; min-width: 0; padding: 8px 8px 8px 0; }
.cq-page__frame {
  height: 100%;
  display: flex; flex-direction: column;
  border: 1px solid var(--strokes-line-3);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.cq-page__header {
  flex: none; height: 48px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 16px;
  background: var(--backgrounds-card-bg-5);
  border-bottom: 1px solid var(--strokes-line-3);
}

.cq-page__body { flex: 1 1 auto; min-height: 0; display: flex; }

.cq-page__sidebar {
  width: var(--sidebar-w); flex: none;
  padding: 20px 12px 24px;
  background: var(--backgrounds-card-bg-5);
  border-right: 1px solid var(--strokes-line-3);
  overflow-y: auto;
  filter: var(--shadow-sidebar);
}

.cq-page__col { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }

.cq-page__bar {
  flex: none; height: 60px;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 24px;
  background: var(--backgrounds-card-bg-5);
  border-bottom: 1px solid var(--strokes-line-3);
  filter: var(--shadow-bar);
}

.cq-page__content {
  flex: 1 1 auto; min-height: 0; overflow-y: auto;
  padding: 16px 24px 24px;
  background: var(--backgrounds-page-bg-4);
}

/* Card grid — set --cq-card-min per module to choose the column count.
   At the standard 1076px content width: 430px gives 2 up, 340px gives
   3 up. auto-fill means both drop a column on a narrow window rather
   than squeezing. */
.cq-card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(var(--cq-card-min, 430px), 1fr));
  gap: 12px;
}
.cq-card-grid[hidden] { display: none; }
.cq-card-grid--3up { --cq-card-min: 340px; }

/* A card whose height follows its content, for modules that carry more
   or less than the model card's fixed three rows. */
.cq-card--auto { height: auto; min-height: var(--card-h); }

/* ══════════════════════════════════════════════════════════════════
   12 · SEGMENTED CONTROLS
   ══════════════════════════════════════════════════════════════════ */
/* Text tabs — panel sections, wizard steps. */
.cq-seg {
  position: relative;
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px; border-radius: var(--radius-lg);
  background: var(--backgrounds-seg-control-tabs-1);
}
/* The sliding highlight — optional. Give the segment a
   <span class="cq-seg__thumb"></span> as its first child and keep it
   synced with cqSegSync() (utilities, below) whenever the active button
   changes; it then glides to the new button instead of the plain fade
   every segment gets for free. Sized and positioned entirely by JS
   because a segment's buttons are whatever width their own labels make
   them — there is no fixed geometry to give the thumb in CSS alone. */
.cq-seg__thumb {
  position: absolute; top: 4px; left: 4px; height: calc(100% - 8px);
  border-radius: var(--radius-md);
  background: var(--backgrounds-card-bg-2);
  box-shadow: var(--shadow-tab);
  transition: transform .28s cubic-bezier(.4, 0, .2, 1), width .28s cubic-bezier(.4, 0, .2, 1);
  pointer-events: none;
}
@media (prefers-reduced-motion: reduce) {
  .cq-seg__thumb { transition: none; }
}
.cq-seg > button {
  position: relative; z-index: 1;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 4px 8px; border-radius: var(--radius-md);
  color: var(--text-button-tonal-2);
  font: 500 var(--fs-body-3)/var(--lh-body-3) var(--font-geist); letter-spacing: -0.56px;
  white-space: nowrap;
  transition: background .2s ease, color .2s ease, box-shadow .2s ease;
}
.cq-seg > button.is-active {
  background: var(--backgrounds-card-bg-2);
  color: var(--text-primary);
  box-shadow: var(--shadow-tab);
}
/* A thumb already paints the highlight; without this the active button's
   own background would double up on top of it. */
.cq-seg:has(.cq-seg__thumb) > button.is-active { background: none; box-shadow: none; }
/* Numbered step variant sits on the same base, with grey idle labels. */
.cq-seg--steps > button { color: var(--text-teritiary); }

/* Icon toggle — view switchers. Active reads blue-on-tint. */
.cq-seg--icon {
  gap: 4px; padding: 4px; border-radius: 10px;
  background: var(--backgrounds-page-bg-2);
}
.cq-seg--icon > button {
  padding: 4px; border-radius: var(--radius-md);
  color: var(--text-teritiary);
}
.cq-seg--icon > button.is-active {
  background: var(--backgrounds-icon-blue-2);
  color: var(--text-coloured-blue);
  box-shadow: none;
}

/* ══════════════════════════════════════════════════════════════════
   13 · NAVIGATION
   ══════════════════════════════════════════════════════════════════ */
.cq-nav-item {
  width: 100%; height: 36px;
  display: flex; align-items: center; gap: 6px;
  padding: 0 12px; border-radius: var(--radius-md);
  border: 1px solid transparent;
  color: var(--text-teritiary);
  font: 400 var(--fs-body-3)/var(--lh-body-3) var(--font-geist); letter-spacing: -0.56px;
  text-align: left;
  transition: background .15s ease, color .15s ease;
}
.cq-nav-item__label { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cq-nav-item:hover { background: var(--backgrounds-card-bg-4); }
.cq-nav-item.is-active {
  background: var(--backgrounds-table-select);
  border-color: var(--strokes-colour-blue);
  color: var(--text-coloured-blue);
  font-weight: 500;
}
.cq-nav-item.is-active:hover { background: var(--backgrounds-table-select); }

/* ── Platform panel (left rail) ─────────────────────────────
   Two variants of one component: crunched at 68px and opened at
   240px. Content width is the only real difference — 36px vs 208px
   — so the same rules drive both and the labels simply appear. Each
   row is `justify-content: center` with 8px padding, which puts the
   icon at x=10 in a 36px box and at x=8 once a label flexes beside
   it: exactly the two positions the component specifies. ───────── */
/* Fixed, and the page keeps a constant 68px gutter for it, so opening
   the panel lays it over the content instead of reflowing the whole
   page for a hover. Above the scrim so it stays reachable while the
   detail panel is open, below the Tiq bar. */
.cq-rail {
  position: fixed; left: 0; top: 0; bottom: 0; z-index: 80;
  width: var(--rail-w);
  background: var(--backgrounds-page-bg-1);
  display: flex; flex-direction: column; align-items: stretch; gap: 16px;
  padding: 8px 16px;
  overflow-x: hidden; overflow-y: auto;
  transition: width .26s cubic-bezier(.4, 0, .2, 1), box-shadow .26s ease;
}
.cq-rail.is-open { width: var(--rail-w-open); box-shadow: var(--shadow-rail); }
.cq-rail::-webkit-scrollbar { width: 0; }

/* Labels are laid out at their real width the whole time and clipped
   by the rail; animating width instead would reflow every row. */
.cq-rail-lbl {
  flex: 1 1 auto; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  text-align: left;
  font: 400 var(--fs-body-3)/var(--lh-body-3) var(--font-geist); letter-spacing: -0.56px;
  color: var(--text-primary);
}
.cq-rail:not(.is-open) .cq-rail-lbl { display: none; }

/* ── Header: logo, wordmark, collapse ── */
.cq-rail-head {
  flex: none; display: flex; align-items: center; justify-content: space-between;
  gap: 6px; padding: 8px 0;
}
.cq-rail-brand { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1 1 auto; }
.cq-rail:not(.is-open) .cq-rail-brand { justify-content: center; }
.cq-rail-logo {
  position: relative; flex: none;
  width: 32px; height: 32px; border-radius: 100px; overflow: hidden;
  background: var(--backgrounds-page-bg-2);
  display: flex; align-items: center; justify-content: center;
  color: var(--strokes-icon-default);
}
.cq-rail-wordmark {
  font: 500 18px/24px var(--font-geist); letter-spacing: -0.72px;
  color: var(--text-primary);
}
.cq-rail-collapse {
  flex: none; width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  color: var(--strokes-icon-default);
  transition: color .15s ease;
}
.cq-rail-collapse:hover { color: var(--text-primary); }
.cq-rail:not(.is-open) .cq-rail-collapse { display: none; }

.cq-rail-group { display: flex; flex-direction: column; align-items: stretch; gap: 12px; }

/* ── Marketplace ── */
.cq-rail-market {
  position: relative;
  width: 100%; height: 36px; flex: none;
  border-radius: 8px; overflow: hidden;
  background: var(--backgrounds-card-bg-3);
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 0 12px;
}
.cq-rail:not(.is-open) .cq-rail-market { padding: 0; }
/* Opened only: at 36px the art already fills the tile. */
.cq-rail.is-open .cq-rail-market { background-image: var(--gradient-blue-wash); }
.cq-rail-market .bg { position: absolute; inset: 0; overflow: hidden; }
.cq-rail-market .bg svg { position: absolute; }
.cq-rail-market .mark { position: relative; flex: none; width: 24px; height: 15.6px; }
.cq-rail-market .cq-rail-lbl { position: relative; font-weight: 500; }
/* Zero-height in the component, with the stroke drawn above it — a 1px
   box here would add a row and push everything below out of rhythm. */
.cq-rail-rule { position: relative; width: 100%; height: 0; flex: none; }
.cq-rail-rule::before {
  content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 1px;
  background: var(--strokes-line-1);
}

/* ── Items ── */
.cq-rail-btn {
  width: 100%; height: 36px; flex: none;
  border-radius: 8px; padding: 8px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  color: var(--strokes-icon-default);
  transition: background .15s ease, color .15s ease;
}
.cq-rail-btn > .cq-ic { flex: none; }
/* Hover draws a rectangle, not just a fill — at 68px the icons have
   no labels to hit-test against, so the row needs to say where it
   begins and ends. The border comes out of the padding exactly as it
   does on an active item, so nothing shifts by a pixel. */
.cq-rail-btn:hover {
  background: var(--backgrounds-card-bg-4);
  border: 1px solid var(--strokes-card-default);
  padding: 7px;
  color: var(--text-secondary);
}
.cq-rail-btn.is-active {
  background: var(--backgrounds-button-tonal-1);
  /* Figma strokes sit inside the box, so the padding absorbs the border
     and the icon stays on the same 8px line as every other item. */
  border: 1px solid var(--strokes-card-selected);
  padding: 7px;
  color: var(--text-coloured-blue);
}
.cq-rail-btn.is-active .cq-rail-lbl { color: var(--text-coloured-blue); font-weight: 500; }
.cq-rail-stack { display: flex; flex-direction: column; align-items: stretch; }

/* ── Group header ── */
.cq-rail-ghead {
  position: relative;
  width: 100%; height: 24px; flex: none;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
/* A category header is 24px of tile and label with no box of its own,
   and it is a control. The rectangle is drawn by a pseudo-element
   rather than by padding a fixed-height row, so it can overhang the
   24px without touching layout — and the children are lifted above
   it, since a positioned pseudo would otherwise paint over them. */
.cq-rail-ghead::before {
  content: ""; position: absolute; inset: -6px -8px; z-index: 0;
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  transition: background .15s ease, border-color .15s ease;
}
.cq-rail-ghead:hover::before {
  background: var(--backgrounds-card-bg-4);
  border-color: var(--strokes-card-default);
}
.cq-rail-ghead > * { position: relative; z-index: 1; }
.cq-rail-tile {
  flex: none;
  width: 24px; height: 24px; border-radius: 6px; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  color: var(--white);
}
.cq-rail-ghead .cq-rail-lbl { font-weight: 500; }
.cq-rail-chev {
  flex: none; color: var(--text-teritiary);
  transition: transform .22s cubic-bezier(.4, 0, .2, 1);
}
.cq-rail-ghead[aria-expanded="true"] .cq-rail-chev { transform: rotate(180deg); }
.cq-rail:not(.is-open) .cq-rail-chev { display: none; }
/* Collapsing a group hides its items at either width — the crunched
   panel shows a collapsed group as its tile alone, same as opened. */
.cq-rail-ghead[aria-expanded="false"] + .cq-rail-stack { display: none; }

/* ── Context Studio: a category with no children ─────────────
   It sits at category level rather than inside Library because it is
   an offering in its own right — and because a top-level row is the
   only one the one-open-category rule can never hide. Every Build or
   Library child collapses away; this one is always on screen, which
   is what a separate offering needs. */
.cq-rail-ghead--leaf { position: relative; }
.cq-rail-tile-wrap { position: relative; flex: none; display: flex; }

/* Locked, the tile stays full colour. A greyed-out tile reads "not for
   you"; the point here is the opposite. The dot does the work instead
   — and it has to, because the panel is crunched by default, where a
   label-row pill would never be seen. */
.cq-rail-dot {
  display: none;
  position: absolute; top: -2px; right: -2px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--text-coloured-blue);
  box-shadow: 0 0 0 2px var(--backgrounds-page-bg-1);
}
/* The pill carries the Context tile's own gradient rather than the
   generic blue badge, so the row's two coloured things read as one
   offering instead of two unrelated accents. The gradient is static
   here even though the tile's turns: two rotations six pixels apart
   is noise, and the pill already has its own motion in the sheen
   below. No border — a stroke on a saturated fill only muddies it,
   and dropping it buys the 1px back as padding. */
.cq-rail-flag {
  display: none;
  position: relative; overflow: hidden;
  flex: none; height: 18px; padding: 0 8px; border-radius: 9px;
  align-items: center;
  background-image: linear-gradient(42.56deg, var(--purple-400) 11.95%, var(--blue-500) 60.99%, var(--blue-600) 110.04%);
  color: var(--text-button-white);
  font: 500 11px/1 var(--font-geist); letter-spacing: -0.11px;
}
/* A glint that crosses the pill every few seconds, with a long hold
   between passes. Constant motion in a nav panel is nagging; one
   periodic pass reads as emphasis and then gets out of the way. */
.cq-rail-flag::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(100deg, transparent 32%, var(--flag-sheen) 50%, transparent 68%);
  transform: translateX(-100%);
  animation: cq-flag-sheen 3.4s ease-in-out infinite;
  pointer-events: none;
}
@keyframes cq-flag-sheen {
  0%, 58% { transform: translateX(-100%); }
  100%    { transform: translateX(200%); }
}

.cq-rail-group.is-locked .cq-rail-dot { display: block; }
.cq-rail-group.is-locked .cq-rail-flag { display: inline-flex; }
.cq-rail:not(.is-open) .cq-rail-flag { display: none; }

/* An offering sits below every category, under a rule of its own. `order`
   sends it past them without moving it out of category order in the markup,
   so reading order and tab order still follow the sections. The rule does
   the separating: an offering is not one of the product's own sections, and
   a line says so without a second visual language. */
.cq-rail-group--offering { order: 1; }

/* ── The offer card, anchored beside the panel like the Tiq bar ── */
/* 520px: the preview inside is a full-size clip scaled to fit, so
   every extra pixel of card is a pixel of legible caption. The
   card's own type stays at token sizes — only the media grows,
   which is the part that was too small to read.
   The stack sets no gap of its own. A heading and the line it
   introduces want to sit closer together than either wants to sit
   to the media above or the buttons below, so each slot states its
   own space rather than sharing one rhythm. */
.cq-upsell {
  position: fixed; z-index: 95; width: 520px;
  display: none; flex-direction: column; gap: 0;
  padding: 20px;
  background: var(--backgrounds-card-bg-2);
  border: 1px solid var(--strokes-line-3);
  border-radius: 16px;
  box-shadow: var(--shadow-tiq);
  opacity: 0; transform: translateY(-4px) scale(.98);
  transition: opacity .16s ease, transform .2s cubic-bezier(.2,.8,.2,1);
}
.cq-upsell.is-open { display: flex; }
.cq-upsell.is-shown { opacity: 1; transform: none; }
.cq-upsell-media {
  position: relative;
  aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden;
  background: var(--backgrounds-page-bg-1);
  border: 1px solid var(--strokes-line-3);
  display: flex; align-items: center; justify-content: center;
}
.cq-upsell-play {
  width: 42px; height: 42px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--backgrounds-card-bg-2);
  border: 1px solid var(--strokes-line-3);
  color: var(--text-secondary);
}
.cq-upsell-media-note {
  position: absolute; left: 10px; bottom: 8px;
  color: var(--text-teritiary);
  font: 400 11px/1 var(--font-geist-mono);
}
/* ── Expand, and the big view it opens ─────────────────────── */
/* Even at 520px the clip is running at about a third of the size it
   was composed for, and the labels inside it are the part that
   suffers. The button sits over the media's own top-right corner
   rather than in the card's chrome, because what it enlarges is the
   frame, not the offer. Its colours are literals, not tokens: the
   media behind it is the clip's own ink-night in both themes, so a
   token that flips with the theme would be wrong in one of them.
   Painted at all times, only quietened — a control that does not
   exist until the pointer finds it is one most people never find. */
.cq-upsell-expand {
  position: absolute; top: 8px; right: 8px; z-index: 2;
  width: 28px; height: 28px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(10, 13, 24, .58);
  border: 1px solid rgba(255, 255, 255, .18);
  color: #fff; opacity: .6;
  transition: opacity .14s ease, background .14s ease, transform .14s ease;
}
.cq-upsell-media:hover .cq-upsell-expand { opacity: 1; }
.cq-upsell-expand:hover { background: rgba(10, 13, 24, .86); transform: scale(1.06); }
.cq-upsell-expand:focus-visible {
  opacity: 1; outline: 2px solid var(--backgrounds-button-primary); outline-offset: 2px;
}

/* The big view is the same clip in a bigger box, not a second
   composition: the stage is as much 16:9 as the window will give
   it, and the scale-to-fit below does the rest. min() takes the
   height constraint as a width, so a short window shrinks the
   stage rather than cropping it. */
.cq-filmbox {
  position: fixed; inset: 0; z-index: 200;
  display: none; align-items: center; justify-content: center;
  padding: 40px;
  background: rgba(8, 10, 18, .74);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  opacity: 0; transition: opacity .18s ease;
}
.cq-filmbox.is-open { display: flex; }
.cq-filmbox.is-shown { opacity: 1; }
.cq-filmbox-stage {
  position: relative;
  width: min(1280px, 100%, calc((100vh - 80px) * 16 / 9));
  aspect-ratio: 16 / 9;
  border-radius: var(--radius-lg); overflow: hidden;
  background: #080c1a;
  border: 1px solid var(--strokes-line-3);
  box-shadow: 0 24px 80px rgba(0, 0, 0, .55);
  transform: scale(.97);
  transition: transform .2s cubic-bezier(.2,.8,.2,1);
}
.cq-filmbox.is-shown .cq-filmbox-stage { transform: none; }
/* Same literals as the expand button, for the same reason. */
.cq-filmbox-close {
  position: absolute; top: 12px; right: 12px; z-index: 2;
  width: 32px; height: 32px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(10, 13, 24, .58);
  border: 1px solid rgba(255, 255, 255, .18);
  color: #fff;
  transition: background .14s ease;
}
.cq-filmbox-close:hover { background: rgba(10, 13, 24, .9); }
@media (prefers-reduced-motion: reduce) {
  .cq-filmbox, .cq-filmbox-stage { transition: none; }
}
.cq-upsell-head {
  display: flex; align-items: center; gap: 8px;
  margin-top: 16px;            /* clear of the preview above it */
}
.cq-upsell-head .cq-rail-tile { flex: none; }
.cq-upsell-title { color: var(--text-primary); }
/* Tight to its own heading: the two are one unit, and the space
   around them is what separates that unit from the rest. */
.cq-upsell-body { margin: 6px 0 0; color: var(--text-secondary); }
.cq-upsell-actions { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
/* A fixed 240px, not the width of the card. A primary button that
   stretches to whatever the container happens to be reads as a bar,
   and the wider the card gets the less it looks like a button. */
.cq-upsell-actions .cq-btn--primary { flex: none; width: 240px; height: 32px; padding: 6px 12px; }
/* "Learn more", not "Not now". The secondary action on an offer
   should still be a way forward — a dismissal earns nothing and
   the card already closes on its own when the pointer leaves. It
   goes somewhere outside the app, so it carries the external-link
   mark and opens in a new tab: a panel is a place people are
   working in, and a preview card is not worth losing that place
   over. */
.cq-upsell-learn {
  flex: none; display: inline-flex; align-items: center; gap: 6px;
  height: 32px; padding: 0 10px; border-radius: 8px;
  color: var(--text-teritiary); text-decoration: none;
  transition: background .14s ease, color .14s ease;
}
.cq-upsell-learn:hover { background: var(--backgrounds-card-bg-4); color: var(--text-primary); }
.cq-upsell-learn svg { flex: none; opacity: .75; }
.cq-upsell-learn:hover svg { opacity: 1; }

.cq-grad-blue   { background-image: linear-gradient(225.24deg, var(--blue-600) 8.84%, var(--blue-500) 54.42%, var(--blue-300) 100%); }
.cq-grad-purple { background-image: linear-gradient(225.24deg, var(--purple-600) 8.84%, var(--purple-500) 54.42%, var(--purple-300) 100%); }
.cq-grad-indigo { background-image: linear-gradient(225.24deg, var(--indigo-600) 8.84%, var(--indigo-500) 54.42%, var(--indigo-300) 100%); }
.cq-grad-orange { background-image: linear-gradient(225.24deg, var(--orange-800) 8.84%, var(--orange-600) 54.42%, var(--orange-300) 100%); }
.cq-grad-green  { background-image: linear-gradient(225.24deg, var(--green-600) 8.84%, var(--green-500) 54.42%, var(--green-300) 100%); }
.cq-grad-teal   { background-image: linear-gradient(225.24deg, var(--green-600) 8.84%, var(--green-500) 54.42%, var(--cyan-400) 100%); }
/* Context's tile ships its own gradient in the component (2906:507591)
   rather than composing the shared ramp trio — kept verbatim. A
   background-position drift turned out unreadable at 24px: two of
   the three stops are close blues, so most positions along the
   gradient look the same colour and only a narrow band ever showed
   the purple. Rotating the whole gradient plane instead sweeps
   every stop through the tile on every lap, which is the same
   trick as spinning a background-gradient element — the paint is
   oversized (inset -50%, so it never uncovers a corner as it turns)
   and sits on a ::before under the icon, which stays upright.
   Hovering the row quickens the spin — the one hover-driven speed
   change in the panel, since it is also the one tile whose colour
   is the entire point of hovering it. Reduced motion holds it
   still either way. */
.cq-grad-context { position: relative; overflow: hidden; background-image: none; }
.cq-grad-context::before {
  content: ""; position: absolute; inset: -50%;
  background-image: linear-gradient(42.56deg, var(--purple-400) 11.95%, var(--blue-500) 60.99%, var(--blue-600) 110.04%);
  animation: cq-ctx-grad-spin 6s linear infinite;
}
.cq-rail-ghead--leaf:hover .cq-grad-context::before,
.cq-upsell-head:hover .cq-grad-context::before {
  animation-duration: 1.4s;
}
@keyframes cq-ctx-grad-spin {
  to { transform: rotate(360deg); }
}
@media (prefers-reduced-motion: reduce) {
  .cq-grad-context::before { animation: none; }
}
/* The glyph is a flex item, not a positioned one, and a flex item's
   implicit stacking tier does not reliably beat an absolutely
   positioned ::before with the same auto z-index — Chromium paints
   the spin on top of it. Lifted explicitly rather than left to that
   tie-break. */
.cq-grad-context > svg { position: relative; z-index: 1; }

/* The clip is authored against a full-size viewport: its sphere is
   a fixed 340px, its chips sit at ±300px offsets, and its captions
   clamp to px minimums. Sized fluidly into a 288px box, all of that
   stays put while the frame shrinks around it — one enormous orb
   and a caption running off both edges. So the iframe is given the
   viewport the clip expects (1600×900) and the whole stage is
   scaled down to the mount instead. Both mounts are 16/9, as is
   1600×900, so one factor fits both axes and nothing is cropped. */
.cq-upsell-media iframe, .cq-filmbox-stage iframe {
  position: absolute; left: 0; top: 0;
  width: 1600px; height: 900px;
  transform-origin: 0 0;
  border: 0; display: block;
}
/* The offer's box carries the clip's own ink-night rather than this
   page's ground, so it does not flash the wrong colour for the
   instant before the iframe's first paint. */
.cq-upsell-media.cq-upsell-media { background: #080c1a; }


/* ── First run · the tooltip ──────────────────────────────────
   The panel is crunched by default, so the only thing a new user
   ever sees of Context is a 24px tile with a dot on it. This is the
   one moment that tile gets a sentence. Unlike the review page's
   looping demo, here it appears once, waits to be read, and does
   not come back: a coach mark that returns is an interruption, not
   an introduction.
   Both sit above the rail's own z-index 80 — the panel would paint
   over them otherwise — and below the offer card's 95, because if
   the card is up the tooltip has already done its job. */
.cq-coach-ring {
  position: fixed; z-index: 88; width: 36px; height: 36px;
  border-radius: 11px; pointer-events: none;
  box-shadow: 0 0 0 2px var(--backgrounds-button-primary);
  opacity: 0; transition: opacity .3s ease;
}
.cq-coach-ring::after {
  content: ""; position: absolute; inset: 0; border-radius: 11px;
  box-shadow: 0 0 0 2px var(--backgrounds-button-primary);
  opacity: .45;
}
.cq-coach-tip {
  position: fixed; z-index: 89; width: 320px;
  display: none; align-items: flex-start; gap: 10px;
  padding: 12px 14px; border-radius: 12px;
  background: var(--backgrounds-card-bg-2);
  border: 1px solid var(--strokes-line-3);
  box-shadow: var(--shadow-tiq);
  opacity: 0; transform: translateX(-8px);
  transition: opacity .22s ease, transform .28s cubic-bezier(.2,.8,.2,1);
}
.cq-coach-tip.is-open { display: flex; }
.cq-coach-tip.is-shown { opacity: 1; transform: none; }
.cq-coach-ring.is-shown { opacity: 1; }
.cq-coach-arrow {
  position: absolute; z-index: 2; left: -5px; top: 50%; margin-top: -4.5px;
  width: 9px; height: 9px; rotate: 45deg;
  background: var(--backgrounds-card-bg-2);
  border-left: 1px solid var(--strokes-line-3);
  border-bottom: 1px solid var(--strokes-line-3);
}
.cq-coach-tip .cq-rail-tile { flex: none; }
.cq-coach-tip b {
  display: block; color: var(--text-primary);
  font: 500 var(--fs-body-3)/var(--lh-body-3) var(--font-geist);
  letter-spacing: -0.56px;
}
.cq-coach-x {
  flex: none; width: 20px; height: 20px; margin: -2px -4px 0 auto;
  /* auto on the left, not a fixed gap after the text — pinned to the
     corner regardless of how long the line runs. */
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px; color: var(--text-teritiary);
  transition: background .14s ease, color .14s ease;
}
.cq-coach-x:hover { background: var(--backgrounds-card-bg-4); color: var(--text-primary); }
/* A sheen crossing the card every few seconds, the same idiom as the
   Try pill's glint and for the same reason: a nav tooltip that
   shimmers continuously nags, one that passes and gets out of the way
   reads as emphasis. It is a moving background rather than a moving
   element, so it cannot paint outside the card and the arrow — which
   sticks out of it — is left alone; no overflow clipping needed. */
.cq-coach-tip::after {
  content: ""; position: absolute; inset: 0; z-index: 0;
  border-radius: inherit; pointer-events: none;
  background-image: linear-gradient(100deg, transparent 36%, var(--coach-sheen) 50%, transparent 64%);
  background-size: 200% 100%; background-repeat: no-repeat;
  background-position: 150% 0;
  animation: cq-coach-sheen-kf 3.2s ease-in-out infinite;
}
/* The band is only inside the card between 100% and 0%; the rest of
   the travel parks it off one edge or the other. Sweeping 150% to
   -50% spends half the 2s of travel on screen, which is a pass you
   can watch rather than a flicker you catch by accident. */
@keyframes cq-coach-sheen-kf {
  0%, 38% { background-position: 150% 0; }
  100%    { background-position: -50% 0; }
}
/* The sheen is painted behind everything the card says. A flex item's
   implicit tier does not reliably beat a positioned ::after. */
.cq-coach-tip > *:not(.cq-coach-arrow) { position: relative; z-index: 1; }
/* The halo pulses only while the tooltip is up, and stops with it. */
.cq-coach-ring.is-shown::after { animation: cq-coach-halo 2s ease-out infinite; }
@keyframes cq-coach-halo {
  0%        { transform: scale(1); opacity: .45; }
  70%, 100% { transform: scale(1.55); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .cq-coach-ring.is-shown::after,
  .cq-coach-tip::after { animation: none; }
  .cq-coach-tip { transition: none; }
}

/* ══════════════════════════════════════════════════════════════════
   14 · SURFACES & OVERLAYS
   ══════════════════════════════════════════════════════════════════ */
.cq-surface     { background: var(--backgrounds-page-bg-2); }
.cq-surface--chrome { background: var(--backgrounds-card-bg-5); }
.cq-surface--sunken { background: var(--backgrounds-page-bg-4); }
.cq-divider     { height: 1px; background: var(--strokes-line-3); border: 0; }
.cq-divider--strong { background: var(--strokes-line-1); }

.cq-scrim {
  position: fixed; inset: 0; z-index: 80;
  display: none; align-items: center; justify-content: center;
  padding: 24px;
  background: var(--scrim);
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
}
.cq-scrim.is-open { display: flex; }

.cq-modal {
  max-width: 100%; max-height: 100%;
  display: flex; flex-direction: column;
  background: var(--backgrounds-page-bg-2);
  border: 1px solid var(--strokes-card-default);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-modal);
  overflow: hidden;
}
.cq-modal__head {
  flex: none; height: 48px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--strokes-card-default);
}
.cq-modal__foot {
  flex: none;
  display: flex; align-items: center; justify-content: flex-end; gap: 12px;
  padding: 8px 16px;
  border-top: 1px solid var(--strokes-card-default);
}
.cq-modal__section-head {
  flex: none;
  display: flex; align-items: center; gap: 6px;
  padding: 8px 16px;
  border-bottom: 1px solid var(--strokes-line-1);
  color: var(--text-primary);
}

/* Right-hand detail panel. */
.cq-panel {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 60;
  width: var(--panel-w);
  display: flex; flex-direction: column;
  padding: 20px 0 16px;
  background: var(--backgrounds-page-bg-2);
  border-left: 1px solid var(--strokes-line-3);
  box-shadow: var(--shadow-panel);
  overflow-y: auto;
  transform: translateX(100%); visibility: hidden;
  transition: transform .28s cubic-bezier(.4, 0, .2, 1), visibility .28s;
}
.cq-panel.is-open { transform: translateX(0); visibility: visible; }
.cq-panel__section {
  width: 100%; flex: none;
  display: flex; flex-direction: column; gap: 8px;
  padding: 20px 16px;
  border-bottom: 1px solid var(--strokes-line-1);
}
.cq-panel__section:last-child { border-bottom: 0; }
.cq-section-label { color: var(--text-teritiary); }

/* Key/value row — the panel's config list and anything like it. */
.cq-kv {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 8px 0;
  border-bottom: 1px solid var(--strokes-line-3);
}
.cq-kv:last-child { border-bottom: 0; }
.cq-kv__k { color: var(--text-teritiary); font: 500 var(--fs-caption)/var(--fs-body-2) var(--font-geist); letter-spacing: -0.24px; }
.cq-kv__v { color: var(--text-secondary); text-align: right; font: 400 var(--fs-body-3)/var(--lh-body-3) var(--font-geist); letter-spacing: -0.56px; }

/* ══════════════════════════════════════════════════════════════════
   15 · TIQ
   The assistant surface. The rotating conic stroke is the one place
   the system uses a fixed brand gradient rather than a token — it is
   the same in both themes on purpose.
   ══════════════════════════════════════════════════════════════════ */
@property --ang { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
@keyframes cq-tiq-spin { to { --ang: 360deg; } }

.cq-tiq-gradient {
  background: conic-gradient(from var(--ang), #0d99ff, #5860ed, #f24822, #ffca28, #ffffff, #0d99ff);
}

/* 20px, 12px type, gradient stroke. Sits inside a field, bottom-right. */
.cq-tiq-btn {
  position: relative;
  height: 20px; padding: 0 8px; border-radius: var(--radius-sm);
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--backgrounds-page-bg-2);
  color: var(--text-secondary);
  font: 500 12px/1 var(--font-geist); letter-spacing: -0.12px;
  white-space: nowrap;
}
.cq-tiq-btn::before {
  content: ""; position: absolute; inset: 0; border-radius: var(--radius-sm); padding: 1px;
  background: conic-gradient(from var(--ang), #0d99ff, #5860ed, #f24822, #ffca28, #ffffff, #0d99ff);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  animation: cq-tiq-spin 6s linear infinite;
  pointer-events: none;
}
.cq-tiq-btn:hover, .cq-tiq-btn.is-on { color: var(--text-primary); }
.cq-tiq-btn:active { transform: scale(.96); }

/* The same stroke at action-row scale: 32px so it sits level with a
   primary button, and static rather than pinned inside a field. Use it
   wherever Tiq is one option among several — a detail panel's actions,
   a toolbar — so Tiq reads as one thing across the product. */
.cq-tiq-btn--action {
  /* Leave position alone. The ::before stroke is inset:0 against this
     button; making it static hands the pseudo to the nearest positioned
     ancestor and paints the gradient around that whole surface instead. */
  height: 32px; padding: 0 12px; gap: 6px;
  border-radius: var(--radius-md);
  justify-content: center;
  font: 500 var(--fs-body-3)/var(--lh-body-3) var(--font-geist); letter-spacing: -0.56px;
}
.cq-tiq-btn--action::before { border-radius: var(--radius-md); }

.cq-tiq-bar {
  width: 360px;
  display: flex; flex-direction: column;
  background: var(--backgrounds-card-bg-2);
  border: 1px solid var(--strokes-line-3);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-tiq);
}
.cq-tiq-row {
  position: relative;
  display: flex; align-items: center; gap: 9px;
  margin: 12px; padding: 7px 7px 7px 12px;
  background: var(--backgrounds-type-default-bg-1);
  border: 1px solid var(--strokes-type-default);
  border-radius: 10px;
}
.cq-tiq-row::before {
  content: ""; position: absolute; inset: -1px; border-radius: 10px; padding: 1px;
  background: conic-gradient(from var(--ang), #0d99ff, #5860ed, #f24822, #ffca28, #ffffff, #0d99ff);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  opacity: 0; transition: opacity .3s ease;
  animation: cq-tiq-spin 5s linear infinite;
  pointer-events: none;
}
.cq-tiq-bar.is-focused .cq-tiq-row::before { opacity: 1; }
.cq-tiq-row > * { position: relative; z-index: 1; }
.cq-tiq-row input {
  flex: 1 1 auto; min-width: 0; color: var(--text-primary);
  font: 400 var(--fs-body-3)/var(--lh-body-3) var(--font-geist); letter-spacing: -0.56px;
}
.cq-tiq-row input::placeholder { color: var(--text-teritiary); }

/* First-open flourish: the placeholder sweeps the brand gradient once, so
   the bar reads as Tiq before a word of it is taken in. Run it once per
   bar per page — on every open it is noise — and cut it short when the
   user types. Add .is-shimmer to the row to start it.

   It rides on a ghost span, not ::placeholder, because background-clip:
   text is not reliable on a placeholder pseudo. */
.cq-tiq-field { position: relative; flex: 1 1 auto; min-width: 0; display: flex; }
.cq-tiq-ghost {
  display: none;
  position: absolute; inset: 0; align-items: center;
  pointer-events: none; white-space: nowrap; overflow: hidden;
  font: 400 var(--fs-body-3)/var(--lh-body-3) var(--font-geist); letter-spacing: -0.56px;
  background-image: linear-gradient(100deg,
    #0d99ff 0%, #5860ed 16%, #f24822 32%, #ffca28 46%, #ffffff 58%, #5860ed 78%, #0d99ff 100%);
  background-size: 260% 100%;
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
  animation: cq-tiq-shimmer 1.25s ease-in-out 2 both;
}
.cq-tiq-row.is-shimmer .cq-tiq-ghost { display: flex; }
.cq-tiq-row.is-shimmer input::placeholder { color: transparent; }

/* Bar header — the controls that own the bar: collapse/dock, and close. */
.cq-tiq-head {
  flex: none;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 10px 0 14px;
  color: var(--text-primary);
}
.cq-tiq-head__title { display: flex; align-items: center; gap: 7px; min-width: 0; }
.cq-tiq-head__sub {
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: var(--text-teritiary);
}
.cq-tiq-head__sub::before { content: "\00b7"; margin-right: 6px; }
.cq-tiq-icon {
  width: 24px; height: 24px; flex: none; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-teritiary);
  transition: background .14s ease, color .14s ease;
}
.cq-tiq-icon:hover { background: var(--backgrounds-card-bg-4); color: var(--text-primary); }

/* Docked — the bar becomes a full-height panel on the right, and the page
   slides over rather than being covered (see the page guidelines for the
   shell's side of that contract). Width is unchanged from the floating bar,
   so the surface stays recognisably the same thing: only its height and
   position move.

   The DOM does not change between the two states. Only `order` does, which
   puts the prompt at the bottom of a tall panel and lets the answers take
   the space above it. */
.cq-tiq-bar--docked {
  position: fixed; top: 8px; bottom: 8px; right: 8px; left: auto;
  width: var(--tiq-dock-w); height: auto;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-panel);
}
.cq-tiq-bar--docked .cq-tiq-head {
  padding: 12px 10px 12px 14px;
  border-bottom: 1px solid var(--strokes-line-3);
}
.cq-tiq-bar--docked .cq-tiq-empty   { order: 1; }
.cq-tiq-bar--docked .cq-tiq-answer  { order: 2; flex: 1 1 auto; min-height: 0; overflow-y: auto; padding-top: 14px; }
.cq-tiq-bar--docked .cq-tiq-suggest { order: 3; }
.cq-tiq-bar--docked .cq-tiq-row     { order: 5; margin-bottom: 12px; }

/* Docked only: a tall panel needs something in it before the first ask. */
.cq-tiq-empty { display: none; }
.cq-tiq-bar--docked .cq-tiq-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  flex: 1 1 auto; gap: 6px; padding: 24px 24px 16px; text-align: center;
}
.cq-tiq-empty__title { color: var(--text-primary); }
.cq-tiq-empty__sub { color: var(--text-teritiary); max-width: 240px; }

/* One thread, two readings: docked shows the whole exchange, the floating
   bar has room for the latest answer only. Same markup either way. */
.cq-tiq-qa + .cq-tiq-qa { margin-top: 14px; }
.cq-tiq-q {
  margin-bottom: 8px; color: var(--text-primary);
  font: 500 13px/18px var(--font-geist); letter-spacing: -0.3px;
}
.cq-tiq-bar:not(.cq-tiq-bar--docked) .cq-tiq-q { display: none; }
.cq-tiq-bar:not(.cq-tiq-bar--docked) .cq-tiq-qa:not(:last-child) { display: none; }
@keyframes cq-tiq-shimmer {
  from { background-position: 130% 0; }
  to   { background-position: -30% 0; }
}
.cq-tiq-send {
  flex: none;
  display: flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--backgrounds-button-primary);
  color: var(--text-button-white);
}
.cq-tiq-send:disabled {
  background: var(--backgrounds-disabled-tonal-2);
  color: var(--text-disabled-tonal-2);
  cursor: default;
}
.cq-tiq-suggest { display: flex; flex-direction: column; padding: 0 8px 8px; }
.cq-tiq-suggest__label { padding: 2px 6px 6px; color: var(--text-teritiary); }
.cq-tiq-sg {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 8px; border-radius: var(--radius-md); text-align: left;
  color: var(--text-secondary);
  font: 400 13px/18px var(--font-geist); letter-spacing: -0.3px;
  transition: background .14s ease, color .14s ease;
}
.cq-tiq-sg:hover { background: var(--backgrounds-card-bg-4); color: var(--text-primary); }
.cq-tiq-sg .cq-ic { flex: none; color: var(--text-teritiary); }

/* Answer block — for the Tiq surfaces that report back into the bar
   rather than writing into a field. Put it between the row and the
   suggestions; the rule below separates it from the follow-ups. */
.cq-tiq-answer { padding: 0 14px 12px; }
.cq-tiq-answer p {
  margin: 0; color: var(--text-secondary);
  font: 400 13px/19px var(--font-geist); letter-spacing: -0.3px;
}
.cq-tiq-answer p + p { margin-top: 8px; }
.cq-tiq-answer strong { color: var(--text-primary); font-weight: 500; }
.cq-tiq-answer + .cq-tiq-suggest { border-top: 1px solid var(--strokes-line-3); padding-top: 8px; }

.cq-tiq-rows {
  margin-top: 10px; display: flex; flex-direction: column;
  border: 1px solid var(--strokes-line-3); border-radius: var(--radius-md);
  overflow: hidden;
}
.cq-tiq-rows__row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 7px 10px;
  background: var(--backgrounds-card-bg-4);
}
.cq-tiq-rows__row + .cq-tiq-rows__row { border-top: 1px solid var(--strokes-line-3); }
.cq-tiq-rows__row .k {
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: var(--text-teritiary);
  font: 400 var(--fs-caption)/16px var(--font-geist); letter-spacing: -0.24px;
}
.cq-tiq-rows__row .v {
  flex: none; color: var(--text-primary);
  font: 400 var(--fs-caption)/16px var(--font-geist-mono);
}

/* ══════════════════════════════════════════════════════════════════
   16 · UTILITIES
   ══════════════════════════════════════════════════════════════════ */
.cq-ic { display: block; flex: none; }
.cq-row-flex { display: flex; align-items: center; gap: 8px; }
.cq-stack { display: flex; flex-direction: column; gap: 8px; }
.cq-truncate { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cq-scroll-y { overflow-y: auto; }
.cq-scroll-y::-webkit-scrollbar { width: 10px; }
.cq-scroll-y::-webkit-scrollbar-thumb {
  background: var(--strokes-type-default);
  border: 3px solid transparent; background-clip: content-box; border-radius: var(--radius-md);

function liveVisible() {
  const q = liveState.q.trim().toLowerCase();

    if (q && !(it.name.toLowerCase().includes(q) || it.appLabel.toLowerCase().includes(q) || it.creator.toLowerCase().includes(q))) return false;
    return true;

function openPanel(id) {
  const it = liveById(id);

function closePanel() {

$('tableWrap').addEventListener('click', e => {

  const row = e.target.closest('.cq-row[data-id]');

  row.dataset.id === liveState.selected ? closePanel() : openPanel(row.dataset.id);
});

/* ── Popovers: one open at a time, closed by an outside click or Escape ── */
function closeAllPops() {
  document.querySelectorAll('.cq-pop.is-open').forEach(p => p.classList.remove('is-open'));
  document.querySelectorAll('.cq-dropdown.is-open').forEach(b => { b.classList.remove('is-open'); b.setAttribute('aria-expanded', 'false'); });
}
function wirePop(btnId, popId, onOpen) {
  const btn = $(btnId), pop = $(popId);
  btn.addEventListener('click', e => {
    e.stopPropagation();
    const willOpen = !pop.classList.contains('is-open');
    closeAllPops();
    if (willOpen) {
      pop.classList.add('is-open');
      btn.classList.add('is-open');
      btn.setAttribute('aria-expanded', 'true');
      onOpen && onOpen();
    }
  });
}
document.addEventListener('click', e => {
  if (!e.target.closest('.cq-filter-group')) closeAllPops();
  if (liveState.selected && !e.target.closest('.cq-panel') && !e.target.closest('.cq-row[data-id]')) closePanel();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  closeAllPops();
  if (liveState.selected) closePanel();
});
