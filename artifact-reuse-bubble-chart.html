/* ═══════════════════════════════════════════════════════════════════
   ARTIFACT REUSE - TWELVE WAYS
   Twelve candidate forms for the Adoption tab's reusability section,
   on the real numbers, in the Cogentiq design system.

   Tokens below are lifted verbatim from the platform stylesheet so this
   page is the same material as the screen it is proposing changes to.
   The platform is dark-first, so this page is too: the bare :root block
   carries the dark palette and the light one is the override, wired to
   all three viewer states (explicit light, explicit dark, and the
   unstamped default where only prefers-color-scheme separates them).
   ═══════════════════════════════════════════════════════════════════ */

:root {
  /* ── Backgrounds · page ─────────────────────────────────────── */
  --backgrounds-page-bg-1:            #121212;  /* app ground          */
  --backgrounds-page-bg-2:            #212121;  /* cards, modals       */
  --backgrounds-page-bg-3:            #1b1b1b;  /* tiles, table header */
  --backgrounds-page-bg-4:            #121212;  /* content ground      */

  /* ── Backgrounds · card ─────────────────────────────────────── */
  --backgrounds-card-bg-2:            #212121;
  --backgrounds-card-bg-3:            #323232;
  --backgrounds-card-bg-4:            #323232;  /* hover fill          */
  --backgrounds-card-bg-5:            #1b1b1b;  /* header, sidebar     */

  /* ── Backgrounds · controls ─────────────────────────────────── */
  --backgrounds-button-primary:       #0d99ff;
  --backgrounds-button-tonal-1:       #093077;
  --backgrounds-disabled-tonal-1:     #093077;
  --backgrounds-disabled-tonal-2:     #424242;
  --backgrounds-seg-control-tabs-1:   #424242;
  --backgrounds-checkbox-default:     #1b1b1b;
  --backgrounds-checkbox-focus:       #0d99ff;
  --backgrounds-type-default-bg-1:    #323232;  /* input fill          */
  --backgrounds-type-default-bg-2:    #323232;
  --backgrounds-type-search-default:  #121212;
  --backgrounds-icon-blue-2:          #0d99ff33;
  --backgrounds-table-default:        #121212;
  --backgrounds-table-select:         #0d193f;

  /* ── Backgrounds · tone badges ──────────────────────────────── */
  --backgrounds-badge-blue:           #09112b;
  --backgrounds-badge-cyan:           #051b29;
  --backgrounds-badge-green:          #031d11;
  --backgrounds-badge-indigo:         #0b0f2e;
  --backgrounds-badge-light-green:    #14280c;

  /* ── Strokes ────────────────────────────────────────────────── */
  --strokes-card-default:             #424242;
  --strokes-card-selected:            #0d99ff;
  --strokes-line-1:                   #424242;
  --strokes-line-3:                   #323232;  /* hairline divider    */
  --strokes-type-default:             #424242;
  --strokes-type-focus:               #007be5;
  --strokes-checkbox-default:         #616161;
  --strokes-checkbox-focus:           #0d99ff;
  --strokes-icon-default:             #9e9e9e;
  --strokes-colour-blue:              #093077;
  --strokes-colour-cyan:              #093c53;
  --strokes-colour-green:             #0a3a22;
  --strokes-colour-indigo:            #2b3180;
  --strokes-colour-light-green:       #214314;

  /* ── Text ───────────────────────────────────────────────────── */
  --text-primary:                     #ffffff;
  --text-secondary:                   #bdbdbd;
  --text-teritiary:                   #8c8c8c;  /* spelling per Figma  */
  --text-button-white:                #ffffff;
  --text-button-tonal-1:              #80caff;
  --text-button-tonal-2:              #bdbdbd;
  --text-disabled-tonal-1:            #0768cf;
  --text-disabled-tonal-2:            #757575;
  --text-coloured-blue:               #44aaf3;
  --text-coloured-cyan:               #35caf0;
  --text-coloured-green:              #85e0a3;
  --text-coloured-indigo:             #a0a5f7;
  --text-coloured-light-green:        #7cb342;

  /* ── Effects ────────────────────────────────────────────────── */
  --scrim:          rgba(18, 18, 18, .6);
  --shadow-card:    drop-shadow(0 1px 1.5px rgba(18, 18, 18, .16));
  --shadow-bar:     drop-shadow(0 1px 1px rgba(18, 18, 18, .12));
  --shadow-sidebar: drop-shadow(1px 0 1px rgba(18, 18, 18, .12));
  --shadow-tab:     0 1px 2px rgba(33, 33, 33, .2);
  --shadow-modal:   0 4px 12px rgba(33, 33, 33, .16);
  --shadow-panel:   -8px 0 24px rgba(0, 0, 0, .2);
  --shadow-rail:    8px 0 28px rgba(0, 0, 0, .38);
  --shadow-pop:     0 -1px 2px rgba(0, 0, 0, .04), 0 4px 8px rgba(0, 0, 0, .12), 0 2px 16px rgba(33, 33, 33, .16);
  /* For a surface that floats over another panel. A shadow tuned for white
     ground all but vanishes on a dark one, so this is deliberately heavier
     than --shadow-pop — it is what gives the Tiq bar its hierarchy. */
  /* Carries the Marketplace pill past where its fixed-size art reaches: the
     art is drawn for the 36px tile, so at 208px the right end runs out.
     Transparent under the art, so the crunched tile is untouched. Light is
     sampled from the component (Figma names the fill Gradient/blue but
     returns no value); dark is derived in the art's own family. */
  --gradient-blue-wash: linear-gradient(90deg, rgba(62, 99, 116, 0) 46%, rgba(62, 99, 116, 1) 86%);
  --shadow-tiq:     0 2px 6px rgba(0, 0, 0, .40), 0 14px 32px rgba(0, 0, 0, .52), 0 28px 64px rgba(0, 0, 0, .40);

  /* The exported OpenAI mark is one shape, so it inverts per theme. */
  --logo-openai: #ffffff;

  /* ── Palette ramps · identical in both themes ───────────────── */
  --blue-300: #bde3ff;   --blue-500: #0d99ff;   --blue-600: #007be5;
  --indigo-300: #c2c5fa; --indigo-500: #5860ed; --indigo-600: #454de0;
  --purple-300: #e4ccff; --purple-400: #d9b8ff; --purple-500: #9747ff; --purple-600: #8638e5;
  /* A palette value, not a theme colour: white in both modes, which is
     what a glyph sitting on a coloured tile wants. */
  --white: #ffffff;
  --orange-300: #fcd19c; --orange-600: #fc9e24; --orange-800: #dd7c0e;
  --green-300: #aff4c6;  --green-500: #14ae5c;  --green-600: #009951;
  --cyan-400:  #75d7f0;
  --flag-sheen: rgba(255, 255, 255, .30);
  /* The coach-mark sheen, keyed off the tile it sits on. */
  --coach-sheen: rgba(255, 255, 255, .28);

  /* ── Type ───────────────────────────────────────────────────── */
  --font-geist:      "Geist", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-geist-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --fs-caption: 12px;
  --fs-body-3:  14px;
  --fs-body-2:  16px;
  --lh-body-3:  20px;
  --lh-body-2:  24px;

  /* ── Radius · the four the product actually uses ────────────── */
  --radius-sm:   6px;   /* tags, small tiles     */
  --radius-md:   8px;   /* buttons, inputs       */
  --radius-lg:  12px;   /* cards, modals, pills  */
  --radius-xl:  14px;   /* floating prompt bars  */
  --radius-full: 9999px;

  /* ── Layout constants ───────────────────────────────────────── */
  --rail-w:    68px;
  --rail-w-open: 240px;
  --sidebar-w: 240px;
  --panel-w:   420px;
  --tiq-dock-w: 360px;
  --card-h:    120px;

  /* ── Chart palettes ───────────────────────────────────────────────
     Computed, not chosen by eye. Every set below is the output of the
     dataviz validator run against this page's own card surface:
       node validate_palette.js "<hex,...>" --mode dark --surface "#1b1b1b" --pairs all

     CATEGORICAL - one hue per artifact type, for the forms where colour
     IS the identity (donut, treemap, waffle, gauges). Families are
     blue/cyan/green/orange/purple in both themes, so a type keeps its
     hue when the theme flips. Dark's worst all-pairs separation is
     green-orange at deutan ΔE 6.4, inside the 6-8 floor band, which is
     legal only with a second encoding - so every one of those marks is
     also directly labelled and separated by a 2px surface gap. */
  --cat-tools:      #0768cf;
  --cat-guardrails: #00a2c2;
  --cat-agents:     #14ae5c;
  --cat-skills:     #ce7012;
  /* Ink for a value printed on top of one of those fills. Which of
     the two inks clears 4.5:1 differs per hue and per theme, so it
     is a token pair rather than one on-mark colour for all five. */
  --cat-tools-ink:     var(--text-button-white);
  --cat-guardrails-ink:     var(--blue-1100);
  --cat-agents-ink:     var(--blue-1100);
  --cat-skills-ink:     var(--blue-1100);

  /* SEQUENTIAL - one hue, low to high, for the forms where the tint
     carries magnitude rather than identity. Dark climbs toward light. */
  --seq-1: #034ac1;
  --seq-2: #0768cf;
  --seq-3: #44aaf3;
  --seq-4: #80caff;
  --seq-5: #e5f4ff;
  /* Ink for text sitting on a ramp step. Which steps are the light ones
     flips with the theme, so the pairing is a token, never a test in JS. */
  --seq-1-ink: var(--text-button-white);
  --seq-2-ink: var(--text-button-white);
  --seq-3-ink: var(--blue-1100);
  --seq-4-ink: var(--blue-1100);
  --seq-5-ink: var(--blue-1100);

  /* SINGLE MEASURE - most of these charts show one number per type, so
     they use one hue and let the label carry the name. This is the
     production blue, identical in both themes. */
  --measure: var(--backgrounds-button-primary);
  --idle: var(--backgrounds-page-bg-2);

  --card: var(--backgrounds-card-bg-5);
  --nested: var(--backgrounds-page-bg-2);
  --grid-line: var(--strokes-line-3);
}

<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--backgrounds-page-bg-1);
    color: var(--text-primary);
    font: 400 var(--fs-body-3)/var(--lh-body-3) var(--font-geist);
    letter-spacing: -0.28px;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { margin: 0; font-weight: 500; text-wrap: balance; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px 64px; }


  /* ── Gallery ── */
  .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 14px; }
  .card {
    display: flex; flex-direction: column; gap: 14px;
    padding: 20px; border-radius: var(--radius-lg);
    background: var(--card); border: 1px solid var(--strokes-card-default);
  }
  /* A card that wants the full row because its chart needs the width. */
  .card--wide { grid-column: 1 / -1; }
  /* Number, name, and nothing else - the chart is the content. */
  .card__head { display: flex; align-items: baseline; gap: 9px; }
  .card__no {
    flex: none; color: var(--text-teritiary);
    font: 400 11px/1 var(--font-geist-mono); letter-spacing: .04em;
  }
  .card__name { font-size: 15px; line-height: 20px; color: var(--text-primary); }
  .card__now {
    margin-left: auto; flex: none;
    padding: 2px 7px; border-radius: var(--radius-full, 999px);
    background: var(--nested); border: 1px solid var(--strokes-line-3);
    color: var(--text-teritiary); font: 400 10px/15px var(--font-geist);
  }

  h1 {
    margin: 0; padding: 40px 0 22px;
    font: 500 27px/34px var(--font-geist); letter-spacing: -.9px;
    color: var(--text-primary); text-wrap: balance;
  }
  .plot { min-height: 0; }
  .plot svg { display: block; width: 100%; height: auto; overflow: visible; }


  /* ── Legend, shared by the categorical forms ── */
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 12px; }
  .legend i { width: 9px; height: 9px; border-radius: 2px; flex: none; }
  .legend--line i { width: 14px; height: 2px; border-radius: 2px; }

  /* ── Chart text: theme tokens, never a series colour ── */
  .ax { fill: var(--text-teritiary); font: 400 11px/1 var(--font-geist); }
  .ax--mono { font-family: var(--font-geist-mono); font-variant-numeric: tabular-nums; }
  .lbl { fill: var(--text-primary); font: 500 11px/1 var(--font-geist-mono); font-variant-numeric: tabular-nums; }
  .lbl--name { fill: var(--text-secondary); font: 400 12px/1 var(--font-geist); }
  .lbl--sm { fill: var(--text-secondary); font: 400 10px/1 var(--font-geist); }
  .lbl--xs { fill: var(--text-secondary); font: 400 9px/1 var(--font-geist); }
  .lbl--on-mark { fill: var(--text-button-white); }
  .rule { stroke: var(--grid-line); stroke-width: 1; }

  /* ── Hover ── */
  [data-tip] { cursor: default; }
  [data-tip]:hover { filter: brightness(1.12); }
  .tip {
    position: fixed; z-index: 40; pointer-events: none; opacity: 0;
    transform: translate(-50%, -100%);
    padding: 7px 10px; border-radius: var(--radius-md);
    background: var(--backgrounds-card-bg-3);
    border: 1px solid var(--strokes-card-default);
    box-shadow: var(--shadow-pop);
    color: var(--text-primary);
    font: 400 12px/16px var(--font-geist); white-space: nowrap;
    transition: opacity .1s ease;
  }
  .tip.is-on { opacity: 1; }
  .tip b { font-family: var(--font-geist-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
  .tip i { font-style: normal; color: var(--text-teritiary); }


  @media (prefers-reduced-motion: reduce) { .tip { transition: none; } }
  @media (max-width: 600px) {
    .wrap { padding: 28px 16px 56px; }
    h1 { font-size: 24px; line-height: 30px; }
  }
</style>

<div class="wrap">
  <h1>Artifact reuse — library size vs. reuse rate</h1>
  <div class="gallery">
    <section class="card card--wide">
      <div class="card__head"><h2 class="card__name">Bubble</h2></div>
      <div class="legend" id="bubbleLegend"></div>
      <div class="plot" id="bubblePlot"></div>
    </section>
  </div>
</div>

<div class="tip" id="tip" role="status" aria-live="polite"></div>
<script>
const TYPES = [
  { key: 'tools',      name: 'Tools',      total: 41,  reused: 33,  used: [46, 38, 29, 24, 16, 11] },
  { key: 'guardrails', name: 'Guardrails', total: 31,  reused: 22,  used: [88, 51, 44, 33, 19] },
  { key: 'agents',     name: 'Agents',     total: 186, reused: 98,  used: [27, 21, 18, 15, 9] },
  { key: 'skills',     name: 'Skills',     total: 240, reused: 171, used: [132, 96, 81, 64, 37, 22] }
];
const SUM_TOTAL = TYPES.reduce((a, t) => a + t.total, 0);
const SUM_REUSED = TYPES.reduce((a, t) => a + t.reused, 0);
const rate = t => t.reused / t.total;
const pct = v => Math.round(v * 100) + '%';
const hue = t => `var(--cat-${t.key})`;
const byRate = [...TYPES].sort((a, b) => rate(b) - rate(a));
const bySize = [...TYPES].sort((a, b) => b.total - a.total);

/* Every mark carries the same tooltip payload, so one delegated
   listener serves all twelve charts. */
const tip = (t, extra) =>
  `data-tip="${t.name}|${t.reused} of ${t.total} reused · ${pct(rate(t))}${extra ? ' · ' + extra : ''}"`;

const svg = (w, h, inner, label) =>
  `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}">${inner}</svg>`;

/* Marks: 4px rounded ends on the data end only would need a path, so
   bars use a full radius that reads the same at these widths. */
const bar = (x, y, w, h, fill, attrs = '') =>
  `<rect x="${x}" y="${y}" width="${Math.max(w, 0)}" height="${h}" rx="${Math.min(4, h / 2)}" fill="${fill}" ${attrs}/>`;

/* ══ 7 · Bubble — library size against reuse rate, area = reuse count ══ */
function bubble() {
  /* Wider and taller than the other plots on purpose. Two of the four
     libraries hold under 45 artifacts, so on a linear size axis they sit
     close together at the left; the room is what lets every name sit under
     its own bubble at this size without touching a neighbour, instead of a
     nonlinear axis that would spread them by distorting the comparison. */
  const W = 1000, H = 380, L = 52, R = 60, T = 20, B = 46;
  const px = v => L + (v / 270) * (W - L - R);
  const py = v => T + (1 - (v - 0.45) / 0.4) * (H - T - B);
  /* Scaled so the smallest bubble still clears its own three-character
     label: Guardrails, at 22 reused, is the binding constraint now that
     Models (12 reused) is off the chart. */
  const rad = v => Math.sqrt(v / SUM_REUSED) * 68;   // area, never radius, carries the count

  const gy = [0.5, 0.6, 0.7, 0.8].map(v =>
    `<line class="rule" x1="${L}" y1="${py(v)}" x2="${W - R + 30}" y2="${py(v)}"/>
     <text class="ax ax--mono" x="${L - 10}" y="${py(v) + 4}" text-anchor="end">${pct(v)}</text>`).join('');
  const gx = [0, 60, 120, 180, 240].map(v =>
    `<text class="ax ax--mono" x="${px(v)}" y="${H - 20}" text-anchor="middle">${v}</text>`).join('');

  const marks = bySize.map(t => {
    const cx = px(t.total), cy = py(rate(t)), r = rad(t.reused);
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${hue(t)}" stroke="var(--card)" stroke-width="2" ${tip(t, t.reused + ' reused')}/>
      <text class="lbl" x="${cx}" y="${cy + 4}" text-anchor="middle" style="fill:var(--cat-${t.key}-ink)">${pct(rate(t))}</text>
      <text class="lbl--xs" x="${cx}" y="${cy + r + 11}" text-anchor="middle">${t.name}</text>`;
  }).join('');

  return svg(W, H,
    `${gy}${gx}<text class="ax" x="${L}" y="${H - 3}">artifacts in the library →</text>${marks}`,
    'Library size against reuse rate, bubble area is the number of reused artifacts');
}


document.getElementById('bubbleLegend').innerHTML =
  TYPES.map(t => `<span><i style="background:${hue(t)}"></i>${t.name}</span>`).join('');
document.getElementById('bubblePlot').innerHTML = bubble();

/* ══ Hover ══ */
const tipEl = document.getElementById('tip');
let tipOn = null;
document.addEventListener('pointermove', e => {
  const mark = e.target.closest ? e.target.closest('[data-tip]') : null;
  if (!mark) {
    if (tipOn) { tipEl.classList.remove('is-on'); tipOn = null; }
    return;
  }
  if (mark !== tipOn) {
    const [head, detail] = mark.dataset.tip.split('|');
    tipEl.innerHTML = `<b>${head}</b>${detail ? ' <i>' + detail + '</i>' : ''}`;
    tipEl.classList.add('is-on');
    tipOn = mark;
  }
  tipEl.style.left = e.clientX + 'px';
  tipEl.style.top = (e.clientY - 12) + 'px';
}, { passive: true });
document.addEventListener('pointerleave', () => { tipEl.classList.remove('is-on'); tipOn = null; });
</script>
