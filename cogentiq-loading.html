<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cogentiq — Claims Review Assistant (loading state)</title>
<meta name="description" content="The reasoning trace assembling itself: context groups resolve out of blur, citations and skill chips land in place, then the answer settles." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  /* ══════════════════════════════════════════════════════════════
     DESIGN TOKENS — Cogentiq Builder, mapped 1:1 from the Figma
     variables on node 2246:140053 ("All opened").
     ══════════════════════════════════════════════════════════════ */
  :root{
    /* Text */
    --text-primary:#ffffff;
    --text-secondary:#bdbdbd;
    --text-tertiary:#8c8c8c;
    --text-button-tonal-2:#bdbdbd;
    --text-blue:#44aaf3;
    --text-orange:#dd7c0e;
    --text-yellow:#ffa000;
    --text-red:#dc3412;
    --text-purple:#bb7fff;
    --grey-500:#9e9e9e;

    /* Backgrounds */
    --bg-app:#121212;
    --bg-page-2:#212121;
    --bg-page-3:#1b1b1b;
    --bg-card-1:#323232;
    --bg-card-2:#212121;
    --bg-card-5:#1b1b1b;
    --bg-type-default:#323232;
    --bg-type-hover:#424242;
    --bg-icon-orange:rgba(221,124,14,.1);
    --bg-disabled-tonal-1:#093077;

    /* Strokes */
    --line-1:#424242;
    --line-2:#545454;
    --line-3:#323232;
    --stroke-card:#424242;
    --stroke-type:#424242;
    --canvas-dots:#323232;

    /* Accents */
    --blue-500:#0d99ff;
    --purple-500:#9747ff;
    --cyan-500:#00a2c2;
    --thinking-tile:#c8e6c9;

    /* Type — Geist, letter-spacing is -4% on body, -2% on caption */
    --sans:'Geist', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --body2:500 16px/24px var(--sans);      /* Body1  16/24  -0.64px */
    --body3:400 14px/20px var(--sans);      /* Body2  14/20  -0.56px */
    --cap1:400 12px/16px var(--sans);       /* Caption1 12/16 -0.24px */
    --cap2:500 10px/14px var(--sans);       /* Caption2 10/14 -0.2px  */
    --ease:cubic-bezier(.23,1,.32,1);
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg-app);
    color:var(--text-primary);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  svg{display:block;flex:none}
  :focus-visible{outline:2px solid var(--blue-500);outline-offset:2px;border-radius:6px}

  /* ══════════════════════════════════════════════════════════════
     APP SHELL
     ══════════════════════════════════════════════════════════════ */
  .app{display:flex;height:100%}

  /* ---------- left rail (Chat panel, 68px) ---------- */
  .rail{width:68px;flex:none;background:var(--bg-app);
    display:flex;flex-direction:column;align-items:center;gap:16px;padding:8px 16px}
  .rail-logo{width:32px;height:32px;border-radius:100px;background:var(--bg-page-2);
    display:grid;place-items:center;margin-top:8px}
  .rail-btn{width:36px;display:flex;align-items:center;justify-content:center;
    border-radius:8px;padding:8px;color:var(--text-secondary);
    transition:background .15s ease,color .15s ease}
  .rail-btn.is-active{background:var(--bg-page-2);border:1px solid var(--stroke-type);
    box-shadow:0 1px 1px rgba(33,33,33,.12),0 1px 1px rgba(33,33,33,.08)}
  .rail-btn:hover{background:var(--bg-card-1);color:var(--text-primary)}

  /* ---------- panel ---------- */
  .panel{flex:1;min-width:0;display:flex;flex-direction:column;
    background:var(--bg-page-2);border-radius:12px 12px 0 0;overflow:hidden}

  .topbar{flex:none;height:48px;display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px 12px 12px;border-bottom:2px solid var(--line-1)}
  .topbar-left{display:flex;align-items:center;gap:8px}
  .back{display:flex;align-items:center;gap:2px;padding:4px;border-radius:6px;
    color:var(--text-button-tonal-2);font:500 12px/16px var(--sans);letter-spacing:-.24px;
    transition:background .15s ease}
  .back:hover{background:var(--bg-card-1)}
  .doc-title{font:var(--body2);letter-spacing:-.64px;color:var(--text-primary)}
  .assets{display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:8px;
    background:var(--bg-card-1);color:var(--text-button-tonal-2);
    font:500 14px/20px var(--sans);letter-spacing:-.56px;transition:background .15s ease}
  .assets:hover{background:var(--bg-type-hover)}

  /* ---------- scrolling thread ---------- */
  .scroller{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;
    scrollbar-color:var(--line-1) transparent}
  .scroller::-webkit-scrollbar{width:8px}
  .scroller::-webkit-scrollbar-thumb{background:var(--line-1);border-radius:4px}
  .thread{width:780px;max-width:100%;margin:0 auto;padding:24px 16px 8px;
    display:flex;flex-direction:column;gap:16px}

  .bubble{align-self:flex-end;max-width:530px;background:var(--bg-disabled-tonal-1);
    border-radius:12px;padding:12px 16px;font:400 16px/24px var(--sans);
    letter-spacing:-.64px;color:var(--text-primary)}

  /* ---------- one trace section: icon rail + content ---------- */
  .sec{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start}
  .sec-rail{display:flex;flex-direction:column;align-items:center;align-self:stretch}
  .sec-ico{width:24px;height:24px;display:grid;place-items:center;color:var(--text-secondary)}
  .sec-ico.tile{background:var(--thinking-tile);border-radius:6px}
  .sec-connector{flex:1;width:1px;min-height:8px;margin:4px 0 0;
    background:var(--line-3);transform-origin:top;animation:grow-down 500ms var(--ease) both}
  .sec-body{display:flex;flex-direction:column;gap:12px;min-width:0}
  .sec-head{display:flex;align-items:center;gap:8px}
  .sec-title{font:var(--body2);letter-spacing:-.64px;color:var(--text-primary)}
  .sec-title.blue{color:var(--text-blue)}
  .sec-chev{color:var(--text-tertiary)}

  /* ---------- context group ---------- */
  .grp{display:flex;flex-direction:column;gap:8px}
  .grp-head{display:flex;align-items:center;gap:8px;color:var(--text-secondary)}
  .grp-label{font:500 14px/20px var(--sans);letter-spacing:-.56px;color:var(--text-primary)}
  .grp-list{display:flex;flex-direction:column;gap:4px;padding-inline:24px}

  .row{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;
    background:var(--bg-card-5);border:1px solid var(--line-3)}
  .row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .row-top{display:flex;align-items:center;gap:8px}
  .row-name{display:flex;align-items:center;gap:4px;
    font:500 12px/16px var(--sans);letter-spacing:-.24px;color:var(--text-primary)}
  .row-name .i{color:var(--text-secondary)}
  .row-desc{font:var(--cap1);letter-spacing:-.24px;color:var(--text-secondary)}
  .row-chev{color:var(--text-tertiary)}
  .row-tag{margin-left:auto;font:var(--cap1);letter-spacing:-.24px;color:var(--text-tertiary)}
  .badge{padding:1px 6px;border-radius:4px;background:var(--bg-icon-orange);
    color:var(--text-orange);font:var(--cap2);letter-spacing:-.2px;white-space:nowrap}

  /* ---------- ontology graph ---------- */
  .graph{position:relative;height:144px;margin-top:4px;border-radius:8px;
    background:var(--bg-card-2);
    background-image:radial-gradient(var(--canvas-dots) 1px, transparent 1px);
    background-size:16px 16px;overflow:hidden}
  .graph-expand{position:absolute;top:8px;right:8px;padding:4px;border-radius:8px;
    background:var(--bg-page-3);color:var(--text-secondary);transition:background .15s ease}
  .graph-expand:hover{background:var(--bg-card-1)}
  .graph svg.edges{position:absolute;inset:0;width:100%;height:100%}
  .node{position:absolute;translate:-50% -50%;display:flex;align-items:center;gap:6px;padding:4px 10px;
    border-radius:8px;background:var(--bg-card-1);border:1px solid var(--line-1);
    font:var(--cap1);letter-spacing:-.24px;color:var(--text-primary);white-space:nowrap}
  .node.is-root{background:var(--bg-page-3);border-color:var(--blue-500)}
  .node .dot{width:6px;height:6px;border-radius:100px;flex:none}
  .edge-label{position:absolute;translate:-50% -50%;padding:2px 6px;border-radius:6px;
    background:var(--bg-card-2);border:1px solid var(--line-3);
    font:var(--cap2);letter-spacing:-.2px;color:var(--text-secondary);white-space:nowrap}

  /* ---------- steps ---------- */
  .steps{display:flex;flex-direction:column;gap:6px}
  .step{display:flex;align-items:center;gap:6px;
    font:var(--body3);letter-spacing:-.56px;color:var(--text-secondary)}
  .step .i{color:var(--text-secondary)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{display:flex;align-items:center;gap:4px;padding:2px 6px;border-radius:8px;
    background:var(--bg-type-hover);color:var(--text-secondary);
    font:var(--body3);letter-spacing:-.56px}
  .step-done{font:var(--body3);letter-spacing:-.56px;color:var(--text-primary)}
  .pill{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:8px;
    background:var(--bg-page-3);color:var(--text-secondary);
    font:var(--body3);letter-spacing:-.56px}

  /* ---------- summary ---------- */
  .sum-body{font:var(--body3);letter-spacing:-.56px;color:var(--text-secondary);max-width:688px}
  .sum-meta{display:flex;align-items:center;gap:8px;
    font:var(--cap1);letter-spacing:-.24px;color:var(--text-tertiary)}
  .rule{height:1px;background:var(--line-3);margin:4px 0}

  /* ---------- code block ---------- */
  .codeblock{position:relative;border-radius:8px;padding:12px;
    background:var(--bg-type-default);border:1px solid var(--stroke-type);
    font:400 14px/20px var(--mono);color:var(--text-primary);
    max-height:308px;overflow:hidden}
  .codeblock .kw{color:var(--text-red)}
  .codeblock .num{color:var(--text-yellow)}
  .codeblock .str{color:var(--text-blue)}
  .codeblock .op{color:var(--text-purple)}
  .codeblock .cmt{color:var(--text-tertiary)}
  .code-line{white-space:pre;min-height:20px}

  /* ---------- composer ---------- */
  .composer-wrap{flex:none;padding:0 16px 8px;display:flex;flex-direction:column;
    align-items:center;gap:8px}
  .composer{width:780px;max-width:100%;border-radius:24px;padding:12px;
    background:var(--bg-type-default);border-top:1px solid var(--blue-500);
    box-shadow:0 1px 2px 1px rgba(33,33,33,.12);
    display:flex;flex-direction:column;gap:16px}
  .composer-input{display:flex;align-items:center;gap:2px;padding:4px 8px;
    font:400 16px/24px var(--sans);letter-spacing:-.64px;color:var(--grey-500)}
  .caret-bar{width:1px;height:21px;background:var(--grey-500);
    animation:blink 1.1s steps(1,end) infinite}
  .composer-row{display:flex;align-items:center;justify-content:space-between}
  .composer-left,.composer-right{display:flex;align-items:center;gap:8px}
  .icon-btn{padding:8px;border-radius:100px;color:var(--text-secondary);
    transition:background .15s ease,color .15s ease}
  .icon-btn:hover{background:var(--bg-type-hover);color:var(--text-primary)}
  .badge-btn{display:flex;align-items:center;gap:4px;padding:8px 12px;border-radius:80px;
    background:var(--bg-card-1);color:var(--text-button-tonal-2);
    font:500 14px/20px var(--sans);letter-spacing:-.56px;transition:background .15s ease}
  .badge-btn:hover{background:var(--bg-type-hover)}
  .stop-btn{padding:8px;border-radius:100px;background:var(--blue-500);
    display:grid;place-items:center}
  .stop-btn i{display:block;width:12px;height:12px;border-radius:2px;background:#fff}

  .footer{display:flex;align-items:center;justify-content:center;gap:24px;
    width:780px;max-width:100%;padding-bottom:4px;
    font:var(--cap1);letter-spacing:-.24px;color:var(--text-tertiary)}
  .footer .elapsed{display:inline-flex;align-items:center;gap:4px}
  .footer a{color:var(--text-secondary);text-decoration:underline;text-underline-offset:2px}

  /* ---------- demo control (not part of the Figma chrome) ---------- */
  .replay{position:fixed;left:16px;bottom:16px;z-index:20;
    display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;
    background:var(--bg-page-3);border:1px solid var(--line-3);
    color:var(--text-secondary);font:500 12px/16px var(--sans);letter-spacing:-.24px;
    transition:background .15s ease,color .15s ease}
  .replay:hover{background:var(--bg-card-1);color:var(--text-primary)}
  .replay .phase{color:var(--text-tertiary);font-variant-numeric:tabular-nums}

  /* ══════════════════════════════════════════════════════════════
     THE STREAMING ANIMATION
     Same four keyframes and the same 55ms/word cadence as
     components/streaming-text.tsx — words resolve out of blur,
     chips pop, rows rise.
     ══════════════════════════════════════════════════════════════ */
  @keyframes stream-in{from{opacity:0;filter:blur(5px)}to{opacity:1;filter:blur(0)}}
  @keyframes pop-in{from{opacity:0;scale:.86}to{opacity:1;scale:1}}
  @keyframes fade-in{from{opacity:0}to{opacity:1}}
  @keyframes fade-up{from{opacity:0;translate:0 6px}to{opacity:1;translate:0 0}}
  @keyframes grow-down{from{scale:1 0}to{scale:1 1}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes working{0%,100%{opacity:.45}50%{opacity:1}}

  .word{display:inline;will-change:filter,opacity;
    animation:stream-in 420ms cubic-bezier(.22,.61,.25,1) both}
  .caret{display:inline-block;width:2px;height:12px;margin-left:2px;translate:0 1px;
    border-radius:9999px;background:currentColor;animation:fade-in 150ms ease-out both}
  .pop{animation:pop-in 250ms var(--ease) both}
  .rise{animation:fade-up 350ms var(--ease) both}
  .appear{animation:fade-in 300ms ease-out both}
  /* the step being worked on breathes until it resolves */
  .is-working{animation:working 1.3s ease-in-out infinite}

  @media (prefers-reduced-motion:reduce){
    @keyframes stream-in{from{opacity:0}to{opacity:1}}
    @keyframes pop-in{from{opacity:0}to{opacity:1}}
    @keyframes fade-up{from{opacity:0}to{opacity:1}}
    @keyframes grow-down{from{opacity:0}to{opacity:1}}
    .is-working,.caret-bar{animation:none}
  }

  @media (max-width:900px){
    .rail{display:none}
    .thread,.composer,.footer{width:100%}
  }
</style>
</head>
<body>

<div class="app">
  <!-- ═══════════ left rail ═══════════ -->
  <nav class="rail" aria-label="Workspace">
    <div class="rail-logo" data-icon="logo" data-size="20"></div>
    <button class="rail-btn is-active" aria-label="New chat" data-icon="messageplus" data-size="20"></button>
    <button class="rail-btn" aria-label="Search" data-icon="search20" data-size="20"></button>
  </nav>

  <!-- ═══════════ panel ═══════════ -->
  <div class="panel">
    <header class="topbar">
      <div class="topbar-left">
        <button class="back"><span data-icon="arrowleft" data-size="16"></span>Back</button>
        <h1 class="doc-title">Claims Review Assistant</h1>
      </div>
      <button class="assets"><span data-icon="assets" data-size="20"></span>Assets</button>
    </header>

    <div class="scroller" id="scroller">
      <div class="thread" id="thread">
        <p class="bubble">Can you review this insurance claim and tell me if there are any issues or risks of rejection?</p>
      </div>
    </div>

    <div class="composer-wrap">
      <div class="composer">
        <div class="composer-input"><span class="caret-bar"></span>Ask anything..</div>
        <div class="composer-row">
          <div class="composer-left">
            <button class="icon-btn" aria-label="Attach" data-icon="plus" data-size="20"></button>
            <button class="badge-btn"><span data-icon="write" data-size="16"></span>Canvas</button>
          </div>
          <div class="composer-right">
            <button class="icon-btn" aria-label="Dictate" data-icon="mic" data-size="20"></button>
            <button class="stop-btn" aria-label="Stop generating"><i></i></button>
          </div>
        </div>
      </div>
      <div class="footer">
        <span class="elapsed" id="elapsed"><span data-icon="clock" data-size="14"></span><span id="elapsed-text">Working…</span></span>
        <span>Facing issues with the assistant? <a href="#">Give feedback</a></span>
      </div>
    </div>
  </div>
</div>

<button class="replay" id="replay">Replay <span class="phase" id="phase"></span></button>

}

  el.innerHTML = svg(el.dataset.icon, Number(el.dataset.size) || 16);
});

/* ══════════════════════════════════════════════════════════
   CONTENT — verbatim from Figma node 2246:140053
   ══════════════════════════════════════════════════════════ */
const GROUPS = [
  { icon:'book14', label:'Definitions I used', rows:[
    { icon:'bookrow14', name:'Annual Recurring Revenue', chev:'chev12',
      desc:'Revenue retained from existing customers including expansion' },
    { icon:'bookrow14', name:'Customer Churn Rate', chev:'chevr12' },
    { icon:'bookrow14', name:'Net Revenue Retention', chev:'chevr12', badge:'Low relavance' },
  ]},
  { icon:'ontology', label:'How some terms are related', rows:[
    { icon:'ontology', name:'Customer Churn Rate', chev:'chev12',
      desc:'Percentage of customers who cancel within a period', graph:true },
  ]},
  { icon:'warehouse', label:'Where the data came from', rows:[
    { icon:'warehouse', name:'Revenue figures', tag:'Snowflake',
      desc:'Live revenue data from company warehouse' },
    { icon:'warehouse', name:'Customer accounts', tag:'Snowflake' },
  ]},
  { icon:'warehouse', label:'Applying rules and policies', rows:[
    { icon:'warehouse', name:'Revenue figures',
      desc:'Live revenue data from company warehouse' },
    { icon:'warehouse', name:'Customer accounts' },
  ]},
];

const PPT_STEPS = [
  { icon:'search', text:'Searching for relavant skills' },
  { chips:[{ icon:'skill', text:'PPT skill' }, { icon:'skill', text:'Writing skill' }] },
  { icon:'ppt',  text:'Create PPT one-pager slide' },
  { icon:'file', text:'Analysing required files for full context' },
  { icon:'web',  text:'Searching relevant web sources' },
  { icon:'edit', text:'Replace/ re-write the content in the one-pager to target the audience' },
];

const CODE_LINES = [
  [['kw','import'],['',' pygame']],
  [['kw','import'],['',' sys']],
  [['kw','import'],['',' random']],
  [],
  [['','pygame.init()']],
  [],
  [['cmt','# Window']],
  [['','WIDTH, HEIGHT = '],['num','600, 600']],
  [['','GRID = '],['num','30']],
  [['','ROWS, COLS = '],['op','HEIGHT // GRID, WIDTH // GRID']],
  [['','screen = pygame.display.set_mode((WIDTH, HEIGHT))']],
  [['','pygame.display.set_caption("'],['str','Mini Pac-Man'],['','")']],
  [],
  [['','clock = pygame.time.Clock()']],
];

const SUMMARY = "I used your company's definitions of ARR and churn rather than the " +
  "industry-standard ones, pulled live revenue from Snowflake, and applied your " +
  "disclosure and privacy rules to how the figures appear.";

/* ══════════════════════════════════════════════════════════
   TIMELINE RUNNER
   ══════════════════════════════════════════════════════════ */
const WORD_MS = 55;    // same cadence as the streaming-text component
const HOLD_MS = 4200;

const thread   = document.getElementById('thread');
const scroller = document.getElementById('scroller');
const phaseEl  = document.getElementById('phase');
const elapsedT = document.getElementById('elapsed-text');
const reduced  = matchMedia('(prefers-reduced-motion: reduce)').matches;

let run = 0;                                    // cancels an in-flight timeline
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const stale = (mine) => mine !== run;

function follow() {
  // keep the newest line in view, the way a real thread scrolls itself
  scroller.scrollTo({ top: scroller.scrollHeight, behavior: reduced ? 'auto' : 'smooth' });
}

function el(tag, cls, parent) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (parent) parent.append(n);
  return n;
}

/** append words one at a time, each resolving out of blur, with a trailing caret */
async function streamWords(host, text, mine) {
  const caret = el('span', 'caret', host);
  for (const w of text.split(' ')) {
    if (stale(mine)) return;
    const s = el('span', 'word');
    s.textContent = w + ' ';
    host.insertBefore(s, caret);
    follow();
    await wait(WORD_MS);
  }
  caret.remove();
}

/** a trace section: 24px icon rail + streamed title + a body to fill in */
function section(icon, { tile = false, blue = false, chev = null } = {}) {
  const sec = el('div', 'sec appear', thread);
  const rail = el('div', 'sec-rail', sec);
  const ico = el('div', 'sec-ico pop' + (tile ? ' tile' : ''), rail);
  ico.innerHTML = svg(icon, 16);
  const connector = el('div', 'sec-connector', rail);
  const body = el('div', 'sec-body', sec);
  const head = el('div', 'sec-head', body);
  const title = el('span', 'sec-title' + (blue ? ' blue' : ''), head);
  return { sec, body, head, title, connector, chev };
}

function addChev(head, name) {
  const c = el('span', 'sec-chev pop', head);
  c.innerHTML = svg(name, 16);
}

/* ---------- the reasoning trace ---------- */
async function buildGroup(host, g, mine) {
  const grp = el('div', 'grp', host);
  const head = el('div', 'grp-head appear', grp);
  const gi = el('span', '', head);
  gi.innerHTML = svg(g.icon, g.icon === 'book14' ? 14 : 16);
  const label = el('span', 'grp-label', head);
  await streamWords(label, g.label, mine);
  if (stale(mine)) return;
  addChev(head, 'chev16');

  const list = el('div', 'grp-list', grp);
  for (const r of g.rows) {
    if (stale(mine)) return;
    const row = el('div', 'row rise', list);
    const main = el('div', 'row-main', row);
    const top = el('div', 'row-top', main);
    const name = el('span', 'row-name', top);
    const ni = el('span', 'i', name);
    ni.innerHTML = svg(r.icon, r.icon === 'bookrow14' ? 14 : 16);
    el('span', '', name).textContent = r.name;
    if (r.chev) {
      const c = el('span', 'row-chev', top);
      c.innerHTML = svg(r.chev, 12);
    }
    if (r.tag) el('span', 'row-tag', top).textContent = r.tag;
    if (r.desc) el('div', 'row-desc', main).textContent = r.desc;
    follow();
    await wait(260);

    if (r.badge) {
      const b = el('span', 'badge pop', row);
      b.textContent = r.badge;
      await wait(200);
    }
    if (r.graph) {
      await buildGraph(main, mine);
      if (stale(mine)) return;
    }
  }
}

/** the ontology canvas: nodes land one at a time, edges draw between them */
async function buildGraph(host, mine) {
  const g = el('div', 'graph appear', host);
  const btn = el('button', 'graph-expand', g);
  btn.setAttribute('aria-label', 'Expand graph');
  btn.innerHTML = svg('expand', 16);

  const edges = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  edges.setAttribute('class', 'edges');
  edges.setAttribute('viewBox', '0 0 626 144');
  edges.setAttribute('preserveAspectRatio', 'none');
  g.append(edges);

  /* positions measured off the Figma render, as % of the canvas box */
  const NODES = [
    { txt:'Customer',     x:'49.5%', y:'29%', root:true },
    { txt:'Subcriptions', x:'23.7%', y:'66%', dot:'var(--purple-500)' },
    { txt:'account',      x:'69.7%', y:'66%', dot:'var(--cyan-500)' },
  ];
  /* centre-to-centre; the node boxes paint over the stubs */
  const EDGES = [
    { d:'M310 42 L148 95', label:'has many',   lx:'38%',   ly:'50%' },
    { d:'M310 42 L436 95', label:'belongs to', lx:'56.7%', ly:'50%' },
  ];

  for (const n of NODES) {
    if (stale(mine)) return;
    const node = el('div', 'node pop' + (n.root ? ' is-root' : ''), g);
    node.style.left = n.x; node.style.top = n.y;
    if (n.dot) {
      const d = el('span', 'dot', node);
      d.style.background = n.dot;
    }
    el('span', '', node).textContent = n.txt;
    await wait(180);
  }
  for (const e of EDGES) {
    if (stale(mine)) return;
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', e.d);
    p.setAttribute('stroke', 'var(--line-2)');
    p.setAttribute('stroke-width', '1');
    p.setAttribute('fill', 'none');
    p.style.animation = 'fade-in 400ms ease-out both';
    edges.append(p);
    const lab = el('div', 'edge-label pop', g);
    lab.style.left = e.lx; lab.style.top = e.ly;
    lab.textContent = e.label;
    await wait(180);
  }
  await wait(220);
}

/* ══════════════════════════════════════════════════════════
   THE LOADING SEQUENCE
   ══════════════════════════════════════════════════════════ */
async function play() {
  const mine = ++run;
  thread.querySelectorAll('.sec').forEach((n) => n.remove());
  scroller.scrollTop = 0;
  elapsedT.textContent = 'Working…';
  document.getElementById('elapsed').classList.add('is-working');

  const setPhase = (n, of) => { phaseEl.textContent = `${n}/${of}`; };
  const OF = 5;

  /* 1 — Thinking */
  setPhase(1, OF);
  await wait(500); if (stale(mine)) return;
  const think = section('thinking', { tile:true, blue:true });
  await streamWords(think.title, 'Thinking', mine); if (stale(mine)) return;
  await wait(600);

  /* 2 — Reading context */
  setPhase(2, OF);
  const read = section('docsearch');
  await streamWords(read.title, 'Reading context', mine); if (stale(mine)) return;
  addChev(read.head, 'chevup16');
  await wait(300);

  for (const g of GROUPS) {
    if (stale(mine)) return;
    await buildGroup(read.body, g, mine);
    await wait(420);
  }
  if (stale(mine)) return;

  const composing = el('div', 'step appear', read.body);
  const ci = el('span', 'i', composing);
  ci.innerHTML = svg('edit', 16);
  const ctext = el('span', '', composing);
  composing.classList.add('is-working');
  await streamWords(ctext, 'Composing answer with 8 grounded items', mine);
  if (stale(mine)) return;
  await wait(700);
  composing.classList.remove('is-working');

  /* 3 — Context summary */
  setPhase(3, OF);
  el('div', 'rule', read.body);
  const sum = section('summarylogo');
  await streamWords(sum.title, 'Context summary', mine); if (stale(mine)) return;
  const sumBody = el('div', 'sum-body', sum.body);
  await streamWords(sumBody, SUMMARY, mine); if (stale(mine)) return;
  const meta = el('div', 'sum-meta appear', sum.body);
  el('span', '', meta).textContent = '8 items used';
  el('span', '', meta).textContent = '•';
  el('span', '', meta).textContent = '2 rules applied';
  await wait(700);

  /* 4 — Generate one-pager PPT */
  setPhase(4, OF);
  const ppt = section('ppt');
  await streamWords(ppt.title, 'Generate one-pager PPT', mine); if (stale(mine)) return;
  addChev(ppt.head, 'chevup16');
  const steps = el('div', 'steps', ppt.body);

  for (const s of PPT_STEPS) {
    if (stale(mine)) return;
    if (s.chips) {
      const wrap = el('div', 'chips', steps);
      for (const c of s.chips) {
        const chip = el('span', 'chip pop', wrap);
        const cIco = el('span', '', chip);
        cIco.innerHTML = svg(c.icon, 16);
        el('span', '', chip).textContent = c.text;
        follow();
        await wait(220);
      }
      await wait(280);
      continue;
    }
    const step = el('div', 'step appear is-working', steps);
    const si = el('span', 'i', step);
    si.innerHTML = svg(s.icon, 16);
    const st = el('span', '', step);
    await streamWords(st, s.text, mine);
    if (stale(mine)) return;
    step.classList.remove('is-working');
    await wait(240);
  }
  if (stale(mine)) return;

  const done = el('div', 'step-done appear', ppt.body);
  await streamWords(done, "I’ve created the required one-pager document", mine);
  if (stale(mine)) return;
  const pill = el('span', 'pill pop', ppt.body);
  const pi = el('span', '', pill);
  pi.innerHTML = svg('clock', 16);
  el('span', '', pill).textContent = 'Finished in 3.2 sec';
  follow();
  await wait(700);

  /* 5 — Create code for the document */
  setPhase(5, OF);
  const code = section('code');
  await streamWords(code.title, 'Create code for the document', mine); if (stale(mine)) return;
  addChev(code.head, 'chevup16');
  const block = el('div', 'codeblock appear', code.body);
  const exp = el('button', 'graph-expand', block);
  exp.setAttribute('aria-label', 'Expand code');
  exp.innerHTML = svg('expand', 16);

  for (const line of CODE_LINES) {
    if (stale(mine)) return;
    const ln = el('div', 'code-line rise', block);
    if (!line.length) ln.innerHTML = '&nbsp;';
    for (const [cls, txt] of line) {
      const sp = el('span', cls, ln);
      sp.textContent = txt;
    }
    follow();
    await wait(110);
  }
  if (stale(mine)) return;

  /* settled */
  document.getElementById('elapsed').classList.remove('is-working');
  elapsedT.textContent = 'Finished in 3.2 sec';
  await wait(HOLD_MS);
  if (stale(mine)) return;
  play();
}

document.getElementById('replay').addEventListener('click', () => play());
play();
</script>
