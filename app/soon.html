<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cogentiq</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/*TOKENS*/
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--backgrounds-page-bg-1, #121212); color: var(--text-primary); font-family: var(--font-geist, 'Geist', sans-serif); }
button { font-family: inherit; }
.sn { display: flex; height: 100%; }
.sn-side { flex: none; width: 240px; display: flex; flex-direction: column; gap: 4px; padding: 12px; }
.sn-brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; font: 600 17px/22px var(--font-geist); }
.sn-logo { width: 30px; height: 30px; border-radius: 50%; background: var(--backgrounds-card-bg-4); display: inline-flex; align-items: center; justify-content: center; }
.sn-h { padding: 12px 10px 4px; color: var(--text-teritiary); font: 500 11px/16px var(--font-geist); letter-spacing: .04em; text-transform: uppercase; }
.sn-btn { display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 10px; border: 1px solid transparent; border-radius: 8px; background: none; cursor: pointer; text-align: left; color: var(--text-secondary); font: 500 14px/20px var(--font-geist); letter-spacing: -.4px; }
.sn-btn:hover { background: var(--backgrounds-card-bg-4); color: var(--text-primary); }
.sn-btn.is-on { background: var(--backgrounds-button-tonal-1); border-color: var(--strokes-card-selected); color: var(--text-coloured-blue); }
.sn-btn svg { flex: none; }
.sn-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; margin: 8px 8px 8px 0; border-radius: 12px; overflow: hidden; background: var(--backgrounds-page-bg-2); border: 1px solid var(--strokes-line-3); }
.sn-head { flex: none; height: 48px; display: flex; align-items: center; gap: 16px; padding: 0 16px; border-bottom: 1px solid var(--strokes-line-3); background: var(--backgrounds-card-bg-5); }
.sn-head h1 { flex: 1 1 auto; margin: 0; font: 500 18px/24px var(--font-geist); letter-spacing: -.72px; }
.sn-icon { width: 32px; height: 32px; border: 0; border-radius: 8px; background: none; color: var(--text-secondary); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.hdr-avatar { width: 32px; height: 32px; border-radius: 50%; background: #5860ed; color: #fff; display: inline-flex; align-items: center; justify-content: center; font: 600 13px/1 var(--font-geist); cursor: pointer; }
.sn-body { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 24px; }
.sn-empty { width: min(460px, 100%); display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.sn-empty .ic { width: 56px; height: 56px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; background: var(--backgrounds-badge-blue); color: var(--text-coloured-blue); }
.sn-empty h2 { margin: 4px 0 0; font: 500 20px/28px var(--font-geist); letter-spacing: -.8px; }
.sn-empty p { margin: 0; color: var(--text-secondary); font: 400 14px/20px var(--font-geist); }
.sn-acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
.sn-cta { height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--strokes-card-default); background: var(--backgrounds-card-bg-2); color: var(--text-primary); cursor: pointer; font: 500 14px/20px var(--font-geist); }
.sn-cta:hover { border-color: var(--strokes-card-selected); }
.sn-cta--primary { background: var(--backgrounds-button-primary); border-color: transparent; color: #fff; }
</style>
</head>
<body>
<div class="sn">
  <aside class="sn-side" aria-label="Platform">
    <div class="sn-brand"><span class="sn-logo"><svg width="18" height="16" viewBox="0 0 20 17.64" fill="none"><path d="M10 0 20 17.64H0L10 0Z" stroke="#0d99ff" stroke-width="1.6" stroke-linejoin="round"/></svg></span>cogentiq</div>
    <button class="sn-btn" data-go="marketplace.html" title="Marketplace"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2.5 6.5V13a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V6.5M1.75 3.5l1-1.75h10.5l1 1.75v1a2 2 0 0 1-4 0 2 2 0 0 1-4.25 0 2 2 0 0 1-4.25 0v-1Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>Marketplace</button>
    <button class="sn-btn" data-soon="Home" title="Home"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2.5 7 8 2.5 13.5 7v6.5h-4v-4h-3v4h-4V7Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>Home</button>
    <div class="sn-h">Build</div>
    <button class="sn-btn" data-go="automations.html" title="Automations"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="3.5" cy="8" r="1.6" stroke="currentColor" stroke-width="1.2"/><circle cx="12.5" cy="3.5" r="1.6" stroke="currentColor" stroke-width="1.2"/><circle cx="12.5" cy="12.5" r="1.6" stroke="currentColor" stroke-width="1.2"/><path d="M5.1 8h3m0-4.5h2.9M8 12.5h2.9M8 3.5v9" stroke="currentColor" stroke-width="1.2"/></svg>Automations</button>
    <button class="sn-btn" data-go="agents.html" title="Agents"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="3" y="5" width="10" height="8" rx="2" stroke="currentColor" stroke-width="1.3"/><path d="M8 2.5V5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>Agents</button>
    <button class="sn-btn" data-soon="Assistants" title="Assistants"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 3.5h10v7H7l-3 2.5v-2.5H3v-7Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>Assistants</button>
    <div class="sn-h">Library</div>
    <button class="sn-btn" data-soon="Tools" title="Tools"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M9.8 2.2a3.3 3.3 0 0 0-3.9 4.4L2.3 10.2a1.3 1.3 0 0 0 1.8 1.8l3.6-3.6a3.3 3.3 0 0 0 4.4-3.9l-2 2-1.6-.5-.5-1.6 2-2Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>Tools</button>
    <button class="sn-btn" data-soon="Skills" title="Skills"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="m8 2 1.7 3.6 3.8.5-2.8 2.6.7 3.8L8 10.7l-3.4 1.8.7-3.8-2.8-2.6 3.8-.5L8 2Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>Skills</button>
    <button class="sn-btn" data-soon="Integrations" title="Integrations"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 2v3M10 2v3M4.5 5h7v2.5a3.5 3.5 0 0 1-7 0V5ZM8 11v3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>Integrations</button>
    <button class="sn-btn" data-soon="Model Hub" title="Model Hub"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.3"/><path d="M8 2.5v11M2.5 8h11" stroke="currentColor" stroke-width="1.1"/></svg>Model Hub</button>
    <button class="sn-btn" data-soon="Guardrails" title="Guardrails"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1.75 13 3.5v4c0 3-2.2 5.4-5 6.75C5.2 12.9 3 10.5 3 7.5v-4L8 1.75Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>Guardrails</button>
    <div class="sn-h">Monitor</div>
    <button class="sn-btn" data-go="monitoring.html" title="Monitoring"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 12.5 6 8l3 3 5-6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>Monitoring</button>
  </aside>
  <main class="sn-main">
    <header class="sn-head">
      <h1 id="snTitle">Home</h1>
      <button class="sn-icon" title="Notifications" aria-label="Notifications"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M5 8.5a5 5 0 0 1 10 0v3.3l1.5 2.7h-13L5 11.8V8.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 16.5a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      <span class="hdr-avatar" title="Savio Govindu">S</span>
    </header>
    <div class="sn-body">
      <div class="sn-empty">
        <span class="ic"><svg width="26" height="26" viewBox="0 0 16 16" fill="none"><rect x="2.5" y="2.5" width="11" height="11" rx="2.5" stroke="currentColor" stroke-width="1.2"/><path d="M5.5 8h5M8 5.5v5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></span>
        <h2 id="snH">Home</h2>
        <p id="snP">This part of the platform isn't in this prototype. The Marketplace flows live in Agents, Automations, Monitoring and the Marketplace itself.</p>
        <div class="sn-acts">
          <button class="sn-cta sn-cta--primary" data-go="marketplace.html">Open the Marketplace</button>
          <button class="sn-cta" data-go="agents.html">Agents</button>
          <button class="sn-cta" data-go="automations.html">Automations</button>
        </div>
      </div>
    </div>
  </main>
</div>
<script>
(function () {
  var inShell = window.parent !== window;
  function setSection(name) {
    document.getElementById('snTitle').textContent = name;
    document.getElementById('snH').textContent = name;
    document.querySelectorAll('.sn-btn').forEach(function (b) { b.classList.toggle('is-on', b.getAttribute('data-soon') === name); });
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-go]');
    if (b) { if (inShell) parent.postMessage({ cqNav: b.getAttribute('data-go') }, '*'); return; }
    var s = e.target.closest('[data-soon]');
    if (s) setSection(s.getAttribute('data-soon'));
  });
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.cqTheme === 'light' || d.cqTheme === 'dark') document.documentElement.dataset.mode = d.cqTheme;
    if (typeof d.cqFocus === 'string' && d.cqFocus.indexOf('soon:') === 0) setSection(d.cqFocus.slice(5));
  });
})();
</script>
</body>
</html>
