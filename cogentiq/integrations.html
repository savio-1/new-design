  if (!el) return;
  state.cat = el.dataset.cat;
  state.sub = el.dataset.sub || null;
  renderSide(); render();
});

/* ════ Tabs ════
   The cq-seg component itself (design system, section 12) now supports
   an optional sliding thumb: give the segment a .cq-seg__thumb first
   child and keep it synced with cqSegSync() whenever is-active moves.
   Live and Templates are different enough — a table of what's actually
   connected versus a browsable catalogue — that they get different
   chrome, not just different content in the same shell. */
function cqSegSync(seg) {
  if (!seg) return;
  const thumb = seg.querySelector(':scope > .cq-seg__thumb');
  const active = seg.querySelector(':scope > button.is-active');
  if (!thumb || !active) return;
  thumb.style.width = active.offsetWidth + 'px';
  thumb.style.transform = `translateX(${active.offsetLeft - 4}px)`;
}

function applyTabView() {
  const live = state.tab === 'live';
  $('pageBody').classList.toggle('is-live', live);
  $('banner').hidden = live;
  $('barActions').hidden = !live;
  $('liveToolbar').hidden = !live;
  $('sections').hidden = live;
  $('tableWrap').hidden = !live;
  if (!live && liveState.selected) closePanel();
  if (live) renderTable(); else render();
}

document.querySelectorAll('[data-tab]').forEach(btn => btn.addEventListener('click', () => {
  state.tab = btn.dataset.tab;
  document.querySelectorAll('[data-tab]').forEach(b => {
    const on = b === btn;
    b.classList.toggle('is-active', on);
    b.setAttribute('aria-selected', on);
  });
  cqSegSync($('viewSeg'));
  closeAllPops();
  applyTabView();
}));
/* The thumb is sized off real button widths, so anything that can
   reflow the labels after first paint — the window resizing, the
   webfont finishing its swap-in — needs a re-sync or it's left sized
   for text metrics that no longer apply. */
window.addEventListener('resize', () => cqSegSync($('viewSeg')));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => cqSegSync($('viewSeg')));

$('q').addEventListener('input', e => { state.q = e.target.value; render(); });

/* ════ Platform panel: hover to open, one category open at a time ════ */
const rail = $('rail');
let railT;
rail.addEventListener('mouseenter', () => { clearTimeout(railT); railT = setTimeout(() => rail.classList.add('is-open'), 140); });
rail.addEventListener('mouseleave', () => { clearTimeout(railT); railT = setTimeout(() => rail.classList.remove('is-open'), 200); });
$('railCollapse').addEventListener('click', e => { e.stopPropagation(); rail.classList.remove('is-open'); });
rail.querySelectorAll('.cq-rail-ghead[aria-expanded]').forEach(head => {
  head.addEventListener('click', () => {
    const open = head.getAttribute('aria-expanded') === 'true';
    rail.querySelectorAll('.cq-rail-ghead[aria-expanded]').forEach(h => h.setAttribute('aria-expanded', 'false'));
    head.setAttribute('aria-expanded', String(!open));
  });
});

/* ════ Theme ════ */
function applyMode(mode) {
  root.dataset.mode = mode;
  root.style.colorScheme = mode;
  const dark = mode === 'dark';
  $('themeIcon').setAttribute('href', dark ? '#i-sun' : '#i-moon');
  $('themeToggle').title = dark ? 'Switch to light mode' : 'Switch to dark mode';
  $('themeToggle').setAttribute('aria-label', $('themeToggle').title);
}
$('themeToggle').addEventListener('click', () => {
  const next = root.dataset.mode === 'dark' ? 'light' : 'dark';
  applyMode(next);
  try { localStorage.setItem('cq-theme', next); } catch (e) { /* private mode */ }
});
let stored = null;
try { stored = localStorage.getItem('cq-theme'); } catch (e) { /* private mode */ }
applyMode(stored === 'light' ? 'light' : 'dark');

renderSide();
applyTabView();
cqSegSync($('viewSeg'));
</script>

<script>
/* ── Combined product · shared shell wiring ──────────────────────
   The platform rail and the light/dark switch belong to the product,
   not to any one page, so both are wired here: the rail routes to the
   sibling pages, and a theme picked on any page is the theme every
   other page opens in. */
(function () {
  var PAGES = {
    'home': 'index.html',
    'skills': 'skills.html',
    'skill': 'skills.html',
    'integrations': 'integrations.html',
    'model hub': 'model-hub.html',
    'doc store': 'doc-store.html'
  };
  var root = document.documentElement;
  var inShell = window.parent !== window;

  function go(url) {
    if (inShell) parent.postMessage({ cqNav: url }, '*');
    else window.location.href = url;
  }

  document.querySelectorAll('[aria-label="Platform"] button[title]').forEach(function (btn) {
    var url = PAGES[(btn.getAttribute('title') || '').trim().toLowerCase()];
    if (!url || btn.classList.contains('is-active')) return;
    btn.style.cursor = 'pointer';
    btn.addEventListener('click', function () { go(url); });
  });
  var brand = document.querySelector('.rail-brand, .cq-rail-brand');
  if (brand && !/index\.html$|\/cogentiq\/?$/.test(location.pathname)) {
    brand.style.cursor = 'pointer';
    brand.addEventListener('click', function () { go('index.html'); });
  }

  /* ── One theme across the product ──────────────────────────────
     Each page already owns a toggle that writes data-mode on <html>;
     watching that attribute picks up every page's own switch without
     reaching into its code. Standalone, the choice rides in
     localStorage; inside the shell, the shell holds it, because
     srcdoc frames each get their own opaque storage. */
  var THEME_KEY = 'cq-theme';
  var synced = null;

  function readStored() {
    try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; }
  }
  function writeStored(mode) {
    try { localStorage.setItem(THEME_KEY, mode); } catch (e) { /* private mode */ }
  }
  function paint(mode) {
    /* Claim the value before writing it: MutationObserver delivers on a
       microtask, so a flag set around the write would already be back
       to false by the time the callback ran, and the frame would echo
       the shell's own broadcast straight back at it. */
    synced = mode;
    if (root.dataset.mode === mode) return;
    if (typeof window.applyMode === 'function') window.applyMode(mode);
    else root.dataset.mode = mode;
  }

  new MutationObserver(function () {
    var mode = root.dataset.mode === 'light' ? 'light' : 'dark';
    if (mode === synced) return;
    synced = mode;
    writeStored(mode);
    if (inShell) parent.postMessage({ cqTheme: mode }, '*');
  }).observe(root, { attributes: true, attributeFilter: ['data-mode'] });

  window.addEventListener('message', function (e) {
    var mode = e.data && e.data.cqTheme;
    if (mode === 'light' || mode === 'dark') paint(mode);
  });

  if (inShell) parent.postMessage({ cqThemeRequest: true }, '*');
  else {
    var stored = readStored();
    if (stored === 'light' || stored === 'dark') paint(stored);
  }
})();
</script>

</body>
