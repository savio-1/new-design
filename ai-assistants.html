<meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cogentiq Assistants</title>
  <meta name="description" content="The assistants hub — search, filter and manage the workspace's AI assistants." />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400&display=swap" />
  <style>
/* ═══════════════════════════════════════════════════════════════════
   COGENTIQ DESIGN SYSTEM  ·  v0.1
   ───────────────────────────────────────────────────────────────────
   Variables and components extracted from the Model hub build, which
   was taken directly off the Figma library (Cogentiq · Builder).
   Token names match the Figma variable names one-for-one, so a value
   changed in Figma maps to exactly one line here.

   USAGE
     Link this stylesheet, then put class="cq" on the body element.
     Dark is the product default; set data-mode="light" on the root
     element to switch.

   Every component is written against tokens only, so both themes come
   free. Never hard-code a colour in a screen; if a value is missing,
   add a token here rather than a literal there.
   ═══════════════════════════════════════════════════════════════════ */


/* ═══════════════════════════════════════════════════════════════════
   1 · TOKENS — DARK  (the default)
   ═══════════════════════════════════════════════════════════════════ */
:root {
  /* ── Backgrounds · page ─────────────────────────────────────── */
  --backgrounds-page-bg-1:            #121212;  /* app ground          */
  --backgrounds-page-bg-2:            #212121;  /* cards, modals       */
  --backgrounds-page-bg-3:            #1b1b1b;  /* tiles, table header */
  --backgrounds-page-bg-4:            #121212;  /* content ground      */

  /* ── Backgrounds · card ─────────────────────────────────────── */
  --backgrounds-card-bg-2:            #212121;
  --backgrounds-card-bg-3:            #323232;
  --backgrounds-card-bg-4:            #323232;  /* hover fill          */
  --backgrounds-card-bg-5:            #1b1b1b;  /* header, sidebar     */

  /* ── Backgrounds · controls ─────────────────────────────────── */
  --backgrounds-button-primary:       #0d99ff;
  --backgrounds-button-tonal-1:       #093077;
  --backgrounds-disabled-tonal-1:     #093077;
  --backgrounds-disabled-tonal-2:     #424242;
  --backgrounds-seg-control-tabs-1:   #424242;
  --backgrounds-checkbox-default:     #1b1b1b;
  --backgrounds-checkbox-focus:       #0d99ff;
  --backgrounds-type-default-bg-1:    #323232;  /* input fill          */
  --backgrounds-type-default-bg-2:    #323232;
  --backgrounds-type-search-default:  #121212;
  --backgrounds-icon-blue-2:          #0d99ff33;
  --backgrounds-table-default:        #121212;
  --backgrounds-table-select:         #0d193f;

  /* ── Backgrounds · tone badges ──────────────────────────────── */
  --backgrounds-badge-blue:           #09112b;
  --backgrounds-badge-cyan:           #051b29;
  --backgrounds-badge-green:          #031d11;
  --backgrounds-badge-indigo:         #0b0f2e;
  --backgrounds-badge-light-green:    #14280c;

  /* ── Strokes ────────────────────────────────────────────────── */
  --strokes-card-default:             #424242;
  --strokes-card-selected:            #0d99ff;
  --strokes-line-1:                   #424242;
  --strokes-line-3:                   #323232;  /* hairline divider    */
  --strokes-type-default:             #424242;
  --strokes-type-focus:               #007be5;
  --strokes-checkbox-default:         #616161;
  --strokes-checkbox-focus:           #0d99ff;
  --strokes-icon-default:             #9e9e9e;
  --strokes-colour-blue:              #093077;
  --strokes-colour-cyan:              #093c53;
  --strokes-colour-green:             #0a3a22;
  --strokes-colour-indigo:            #2b3180;
  --strokes-colour-light-green:       #214314;

  /* ── Text ───────────────────────────────────────────────────── */
  --text-primary:                     #ffffff;
  --text-secondary:                   #bdbdbd;
  --text-teritiary:                   #8c8c8c;  /* spelling per Figma  */
  --text-button-white:                #ffffff;
  --text-button-tonal-1:              #80caff;
  --text-button-tonal-2:              #bdbdbd;
  --text-disabled-tonal-1:            #0768cf;
  --text-disabled-tonal-2:            #757575;
  --text-coloured-blue:               #44aaf3;
  --text-coloured-cyan:               #35caf0;
  --text-coloured-green:              #85e0a3;
  --text-coloured-indigo:             #a0a5f7;
  --text-coloured-light-green:        #7cb342;

  /* ── Effects ────────────────────────────────────────────────── */
  --scrim:          rgba(18, 18, 18, .6);
  --shadow-card:    drop-shadow(0 1px 1.5px rgba(18, 18, 18, .16));
  --shadow-bar:     drop-shadow(0 1px 1px rgba(18, 18, 18, .12));
  --shadow-sidebar: drop-shadow(1px 0 1px rgba(18, 18, 18, .12));
  --shadow-tab:     0 1px 2px rgba(33, 33, 33, .2);
  --shadow-modal:   0 4px 12px rgba(33, 33, 33, .16);
  --shadow-panel:   -8px 0 24px rgba(0, 0, 0, .2);
  --shadow-rail:    8px 0 28px rgba(0, 0, 0, .38);
  --shadow-pop:     0 -1px 2px rgba(0, 0, 0, .04), 0 4px 8px rgba(0, 0, 0, .12), 0 2px 16px rgba(33, 33, 33, .16);
  /* For a surface that floats over another panel. A shadow tuned for white
     ground all but vanishes on a dark one, so this is deliberately heavier
     than --shadow-pop — it is what gives the Tiq bar its hierarchy. */
  /* Carries the Marketplace pill past where its fixed-size art reaches: the
     art is drawn for the 36px tile, so at 208px the right end runs out.
     Transparent under the art, so the crunched tile is untouched. Light is
     sampled from the component (Figma names the fill Gradient/blue but
     returns no value); dark is derived in the art's own family. */
  --gradient-blue-wash: linear-gradient(90deg, rgba(62, 99, 116, 0) 46%, rgba(62, 99, 116, 1) 86%);
  --shadow-tiq:     0 2px 6px rgba(0, 0, 0, .40), 0 14px 32px rgba(0, 0, 0, .52), 0 28px 64px rgba(0, 0, 0, .40);

  /* The exported OpenAI mark is one shape, so it inverts per theme. */
  --logo-openai: #ffffff;

  /* ── Palette ramps · identical in both themes ───────────────── */
  --blue-300: #bde3ff;   --blue-500: #0d99ff;   --blue-600: #007be5;
  --indigo-300: #c2c5fa; --indigo-500: #5860ed; --indigo-600: #454de0;
  --purple-300: #e4ccff; --purple-500: #9747ff; --purple-600: #8638e5;
  --orange-300: #fcd19c; --orange-600: #fc9e24; --orange-800: #dd7c0e;
  --green-300: #aff4c6;  --green-500: #14ae5c;  --green-600: #009951;
  --cyan-400:  #75d7f0;
  --flag-sheen: rgba(255, 255, 255, .30);

  /* ── Type ───────────────────────────────────────────────────── */
  --font-geist:      "Geist", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-geist-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --fs-caption: 12px;
  --fs-body-3:  14px;
  --fs-body-2:  16px;
  --lh-body-3:  20px;
  --lh-body-2:  24px;

  /* ── Radius · the four the product actually uses ────────────── */
  --radius-sm:   6px;   /* tags, small tiles     */
  --radius-md:   8px;   /* buttons, inputs       */
  --radius-lg:  12px;   /* cards, modals, pills  */
  --radius-xl:  14px;   /* floating prompt bars  */
  --radius-full: 9999px;

  /* ── Layout constants ───────────────────────────────────────── */
  --rail-w:    68px;
  --rail-w-open: 240px;
  --sidebar-w: 240px;
  --panel-w:   420px;
  --tiq-dock-w: 360px;
  --card-h:    120px;
}

/* ═══════════════════════════════════════════════════════════════════
   2 · TOKENS — LIGHT
   Only the themed values are restated; ramps, type and layout above
   are theme-independent and must not be duplicated here.
   ═══════════════════════════════════════════════════════════════════ */
:root[data-mode="light"] {
  --backgrounds-page-bg-1:            #fafafa;
  --backgrounds-page-bg-2:            #ffffff;
  --backgrounds-page-bg-3:            #f5f5f5;
  --backgrounds-page-bg-4:            #f0f0f0;

  --backgrounds-card-bg-2:            #ffffff;
  --backgrounds-card-bg-3:            #ffffff;
  --backgrounds-card-bg-4:            #f5f5f5;
  --backgrounds-card-bg-5:            #ffffff;

  --backgrounds-button-primary:       #0d99ff;
  --backgrounds-button-tonal-1:       #e5f4ff;
  --backgrounds-disabled-tonal-1:     #e5f4ff;
  --backgrounds-disabled-tonal-2:     #eeeeee;
  --backgrounds-seg-control-tabs-1:   #eeeeee;
  --backgrounds-checkbox-default:     #ffffff;
  --backgrounds-checkbox-focus:       #0d99ff;
  --backgrounds-type-default-bg-1:    #f5f5f5;
  --backgrounds-type-default-bg-2:    #ffffff;
  --backgrounds-type-search-default:  #f5f5f5;
  --backgrounds-icon-blue-2:          #0d99ff33;
  --backgrounds-table-default:        #ffffff;
  --backgrounds-table-select:         #e5f4ff;

  --backgrounds-badge-blue:           #f2f9ff;
  --backgrounds-badge-cyan:           #effcff;
  --backgrounds-badge-green:          #ebffee;
  --backgrounds-badge-indigo:         #f0f1fe;
  --backgrounds-badge-light-green:    #f1f8e9;

  --strokes-card-default:             #eeeeee;
  --strokes-card-selected:            #0d99ff;
  --strokes-line-1:                   #eeeeee;
  --strokes-line-3:                   #f5f5f5;
  --strokes-type-default:             #e0e0e0;
  --strokes-type-focus:               #0d99ff;
  --strokes-checkbox-default:         #bdbdbd;
  --strokes-checkbox-focus:           #0d99ff;
  --strokes-icon-default:             #616161;
  --strokes-colour-blue:              #e5f4ff;
  --strokes-colour-cyan:              #cef0f8;
  --strokes-colour-green:             #aff4c6;
  --strokes-colour-indigo:            #c2c5fa;
  --strokes-colour-light-green:       #c5e1a5;

  --text-primary:                     #121212;
  --text-secondary:                   #616161;
  --text-teritiary:                   #8c8c8c;
  --text-button-white:                #ffffff;
  --text-button-tonal-1:              #007be5;
  --text-button-tonal-2:              #757575;
  --text-disabled-tonal-1:            #80caff;
  --text-disabled-tonal-2:            #bdbdbd;
  --text-coloured-blue:               #0d99ff;
  --text-coloured-cyan:               #00a2c2;
  --text-coloured-green:              #14ae5c;
  --text-coloured-indigo:             #5860ed;
  --text-coloured-light-green:        #689f38;

  --scrim:          rgba(18, 18, 18, .45);
  --shadow-card:    drop-shadow(0 1px 1.5px rgba(18, 18, 18, .08));
  --shadow-bar:     drop-shadow(0 1px 1px rgba(18, 18, 18, .06));
  --shadow-sidebar: drop-shadow(1px 0 1px rgba(18, 18, 18, .06));
  --shadow-tab:     0 1px 2px rgba(33, 33, 33, .12);
  --shadow-modal:   0 4px 12px rgba(33, 33, 33, .12);
  --shadow-panel:   -8px 0 24px rgba(18, 18, 18, .12);
  --shadow-rail:    8px 0 28px rgba(18, 18, 18, .14);
  --shadow-pop:     0 -1px 2px rgba(0, 0, 0, .04), 0 4px 8px rgba(18, 18, 18, .08), 0 2px 16px rgba(33, 33, 33, .10);
  --gradient-blue-wash: linear-gradient(90deg, rgba(188, 235, 249, 0) 46%, rgba(188, 235, 249, 1) 86%);
  --flag-sheen: rgba(13, 153, 255, .28);
  --shadow-tiq:     0 2px 6px rgba(18, 18, 18, .06), 0 12px 28px rgba(18, 18, 18, .14), 0 24px 56px rgba(33, 33, 33, .10);

  --logo-openai: #121212;
}

/* ═══════════════════════════════════════════════════════════════════
   3 · BASE
   ═══════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; }

/* Put .cq on the body, or on a wrapper when the body is not yours. */
.cq {
  background: var(--backgrounds-page-bg-1);
  color: var(--text-primary);
  font-family: var(--font-geist);
  -webkit-font-smoothing: antialiased;
}
body.cq { margin: 0; }
/* Wrapped in :where() so the reset carries ZERO specificity. A plain
   `.cq button` selector is (0,1,1) and silently outranks a (0,1,0)
   component class — which is how a component that sets its own
   background ends up transparent. Keep new resets in :where() too. */
:where(.cq button) { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:where(.cq input, .cq textarea, .cq select) { font: inherit; color: inherit; background: none; border: 0; outline: 0; }
.cq :focus-visible { outline: 2px solid var(--strokes-type-focus); outline-offset: 2px; }

/* ═══════════════════════════════════════════════════════════════════
   4 · TYPE RAMP
   Named after the Figma text styles. Use these rather than setting
   font-size ad hoc — the ramp is the whole scale the product uses.
   ═══════════════════════════════════════════════════════════════════ */
.cq-subhead1-med { font: 500 24px/32px var(--font-geist); letter-spacing: -0.96px; }
.cq-subhead2-med { font: 500 18px/24px var(--font-geist); letter-spacing: -0.72px; }
.cq-body1-med    { font: 500 var(--fs-body-2)/var(--lh-body-2) var(--font-geist); letter-spacing: -0.64px; }
.cq-body1-reg    { font: 400 var(--fs-body-2)/var(--lh-body-2) var(--font-geist); letter-spacing: -0.64px; }
.cq-body2-med    { font: 500 var(--fs-body-3)/var(--lh-body-3) var(--font-geist); letter-spacing: -0.56px; }
.cq-body2-reg    { font: 400 var(--fs-body-3)/var(--lh-body-3) var(--font-geist); letter-spacing: -0.56px; }
.cq-caption-med  { font: 500 var(--fs-caption)/var(--fs-body-2) var(--font-geist); letter-spacing: -0.24px; }
.cq-caption-reg  { font: 400 var(--fs-caption)/var(--fs-body-2) var(--font-geist); letter-spacing: -0.24px; }
.cq-mono         { font: 400 11px/1 var(--font-geist-mono); letter-spacing: -0.11px; }

.cq-text-primary   { color: var(--text-primary); }
.cq-text-secondary { color: var(--text-secondary); }
.cq-text-tertiary  { color: var(--text-teritiary); }

/* ═══════════════════════════════════════════════════════════════════
   5 · BUTTONS
   Figma strokes sit INSIDE the box, so every bordered control below
   carries an explicit height. Without it a 1px border grows the
   control 2px past its designed size.
   ═══════════════════════════════════════════════════════════════════ */
.cq-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  height: 36px; padding: 0 12px;
  border-radius: var(--radius-md);
  font: 500 var(--fs-body-3)/var(--lh-body-3) var(--font-geist); letter-spacing: -0.56px;
  white-space: nowrap;
  transition: background .15s ease, filter .15s ease, color .15s ease;
}
.cq-btn--sm { height: 32px; }
.cq-btn--wide { width: 140px; }

.cq-btn--primary { background: var(--backgrounds-button-primary); color: var(--text-button-white); }
.cq-btn--primary:hover { filter: brightness(1.08); }

.cq-btn--tonal { background: var(--backgrounds-button-tonal-1); color: var(--text-button-tonal-1); }
.cq-btn--tonal:hover { filter: brightness(1.18); }

.cq-btn--ghost { color: var(--text-secondary); }
.cq-btn--ghost:hover { background: var(--backgrounds-card-bg-4); color: var(--text-primary); }

.cq-btn:disabled,
.cq-btn[aria-disabled="true"] {
  background: var(--backgrounds-disabled-tonal-2);
  color: var(--text-disabled-tonal-2);
  cursor: not-allowed; filter: none;
}

/* Icon-only. 32px is the default; --sm is the 24px in-card size. */
.cq-icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: var(--radius-md);
  color: var(--text-teritiary);
  transition: background .15s ease, color .15s ease;
}
.cq-icon-btn--sm { width: 24px; height: 24px; border-radius: var(--radius-sm); }
.cq-icon-btn:hover { background: var(--backgrounds-card-bg-4); color: var(--text-primary); }

/* ═══════════════════════════════════════════════════════════════════
   6 · FORM FIELDS
   ═══════════════════════════════════════════════════════════════════ */
.cq-field { display: flex; flex-direction: column; gap: 4px; }
.cq-field__label {
  color: var(--text-primary);
  font: 400 var(--fs-body-3)/var(--lh-body-3) var(--font-geist); letter-spacing: -0.56px;
}
.cq-field__label-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

.cq-control {
  width: 100%;
  display: flex; align-items: center; gap: 8px;
  padding: 12px; border-radius: var(--radius-md);
  background: var(--backgrounds-type-default-bg-1);
  border: 1px solid var(--strokes-type-default);
  color: var(--text-primary);
  transition: border-color .15s ease;
}
.cq-control:focus-within { border-color: var(--strokes-type-focus); }
.cq-control > input,
.cq-control > select,
.cq-control > textarea {
  flex: 1 1 auto; min-width: 0;
  color: var(--text-primary);
  font: 400 var(--fs-body-3)/var(--lh-body-3) var(--font-geist); letter-spacing: -0.56px;
}
.cq-control input::placeholder,
.cq-control textarea::placeholder { color: var(--text-teritiary); }
.cq-control select { appearance: none; cursor: pointer; }
.cq-control select option { background: var(--backgrounds-page-bg-2); color: var(--text-primary); }
.cq-control--textarea { align-items: flex-start; height: 96px; }
.cq-control--textarea textarea { resize: none; height: 72px; }
.cq-control .cq-ic { color: var(--text-teritiary); flex: none; }

/* Search — a lighter field used in bars and popovers. */
.cq-search {
  display: flex; align-items: center; gap: 8px;
  height: 36px; padding: 0 12px; border-radius: var(--radius-md);
  background: var(--backgrounds-type-search-default);
  border: 1px solid var(--strokes-type-default);
  color: var(--text-teritiary);
  transition: border-color .15s ease;
}
.cq-search--sm { height: 32px; }
.cq-search:focus-within { border-color: var(--strokes-type-focus); }
.cq-search input { flex: 1 1 auto; min-width: 0; color: var(--text-primary); }
.cq-search input::placeholder { color: var(--text-teritiary); }

/* Checkbox */
.cq-checkbox {
  width: 16px; height: 16px; flex: none; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  background: var(--backgrounds-checkbox-default);
  border: 1px solid var(--strokes-checkbox-default);
}
.cq-checkbox > svg { display: none; width: 12px; height: 12px; color: #fff; }
.is-checked > .cq-checkbox,
.cq-checkbox.is-checked {
  background: var(--backgrounds-checkbox-focus);
  border-color: var(--backgrounds-checkbox-focus);
}
.is-checked > .cq-checkbox > svg,
.cq-checkbox.is-checked > svg { display: block; }

/* Range — set --fill (a %) to colour the track up to the thumb. */
.cq-range {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 6px; padding: 0; margin: 0;
  border-radius: var(--radius-full); cursor: pointer;
  background: linear-gradient(to right,
    var(--backgrounds-button-primary) 0 var(--fill, 35%),
    var(--strokes-card-default) var(--fill, 35%) 100%);
}
.cq-range::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--backgrounds-button-primary);
  border: 2px solid var(--text-button-white);
  box-shadow: var(--shadow-card);
}
.cq-range::-moz-range-thumb {
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--backgrounds-button-primary);
  border: 2px solid var(--text-button-white);
}

/* ═══════════════════════════════════════════════════════════════════
   7 · FILTER DROPDOWN + POPOVER
   ═══════════════════════════════════════════════════════════════════ */
.cq-filter-group { position: relative; }

.cq-dropdown {
  height: 32px;
  display: inline-flex; align-items: center; gap: 4px;
  padding: 0 8px 0 12px; border-radius: var(--radius-md);
  background: var(--backgrounds-card-bg-5);
  border: 1px solid var(--strokes-line-3);
  color: var(--text-secondary);
  font: 400 var(--fs-body-3)/var(--lh-body-3) var(--font-geist); letter-spacing: -0.56px;
  white-space: nowrap;
}
.cq-dropdown:hover { border-color: var(--strokes-line-1); }
.cq-dropdown.is-open { border-color: var(--strokes-checkbox-focus); }
.cq-dropdown .cq-ic { color: var(--text-teritiary); }
.cq-dropdown__badge {
  display: none;
  min-width: 20px; height: 20px; align-items: center; justify-content: center;
  padding: 0 4px; border-radius: var(--radius-md);
  background: var(--backgrounds-badge-blue);
  border: 1px solid var(--strokes-colour-blue);
  color: var(--text-coloured-blue);
  font: 400 var(--fs-caption)/var(--fs-body-2) var(--font-geist); letter-spacing: -0.24px;
}
.cq-dropdown.has-count .cq-dropdown__badge { display: flex; }

.cq-pop {
  position: absolute; top: 36px; left: 0; z-index: 40; width: 277px;
  max-width: calc(100vw - 32px);
  display: none; flex-direction: column;
  padding: 4px 0 8px;
  background: var(--backgrounds-card-bg-3);
  border: 1px solid var(--strokes-card-default);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-pop);
}
.cq-pop.is-open { display: flex; }
.cq-pop__head { display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
.cq-pop__list { display: flex; flex-direction: column; padding: 0 8px; max-height: 288px; overflow-y: auto; }
.cq-pop__empty { padding: 10px 16px 14px; color: var(--text-teritiary); }

/* One row in a popover — checkbox multi-select or tick single-select. */
.cq-option {
  width: 100%; height: 36px;
  display: flex; align-items: center; gap: 8px;
  padding: 0 16px; border-radius: var(--radius-md);
  color: var(--text-secondary);
  font: 400 var(--fs-body-3)/var(--lh-body-3) var(--font-geist); letter-spacing: -0.56px;
  text-align: left;
}
.cq-option:hover { background: var(--backgrounds-card-bg-4); }
.cq-option.is-checked, .cq-option.is-picked { color: var(--text-primary); }
.cq-option__label { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cq-option__tick { display: none; flex: none; color: var(--text-coloured-blue); }
.cq-option.is-picked .cq-option__tick { display: block; }

/* ═══════════════════════════════════════════════════════════════════
   8 · TAGS, BADGES & PILLS
   Five semantic tones. Set data-tone on the element; the tone drives
   text colour on .cq-tag and text + fill + stroke on .cq-badge.
   ═══════════════════════════════════════════════════════════════════ */

/* Category tag — grey at rest, coloured on an interactive parent that
   carries .cq-tint (cards and table rows apply it on hover/select). */
.cq-tag {
  height: 16px;
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0 6px; border-radius: var(--radius-sm);
  border: 1px solid var(--strokes-line-1);
  font: 400 11px/1 var(--font-geist-mono); letter-spacing: -0.11px;
  color: var(--text-teritiary);
  white-space: nowrap;
  transition: color .15s ease;
}
/* Model-id pill — always neutral, rounder, on the page ground. */
.cq-tag--model {
  border-radius: var(--radius-lg); padding: 0 8px;
  background: var(--backgrounds-page-bg-1);
  border-color: var(--strokes-card-default);
}

.cq-tag[data-tone="blue"].is-tinted,        .cq-tint:hover .cq-tag[data-tone="blue"],        .cq-tint.is-selected .cq-tag[data-tone="blue"]        { color: var(--text-coloured-blue); }
.cq-tag[data-tone="indigo"].is-tinted,      .cq-tint:hover .cq-tag[data-tone="indigo"],      .cq-tint.is-selected .cq-tag[data-tone="indigo"]      { color: var(--text-coloured-indigo); }
.cq-tag[data-tone="green"].is-tinted,       .cq-tint:hover .cq-tag[data-tone="green"],       .cq-tint.is-selected .cq-tag[data-tone="green"]       { color: var(--text-coloured-green); }
.cq-tag[data-tone="cyan"].is-tinted,        .cq-tint:hover .cq-tag[data-tone="cyan"],        .cq-tint.is-selected .cq-tag[data-tone="cyan"]        { color: var(--text-coloured-cyan); }
.cq-tag[data-tone="light-green"].is-tinted, .cq-tint:hover .cq-tag[data-tone="light-green"], .cq-tint.is-selected .cq-tag[data-tone="light-green"] { color: var(--text-coloured-light-green); }

/* Filled tone badge — used where the tag must read without a hover. */
.cq-badge {
  height: 18px;
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0 6px; border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font: 400 var(--fs-caption)/1 var(--font-geist-mono); letter-spacing: -0.12px;
  white-space: nowrap;
}
.cq-badge[data-tone="blue"]        { background: var(--backgrounds-badge-blue);        border-color: var(--strokes-colour-blue);        color: var(--text-coloured-blue); }
.cq-badge[data-tone="indigo"]      { background: var(--backgrounds-badge-indigo);      border-color: var(--strokes-colour-indigo);      color: var(--text-coloured-indigo); }
.cq-badge[data-tone="green"]       { background: var(--backgrounds-badge-green);       border-color: var(--strokes-colour-green);       color: var(--text-coloured-green); }
.cq-badge[data-tone="cyan"]        { background: var(--backgrounds-badge-cyan);        border-color: var(--strokes-colour-cyan);        color: var(--text-coloured-cyan); }
.cq-badge[data-tone="light-green"] { background: var(--backgrounds-badge-light-green); border-color: var(--strokes-colour-light-green); color: var(--text-coloured-light-green); }

/* Count pill — the "32" beside a page title. */
.cq-count {
  height: 24px;
  display: inline-flex; align-items: center; gap: 4px; padding: 0 6px;
  border-radius: var(--radius-md);
  background: var(--backgrounds-card-bg-4);
  border: 1px solid var(--strokes-type-default);
  color: var(--text-teritiary);
  font: 400 var(--fs-caption)/var(--fs-body-2) var(--font-geist); letter-spacing: -0.24px;
}

/* Status pill — semantic, always reads without hover. */
.cq-status {
  height: 24px;
  display: inline-flex; align-items: center; gap: 4px; padding: 0 8px;
  border-radius: var(--radius-lg);
  background: var(--backgrounds-badge-green);
  color: var(--text-coloured-green);
  font: 500 var(--fs-caption)/var(--fs-body-2) var(--font-geist); letter-spacing: -0.24px;
}
.cq-status--dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }

/* Provider pill — logo + vendor + model id, split by a hairline. */
.cq-provider-pill {
  height: 24px;
  display: inline-flex; align-items: center; gap: 4px; padding: 0 8px;
  border-radius: var(--radius-lg);
  background: var(--backgrounds-card-bg-4);
  border: 1px solid var(--strokes-line-3);
  color: var(--text-secondary);
  font: 400 var(--fs-caption)/var(--fs-body-2) var(--font-geist); letter-spacing: -0.24px;
}
.cq-provider-pill__divider { width: 1px; height: 14px; background: var(--strokes-line-1); flex: none; }

/* ═══════════════════════════════════════════════════════════════════
   9 · AVATAR
   ═══════════════════════════════════════════════════════════════════ */
.cq-avatar {
  position: relative; flex: none;
  width: 20px; height: 20px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--indigo-500);
  color: #fff;
  font: 400 var(--fs-caption)/var(--fs-body-2) var(--font-geist); letter-spacing: -0.24px;
}
.cq-avatar--lg { width: 32px; height: 32px; font-size: var(--fs-body-3); }
.cq-avatar img { width: 100%; height: 100%; border-radius: 50%; display: block; }

/* Logo tile — a provider mark centred on a rounded ground. */
.cq-logo-tile {
  width: 32px; height: 32px; flex: none;
  border-radius: var(--radius-sm); overflow: hidden;
  background: var(--backgrounds-page-bg-3);
  display: flex; align-items: center; justify-content: center;
  color: var(--logo-openai);
}
.cq-logo-tile--sm { width: 16px; height: 16px; border-radius: 4px; background: none; }
.cq-logo-tile img, .cq-logo-tile svg { display: block; }

/* Hovering a card eases its mark up a touch inside the tile. Only the mark
   moves — the tile ground is page/bg-3, the same #f5f5f5 as card/bg-4 in
   light mode, so animating the ground would be invisible in that theme.
   Scoped to .cq-card because a card mark sits at 24px inside the 32px tile
   and has room to grow; table rows fill the tile edge to edge, where any
   scale would clip against `overflow: hidden`. */
.cq-logo-tile > * { transition: transform .34s cubic-bezier(.22, .61, .36, 1); }
.cq-card:hover .cq-logo-tile > * { transform: translateY(-1px) scale(1.06); }

/* ══════════════════════════════════════════════════════════════════
   10 · CARD
   ══════════════════════════════════════════════════════════════════ */
.cq-card {
  width: 100%; height: var(--card-h);
  display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
  padding: 16px; border-radius: var(--radius-lg);
  background: var(--backgrounds-page-bg-2);
  border: 1px solid transparent;
  filter: var(--shadow-card);
  text-align: left;
  transition: border-color .15s ease, background .15s ease;
}
.cq-card:hover { border-color: var(--strokes-line-1); }
.cq-card.is-selected, .cq-card.is-selected:hover { border-color: var(--strokes-type-focus); }
.cq-card__head { width: 100%; display: flex; flex-direction: column; gap: 4px; }
.cq-card__title-row { width: 100%; display: flex; align-items: center; gap: 8px; padding: 2px 0; }
.cq-card__title { color: var(--text-primary); }
.cq-card__desc {
  width: 100%;
  font: 400 12px/16px var(--font-geist); letter-spacing: -0.24px;
  color: var(--text-teritiary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  transition: color .15s ease;
}
.cq-card:hover .cq-card__desc, .cq-card.is-selected .cq-card__desc { color: var(--text-secondary); }
.cq-card__foot { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cq-card__tags { display: flex; align-items: center; gap: 6px; min-width: 0; }

/* ══════════════════════════════════════════════════════════════════
   11 · TABLE
   Column widths are the screen's business — set --cq-cols per table.
   ══════════════════════════════════════════════════════════════════ */
.cq-table {
  --cq-cols: 360px minmax(140px, 1fr) 200px 160px minmax(120px, 1fr) 100px;
  border: 1px solid var(--strokes-line-3);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.cq-thead, .cq-row { display: grid; grid-template-columns: var(--cq-cols); align-items: center; }
.cq-thead { height: 32px; background: var(--backgrounds-page-bg-3); }
.cq-thead > * {
  padding: 8px 12px; color: var(--text-secondary);
  font: 500 var(--fs-caption)/var(--fs-body-2) var(--font-geist); letter-spacing: -0.24px;
}
.cq-row {
  width: 100%; height: 66px;
  background: var(--backgrounds-table-default);
  border-top: 1px solid var(--strokes-line-3);
  text-align: left; cursor: pointer;
  transition: background .15s ease;
}
.cq-row:hover { background: var(--backgrounds-page-bg-3); }
.cq-row.is-selected {
  background: var(--backgrounds-table-select);
  box-shadow: inset 3px 0 0 var(--strokes-card-selected);
}
.cq-cell { min-width: 0; padding: 12px; display: flex; align-items: center; gap: 8px; }
.cq-cell--muted { color: var(--text-teritiary); }

/* ══════════════════════════════════════════════════════════════════
   11b · PAGE SHELL
   The frame every module page shares. Widths and surfaces here are
   fixed across modules — see the page guidelines for what may vary.
   ══════════════════════════════════════════════════════════════════ */
/* The gutter is constant because .cq-rail overlays rather than pushes. */
.cq-page {
  display: flex; height: 100vh; padding-left: var(--rail-w);
  background: var(--backgrounds-page-bg-1);
}

.cq-page__rail {
  width: var(--rail-w); flex: none;
  display: flex; flex-direction: column; align-items: flex-start; gap: 16px;
  padding: 8px 16px; overflow: hidden;
  background: var(--backgrounds-page-bg-1);
}

/* The frame is inset 8px from the rail and the window edges, which is
   what gives the product its floating-panel look. */
.cq-page__main { flex: 1 1 auto; min-width: 0; padding: 8px 8px 8px 0; }
.cq-page__frame {
  height: 100%;
  display: flex; flex-direction: column;
  border: 1px solid var(--strokes-line-3);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.cq-page__header {
  flex: none; height: 48px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 16px;
  background: var(--backgrounds-card-bg-5);
  border-bottom: 1px solid var(--strokes-line-3);
}

.cq-page__body { flex: 1 1 auto; min-height: 0; display: flex; }

.cq-page__sidebar {
  width: var(--sidebar-w); flex: none;
  padding: 20px 12px 24px;
  background: var(--backgrounds-card-bg-5);
  border-right: 1px solid var(--strokes-line-3);
  overflow-y: auto;
  filter: var(--shadow-sidebar);
}

.cq-page__col { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }

.cq-page__bar {
  flex: none; height: 60px;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 24px;
  background: var(--backgrounds-card-bg-5);
  border-bottom: 1px solid var(--strokes-line-3);
  filter: var(--shadow-bar);
}

.cq-page__content {
  flex: 1 1 auto; min-height: 0; overflow-y: auto;
  padding: 16px 24px 24px;
  background: var(--backgrounds-page-bg-4);
}

/* Card grid — set --cq-card-min per module to choose the column count.
   At the standard 1076px content width: 430px gives 2 up, 340px gives
   3 up. auto-fill means both drop a column on a narrow window rather
   than squeezing. */
.cq-card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(var(--cq-card-min, 430px), 1fr));
  gap: 12px;
}
.cq-card-grid[hidden] { display: none; }
.cq-card-grid--3up { --cq-card-min: 340px; }

/* A card whose height follows its content, for modules that carry more
   or less than the model card's fixed three rows. */
.cq-card--auto { height: auto; min-height: var(--card-h); }

/* ══════════════════════════════════════════════════════════════════
   12 · SEGMENTED CONTROLS
   ══════════════════════════════════════════════════════════════════ */
/* Text tabs — panel sections, wizard steps. */
.cq-seg {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px; border-radius: var(--radius-lg);
  background: var(--backgrounds-seg-control-tabs-1);
}
.cq-seg > button {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 4px 8px; border-radius: var(--radius-md);
  color: var(--text-button-tonal-2);
  font: 500 var(--fs-body-3)/var(--lh-body-3) var(--font-geist); letter-spacing: -0.56px;
  white-space: nowrap;
}
.cq-seg > button.is-active {
  background: var(--backgrounds-card-bg-2);
  color: var(--text-primary);
  box-shadow: var(--shadow-tab);
}
/* Numbered step variant sits on the same base, with grey idle labels. */
.cq-seg--steps > button { color: var(--text-teritiary); }

/* Icon toggle — view switchers. Active reads blue-on-tint. */
.cq-seg--icon {
  gap: 4px; padding: 4px; border-radius: 10px;
  background: var(--backgrounds-page-bg-2);
}
.cq-seg--icon > button {
  padding: 4px; border-radius: var(--radius-md);
  color: var(--text-teritiary);
}
.cq-seg--icon > button.is-active {
  background: var(--backgrounds-icon-blue-2);
  color: var(--text-coloured-blue);
  box-shadow: none;
}

/* ══════════════════════════════════════════════════════════════════
   13 · NAVIGATION
   ══════════════════════════════════════════════════════════════════ */
.cq-nav-item {
  width: 100%; height: 36px;
  display: flex; align-items: center; gap: 6px;
  padding: 0 12px; border-radius: var(--radius-md);
  border: 1px solid transparent;
  color: var(--text-teritiary);
  font: 400 var(--fs-body-3)/var(--lh-body-3) var(--font-geist); letter-spacing: -0.56px;
  text-align: left;
  transition: background .15s ease, color .15s ease;
}
.cq-nav-item__label { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cq-nav-item:hover { background: var(--backgrounds-card-bg-4); }
.cq-nav-item.is-active {
  background: var(--backgrounds-table-select);
  border-color: var(--strokes-colour-blue);
  color: var(--text-coloured-blue);
  font-weight: 500;
}
.cq-nav-item.is-active:hover { background: var(--backgrounds-table-select); }

/* Platform panel — two variants of one component: crunched at 68px and
   opened at 240px. Content width is the only real difference, 36px vs
   208px, so the same rules drive both and the labels simply appear.

   Every row is `justify-content: center` with 8px padding: that puts the
   icon at x=10 in a 36px box and at x=8 once a label flexes beside it —
   exactly the two positions the component specifies, from one rule.

   A group's expanded state is independent of the width, so crunching the
   panel never loses it. */
.cq-rail {
  position: fixed; left: 0; top: 0; bottom: 0; z-index: 80;
  width: var(--rail-w);
  background: var(--backgrounds-page-bg-1);
  display: flex; flex-direction: column; align-items: stretch; gap: 16px;
  padding: 8px 16px;
  overflow-x: hidden; overflow-y: auto;
  transition: width .26s cubic-bezier(.4, 0, .2, 1), box-shadow .26s ease;
}
/* The panel opens on hover and lays itself over the page. The shell keeps a
   constant --rail-w gutter (see .cq-page), so nothing reflows behind it:
   a hover is not worth relaying out a whole page for, and content that
   shifts under the cursor is content you then have to find again. Fixed and
   above the scrim, so it stays reachable while a detail panel is open. */
.cq-rail.is-open { width: var(--rail-w-open); box-shadow: var(--shadow-rail); }
.cq-rail__label {
  flex: 1 1 auto; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left;
  font: 400 var(--fs-body-3)/var(--lh-body-3) var(--font-geist); letter-spacing: -0.56px;
  color: var(--text-primary);
}
.cq-rail:not(.is-open) .cq-rail__label { display: none; }
.cq-rail__group { display: flex; flex-direction: column; align-items: stretch; gap: 12px; }
.cq-rail__stack { display: flex; flex-direction: column; align-items: stretch; }
/* Zero-height in the component, stroke drawn above it — a 1px box here
   adds a row and pushes everything below out of the 16px rhythm. */
.cq-rail__rule { position: relative; width: 100%; height: 0; flex: none; }
.cq-rail__rule::before {
  content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 1px;
  background: var(--strokes-line-1);
}

.cq-rail-btn {
  width: 100%; height: 36px; flex: none;
  border-radius: var(--radius-md); padding: 8px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  color: var(--strokes-icon-default);
  transition: background .15s ease, color .15s ease;
}
.cq-rail-btn > svg { flex: none; }
.cq-rail-btn:hover { background: var(--backgrounds-card-bg-4); color: var(--text-secondary); }
.cq-rail-btn.is-active {
  background: var(--backgrounds-button-tonal-1);
  /* Figma strokes sit inside the box, so the padding absorbs the border and
     the icon stays on the same 8px line as every other item. */
  border: 1px solid var(--strokes-card-selected);
  padding: 7px;
  color: var(--text-coloured-blue);
}
.cq-rail-btn.is-active .cq-rail__label { color: var(--text-coloured-blue); font-weight: 500; }

.cq-rail-ghead {
  width: 100%; height: 24px; flex: none;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.cq-rail-ghead .cq-rail__label { font-weight: 500; }
.cq-rail-chev {
  flex: none; color: var(--text-teritiary);
  transition: transform .22s cubic-bezier(.4, 0, .2, 1);
}
.cq-rail-ghead[aria-expanded="true"] .cq-rail-chev { transform: rotate(180deg); }
.cq-rail:not(.is-open) .cq-rail-chev { display: none; }
.cq-rail-ghead[aria-expanded="false"] + .cq-rail__stack { display: none; }

/* ── An offering sold separately ─────────────────────────────────────
   It sits at category level, never inside another category: a top-level
   row is the only one the one-open-category rule can never hide, and a
   separate offering has to stay on screen to be one.

   Off-plan it stays in the panel and carries a flag — an offering nobody
   can see is an offering nobody buys. The tile keeps its full colour:
   greying it out reads "not for you", which is the opposite of the job.
   The dot does the work, and it has to, because the panel is crunched by
   default, where a label-row pill is never seen. */
.cq-rail-tile-wrap { position: relative; flex: none; display: flex; }
.cq-rail-dot {
  display: none;
  position: absolute; top: -2px; right: -2px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--text-coloured-blue);
  box-shadow: 0 0 0 2px var(--backgrounds-page-bg-1);
}
.cq-rail-flag {
  display: none;
  position: relative; overflow: hidden;
  flex: none; height: 18px; padding: 0 7px; border-radius: 9px;
  align-items: center;
  background: var(--backgrounds-badge-blue);
  border: 1px solid var(--strokes-colour-blue);
  color: var(--text-coloured-blue);
  font: 500 11px/1 var(--font-geist); letter-spacing: -0.11px;
}
/* A glint crossing the pill every few seconds, with a long hold between
   passes. Constant motion in a nav panel nags; one periodic pass reads as
   emphasis and then gets out of the way. The tint is per-theme because a
   white glint is invisible on the near-white light badge. */
.cq-rail-flag::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(100deg, transparent 32%, var(--flag-sheen) 50%, transparent 68%);
  transform: translateX(-100%);
  animation: cq-flag-sheen 3.4s ease-in-out infinite;
  pointer-events: none;
}
@keyframes cq-flag-sheen {
  0%, 58% { transform: translateX(-100%); }
  100%    { transform: translateX(200%); }
}

.cq-rail-group.is-locked .cq-rail-dot  { display: block; }
.cq-rail-group.is-locked .cq-rail-flag { display: inline-flex; }
.cq-rail:not(.is-open) .cq-rail-flag { display: none; }
/* One category open at a time — opening an item or a header collapses the
   rest, so the panel only shows the section being worked in. Crunched that
   matters more, not less: the icons carry no grouping of their own, so a
   short list is the only thing that stays readable. Drive it from whichever
   item is active, so a page opens on the section it belongs to. */
/* Gradient product tiles. Ramps are theme-independent by design. */
.cq-rail-tile {
  width: 24px; height: 24px; border-radius: var(--radius-sm); overflow: hidden;
  display: flex; align-items: center; justify-content: center; color: #fff;
}
.cq-grad-blue   { background-image: linear-gradient(225.24deg, var(--blue-600) 8.84%, var(--blue-500) 54.42%, var(--blue-300) 100%); }
.cq-grad-purple { background-image: linear-gradient(225.24deg, var(--purple-600) 8.84%, var(--purple-500) 54.42%, var(--purple-300) 100%); }
.cq-grad-indigo { background-image: linear-gradient(225.24deg, var(--indigo-600) 8.84%, var(--indigo-500) 54.42%, var(--indigo-300) 100%); }
.cq-grad-orange { background-image: linear-gradient(225.24deg, var(--orange-800) 8.84%, var(--orange-600) 54.42%, var(--orange-300) 100%); }
.cq-grad-green  { background-image: linear-gradient(225.24deg, var(--green-600) 8.84%, var(--green-500) 54.42%, var(--green-300) 100%); }

  <!-- ── Content — rebuilt on the design system ────────────────────── -->
  <main class="as-content">
    <div class="as-head-row">
      <h1 class="cq-subhead1-med" id="sectionTitle">Assistants created by you</h1>
      <span class="cq-count" id="cardCount">9</span>

    <div class="as-filter-row">
      <div class="cq-seg" role="tablist" aria-label="Filter assistants">
        <button class="is-active" data-tab="all" role="tab" aria-selected="true">All</button>
        <button data-tab="bookmarked" role="tab" aria-selected="false">Bookmarked</button>
        <button data-tab="recent" role="tab" aria-selected="false">Recently used</button>
      </div>
      <div class="as-filter-row__right">
        <div class="cq-filter-group">
          <button class="cq-dropdown" id="tagsBtn" aria-haspopup="true" aria-expanded="false">
            <svg class="cq-ic" width="20" height="20" aria-hidden="true"><use href="#i-tags"/></svg>
            Tags<span class="cq-dropdown__badge" id="tagsBadge">0</span>
            <svg class="cq-ic" width="20" height="20" aria-hidden="true"><use href="#i-chev"/></svg>
          </button>
          <div class="cq-pop" id="tagsPop" style="left:auto;right:0">
            <div class="cq-pop__head">
              <label class="cq-search cq-search--sm" style="flex:1">
                <svg class="cq-ic" width="20" height="20" aria-hidden="true"><use href="#i-search"/></svg>
                <input id="tagSearch" placeholder="Search" aria-label="Search tags" />
              </label>
            </div>
            <div class="cq-pop__list" id="tagList"></div>
            <div class="cq-pop__empty cq-body2-reg" id="tagEmpty" hidden>No tags match</div>
            <div style="padding:8px 8px 0">
              <button class="cq-btn cq-btn--tonal cq-btn--sm" style="width:100%">
                <svg class="cq-ic" width="16" height="16" aria-hidden="true"><use href="#i-edit"/></svg>Manage tags
              </button>
            </div>
          </div>
        </div>
        <button class="cq-btn cq-btn--primary">
          <svg class="cq-ic" width="20" height="20" aria-hidden="true"><use href="#i-plus"/></svg>New assistant
        </button>
      </div>
    </div>

    <div class="cq-card-grid cq-card-grid--3up" id="cardGrid"></div>

    <div class="as-empty" id="emptyState">
      <b class="cq-body1-med">No assistants match</b>
      <span class="cq-body2-reg">Clear the search or the tag filter to see the full list.</span>
    </div>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Tag → tone. The five design-system tones; Figma's purple maps to indigo. */
const TAG_TONES = {
  'Machine learning': 'blue',
  'Data science':     'blue',
  'Web scraping':     'indigo',
  'Development':      'indigo',
  'Marketing':        'cyan',
  'Finance':          'green',
  'HR':               'light-green',
};

/* scope: you | shared · glyph drives the tile tint · days feeds "Recently used" */
const ASSISTANTS = [
  { name: 'Lead Generation Tool', desc: 'Automates the collection of potential client information', glyph: 'cyan',   tags: ['Machine learning', 'Web scraping'], extra: 4, status: 'active', date: '15 Mar', days: 2,  scope: 'you',    marked: false },
  { name: 'Contract Summariser',  desc: 'Condenses vendor contracts into one-page briefs',          glyph: 'purple', tags: ['Finance', 'Data science'],          extra: 0, status: 'active', date: '12 Mar', days: 5,  scope: 'you',    marked: true  },
  { name: 'Campaign Copywriter',  desc: 'Drafts on-brand copy for email and social campaigns',      glyph: 'green',  tags: ['Marketing'],                        extra: 2, status: 'draft',  date: '8 Mar',  days: 9,  scope: 'you',    marked: false },
  { name: 'Support Triage',       desc: 'Routes incoming tickets to the right team with a summary', glyph: 'purple', tags: ['Machine learning', 'Development'],  extra: 0, status: 'active', date: '4 Mar',  days: 13, scope: 'you',    marked: false },
  { name: 'Onboarding Buddy',     desc: 'Answers new-hire questions from the people handbook',      glyph: 'green',  tags: ['HR'],                               extra: 1, status: 'active', date: '28 Feb', days: 17, scope: 'you',    marked: true  },
  { name: 'Sales Forecaster',     desc: 'Projects quarterly pipeline from CRM activity',            glyph: 'cyan',   tags: ['Finance', 'Machine learning'],      extra: 0, status: 'active', date: '25 Feb', days: 20, scope: 'you',    marked: false },
  { name: 'Invoice Auditor',      desc: 'Flags anomalies in supplier invoices before payment',      glyph: 'purple', tags: ['Finance', 'Data science'],          extra: 0, status: 'draft',  date: '21 Feb', days: 24, scope: 'you',    marked: false },
  { name: 'Meeting Notetaker',    desc: 'Turns call recordings into action items and owners',       glyph: 'green',  tags: ['Machine learning'],                 extra: 2, status: 'active', date: '18 Feb', days: 27, scope: 'you',    marked: false },
  { name: 'Release Notes Writer', desc: 'Compiles shipped work into customer-ready release notes',  glyph: 'cyan',   tags: ['Development', 'Marketing'],         extra: 0, status: 'active', date: '15 Feb', days: 30, scope: 'you',    marked: false },
  { name: 'Policy Answerer',      desc: 'Answers compliance questions with citations to policy',    glyph: 'purple', tags: ['HR', 'Finance'],                    extra: 0, status: 'active', date: '11 Feb', days: 34, scope: 'shared', marked: true  },
  { name: 'Churn Predictor',      desc: 'Scores accounts by churn risk from usage signals',         glyph: 'cyan',   tags: ['Data science', 'Marketing'],        extra: 1, status: 'draft',  date: '9 Feb',  days: 36, scope: 'shared', marked: false },
  { name: 'Query Explainer',      desc: 'Explains slow database queries and suggests indexes',      glyph: 'green',  tags: ['Development'],                      extra: 0, status: 'active', date: '2 Feb',  days: 43, scope: 'shared', marked: false },
];

const GLYPH_TILE = { cyan: 'as-tile--cyan', purple: 'as-tile--purple', green: 'as-tile--light-green' };

function cardHTML(a, i) {
  const tags = a.tags.map(t =>
    `<span class="cq-tag" data-tone="${TAG_TONES[t]}">${esc(t)}</span>`).join('');
  const extra = a.extra ? `<span class="cq-tag">+${a.extra}</span>` : '';
  return `
  <button class="cq-card cq-tint" data-i="${i}">
    <span class="cq-card__head">
      <span class="cq-card__title-row">
        <span class="cq-logo-tile ${GLYPH_TILE[a.glyph]}"><svg width="16" height="16" aria-hidden="true"><use href="#i-glyph-${a.glyph}"/></svg></span>
        <span class="cq-card__title cq-body1-med cq-truncate">${esc(a.name)}</span>
        <span class="as-dot as-dot--${a.status}" title="${a.status === 'active' ? 'Active' : 'Draft'}"></span>
      </span>
      <span class="cq-card__desc">${esc(a.desc)}</span>
    </span>
    <span class="cq-card__foot">
      <span class="cq-card__tags">${tags}${extra}</span>
      <span class="as-card-meta">
        <span class="as-date cq-caption-reg">${esc(a.date)}</span>
        <span class="cq-icon-btn cq-icon-btn--sm as-mark${a.marked ? ' is-marked' : ''}" data-mark="${i}" role="button" tabindex="0"
              aria-pressed="${a.marked}" aria-label="Bookmark ${esc(a.name)}">
          <svg class="cq-ic" width="16" height="16"><use href="#i-mark"/></svg>
        </span>
      </span>
    </span>
  </button>`;
}
$('cardGrid').innerHTML = ASSISTANTS.map(cardHTML).join('');

/* ── Filter state ─────────────────────────────────────────────────── */
const state = { scope: 'you', tab: 'all', tags: new Set(), q: '' };

function applyFilters() {
  let shown = 0;
  document.querySelectorAll('#cardGrid .cq-card').forEach(el => {
    const a = ASSISTANTS[+el.dataset.i];
    const marked = el.querySelector('.as-mark').classList.contains('is-marked');
    let ok = a.scope === state.scope;
    if (ok && state.tab === 'bookmarked') ok = marked;
    if (ok && state.tab === 'recent') ok = a.days <= 14;
    if (ok && state.tags.size) ok = a.tags.some(t => state.tags.has(t));
    if (ok && state.q) ok = (a.name + ' ' + a.desc + ' ' + a.tags.join(' ')).toLowerCase().includes(state.q);
    el.style.display = ok ? '' : 'none';
    if (ok) shown++;
  });
  $('cardCount').textContent = shown;
  $('emptyState').classList.toggle('is-on', shown === 0);
  $('sectionTitle').textContent = state.scope === 'you' ? 'Assistants created by you' : 'Assistants shared with you';
}

/* Scope toggle (hero) */
document.querySelectorAll('.as-scope-tab').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.as-scope-tab').forEach(b => {
    const on = b === btn;
    b.classList.toggle('is-active', on);
    b.setAttribute('aria-selected', on);
  });
  state.scope = btn.dataset.scope;
  applyFilters();
}));

/* Segmented tabs */
document.querySelectorAll('.cq-seg [data-tab]').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.cq-seg [data-tab]').forEach(b => {
    const on = b === btn;
    b.classList.toggle('is-active', on);
    b.setAttribute('aria-selected', on);
  });
  state.tab = btn.dataset.tab;
  applyFilters();
}));

/* Hero search */
$('heroSearch').addEventListener('input', e => {
  state.q = e.target.value.trim().toLowerCase();
  applyFilters();
});

/* Bookmarks */
document.addEventListener('click', e => {
  const m = e.target.closest('.as-mark');
  if (!m) return;
  e.stopPropagation();
  m.classList.toggle('is-marked');
  m.setAttribute('aria-pressed', m.classList.contains('is-marked'));
  applyFilters();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const m = e.target.closest && e.target.closest('.as-mark');
  if (!m) return;
  e.preventDefault();
  m.click();
});

/* ── Tags dropdown ────────────────────────────────────────────────── */
const ALL_TAGS = Object.keys(TAG_TONES);

function tagRow(t) {
  const on = state.tags.has(t);
  return `
  <button class="cq-option${on ? ' is-checked' : ''}" data-tag="${esc(t)}">
    <span class="cq-checkbox${on ? ' is-checked' : ''}"><svg viewBox="0 0 12 12"><use href="#i-tick"/></svg></span>
    <span class="cq-option__label">${esc(t)}</span>
  </button>`;
}
function renderTagList(filter) {
  const q = (filter || '').toLowerCase();
  const rows = ALL_TAGS.filter(t => t.toLowerCase().includes(q));
  $('tagList').innerHTML = rows.map(tagRow).join('');
  $('tagEmpty').hidden = rows.length > 0;
}
renderTagList('');

function syncTagBadge() {
  $('tagsBadge').textContent = state.tags.size;
  $('tagsBtn').classList.toggle('has-count', state.tags.size > 0);
}

$('tagsBtn').addEventListener('click', e => {
  e.stopPropagation();
  const open = $('tagsPop').classList.toggle('is-open');
  $('tagsBtn').classList.toggle('is-open', open);
  $('tagsBtn').setAttribute('aria-expanded', open);
  if (open) $('tagSearch').focus();
});
$('tagsPop').addEventListener('click', e => {
  e.stopPropagation();
  const opt = e.target.closest('.cq-option');
  if (!opt) return;
  const t = opt.dataset.tag;
  state.tags.has(t) ? state.tags.delete(t) : state.tags.add(t);
  renderTagList($('tagSearch').value);
  syncTagBadge();
  applyFilters();
});
$('tagSearch').addEventListener('input', e => renderTagList(e.target.value));
document.addEventListener('click', () => {
  $('tagsPop').classList.remove('is-open');
  $('tagsBtn').classList.remove('is-open');
  $('tagsBtn').setAttribute('aria-expanded', 'false');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    $('tagsPop').classList.remove('is-open');
    $('tagsBtn').classList.remove('is-open');
    $('tagsBtn').setAttribute('aria-expanded', 'false');
  }
});

/* ── Theme — dark is the product default, per the design system ───── */
const root = document.documentElement;
function applyMode(mode) {
  root.dataset.mode = mode;
  const dark = mode === 'dark';
  $('themeIcon').setAttribute('href', dark ? '#i-sun' : '#i-moon');
  const label = dark ? 'Switch to light theme' : 'Switch to dark theme';
  $('themeToggle').setAttribute('aria-label', label);
  $('themeToggle').setAttribute('title', label);
}
$('themeToggle').addEventListener('click', () => {
  const next = root.dataset.mode === 'dark' ? 'light' : 'dark';
  applyMode(next);
  try { localStorage.setItem('cq-theme', next); } catch (e) { /* private mode */ }
});
let stored = null;
try { stored = localStorage.getItem('cq-theme'); } catch (e) { /* private mode */ }
applyMode(stored === 'light' ? 'light' : 'dark');

applyFilters();
</script>
