<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow Pattern Studio</title>
<style>
  :root{
    --panel-bg: rgba(16,18,28,.92);
    --panel-border: rgba(255,255,255,.08);
    --txt: #e8eaf2;
    --txt-dim: #8b90a3;
    --accent: #6c7bff;
    --input-bg: rgba(255,255,255,.06);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#0a0d1c;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  #stage{ position:fixed; inset:0; display:block; }

  /* ---------- control panel ---------- */
  #panel{
    position:fixed; top:0; right:0; height:100%; width:320px;
    background:var(--panel-bg); backdrop-filter: blur(14px);
    border-left:1px solid var(--panel-border);
    color:var(--txt); font-size:12px;
    overflow-y:auto; overscroll-behavior:contain;
    transition:transform .35s cubic-bezier(.4,0,.2,1);
    z-index:10; padding-bottom:32px;
  }
  #panel.hidden{ transform:translateX(100%); }
  #panel::-webkit-scrollbar{ width:8px; }
  #panel::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.12); border-radius:4px; }

  #panelHead{
    position:sticky; top:0; z-index:2;
    background:var(--panel-bg); backdrop-filter: blur(14px);
    padding:16px 18px 12px; border-bottom:1px solid var(--panel-border);
  }
  #panelHead h1{ font-size:13px; font-weight:600; letter-spacing:.4px; }
  #panelHead p{ color:var(--txt-dim); font-size:11px; margin-top:2px; }

  #toggleBtn{
    position:fixed; top:14px; right:14px; z-index:11;
    width:34px; height:34px; border-radius:9px; cursor:pointer;
    background:rgba(16,18,28,.85); color:#cfd3e4;
    border:1px solid var(--panel-border);
    display:flex; align-items:center; justify-content:center;
    font-size:15px; backdrop-filter: blur(10px);
    transition:right .35s cubic-bezier(.4,0,.2,1);
  }
  #toggleBtn.open{ right:334px; }
  #toggleBtn:hover{ color:#fff; border-color:rgba(255,255,255,.25); }

  .section{ border-bottom:1px solid var(--panel-border); }
  .secHead{
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 18px; cursor:pointer; user-select:none;
  }
  .secHead:hover{ background:rgba(255,255,255,.03); }
  .secHead h2{ font-size:11px; font-weight:600; letter-spacing:1.1px; text-transform:uppercase; color:#b9bdd0; }
  .secHead .chev{ color:var(--txt-dim); font-size:10px; transition:transform .2s; }
  .section.closed .chev{ transform:rotate(-90deg); }
  .secBody{ padding:4px 18px 14px; }
  .section.closed .secBody{ display:none; }

  .row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:9px 0; }
  .row label{ flex:0 0 96px; color:var(--txt-dim); font-size:11.5px; line-height:1.25; }
  .row .val{ flex:0 0 42px; text-align:right; color:var(--txt); font-variant-numeric:tabular-nums; font-size:10.5px; }

  input[type=range]{ flex:1; -webkit-appearance:none; appearance:none; height:3px; border-radius:2px;
    background:rgba(255,255,255,.14); outline:none; cursor:pointer; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; width:12px; height:12px;
    border-radius:50%; background:#fff; border:none;
    box-shadow:0 1px 4px rgba(0,0,0,.5); }
  input[type=range]::-moz-range-thumb{ width:12px; height:12px; border-radius:50%; background:#fff; border:none; }

  select{
    flex:1; background:var(--input-bg); color:var(--txt); border:1px solid var(--panel-border);
    border-radius:6px; padding:5px 8px; font-size:11.5px; outline:none; cursor:pointer;
  }
  select option{ background:#171a28; }

  input[type=checkbox]{ width:15px; height:15px; accent-color:var(--accent); cursor:pointer; }

  input[type=color]{
    -webkit-appearance:none; appearance:none; width:30px; height:24px; border:none; border-radius:6px;
    background:none; cursor:pointer; padding:0;
  }
  input[type=color]::-webkit-color-swatch-wrapper{ padding:0; }
  input[type=color]::-webkit-color-swatch{ border:1px solid rgba(255,255,255,.2); border-radius:6px; }
  input[type=color]::-moz-color-swatch{ border:1px solid rgba(255,255,255,.2); border-radius:6px; }

  /* palette editor */
  #paletteList{ display:flex; flex-wrap:wrap; gap:7px; margin:8px 0 4px; }
  .swatch{ position:relative; }
  .swatch input[type=color]{ width:34px; height:28px; }
  .swatch .rm{
    position:absolute; top:-6px; right:-6px; width:14px; height:14px; border-radius:50%;
    background:#2a2e40; color:#aab; font-size:9px; line-height:13px; text-align:center;
    cursor:pointer; border:1px solid rgba(255,255,255,.15); display:none;
  }
  .swatch:hover .rm{ display:block; }
  #addColor{
    width:34px; height:28px; border-radius:6px; border:1px dashed rgba(255,255,255,.3);
    background:none; color:var(--txt-dim); font-size:15px; cursor:pointer;
  }
  #addColor:hover{ color:#fff; border-color:rgba(255,255,255,.5); }

  /* gradient preset chips */
  .gradList{ display:grid; grid-template-columns:repeat(2,1fr); gap:6px; margin:6px 0 2px; }
  .gradChip{
    position:relative; height:36px; border-radius:7px; cursor:pointer; padding:0; overflow:hidden;
    border:1px solid var(--panel-border);
  }
  .gradChip span{
    position:absolute; left:6px; bottom:4px; font-size:9.5px; color:#fff; letter-spacing:.2px;
    text-shadow:0 1px 3px rgba(0,0,0,.9), 0 0 8px rgba(0,0,0,.6);
  }
  .gradChip.active{ border-color:#fff; box-shadow:0 0 0 1px #fff inset; }

  .btnRow{ display:flex; flex-wrap:wrap; gap:7px; margin:9px 0 2px; }
  .btn{
    background:var(--input-bg); border:1px solid var(--panel-border); color:var(--txt);
    border-radius:7px; padding:6px 11px; font-size:11px; cursor:pointer; flex:1 1 auto; text-align:center;
    transition:background .15s;
  }
  .btn:hover{ background:rgba(255,255,255,.12); }
  .btn.primary{ background:var(--accent); border-color:transparent; color:#fff; }
  .btn.primary:hover{ background:#8090ff; }
  .btn.rec{ background:#e0344a; border-color:transparent; color:#fff; }
  .btn.rec:hover{ background:#f04a60; }
  .btn[disabled]{ opacity:.5; cursor:default; }

  .presetBtn{
    display:flex; align-items:center; gap:9px; width:100%; text-align:left;
    background:var(--input-bg); border:1px solid var(--panel-border); color:var(--txt);
    border-radius:8px; padding:7px 10px; font-size:11.5px; cursor:pointer; margin:5px 0;
  }
  .presetBtn:hover{ background:rgba(255,255,255,.1); }
  .presetBtn.active{ border-color:var(--accent); }
  .presetBtn .ico{ flex-shrink:0; opacity:.85; }

  #recBar{ height:3px; border-radius:2px; background:rgba(255,255,255,.12); overflow:hidden; margin-top:8px; display:none; }
  #recBar.on{ display:block; }
  #recFill{ height:100%; width:0%; background:var(--accent); transition:width .12s linear; }
  .hint{ color:var(--txt-dim); font-size:10.5px; line-height:1.45; margin-top:7px; }

  #toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(70px);
    background:rgba(20,22,34,.95); color:#e8eaf2; font-size:12px; padding:9px 18px;
    border-radius:8px; border:1px solid var(--panel-border); z-index:20;
    transition:transform .3s; pointer-events:none;
  }
  #toast.show{ transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<button id="toggleBtn" class="open" title="Toggle controls">&#9881;</button>
<div id="panel"></div>

<script>

   ===================================================================== */

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');

/* ---------------- state ---------------- */

  /* ribbons */

let S = JSON.parse(JSON.stringify(DEFAULTS));

/* ---------------- gradient presets (colors only — work with every type) --- */
const GRADIENTS = [

  {name:'Ultra Violet', bg:'#0a0014', palette:['#2d00f7','#8900f2','#bc00dd','#f20089','#6a00f4']},
  {name:'Neon Miami',   bg:'#06021a', palette:['#00f5d4','#00bbf9','#9b5de5','#f15bb5','#fee440']},

/* ---------------- shape presets, grouped per pattern type ---------------- */
const SHAPES = {
  ribbons: {

                    frequency2:1.7, stagger:0.22, waveTaper:0.6, centerY:0, spreadL:1.55, spreadR:0.07,
                    pinch:0, pinchPos:0.5, pinchWidth:0.18, angle:0, speed:0.8},
    'Rolling wave':{bands:4, spacing:0.075, gap:0, amplitude:0.22, frequency:0.65, amplitude2:0.05,
                    frequency2:1.4, stagger:0.45, waveTaper:0.25, centerY:0.08, spreadL:1.0, spreadR:1.15,
                    pinch:0.25, pinchPos:0.35, pinchWidth:0.3, angle:0, speed:0.7},
    'Corner fan':  {bands:9, spacing:0.09, gap:0.06, amplitude:0.12, frequency:0.45, amplitude2:0.03,
                    frequency2:1.2, stagger:0.35, waveTaper:0.85, centerY:0, spreadL:0.02, spreadR:1.9,
                    pinch:0, angle:-18, speed:0.9},
    'Waist pinch': {bands:10, spacing:0.05, gap:0.05, amplitude:0.07, frequency:1.1, amplitude2:0.03,
                    frequency2:2.3, stagger:0.3, waveTaper:0.4, centerY:0, spreadL:1.25, spreadR:1.25,
                    pinch:0.88, pinchPos:0.5, pinchWidth:0.16, angle:0, speed:1.0},
    'Cascade':     {bands:8, spacing:0.06, gap:0.03, amplitude:0.09, frequency:0.9, amplitude2:0.04,
                    frequency2:1.8, stagger:0.28, waveTaper:0.5, centerY:0, spreadL:1.4, spreadR:0.12,
                    pinch:0, angle:90, speed:0.85},
  },
  bars: {
    'Even bars':   {barCount:7, barGap:0.055, barAlternate:true, barSlide:0.4, barSoft:0.55, angle:0, speed:0.6},
    'Wide slabs':  {barCount:4, barGap:0.02, barAlternate:true, barSlide:0.6, barSoft:0.7, angle:0, speed:0.5},
    'Thin stripes':{barCount:18, barGap:0.12, barAlternate:true, barSlide:0.3, barSoft:0.4, angle:0, speed:0.8},
    'Horizon':     {barCount:9, barGap:0.04, barAlternate:false, barSlide:0.45, barSoft:0.6, angle:90, speed:0.6},
  },
  steps: {
    'Staircase':   {stepRows:9, stepProfile:'stair', stepStagger:0.4, stepSoft:0.12, stepOverlap:1.4,
                    stepJitter:0.1, angle:0, speed:1.0},
    'Bulge sweep': {stepRows:14, stepProfile:'bulge', stepStagger:0.5, stepSoft:0.18, stepOverlap:1.7,
                    stepJitter:0.05, angle:0, speed:0.9},
    'Scatter':     {stepRows:16, stepProfile:'random', stepStagger:0.25, stepSoft:0.06, stepOverlap:1.5,
                    stepJitter:0.5, angle:0, speed:1.1},
    'Rain':        {stepRows:12, stepProfile:'valley', stepStagger:0.45, stepSoft:0.1, stepOverlap:1.6,
                    stepJitter:0.2, angle:90, speed:1.0},
  },
  fan: {
    'Card fan':    {fanCount:15, fanSpread:150, fanPivot:0.62, fanLength:0.78, fanWidth:0.13, fanGap:0.05,
                    fanRound:0.04, fanSweep:0.18, fanSpin:0, fanScatter:0, angle:0, speed:0.8},
    'Wide arc':    {fanCount:7, fanSpread:110, fanPivot:0.9, fanLength:1.0, fanWidth:0.26, fanGap:0.03,
                    fanRound:0.02, fanSweep:0.12, fanSpin:0, fanScatter:0, angle:0, speed:0.7},
    'Tight deck':  {fanCount:24, fanSpread:60, fanPivot:0.45, fanLength:0.62, fanWidth:0.07, fanGap:0.08,
                    fanRound:0.3, fanSweep:0.35, fanSpin:0, fanScatter:0.15, angle:0, speed:1.0},
    'Pinwheel':    {fanCount:12, fanSpread:360, fanPivot:0, fanLength:0.55, fanWidth:0.12, fanGap:0.04,
                    fanRound:0.1, fanSweep:0, fanSpin:14, fanScatter:0, angle:0, speed:0.8},
  },
  blades: {
    'Corner rays': {bladeCount:9, bladeArc:110, bladeSpin:0.3, bladeGap:0.42, bladeTaper:0.3,
                    bladeInner:0.02, bladeFocusX:0.55, bladeFocusY:-0.55, bladeLength:1, angle:0, speed:0.8},
    'Full star':   {bladeCount:14, bladeArc:360, bladeSpin:0.5, bladeGap:0.35, bladeTaper:1,
                    bladeInner:0.03, bladeFocusX:0, bladeFocusY:0, bladeLength:1, angle:0, speed:0.7},
    'Beam spread': {bladeCount:5, bladeArc:150, bladeSpin:0.2, bladeGap:0.25, bladeTaper:0,
                    bladeInner:0, bladeFocusX:-0.6, bladeFocusY:0.6, bladeLength:1, angle:0, speed:0.6},
    'Sunburst':    {bladeCount:26, bladeArc:360, bladeSpin:0.8, bladeGap:0.5, bladeTaper:1,
                    bladeInner:0.12, bladeFocusX:0, bladeFocusY:0, bladeLength:0.8, angle:0, speed:0.9},
  },
  grid: {
    'Checkerboard':{gridCols:6, gridRows:4, gridGap:0, gridWaveX:1, gridWaveY:0.7, gridSharp:0.25,
                    gridFlow:1, gridMirror:true, gridRound:0, angle:0, speed:0.8},
    'Fine mosaic': {gridCols:14, gridRows:9, gridGap:0.12, gridWaveX:0.8, gridWaveY:0.5, gridSharp:0.5,

                    gridFlow:0.7, gridMirror:false, gridRound:0.25, angle:0, speed:0.7},
    'Column blocks':{gridCols:5, gridRows:2, gridGap:0.03, gridWaveX:1.6, gridWaveY:0.2, gridSharp:0.2,
                    gridFlow:1.1, gridMirror:true, gridRound:0, angle:0, speed:0.9},
  },
  rings: {
    'Concentric':  {ringCount:8, ringSweep:1, ringSpin:0.4, ringStagger:0, ringGap:0.14, ringInner:0.05,
                    angle:0, speed:0.7},
    'Broken rings':{ringCount:7, ringSweep:0.7, ringSpin:0.9, ringStagger:0.7, ringGap:0.22, ringInner:0.1,
                    angle:0, speed:0.9},
    'Halo arcs':   {ringCount:4, ringSweep:0.45, ringSpin:0.55, ringStagger:1.2, ringGap:0.3, ringInner:0.2,
                    angle:0, speed:0.8},
    'Vortex':      {ringCount:16, ringSweep:0.85, ringSpin:1.4, ringStagger:0.35, ringGap:0.08,
                    ringInner:0.02, angle:0, speed:1.1},

const TYPE_LABEL = {
  ribbons:'Flowing ribbons', bars:'Gradient bars', steps:'Stepped wipe',
  fan:'Card fan', blades:'Radial blades', grid:'Tile grid', rings:'Concentric rings',
};

/* ---------------- helpers ---------------- */
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
const lerp  = (a,b,t)=>a+(b-a)*t;
const smooth = t=>{ t=clamp(t,0,1); return t*t*(3-2*t); };
const frac = v=>((v%1)+1)%1;
const TAU = Math.PI*2;
const hash01 = n=>{ const s=Math.sin(n*127.1+311.7)*43758.5453; return s-Math.floor(s); };

function hexToRgb(h){
  h=String(h).replace('#','');
  if(h.length===3) h=h.split('').map(c=>c+c).join('');
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
}
const rgbStr=(r,g,b)=>'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';

let palRgb=[];
function cachePalette(){ palRgb = S.palette.map(hexToRgb); }

/* palette sampled as a smooth cyclic gradient, u in [0,1) */
function colorArrAt(u){
  const n=palRgb.length;
  if(n===0) return [255,255,255];
  if(n===1) return palRgb[0];
  u=frac(u)*n;
  const i=Math.floor(u), f=smooth(u-i);
  const a=palRgb[i%n], b=palRgb[(i+1)%n];
  return [lerp(a[0],b[0],f), lerp(a[1],b[1],f), lerp(a[2],b[2],f)];
}
const colorAt=u=>rgbStr.apply(null,colorArrAt(u));
/* flat palette entry i (used by "solid per band" fill mode) */
const stepColor=i=>{
  const n=palRgb.length||1;
  return rgbStr.apply(null, palRgb[((i%n)+n)%n] || [255,255,255]);
};

function rrect(c,x,y,w,h,r){
  r=Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  c.beginPath();
  if(r<=0.5){ c.rect(x,y,w,h); return; }
  if(c.roundRect){ c.roundRect(x,y,w,h,r); return; }
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);     c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

/* a gradient running along a segment, sampled from the palette */
function segGradient(c,x0,y0,x1,y1,off,t,stops){
  const g=c.createLinearGradient(x0,y0,x1,y1);
  const N=stops||16;
  for(let s=0;s<=N;s++){
    const u=s/N;
    g.addColorStop(u, colorAt(u*S.gradientScale + off + t*S.colorDrift));
  }
  return g;
}

/* ---------------- canvas sizing ---------------- */
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=W*DPR; canvas.height=H*DPR;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  forceDraw=true;
}
window.addEventListener('resize',resize);

/* ---------------- grain overlay ---------------- */
const grainCv=document.createElement('canvas');
grainCv.width=grainCv.height=160;
{
  const gctx=grainCv.getContext('2d');
  const img=gctx.createImageData(160,160);
  for(let i=0;i<img.data.length;i+=4){
    const v=Math.random()*255;
    img.data[i]=img.data[i+1]=img.data[i+2]=v;
    img.data[i+3]=28;
  }
  gctx.putImageData(img,0,0);
}
const grainPatterns=new WeakMap();
function grainFor(c){
  let p=grainPatterns.get(c);
  if(!p){ p=c.createPattern(grainCv,'repeat'); grainPatterns.set(c,p); }
  return p;
}

/* =====================================================================
   PATTERN RENDERERS
   Each draws in a frame centred on the origin, spanning L along x and
   Wd along y; the caller has already applied rotation, zoom and flips.
   ===================================================================== */

/* ---- flowing ribbons ---- */
function envelope(u){
  let e=lerp(S.spreadL,S.spreadR,smooth(u));
  if(S.pinch>0){
    const d=(u-S.pinchPos)/Math.max(S.pinchWidth,0.02);
    e*=1-S.pinch*Math.exp(-d*d*0.5);
  }
  return Math.max(e,0.004);
}
function edgeY(j,u,t,minD,nEdges){
  const env=envelope(u);
  const ampEnv=lerp(1,env,S.waveTaper);
  const w1=S.amplitude *minD*Math.sin(TAU*(S.frequency *u)-t*S.speed     +j*S.stagger);
  const w2=S.amplitude2*minD*Math.sin(TAU*(S.frequency2*u)+t*S.speed*0.63+j*S.stagger*1.7+2.1);
  return S.centerY*minD + (w1+w2)*ampEnv + (j-nEdges/2)*S.spacing*minD*env;
}
function drawRibbons(c,t,L,Wd,minD){
  const N=Math.max(1,Math.round(S.bands));
  const SEG=110;
  const edges=[];
  for(let j=0;j<=N;j++){
    const pts=new Float32Array(SEG+1);
    for(let k=0;k<=SEG;k++) pts[k]=edgeY(j,k/SEG,t,minD,N);
    edges.push(pts);
  }
  const xAt=k=>-L/2+(k/SEG)*L;
  for(let i=0;i<N;i++){
    const top=edges[i], bot=edges[i+1], g=S.gap*0.5;
    c.beginPath();
    for(let k=0;k<=SEG;k++){
      const y=lerp(top[k],bot[k],g);
      k===0?c.moveTo(xAt(k),y):c.lineTo(xAt(k),y);
    }
    for(let k=SEG;k>=0;k--) c.lineTo(xAt(k), lerp(bot[k],top[k],g));
    c.closePath();
    c.fillStyle = S.colorMode==='solid'
      ? stepColor(i)
      : segGradient(c,-L/2,0,L/2,0,i*S.bandShift,t,22);
    c.fill();
  }
}

/* ---- gradient bars ---- */
function drawBars(c,t,L,Wd){
  const M=Math.max(2,Math.round(S.barCount));
  const slot=L/M, gapPx=slot*S.barGap;
  for(let k=0;k<M;k++){
    const x0=-L/2+k*slot+gapPx/2, w=slot-gapPx;
    const flip=S.barAlternate&&(k%2===1)?-1:1;
    const base=k*S.bandShift + t*S.colorDrift;
    const slide=S.barSlide*Math.sin(t*S.speed*0.9 + k*1.7);
    if(S.colorMode==='solid'){
      c.fillStyle=stepColor(k);
    }else{
      const g=c.createLinearGradient(0,-Wd/2*flip,0,Wd/2*flip);
      g.addColorStop(0,colorAt(base));
      g.addColorStop(clamp(0.5+slide*S.barSoft,0.08,0.92),colorAt(base+0.18+slide*0.25));
      g.addColorStop(1,colorAt(base+0.42+slide*0.4));
      c.fillStyle=g;
    }
    c.fillRect(x0,-Wd/2,w,Wd);
  }
}

/* ---- stepped wipe ---- */
function drawSteps(c,t,L,Wd){
  const R=Math.max(2,Math.round(S.stepRows));
  const rowH=Wd/R;
  const dur=Math.max(S.stepOverlap,1.01);
  const tau=t*S.speed*0.22;
  const softL=Math.max(S.stepSoft*L,1);
  const maxOff=S.stepStagger*L + S.stepJitter*L*0.4;
  const travel=L + maxOff + 2*softL;
  const prof=r=>{
    const u=R>1? r/(R-1):0;
    let o;
    switch(S.stepProfile){
      case 'bulge':  o=1-Math.sin(Math.PI*u); break;
      case 'valley': o=Math.sin(Math.PI*u); break;
      case 'random': o=hash01(r); break;
      default:       o=u;
    }
    return o*S.stepStagger*L + hash01(r+57)*S.stepJitter*L*0.4;
  };
  const layerCols=n=>{
    if(S.colorMode==='solid'){
      const len=palRgb.length||1;
      const base=palRgb[(((n%len)+len)%len)] || [255,255,255];
      const k=0.3+hash01(n*3.3)*0.25;
      const lite=base.map(v=>v+(255-v)*k);
      return hash01(n*7.7)<0.5? [base,lite] : [lite,base];
    }
    return [colorArrAt(n*S.bandShift), colorArrAt(n*S.bandShift+0.18)];
  };
  const n0=Math.floor(tau-dur);
  const b=layerCols(n0);
  const base=c.createLinearGradient(-L/2,0,L/2,0);
  base.addColorStop(0,rgbStr.apply(null,b[0]));
  base.addColorStop(1,rgbStr.apply(null,b[1]));
  c.fillStyle=base;
  c.fillRect(-L/2,-Wd/2,L,Wd);
  for(let n=n0+1;n<=Math.floor(tau);n++){
    const p=(tau-n)/dur;
    if(p<0||p>1) continue;
    const cc=layerCols(n), c1=cc[0], c2=cc[1];
    const mix=q=>{ q=clamp(q,0,1); return [lerp(c1[0],c2[0],q),lerp(c1[1],c2[1],q),lerp(c1[2],c2[2],q)]; };
    for(let r=0;r<R;r++){
      const edge=-L/2 - softL + p*travel - prof(r);
      const wEnd=Math.min(edge,L/2);
      if(wEnd<=-L/2) continue;
      const y=-Wd/2+r*rowH;
      const q1=(edge-softL+L/2)/L, q2=(edge+L/2)/L;
      const g=c.createLinearGradient(-L/2,0,L/2,0);
      const m1=mix(q1), m2=mix(q2);
      g.addColorStop(0,rgbStr.apply(null,c1));
      g.addColorStop(clamp(q1,0,1),rgbStr.apply(null,m1));
      g.addColorStop(clamp(q2,0.0001,1),'rgba('+(m2[0]|0)+','+(m2[1]|0)+','+(m2[2]|0)+',0)');
      c.fillStyle=g;
      c.fillRect(-L/2,y,wEnd+L/2,rowH+1);
    }
  }
}

/* ---- card fan: rotated cards pivoting around a point ---- */
function drawFan(c,t,L,Wd,minD){
  const N=Math.max(1,Math.round(S.fanCount));
  const spread=S.fanSpread*Math.PI/180;
  const pivotY=Wd*0.5*S.fanPivot;
  const len=S.fanLength*minD;
  const cw=S.fanWidth*minD;
  const sweep=Math.sin(t*S.speed*0.35)*S.fanSweep + t*S.fanSpin*Math.PI/180;
  for(let i=0;i<N;i++){
    const u=N>1? i/(N-1):0.5;
    const jit=(hash01(i*5.1)-0.5)*S.fanScatter;
    const a=(u-0.5+jit*0.35)*spread + sweep;
    const l=len*(1+jit*0.5);
    c.save();
    c.translate(0,pivotY);
    c.rotate(a);
    rrect(c,-cw/2,-l,cw,l,S.fanRound*cw);
    c.fillStyle = S.colorMode==='solid'
      ? stepColor(i)
      : segGradient(c,0,0,0,-l,i*S.bandShift,t,14);
    c.fill();
    if(S.fanGap>0){
      c.lineWidth=S.fanGap*cw;
      c.strokeStyle=S.bg;
      c.stroke();
    }
    c.restore();
  }
}

/* ---- radial blades: beams / wedges from a focal point ---- */
function drawBlades(c,t,L,Wd,minD){
  const N=Math.max(1,Math.round(S.bladeCount));
  const fx=S.bladeFocusX*L*0.5, fy=S.bladeFocusY*Wd*0.5;
  const R=(Math.hypot(L,Wd)+Math.hypot(fx,fy))*S.bladeLength*1.2;
  const arc=S.bladeArc*Math.PI/180;
  const full=Math.abs(S.bladeArc-360)<0.5;
  const spin=t*S.speed*S.bladeSpin*0.3;
  const slotA=arc/(full?N:Math.max(N,1));
  const halfW=slotA*0.5*(1-clamp(S.bladeGap,0,0.95));
  const r0=S.bladeInner*R;
  const fixedHW=Math.max(minD*0.62*Math.sin(Math.max(halfW,0.002)),2);
  const hwAt=r=>lerp(fixedHW, r*Math.sin(halfW), clamp(S.bladeTaper,0,1));
  for(let i=0;i<N;i++){
    const u=full? i/N : (N>1? i/(N-1)-0.5 : 0);
    const a=(full? u*TAU : u*arc) + spin;
    const ca=Math.cos(a), sa=Math.sin(a);
    const px=-sa, py=ca;                       // perpendicular
    const w0=hwAt(Math.max(r0,R*0.02)), w1=hwAt(R);
    const p0x=fx+ca*r0, p0y=fy+sa*r0;
    const p1x=fx+ca*R,  p1y=fy+sa*R;
    c.beginPath();
    c.moveTo(p0x+px*w0, p0y+py*w0);
    c.lineTo(p1x+px*w1, p1y+py*w1);
    c.lineTo(p1x-px*w1, p1y-py*w1);
    c.lineTo(p0x-px*w0, p0y-py*w0);
    c.closePath();
    c.fillStyle = S.colorMode==='solid'
      ? stepColor(i)
      : segGradient(c,fx,fy,p1x,p1y,i*S.bandShift,t,14);
    c.fill();
  }
}

/* ---- tile grid: blocks fading in and out in a travelling wave ---- */
function drawGrid(c,t,L,Wd){
  const cols=Math.max(1,Math.round(S.gridCols)), rows=Math.max(1,Math.round(S.gridRows));
  const cw=L/cols, ch=Wd/rows;
  const gx=cw*S.gridGap*0.5, gy=ch*S.gridGap*0.5;
  const ph=t*S.speed*S.gridFlow;
  for(let r=0;r<rows;r++){
    for(let k=0;k<cols;k++){
      const parity=(r+k)%2;
      const wave=Math.sin(k*S.gridWaveX + r*S.gridWaveY - ph + parity*Math.PI);
      let a=(wave+1)/2;
      a=smooth(clamp((a-0.5)/Math.max(S.gridSharp,0.02)+0.5,0,1));
      if(a<=0.004) continue;
      const x=-L/2+k*cw+gx, y=-Wd/2+r*ch+gy;
      const w=cw-gx*2, h=ch-gy*2;
      const dir=(S.gridMirror&&parity)?-1:1;
      c.globalAlpha=a;
      c.fillStyle = S.colorMode==='solid'
        ? stepColor(r*cols+k)
        : segGradient(c, dir>0?x:x+w, y, dir>0?x+w:x, y, (r*cols+k)*S.bandShift, t, 12);
      rrect(c,x,y,w,h,S.gridRound*Math.min(w,h)*0.5);
      c.fill();
      c.globalAlpha=1;
    }
  }
}

/* ---- concentric rings / arcs ---- */
function drawRings(c,t,L,Wd){
  const N=Math.max(1,Math.round(S.ringCount));
  const R=Math.hypot(L,Wd)*0.5;
  const inner=S.ringInner*R;
  const band=(R-inner)/N;
  for(let i=N-1;i>=0;i--){
    const r1=inner+band*(i+1)-band*S.ringGap*0.5;
    const r0=inner+band*i+band*S.ringGap*0.5;
    if(r1<=r0) continue;
    const dir=i%2? -1:1;
    const a0=t*S.speed*S.ringSpin*0.5*dir + i*S.ringStagger;
    const sweep=clamp(S.ringSweep,0.02,1)*TAU;
    c.beginPath();
    c.arc(0,0,r1,a0,a0+sweep);
    c.arc(0,0,r0,a0+sweep,a0,true);
    c.closePath();
    if(S.colorMode==='solid'){
      c.fillStyle=stepColor(i);
    }else{
      const g=c.createLinearGradient(-r1,-r1,r1,r1);
      for(let s=0;s<=14;s++){
        const u=s/14;
        g.addColorStop(u,colorAt(u*S.gradientScale + i*S.bandShift + t*S.colorDrift));
      }
      c.fillStyle=g;
    }
    c.fill();
  }
}

/* =====================================================================
   FRAME COMPOSITION
   ===================================================================== */
function paint(c,w,h,t,dpr){
  c.setTransform(dpr,0,0,dpr,0,0);

  if(S.bgGradient){
    const bgG=c.createLinearGradient(0,0,0,h);
    bgG.addColorStop(0,S.bg); bgG.addColorStop(1,S.bg2);
    c.fillStyle=bgG;
  } else c.fillStyle=S.bg;
  c.fillRect(0,0,w,h);

  const effAngle=S.angle + S.spin*t;
  const rad=effAngle*Math.PI/180;
  const cs=Math.abs(Math.cos(rad)), sn=Math.abs(Math.sin(rad));
  const zoomNow=Math.max(S.zoom*(1+S.pulse*Math.sin(t*S.pulseSpeed*TAU*0.2)),0.05);
  const cover=(1.08+S.driftAmt*2.2)/zoomNow;
  const L=(w*cs+h*sn)*cover, Wd=(w*sn+h*cs)*cover;
  const minD=Math.min(w,h);
  const ox=S.driftAmt*w*Math.cos(t*S.driftSpeed);
  const oy=S.driftAmt*h*Math.sin(t*S.driftSpeed*0.8);

  c.save();
  c.translate(w/2+ox,h/2+oy);
  c.rotate(rad);
  c.scale((S.flipX?-1:1)*zoomNow,(S.flipY?-1:1)*zoomNow);
  switch(S.variant){
    case 'bars':   drawBars(c,t,L,Wd); break;
    case 'steps':  drawSteps(c,t,L,Wd); break;
    case 'fan':    drawFan(c,t,L,Wd,minD); break;
    case 'blades': drawBlades(c,t,L,Wd,minD); break;
    case 'grid':   drawGrid(c,t,L,Wd); break;
    case 'rings':  drawRings(c,t,L,Wd); break;
    default:       drawRibbons(c,t,L,Wd,minD);
  }
  c.restore();

  if(S.grain>0){
    c.save();
    c.globalAlpha=S.grain;
    c.globalCompositeOperation='overlay';
    c.fillStyle=grainFor(c);
    c.fillRect(0,0,w,h);
    c.restore();
  }
}

let forceDraw=true;
let clock=0, lastNow=null;
function frame(now){
  requestAnimationFrame(frame);
  if(lastNow===null) lastNow=now;
  const dt=Math.min((now-lastNow)/1000,0.1);
  lastNow=now;
  if(!S.paused || recording) clock+=dt;
  else if(!forceDraw) return;
  forceDraw=false;
  paint(ctx,W,H,clock,DPR);
}

/* =====================================================================
   RECORDING — WebM / MP4 via MediaRecorder, GIF via an inline encoder
   ===================================================================== */
let recording=false;

/* ---- minimal GIF89a encoder (median-cut palette + LZW, per-frame table) ---- */
function quantize(data,maxColors){
  const px=data.length/4;
  const stride=Math.max(1,Math.floor(px/16000));
  const pts=[];
  for(let i=0;i<px;i+=stride){ const o=i*4; pts.push([data[o],data[o+1],data[o+2]]); }
  const boxFrom=arr=>{
    let rmin=255,rmax=0,gmin=255,gmax=0,bmin=255,bmax=0;
    for(let i=0;i<arr.length;i++){
      const p=arr[i];
      if(p[0]<rmin)rmin=p[0]; if(p[0]>rmax)rmax=p[0];
      if(p[1]<gmin)gmin=p[1]; if(p[1]>gmax)gmax=p[1];
      if(p[2]<bmin)bmin=p[2]; if(p[2]>bmax)bmax=p[2];
    }
    const dr=rmax-rmin, dg=gmax-gmin, db=bmax-bmin;
    return {pts:arr, axis:(dr>=dg&&dr>=db)?0:(dg>=db?1:2), range:Math.max(dr,dg,db)};
  };
  let boxes=[boxFrom(pts)];
  while(boxes.length<maxColors){
    let bi=-1,best=0;
    for(let i=0;i<boxes.length;i++){
      const b=boxes[i];
      if(b.pts.length<2||b.range<=1) continue;
      const score=b.range*Math.log(b.pts.length+1);
      if(score>best){ best=score; bi=i; }
    }
    if(bi<0) break;
    const b=boxes[bi], ax=b.axis;
    b.pts.sort((p,q)=>p[ax]-q[ax]);
    const mid=b.pts.length>>1;
    boxes.splice(bi,1,boxFrom(b.pts.slice(0,mid)),boxFrom(b.pts.slice(mid)));
  }
  return boxes.map(b=>{
    let r=0,g=0,bl=0; const n=b.pts.length||1;
    for(let i=0;i<b.pts.length;i++){ r+=b.pts[i][0]; g+=b.pts[i][1]; bl+=b.pts[i][2]; }
    return [Math.round(r/n),Math.round(g/n),Math.round(bl/n)];
  });
}

const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function mapToPalette(data,pal,w,h){
  const idx=new Uint8Array(w*h);
  const cache=new Int16Array(32768).fill(-1);
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const i=y*w+x, o=i*4;
      const d=(BAYER[(y&3)*4+(x&3)]/16-0.47)*9;
      const r=clamp(data[o]+d,0,255)|0, g=clamp(data[o+1]+d,0,255)|0, b=clamp(data[o+2]+d,0,255)|0;
      const key=((r>>3)<<10)|((g>>3)<<5)|(b>>3);
      let ci=cache[key];
      if(ci<0){
        let bd=1e12, bx=0;
        for(let p=0;p<pal.length;p++){
          const dr=r-pal[p][0], dg=g-pal[p][1], db=b-pal[p][2];
          const dd=dr*dr*0.9+dg*dg*1.2+db*db*0.7;
          if(dd<bd){ bd=dd; bx=p; }
        }
        ci=bx; cache[key]=ci;
      }
      idx[i]=ci;
    }
  }
  return idx;
}

function lzwEncode(indices,minCodeSize){
  /* Mirrors the reference GIF LZW compressor: a code is written at the
     current width first, and the width only grows once the next free code
     no longer fits — the decoder's table lags by exactly one entry. */
  const out=[];
  let cur=0,bits=0;
  const clear=1<<minCodeSize, eoi=clear+1;
  let codeSize=minCodeSize+1, maxcode=(1<<codeSize)-1, next=eoi+1;
  let dict=new Map();
  const push=code=>{
    cur |= code<<bits; bits+=codeSize;
    while(bits>=8){ out.push(cur&255); cur>>=8; bits-=8; }
    if(next>maxcode && codeSize<12){ codeSize++; maxcode=(1<<codeSize)-1; }
  };
  push(clear);
  let prev=indices[0];
  for(let i=1;i<indices.length;i++){
    const k=indices[i], key=(prev<<8)|k;
    const found=dict.get(key);
    if(found!==undefined){ prev=found; continue; }
    push(prev);
    if(next<4096){
      dict.set(key,next);
      next++;
    }else{
      push(clear);
      dict=new Map();
      next=eoi+1; codeSize=minCodeSize+1; maxcode=(1<<codeSize)-1;
    }
    prev=k;
  }
  push(prev);
  push(eoi);
  if(bits>0) out.push(cur&255);
  return out;
}

function GifWriter(w,h,delayCs){
  this.w=w; this.h=h; this.delay=delayCs; this.parts=[];
  const head=[];
  'GIF89a'.split('').forEach(ch=>head.push(ch.charCodeAt(0)));
  head.push(w&255,(w>>8)&255,h&255,(h>>8)&255,0x00,0x00,0x00);   // no global table
  // NETSCAPE2.0 infinite-loop extension
  head.push(0x21,0xFF,0x0B);
  'NETSCAPE2.0'.split('').forEach(ch=>head.push(ch.charCodeAt(0)));
  head.push(0x03,0x01,0x00,0x00,0x00);
  this.parts.push(new Uint8Array(head));
}
GifWriter.prototype.addFrame=function(rgba){
  const w=this.w, h=this.h, d=this.delay;
  const pal=quantize(rgba,256);
  const idx=mapToPalette(rgba,pal,w,h);
  const pre=[];
  pre.push(0x21,0xF9,0x04,0x04,d&255,(d>>8)&255,0x00,0x00);       // graphic control
  pre.push(0x2C,0,0,0,0,w&255,(w>>8)&255,h&255,(h>>8)&255,0x87);  // image descriptor + local table
  for(let i=0;i<256;i++){
    const c=pal[i]||[0,0,0];
    pre.push(c[0],c[1],c[2]);
  }
  pre.push(8);                                                     // LZW minimum code size
  const bytes=lzwEncode(idx,8);
  for(let i=0;i<bytes.length;i+=255){
    const n=Math.min(255,bytes.length-i);
    pre.push(n);
    for(let j=0;j<n;j++) pre.push(bytes[i+j]);
  }
  pre.push(0x00);
  this.parts.push(new Uint8Array(pre));
};
GifWriter.prototype.finish=function(){
  this.parts.push(new Uint8Array([0x3B]));
  return new Blob(this.parts,{type:'image/gif'});
};

async function captureGIF(onProgress){
  const fps=clamp(Math.round(S.recFps),5,30);
  const n=Math.max(2,Math.round(fps*S.recDuration));
  const gw=Math.round(S.recWidth/2)*2;
  const gh=Math.max(2,Math.round(gw*(H/W)/2)*2);
  const off=document.createElement('canvas');
  off.width=gw; off.height=gh;
  const oc=off.getContext('2d',{willReadFrequently:true});
  const gif=new GifWriter(gw,gh,Math.max(2,Math.round(100/fps)));
  const t0=clock;
  for(let i=0;i<n;i++){
    paint(oc,gw,gh,t0+i/fps,1);
    gif.addFrame(oc.getImageData(0,0,gw,gh).data);
    onProgress((i+1)/n);
    await new Promise(r=>setTimeout(r,0));
  }
  return gif.finish();
}

function pickMime(list){
  if(!window.MediaRecorder) return null;
  for(const m of list) if(MediaRecorder.isTypeSupported(m)) return m;
  return null;
}
async function captureVideo(onProgress){
  const fps=clamp(Math.round(S.recFps),10,60);
  const wantMp4=S.recFormat==='mp4';
  let mime=pickMime(wantMp4
    ? ['video/mp4;codecs=avc1.4d002a','video/mp4;codecs=avc1','video/mp4']
    : ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm']);
  if(!mime && wantMp4){
    mime=pickMime(['video/webm;codecs=vp9','video/webm']);
    if(mime) toast('MP4 not supported here — recording WebM');
  }
  if(!mime) throw new Error('Video recording is not supported in this browser');
  const stream=canvas.captureStream(fps);
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:16000000});
  const chunks=[];
  rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  const stopped=new Promise(res=>{ rec.onstop=res; });
  const t0=performance.now();
  rec.start(200);
  const timer=setInterval(()=>onProgress(clamp((performance.now()-t0)/(S.recDuration*1000),0,1)),100);
  await new Promise(r=>setTimeout(r,S.recDuration*1000));
  clearInterval(timer);
  rec.stop();
  await stopped;
  stream.getTracks().forEach(tr=>tr.stop());
  return new Blob(chunks,{type:mime.split(';')[0]});
}

async function saveFile(blob,name){
  const dl=(window.claude&&window.claude.use)
    ? await window.claude.use('downloads').catch(()=>null) : null;
  if(dl){
    try{ await dl.save({filename:name,data:blob}); toast('Saved '+name); }
    catch(e){ toast(e&&e.code==='declined'?'Save cancelled':'Save failed'+(e&&e.code?' ('+e.code+')':'')); }
    return;
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  toast('Exported '+name);
}

let recBtn=null, recBar=null, recFill=null;
function setRecProgress(p){
  if(recFill) recFill.style.width=Math.round(p*100)+'%';
}
function updateRecUI(){
  if(!recBtn) return;
  recBtn.textContent = recording ? 'Recording…' : '⏺ Record '+S.recFormat.toUpperCase();
  recBtn.disabled=recording;
  if(recBar) recBar.classList.toggle('on',recording);
}
async function doRecord(){
  if(recording) return;
  recording=true; setRecProgress(0); updateRecUI();
  const wasPaused=S.paused;
  S.paused=false;
  try{
    const isGif=S.recFormat==='gif';
    const blob=isGif ? await captureGIF(setRecProgress) : await captureVideo(setRecProgress);
    const ext=isGif?'gif':(blob.type.indexOf('mp4')>=0?'mp4':'webm');
    const mb=blob.size/(1024*1024);
    if(mb>16){
      toast('File is '+mb.toFixed(1)+' MB — over the 16 MB limit. Shorten it or lower the size.');
    }else{
      await saveFile(blob,'flow-pattern.'+ext);
    }
  }catch(e){
    toast(String((e&&e.message)||e));
  }
  S.paused=wasPaused;
  recording=false; setRecProgress(0); updateRecUI();
}

function fmtVal(def,v){
  if(def.fmt) return def.fmt(v);
  if(def.type==='range') return def.step>=1? String(v) : (+v).toFixed(def.step<0.01?3:2);
  return '';
}

function buildRow(def){
  const row=document.createElement('div');
  row.className='row';
  const label=document.createElement('label');
  label.textContent=def.label;
  row.appendChild(label);
  let el;
  if(def.type==='range'){
    el=document.createElement('input');
    el.type='range'; el.min=def.min; el.max=def.max; el.step=def.step;
    const val=document.createElement('span');
    val.className='val';
    el.oninput=()=>{ S[def.key]=+el.value; val.textContent=fmtVal(def,+el.value); onChange(def.key); };
    row.append(el,val);
    inputs[def.key]={el,def,valEl:val,rowEl:row};
  } else if(def.type==='check'){
    el=document.createElement('input');
    el.type='checkbox';
    el.onchange=()=>{ S[def.key]=el.checked; onChange(def.key); };
    row.appendChild(el);
    inputs[def.key]={el,def,rowEl:row};
  } else if(def.type==='select'){
    el=document.createElement('select');
    for(const o of def.opts){
      const opt=document.createElement('option');
      opt.value=o[0]; opt.textContent=o[1];
      el.appendChild(opt);
    }
    el.onchange=()=>{ S[def.key]=def.num? +el.value : el.value; onChange(def.key); };
    row.appendChild(el);
    inputs[def.key]={el,def,rowEl:row};
  } else if(def.type==='color'){
    el=document.createElement('input');
    el.type='color';
    el.oninput=()=>{ S[def.key]=el.value; onChange(def.key); };
    row.appendChild(el);
    inputs[def.key]={el,def,rowEl:row};
  }
  return row;
}

function syncUI(){
  for(const key of Object.keys(inputs)){
    const rec=inputs[key], v=S[key];
    if(rec.def.type==='check') rec.el.checked=!!v;
    else rec.el.value=v;
    if(rec.valEl) rec.valEl.textContent=fmtVal(rec.def,v);
    rec.rowEl.style.display = rec.def.show && !rec.def.show(S) ? 'none' : '';
  }
  for(const s of sections) s.el.style.display = s.show && !s.show(S) ? 'none' : '';
  renderPalette();
  markActiveGradient();
  renderShapes();
  updateRecUI();
}

function onChange(key){
  forceDraw=true;
  if(key==='variant'||key==='bgGradient'||key==='colorMode'||key==='pulse'
     ||key==='driftAmt'||key==='pinch'||key==='recFormat') syncUI();
}

/* ---------------- preset application ---------------- */
function applyShape(p){ Object.assign(S,JSON.parse(JSON.stringify(p))); syncUI(); forceDraw=true; }
function applyGradient(g){
  S.palette=g.palette.slice();
  S.bg=g.bg;
  if(g.bg2!==undefined) S.bg2=g.bg2;
  if(g.bgGradient!==undefined) S.bgGradient=g.bgGradient;
  cachePalette(); syncUI(); forceDraw=true;
}
function applyAll(p){
  S=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),JSON.parse(JSON.stringify(p)));
  cachePalette(); syncUI(); forceDraw=true;
}

/* ---------------- actions ---------------- */
function hslToHex(h,s,l){
  s/=100; l/=100;
  const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return '#'+[f(0),f(8),f(4)].map(v=>Math.round(v*255).toString(16).padStart(2,'0')).join('');
}
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];

function randomize(){
  const variant=pick(Object.keys(TYPE_LABEL));
  const grad=pick(GRADIENTS);
  const names=Object.keys(SHAPES[variant]);
  const shape=SHAPES[variant][pick(names)];
  const base=JSON.parse(JSON.stringify(DEFAULTS));
  Object.assign(base,{variant:variant},JSON.parse(JSON.stringify(shape)));
  base.palette=grad.palette.slice();
  base.bg=grad.bg;
  base.bgGradient=Math.random()<0.35;
  base.bg2=grad.bg2||grad.bg;
  base.colorMode=Math.random()<0.8?'flow':'solid';
  base.gradientScale=rnd(0.6,1.8);
  base.bandShift=rnd(0.05,0.3);
  base.colorDrift=rnd(0.01,0.14);
  base.speed=rnd(0.4,1.4);
  base.grain=rnd(0,0.4);
  base.angle=pick([0,0,0,90,-90,Math.round(rnd(-40,40))]);
  base.flipX=Math.random()<0.3;
  base.flipY=Math.random()<0.3;
  if(Math.random()<0.35) base.spin=rnd(-12,12);
  if(Math.random()<0.3){ base.pulse=rnd(0.05,0.3); base.pulseSpeed=rnd(0.2,1.5); }
  if(Math.random()<0.3){ base.driftAmt=rnd(0.03,0.15); base.driftSpeed=rnd(0.1,0.8); }
  base.zoom=Math.random()<0.3? rnd(0.6,1.6) : 1;
  S=base;
  cachePalette(); syncUI(); forceDraw=true;
  toast('Randomized ✨');
}

function exportPNG(){
  canvas.toBlob(b=>{ saveFile(b,'flow-pattern.png'); },'image/png');
}
function copyConfig(){
  const json=JSON.stringify(S,null,2);
  (navigator.clipboard? navigator.clipboard.writeText(json):Promise.reject())
    .then(()=>toast('Config copied to clipboard'))
    .catch(()=>{ window.prompt('Copy config JSON:',JSON.stringify(S)); });
}
function pasteConfig(){
  const raw=window.prompt('Paste config JSON:');
  if(!raw) return;
  try{ applyAll(JSON.parse(raw)); toast('Config applied'); }
  catch(e){ toast('Invalid JSON'); }
}

/* ---------------- toast + panel toggle ---------------- */
let toastTimer=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2200);
}

const toggleBtn=document.getElementById('toggleBtn');
function togglePanel(){
  panel.classList.toggle('hidden');
  toggleBtn.classList.toggle('open',!panel.classList.contains('hidden'));
}
toggleBtn.onclick=togglePanel;
window.addEventListener('keydown',e=>{
  const typing=e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName||'');
  if(e.key==='h'||e.key==='H'){ if(!typing) togglePanel(); }
  if(e.key===' '&&!typing){ e.preventDefault(); S.paused=!S.paused; syncUI(); forceDraw=true; }
  if((e.key==='r'||e.key==='R')&&!typing) randomize();
});

/* ---------------- boot ---------------- */
resize();
cachePalette();
buildPanel();
requestAnimationFrame(frame);

/* exposed for automated checks */
window.__studio={captureGIF,captureVideo,S:()=>S,setState:o=>{applyAll(o);}};
</script>
</body>
