<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#04060c" />
<title>The Eight Wonders</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* Layout: one phone-sized stage. A full-bleed WebGL canvas, with glass UI layered on top
   (header + wonder rail on the globe; back button + bottom sheet inside a wonder). */
:root {
  --space: #04060c;
  --ink: #eef0f5;
  --mute: #9aa3b6;
  --line: rgba(222, 230, 255, 0.14);
  --glass: rgba(10, 14, 26, 0.58);
  --glass-strong: rgba(9, 12, 22, 0.86);
  --gold: #e9c27b;
  --gold-deep: #b98a3e;
  --rose: #ff8db3;
  --rose-deep: #c94f7c;
  --display: "Cinzel", "Trajan Pro", "Times New Roman", serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --peek: 214px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; background: var(--space); color: var(--ink); overflow: hidden; overscroll-behavior: none; }
body { font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

#app { position: relative; height: 100%; max-width: 440px; margin: 0 auto; overflow: hidden; background: var(--space); isolation: isolate; }
@media (min-width: 520px) { #app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* ---------- globe UI ---------- */
.top { position: absolute; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px 28px; background: linear-gradient(180deg, rgba(4, 6, 12, .82), rgba(4, 6, 12, .5) 60%, rgba(4, 6, 12, 0)); pointer-events: none; z-index: 3; transition: opacity .5s, transform .5s; }
.eyebrow { margin: 0; font: 500 11px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
.eyebrow b { color: var(--rose); font-weight: 500; }
.top h1 { margin: 10px 0 6px; font: 700 30px/1.02 var(--display); letter-spacing: .04em; text-wrap: balance; background: linear-gradient(180deg, #fff 30%, #e9d3a6); -webkit-background-clip: text; background-clip: text; color: transparent; }
.top .hint { margin: 0; font-size: 13px; color: var(--mute); }

.labels { position: absolute; inset: 0; pointer-events: none; z-index: 2; transition: opacity .4s; }
.mk { position: absolute; left: 0; top: 0; pointer-events: auto; display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 8px; border-radius: 999px; background: rgba(8, 10, 20, .62); border: 1px solid rgba(233, 194, 123, .38); color: #f6ead2; font: 600 11px/1 var(--body); letter-spacing: .02em; white-space: nowrap; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); will-change: transform, opacity; transition: border-color .3s, background .3s; }
.mk i { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.mk.her { border-color: rgba(255, 141, 179, .6); color: #ffe3ee; }
.mk.her i { background: var(--rose); box-shadow: 0 0 10px var(--rose); }
.mk.on { background: rgba(233, 194, 123, .22); border-color: var(--gold); }
.mk.her.on { background: rgba(255, 141, 179, .24); border-color: var(--rose); }

.rail { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 0 11% calc(env(safe-area-inset-bottom, 0px) + 18px); scrollbar-width: none; transition: opacity .5s, transform .5s; }
.rail::-webkit-scrollbar { display: none; }
.card { flex: 0 0 78%; scroll-snap-align: center; min-width: 0; padding: 14px 16px 14px; border-radius: 18px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto auto; column-gap: 12px; row-gap: 2px; transition: border-color .3s, transform .3s; }
.card.on { border-color: rgba(233, 194, 123, .55); }
.card.her.on { border-color: rgba(255, 141, 179, .7); }
.card .num { grid-column: 1 / -1; font: 500 10px/1 var(--mono); letter-spacing: .14em; color: var(--gold); text-transform: uppercase; margin-bottom: 6px; }
.card.her .num { color: var(--rose); }
.card .cname { font: 700 17px/1.15 var(--display); letter-spacing: .02em; min-width: 0; }
.card .cmeta { grid-column: 1; font: 400 11px/1.4 var(--mono); color: var(--mute); margin-top: 4px; }
.card .go { grid-column: 2; grid-row: 2 / 4; align-self: center; display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-radius: 999px; background: linear-gradient(180deg, #f3d595, var(--gold-deep)); color: #23180a; font: 700 12px/1 var(--body); white-space: nowrap; box-shadow: 0 6px 18px rgba(233, 194, 123, .25); }
.card.her .go { background: linear-gradient(180deg, #ffb3cd, var(--rose-deep)); color: #2a0a17; box-shadow: 0 6px 18px rgba(255, 141, 179, .3); }
.go svg { width: 14px; height: 14px; }

body.diving .top, body.diving .rail { opacity: 0; transform: translateY(12px); pointer-events: none; }
body.diving .labels { opacity: 0; }
body.inwonder .top, body.inwonder .rail, body.inwonder .labels { display: none; }

/* ---------- wonder UI ---------- */
.wui { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
.wbar { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 12px; padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 0; }
.round { pointer-events: auto; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.round svg { width: 18px; height: 18px; }
.wbar .crumb { font: 500 11px/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: rgba(255, 255, 255, .86); text-shadow: 0 1px 8px rgba(0, 0, 0, .5); }
.wbar .crumb span { display: block; color: rgba(255, 255, 255, .6); letter-spacing: .06em; text-transform: none; }
.ohint { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 72px); transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: rgba(0, 0, 0, .38); font: 500 12px/1 var(--body); color: rgba(255, 255, 255, .9); white-space: nowrap; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: opacity .8s; }
.ohint svg { width: 16px; height: 16px; }
.ohint.gone { opacity: 0; }

.sheet { pointer-events: auto; position: absolute; left: 0; right: 0; bottom: 0; height: 74%; display: flex; flex-direction: column; border-radius: 24px 24px 0 0; background: var(--glass-strong); border-top: 1px solid var(--line); backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3); transform: translateY(calc(100% - var(--peek) - env(safe-area-inset-bottom, 0px))); transition: transform .45s cubic-bezier(.2, .8, .2, 1); touch-action: none; }
.sheet.open { transform: translateY(0); }
.sheet.dragging { transition: none; }
.sheet.her { border-top-color: rgba(255, 141, 179, .4); box-shadow: 0 -12px 40px rgba(255, 141, 179, .12); }
.grab { display: grid; place-items: center; padding: 10px 0 4px; cursor: grab; }
.grab span { width: 40px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .28); }
.shead { padding: 6px 20px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; align-items: start; cursor: pointer; }
.shead .eyebrow { grid-column: 1 / -1; color: var(--gold); }
.sheet.her .shead .eyebrow { color: var(--rose); }
.shead h2 { margin: 4px 0 0; font: 700 26px/1.08 var(--display); letter-spacing: .02em; text-wrap: balance; min-width: 0; }
.shead .coords { grid-column: 1; font: 400 11.5px/1.4 var(--mono); color: var(--mute); }
.avatar { grid-column: 2; grid-row: 2 / 4; width: 62px; height: 62px; border-radius: 50%; padding: 2px; background: conic-gradient(from 200deg, var(--rose), var(--gold), var(--rose)); }
.avatar img, .avatar canvas { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; background: #2a1424; }
.chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); font: 500 11.5px/1 var(--body); color: #dfe3ec; background: rgba(255, 255, 255, .04); }
.sbody { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 20px calc(env(safe-area-inset-bottom, 0px) + 26px); touch-action: pan-y; overscroll-behavior: contain; }
.sheet:not(.open) .sbody { overflow: hidden; }
.sbody p { margin: 0 0 16px; color: #d7dbe5; font-size: 14.5px; line-height: 1.6; max-width: 62ch; }
.portrait { margin: 6px 0 18px; border-radius: 18px; overflow: hidden; aspect-ratio: 4 / 5; max-width: 100%; position: relative; border: 1px solid rgba(255, 141, 179, .35); }
.portrait img, .portrait canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; margin: 0 0 18px; border-radius: 14px; overflow: hidden; background: var(--line); }
.facts div { background: rgba(12, 16, 28, .92); padding: 12px 14px; min-width: 0; }
.facts dt { font: 500 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin-bottom: 6px; }
.facts dd { margin: 0; font: 600 13.5px/1.35 var(--body); color: var(--ink); }
.dyk { padding: 14px 16px; border-radius: 14px; background: linear-gradient(135deg, rgba(233, 194, 123, .14), rgba(233, 194, 123, .03)); border: 1px solid rgba(233, 194, 123, .25); margin-bottom: 20px; }
.sheet.her .dyk { background: linear-gradient(135deg, rgba(255, 141, 179, .16), rgba(255, 141, 179, .03)); border-color: rgba(255, 141, 179, .3); }
.dyk h3 { margin: 0 0 6px; font: 500 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.sheet.her .dyk h3 { color: var(--rose); }
.dyk p { margin: 0; font-size: 14px; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pager button { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255, 255, 255, .03); text-align: left; min-width: 0; }
.pager button:last-child { text-align: right; align-items: flex-end; }
.pager small { font: 500 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
.pager strong { font: 700 13px/1.2 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

/* ---------- transitions & loader ---------- */
.fade { position: absolute; inset: 0; z-index: 8; pointer-events: none; opacity: 0; transition: opacity .5s ease; background: radial-gradient(circle at 50% 45%, #f4f7fb, #c9d7e6 60%, #9fb4cc); }
.fade.dark { background: var(--space); }
.fade.on { opacity: 1; }
.loader { position: absolute; inset: 0; z-index: 9; display: grid; place-items: center; background: var(--space); transition: opacity .8s; }
.loader.done { opacity: 0; pointer-events: none; }
.loader .in { width: 70%; text-align: center; }
.loader h2 { margin: 12px 0 18px; font: 700 24px/1.1 var(--display); letter-spacing: .06em; }
.bar { height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), var(--rose)); transition: width .3s; }
.loader small { display: block; margin-top: 12px; font: 400 11px/1 var(--mono); color: var(--mute); letter-spacing: .1em; }

@media (prefers-reduced-motion: reduce) { .sheet, .fade, .top, .rail { transition-duration: .01s; } }
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div class="labels" id="labels"></div>

  <header class="top">
    <p class="eyebrow">New 7 Wonders <b>+ 1</b></p>
    <h1>The Eight Wonders</h1>
    <p class="hint">Spin the Earth. Tap a glowing marker to step inside.</p>
  </header>

  <div class="rail" id="rail"></div>

  <div class="wui" id="wui" hidden>
    <div class="wbar">
      <button class="round" id="back" aria-label="Back to the globe">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="crumb" id="crumb"></div>
    </div>
    <div class="ohint" id="ohint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>
      Drag to orbit · Pinch to zoom
    </div>
    <section class="sheet" id="sheet" aria-label="About this wonder">
      <div class="grab" id="grab"><span></span></div>
      <div class="shead" id="shead">
        <p class="eyebrow" id="sEyebrow"></p>
        <h2 id="sName"></h2>
        <div class="avatar" id="sAvatar" hidden></div>
        <div class="coords" id="sCoords"></div>
        <div class="chips" id="sChips"></div>
      </div>
      <div class="sbody" id="sbody">
        <figure class="portrait" id="sPortrait" hidden></figure>
        <p id="sBlurb"></p>
        <dl class="facts" id="sFacts"></dl>
        <div class="dyk"><h3 id="sFactTitle">Did you know</h3><p id="sFact"></p></div>
        <nav class="pager">
          <button id="prev"><small>Previous</small><strong id="prevName"></strong></button>
          <button id="next"><small>Next</small><strong id="nextName"></strong></button>
        </nav>
      </div>
    </section>
  </div>

  <div class="fade" id="fade"></div>
  <div class="loader" id="loader">
    <div class="in">
      <p class="eyebrow">New 7 Wonders <b>+ 1</b></p>
      <h2>The Eight Wonders</h2>
      <div class="bar"><i id="barFill"></i></div>
      <small id="loadTxt">Loading Earth</small>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": {

} }

<script type="module">

/* =====================================================================
   THE 8TH WONDER — edit this block when her details arrive.
   photo: path or URL to her picture (e.g. 'her.jpg' placed next to this file).
   Leave photo empty to show the placeholder portrait.
   ===================================================================== */
const HER = {
  name: 'The 8th Wonder',
  subtitle: 'Her name, revealed soon',
  place: 'Near Hyderabad, Telangana',
  lat: 17.3850, lon: 78.4867,
  photo: '',
  blurb: 'Seven wonders were chosen by the world. The eighth is chosen by the heart. Her photo, her story and the little things that make her a wonder will appear right here.',
  facts: [['Born', 'Coming soon'], ['Known for', 'Coming soon'], ['Superpower', 'Coming soon'], ['Favourite place', 'Coming soon']],
  chips: ['Hyderabad', 'One of a kind'],
  factTitle: 'Why she is a wonder',
  fact: 'Coming soon.',
};

const WONDERS = [
  { id: 'great-wall', name: 'Great Wall of China', country: 'China', place: 'Mutianyu, near Beijing', lat: 40.4319, lon: 116.5704,
    blurb: "A chain of walls, watchtowers and forts winding across northern China's mountains and deserts. Successive dynasties built and rebuilt it over two thousand years to guard the frontier. The brick sections most people walk today, like Mutianyu and Badaling, are mostly Ming dynasty work.",
    facts: [['Built', '7th c. BC – 1644'], ['Built by', 'Qin, Han & Ming dynasties'], ['Length', '21,196 km, all branches'], ['World Heritage', 'UNESCO, 1987']],
    chips: ['Ming brickwork', 'Watchtowers', 'Ridgelines'],
    fact: "Despite the legend, it can't be seen with the naked eye from the Moon. It is enormously long but only a few metres wide." },
  { id: 'petra', name: 'Petra', country: 'Jordan', place: "Ma'an Governorate", lat: 30.3285, lon: 35.4444,
    blurb: 'The rose-red capital of the Nabataean kingdom, carved straight into the sandstone cliffs of southern Jordan. You arrive through the Siq, a narrow 1.2 km gorge that suddenly opens onto Al-Khazneh, the Treasury: a temple front cut from a single rock face.',
    facts: [['Carved', 'c. 1st century AD'], ['Built by', 'The Nabataeans'], ['Al-Khazneh', 'About 40 m tall'], ['World Heritage', 'UNESCO, 1985']],
    chips: ['Rock-cut', 'Rose sandstone', 'The Siq'],
    fact: 'Bedouin legend said pirate treasure was hidden in the urn at the top of the Treasury. Bullet marks from people trying to shatter it are still visible.' },
  { id: 'colosseum', name: 'Colosseum', country: 'Italy', place: 'Rome', lat: 41.8902, lon: 12.4922,
    blurb: 'The largest amphitheatre ever built, raised by the Flavian emperors in the heart of Rome. Up to 50,000 spectators watched gladiator fights and animal hunts here. Earthquakes and centuries of stone robbing gave it the broken outline it has today.',
    facts: [['Built', 'AD 72 – 80'], ['Built by', 'Vespasian & Titus'], ['Size', '189 × 156 m, 48 m tall'], ['World Heritage', 'UNESCO, 1980']],
    chips: ['Travertine', '80 arches', 'Hypogeum'],
    fact: 'A huge retractable awning, the velarium, was rigged by sailors from the imperial fleet to shade the crowd from the sun.' },
  { id: 'chichen-itza', name: 'Chichén Itzá', country: 'Mexico', place: 'Yucatán', lat: 20.6843, lon: -88.5678,
    blurb: 'A great Maya city on the Yucatán Peninsula, dominated by El Castillo, the Temple of Kukulcán. Each of its four staircases has 91 steps; add the top platform and you get 365, one for every day of the year.',
    facts: [['Built', 'c. 8th – 12th c. AD'], ['Built by', 'The Maya (Itza)'], ['El Castillo', '30 m incl. temple'], ['World Heritage', 'UNESCO, 1988']],
    chips: ['Step pyramid', '365 steps', 'Equinox'],
    fact: 'At the spring and autumn equinoxes, the late-afternoon sun throws a serpent of light and shadow down the north staircase.' },
  { id: 'machu-picchu', name: 'Machu Picchu', country: 'Peru', place: 'Cusco Region', lat: -13.1631, lon: -72.5450,
    blurb: 'An Inca citadel on a ridge high in the Andes, between the peaks of Machu Picchu and Huayna Picchu. Built for the emperor Pachacuti around 1450, it was abandoned a century later and never found by the Spanish conquistadors.',
    facts: [['Built', 'c. 1450'], ['Built by', 'The Inca Empire'], ['Altitude', '2,430 m'], ['World Heritage', 'UNESCO, 1983']],
    chips: ['Cloud forest', 'Terraces', 'Huayna Picchu'],
    fact: "Its finest walls are ashlar masonry: stones cut to fit so tightly, without mortar, that a knife blade can't slip between them." },
  { id: 'christ-redeemer', name: 'Christ the Redeemer', country: 'Brazil', place: 'Rio de Janeiro', lat: -22.9519, lon: -43.2105,
    blurb: 'An Art Deco statue with arms open wide on the 700-metre summit of Corcovado, looking out over Rio de Janeiro and Guanabara Bay. Engineer Heitor da Silva Costa and sculptor Paul Landowski built it from reinforced concrete covered in a mosaic of soapstone tiles.',
    facts: [['Built', '1922 – 1931'], ['Built by', 'da Silva Costa & Landowski'], ['Size', '30 m tall, 28 m arms'], ['World Heritage', 'UNESCO, 2012']],
    chips: ['Art Deco', 'Soapstone', 'Corcovado'],
    fact: 'Lightning strikes it several times a year. Spare soapstone from the original quarry is kept on hand to repair the fingers and head.' },
  { id: 'taj-mahal', name: 'Taj Mahal', country: 'India', place: 'Agra, Uttar Pradesh', lat: 27.1751, lon: 78.0421,
    blurb: 'An ivory-white marble mausoleum on the bank of the Yamuna, commissioned by the Mughal emperor Shah Jahan in memory of his wife Mumtaz Mahal. Its gardens, minarets and great onion dome are laid out in near-perfect symmetry.',
    facts: [['Built', '1632 – 1653'], ['Built by', 'Shah Jahan, Mughal Empire'], ['Height', '73 m'], ['World Heritage', 'UNESCO, 1983']],
    chips: ['White marble', 'Charbagh garden', 'Yamuna'],
    fact: 'The four minarets lean very slightly outward, so that in an earthquake they would fall away from the tomb instead of onto it.' },
  { id: 'her', her: true, name: HER.name, country: 'India', place: HER.place, lat: HER.lat, lon: HER.lon,
    blurb: HER.blurb, facts: HER.facts, chips: HER.chips, fact: HER.fact, factTitle: HER.factTitle, labelBelow: true },
];

/* ---------------------------------------------------------------------
   basics
   --------------------------------------------------------------------- */
const V3 = THREE.Vector3;
const DEG = Math.PI / 180;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const pad = n => String(n).padStart(2, '0');
const fmtLat = v => `${Math.abs(v).toFixed(4)}° ${v >= 0 ? 'N' : 'S'}`;
const fmtLon = v => `${Math.abs(v).toFixed(4)}° ${v >= 0 ? 'E' : 'W'}`;
const $ = id => document.getElementById(id);

function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash2(ix, iy, seed) { let h = Math.imul(ix | 0, 374761393) ^ Math.imul(iy | 0, 668265263) ^ Math.imul(seed | 0, 1442695041); h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vnoise(x, y, seed = 0, period = 0) {
  let ix = Math.floor(x), iy = Math.floor(y); const fx = x - ix, fy = y - iy;

/* ---------- Colosseum ---------- */
function buildColosseum(ctx) {
  const T = sharedTextures();

    sky: { top: '#3f78c0', mid: '#86aed8', horizon: '#ece2cf', bottom: '#bfb19a', sunDir: [-.62, .55, .5], sunColor: '#ffe6c0' },
    sunColor: '#ffe8c8', sunIntensity: 3.3, fog: ['#e2dccd', 90, 600], shadow: 40, hemi: ['#d2e2f5', '#6e6250', .35],
  });
  const travertine = std('#dccaa5', { roughness: .92, map: repeatOf(T.stone, 1) });
  const weathered = std('#c4b08c', { roughness: .95, map: repeatOf(T.stone, 1) });
  const brick = std('#a26e52', { roughness: .95, map: repeatOf(T.stone, 1) });
  const pit = std('#6f5b46', { roughness: 1 });
  const wood = std('#8b6a48', { roughness: .8 });
  const A = 24, B = 20, Aa = 11.2, Ba = 7.2, N = 80;
  // ground with the arena cut out
  const gs = new THREE.Shape(); gs.moveTo(-1500, -1500); gs.lineTo(1500, -1500); gs.lineTo(1500, 1500); gs.lineTo(-1500, 1500); gs.closePath();
  const gh = new THREE.Path(); gh.absellipse(0, 0, Aa, Ba, 0, Math.PI * 2, true); gs.holes.push(gh);
  groundPlane(ctx, '#9a9286', { shape: gs, tex: 'fine' });
  const mg = new Merger();
  mg.add(flatShape(ellipseRingShape(A + 4, B + 4, Aa + .6, Ba + .6), .2, 0), travertine);

  // arc-length sampling of an ellipse
  function ringSamples(a, b, n) {
    const steps = 2000, cum = [0]; let prev = new THREE.Vector2(a, 0);
    for (let i = 1; i <= steps; i++) { const t = i / steps * Math.PI * 2, p = new THREE.Vector2(a * Math.cos(t), b * Math.sin(t)); cum.push(cum[i - 1] + p.distanceTo(prev)); prev = p; }
    const L = cum[steps], out = [];
    for (let k = 0; k < n; k++) {
      const target = (k + .5) / n * L; let i = 1; while (cum[i] < target) i++;
      const t = (i - 1 + (target - cum[i - 1]) / (cum[i] - cum[i - 1])) / steps * Math.PI * 2;
      const nx = b * Math.cos(t), nz = a * Math.sin(t);
      out.push({ t, x: a * Math.cos(t), z: b * Math.sin(t), ry: Math.atan2(nx, nz), w: L / n });
    }
    return out;
  }
  function bayGeo(w, h, d, ow, spring, withCol = true) {
    const parts = [normGeo(extrude(archPanelShape(w, h, ow, spring), d))];
    if (withCol) parts.push(normGeo(cyl(.13, .14, h - .25, 10).translate(-w / 2, (h - .25) / 2, d / 2)));
    parts.push(normGeo(box(w + .02, .22, d + .3).translate(0, h - .11, .1)));
    return mergeGeometries(parts);
  }
  function atticGeo(w, h, d, win) {
    const s = new THREE.Shape(); s.moveTo(-w / 2, 0); s.lineTo(w / 2, 0); s.lineTo(w / 2, h); s.lineTo(-w / 2, h); s.closePath();
    if (win) { const hp = new THREE.Path(); hp.moveTo(-.28, 1.0); hp.lineTo(.28, 1.0); hp.lineTo(.28, 1.75); hp.lineTo(-.28, 1.75); hp.closePath(); s.holes.push(hp); }
    const parts = [normGeo(extrude(s, d)), normGeo(box(.26, h - .3, .12).translate(-w / 2, (h - .3) / 2, d / 2 + .05)), normGeo(box(w + .02, .3, d + .35).translate(0, h - .15, .1))];
    return mergeGeometries(parts);
  }
  const tiers = [[0, 2.7], [2.7, 3.0], [5.7, 2.9]];
  const outer = ringSamples(A, B, N);
  // the standing north arc vs. the collapsed south side
  const standing = i => { const t = outer[i].t; const a = ((t - .7 * Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI); return a < 1.42 * Math.PI ? Math.min(a, 1.42 * Math.PI - a) : -1; };
  const tierCount = i => { const d = standing(i); if (d < 0) return 0; return Math.min(4, 1 + Math.floor(d / .05)); };
  const instanced = (geo, mat, list) => {
    const im = new THREE.InstancedMesh(geo, mat, list.length);
    list.forEach((m, k) => im.setMatrixAt(k, m)); im.castShadow = im.receiveShadow = true; ctx.scene.add(im);
  };
  const w0 = outer[0].w;
  const outerBay = tiers.map(([, h], k) => bayGeo(w0, h, 1.1, w0 * .6, h * (k ? .52 : .55)));
  const lists = tiers.map(() => []), atticA = [], atticB = [];
  outer.forEach((s, i) => {
    const tc = tierCount(i);
    for (let k = 0; k < Math.min(tc, 3); k++) lists[k].push(M(s.x, .2 + tiers[k][0], s.z, 0, s.ry, 0, s.w / w0, 1, 1));
    if (tc >= 4) (i % 2 ? atticA : atticB).push(M(s.x, .2 + 8.6, s.z, 0, s.ry, 0, s.w / w0, 1, 1));
  });
  tiers.forEach((t, k) => instanced(outerBay[k], k === 2 ? weathered : travertine, lists[k]));
  instanced(atticGeo(w0, 3.4, 1.1, true), weathered, atticA);
  instanced(atticGeo(w0, 3.4, 1.1, false), weathered, atticB);
  // inner ring, standing all the way round
  const inner = ringSamples(A - 2.6, B - 2.6, 72), wi = inner[0].w;
  const innerTiers = [[0, 2.7], [2.7, 3.0], [5.7, 2.4]];
  innerTiers.forEach(([y0, h], k) => instanced(bayGeo(wi, h, .9, wi * .58, h * .55, false), k ? brick : travertine, inner.map(s => M(s.x, .2 + y0, s.z, 0, s.ry, 0, s.w / wi, 1, 1))));
  // corridor vaults between the rings
  for (const y of [2.7, 5.7]) mg.add(flatShape(ellipseRingShape(A - .4, B - .4, A - 2.3, B - 2.3), .3, y), weathered);
  // cavea: radial walls stepping down to the arena
  const rnd = mulberry(5);
  const nr = 64;
  for (let k = 0; k < nr; k++) {
    const t = (k + .5) / nr * Math.PI * 2;
    const ox = (A - 3.1) * Math.cos(t), oz = (B - 3.1) * Math.sin(t), ix = (Aa + .7) * Math.cos(t), iz = (Ba + .7) * Math.sin(t);
    const L = Math.hypot(ox - ix, oz - iz), ang = Math.atan2(oz - iz, ox - ix);
    const hOut = 8.0 - rnd() * 2.2, hIn = 2.2;
    const s = new THREE.Shape(); s.moveTo(0, 0); s.lineTo(L, 0); s.lineTo(L, hOut); s.lineTo(L * .66, hOut - 1.2); s.lineTo(L * .66, (hOut + hIn) / 2); s.lineTo(L * .33, (hOut + hIn) / 2 - .6); s.lineTo(L * .33, hIn + .8); s.lineTo(0, hIn); s.closePath();
    mg.add(extrude(s, .45), k % 3 ? brick : weathered, M(ix, .2, iz, 0, -ang, 0));
  }
  for (const [a, b, h] of [[17.2, 13.6, 6.2], [14.2, 10.4, 4.2]]) mg.add(flatShape(ellipseRingShape(a + .25, b + .25, a - .25, b - .25), h, .2), brick);
  // arena: podium wall, hypogeum walls, partial wooden floor
  mg.add(flatShape(ellipseRingShape(Aa + .7, Ba + .7, Aa, Ba, 0), 4.2, -2.4), travertine);
  const pitShape = new THREE.Shape(); pitShape.absellipse(0, 0, Aa, Ba, 0, Math.PI * 2, false);
  mg.add(flatShape(pitShape, .1, -2.4), pit);
  for (let z = -6.3; z <= 6.3; z += 1.05) {
    if (Math.abs(z) < .6) continue;
    const L = 2 * Aa * Math.sqrt(Math.max(0, 1 - (z / Ba) ** 2)) - .4; if (L < 1) continue;
    mg.add(box(L, 2.3, .3), brick, M(0, -2.3 + 1.15, z));
  }
  for (let x = -9; x <= 9; x += 3) { const L = 2 * Ba * Math.sqrt(Math.max(0, 1 - (x / Aa) ** 2)) - .4; if (L > 1) mg.add(box(.3, 2.0, L), brick, M(x, -2.3 + 1.0, 0)); }
  const fl = new THREE.Shape(); const phi = Math.acos(4.2 / Aa);
  fl.moveTo(4.2, -Ba * Math.sin(phi)); fl.absellipse(0, 0, Aa, Ba, -phi, phi, false); fl.closePath();
  mg.add(flatShape(fl, .25, -.05), wood);
  // umbrella pines + visitors
  const trunkM = std('#5a4433'), pine = std('#2e4a26', { roughness: 1 });
  const canopy = new THREE.SphereGeometry(3.2, 12, 8);
  for (let i = 0; i < 26; i++) {
    const a = rnd() * Math.PI * 2, r = 36 + rnd() * 50, x = Math.cos(a) * r * 1.2, z = Math.sin(a) * r;
    if (z > 20 && Math.abs(x) < 20) continue;
    const h = 6 + rnd() * 3;
    mg.add(cyl(.22, .32, h, 6), trunkM, M(x, h / 2, z, (rnd() - .5) * .2, 0, (rnd() - .5) * .2));
    mg.add(canopy, pine, M(x, h + .6, z, 0, rnd() * 3, 0, 1 + rnd() * .4, .42, 1 + rnd() * .4));
  }
  const pm = peopleMats();
  people(mg, rnd, 26, r => { const a = r() * Math.PI * 2, rr = 1.12 + r() * .25; return [Math.cos(a) * A * rr, .2, Math.sin(a) * B * rr]; }, pm);
  mg.build(ctx.scene);
  cloudSprites(ctx, 14, 800, { y: [80, 140], scale: [70, 130], opacity: .6 });
  return { target: new V3(0, 4, 0), cam: new V3(4, 34, 56), from: new V3(-60, 90, 160), min: 22, max: 120, polar: 1.42 };
}

/* ---------- Chichén Itzá ---------- */

/* ---------- Machu Picchu ---------- */
function buildMachu(ctx) {
  setupEnv(ctx, {
    sky: { top: '#5b8fc8', mid: '#a5c3de', horizon: '#e3e9ec', bottom: '#b5c1c6', sunDir: [-.45, .62, .62], sunColor: '#fff6e6', glow: .8 },
    sunColor: '#fff6e8', sunIntensity: 3.0, fog: ['#d3dce1', 120, 900], shadow: 45, hemi: ['#dbe7f3', '#4b5a3c', .45],
    shadowTarget: [0, 0, -10],
  });
  const plateau = (x, z) => Math.pow(x / 15, 2) + Math.pow((z + 2) / 24, 2);
  function baseH(x, z) {
    let ridge = 0;
    if (z > 18) ridge = (z - 18) * .32;
    else if (z < -24) ridge = -16 * (1 - Math.exp(-(-24 - z) / 9));
    const lat = Math.max(Math.abs(x + .1 * z) - 11, 0);
    let h = ridge - 175 * (1 - Math.exp(-Math.pow(lat / 46, 1.35)));
    h += 52 * Math.exp(-((x + 2) ** 2 / (2 * 9 ** 2) + (z + 56) ** 2 / (2 * 10 ** 2)));
    h += 150 * Math.exp(-((x + 8) ** 2 + (z - 125) ** 2) / (2 * 30 ** 2));
    const rim = [[-230, -120, 190, 60], [-140, -260, 230, 70], [60, -300, 260, 80], [220, -160, 200, 60], [260, 90, 170, 55], [-250, 120, 160, 55], [120, 260, 150, 60], [-120, 280, 140, 50]];
    for (const [px, pz, ph, s] of rim) h = smax(h, -175 + ph * Math.exp(-Math.pow(Math.hypot(x - px, z - pz) / s, 1.3)) * (.75 + .5 * ridged(x * .02, z * .02, 4, 4)), 25);
    return h;
  }
  function H(x, z) {
    let h = baseH(x, z);
    const e = plateau(x, z);
    const det = (fbm(x * .06, z * .06, 5, 7) - .5) * 9;
    h += det * smooth(.9, 2.6, e) * (1 + Math.max(h, 0) / 22);
    // the citadel's levels and the agricultural terraces around it
    const tm = 1 - smooth(1.9, 2.5, e);
    if (tm > 0 && h > -34) {
      const step = e < 1 ? 1.25 : 1.5, q = h / step, f = q - Math.floor(q);
      const th = (Math.floor(q) + smooth(.82, 1, f)) * step;
      h = lerp(h, th, tm);
    }
    return h;
  }
  const g = heightfield({
    size: 800, seg: 300, map: u => 40 * u + 360 * u * u * u, fn: H,
    colorFn: (x, y, z, ny, c) => {
      const e = plateau(x, z), n = fbm(x * .08, z * .08, 3, 2);
      if (e < 2.5 && y > -36) {
        if (ny > .8) return mixC(c, C('#6f9a3c'), C('#8db251'), n);
        return mixC(c, C('#7e7a70'), C('#9b968a'), n);
      }
      if (ny < .22) return mixC(c, C('#5a574f'), C('#77736a'), n);
      if (y > 40) return mixC(c, C('#4a6a38'), C('#6c7a5c'), n);
      return mixC(c, C('#24481f'), C('#3d6a2c'), n * .8 + (1 - ny) * .3);
    },
  });
  const terr = new THREE.Mesh(g, std('#ffffff', { vertexColors: true, roughness: .96 }));
  terr.receiveShadow = true; terr.castShadow = true; ctx.scene.add(terr);
  // ruins
  const granite = std('#9c978b', { roughness: .95, map: repeatOf(sharedTextures().stone, 2) });
  const thatch = std('#8a6a3c', { roughness: 1 });
  const mg = new Merger(), rnd = mulberry(8);
  const placed = [];
  for (let tries = 0; placed.length < 46 && tries < 3000; tries++) {
    const x = (rnd() - .5) * 26, z = -24 + rnd() * 42;
    if (plateau(x, z) > .92) continue;
    if (Math.abs(x + 1) < 4.5 && Math.abs(z + 1) < 9) continue; // the main plaza stays open
    const w = 1.8 + rnd() * 2.2, d = 1.5 + rnd() * 1.6;
    if (placed.some(p => Math.abs(p[0] - x) < (p[2] + w) / 2 + .35 && Math.abs(p[1] - z) < (p[3] + d) / 2 + .35)) continue;
    placed.push([x, z, w, d]);
    const y = H(x, z) - .1, wh = 1.3 + rnd() * .5, th = .28;
    mg.add(box(w, wh, th), granite, M(x, y + wh / 2, z - d / 2));
    mg.add(box(w, wh, th), granite, M(x, y + wh / 2, z + d / 2));
    mg.add(box(th, wh, d), granite, M(x - w / 2, y + wh / 2, z));
    mg.add(box(th, wh, d), granite, M(x + w / 2, y + wh / 2, z));
    if (rnd() < .45) {
      const gable = new THREE.Shape([new THREE.Vector2(-d / 2, 0), new THREE.Vector2(d / 2, 0), new THREE.Vector2(0, d * .6)]);
      for (const sx of [-1, 1]) mg.add(extrude(gable, th), granite, M(x + sx * w / 2, y + wh, z, 0, Math.PI / 2, 0));
      if (rnd() < .6) {
        const roof = new THREE.Shape([new THREE.Vector2(-d / 2 - .25, -.05), new THREE.Vector2(d / 2 + .25, -.05), new THREE.Vector2(0, d * .62 + .1)]);
        mg.add(extrude(roof, w + .3), thatch, M(x, y + wh, z, 0, Math.PI / 2, 0));
      }
    }
  }
  const pm = peopleMats();
  people(mg, rnd, 16, r => { const x = (r() - .5) * 8, z = -6 + r() * 12; return [x, H(x, z), z]; }, pm);
  mg.build(ctx.scene);
  // llamas on the terraces
  const wool = std('#efe9dc'), llamaG = [box(.9, .5, .35), box(.18, .7, .18), box(.3, .22, .18)];
  for (let i = 0; i < 4; i++) {
    const x = 6 + rnd() * 6, z = 6 + rnd() * 10, y = H(x, z);
    const grp = new THREE.Group(); grp.position.set(x, y, z); grp.rotation.y = rnd() * 6;
    const b = new THREE.Mesh(llamaG[0], wool); b.position.y = .75; grp.add(b);
    const n = new THREE.Mesh(llamaG[1], wool); n.position.set(.38, 1.2, 0); grp.add(n);
    const hd = new THREE.Mesh(llamaG[2], wool); hd.position.set(.5, 1.55, 0); grp.add(hd);
    for (const [lx, lz] of [[.3, .12], [.3, -.12], [-.3, .12], [-.3, -.12]]) { const l = new THREE.Mesh(box(.09, .55, .09), wool); l.position.set(lx, .27, lz); grp.add(l); }
    grp.traverse(o => { o.castShadow = true; }); ctx.scene.add(grp);
  }
  cloudSprites(ctx, 12, 600, { y: [-90, -40], scale: [40, 80], opacity: .5, seed: 12 });
  cloudSprites(ctx, 8, 300, { y: [40, 70], scale: [40, 70], opacity: .55, seed: 13 });
  return { target: new V3(0, 8, -18), cam: new V3(16, 36, 82), from: new V3(-40, 80, 200), min: 22, max: 160, polar: 1.5 };
}

/* ---------- Great Wall ---------- */
function buildGreatWall(ctx) {
  setupEnv(ctx, {
    sky: { top: '#4a82c4', mid: '#97b9db', horizon: '#e4e8e6', bottom: '#9eaab0', sunDir: [.6, .48, .5], sunColor: '#ffe9c8' },
    sunColor: '#ffe9cc', sunIntensity: 3.2, fog: ['#c6d0d6', 50, 420], shadow: 60, hemi: ['#d8e6f4', '#5a5338', .45],
  });
  const ctrl = [[-180, -40, 4], [-130, -18, 16], [-95, 6, 30], [-62, -4, 22], [-34, -22, 32], [-8, -8, 26], [16, 8, 34], [40, -2, 24], [66, -26, 36], [96, -30, 26], [130, -6, 34], [175, 14, 18]];
  const curve = new THREE.CatmullRomCurve3(ctrl.map(([x, z, y]) => new V3(x, y, z)), false, 'centripetal');
  const nS = 900, S = curve.getSpacedPoints(nS);
  const coarse = S.filter((_, i) => i % 4 === 0);
  function H(x, z) {
    let base = 2 + 34 * ridged(x * .009, z * .009, 5, 3) + (fbm(x * .04, z * .04, 4, 5) - .5) * 10;
    let best = 1e9, by = 0;
    for (const p of coarse) { const d = (p.x - x) ** 2 + (p.z - z) ** 2; if (d < best) { best = d; by = p.y; } }
    const d = Math.sqrt(best);
    const ridge = by - 1.2 - Math.pow(d, 1.18) * .85 + (fbm(x * .1, z * .1, 2, 9) - .5) * 2 * smooth(3, 12, d);
    return smax(base, ridge, 5);
  }
  const autumn = ['#3e5c2a', '#56692e', '#7a7232', '#a05a2a', '#8a3d24', '#bb8a38'].map(C);
  const g = heightfield({
    size: 520, seg: 260, fn: H,
    colorFn: (x, y, z, ny, c) => {
      const n = fbm(x * .05, z * .05, 4, 2), m = fbm(x * .015, z * .015, 3, 6);
      if (ny < .62) return mixC(c, C('#6e675d'), C('#8a8174'), n);
      const i = Math.floor(clamp(m * 1.7 - .25, 0, .999) * 6);
      return c.copy(autumn[i]).lerp(autumn[(i + 1) % 6], n * .5).multiplyScalar(.8 + n * .35);
    },
  });
  const terr = new THREE.Mesh(g, std('#ffffff', { vertexColors: true, roughness: .97 }));
  terr.receiveShadow = true; ctx.scene.add(terr);
  const far = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000).rotateX(-Math.PI / 2), std('#5f6e5a', { roughness: 1 }));
  far.position.y = 0; ctx.scene.add(far);
  // the wall
  const T = sharedTextures();
  const brick = std('#9b9180', { roughness: .95, map: repeatOf(T.stone, 1) });
  const walk = std('#b4a991', { roughness: .95 });
  const dark = std('#1e1b18', { roughness: 1 });
  const roof = std('#4f4339', { roughness: .8 });
  const mg = new Merger();
  const body = box(1, 1, 1);
  for (let i = 0; i < nS; i++) {
    const a = S[i], b = S[i + 1] || S[i];
    const dx = b.x - a.x, dz = b.z - a.z, L = Math.hypot(dx, dz) + .12, ry = Math.atan2(dx, dz);
    const top = (a.y + b.y) / 2, mx = (a.x + b.x) / 2, mz = (a.z + b.z) / 2;
    const bottom = Math.min(H(mx, mz), top - 1) - 3;
    const R = M(mx, 0, mz, 0, ry, 0);
    mg.add(body, brick, R.clone().multiply(M(0, (top + bottom) / 2, 0, 0, 0, 0, 2.0, top - bottom, L)));
    mg.add(body, walk, R.clone().multiply(M(0, top + .02, 0, 0, 0, 0, 1.6, .06, L)));
    mg.add(body, brick, R.clone().multiply(M(-.9, top + .3, 0, 0, 0, 0, .22, .6, L)));
    mg.add(body, brick, R.clone().multiply(M(.9, top + .22, 0, 0, 0, 0, .22, .45, L)));
    if (i % 2 === 0) mg.add(body, brick, R.clone().multiply(M(-.9, top + .78, 0, 0, 0, 0, .24, .38, L * .5)));
  }
  const rnd = mulberry(4);
  const towers = [];
  for (let i = 30; i < nS - 10; i += 42 + Math.floor(rnd() * 22)) towers.push(i);
  for (const i of towers) {
    const p = S[i], q = S[i + 1], ry = Math.atan2(q.x - p.x, q.z - p.z), top = p.y;
    const R = M(p.x, 0, p.z, 0, ry, 0), th = 3.4, w = 3.6;
    const bottom = Math.min(H(p.x, p.z), top - 1) - 3;
    mg.add(body, brick, R.clone().multiply(M(0, (top + th + bottom) / 2, 0, 0, 0, 0, w, top + th - bottom, w)));
    for (let s = 0; s < 4; s++) {

    const c = temps[Math.floor(rnd() * 5)]; col.set([c.r, c.g, c.b], i * 3);

  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('size', new THREE.BufferAttribute(size, 1));
  g.setAttribute('phase', new THREE.BufferAttribute(ph, 1)); g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,

    vertexShader: `attribute float size, phase; attribute vec3 color; uniform float uTime, uPR; varying vec3 vC; varying float vA;
      void main(){ vec4 mv = modelViewMatrix * vec4(position,1.); gl_Position = projectionMatrix * mv; gl_PointSize = size * uPR; vA = .65 + .35 * sin(uTime * 1.3 + phase); vC = color; }`,

function ll2v(lat, lon, r = 1) {

}
// markers
const markers = [];
const hitTargets = [];
WONDERS.forEach((w, i) => {
  const col = C(w.her ? '#ff8db3' : '#ffcf7a');
  const p = ll2v(w.lat, w.lon, 1.003), n = p.clone().normalize();
  const grp = new THREE.Group(); grp.position.copy(p); grp.quaternion.setFromUnitVectors(new V3(0, 0, 1), n); gScene.add(grp);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: col, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  glow.scale.setScalar(w.her ? .085 : .065); grp.add(glow);
  const core = new THREE.Mesh(new THREE.CircleGeometry(.0065, 20), new THREE.MeshBasicMaterial({ color: col.clone().lerp(C('#ffffff'), .6), toneMapped: false }));
  core.position.z = .001; grp.add(core);
  const rings = [0, .5].map(off => {
    const r = new THREE.Mesh(new THREE.RingGeometry(.013, .0165, 48), new THREE.MeshBasicMaterial({ color: col, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, toneMapped: false }));
    r.userData.off = off; grp.add(r); return r;
  });
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(.0012, .0012, .07, 6).rotateX(Math.PI / 2).translate(0, 0, .035), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: .7, blending: THREE.AdditiveBlending, depthWrite: false }));
  grp.add(beam);
  const hit = new THREE.Mesh(new THREE.SphereGeometry(.05, 8, 6), new THREE.MeshBasicMaterial({ visible: false }));
  hit.userData.i = i; grp.add(hit); hitTargets.push(hit);
  markers.push({ grp, glow, rings, pos: p, n, w });
});
// light trails from the seven to the eighth
const arcMats = [];
{
  const herV = ll2v(HER.lat, HER.lon).normalize();
  WONDERS.forEach((w, i) => {
    if (w.her) return;
    const a = ll2v(w.lat, w.lon).normalize(), om = a.angleTo(herV), n = 120;
    const pos = new Float32Array(n * 3), tt = new Float32Array(n);
    for (let k = 0; k < n; k++) {
      const t = k / (n - 1);
      const p = a.clone().multiplyScalar(Math.sin((1 - t) * om)).addScaledVector(herV, Math.sin(t * om)).divideScalar(Math.sin(om));
      p.multiplyScalar(1.004 + Math.sin(Math.PI * t) * om * .16);
      pos.set([p.x, p.y, p.z], k * 3); tt[k] = t;
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('t', new THREE.BufferAttribute(tt, 1));
    const m = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: { uTime: { value: 0 }, uOff: { value: i / 7 }, cA: { value: C('#ffcf7a') }, cB: { value: C('#ff8db3') } },
      vertexShader: `attribute float t; varying float vT; void main(){ vT = t; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
      fragmentShader: `uniform float uTime, uOff; uniform vec3 cA, cB; varying float vT;
        void main(){ float head = fract(uTime * .16 + uOff) * 1.3; float d = vT - head; float trail = smoothstep(-.3, 0., d) * (1. - step(0., d));
          gl_FragColor = vec4(mix(cA, cB, vT) * (.1 + trail * 1.1), 1.); }`,

}

/* ---------- DOM: labels, rail ---------- */
const labelsEl = $('labels'), rail = $('rail');

});
const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

  a.innerHTML = `<div class="num">Wonder ${pad(i + 1)} / 08${w.her ? ' · the newest' : ''}</div>

});
let focusIdx = -1, railTimer = 0, userRailScroll = false;
rail.addEventListener('pointerdown', () => { userRailScroll = true; });
rail.addEventListener('touchstart', () => { userRailScroll = true; }, { passive: true });
rail.addEventListener('scroll', () => {
  clearTimeout(railTimer);
  railTimer = setTimeout(() => {
    const mid = rail.scrollLeft + rail.clientWidth / 2; let best = 0, bd = 1e9;
    cardEls.forEach((c, i) => { const d = Math.abs(c.offsetLeft + c.offsetWidth / 2 - mid); if (d < bd) { bd = d; best = i; } });

}, { passive: true });
function centerCard(i, smoothScroll) {
  const c = cardEls[i]; rail.scrollTo({ left: c.offsetLeft - (rail.clientWidth - c.offsetWidth) / 2, behavior: smoothScroll ? 'smooth' : 'auto' });
}
function setFocus(i, fly) {
  focusIdx = i;
  cardEls.forEach((c, k) => c.classList.toggle('on', k === i));
  labelEls.forEach((l, k) => l.classList.toggle('on', k === i));
  if (fly && mode === 'globe' && !busy) flyTo(markers[i].n, clamp(gCam.position.length(), 3.2, GLOBE_DIST), 1.4);
}

/* ---------- globe camera flights ---------- */
let flight = null;
function flyTo(dir, dist, dur, onDone) {
  const d0 = gCam.position.clone().normalize(), d1 = dir.clone().normalize();
  const ang = d0.angleTo(d1);
  flight = { t: 0, dur, d0, q: new THREE.Quaternion().setFromUnitVectors(d0, d1), r0: gCam.position.length(), r1: dist, bump: Math.min(ang, 2) * .35, onDone };

}
const _qi = new THREE.Quaternion(), _qt = new THREE.Quaternion();

}

/* ---------- taps on the globe ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null, idleTimer = 0;
canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; if (mode === 'globe') { gControls.autoRotate = false; clearTimeout(idleTimer); } else if (cur) { wControls.autoRotate = false; clearTimeout(idleTimer); hideHint(); } });
canvas.addEventListener('pointerup', e => {
  const resume = () => { idleTimer = setTimeout(() => { if (mode === 'globe' && !busy) gControls.autoRotate = true; else if (mode === 'wonder') wControls.autoRotate = true; }, 7000); };
  resume();
  if (!down || mode !== 'globe' || busy) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t; down = null;
  if (moved > 8 || dt > 450) return;
  const r = canvas.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, gCam);
  const hits = ray.intersectObjects([earth, ...hitTargets], false);
  const h = hits.find(x => x.object.userData.i !== undefined);
  if (h && (hits[0].object !== earth || hits[0].distance > h.distance - .02)) enterWonder(h.object.userData.i);
});

/* =====================================================================
   WONDER VIEW
   ===================================================================== */
const wCam = new THREE.PerspectiveCamera(50, 1, .1, 4000);
const wControls = new OrbitControls(wCam, canvas);
Object.assign(wControls, { enabled: false, enableDamping: true, dampingFactor: .07, enablePan: false, rotateSpeed: .55, zoomSpeed: .8, autoRotateSpeed: .55 });
let mode = 'globe', busy = false, cur = null, curIdx = -1, intro = null;

function disposeScene(c) {
  if (!c) return;
  c.scene.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    const ms = Array.isArray(o.material) ? o.material : o.material ? [o.material] : [];
    ms.forEach(m => { for (const k of ['map', 'alphaMap']) if (m[k] && m[k] !== glowTex && m[k] !== cloudTex && !Object.values(TEX).some(t => t === m[k])) m[k].dispose(); m.dispose(); });
  });
  c.ctx.disposables.forEach(d => d.dispose && d.dispose());
}
function buildWonder(i) {
  disposeScene(cur); cur = null;
  const w = WONDERS[i];
  const scene = new THREE.Scene();
  const ctx = { scene, disposables: [], updaters: [] };
  const def = BUILDERS[w.id](ctx);
  scene.traverse(o => { if (o.isMesh && o.material && o.material.isMeshStandardMaterial) o.material.envMapIntensity = .9; });
  cur = { scene, ctx, def }; curIdx = i;
  wControls.target.copy(def.target);

  wControls.maxPolarAngle = def.polar; wControls.minPolarAngle = .15;
  wControls.minAzimuthAngle = def.azimuth ? def.azimuth[0] : -Infinity;
  wControls.maxAzimuthAngle = def.azimuth ? def.azimuth[1] : Infinity;
  wCam.position.copy(def.from); wCam.lookAt(def.target);
  intro = { t: 0, dur: 2.6, from: def.from.clone(), to: def.cam.clone() };
  wControls.enabled = false; wControls.autoRotate = false;
  renderer.compile(scene, wCam);
}
function stepIntro(dt) {

  intro.t += dt; const k = clamp(intro.t / intro.dur), e = easeOut(k);

const fade = $('fade');
const wait = ms => new Promise(r => setTimeout(r, ms));
async function fadeTo(on, dark) { fade.classList.toggle('dark', !!dark); fade.classList.toggle('on', on); await wait(520); }

async function enterWonder(i) {
  if (busy || mode !== 'globe') return;
  busy = true; setFocus(i, false);
  document.body.classList.add('diving');
  await new Promise(res => flyTo(markers[i].n, 1.16, 1.7, res));
  await fadeTo(true, false);
  await showWonder(i);
  await fadeTo(false);
  busy = false;
}
async function showWonder(i) {
  if (WONDERS[i].her && !herPhotoImage) await loadHerPhoto();
  buildWonder(i);
  mode = 'wonder';
  document.body.classList.remove('diving'); document.body.classList.add('inwonder');
  $('wui').hidden = false; fillSheet(i);
  sheet.classList.remove('open');
  const h = $('ohint'); h.classList.remove('gone'); clearTimeout(h._t); h._t = setTimeout(hideHint, 4200);
  resize();
}
function hideHint() { $('ohint').classList.add('gone'); }
async function switchWonder(i) {

  await fadeTo(true, true);
  await showWonder(i);
  await fadeTo(false, true);
  busy = false;
}
async function backToGlobe() {
  if (busy) return; busy = true;
  await fadeTo(true, true);
  disposeScene(cur); cur = null; intro = null; wControls.enabled = false;
  mode = 'globe'; $('wui').hidden = true;
  document.body.classList.remove('inwonder'); document.body.classList.add('diving');
  const m = markers[curIdx];
  gCam.position.copy(m.n).multiplyScalar(1.25); gCam.lookAt(0, 0, 0);
  resize();
  fadeTo(false, true);
  await new Promise(res => flyTo(m.n, GLOBE_DIST, 1.9, res));
  document.body.classList.remove('diving');
  centerCard(curIdx, false);
  userRailScroll = false; setFocus(curIdx, false);

}
$('back').addEventListener('click', backToGlobe);
$('prev').addEventListener('click', () => switchWonder((curIdx + 7) % 8));
$('next').addEventListener('click', () => switchWonder((curIdx + 1) % 8));

/* ---------- bottom sheet ---------- */
const sheet = $('sheet');
function fillSheet(i) {
  const w = WONDERS[i];
  sheet.classList.toggle('her', !!w.her);
  $('crumb').innerHTML = `Wonder ${pad(i + 1)} / 08<span>${w.her ? HER.place : `${w.place}, ${w.country}`}</span>`;
  $('sEyebrow').textContent = w.her ? `Wonder 08 / 08 · ${HER.subtitle}` : `Wonder ${pad(i + 1)} / 08 · ${w.country}`;
  $('sName').textContent = w.name;
  $('sCoords').textContent = `${fmtLat(w.lat)}  ${fmtLon(w.lon)}`;
  $('sChips').innerHTML = w.chips.map(c => `<span class="chip">${c}</span>`).join('');
  $('sBlurb').textContent = w.blurb;
  $('sFacts').innerHTML = w.facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');
  $('sFactTitle').textContent = w.factTitle || 'Did you know';
  $('sFact').textContent = w.fact;
  const av = $('sAvatar'), pr = $('sPortrait');
  av.hidden = pr.hidden = !w.her; av.innerHTML = pr.innerHTML = '';
  if (w.her && herPhotoImage) {
    const mk = () => { if (herPhotoImage instanceof HTMLImageElement) { const im = new Image(); im.src = herPhotoImage.src; im.alt = 'Her photo'; return im; } const c = herPlaceholder(); c.setAttribute('role', 'img'); c.setAttribute('aria-label', 'Placeholder for her photo'); return c; };
    av.appendChild(mk()); pr.appendChild(mk());
  }
  const p = WONDERS[(i + 7) % 8], n = WONDERS[(i + 1) % 8];
  $('prevName').textContent = p.her ? 'The 8th Wonder' : p.name;
  $('nextName').textContent = n.her ? 'The 8th Wonder' : n.name;
  $('sbody').scrollTop = 0;
}
{
  let sy = 0, st = 0, dragging = false, moved = false;
  const peekPx = () => sheet.offsetHeight - parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--peek'));
  const startDrag = e => { dragging = true; moved = false; sy = e.clientY; st = sheet.classList.contains('open') ? 0 : peekPx(); sheet.classList.add('dragging'); };
  const onMove = e => {
    if (!dragging) return; const dy = e.clientY - sy; if (Math.abs(dy) > 6) moved = true;
    sheet.style.transform = `translateY(${clamp(st + dy, 0, peekPx())}px)`;
  };
  const endDrag = e => {
    if (!dragging) return; dragging = false; sheet.classList.remove('dragging'); sheet.style.transform = '';
    const dy = e.clientY - sy;
    if (!moved) sheet.classList.toggle('open');
    else if (dy < -40) sheet.classList.add('open'); else if (dy > 40) sheet.classList.remove('open');
  };
  for (const el of [$('grab'), $('shead')]) el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); startDrag(e); });
  window.addEventListener('pointermove', onMove); window.addEventListener('pointerup', endDrag); window.addEventListener('pointercancel', endDrag);
}

/* =====================================================================
   resize + loop
   ===================================================================== */
function resize() {
  W = app.clientWidth; H = app.clientHeight;
  renderer.setSize(W, H, false);
  for (const [cam, shift] of [[gCam, .05], [wCam, .1]]) { cam.aspect = W / H; cam.setViewOffset(W, H, 0, H * shift, W, H); cam.updateProjectionMatrix(); }
  const pr = renderer.getPixelRatio();
  gScene.userData.stars.userData.mat.uniforms.uPR.value = pr;
}
window.addEventListener('resize', resize);
resize();

const clock = new THREE.Clock();
const _v = new V3(), _camDir = new V3(), _wq = new THREE.Quaternion();
function updateGlobe(t, dt) {
  stepFlight(dt);
  if (!flight) gControls.update();
  const dist = gCam.position.length();
  gControls.rotateSpeed = clamp((dist - 1) * .2, .06, .6);
  clouds.rotation.y += dt * .0045;
  sunLight.position.copy(SUN_VIEW).applyQuaternion(gCam.quaternion).multiplyScalar(10);
  gScene.userData.stars.userData.mat.uniforms.uTime.value = t;
  arcMats.forEach(m => { m.uniforms.uTime.value = t; });
  _camDir.copy(gCam.position).normalize();
  markers.forEach((m, i) => {
    m.rings.forEach(r => { const k = ((t * .55 + r.userData.off) % 1); r.scale.setScalar(1 + k * 2.6); r.material.opacity = (1 - k) * .9; });
    m.glow.material.opacity = .75 + Math.sin(t * 2.2 + i) * .25;
    const facing = m.n.dot(_camDir);
    const el = labelEls[i];
    const vis = smooth(.12, .32, facing);
    if (vis <= 0.01 || document.body.classList.contains('diving')) { el.style.opacity = 0; el.style.pointerEvents = 'none'; return; }
    _v.copy(m.pos).project(gCam);
    const x = (_v.x * .5 + .5) * W, y = (-_v.y * .5 + .5) * H;
    el.style.opacity = vis; el.style.pointerEvents = vis > .5 ? 'auto' : 'none';
    const off = m.w.labelBelow ? 14 : -(el.offsetHeight + 12);
    el.style.transform = `translate(${clamp(x - el.offsetWidth / 2, 8, W - el.offsetWidth - 8)}px, ${y + off}px)`;
  });
}
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  if (mode === 'globe') { updateGlobe(t, dt); renderer.render(gScene, gCam); }
  else if (cur) {
    if (intro) stepIntro(dt); else wControls.update();
    cur.ctx.updaters.forEach(f => f(t, dt));
    renderer.render(cur.scene, wCam);
  }
}

/* ---------- boot ---------- */
manager.onLoad = async () => {
  $('loadTxt').textContent = 'Ready';
  try { await document.fonts.ready; } catch (e) { /* fonts optional */ }
  loadHerPhoto();
  // allow deep links like #taj-mahal
  const deep = WONDERS.findIndex(w => '#' + w.id === location.hash);
  $('loader').classList.add('done');
  setFocus(6, false); centerCard(6, false);
  gCam.position.copy(markers[6].n).applyAxisAngle(new V3(0, 1, 0), 1.1).multiplyScalar(9);
  gCam.position.y += 1.2; gCam.lookAt(0, 0, 0);
  if (deep >= 0) { await loadHerPhoto(); busy = true; await showWonder(deep); busy = false; return; }
  // the opening flight can be interrupted: a tap on any wonder replaces it
  flyTo(markers[6].n.clone().lerp(markers[7].n, .5), GLOBE_DIST, 2.8, () => { gControls.autoRotate = true; });
};
manager.onError = url => { $('loadTxt').textContent = 'Could not load ' + url.split('/').pop(); };
loop();
