<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cogentiq — Claims Review Assistant (loading state)</title>
<meta name="description" content="The reasoning trace assembling itself: context groups resolve out of blur, citations and skill chips land in place, then the answer settles." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  /* ══════════════════════════════════════════════════════════════
     DESIGN TOKENS — Cogentiq Builder, mapped 1:1 from the Figma
     variables on node 2246:140053 ("All opened").
     ══════════════════════════════════════════════════════════════ */
  :root{
    /* Text */
    --text-primary:#ffffff;
    --text-secondary:#bdbdbd;
    --text-tertiary:#8c8c8c;
    --text-button-tonal-2:#bdbdbd;
    --text-blue:#44aaf3;
    --text-orange:#dd7c0e;
    --text-yellow:#ffa000;
    --text-red:#dc3412;
    --text-purple:#bb7fff;
    --grey-500:#9e9e9e;

    /* Backgrounds */
    --bg-app:#121212;
    --bg-page-2:#212121;
    --bg-page-3:#1b1b1b;
    --bg-card-1:#323232;
    --bg-card-2:#212121;
    --bg-card-5:#1b1b1b;
    --bg-type-default:#323232;
    --bg-type-hover:#424242;
    --bg-icon-orange:rgba(221,124,14,.1);
    --bg-disabled-tonal-1:#093077;

    /* Strokes */
    --line-1:#424242;
    --line-2:#545454;
    --line-3:#323232;
    --stroke-card:#424242;
    --stroke-type:#424242;
    --canvas-dots:#323232;

    /* Accents */
    --blue-500:#0d99ff;
    --purple-500:#9747ff;
    --cyan-500:#00a2c2;
    --thinking-tile:#c8e6c9;

    /* Type — Geist, letter-spacing is -4% on body, -2% on caption */
    --sans:'Geist', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --body2:500 16px/24px var(--sans);      /* Body1  16/24  -0.64px */
    --body3:400 14px/20px var(--sans);      /* Body2  14/20  -0.56px */
    --cap1:400 12px/16px var(--sans);       /* Caption1 12/16 -0.24px */
    --cap2:500 10px/14px var(--sans);       /* Caption2 10/14 -0.2px  */
    --ease:cubic-bezier(.23,1,.32,1);
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg-app);
    color:var(--text-primary);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  svg{display:block;flex:none}
  :focus-visible{outline:2px solid var(--blue-500);outline-offset:2px;border-radius:6px}

  /* ══════════════════════════════════════════════════════════════
     APP SHELL
     ══════════════════════════════════════════════════════════════ */
  .app{display:flex;height:100%}

  /* ---------- left rail (Chat panel, 68px) ---------- */
  .rail{width:68px;flex:none;background:var(--bg-app);
    display:flex;flex-direction:column;align-items:center;gap:16px;padding:8px 16px}
  .rail-logo{width:32px;height:32px;border-radius:100px;background:var(--bg-page-2);
    display:grid;place-items:center;margin-top:8px}
  .rail-btn{width:36px;display:flex;align-items:center;justify-content:center;
    border-radius:8px;padding:8px;color:var(--text-secondary);
    transition:background .15s ease,color .15s ease}
  .rail-btn.is-active{background:var(--bg-page-2);border:1px solid var(--stroke-type);
    box-shadow:0 1px 1px rgba(33,33,33,.12),0 1px 1px rgba(33,33,33,.08)}
  .rail-btn:hover{background:var(--bg-card-1);color:var(--text-primary)}

  /* ---------- panel ---------- */
  .panel{flex:1;min-width:0;display:flex;flex-direction:column;
    background:var(--bg-page-2);border-radius:12px 12px 0 0;overflow:hidden}

  .topbar{flex:none;height:48px;display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px 12px 12px;border-bottom:2px solid var(--line-1)}
  .topbar-left{display:flex;align-items:center;gap:8px}
  .back{display:flex;align-items:center;gap:2px;padding:4px;border-radius:6px;
    color:var(--text-button-tonal-2);font:500 12px/16px var(--sans);letter-spacing:-.24px;
    transition:background .15s ease}
  .back:hover{background:var(--bg-card-1)}
  .doc-title{font:var(--body2);letter-spacing:-.64px;color:var(--text-primary)}
  .assets{display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:8px;
    background:var(--bg-card-1);color:var(--text-button-tonal-2);
    font:500 14px/20px var(--sans);letter-spacing:-.56px;transition:background .15s ease}
  .assets:hover{background:var(--bg-type-hover)}

  /* ---------- scrolling thread ---------- */
  .scroller{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;
    scrollbar-color:var(--line-1) transparent}
  .scroller::-webkit-scrollbar{width:8px}
  .scroller::-webkit-scrollbar-thumb{background:var(--line-1);border-radius:4px}
  .thread{width:780px;max-width:100%;margin:0 auto;padding:24px 16px 8px;
    display:flex;flex-direction:column;gap:16px}

  .bubble{align-self:flex-end;max-width:530px;background:var(--bg-disabled-tonal-1);
    border-radius:12px;padding:12px 16px;font:400 16px/24px var(--sans);
    letter-spacing:-.64px;color:var(--text-primary)}

  /* ---------- one trace section: icon rail + content ---------- */
  .sec{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start}
  .sec-rail{display:flex;flex-direction:column;align-items:center;align-self:stretch}
  .sec-ico{width:24px;height:24px;display:grid;place-items:center;color:var(--text-secondary)}
  .sec-ico.tile{background:var(--thinking-tile);border-radius:6px}
  .sec-connector{flex:1;width:1px;min-height:8px;margin:4px 0 0;
    background:var(--line-3);transform-origin:top;animation:grow-down 500ms var(--ease) both}
  .sec-body{display:flex;flex-direction:column;gap:12px;min-width:0}
  .sec-head{display:flex;align-items:center;gap:8px}
  .sec-title{font:var(--body2);letter-spacing:-.64px;color:var(--text-primary)}
  .sec-title.blue{color:var(--text-blue)}
  .sec-chev{color:var(--text-tertiary)}

  /* ---------- context group ---------- */
  .grp{display:flex;flex-direction:column;gap:8px}
  .grp-head{display:flex;align-items:center;gap:8px;color:var(--text-secondary)}
  .grp-label{font:500 14px/20px var(--sans);letter-spacing:-.56px;color:var(--text-primary)}
  .grp-list{display:flex;flex-direction:column;gap:4px;padding-inline:24px}

  .row{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;
    background:var(--bg-card-5);border:1px solid var(--line-3)}
  .row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .row-top{display:flex;align-items:center;gap:8px}
  .row-name{display:flex;align-items:center;gap:4px;
    font:500 12px/16px var(--sans);letter-spacing:-.24px;color:var(--text-primary)}
  .row-name .i{color:var(--text-secondary)}
  .row-desc{font:var(--cap1);letter-spacing:-.24px;color:var(--text-secondary)}
  .row-chev{color:var(--text-tertiary)}
  .row-tag{margin-left:auto;font:var(--cap1);letter-spacing:-.24px;color:var(--text-tertiary)}
  .badge{padding:1px 6px;border-radius:4px;background:var(--bg-icon-orange);
    color:var(--text-orange);font:var(--cap2);letter-spacing:-.2px;white-space:nowrap}

  /* ---------- ontology graph ---------- */
  .graph{position:relative;height:184px;margin-top:4px;border-radius:8px;
    background:var(--bg-card-2);overflow:hidden}
  .graph-expand{position:absolute;top:8px;right:8px;z-index:2;padding:4px;border-radius:8px;
    background:var(--bg-page-3);color:var(--text-secondary);transition:background .15s ease}
  .graph-expand:hover{background:var(--bg-card-1)}
  /* crunched preview: the full graph app, scaled to half and made inert */
  .graph-preview{position:absolute;top:0;left:0;width:200%;height:200%;
    transform:scale(.5);transform-origin:0 0;border:0;display:block;pointer-events:none}

  /* full-view overlay for the graph app */
  .graph-overlay{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);
    opacity:0;pointer-events:none;transition:opacity .25s ease}
  .graph-overlay.open{opacity:1;pointer-events:auto}
  .graph-overlay .sheet{position:absolute;inset:52px 3% 3%;border-radius:16px;overflow:hidden;
    background:#121212;border:1px solid var(--line-1);box-shadow:0 24px 80px rgba(0,0,0,.6)}
  .graph-overlay iframe{width:100%;height:100%;border:0;display:block}
  .graph-close{position:absolute;top:10px;right:3%;z-index:2;display:grid;place-items:center;
    width:32px;height:32px;border-radius:8px;background:var(--bg-card-1);
    border:1px solid var(--line-1);color:var(--text-secondary);
    transition:background .15s ease,color .15s ease}
  .graph-close:hover{background:var(--bg-type-hover);color:var(--text-primary)}

  /* ---------- steps ---------- */
  .steps{display:flex;flex-direction:column;gap:6px}
  .step{display:flex;align-items:center;gap:6px;
    font:var(--body3);letter-spacing:-.56px;color:var(--text-secondary)}
  .step .i{color:var(--text-secondary)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{display:flex;align-items:center;gap:4px;padding:2px 6px;border-radius:8px;
    background:var(--bg-type-hover);color:var(--text-secondary);
    font:var(--body3);letter-spacing:-.56px}
  .step-done{font:var(--body3);letter-spacing:-.56px;color:var(--text-primary)}
  .pill{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:8px;
    background:var(--bg-page-3);color:var(--text-secondary);
    font:var(--body3);letter-spacing:-.56px}

  /* ---------- summary ---------- */
  .sum-body{font:var(--body3);letter-spacing:-.56px;color:var(--text-secondary);max-width:688px}
  .sum-meta{display:flex;align-items:center;gap:8px;
    font:var(--cap1);letter-spacing:-.24px;color:var(--text-tertiary)}
  .rule{height:1px;background:var(--line-3);margin:4px 0}

  /* ---------- code block ---------- */
  .codeblock{position:relative;border-radius:8px;padding:12px;
    background:var(--bg-type-default);border:1px solid var(--stroke-type);
    font:400 14px/20px var(--mono);color:var(--text-primary);
    max-height:308px;overflow:hidden}
  .codeblock .kw{color:var(--text-red)}
  .codeblock .num{color:var(--text-yellow)}
  .codeblock .str{color:var(--text-blue)}
  .codeblock .op{color:var(--text-purple)}
  .codeblock .cmt{color:var(--text-tertiary)}
  .code-line{white-space:pre;min-height:20px}

  /* ---------- composer ---------- */
  .composer-wrap{flex:none;padding:0 16px 8px;display:flex;flex-direction:column;
    align-items:center;gap:8px}
  .composer{width:780px;max-width:100%;border-radius:24px;padding:12px;
    background:var(--bg-type-default);border-top:1px solid var(--blue-500);
    box-shadow:0 1px 2px 1px rgba(33,33,33,.12);
    display:flex;flex-direction:column;gap:16px}
  .composer-input{display:flex;align-items:center;gap:2px;padding:4px 8px;
    font:400 16px/24px var(--sans);letter-spacing:-.64px;color:var(--grey-500)}
  .caret-bar{width:1px;height:21px;background:var(--grey-500);
    animation:blink 1.1s steps(1,end) infinite}
  .composer-row{display:flex;align-items:center;justify-content:space-between}
  .composer-left,.composer-right{display:flex;align-items:center;gap:8px}
  .icon-btn{padding:8px;border-radius:100px;color:var(--text-secondary);
    transition:background .15s ease,color .15s ease}
  .icon-btn:hover{background:var(--bg-type-hover);color:var(--text-primary)}
  .badge-btn{display:flex;align-items:center;gap:4px;padding:8px 12px;border-radius:80px;
    background:var(--bg-card-1);color:var(--text-button-tonal-2);
    font:500 14px/20px var(--sans);letter-spacing:-.56px;transition:background .15s ease}
  .badge-btn:hover{background:var(--bg-type-hover)}
  .stop-btn{padding:8px;border-radius:100px;background:var(--blue-500);
    display:grid;place-items:center}
  .stop-btn i{display:block;width:12px;height:12px;border-radius:2px;background:#fff}

  .footer{display:flex;align-items:center;justify-content:center;gap:24px;
    width:780px;max-width:100%;padding-bottom:4px;
    font:var(--cap1);letter-spacing:-.24px;color:var(--text-tertiary)}
  .footer .elapsed{display:inline-flex;align-items:center;gap:4px}
  .footer a{color:var(--text-secondary);text-decoration:underline;text-underline-offset:2px}

  /* ---------- demo control (not part of the Figma chrome) ---------- */
  .replay{position:fixed;left:16px;bottom:16px;z-index:20;
    display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;
    background:var(--bg-page-3);border:1px solid var(--line-3);
    color:var(--text-secondary);font:500 12px/16px var(--sans);letter-spacing:-.24px;
    transition:background .15s ease,color .15s ease}
  .replay:hover{background:var(--bg-card-1);color:var(--text-primary)}
  .replay .phase{color:var(--text-tertiary);font-variant-numeric:tabular-nums}

  /* ══════════════════════════════════════════════════════════════
     THE STREAMING ANIMATION
     Same four keyframes and the same 55ms/word cadence as
     components/streaming-text.tsx — words resolve out of blur,
     chips pop, rows rise.
     ══════════════════════════════════════════════════════════════ */
  @keyframes stream-in{from{opacity:0;filter:blur(5px)}to{opacity:1;filter:blur(0)}}
  @keyframes pop-in{from{opacity:0;scale:.86}to{opacity:1;scale:1}}
  @keyframes fade-in{from{opacity:0}to{opacity:1}}
  @keyframes fade-up{from{opacity:0;translate:0 6px}to{opacity:1;translate:0 0}}
  @keyframes grow-down{from{scale:1 0}to{scale:1 1}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes working{0%,100%{opacity:.45}50%{opacity:1}}

  /* ---------- live-activity status lines ---------- */
  .status{display:flex;align-items:center;gap:6px;min-height:20px;
    font:var(--body3);letter-spacing:-.56px;color:var(--text-secondary)}
  .status-ico{display:inline-flex;color:var(--text-secondary)}
  .logo-spin{display:inline-flex;align-items:center;justify-content:center;
    width:16px;height:16px;flex:none;
    animation:rot 1.1s linear infinite,logo-pulse 1.6s ease-in-out infinite}
  @keyframes rot{to{transform:rotate(1turn)}}
  @keyframes logo-pulse{0%,100%{opacity:.5;filter:saturate(.4) brightness(.85)}
    50%{opacity:1;filter:saturate(1.2) brightness(1.3)}}
  .dots{min-width:14px;text-align:left}
  .dots::after{content:'';animation:dots 1.2s steps(1,end) infinite}
  @keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%,100%{content:'...'}}
  .dots.blue{color:var(--text-blue)}
  .shimmer{background:linear-gradient(100deg,var(--text-tertiary) 25%,var(--text-primary) 50%,var(--text-tertiary) 75%);
    background-size:200% 100%;-webkit-background-clip:text;background-clip:text;
    color:transparent;animation:shine 1.8s linear infinite}
  .shimmer-blue{background:linear-gradient(100deg,var(--text-blue) 25%,#d9efff 50%,var(--text-blue) 75%);
    background-size:200% 100%;-webkit-background-clip:text;background-clip:text;
    color:transparent;animation:shine 1.8s linear infinite}
  @keyframes shine{from{background-position:200% 0}to{background-position:-100% 0}}
  .grp-note{padding-inline:24px;font:var(--cap1);letter-spacing:-.24px;color:var(--text-tertiary)}

  /* groups crunch to just their header; chevron rotates to point right */
  .grp-fold{display:grid;grid-template-rows:0fr;opacity:0;
    transition:grid-template-rows .35s var(--ease),opacity .3s ease}
  .grp-fold.open{grid-template-rows:1fr;opacity:1}
  .grp-fold>div{overflow:hidden;display:flex;flex-direction:column;gap:8px}
  .sec-chev svg{transition:transform .25s var(--ease)}
  .sec-chev.closed svg{transform:rotate(-90deg)}
  .grp-head.clickable{cursor:pointer}

  /* definition rows expand on click to reveal the definition */
  .row-toggle{cursor:pointer;transition:background .15s ease,border-color .15s ease}
  .row-toggle:hover{background:var(--bg-card-2);border-color:var(--line-1)}
  .row-fold{display:grid;grid-template-rows:0fr;opacity:0;
    transition:grid-template-rows .3s var(--ease),opacity .25s ease}
  .row-fold.open{grid-template-rows:1fr;opacity:1}
  .row-fold>div{overflow:hidden}

  /* ---------- collapsing (crunch) ---------- */
  .sec-fold{display:grid;grid-template-rows:1fr;
    transition:grid-template-rows .45s var(--ease),opacity .4s var(--ease)}
  .sec-fold>div{overflow:hidden;display:flex;flex-direction:column;gap:12px;min-width:0}
  .sec-fold.folded{grid-template-rows:0fr;opacity:0}
  .trace{display:grid;grid-template-rows:1fr;
    transition:grid-template-rows .55s var(--ease),opacity .5s var(--ease)}
  .trace>div{overflow:hidden;display:flex;flex-direction:column;gap:16px;min-width:0}
  .trace.folded{grid-template-rows:0fr;opacity:0}
  .reasoning-toggle{display:flex;align-items:center;gap:6px;align-self:flex-start;
    margin-left:36px;padding:4px 8px;border-radius:8px;
    background:var(--bg-page-3);border:1px solid var(--line-3);
    color:var(--text-secondary);font:500 14px/20px var(--sans);letter-spacing:-.56px;
    transition:background .15s ease,color .15s ease}
  .reasoning-toggle:hover{background:var(--bg-card-1);color:var(--text-primary)}
  .reasoning-toggle .chev{display:inline-flex;transition:transform .3s var(--ease)}
  .reasoning-toggle.open .chev{transform:rotate(90deg)}
  .trace .rule{margin-left:36px}

  /* ---------- the final answer ---------- */
  .answer{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start}
  .answer-ico{width:24px;height:24px;border-radius:6px;background:var(--thinking-tile);
    display:grid;place-items:center}
  .answer-body{font:400 16px/24px var(--sans);letter-spacing:-.64px;
    color:var(--text-primary);max-width:688px}

  /* dots hug the label they belong to */
  .sec-head .dots{margin-left:-6px}

  .word{display:inline;will-change:filter,opacity;
    animation:stream-in 420ms cubic-bezier(.22,.61,.25,1) both}
  .caret{display:inline-block;width:2px;height:12px;margin-left:2px;translate:0 1px;
    border-radius:9999px;background:currentColor;animation:fade-in 150ms ease-out both}
  .pop{animation:pop-in 250ms var(--ease) both}
  .rise{animation:fade-up 350ms var(--ease) both}
  .appear{animation:fade-in 300ms ease-out both}
  /* the step being worked on breathes until it resolves */
  .is-working{animation:working 1.3s ease-in-out infinite}

  @media (prefers-reduced-motion:reduce){
    @keyframes stream-in{from{opacity:0}to{opacity:1}}
    @keyframes pop-in{from{opacity:0}to{opacity:1}}
    @keyframes fade-up{from{opacity:0}to{opacity:1}}
    @keyframes grow-down{from{opacity:0}to{opacity:1}}
    .is-working,.caret-bar{animation:none}
    .shimmer,.shimmer-blue{animation:none;background:none;color:var(--text-secondary);-webkit-text-fill-color:var(--text-secondary)}
    .logo-spin{animation:none}
  }

  @media (max-width:900px){
    .rail{display:none}
    .thread,.composer,.footer{width:100%}
  }
</style>
</head>
<body>

<div class="app">
  <!-- ═══════════ left rail ═══════════ -->
  <nav class="rail" aria-label="Workspace">
    <div class="rail-logo" data-icon="logo" data-size="20"></div>
    <button class="rail-btn is-active" aria-label="New chat" data-icon="messageplus" data-size="20"></button>
    <button class="rail-btn" aria-label="Search" data-icon="search20" data-size="20"></button>
  </nav>

  <!-- ═══════════ panel ═══════════ -->
  <div class="panel">
    <header class="topbar">
      <div class="topbar-left">
        <button class="back"><span data-icon="arrowleft" data-size="16"></span>Back</button>
        <h1 class="doc-title">Claims Review Assistant</h1>
      </div>
      <button class="assets"><span data-icon="assets" data-size="20"></span>Assets</button>
    </header>

    <div class="scroller" id="scroller">
      <div class="thread" id="thread">
        <p class="bubble">Can you review this insurance claim and tell me if there are any issues or risks of rejection?</p>
      </div>
    </div>

    <div class="composer-wrap">
      <div class="composer">
        <div class="composer-input"><span class="caret-bar"></span>Ask anything..</div>
        <div class="composer-row">
          <div class="composer-left">
            <button class="icon-btn" aria-label="Attach" data-icon="plus" data-size="20"></button>
            <button class="badge-btn"><span data-icon="write" data-size="16"></span>Canvas</button>
          </div>
          <div class="composer-right">
            <button class="icon-btn" aria-label="Dictate" data-icon="mic" data-size="20"></button>
            <button class="stop-btn" aria-label="Stop generating"><i></i></button>
          </div>
        </div>
      </div>
      <div class="footer">
        <span class="elapsed" id="elapsed"><span data-icon="clock" data-size="14"></span><span id="elapsed-text">Working…</span></span>
        <span>Facing issues with the assistant? <a href="#">Give feedback</a></span>
      </div>
    </div>
  </div>
</div>

const GRAPH_HTML = "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\" />\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n<title>Ontology Graph<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap\" rel=\"stylesheet\" media=\"print\" onload=\"this.media='all'\">\n<style>\n  :root{\n    /* Cogentiq Builder palette */\n    --bg:#121212;\n    --panel:#212121;\n    --panel-br:#323232;\n    --panel-br2:#424242;\n    --text:#f5f5f5;\n    --text-dim:#bdbdbd;\n    --text-dimmer:#8c8c8c;\n    --indigo:#5860ed;\n    --indigo-d:#454de0;\n    --blue:#0d99ff;\n    --blue-l:#80caff;\n    --red:#f24822;\n    --green:#14ae5c;\n    --green-l:#7cb342;\n    --orange:#fc9e24;\n    --orange-d:#f79722;\n    --font:'Geist','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;\n    --mono:'Geist Mono',ui-monospace,monospace;\n  }\n  *{box-sizing:border-box}\n  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:var(--font)}\n  #stage{position:fixed;inset:0;cursor:grab}\n  #stage.panning{cursor:grabbing}\n  /* dot-grid canvas, Cogentiq-style, plus a soft central lift */\n  #stage::before{content:\"\";position:absolute;inset:0;pointer-events:none;z-index:0;\n    background-image:\n      radial-gradient(rgba(255,255,255,.06) 1px, transparent 1.6px),\n      radial-gradient(1100px 850px at 50% 42%, rgba(255,255,255,.025), rgba(0,0,0,0) 62%);\n    background-size:26px 26px, 100% 100%;\n    background-position:-3px -3px, 0 0;}\n  svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;display:block}\n\n  /* default: dotted grey relation lines */\n  .edge{fill:none;stroke:#4d5158;stroke-linecap:round;stroke-width:1.6;\n    stroke-dasharray:2 7;opacity:.75;transition:opacity .25s,stroke .25s;}\n  /* edges touching the focused node: solid blue */\n  .edge.solid{stroke:var(--blue);stroke-dasharray:none;stroke-width:1.7;opacity:.85}\n  .edge.hi{opacity:1;stroke-width:2.1}\n  .shimmer{fill:none;stroke-linecap:round;stroke-width:2.4;mix-blend-mode:screen;pointer-events:none;}\n\n  .rel-pill{pointer-events:none;}\n  .rel-pill rect{fill:#1c1c1cf0;stroke:var(--panel-br2);stroke-width:1;}\n  .rel-pill text{fill:var(--text-dim);font-size:10.5px;font-family:var(--font);font-weight:500;\n    letter-spacing:-.01em;text-anchor:middle;dominant-baseline:middle;}\n  .rel-pill.hi rect{stroke:#5c5c5c;fill:#232323f5}\n  .rel-pill.hi text{fill:#fff}\n\n  .node{cursor:pointer;transition:opacity .35s ease;}\n  .node text{font-size:12px;fill:var(--text);paint-order:stroke;pointer-events:none;\n    letter-spacing:-.01em;dominant-baseline:middle;font-weight:500;}\n\n  /* plain chip (non-focus entity) */\n  .chip-rect{fill:var(--panel);stroke:var(--panel-br);stroke-width:1;rx:8;ry:8;}\n  .node.hover .chip-rect{stroke:var(--panel-br2)}\n  .chip-sq{rx:2.5;ry:2.5;}\n\n  /* focus node: avatar + capsule with animated gradient ring */\n  .avatar-init{font-size:16px;font-weight:300;font-family:'Geist',sans-serif;fill:#fff;\n    text-anchor:middle;dominant-baseline:central;pointer-events:none}\n  .cap-rect{fill:#1a1a1af5;stroke:url(#focusGrad);stroke-width:1.8;}\n  .cap-glow{fill:none;stroke:url(#focusGrad);stroke-width:5;filter:url(#capGlowBlur);\n    pointer-events:none;opacity:0;}\n  .node.focus text{font-weight:600}\n\n  .halo{opacity:0;transition:opacity .2s;pointer-events:none;}\n  .node.hover .halo{opacity:.5}\n\n  /* rest of the ontology: real nodes/edges, kept faded until selected */\n  .bg-chip{cursor:pointer}\n  .bg-chip .chip-rect{stroke:#2a2a2a}\n  .bg-edge{fill:none;stroke:#2a2c30;stroke-linecap:round;stroke-width:1;\n    stroke-dasharray:2 8;opacity:.05;pointer-events:none;transition:opacity .3s ease;}\n\n  /* ---------- chrome ---------- */\n  .panel{background:rgba(28,28,28,.82);backdrop-filter:blur(9px);border:1px solid var(--panel-br);border-radius:11px;}\n  .topbar{position:fixed;z-index:5;top:16px;left:16px;display:flex;align-items:center;gap:10px}\n  .brand{display:flex;align-items:center;gap:9px;padding:8px 12px;}\n  .brand .dot{width:16px;height:16px;border-radius:5px;background:linear-gradient(135deg,var(--orange),var(--orange-d))}\n  .brand b{color:var(--text);font-size:13px;font-weight:600;letter-spacing:-.01em}\n  .brand span{color:var(--text-dimmer);font-size:12px}\n  .crumbs{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 6px;max-width:60vw;overflow:hidden}\n  .crumbs button{all:unset;cursor:pointer;color:var(--text-dimmer);font-size:12px;padding:4px 8px;border-radius:7px;white-space:nowrap}\n  .crumbs button:hover{background:#2a2a2a;color:var(--text-dim)}\n  .crumbs .sep{color:#4a4a4a;font-size:11px}\n  .crumbs .cur{color:#fff;background:#2a2a2a;border:1px solid var(--panel-br2)}\n\n  .fullscr{position:fixed;z-index:5;top:16px;right:16px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-dim)}\n  .fullscr:hover{color:#fff;border-color:var(--panel-br2)}\n\n  /* left sidebar: every entity, searchable, with its relationship count */\n  .sidebar{position:fixed;z-index:5;top:66px;left:16px;bottom:16px;width:280px;\n    display:flex;flex-direction:column;overflow:hidden;\n    transition:width .22s ease, bottom .22s ease;}\n  /* collapsed: panel shrinks to just the search row, tucked to the left edge */\n  .sidebar.collapsed{bottom:auto;width:214px;}\n  .sidebar.collapsed .s-count,.sidebar.collapsed .s-list{display:none}\n  .sidebar.collapsed .s-search{border-bottom:none}\n  .sidebar .s-search{display:flex;align-items:center;gap:8px;padding:11px 13px;\n    border-bottom:1px solid var(--panel-br);flex:0 0 auto;}\n  /* the global `svg{position:absolute;inset:0}` rule (for the graph canvas)\n     would otherwise pin this icon to the panel's corner instead of sitting\n     it inline in the search row */\n  .sidebar .s-search svg{position:static;width:14px;height:14px;flex:0 0 14px;opacity:.5}\n  .sidebar .s-search input{all:unset;color:var(--text);font-size:12.5px;flex:1 1 auto;min-width:0;\n    font-family:var(--font)}\n  .sidebar .s-search input::placeholder{color:var(--text-dimmer)}\n  .s-toggle{all:unset;flex:0 0 auto;display:flex;align-items:center;justify-content:center;\n    width:22px;height:22px;border-radius:6px;cursor:pointer;color:var(--text-dimmer);\n    transition:color .15s,background .15s}\n  .s-toggle:hover{background:#2a2a2a;color:#fff}\n  .s-toggle svg{position:static;width:13px;height:13px;opacity:1;transition:transform .22s ease}\n  .sidebar.collapsed .s-toggle svg{transform:rotate(180deg)}\n  .sidebar .s-count{padding:9px 13px 5px;color:var(--text-dimmer);font-size:10.5px;font-weight:600;\n    text-transform:uppercase;letter-spacing:.05em;flex:0 0 auto}\n  .sidebar .s-list{overflow-y:auto;flex:1 1 auto;padding:2px 7px 10px;}\n  .sidebar .s-row{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;\n    width:100%;padding:7px 8px;border-radius:8px;cursor:pointer;color:var(--text-dim);font-size:12.5px;\n    letter-spacing:-.01em;}\n  .sidebar .s-row:hover{background:#242424;color:#fff}\n  .sidebar .s-row.cur{background:#242424;color:#fff;border:1px solid var(--panel-br2)}\n  .sidebar .s-sw{width:8px;height:8px;border-radius:2.5px;flex:0 0 8px}\n  .sidebar .s-name{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n  .sidebar .s-count-badge{flex:0 0 auto;color:var(--text-dimmer);font-size:10.5px;font-family:var(--mono);\n    background:#2a2a2a;border-radius:6px;padding:1px 6px;min-width:9px;text-align:center;}\n  .sidebar .s-row.cur .s-count-badge{background:#333;color:#ddd}\n  .sidebar .s-list::-webkit-scrollbar{width:8px}\n  .sidebar .s-list::-webkit-scrollbar-thumb{background:#333;border-radius:4px}\n  .sidebar .s-list::-webkit-scrollbar-track{background:transparent}\n\n  .hint{position:fixed;z-index:5;right:16px;bottom:16px;color:var(--text-dimmer);font-size:11px;\n    padding:7px 11px;line-height:1.5}\n  .hint b{color:#9a9a9a;font-weight:500}\n\n  .zoomwrap{position:fixed;z-index:5;left:50%;bottom:16px;transform:translateX(-50%);\n    display:flex;align-items:center;gap:2px;padding:5px;}\n  .zoomwrap button{all:unset;cursor:pointer;color:var(--text-dim);font-size:15px;width:28px;height:28px;\n    text-align:center;line-height:28px;border-radius:8px;}\n  .zoomwrap button:hover{background:#2a2a2a;color:#fff}\n  .zoomwrap .pct{color:var(--text-dim);font-size:12px;width:46px;text-align:center;font-family:var(--mono);}\n\n  /* hover definition card */\n  #tip{position:fixed;z-index:8;max-width:280px;pointer-events:none;\n    background:rgba(26,26,26,.95);backdrop-filter:blur(10px);\n    border:1px solid var(--panel-br2);border-radius:12px;padding:12px 14px;\n    opacity:0;transform:translateY(4px);transition:opacity .16s ease,transform .16s ease;}\n  #tip.show{opacity:1;transform:translateY(0)}\n  #tip .t-head{display:flex;align-items:center;gap:7px;margin-bottom:6px}\n  #tip .t-dot{width:8px;height:8px;border-radius:2.5px;flex:0 0 8px}\n  #tip .t-type{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-dimmer)}\n  #tip .t-name{font-size:13px;font-weight:600;color:#fff;margin-bottom:4px;letter-spacing:-.01em}\n  #tip .t-def{font-size:12px;line-height:17px;color:var(--text-dim)}\n<\/style>\n<\/head>\n<body>\n<div id=\"stage\">\n    <svg id=\"svg\" xmlns=\"http://www.w3.org/2000/svg\">\n      <defs>\n        <filter id=\"shimmerBlur\" x=\"-60%\" y=\"-60%\" width=\"220%\" height=\"220%\">\n          <feGaussianBlur stdDeviation=\"1.1\"/>\n        <\/filter>\n        <filter id=\"capGlowBlur\" x=\"-120%\" y=\"-200%\" width=\"340%\" height=\"500%\">\n          <feGaussianBlur stdDeviation=\"5.5\"/>\n        <\/filter>\n        <!-- rainbow-button-style multi-hue sweep; first/last stop match so the\n             loop has no seam as it rotates through -->\n        <linearGradient id=\"focusGrad\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">\n          <stop offset=\"0%\"   stop-color=\"#0d99ff\"/>\n          <stop offset=\"25%\"  stop-color=\"#9747ff\"/>\n          <stop offset=\"50%\"  stop-color=\"#e91e63\"/>\n          <stop offset=\"75%\"  stop-color=\"#fc9e24\"/>\n          <stop offset=\"100%\" stop-color=\"#0d99ff\"/>\n        <\/linearGradient>\n      <\/defs>\n      <defs id=\"edgeDefs\"><\/defs>\n      <g id=\"camera\">\n        <g id=\"bgEdgeLayer\"><\/g>\n        <g id=\"bgLayer\"><\/g>\n        <g id=\"edges\"><\/g>\n        <g id=\"shimmers\"><\/g>\n        <g id=\"pills\"><\/g>\n        <g id=\"nodes\"><\/g>\n      <\/g>\n    <\/svg>\n  <\/div>\n\n  <div class=\"topbar\">\n    <div class=\"brand panel\"><span class=\"dot\"><\/span><b>Ontology<\/b><span id=\"stat\">\u2014 explore<\/span><\/div>\n    <div class=\"crumbs panel\" id=\"crumbs\"><\/div>\n  <\/div>\n\n  <div class=\"fullscr panel\" id=\"fullscr\" title=\"Fullscreen\">\n    <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" width=\"15\" height=\"15\"><path d=\"M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3\"/><\/svg>\n  <\/div>\n\n  <div class=\"sidebar panel\">\n    <div class=\"s-search\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#8b929c\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"/><path d=\"m20 20-3.5-3.5\"/><\/svg>\n      <input id=\"entSearch\" placeholder=\"Search entities\u2026\" autocomplete=\"off\" />\n      <button class=\"s-toggle\" id=\"entToggle\" title=\"Collapse list\" aria-label=\"Collapse entity list\" aria-expanded=\"true\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m14 6-6 6 6 6\"/><\/svg>\n      <\/button>\n    <\/div>\n    <div class=\"s-count\" id=\"entCount\"><\/div>\n    <div class=\"s-list\" id=\"entList\"><\/div>\n  <\/div>\n\n  <div class=\"zoomwrap panel\">\n    <button id=\"zout\">\u2212<\/button><span class=\"pct\" id=\"pct\">100%<\/span><button id=\"zin\">+<\/button>\n  <\/div>\n  <div class=\"hint\"><b>Click<\/b> a node to re-center \u00b7 <b>Hover<\/b> for definition \u00b7 <b>Drag<\/b> to pan \u00b7 <b>Scroll<\/b> to zoom<\/div>\n\n  <div id=\"tip\">\n    <div class=\"t-head\"><span class=\"t-dot\"><\/span><span class=\"t-type\"><\/span><\/div>\n    <div class=\"t-name\"><\/div>\n    <div class=\"t-def\"><\/div>\n  <\/div>\n\n<script>\n/* =========================================================================\n   DATA \u2014 Acme Consumer Brands Integrated Business Planning ontology\n   (enterprise ontology export). Structure (names + relationships) shows\n   by default; each node's `def` is revealed in a card only on hover.\n   ========================================================================= */\nconst NODES = [\n  {id:\"Acme Consumer Brands\", type:\"organization\",\n   def:\"The enterprise itself: a mid-cap household-products manufacturer.\"},\n  {id:\"Walmart\", type:\"organization\",\n   def:\"Largest customer by volume; operates its own replenishment engine.\"},\n  {id:\"Target\", type:\"organization\",\n   def:\"Second national account, forecast-collaborative.\"},\n  {id:\"Demand Planner\", type:\"role\",\n   def:\"Owns the statistical baseline and the demand review.\"},\n  {id:\"Supply Planner\", type:\"role\",\n   def:\"Balances the demand plan against capacity and materials.\"},\n  {id:\"National Account Manager\", type:\"role\",\n   def:\"Commercial owner of the Walmart relationship.\"},\n  {id:\"S&OP Lead\", type:\"role\",\n   def:\"Chairs the executive cycle and arbitrates gaps.\"},\n  {id:\"Columbus Plant\", type:\"location\",\n   def:\"Primary liquid fill and pack site.\"},\n  {id:\"Reno Plant\", type:\"location\",\n   def:\"West-coast site, shorter lead time to Pacific DCs.\"},\n  {id:\"Dallas Mixing Center\", type:\"location\",\n   def:\"Acme-owned DC feeding southern retail DCs.\"},\n  {id:\"Harrisburg DC\", type:\"location\",\n   def:\"East-coast finished-goods DC.\"},\n  {id:\"Walmart DC 6094\", type:\"location\",\n   def:\"Customer-owned regional DC, Bentonville network.\"},\n  {id:\"Southwest Store Cluster\", type:\"location\",\n   def:\"Roughly 400 stores sharing a demand signature.\"},\n  {id:\"Sparkle\", type:\"product\",\n   def:\"Flagship brand; ~60% of category revenue.\"},\n  {id:\"Spray Cleaner Family\", type:\"product\",\n   def:\"Planning family used for baseline statistics.\"},\n  {id:\"Sparkle 32oz Trigger\", type:\"product\",\n   def:\"Highest-velocity sellable SKU.\"},\n  {id:\"Sparkle 64oz Refill\", type:\"product\",\n   def:\"Value pack, promo-sensitive.\"},\n  {id:\"Sparkle Concentrate Pods\", type:\"product\",\n   def:\"New item, 14 weeks of history.\"},\n  {id:\"Surfactant Blend A\", type:\"product\",\n   def:\"Critical raw material with 9-week lead time.\"},\n  {id:\"Retailer POS Feed\", type:\"demand\",\n   def:\"Daily store-level scan data by item and location.\"},\n  {id:\"Observed Actual Demand\", type:\"demand\",\n   def:\"Unadjusted consumption as recorded at the shelf.\"},\n  {id:\"Calibrated Actual Demand\", type:\"demand\",\n   def:\"Actuals cleansed of stockouts, one-offs, and data gaps.\"},\n  {id:\"Promotional Lift\", type:\"demand\",\n   def:\"Incremental volume attributed to a specific offer.\"},\n  {id:\"Estimated Lost Sales\", type:\"demand\",\n   def:\"Modelled demand not served during out-of-stocks.\"},\n  {id:\"Statistical Baseline Forecast\", type:\"forecast\",\n   def:\"Unbiased machine output before human input.\"},\n  {id:\"Consensus Demand Forecast\", type:\"forecast\",\n   def:\"Single agreed number leaving the demand review.\"},\n  {id:\"Calibrated Demand Forecast\", type:\"forecast\",\n   def:\"Consensus corrected for known structural bias.\"},\n  {id:\"Retailer Demand Forecast\", type:\"forecast\",\n   def:\"The customer's own forward view, shared via CPFR.\"},\n  {id:\"Forecast Deviation\", type:\"forecast\",\n   def:\"Signed gap between forecast and calibrated actuals.\"},\n  {id:\"Forecast Bias\", type:\"forecast\",\n   def:\"Persistent directional error across periods.\"},\n  {id:\"Approved Demand Plan\", type:\"forecast\",\n   def:\"Locked plan of record handed to supply.\"},\n  {id:\"Constrained Demand Plan\", type:\"forecast\",\n   def:\"Demand plan after capacity and material feasibility.\"},\n  {id:\"Monitored Inventory Position\", type:\"inventory\",\n   def:\"Netted position: on hand plus in transit minus commitments.\"},\n  {id:\"DC On-Hand Inventory\", type:\"inventory\",\n   def:\"Physical stock at Acme-controlled locations.\"},\n  {id:\"Retailer On-Hand Inventory\", type:\"inventory\",\n   def:\"Customer-side stock visible through Retail Link.\"},\n  {id:\"Safety Stock Level\", type:\"inventory\",\n   def:\"Buffer sized from variability and target service.\"},\n  {id:\"Reorder Point\", type:\"inventory\",\n   def:\"Trigger level for replenishment orders.\"},\n  {id:\"Supply Plan\", type:\"supply\",\n   def:\"Time-phased plan to meet the demand plan.\"},\n  {id:\"Master Production Schedule\", type:\"supply\",\n   def:\"Firmed production by line, site, and period.\"},\n  {id:\"Material Requirements Plan\", type:\"supply\",\n   def:\"Exploded component needs by lead-time offset.\"},\n  {id:\"Supplier Purchase Order\", type:\"supply\",\n   def:\"Committed buy against a raw material need.\"},\n  {id:\"Customer Order\", type:\"supply\",\n   def:\"EDI 850 received from the retailer.\"},\n  {id:\"Outbound Shipment\", type:\"supply\",\n   def:\"Physical movement to a customer DC.\"},\n  {id:\"Deployment Plan\", type:\"supply\",\n   def:\"Allocation of available stock across DCs.\"},\n  {id:\"Retailer Replenishment Policy\", type:\"policy\",\n   def:\"Customer's ordering logic: min/max, review cycle, multiples.\"},\n  {id:\"Service Level Target\", type:\"policy\",\n   def:\"Committed fill rate by customer and segment.\"},\n  {id:\"OTIF Compliance Program\", type:\"policy\",\n   def:\"Customer scorecard with financial penalties.\"},\n  {id:\"S&OP Cycle\", type:\"process\",\n   def:\"Monthly cadence linking demand, supply, and finance.\"},\n  {id:\"Demand Review\", type:\"process\",\n   def:\"Forum that agrees the consensus number.\"},\n  {id:\"Supply Review\", type:\"process\",\n   def:\"Forum that tests feasibility and raises gaps.\"},\n  {id:\"CPFR Collaboration\", type:\"process\",\n   def:\"Joint forecasting exchange with the retailer.\"},\n  {id:\"Rollback Promotion Event\", type:\"event\",\n   def:\"Deep price cut with a two-week retail window.\"},\n  {id:\"Store Stockout Event\", type:\"event\",\n   def:\"Shelf out-of-stock detected from POS gaps.\"},\n  {id:\"Forecast Exception Alert\", type:\"event\",\n   def:\"Deviation breaching tolerance for two cycles.\"},\n  {id:\"Supply Disruption\", type:\"event\",\n   def:\"Force majeure at the surfactant site.\"},\n  {id:\"Forecast Accuracy (MAPE)\", type:\"metric\",\n   def:\"Absolute error over actuals at the planning level.\"},\n  {id:\"On Time In Full\", type:\"metric\",\n   def:\"Customer-scored delivery compliance.\"},\n  {id:\"Lost Sales Value\", type:\"metric\",\n   def:\"Revenue foregone to unserved demand.\"},\n  {id:\"ERP (SAP S/4HANA)\", type:\"system\",\n   def:\"Transactional system of record for orders and stock.\"},\n  {id:\"Advanced Planning System\", type:\"system\",\n   def:\"Where statistical, consensus, and supply plans live.\"},\n  {id:\"Retailer Data Portal\", type:\"system\",\n   def:\"Customer-hosted POS and inventory reporting.\"},\n  {id:\"Analytics Lakehouse\", type:\"system\",\n   def:\"Harmonised store of planning and execution history.\"},\n  {id:\"Product Master Data Hub\", type:\"system\",\n   def:\"Golden record for item, pack, and hierarchy.\"},\n  {id:\"Walmart Customer Account\", type:\"commercial\",\n   def:\"Commercial container for terms, plans, and P&L.\"},\n  {id:\"Trade Promotion Fund\", type:\"commercial\",\n   def:\"Budget consumed by promotional offers.\"},\n  {id:\"Supply Agreement\", type:\"commercial\",\n   def:\"Contract governing volumes, penalties, and terms.\"},\n  {id:\"Planning Hierarchy\", type:\"planning\",\n   def:\"Item, customer, and geography roll-up structure.\"},\n  {id:\"Weekly Time Bucket\", type:\"planning\",\n   def:\"Standard planning grain for demand.\"},\n  {id:\"Demand Forecast Unit\", type:\"planning\",\n   def:\"SKU x customer x DC intersection being forecast.\"},\n];\nconst LINKS = [\n  [\"Walmart\",\"Observed Actual Demand\",\"sells through\"],\n  [\"Walmart\",\"Consensus Demand Forecast\",\"plans account for\"],\n  [\"Walmart\",\"Retailer Replenishment Policy\",\"sets service levels\"],\n  [\"Walmart\",\"Walmart DC 6094\",\"operates\"],\n  [\"Walmart\",\"Southwest Store Cluster\",\"operates\"],\n  [\"Walmart\",\"Retailer POS Feed\",\"publishes\"],\n  [\"Walmart\",\"OTIF Compliance Program\",\"governs\"],\n  [\"Walmart\",\"Retailer Demand Forecast\",\"publishes\"],\n  [\"Walmart\",\"Walmart Customer Account\",\"part of\"],\n  [\"Target\",\"Observed Actual Demand\",\"sells through\"],\n  [\"Target\",\"CPFR Collaboration\",\"part of\"],\n  [\"Acme Consumer Brands\",\"Sparkle\",\"owns\"],\n  [\"Acme Consumer Brands\",\"Columbus Plant\",\"operates\"],\n  [\"Acme Consumer Brands\",\"Reno Plant\",\"operates\"],\n  [\"Acme Consumer Brands\",\"Dallas Mixing Center\",\"operates\"],\n  [\"Acme Consumer Brands\",\"Harrisburg DC\",\"operates\"],\n  [\"Acme Consumer Brands\",\"Demand Planner\",\"employs\"],\n  [\"Acme Consumer Brands\",\"Supply Planner\",\"employs\"],\n  [\"Acme Consumer Brands\",\"National Account Manager\",\"employs\"],\n  [\"Acme Consumer Brands\",\"S&OP Lead\",\"employs\"],\n  [\"Acme Consumer Brands\",\"S&OP Cycle\",\"governs\"],\n  [\"Acme Cons ],\n  [\"ERP (SAP S/4HANA)\",\"DC On-Hand Inventory\",\"publishes\"],\n  [\"ERP (SAP S/4HANA)\",\"Customer Order\",\"masters\"],\n  [\"Advanced Planning System\",\"Statistical Baseline Forecast\",\"masters\"],\n  [\"Advanced Planning System\",\"Consensus Demand Forecast\",\"masters\"],\n  [\"Advanced Planning System\",\"Supply Plan\",\"masters\"],\n  [\"Advanced Planning System\",\"Safety Stock Level\",\"masters\"],\n  [\"Retailer Data Portal\",\"Retailer POS Feed\",\"publishes\"],\n  [\"Retailer Data Portal\",\"Retailer On-Hand Inventory\",\"publishes\"],\n  [\"Analytics Lakehouse\",\"ERP (SAP S/4HANA)\",\"fed by\"],\n  [\"Analytics Lakehouse\",\"Retailer Data Portal\",\"fed by\"],\n  [\"Analytics Lakehouse\",\"Advanced Planning System\",\"fed by\"],\n  [\"Analytics Lakehouse\",\"Forecast Accuracy (MAPE)\",\"feeds\"],\n  [\"Analytics Lakehouse\",\"On Time In Full\",\"feeds\"],\n  [\"Product Master Data Hub\",\"Advanced Planning System\",\"feeds\"],\n  [\"Product Master Data Hub\",\"ERP (SAP S/4HANA)\",\"feeds\"],\n];\n// open on a modestly-connected entity rather than a hub, so the first view\n// reads as a legible fan; Forecast Deviation's 5 relationships also span\n// four type classes, showing the ontology's variety straight away\nconst START = \"Forecast Deviation\";\n/* ===================================================================== */\n\n// colors + labels pulled directly from the ontology's nodeClasses (T-Box)\nconst TYPE = {\n  organization: {color:\"#F97316\", label:\"Organization\"},\n  role: {color:\"#EC4899\", label:\"Role\"},\n  location: {color:\"#06B6D4\", label:\"Location\"},\n  product: {color:\"#A3E635\", label:\"Product\"},\n  demand: {color:\"#22C55E\", label:\"Demand artifact\"},\n  forecast: {color:\"#6366F1\", label:\"Forecast artifact\"},\n  inventory: {color:\"#38BDF8\", label:\"Inventory artifact\"},\n  supply: {color:\"#3B82F6\", label:\"Supply artifact\"},\n  policy: {color:\"#F59E0B\", label:\"Policy\"},\n  process: {color:\"#8B5CF6\", label:\"Process\"},\n  event: {color:\"#EF4444\", label:\"Event\"},\n  metric: {color:\"#14B8A6\", label:\"Metric\"},\n  system: {color:\"#94A3B8\", label:\"System\"},\n  commercial: {color:\"#D946EF\", label:\"Commercial\"},\n  planning: {color:\"#64748B\", label:\"Planning construct\"},\n};\n\n// ---- adjacency -----------------------------------------------------------\nconst byId = Object.fromEntries(NODES.map(n=>[n.id,n]));\nconst adj = Object.fromEntries(NODES.map(n=>[n.id,[]]));\nconst relOf = {};\nfor(const [a,b,r] of LINKS){ if(!byId[a]||!byId[b])continue;\n  adj[a].push(b); adj[b].push(a); relOf[a+'|'+b]=r; relOf[b+'|'+a]=r; }\nfunction colorOf(id){ return (TYPE[byId[id].type]||TYPE.entity).color; }\nfunction shade(hex,amt){ // amt -1..1, negative darkens toward black, positive lightens toward white\n  const c=hex.replace('#','');\n  const r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);\n  const mix=(v)=> amt<0 ? Math.round(v*(1+amt)) : Math.round(v+(255-v)*amt);\n  return `rgb(${mix(r)},${mix(g)},${mix(b)})`;\n}\n\nconst NS='http://www.w3.org/2000/svg';\nconst el=(t,a={})=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};\nconst initials = s => s.replace(/[^A-Za-z0-9 ]/g,'').split(/(?=[A-Z])|\\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();\n\n// ---- camera --------------------------------------------------------------\nlet W=innerWidth, H=innerHeight;\n// anchor the focus toward the left of the viewport \u2014 the fan opens rightward\n// from it, so it needs room on its right rather than sitting dead-center.\nconst cam={x:W*0.26,y:H/2,k:1};\nconst camG=document.getElementById('camera');\nconst focusGradEl=document.getElementById('focusGrad');\nfunction applyCam(){camG.setAttribute('transform',`translate(${cam.x},${cam.y}) scale(${cam.k})`);\n  document.getElementById('pct').textContent=Math.round(cam.k*100)+'%';}\n\n// ---- full-graph layout, computed once: gives every node (not just the\n// active ego cluster) a stable slot so the un-selected rest of the\n// ontology can be shown for real, faded, instead of decorative filler.\nfunction computeFullLayout(){\n  const P={}; let seed=42; const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};\n\n  // per-node footprint, sized off its actual label \u2014 this is what keeps\n  // long labels from visually colliding, not just point-repulsion\n  const _mm=document.createElement('canvas').getContext('2d'); _mm.font='500 12px Geist, sans-serif';\n  const SIZE={};\n  for(const n of NODES) SIZE[n.id]=Math.max(34, _mm.measureText(n.id).width/2+18);\n\n  // seed spread out across an area proportional to node count, so the\n  // simulation starts near its resting scale instead of uncrushing a ball\n  const spread=90*Math.sqrt(NODES.length);\n  for(const n of NODES){ const a=rnd()*Math.PI*2, r=spread*(0.3+rnd()*0.7); P[n.id]={x:Math.cos(a)*r,y:Math.sin(a)*r}; }\n\n  const LINK_LEN=170;\n  for(let iter=0; iter<500; iter++){\n    // soft-collision on each pair's real footprint (not a uniform point\n    // radius) \u2014 this is what makes the rest-of-graph layer read as evenly\n    // spaced, like the reference, instead of crowding wherever labels are long\n    for(let i=0;i<NODES.length;i++)for(let j=i+1;j<NODES.length;j++){\n      const idA=NODES[i].id, idB=NODES[j].id, A=P[idA], B=P[idB];\n      let dx=A.x-B.x,dy=A.y-B.y,d=Math.hypot(dx,dy)||0.01;\n      const minD=SIZE[idA]+SIZE[idB]+22;\n      if(d<minD){ const push=(minD-d)/d*0.5; A.x+=dx*push; A.y+=dy*push; B.x-=dx*push; B.y-=dy*push; }\n    }\n    for(const [a,b] of LINKS){\n      const A=P[a],B=P[b]; if(!A||!B)continue;\n      let dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||0.01;\n      const f=(d-LINK_LEN)*0.012;\n      A.x+=dx/d*f; A.y+=dy/d*f; B.x-=dx/d*f; B.y-=dy/d*f;\n    }\n    for(const n of NODES){ const p=P[n.id]; p.x*=0.998; p.y*=0.998; }\n  }\n  // keep the layout clear of the active cluster's own footprint: only nodes\n  // that landed inside that radius get pushed just outside it (angle kept),\n  // rather than compressing the whole graph into a ring like before \u2014 every\n  // node further out keeps the even spacing the collision pass just gave it\n  const CLEAR_R=420;\n  for(const n of NODES){\n    const p=P[n.id], r=Math.hypot(p.x,p.y)||1;\n    if(r<CLEAR_R){ const ang=Math.atan2(p.y,p.x); p.x=Math.cos(ang)*CLEAR_R; p.y=Math.sin(ang)*CLEAR_R*0.85; }\n  }\n  return P;\n}\nconst FULLPOS = computeFullLayout();\nconst bgEls={};\nconst BG_OPACITY=0.10, BG_DIM=0.027;\n\n// ---- physics state -------------------------------------------------------\nconst pos={};                 // id -> {x,y,vx,vy}\nfunction ensure(id, near){\n  if(pos[id])return pos[id];\n  const a=Math.random()*Math.PI*2, r=40+Math.random()*40;\n  pos[id]={x:(near?near.x:0)+Math.cos(a)*r, y:(near?near.y:0)+Math.sin(a)*r, vx:0, vy:0};\n  return pos[id];\n}\nfor(const n of NODES) pos[n.id]={x:FULLPOS[n.id].x, y:FULLPOS[n.id].y, vx:0, vy:0};\npos[START]={x:0,y:0,vx:0,vy:0};\n\nlet focusId=START;\nlet active=new Set();          // ids currently in the ego view\nconst nodeEls={};              // id -> {g, refs}\nconst edgeEls=[];              // {line,a,b,from,to,pg,prect,ptext,shimmer,edgeGrad,shGrad,stops,phase,speed}\nlet hoverId=null, dragId=null, dragMoved=false;\nlet clock=0, gradSeq=0;\nconst history=[];\n\nfunction neighbors(id){return adj[id];}\n\n// ---- build / rebuild ego view -------------------------------------------\nfunction setFocus(id, pushHist=true){\n  if(!byId[id]) return;\n  if(pushHist && id!==focusId) history.push(focusId);\n  const prevFocus=focusId;\n  focusId=id;\n  const want=new Set([id, ...neighbors(id)]);\n\n  const f=ensure(id);\n  const nbs=neighbors(id);\n  // every node already has *some* pos (its background slot, or a stale fan\n  // position from whatever was focused before) \u2014 reseeding only \"if(!pos[nb])\"\n  // never actually fired, so newly-entering neighbors kept whatever unrelated\n  // position they last had and had to crawl into place via weak physics\n  // alone, which is what was reading as crowded/colliding with more nodes.\n  // Reseed anything actually new to this fan (including the old focus,\n  // demoted to a regular neighbor) with spacing that opens up as the\n  // neighbor count grows, so a busy node starts already breathable.\n  const entering=nbs.filter(nb=>!active.has(nb)||nb===prevFocus);\n  const vGap=Math.min(150, 62+entering.length*7);\n  entering.forEach((nb,i)=>{ ensure(nb);\n    pos[nb].x=f.x+205; pos[nb].y=f.y+(i-(entering.length-1)/2)*vGap;\n  });\n\n  for(const nid of Array.from(active)){\n    if(!want.has(nid)){\n      const rec=nodeEls[nid]; if(rec){rec.g.style.opacity=0; const gg=rec.g; setTimeout(()=>gg.remove(),350);}\n      delete nodeEls[nid]; active.delete(nid);\n      pos[nid]={x:FULLPOS[nid].x, y:FULLPOS[nid].y, vx:0, vy:0}; // return to its background slot\n    }\n  }\n  for(const nid of want){ createNode(nid); active.add(nid); } // rebuild all (chip<->avatar swap on focus change)\n\n  buildEdges();\n  renderBackground();\n  updateChrome();\n}\n\n// ---- background layer: the rest of the real ontology, faded ------------\nfunction renderBackground(){\n  const layer=document.getElementById('bgLayer');\n  const edgeLayer=document.getElementById('bgEdgeLayer');\n  layer.innerHTML=''; edgeLayer.innerHTML='';\n  for(const k in bgEls) delete bgEls[k];\n\n  const bgIds=NODES.map(n=>n.id).filter(id=>!active.has(id));\n  const bgSet=new Set(bgIds);\n  const seen=new Set();\n  for(const a of bgIds){\n    for(const b of neighbors(a)){\n      if(!bgSet.has(b))continue;\n      const key=a<b?a+'|'+b:b+'|'+a; if(seen.has(key))continue; seen.add(key);\n      const A=FULLPOS[a],B=FULLPOS[b];\n      edgeLayer.appendChild(el('path',{class:'bg-edge', d:curvePath(A.x,A.y,B.x,B.y)}));\n    }\n  }\n\n  const _mm=document.createElement('canvas').getContext('2d'); _mm.font='500 11px Geist, sans-serif';\n  for(const id of bgIds){\n    const P=FULLPOS[id];\n    const color=colorOf(id);\n    const w=Math.ceil(_mm.measureText(id).width);\n    const g=el('g',{class:'node bg-chip'}); g.dataset.id=id;\n    g.setAttribute('transform',`translate(${P.x},${P.y})`);\n    const rect=el('rect',{class:'chip-rect', x:0, y:-13, height:26, width:w+26});\n    g.appendChild(rect);\n    g.appendChild(el('rect',{class:'chip-sq', x:8, y:-3.5, width:7, height:7, fill:color}));\n    const label=el('text',{x:21, y:1}); label.textContent=id;\n    g.appendChild(label);\n    g.addEventListener('pointerenter',()=>setHover(id));\n    g.addEventListener('pointerleave',()=>setHover(null));\n    g.addEventListener('pointerdown',e=>{e.stopPropagation(); setFocus(id);});\n    layer.appendChild(g);\n    bgEls[id]={g, label, chipRect:rect};\n  }\n  applyDim();\n}\n\nfunction createNode(id){\n  if(nodeEls[id]){ nodeEls[id].g.remove(); }\n  const isFocus = id===focusId;\n  const color = colorOf(id);\n  const g=el('g',{class:'node'+(isFocus?' focus':'')}); g.dataset.id=id; g.style.opacity=0;\n\n  g.appendChild(el('circle',{class:'halo', r:isFocus?26:18, fill:color, opacity:0, 'fill-opacity':.16}));\n\n  let label, chipRect, capRect, capGlow, w;\n  const _mm=document.createElement('canvas').getContext('2d');\n  _mm.font=(isFocus?'600 13px':'500 12px')+' Geist, sans-serif';\n  w=Math.ceil(_mm.measureText(id).width);\n\n  if(isFocus){\n    const cw=21+27+w+18;\n    capGlow=el('rect',{class:'cap-glow', x:-21, y:-19, height:38, width:cw, rx:19, ry:19});\n    g.appendChild(capGlow);\n    capRect=el('rect',{class:'cap-rect', x:-21, y:-19, height:38, width:cw, rx:19, ry:19});\n    g.appendChild(capRect);\n    const avatar=el('circle',{r:14, fill:color});\n    g.appendChild(avatar);\n    const ini=el('text',{class:'avatar-init'}); ini.textContent=initials(id); g.appendChild(ini);\n    label=el('text',{x:25, y:1}); label.textContent=id; label.style.fill='#fff';\n    g.appendChild(label);\n  } else {\n    chipRect=el('rect',{class:'chip-rect', x:0, y:-15, height:30, width:w+30});\n    g.appendChild(chipRect);\n    g.appendChild(el('rect',{class:'chip-sq', x:9, y:-4, width:8, height:8, fill:color}));\n    label=el('text',{x:25, y:1}); label.textContent=id;\n    g.appendChild(label);\n  }\n\n  g.addEventListener('pointerenter',()=>setHover(id));\n  g.addEventListener('pointerleave',()=>setHover(null));\n  g.addEventListener('pointerdown',e=>{e.stopPropagation();startNodeDrag(id,e);});\n\n  document.getElementById('nodes').appendChild(g);\n  nodeEls[id]={g, label, chipRect, capRect, capGlow, isFocus, w};\n  requestAnimationFrame(()=>{g.style.opacity=1;});\n}\n\nfunction buildEdges(){\n  const layer=document.getElementById('edges');\n  const shLayer=document.getElementById('shimmers');\n  const pillLayer=document.getElementById('pills');\n  const defs=document.getElementById('edgeDefs');\n  edgeEls.length=0; layer.innerHTML=''; shLayer.innerHTML=''; pillLayer.innerHTML=''; defs.innerHTML='';\n  const seen=new Set(); let idx=0;\n  for(const a of active){\n    for(const b of neighbors(a)){\n      if(!active.has(b))continue;\n      const key=a<b?a+'|'+b:b+'|'+a; if(seen.has(key))continue; seen.add(key);\n\n      const from = a===focusId ? a : (b===focusId ? b : a);\n      const to   = from===a ? b : a;\n      const touchesFocus = (a===focusId||b===focusId);\n      const sid='sh'+(gradSeq++);\n\n      // shimmer gradient: a soft light window travelling the line\n      const glow = touchesFocus ? '#cfe9ff' : '#e8ecf4';\n      const sg=el('linearGradient',{id:sid, gradientUnits:'userSpaceOnUse'});\n      const ss0=el('stop',{offset:'0%', 'stop-color':glow,'stop-opacity':0});\n      const ss1=el('stop',{offset:'50%','stop-color':'#ffffff','stop-opacity':.95});\n      const ss2=el('stop',{offset:'100%','stop-color':glow,'stop-opacity':0});\n      sg.appendChild(ss0); sg.appendChild(ss1); sg.appendChild(ss2); defs.appendChild(sg);\n\n      const line=el('path',{class:'edge'+(touch List.remove('show');\n  }\n}\nfunction placeTip(id){\n  const p=pos[id]; if(!p)return;\n  // align the card's left edge with the hovered node's own left edge,\n  // whatever shape that node currently is (capsule or chip)\n  const rec=nodeEls[id]||bgEls[id];\n  const rectEl=rec&&(rec.capRect||rec.chipRect);\n  const leftLocalX=rectEl?parseFloat(rectEl.getAttribute('x'))||0:0;\n  const sx=(p.x+leftLocalX)*cam.k+cam.x, sy=p.y*cam.k+cam.y;\n  const r=tip.getBoundingClientRect();\n  let x=sx, y=sy+22*cam.k;                                // left-aligned, below the node\n  if(x+r.width>innerWidth-14) x=innerWidth-14-r.width;    // clamp on-screen, keep alignment when it fits\n  if(y+r.height>innerHeight-14) y=sy-r.height-22*cam.k;   // flip above\n  tip.style.left=Math.max(14,x)+'px';\n  tip.style.top =Math.max(14,y)+'px';\n}\nfunction relCount(id){const n=adj[id].length;return n+' relationship'+(n===1?'':'s');}\n\n// ---- node drag / click ---------------------------------------------------\nfunction startNodeDrag(id,e){\n  dragId=id; dragMoved=false;\n  const start={x:e.clientX,y:e.clientY};\n  const move=ev=>{\n    if(Math.hypot(ev.clientX-start.x,ev.clientY-start.y)>4)dragMoved=true;\n    const p=pos[id]; const wx=(ev.clientX-cam.x)/cam.k, wy=(ev.clientY-cam.y)/cam.k;\n    p.x=wx; p.y=wy; p.vx=0; p.vy=0;\n  };\n  const up=ev=>{\n    window.removeEventListener('pointermove',move);\n    window.removeEventListener('pointerup',up);\n    if(!dragMoved && id!==focusId) setFocus(id);\n    dragId=null;\n  };\n  window.addEventListener('pointermove',move);\n  window.addEventListener('pointerup',up);\n}\n\n// ---- pan / zoom ----------------------------------------------------------\nconst stage=document.getElementById('stage');\nstage.addEventListener('pointerdown',e=>{\n  if(e.target.closest('.node'))return;\n  stage.classList.add('panning');\n  const s={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};\n  const move=ev=>{cam.x=s.cx+(ev.clientX-s.x);cam.y=s.cy+(ev.clientY-s.y);appl ute('x',-(rec.w+5)); rec.label.setAttribute('text-anchor','start');\n    } else {\n      rec.chipRect.setAttribute('x',0);\n      if(sq)sq.setAttribute('x',9);\n      rec.label.setAttribute('x',25); rec.label.setAttribute('text-anchor','start');\n    }\n  }\n  for(const e of edgeEls){\n    const a=pos[e.a],b=pos[e.b]; if(!a||!b)continue;\n    // edges touching the focus leave from its capsule's right edge, not its\n    // center, so the fan visibly emerges from one side of the focus node.\n    let ax=a.x, ay=a.y, bx=b.x, by=b.y;\n    if(e.a===focusId) ax += focusEdgeReach(e.a);\n    else if(e.b===focusId) bx += focusEdgeReach(e.b);\n    e.line.setAttribute('d', curvePath(ax,ay,bx,by));\n\n    if(e.ptext.textContent){\n      let tf=0.5, F=null, O=null, aIsFocus=false;\n      if(e.a===focusId){F={x:ax,y:ay};O={x:bx,y:by};aIsFocus=true;} else if(e.b===focusId){F={x:bx,y:by};O={x:ax,y:ay};}\n      if(F){\n        const L=Math.hypot(O.x-F.x,O.y-F.y)||1;\n        tf = Math.min(0.76, Math.max(0.5, (26+46)/L));\n      }\n      const tPath = F ? (aIsFocus ? tf : 1-tf) : 0.5;\n      const pt = curvePoint(tPath, ax,ay,bx,by);\n      const mx = pt.x, my = pt.y;\n      const tw=estW(e.ptext.textContent, 10.5, 500);\n      e.pg.setAttribute('transform',`translate(${mx},${my})`);\n      e.prect.setAttribute('x',-tw/2-8); e.prect.setAttribute('y',-10); e.prect.setAttribute('width',tw+16);\n      const on = hoverId && (e.a===hoverId||e.b===hoverId);\n      e.pg.classList.toggle('hi', !!on);\n      e.pg.style.opacity = hoverId ? (on?1:0.12) : 1;\n    } else { e.pg.setAttribute('transform','translate(-9999,-9999)'); }\n\n    // shimmer: one pulse per PERIOD, travelling the FULL length from the\n    // focus node to the neighbor in TRAVEL seconds, then resting quietly.\n    const PERIOD=5.5, TRAVEL=1.1;\n    const fp=pos[e.from], tp=pos[e.to];\n    let fx=fp.x, fy=fp.y, tx=tp.x, ty=tp.y;\n    if(e.from===focusId) fx += focusEdgeReach(e.from);\n    else if(e.to===focusId) tx += focusEdgeReach(e.to);\n    e.shimmer.setAttribute('d', curvePath(fx,fy,tx,ty));\n    const tt=(clock + e.phase*PERIOD) % PERIOD;\n    let visible=false;\n    if(tt<TRAVEL){\n      visible=true;\n      const p=tt/TRAVEL;                       // 0 \u2192 1 across the whole edge\n      const ease=p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;   // easeInOutQuad\n      const band=13;                            // glow half-width in % of length\n      const c=-band + ease*(100+2*band);        // slides fully in and fully out\n      const cl=v=>Math.min(100,Math.max(0,v));\n      e.ss0.setAttribute('offset', cl(c-band)+'%');\n      e.ss1.setAttribute('offset', cl(c)+'%');\n      e.ss2.setAttribute('offset', cl(c+band)+'%');\n    }\n\n    const dimmed = hoverId && !(e.a===hoverId||e.b===hoverId);\n    e.line.classList.toggle('hi', !!(hoverId && !dimmed));\n    e.line.style.opacity = hoverId ? (dimmed?0.1:'') : '';\n    e.shimmer.style.opacity = !visible ? 0 : (dimmed ? 0.04 : 1);\n  }\n}\nconst _m=document.createElement('canvas').getContext('2d');\nfunction estW(s,size,weight){_m.font=`${weight||600} ${size||13}px Geist, Inter, sans-serif`;return Math.ceil(_m.measureText(s).width);}\n\n// horizontal-tangent S-curve (\u00e0 la d3.linkHorizontal): leaves/arrives flat,\n// bends in the middle, so a fan of edges reads as sweeping curves rather\n// than straight spokes.\nfunction curvePath(x1,y1,x2,y2){\n  const cx=(x1+x2)/2;\n  return `M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2}`;\n}\nfunction curvePoint(t,x1,y1,x2,y2){\n  const cx=(x1+x2)/2, mt=1-t;\n  const x=mt*mt*mt*x1 + 3*mt*mt*t*cx + 3*mt*t*t*cx + t*t*t*x2;\n  const y=mt*mt*mt*y1 + 3*mt*mt*t*y1 + 3*mt*t*t*y2 + t*t*t*y2;\n  return {x,y};\n}\n// x-offset from the focus node's own position out to its capsule's right\n// edge \u2014 matches the capsule geometry built in createNode() (width = w+66,\n// left-aligned at x:-21, so the right edge sits at w+45).\nfunction focusEdgeReach(id){ return (nodeEls[id]?nodeEls[id].w:0)+45; }\n\n// ---- chrome (breadcrumbs / legend) --------------------------------------\nfunction updateChrome(){\n  const c=document.getElementById('crumbs'); c.innerHTML='';\n  const trail=[...history.slice(-3), focusId];\n  trail.forEach((id,i)=>{\n    if(i>0){const s=document.createElement('span');s.className='sep';s.textContent='\u203a';c.appendChild(s);}\n    const b=document.createElement('button'); b.textContent=id;\n    if(id===focusId){b.className='cur'; b.style.borderColor=colorOf(id); b.style.color='#fff';}\n    b.onclick=()=>{ if(id!==focusId){\n      const idx=history.lastIndexOf(id); if(idx>=0)history.length=idx; setFocus(id,false);} };\n    c.appendChild(b);\n  });\n  if(history.length){const back=document.createElement('button');back.textContent='\u2190 back';\n    back.onclick=()=>{const prev=history.pop(); if(prev)setFocus(prev,false);};\n    c.insertBefore(back,c.firstChild);}\n  updateSidebarActive();\n}\n\n// ---- entity sidebar: every node, searchable, tagged with its relationship\n// count \u2014 click one to focus it, same as clicking its node in the graph ----\nconst SORTED_NODES=[...NODES].sort((a,b)=>a.id.localeCompare(b.id));\nconst entList=document.getElementById('entList');\nconst entCount=document.getElementById('entCount');\nfunction renderEntityList(filter){\n  const f=(filter||'').trim().toLowerCase();\n  const rows=f?SORTED_NODES.filter(n=>n.id.toLowerCase().includes(f)):SORTED_NODES;\n  entCount.textContent = f ? `${rows.length} of ${NODES.length} entities` : `${NODES.length} entities`;\n  entList.innerHTML='';\n  for(const n of rows){\n    const row=document.createElement('button');\n    row.className='s-row'+(n.id===focusId?' cur':''); row.dataset.id=n.id;\n    const sw=document.createElement('span'); sw.className='s-sw'; sw.style.background=colorOf(n.id);\n    const name=document.createElement('span'); name.className='s-name'; name.textContent=n.id;\n    const cnt=document.createElement('span'); cnt.className='s-count-badge'; cnt.textConte
