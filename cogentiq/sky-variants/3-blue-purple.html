    .fig-2b { height: 39%; right:  3%; top:  9%; }
    .fig-2c { height: 34%; right: 11%; top: 54%; }

    .tut-body {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; height: 100%;
      padding: 16px; gap: 4px;
    }
    .tut-name { color: var(--text-primary); }
    .tut-desc {
      color: var(--text-secondary); max-width: 19ch;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .tut-time {
      margin-top: auto; display: flex; align-items: center; gap: 6px;
      color: var(--text-teritiary);
    }
    .tut-time .ic { color: var(--text-teritiary); }

    /* The play badge is the card's affordance, so it fills in on hover
       rather than only brightening. */
    .tut-play {
      position: absolute; z-index: 1; top: 48px; right: 40px;
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255, 255, 255, .18);
      border: 1px solid rgba(255, 255, 255, .34);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      color: #fff;
      transition: background .18s ease, transform .18s ease;
    }
    .tut:hover .tut-play { background: rgba(255, 255, 255, .3); transform: scale(1.08); }

    /* ── The header, sitting on the sky ─────────────────────────── */
    .header.is-transparent {
      position: absolute; top: 0; left: 0; right: 0; z-index: 3;
      background: transparent; border-bottom: 0;
      transition: background .2s ease, border-color .2s ease;
      border-bottom: 1px solid transparent;
    }
    /* Once the page has moved, the header needs its own ground — the
       gradient has scrolled out from under it and the cards would
       otherwise pass through the type. */
    .header.is-transparent.is-stuck {
      background: color-mix(in srgb, var(--backgrounds-page-bg-3) 82%, transparent);
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      border-bottom-color: var(--strokes-line-3);
    }
    .header.is-transparent .icon-btn-32,
    .header.is-transparent .ws-dropdown { color: var(--text-secondary); }
    .header.is-transparent .header-left { color: var(--text-primary); }
    /* Centred on the page, not on what is left over after the two side
       groups — those are different widths, and the field would sit off
       centre if it were laid out between them. */
    .header-search {
      position: absolute; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 8px;
      width: 280px; height: 32px; padding: 0 8px;
      border-radius: 8px;
      background: color-mix(in srgb, var(--backgrounds-card-bg-2) 62%, transparent);
      border: 1px solid var(--strokes-type-default);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      color: var(--text-teritiary);
      transition: border-color .15s ease, background .15s ease;
    }
    .header-search:hover { background: color-mix(in srgb, var(--backgrounds-card-bg-2) 78%, transparent); }
    .header-search:focus-within { border-color: var(--strokes-type-focus); }
    .header-search input { flex: 1 1 auto; min-width: 0; color: var(--text-primary); }
    .header-search input::placeholder { color: var(--text-teritiary); }
    .header.is-transparent .icon-btn-32:hover,
    .header.is-transparent .ws-dropdown:hover {
      background: color-mix(in srgb, var(--backgrounds-card-bg-2) 55%, transparent);
    }

    /* While the header is still on the sky, the field is a dark chip in
       both modes and its ink comes with it. Light's sky is saturated
       colour too, and a white field there reads as a hole punched in
       the gradient rather than as something laid on it. Once the header
       is stuck it has its own ground back and everything here returns
       to the theme — which is why all of it is scoped to :not(.is-stuck)
       rather than written into the base. */
    .header.is-transparent:not(.is-stuck) .header-left { color: #fff; }
    .header.is-transparent:not(.is-stuck) .header-search {
      background: rgba(33, 33, 33, .58);
      border-color: rgba(255, 255, 255, .18);
      color: rgba(255, 255, 255, .62);
    }
    .header.is-transparent:not(.is-stuck) .header-search:hover {
      background: rgba(33, 33, 33, .74);
    }
    .header.is-transparent:not(.is-stuck) .header-search input {
      color: rgba(255, 255, 255, .94);
    }
    .header.is-transparent:not(.is-stuck) .header-search input::placeholder {
      color: rgba(255, 255, 255, .62);
    }

    /* ── Arrival ────────────────────────────────────────────────── */
    .hero > *, .ground-inner > * { animation: home-rise .55s ease-out backwards; }
    .hero > .hero-title        { animation-delay: .06s; }
    .ground-inner > .home-cards { animation-delay: .14s; }
    .ground-inner > .home-more  { animation-delay: .22s; }
    @keyframes home-rise {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .band { animation: none; transition: none; }
      .wave { animation: none; }
      .hero > *, .ground-inner > * { animation: none; }
      .rotor-word.is-out, .rotor-word.is-in { animation: none; }
      .rotor { transition: none; }
      .hero-card, .hero-go, .chip { transition: none; }
    }
  </style>

<script>
const $ = id => document.getElementById(id);

/* ═══════════════════════════════════════════════════════════════
   Platform panel — the same component the other Builder pages carry.
   Opens on hover or focus and lays itself over the page; one category
   expanded at a time.
   ═══════════════════════════════════════════════════════════════ */
const railEl = document.querySelector('.rail');

function setRailOpen(on) { railEl.classList.toggle('is-open', on); }

let railPeekTimer = null;
function railPeek(on) {
  clearTimeout(railPeekTimer);
  railPeekTimer = setTimeout(() => setRailOpen(on), on ? 120 : 220);
}
railEl.addEventListener('mouseenter', () => railPeek(true));
railEl.addEventListener('mouseleave', () => railPeek(false));
railEl.addEventListener('focusin', () => { clearTimeout(railPeekTimer); setRailOpen(true); });
railEl.addEventListener('focusout', e => {
  if (!railEl.contains(e.relatedTarget)) railPeek(false);
});
$('railCollapse').addEventListener('click', () => {
  clearTimeout(railPeekTimer);
  setRailOpen(false);
});

function railExposeOnly(group) {
  document.querySelectorAll('.rail-group[data-group]').forEach(g => {
    if (!g.querySelector('.rail-stack')) return;
    g.querySelector('.rail-ghead').setAttribute('aria-expanded', String(g === group));
  });
}
document.querySelectorAll('.rail-ghead').forEach(h => {
  h.addEventListener('click', () => {
    const group = h.closest('.rail-group');
    if (!group.querySelector('.rail-stack')) return;
    railExposeOnly(h.getAttribute('aria-expanded') === 'true' ? null : group);
  });
});
document.querySelectorAll('.rail-btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.rail-btn.is-active').forEach(x => {
      x.classList.remove('is-active');
      x.removeAttribute('aria-current');
    });
    b.classList.add('is-active');
    b.setAttribute('aria-current', 'page');
    railExposeOnly(b.closest('.rail-group'));
  });
});

/* Context Studio is sold separately; on this page it just carries the
   flag — the full offer lives where the catalogue pages mount it. */
document.querySelector('.rail-group[data-group="context-studio"]').classList.add('is-locked');
$('ctxStudio').title = 'Context Studio — not on your plan';
$('ctxStudio').addEventListener('click', e => e.stopPropagation());

/* ═══════════════════════════════════════════════════════════════
   Theme — dark is the design's default; the stored choice is shared
   with the rest of the Builder pages.
   ═══════════════════════════════════════════════════════════════ */
const root = document.documentElement;

function readStoredMode() {
  try { return localStorage.getItem('cq-theme'); } catch (e) { return null; }
}
function applyMode(mode) {
  root.dataset.mode = mode;
  const toLight = mode === 'dark';
  $('themeIcon').firstElementChild.setAttribute('href', toLight ? '#ic-sun' : '#ic-moon');
  const label = toLight ? 'Switch to light mode' : 'Switch to dark mode';
  $('themeToggle').title = label;
  $('themeToggle').setAttribute('aria-label', label);
}
$('themeToggle').addEventListener('click', () => {
  const next = root.dataset.mode === 'dark' ? 'light' : 'dark';
  applyMode(next);
  try { localStorage.setItem('cq-theme', next); } catch (e) { /* private mode */ }
});
applyMode(readStoredMode() === 'light' ? 'light' : 'dark');

/* The header is transparent over the gradient and opaque once the page
   has moved; 8px is enough to tell a settled page from a scrolled one. */
(function () {
  const scroller = $('homeScroll');
  const header = document.querySelector('.header.is-transparent');
  const sync = () => header.classList.toggle('is-stuck', scroller.scrollTop > 8);
  scroller.addEventListener('scroll', sync, { passive: true });
  sync();
})();

/* ═══════════════════════════════════════════════════════════════
   The sky's second clock. The bands drift on their own in CSS; this
   is the cursor's share of the movement — how far off centre the
   pointer is, expressed as a percentage the bands add to every colour
   stop at once. The whole spectrum sweeps sideways together, and the
   CSS transition on --multiplier does the easing.
   ═══════════════════════════════════════════════════════════════ */
(function () {
  const home  = $('home');
  const bands = $('heroBands');
  const sky   = $('heroSky');
  const scroller = $('homeScroll');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const REACH = 13;   /* the furthest the sweep goes, in stop-percent */

  function sweep(pct) {
    bands.style.setProperty('--multiplier', pct + '%');
  }

  /* The pointer's other job is the glyph field's, and it wants the
     cursor in the sky's own coordinates. The sky scrolls with the
     column, so its box is measured once and re-measured only when
     something can have moved it — a rect read on every pointermove
     would force layout at pointer rate. */
  let box = null;
  const measure = () => { box = sky.getBoundingClientRect(); };
  scroller.addEventListener('scroll', measure, { passive: true });
  window.addEventListener('resize', measure);
  measure();

  home.addEventListener('pointermove', e => {
    if (!box || !box.height) measure();
    const y = e.clientY - box.top;
    /* Only while the pointer is over the panel: past its bottom edge
       there is nothing left to light. */
    window.__glyphPointer(e.clientX - box.left, y, y >= 0 && y <= box.height);
    if (reduced.matches) return;
    const half = window.innerWidth / 2;
    sweep(Math.max(-REACH, Math.min(REACH, (e.clientX - half) / half * REACH)).toFixed(2));
  });
  /* Back to rest when the pointer leaves, so the panel is never left
     parked at an extreme — and nothing is left lit behind it. */
  home.addEventListener('pointerleave', () => { sweep(0); window.__glyphPointer(0, 0, false); });
})();

/* ═══════════════════════════════════════════════════════════════
   The glyph field.

   A lattice of small filled squares laid over the sky, each one
   choosing between three alphas of white by sampling a slow noise
   at its own position. The dots never move and never fade in; what
   travels is the boundary between the tones, which is what lets a
   field this dense animate without ever asking to be looked at.

   The engine is the one from Glyph Field Studio, carried over with
   its settings intact:

     shimmer          the noise is sampled in three dimensions, with
                      time as the third — no direction, just drift
     speed     0.40x  how fast time moves through it
     field     0.115  cells per unit of noise; the size of a cloud
     grain      22%   per-cell dither, so the tone edges break up
                      into dots instead of reading as contours
     cell       7px   the lattice
     element    44%   glyph size as a fraction of the cell
     tones   16 / 16  the share of the field at each of the top two
                      alphas; the remainder is the base whisper
     pointer     on   pulls the noise down inside ~170px, which
                      promotes everything under the cursor a tone

   Two things differ from the studio. The palette is three alphas of
   one white rather than three inks, since the field sits on colour
   here. And there is no shape mask — the studio gates the field to a
   silhouette; the sky wants it edge to edge.
   ═══════════════════════════════════════════════════════════════ */
(function () {
  const sky = $('heroSky');
  const cv  = $('heroGlyphs');
  if (!cv || !cv.getContext) return;
  const ctx = cv.getContext('2d', { alpha: true });

  const CELL = 7, ELEMENT = .44;
  /* The element is U+25A0, the filled square, and the studio draws it
     with fillText. Here it is drawn as the square it is. Its ink box
     in the studio's mono face is about 0.65 of the em, which at these
     numbers is 2px on a 7px lattice — exactly what the reference
     renders. Measuring the glyph instead would be the more faithful
     move if the measurement were worth anything: at a three-pixel
     font size the metrics quantise, and the face that answers for
     U+25A0 differs by platform, so the same page would come out with
     a different lattice on each. A constant is both the true shape
     and the stable one. */
  const INK = .65;
  const SPEED = .40, FIELD = .115, GRAIN = .22;
  const MIX = .16, MID = .16;      /* accent share, mid-tone share */
  const PULL = .85, REACH = 170;   /* the pointer's depth and radius, px */
  const SEED = 11.3;
  /* Past this the lattice coarsens a step at a time. A cell is a
     noise sample and a glyph draw, so the count is the frame budget;
     the panel is deep enough on a tall window to want the ceiling. */
  const BUDGET = 46000;

  /* ---- the noise, verbatim: a 3D value noise on a hashed lattice,
          two octaves deep ---- */
  function hash(x, y, z) {
    let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(z | 0, 1442695041);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967295;
  }
  function smooth(a) { return a * a * (3 - 2 * a); }
  function noise3(x, y, z) {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    const xf = smooth(x - xi), yf = smooth(y - yi), zf = smooth(z - zi);
    const c000 = hash(xi, yi, zi),         c100 = hash(xi + 1, yi, zi);
    const c010 = hash(xi, yi + 1, zi),     c110 = hash(xi + 1, yi + 1, zi);
    const c001 = hash(xi, yi, zi + 1),     c101 = hash(xi + 1, yi, zi + 1);
    const c011 = hash(xi, yi + 1, zi + 1), c111 = hash(xi + 1, yi + 1, zi + 1);
    const x00 = c000 + (c100 - c000) * xf, x10 = c010 + (c110 - c010) * xf;
    const x01 = c001 + (c101 - c001) * xf, x11 = c011 + (c111 - c011) * xf;
    const y0 = x00 + (x10 - x00) * yf, y1 = x01 + (x11 - x01) * yf;
    return y0 + (y1 - y0) * zf;
  }
  /* One octave of the noise along a whole row at once.
     x advances by `step` per column while the noise lattice is coarse
     against the cells — at a field scale of .115 one lattice cell
     spans nearly nine columns — so the eight corner hashes only
     change every few columns. Folding y and z in first collapses
     those eight into two values per lattice column, and walking the
     lattice across the row hands each step its predecessor's right
     edge. Every column then costs one lerp instead of eight hashes:
     the same numbers noise3 would return, for about a tenth of the
     work. */
  function octave(out, w, x0, step, y, z) {
    const yi = Math.floor(y), zi = Math.floor(z);
    const yf = smooth(y - yi), zf = smooth(z - zi);
    const edge = xi => {
      const a = hash(xi, yi, zi),     b = hash(xi, yi + 1, zi);
      const c = hash(xi, yi, zi + 1), d = hash(xi, yi + 1, zi + 1);
      const p = a + (b - a) * yf, q = c + (d - c) * yf;
      return p + (q - p) * zf;
    };
    let xi = Math.floor(x0), A = edge(xi), B = edge(xi + 1), x = x0;
    for (let c = 0; c < w; c++, x += step) {
      const nx = Math.floor(x);
      if (nx !== xi) {
        if (nx === xi + 1) { A = B; B = edge(nx + 1); }
        else { A = edge(nx); B = edge(nx + 1); }
        xi = nx;
      }
      out[c] = A + (B - A) * smooth(x - xi);
    }
  }

  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  let W = 0, H = 0, dpr = 1, cell = CELL, cols = 0, rows = 0;
  let dither = null, buckets = null, tone = ['', '', ''];
  let oct1 = null, oct2 = null;              /* one row of each octave */
  let colX = null, rowY = null;              /* each column's and row's edge */
  let side = 0;                              /* the square, in CSS px */
  let t = 0, last = 0, px = -1e5, py = -1e5, on = false, raf = 0;

  const bucket = n => ({ xs: new Float32Array(n), ys: new Float32Array(n), n: 0 });

  /* The three alphas live in the stylesheet with the rest of the
     tokens, so the mode toggle moves them the way it moves every
     other colour on the page. */
  function readTones() {
    const cs = getComputedStyle(document.documentElement);
    for (let i = 0; i < 3; i++) {
      const a = parseFloat(cs.getPropertyValue('--glyph-' + (i + 1))) || 0;
      tone[i] = 'rgba(255,255,255,' + a + ')';
    }
  }
  new MutationObserver(readTones).observe(document.documentElement, { attributes: true, attributeFilter: ['data-mode'] });

  function resize() {
    const r = sky.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    if (!W || !H) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);

    cell = CELL;
    cols = Math.max(4, Math.ceil(W / cell)); rows = Math.max(4, Math.ceil(H / cell));
    while (cols * rows > BUDGET) { cell += 1; cols = Math.ceil(W / cell); rows = Math.ceil(H / cell); }

    const n = cols * rows;
    dither = new Float32Array(n);
    for (let i = 0; i < n; i++) dither[i] = hash(i % cols, (i / cols) | 0, 91);
    buckets = [bucket(n), bucket(n), bucket(n)];
    oct1 = new Float32Array(cols); oct2 = new Float32Array(cols);
    readTones();

    /* Snapped to whole device pixels — position and size both. Two
       CSS pixels landing on a half-pixel boundary is a four-pixel
       grey smear, and a lattice of those reads as haze instead of as
       dots. Snapped, every square is the same square. */
    side = Math.max(1, Math.round(cell * ELEMENT * INK * dpr)) / dpr;
    const snap = v => Math.round(v * dpr) / dpr;
    colX = new Float32Array(cols); rowY = new Float32Array(rows);
    for (let c = 0; c < cols; c++) colX[c] = snap(c * cell + (cell - side) * .5);
    for (let r = 0; r < rows; r++) rowY[r] = snap(r * cell + (cell - side) * .5);
    draw();
  }

  function draw() {
    if (!cols || !rows) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    const pcx = on ? px / cell : -1e5, pcy = on ? py / cell : -1e5;
    const pr = Math.max(6, REACH / cell), pr2 = pr * pr;
    const z = t * .42 + SEED;
    const b0 = buckets[0], b1 = buckets[1], b2 = buckets[2];
    const t2 = MIX + MID, g2 = GRAIN * .55;
    b0.n = b1.n = b2.n = 0;

    for (let r = 0; r < rows; r++) {
      const ny = r * FIELD, cy = rowY[r], i0 = r * cols;
      octave(oct1, cols, 0, FIELD, ny, z);
      octave(oct2, cols, 5.2, FIELD * 2.13, ny * 2.13 - 3.7, z * 1.7);
      /* The pointer's pull dies at two radii; outside that band the
         row is the field alone. */
      const dy = r - pcy, dy2 = dy * dy;
      const span = on && dy2 < 4 * pr2 ? Math.sqrt(4 * pr2 - dy2) : -1;
      const lo = span < 0 ? cols : Math.max(0, Math.ceil(pcx - span));
      const hi = span < 0 ? cols : Math.min(cols, Math.floor(pcx + span) + 1);

      for (let c = 0; c < cols; c++) {
        let v = oct1[c] * .65 + oct2[c] * .35 + (dither[i0 + c] - .5) * g2;
        if (c >= lo && c < hi) {
          const dx = c - pcx, dd = (dx * dx + dy2) / pr2;
          if (dd < 4) v -= PULL * Math.exp(-dd * 1.6);
        }
        const b = v < MIX ? b0 : (v < t2 ? b1 : b2);
        b.xs[b.n] = colX[c]; b.ys[b.n] = cy; b.n++;
      }
    }

    /* Faintest first, so the bright tones land on top of their own
       neighbours rather than under them. */
    for (const k of [2, 1, 0]) {
      const b = buckets[k];
      if (!b.n) continue;
      ctx.beginPath();
      for (let q = 0; q < b.n; q++) ctx.rect(b.xs[q], b.ys[q], side, side);
      ctx.fillStyle = tone[k];
      ctx.fill();
    }
  }

  /* The noise crosses one lattice cell every six seconds at this
     speed, so a frame of the field is worth about as much as the one
     before it. Redrawing at thirty rather than sixty halves what the
     page spends on it and changes nothing anyone can see — including
     the pointer bloom, which lags by at most a frame. */
  const STEP = 1000 / 30;
  let drawn = 0;
  function loop(ts) {
    raf = requestAnimationFrame(loop);
    if (!last) last = ts;
    t += Math.min(.05, (ts - last) / 1000) * SPEED;
    last = ts;
    if (ts - drawn < STEP) return;
    drawn = ts;
    draw();
  }

  /* The pointer arrives from the sweep handler above, already in the
     sky's coordinates. Held still, the field is redrawn on the next
     frame anyway; stopped, it is redrawn once so the bloom clears. */
  window.__glyphPointer = (x, y, inside) => {
    px = x; py = y;
    if (inside === on && !inside) return;
    on = inside;
    if (!raf) draw();
  };

  const start = () => {
    if (reduced.matches) { draw(); return; }   /* the field, held still */
    if (!raf) { last = 0; raf = requestAnimationFrame(loop); }
  };
  const stop = () => { if (raf) { cancelAnimationFrame(raf); raf = 0; } };

  window.addEventListener('resize', resize);
  /* A tab in the background would keep the field on the main thread
     for nothing. */
  document.addEventListener('visibilitychange', () => { document.hidden ? stop() : start(); });
  reduced.addEventListener('change', () => { stop(); start(); });

  resize();
  start();
})();

/* ═══════════════════════════════════════════════════════════════
   The word that changes. The line is centred, so a word of a
   different length would jolt both halves of it; the span is measured
   and given a width to transition to, and the swap is timed to land
   as the new word arrives.
   ═══════════════════════════════════════════════════════════════ */
(function () {
  const WORDS = ['powerful', 'scalable', 'reliable', 'intelligent', 'yours'];
  const HOLD = 2600;   /* how long a word stays up */
  const OUT  = 340;    /* must match .rotor-word.is-out */

  const rotor = $('rotor'), word = $('rotorWord'), ghost = $('rotorGhost');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  let i = 0, timer = null;

  /* The ghost carries the same type as the word, so what it measures
     is what will be painted. */
  function widthOf(text) {
    ghost.textContent = text;
    return ghost.getBoundingClientRect().width;
  }

  function lock() { rotor.style.width = widthOf(word.textContent) + 'px'; }

  function next() {
    i = (i + 1) % WORDS.length;
    const text = WORDS[i];

    /* The box starts moving with the outgoing word, so the line has
       finished resizing by the time the new word lands. */
    rotor.style.width = widthOf(text) + 'px';
    word.classList.remove('is-in');
    word.classList.add('is-out');

    setTimeout(() => {
      word.textContent = text;
      word.classList.remove('is-out');
      word.classList.add('is-in');
    }, OUT);
  }

  function start() {
    clearInterval(timer);
    timer = setInterval(next, HOLD);
  }

  /* Fonts change the measurement, so lock the first width only once
     the real face is in — otherwise the span is sized to the fallback
     and jumps on the first swap. */
  function begin() {
    lock();
    if (!reduced.matches) start();
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(begin);
  else begin();

  /* A tab in the background still fires intervals in some engines and
     would queue a burst of swaps on return. */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) clearInterval(timer);
    else if (!reduced.matches) start();
  });

  window.addEventListener('resize', lock);
})();
</script>

<script>
/* ── Combined product · shared shell wiring ──────────────────────
   The platform rail and the light/dark switch belong to the product,
   not to any one page, so both are wired here: the rail routes to the
   sibling pages, and a theme picked on any page is the theme every
   other page opens in. */
(function () {
  var PAGES = {
    'home': 'index.html',
    'skills': 'skills.html',
    'skill': 'skills.html',
    'integrations': 'integrations.html',
    'model hub': 'model-hub.html',
    'doc store': 'doc-store.html'
  };
  var root = document.documentElement;
  var inShell = window.parent !== window;

  function go(url) {
    if (inShell) parent.postMessage({ cqNav: url }, '*');
    else window.location.href = url;
  }

  document.querySelectorAll('[aria-label="Platform"] button[title]').forEach(function (btn) {
    var url = PAGES[(btn.getAttribute('title') || '').trim().toLowerCase()];
    if (!url || btn.classList.contains('is-active')) return;
    btn.style.cursor = 'pointer';
    btn.addEventListener('click', function () { go(url); });
  });
  var brand = document.querySelector('.rail-brand, .cq-rail-brand');
  if (brand && !/index\.html$|\/cogentiq\/?$/.test(location.pathname)) {
    brand.style.cursor = 'pointer';
    brand.addEventListener('click', function () { go('index.html'); });
  }

  /* ── One theme across the product ──────────────────────────────
     Each page already owns a toggle that writes data-mode on <html>;
     watching that attribute picks up every page's own switch without
     reaching into its code. Standalone, the choice rides in
     localStorage; inside the shell, the shell holds it, because
     srcdoc frames each get their own opaque storage. */
  var THEME_KEY = 'cq-theme';
  var synced = null;

  function readStored() {
    try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; }
  }
  function writeStored(mode) {
    try { localStorage.setItem(THEME_KEY, mode); } catch (e) { /* private mode */ }
  }
  function paint(mode) {
    /* Claim the value before writing it: MutationObserver delivers on a
       microtask, so a flag set around the write would already be back
       to false by the time the callback ran, and the frame would echo
       the shell's own broadcast straight back at it. */
    synced = mode;
    if (root.dataset.mode === mode) return;
    if (typeof window.applyMode === 'function') window.applyMode(mode);
    else root.dataset.mode = mode;
  }

  new MutationObserver(function () {
    var mode = root.dataset.mode === 'light' ? 'light' : 'dark';
    if (mode === synced) return;
    synced = mode;
    writeStored(mode);
    if (inShell) parent.postMessage({ cqTheme: mode }, '*');
  }).observe(root, { attributes: true, attributeFilter: ['data-mode'] });

  window.addEventListener('message', function (e) {
    var mode = e.data && e.data.cqTheme;
    if (mode === 'light' || mode === 'dark') paint(mode);
  });

  if (inShell) parent.postMessage({ cqThemeRequest: true }, '*');
  else {
    var stored = readStored();
    if (stored === 'light' || stored === 'dark') paint(stored);
  }
})();
</script>
