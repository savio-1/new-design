<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- variant: Blue → Purple -->
  <title>Cogentiq Builder — Home</title>
  <meta name="description" content="Start anything on Cogentiq — an automation, an assistant, or a single building block." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400&display=swap" rel="stylesheet" />

  <style>
    /* ══════════════════════════════════════════════════════════════
       DESIGN VARIABLES — taken verbatim from the Figma library
       (Cogentiq · Builder, "Models- with tags", dark mode)
       ══════════════════════════════════════════════════════════════ */
    :root {
      /* Backgrounds ------------------------------------------------ */
      --backgrounds-page-bg-1:            #121212;
      --backgrounds-page-bg-2:            #212121;
      --backgrounds-page-bg-3:            #1b1b1b;
      --backgrounds-page-bg-4:            #121212;
      --backgrounds-card-bg-2:            #212121;
      --backgrounds-card-bg-3:            #323232;
      --backgrounds-card-bg-4:            #323232;
      --backgrounds-card-bg-5:            #1b1b1b;
      --backgrounds-table-select:         #0d193f;
      --backgrounds-type-search-default:  #121212;
      --backgrounds-button-primary:       #0d99ff;
      --backgrounds-button-tonal-1:       #093077;
      --backgrounds-button-hover-tonal-1: #0a4390;
      --backgrounds-seg-control-tabs-1:   #424242;
      --backgrounds-icon-blue-2:          #0d99ff33;
      --backgrounds-checkbox-default:     #1b1b1b;
      --backgrounds-checkbox-focus:       #0d99ff;
      --backgrounds-badge-blue:           #09112b;
      --backgrounds-badge-cyan:           #051b29;
      --backgrounds-badge-green:          #031d11;
      --backgrounds-badge-light-green:    #14280c;
      --backgrounds-table-default:         #121212;

      /* Strokes ---------------------------------------------------- */
      --strokes-card-default:   #424242;
      --strokes-card-selected:  #0d99ff;
      --strokes-type-default:   #424242;
      --strokes-type-focus:     #007be5;
      --strokes-line-1:         #424242;
      --strokes-line-3:         #323232;
      --strokes-icon-default:   #9e9e9e;
      --strokes-checkbox-default: #616161;
      --strokes-checkbox-focus: #0d99ff;
      --strokes-colour-blue:        #093077;
      --strokes-colour-cyan:        #093c53;
      --strokes-colour-light-green: #214314;

      /* Text ------------------------------------------------------- */
      --text-primary:              #ffffff;
      --text-secondary:            #bdbdbd;
      --text-teritiary:            #8c8c8c;
      --text-coloured-blue:        #44aaf3;
      --text-coloured-indigo:      #a0a5f7;
      --text-coloured-green:       #85e0a3;
      --text-coloured-cyan:        #35caf0;
      --text-coloured-light-green: #7cb342;
      --text-button-white:   #ffffff;
      --text-button-tonal-1: #80caff;
      --text-button-tonal-2: #bdbdbd;

      /* Radii and one ramp constant the platform panel needs. --white
         is a palette value, not a theme colour: it is white in both
         modes, which is what a glyph sitting on a coloured tile wants. */
      --radius-md: 8px;
      --radius-lg: 12px;
      --white: #ffffff;

      /* ══════════════════════════════════════════════════════════════
         PALETTE — the complete ramps, imported from the Figma library
         export (Colours_latest · Light.tokens.json / Dark.tokens.json).
         Palette values are mode-independent: a ramp step is the same
         hex in both themes, and it is the semantic tokens above that
         choose which step a surface uses. Everything on this page —
         the rail tiles and the hero gradient alike — is mixed from
         these and nothing else.
         ══════════════════════════════════════════════════════════════ */
      --grey-50: #fafafa;   --grey-100: #f5f5f5;  --grey-150: #f0f0f0;
      --grey-200: #eeeeee;  --grey-300: #e0e0e0;  --grey-350: #d4d4d4;
      --grey-400: #bdbdbd;  --grey-500: #9e9e9e;  --grey-550: #8c8c8c;
      --grey-600: #757575;  --grey-700: #616161;  --grey-750: #545454;
      --grey-800: #424242;  --grey-850: #323232;  --grey-900: #212121;
      --grey-950: #1b1b1b;  --grey-1000: #121212;

      --blue-100: #f2f9ff;  --blue-200: #e5f4ff;  --blue-300: #bde3ff;
      --blue-400: #80caff;  --blue-450: #44aaf3;  --blue-500: #0d99ff;
      --blue-600: #007be5;  --blue-700: #0768cf;  --blue-800: #034ac1;
      --blue-900: #093077;  --blue-1000: #0d193f; --blue-1100: #09112b;

      --purple-100: #f9f5ff;  --purple-200: #f1e5ff;  --purple-300: #e4ccff;
      --purple-400: #d9b8ff;  --purple-450: #bb7fff;  --purple-500: #9747ff;
      --purple-600: #8638e5;  --purple-700: #7c2bda;  --purple-800: #681abb;
      --purple-900: #4b0d87;  --purple-1000: #2d0f46; --purple-1100: #1d0a2c;

      --pink-100: #fff2f6;  --pink-200: #ffdbe7;  --pink-300: #f8abc5;
      --pink-400: #f04d84;  --pink-500: #e91e63;  --pink-600: #d81b60;
      --pink-700: #c2185b;  --pink-800: #a11452;  --pink-900: #7d0e49;
      --pink-1000: #460829; --pink-1100: #280518;

      --cyan-100: #effcff;  --cyan-200: #cef0f8;  --cyan-300: #b6ecf7;
      --cyan-400: #75d7f0;  --cyan-450: #35caf0;  --cyan-500: #00a2c2;
      --cyan-600: #0087a8;  --cyan-700: #047195;  --cyan-800: #085a78;
      --cyan-900: #093c53;  --cyan-1000: #0e2f43; --cyan-1100: #0b2433;

      --indigo-100: #f4f5ff;  --indigo-200: #dbddfc;  --indigo-300: #c2c5fa;
      --indigo-400: #a0a5f7;  --indigo-450: #878efc;  --indigo-500: #5860ed;
      --indigo-600: #454de0;  --indigo-700: #373fc4;  --indigo-800: #292fa3;
      --indigo-900: #1d2280;  --indigo-1000: #121654; --indigo-1100: #0c0e35;

      --green-100: #ebffee;  --green-200: #cff7d3;  --green-300: #aff4c6;
      --green-400: #85e0a3;  --green-500: #14ae5c;  --green-600: #009951;
      --green-700: #008043;  --green-800: #036838;  --green-900: #024626;
      --green-1000: #083a23; --green-1100: #052416;

      --red-100: #fff5f5;  --red-200: #ffe2e0;  --red-300: #ffc7c2;
      --red-400: #ffafa3;  --red-500: #f24822;  --red-600: #dc3412;
      --red-700: #bd2915;  --red-800: #9f1f18;  --red-900: #771208;
      --red-1000: #660e0b; --red-1100: #3f0907;

      --yellow-100: #fff8e1;  --yellow-200: #ffecb3;  --yellow-300: #ffe082;
      --yellow-400: #ffd54f;  --yellow-500: #ffca28;  --yellow-600: #ffc107;
      --yellow-700: #ffb300;  --yellow-800: #ffa000;  --yellow-900: #ff8f00;
      --yellow-950: #b16300;  --yellow-1000: #683a00; --yellow-1100: #392000;

      --lgreen-50: #f1f8e9;   --lgreen-100: #dcedc8;  --lgreen-200: #c5e1a5;
      --lgreen-300: #aed581;  --lgreen-400: #9ccc65;  --lgreen-500: #8bc34a;
      --lgreen-600: #7cb342;  --lgreen-700: #689f38;  --lgreen-800: #558b2f;
      --lgreen-900: #33691e;  --lgreen-1000: #214314; --lgreen-1100: #14280c;

      --orange-100: #fff4e5;  --orange-200: #ffe0c2;  --orange-300: #fcd19c;
      --orange-400: #ffc470;  --orange-500: #ffa629;  --orange-600: #fc9e24;
      --orange-700: #f79722;  --orange-800: #dd7c0e;  --orange-900: #ce7012;
      --orange-950: #8a480f;  --orange-1000: #502500; --orange-1100: #241101;

      --flag-sheen: rgba(255, 255, 255, .30);
      --coach-sheen: rgba(255, 255, 255, .28);

      /* Two badge families the Figma library does not yet publish a
         token for; derived in the same key as the published pairs so
         the tag palette stays consistent. */
      --backgrounds-badge-indigo: #0b0f2e;
      --strokes-colour-indigo:    #2b3180;
      --strokes-colour-green:     #0a3a22;

      /* Type ------------------------------------------------------- */
      --font-geist: "Geist", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-geist-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --fs-caption:  12px;   /* Type/Font Size/Body/Caption */
      --fs-body-3:   14px;   /* Type/Font Size/Body/Body 3 */
      --fs-body-2:   16px;   /* Type/Font Size/Body/Body 2 */
      --lh-body-2:   24px;   /* Type/Line Height/Body/Body 2 */
      --lh-body-3:   20px;   /* Type/Line Height/Body/Body 3 */

      /* Effects ---------------------------------------------------- */
      --strokes-canvas-dots: #323232;
      --shadow-sidebar: drop-shadow(1px 0 1px rgba(18, 18, 18, .12));
      --shadow-bar:     drop-shadow(0 1px 1px rgba(18, 18, 18, .12));
      --shadow-card:    drop-shadow(0 1px 1.5px rgba(18, 18, 18, .16));
      --shadow-panel:   -8px 0 24px rgba(0, 0, 0, .2);
      --shadow-rail:    8px 0 28px rgba(0, 0, 0, .38);
      --shadow-pop:     0 -1px 2px rgba(0, 0, 0, .04), 0 4px 8px rgba(0, 0, 0, .12), 0 2px 16px rgba(33, 33, 33, .16);
      /* The Tiq bar floats over the panel it belongs to, so it needs to
         separate from a surface that is already dark. A shadow tuned for
         white ground all but disappears here; this one is deliberately
         heavier than --shadow-pop. */
      /* Carries the Marketplace pill past where its fixed-size art reaches.
         The art is sized for the 36px tile, so at 208px the right end runs
         out; Figma's pill stays blue across because of a Gradient/blue fill
         that codegen returns empty. Transparent under the art, so the tile
         that was already pixel-matched is untouched. Light is sampled from
         the component; dark is derived in the art's own family — replace it
         if a dark variant of the panel gets drawn. */
      --gradient-blue-wash: linear-gradient(90deg, rgba(62, 99, 116, 0) 46%, rgba(62, 99, 116, 1) 86%);
      --shadow-tiq:     0 2px 6px rgba(0, 0, 0, .40), 0 14px 32px rgba(0, 0, 0, .52), 0 28px 64px rgba(0, 0, 0, .40);
      --shadow-tab:     0 1px 2px rgba(33, 33, 33, .2);

      --backgrounds-type-default-bg-1: #323232;
      --backgrounds-type-default-bg-2: #323232;
      --backgrounds-disabled-tonal-1:  #093077;
      --backgrounds-disabled-tonal-2:  #424242;
      --text-disabled-tonal-1: #0768cf;
      --text-disabled-tonal-2: #757575;
      --shadow-modal: 0 4px 12px rgba(33, 33, 33, .16);
      --scrim: rgba(18, 18, 18, .6);

      /* The exported OpenAI mark is a single shape; it inverts per theme. */
      --logo-openai: #ffffff;

      /* Layout constants straight off the frame -------------------- */
      --rail-w:    68px;
      --rail-w-open: 240px;
      --sidebar-w: 240px;
      --panel-w:   420px;
      --tiq-dock-w: 360px;
      --card-h:    120px;
    }


    /* ══════════════════════════════════════════════════════════════
       LIGHT MODE — the same Figma variables in their light values.
       Dark is the default, as designed; the header toggle stamps
       data-mode="light" on the root element to switch.
       ══════════════════════════════════════════════════════════════ */
    :root[data-mode="light"] {
      /* Backgrounds */
      --backgrounds-page-bg-1:            #fafafa;
      --backgrounds-page-bg-2:            #ffffff;
      --backgrounds-page-bg-3:            #f5f5f5;
      --backgrounds-page-bg-4:            #f0f0f0;
      --backgrounds-card-bg-2:            #ffffff;
      --backgrounds-card-bg-3:            #ffffff;
      --backgrounds-card-bg-4:            #f5f5f5;
      --backgrounds-card-bg-5:            #ffffff;
      --backgrounds-table-select:         #e5f4ff;
      --backgrounds-type-search-default:  #f5f5f5;
      --backgrounds-button-primary:       #0d99ff;
      --backgrounds-button-tonal-1:       #e5f4ff;
      --backgrounds-button-hover-tonal-1: #bde3ff;
      --backgrounds-seg-control-tabs-1:   #eeeeee;
      --backgrounds-icon-blue-2:          #0d99ff33;
      --backgrounds-checkbox-default:     #ffffff;
      --backgrounds-checkbox-focus:       #0d99ff;
      --backgrounds-badge-blue:           #f2f9ff;
      --backgrounds-badge-cyan:           #effcff;
      --backgrounds-badge-green:          #ebffee;
      --backgrounds-badge-light-green:    #f1f8e9;
      /* No light value is published for this token; the component's
         own fallback in the exported markup is white. */
      --backgrounds-table-default:         #ffffff;

      /* Strokes */
      --strokes-card-default:     #eeeeee;
      --strokes-card-selected:    #0d99ff;
      --strokes-type-default:     #e0e0e0;
      --strokes-type-focus:       #0d99ff;
      --strokes-line-1:           #eeeeee;
      --strokes-line-3:           #f5f5f5;
      --strokes-icon-default:     #616161;
      --strokes-checkbox-default: #bdbdbd;
      --strokes-checkbox-focus:   #0d99ff;
      --strokes-colour-blue:        #e5f4ff;
      --strokes-colour-cyan:        #cef0f8;
      --strokes-colour-light-green: #c5e1a5;

      /* Text */
      --text-primary:              #121212;
      --text-secondary:            #616161;
      --text-teritiary:            #8c8c8c;
      --text-coloured-blue:        #0d99ff;
      --text-coloured-indigo:      #5860ed;
      --text-coloured-green:       #14ae5c;
      --text-coloured-cyan:        #00a2c2;
      --text-coloured-light-green: #689f38;
      --text-button-white:   #ffffff;
      --text-button-tonal-1: #007be5;
      --text-button-tonal-2: #757575;

      /* Derived pairs, keyed off the palette like the published ones */
      --backgrounds-badge-indigo: #f0f1fe;
      --strokes-colour-indigo:    #c2c5fa;
      --strokes-colour-green:     #aff4c6;

      /* Effects */
      --strokes-canvas-dots: #d4d4d4;
      --shadow-sidebar: drop-shadow(1px 0 1px rgba(18, 18, 18, .06));
      --shadow-bar:     drop-shadow(0 1px 1px rgba(18, 18, 18, .06));
      --shadow-card:    drop-shadow(0 1px 1.5px rgba(18, 18, 18, .08));
      --shadow-panel:   -8px 0 24px rgba(18, 18, 18, .12);
      --shadow-rail:    8px 0 28px rgba(18, 18, 18, .14);
      --shadow-pop:     0 -1px 2px rgba(0, 0, 0, .04), 0 4px 8px rgba(18, 18, 18, .08), 0 2px 16px rgba(33, 33, 33, .10);
      --gradient-blue-wash: linear-gradient(90deg, rgba(188, 235, 249, 0) 46%, rgba(188, 235, 249, 1) 86%);
      --flag-sheen: rgba(13, 153, 255, .28);
      --coach-sheen: rgba(13, 153, 255, .30);
      --shadow-tiq:     0 2px 6px rgba(18, 18, 18, .06), 0 12px 28px rgba(18, 18, 18, .14), 0 24px 56px rgba(33, 33, 33, .10);
      --shadow-tab:     0 1px 2px rgba(33, 33, 33, .12);

      --backgrounds-type-default-bg-1: #f5f5f5;
      --backgrounds-type-default-bg-2: #ffffff;
      --backgrounds-disabled-tonal-1:  #e5f4ff;
      --backgrounds-disabled-tonal-2:  #eeeeee;
      /* Text/Disabled/Tonal-1 publishes no light value; keyed off Blue/400
         the way the dark pair is keyed off its own ramp. */
      --text-disabled-tonal-1: #80caff;
      --text-disabled-tonal-2: #bdbdbd;
      --shadow-modal: 0 4px 12px rgba(33, 33, 33, .12);
      --scrim: rgba(18, 18, 18, .45);

      --logo-openai: #121212;
    }

    /* Body1/Med, Body2/Reg … as reusable type ramps */
    .t-subhead1-med { font: 500 24px/32px var(--font-geist); letter-spacing: -0.96px; }
    .t-subhead2-med { font: 500 18px/24px var(--font-geist); letter-spacing: -0.72px; }
    .t-body1-med    { font: 500 var(--fs-body-2)/var(--lh-body-2) var(--font-geist); letter-spacing: -0.64px; }
    .t-body2-med    { font: 500 var(--fs-body-3)/var(--lh-body-3) var(--font-geist); letter-spacing: -0.56px; }
    .t-body2-reg    { font: 400 var(--fs-body-3)/var(--lh-body-3) var(--font-geist); letter-spacing: -0.56px; }
    .t-caption1-med { font: 500 var(--fs-caption)/var(--fs-body-2) var(--font-geist); letter-spacing: -0.24px; }
    .t-caption1-reg { font: 400 var(--fs-caption)/var(--fs-body-2) var(--font-geist); letter-spacing: -0.24px; }

    /* ══════════════════════════════════════════════════════════════
       RESET
       ══════════════════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--backgrounds-page-bg-1);
      color: var(--text-primary);
      font-family: var(--font-geist);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    input  { font: inherit; color: inherit; background: none; border: 0; outline: 0; }
    .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    .ic { display: block; flex: none; }

    /* ══════════════════════════════════════════════════════════════
       APP SHELL   (Figma frame "Models" · 1440 × 820)
       ══════════════════════════════════════════════════════════════ */
    .app {
      display: flex; height: 100vh; padding-left: var(--rail-w);
      background: var(--backgrounds-page-bg-1);
    }

    /* ── Platform panel (left rail) ─────────────────────────────
       Two variants of one component: crunched at 68px and opened at
       240px. Content width is the only real difference — 36px vs 208px
       — so the same rules drive both and the labels simply appear. Each
       row is `justify-content: center` with 8px padding, which puts the
       icon at x=10 in a 36px box and at x=8 once a label flexes beside
       it: exactly the two positions the component specifies. ───────── */
    /* Fixed, and the page keeps a constant 68px gutter for it, so opening
       the panel lays it over the content instead of reflowing the whole
       page for a hover. Above the scrim so it stays reachable while the
       detail panel is open, below the Tiq bar. */
    .rail {
      position: fixed; left: 0; top: 0; bottom: 0; z-index: 80;
      width: var(--rail-w);
      background: var(--backgrounds-page-bg-1);
      display: flex; flex-direction: column; align-items: stretch; gap: 16px;
      padding: 8px 16px;
      overflow-x: hidden; overflow-y: auto;
      transition: width .26s cubic-bezier(.4, 0, .2, 1), box-shadow .26s ease;
    }
    .rail.is-open { width: var(--rail-w-open); box-shadow: var(--shadow-rail); }
    .rail::-webkit-scrollbar { width: 0; }

    /* Labels are laid out at their real width the whole time and clipped
       by the rail; animating width instead would reflow every row. */
    .rail-lbl {
      flex: 1 1 auto; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      text-align: left;
      font: 400 var(--fs-body-3)/var(--lh-body-3) var(--font-geist); letter-spacing: -0.56px;
      color: var(--text-primary);
    }
    .rail:not(.is-open) .rail-lbl { display: none; }

    /* ── Header: logo, wordmark, collapse ── */
    .rail-head {
      flex: none; display: flex; align-items: center; justify-content: space-between;
      gap: 6px; padding: 8px 0;
    }
    .rail-brand { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1 1 auto; }
    .rail:not(.is-open) .rail-brand { justify-content: center; }
    .rail-logo {
      position: relative; flex: none;
      width: 32px; height: 32px; border-radius: 100px; overflow: hidden;
      background: var(--backgrounds-page-bg-2);
      display: flex; align-items: center; justify-content: center;
      color: var(--strokes-icon-default);
    }
    .rail-wordmark {
      font: 500 18px/24px var(--font-geist); letter-spacing: -0.72px;
      color: var(--text-primary);
    }
    .rail-collapse {
      flex: none; width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
      color: var(--strokes-icon-default);
      transition: color .15s ease;
    }
    .rail-collapse:hover { color: var(--text-primary); }
    .rail:not(.is-open) .rail-collapse { display: none; }

    .rail-group { display: flex; flex-direction: column; align-items: stretch; gap: 12px; }

    /* ── Marketplace ── */
    .rail-market {
      position: relative;
      width: 100%; height: 36px; flex: none;
      border-radius: 8px; overflow: hidden;
      background: var(--backgrounds-card-bg-3);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 0 12px;
    }
    .rail:not(.is-open) .rail-market { padding: 0; }
    /* Opened only: at 36px the art already fills the tile. */
    .rail.is-open .rail-market { background-image: var(--gradient-blue-wash); }
    .rail-market .bg { position: absolute; inset: 0; overflow: hidden; }
    .rail-market .bg svg { position: absolute; }
    .rail-market .mark { position: relative; flex: none; width: 24px; height: 15.6px; }
    .rail-market .rail-lbl { position: relative; font-weight: 500; }
    /* Zero-height in the component, with the stroke drawn above it — a 1px
       box here would add a row and push everything below out of rhythm. */
    .rail-rule { position: relative; width: 100%; height: 0; flex: none; }
    .rail-rule::before {
      content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 1px;
      background: var(--strokes-line-1);
    }

    /* ── Items ── */
    .rail-btn {
      width: 100%; height: 36px; flex: none;
      border-radius: 8px; padding: 8px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      color: var(--strokes-icon-default);
      transition: background .15s ease, color .15s ease;
    }
    .rail-btn > .ic { flex: none; }
    /* Hover draws a rectangle, not just a fill — at 68px the icons have
       no labels to hit-test against, so the row needs to say where it
       begins and ends. The border comes out of the padding exactly as it
       does on an active item, so nothing shifts by a pixel. */
    .rail-btn:hover {
      background: var(--backgrounds-card-bg-4);
      border: 1px solid var(--strokes-card-default);
      padding: 7px;
      color: var(--text-secondary);
    }
    .rail-btn.is-active {
      background: var(--backgrounds-button-tonal-1);
      /* Figma strokes sit inside the box, so the padding absorbs the border
         and the icon stays on the same 8px line as every other item. */
      border: 1px solid var(--strokes-card-selected);
      padding: 7px;
      color: var(--text-coloured-blue);
    }
    .rail-btn.is-active .rail-lbl { color: var(--text-coloured-blue); font-weight: 500; }
    .rail-stack { display: flex; flex-direction: column; align-items: stretch; }

    /* ── Group header ── */
    .rail-ghead {
      position: relative;
      width: 100%; height: 24px; flex: none;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    /* A category header is 24px of tile and label with no box of its own,
       and it is a control. The rectangle is drawn by a pseudo-element
       rather than by padding a fixed-height row, so it can overhang the
       24px without touching layout — and the children are lifted above
       it, since a positioned pseudo would otherwise paint over them. */
    .rail-ghead::before {
      content: ""; position: absolute; inset: -6px -8px; z-index: 0;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      transition: background .15s ease, border-color .15s ease;
    }
    .rail-ghead:hover::before {
      background: var(--backgrounds-card-bg-4);
      border-color: var(--strokes-card-default);
    }
    .rail-ghead > * { position: relative; z-index: 1; }
    .rail-tile {
      flex: none;
      width: 24px; height: 24px; border-radius: 6px; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      color: var(--white);
    }
    .rail-ghead .rail-lbl { font-weight: 500; }
    .rail-chev {
      flex: none; color: var(--text-teritiary);
      transition: transform .22s cubic-bezier(.4, 0, .2, 1);
    }
    .rail-ghead[aria-expanded="true"] .rail-chev { transform: rotate(180deg); }
    .rail:not(.is-open) .rail-chev { display: none; }
    /* Collapsing a group hides its items at either width — the crunched
       panel shows a collapsed group as its tile alone, same as opened. */
    .rail-ghead[aria-expanded="false"] + .rail-stack { display: none; }

    /* ── Context Studio: a category with no children ─────────────
       It sits at category level rather than inside Library because it is
       an offering in its own right — and because a top-level row is the
       only one the one-open-category rule can never hide. Every Build or
       Library child collapses away; this one is always on screen, which
       is what a separate offering needs. */
    .rail-ghead--leaf { position: relative; }
    .rail-tile-wrap { position: relative; flex: none; display: flex; }

    /* Locked, the tile stays full colour. A greyed-out tile reads "not for
       you"; the point here is the opposite. The dot does the work instead
       — and it has to, because the panel is crunched by default, where a
       label-row pill would never be seen. */
    .rail-dot {
      display: none;
      position: absolute; top: -2px; right: -2px;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--text-coloured-blue);
      box-shadow: 0 0 0 2px var(--backgrounds-page-bg-1);
    }
    /* The pill carries the Context tile's own gradient rather than the
       generic blue badge, so the row's two coloured things read as one
       offering instead of two unrelated accents. The gradient is static
       here even though the tile's turns: two rotations six pixels apart
       is noise, and the pill already has its own motion in the sheen
       below. No border — a stroke on a saturated fill only muddies it,
       and dropping it buys the 1px back as padding. */
    .rail-flag {
      display: none;
      position: relative; overflow: hidden;
      flex: none; height: 18px; padding: 0 8px; border-radius: 9px;
      align-items: center;
      background-image: linear-gradient(42.56deg, var(--purple-400) 11.95%, var(--blue-500) 60.99%, var(--blue-600) 110.04%);
      color: var(--text-button-white);
      font: 500 11px/1 var(--font-geist); letter-spacing: -0.11px;
    }
    /* A glint that crosses the pill every few seconds, with a long hold
       between passes. Constant motion in a nav panel is nagging; one
       periodic pass reads as emphasis and then gets out of the way. */
    .rail-flag::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(100deg, transparent 32%, var(--flag-sheen) 50%, transparent 68%);
      transform: translateX(-100%);
      animation: railFlagSheen 3.4s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes railFlagSheen {
      0%, 58% { transform: translateX(-100%); }
      100%    { transform: translateX(200%); }
    }

    .rail-group.is-locked .rail-dot { display: block; }
    .rail-group.is-locked .rail-flag { display: inline-flex; }
    .rail:not(.is-open) .rail-flag { display: none; }

    /* ── Where Context Studio sits ───────────────────────────────
       Still being chosen, so every candidate ships and the panel
       switches between them with data-cs. One row, one set of
       listeners, nothing to keep in sync.
         inline — A · in category order, between Build and Library
         after  — B · past the last category, under a rule
         footer — C · the same row, dropped to the foot of the panel
         card   — D · past the last category, boxed, with a one-liner
         open   — F · in category order, opened into its six blocks
       A reads Context Studio as a peer of the categories. B, C and D
       read it as an offering of its own — by rule, by position, by
       card. F stops arguing about the row altogether and shows what is
       inside it. (E, which sat it at the top beside Marketplace, was
       withdrawn; the letters are not re-used, so F stays F.) */
    .rail-rule--cs { display: none; }
    .rail[data-cs="after"] .rail-rule--cs,
    .rail[data-cs="footer"] .rail-rule--cs { display: block; }
    .rail[data-cs="after"] .rail-group[data-group="context-studio"],
    .rail[data-cs="footer"] .rail-group[data-group="context-studio"],
    .rail[data-cs="card"] .rail-group[data-group="context-studio"] { order: 1; }
    /* Spare height collects above the rule, so the row lands on the foot
       of the panel and the rule travels down with it. A short viewport
       has no spare height to give, and C becomes B rather than scroll. */
    .rail[data-cs="footer"] .rail-group[data-group="context-studio"] { margin-top: auto; }

    /* F · opened into its blocks. The chevron exists only where there is
       something to disclose: everywhere else Context Studio is a
       destination, and a chevron would promise a list that is not
       there. The list itself is built in script rather than hidden in
       the markup — see setCsBlocks. */
    .rail-chev--cs { display: none; }
    .rail.is-open[data-cs="open"] .rail-chev--cs { display: block; }

    /* D · a box instead of a rule. The same row in the same place as B,
       lifted onto the card fill the Marketplace pill already uses, with a
       line of copy under it. The box does the separating a rule would,
       and the line answers "what is it" before the click instead of
       after — at the cost of the panel's evenness, since it is then the
       only thing in the list that is not a row. */
    /* Opened only: crunched, the box has no line of copy to hold, and a
       36px card around a 24px tile read as a button that goes nowhere —
       so at 68px the row is a plain tile like every other category. */
    .rail.is-open[data-cs="card"] #ctxStudio {
      height: auto; flex-wrap: wrap; row-gap: 6px;
      /* card/bg-4 is the one fill that reads as a raised grey against the
         rail's ground in both themes: bg-3, which the Marketplace pill
         uses, goes white in light, and page/bg-3 all but vanishes in
         dark. In dark the two are the same value, so the rail still has
         one box colour. */
      background: var(--backgrounds-card-bg-4);
      border: 1px solid var(--strokes-card-default);
      border-radius: 10px;
      /* 7 + the 1px border lands the tile on the same 8px line the items
         indent their icons to — Figma strokes sit inside the box, so the
         border comes out of the padding. */
      padding: 7px;
    }
    /* The line is the point of D, and it needs the label's width to
       read, so it goes when the labels do. */
    .rail-cs-note {
      display: none;
      flex: 0 0 100%; text-align: left;
      color: var(--text-teritiary);
      font: 400 11px/15px var(--font-geist); letter-spacing: -0.11px;
    }
    .rail.is-open[data-cs="card"] .rail-cs-note { display: block; }
    /* In D the box is already the rectangle, so the hover one would be a
       second border 7px inside the first. The box takes the hover
       instead. */
    .rail.is-open[data-cs="card"] #ctxStudio::before { content: none; }
    .rail.is-open[data-cs="card"] #ctxStudio:hover {
      border-color: var(--strokes-icon-default);
    }
    /* The dot's ring is the surface behind it, and in D that is the box. */
    .rail.is-open[data-cs="card"] .rail-dot { box-shadow: 0 0 0 2px var(--backgrounds-card-bg-4); }

    /* ── Upsell, anchored beside the panel like the Tiq bar ─────── */
    /* 520px: the preview inside is a full-size clip scaled to fit, so
       every extra pixel of card is a pixel of legible caption. The
       card's own type stays at token sizes — only the media grows,
       which is the part that was too small to read.
       The stack sets no gap of its own. A heading and the line it
       introduces want to sit closer together than either wants to sit
       to the media above or the buttons below, so each slot states its
       own space rather than sharing one rhythm. */
    .upsell {
      position: fixed; z-index: 95; width: 520px;
      display: none; flex-direction: column; gap: 0;
      padding: 20px;
      background: var(--backgrounds-card-bg-2);
      border: 1px solid var(--strokes-line-3);
      border-radius: 16px;
      box-shadow: var(--shadow-tiq);
      opacity: 0; transform: translateY(-4px) scale(.98);
      transition: opacity .16s ease, transform .2s cubic-bezier(.2,.8,.2,1);
    }
    .upsell.is-open { display: flex; }
    .upsell.is-shown { opacity: 1; transform: none; }
    .upsell-media {
      position: relative;
      aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden;
      background: var(--backgrounds-page-bg-1);
      border: 1px solid var(--strokes-line-3);
      display: flex; align-items: center; justify-content: center;
    }
    .upsell-play {
      width: 42px; height: 42px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: var(--backgrounds-card-bg-2);
      border: 1px solid var(--strokes-line-3);
      color: var(--text-secondary);
    }
    .upsell-media-note {
      position: absolute; left: 10px; bottom: 8px;
      color: var(--text-teritiary);
      font: 400 11px/1 var(--font-geist-mono);
    }
    /* ── Expand, and the big view it opens ─────────────────────── */
    /* Even at 520px the clip is running at about a third of the size it
       was composed for, and the labels inside it are the part that
       suffers. The button sits over the media's own top-right corner
       rather than in the card's chrome, because what it enlarges is the
       frame, not the offer. Its colours are literals, not tokens: the
       media behind it is the clip's own ink-night in both themes, so a
       token that flips with the theme would be wrong in one of them.
       Painted at all times, only quietened — a control that does not
       exist until the pointer finds it is one most people never find. */
    .upsell-expand {
      position: absolute; top: 8px; right: 8px; z-index: 2;
      width: 28px; height: 28px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(10, 13, 24, .58);
      border: 1px solid rgba(255, 255, 255, .18);
      color: #fff; opacity: .6;
      transition: opacity .14s ease, background .14s ease, transform .14s ease;
    }
    .upsell-media:hover .upsell-expand { opacity: 1; }
    .upsell-expand:hover { background: rgba(10, 13, 24, .86); transform: scale(1.06); }
    .upsell-expand:focus-visible {
      opacity: 1; outline: 2px solid var(--backgrounds-button-primary); outline-offset: 2px;
    }

    /* The big view is the same clip in a bigger box, not a second
       composition: the stage is as much 16:9 as the window will give
       it, and the scale-to-fit below does the rest. min() takes the
       height constraint as a width, so a short window shrinks the
       stage rather than cropping it. */
    .filmbox {
      position: fixed; inset: 0; z-index: 200;
      display: none; align-items: center; justify-content: center;
      padding: 40px;
      background: rgba(8, 10, 18, .74);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      opacity: 0; transition: opacity .18s ease;
    }
    .filmbox.is-open { display: flex; }
    .filmbox.is-shown { opacity: 1; }
    .filmbox-stage {
      position: relative;
      width: min(1280px, 100%, calc((100vh - 80px) * 16 / 9));
      aspect-ratio: 16 / 9;
      border-radius: var(--radius-lg); overflow: hidden;
      background: #080c1a;
      border: 1px solid var(--strokes-line-3);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .55);
      transform: scale(.97);
      transition: transform .2s cubic-bezier(.2,.8,.2,1);
    }
    .filmbox.is-shown .filmbox-stage { transform: none; }
    /* Same literals as the expand button, for the same reason. */
    .filmbox-close {
      position: absolute; top: 12px; right: 12px; z-index: 2;
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(10, 13, 24, .58);
      border: 1px solid rgba(255, 255, 255, .18);
      color: #fff;
      transition: background .14s ease;
    }
    .filmbox-close:hover { background: rgba(10, 13, 24, .9); }
    @media (prefers-reduced-motion: reduce) {
      .filmbox, .filmbox-stage { transition: none; }
    }
    .upsell-head {
      display: flex; align-items: center; gap: 8px;
      margin-top: 16px;            /* clear of the preview above it */
    }
    .upsell-head .rail-tile { flex: none; }
    .upsell-title { color: var(--text-primary); }
    /* Tight to its own heading: the two are one unit, and the space
       around them is what separates that unit from the rest. */
    .upsell-body { margin: 6px 0 0; color: var(--text-secondary); }
    .upsell-actions { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
    /* A fixed 240px, not the width of the card. A primary button that
       stretches to whatever the container happens to be reads as a bar,
       and the wider the card gets the less it looks like a button. */
    .upsell-actions .btn-primary { flex: none; width: 240px; height: 32px; padding: 6px 12px; }
    /* "Learn more", not "Not now". The secondary action on an offer
       should still be a way forward — a dismissal earns nothing and
       the card already closes on its own when the pointer leaves. It
       goes somewhere outside the app, so it carries the external-link
       mark and opens in a new tab: a panel is a place people are
       working in, and a preview card is not worth losing that place
       over. */
    .upsell-learn {
      flex: none; display: inline-flex; align-items: center; gap: 6px;
      height: 32px; padding: 0 10px; border-radius: 8px;
      color: var(--text-teritiary); text-decoration: none;
      transition: background .14s ease, color .14s ease;
    }
    .upsell-learn:hover { background: var(--backgrounds-card-bg-4); color: var(--text-primary); }
    .upsell-learn svg { flex: none; opacity: .75; }
    .upsell-learn:hover svg { opacity: 1; }

    .grad-blue   { background-image: linear-gradient(225.24deg, var(--blue-600) 8.84%, var(--blue-500) 54.42%, var(--blue-300) 100%); }
    .grad-purple { background-image: linear-gradient(225.24deg, var(--purple-600) 8.84%, var(--purple-500) 54.42%, var(--purple-300) 100%); }
    .grad-indigo { background-image: linear-gradient(225.24deg, var(--indigo-600) 8.84%, var(--indigo-500) 54.42%, var(--indigo-300) 100%); }
    .grad-orange { background-image: linear-gradient(225.24deg, var(--orange-800) 8.84%, var(--orange-600) 54.42%, var(--orange-300) 100%); }
    .grad-green  { background-image: linear-gradient(225.24deg, var(--green-600) 8.84%, var(--green-500) 54.42%, var(--green-300) 100%); }
    .grad-teal   { background-image: linear-gradient(225.24deg, var(--green-600) 8.84%, var(--green-500) 54.42%, var(--cyan-400) 100%); }
    /* Context's tile ships its own gradient in the component (2906:507591)
       rather than composing the shared ramp trio — kept verbatim. A
       background-position drift turned out unreadable at 24px: two of
       the three stops are close blues, so most positions along the
       gradient look the same colour and only a narrow band ever showed
       the purple. Rotating the whole gradient plane instead sweeps
       every stop through the tile on every lap, which is the same
       trick as spinning a background-gradient element — the paint is
       oversized (inset -50%, so it never uncovers a corner as it turns)
       and sits on a ::before under the icon, which stays upright.
       Hovering the row quickens the spin — the one hover-driven speed
       change in the panel, since it is also the one tile whose colour
       is the entire point of hovering it. Reduced motion holds it
       still either way. */
    .grad-context { position: relative; overflow: hidden; background-image: none; }
    .grad-context::before {
      content: ""; position: absolute; inset: -50%;
      background-image: linear-gradient(42.56deg, var(--purple-400) 11.95%, var(--blue-500) 60.99%, var(--blue-600) 110.04%);
      animation: ctxGradSpin 6s linear infinite;
    }
    #ctxStudio:hover .grad-context::before,
    .upsell-head:hover .grad-context::before {
      animation-duration: 1.4s;
    }
    @keyframes ctxGradSpin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .grad-context::before { animation: none; }
    }
    /* The glyph is a flex item, not a positioned one, and a flex item's
       implicit stacking tier does not reliably beat an absolutely
       positioned ::before with the same auto z-index — Chromium paints
       the spin on top of it. Lifted explicitly rather than left to that
       tie-break. */
    .grad-context > svg { position: relative; z-index: 1; }

    /* ── Icon motion on hover ────────────────────────────────────
       Two effects, one per visual class in the rail, because the two
       classes are different things and should not feel the same to
       hover: a leaf item is a line glyph, a group header is a
       coloured chip.

       Both are driven from custom properties rather than letting the
       script write `transform`, because on an <svg> root the CSS
       property and the SVG transform *attribute* disagree about what
       they mean; going through a variable sidesteps that entirely.

       What is reachable at all is the constraint here: the glyphs are
       referenced through <use>, so their innards are shadow DOM no
       script can touch. stroke-dasharray and stroke-dashoffset are
       INHERITED SVG properties, so setting them on the outer <svg>
       does reach the path inside the symbol — that is the whole basis
       of the draw. */

    /* Every glyph in the rail draws the same way, whether it sits on
       its own as a leaf item or inside a category's gradient tile.
       The tile itself is deliberately left alone: it is the container,
       not the icon, and turning the whole chip animates the wrong
       thing. */
    .rail-btn .ic,
    .rail-ghead .rail-tile .ic { transform: scale(var(--ic-s, 1)); transform-origin: 50% 50%; }
    @media (prefers-reduced-motion: reduce) {
      .rail-btn .ic, .rail-ghead .rail-tile .ic { transform: none; }
    }

    /* The clip is authored against a full-size viewport: its sphere is
       a fixed 340px, its chips sit at ±300px offsets, and its captions
       clamp to px minimums. Sized fluidly into a 288px box, all of that
       stays put while the frame shrinks around it — one enormous orb
       and a caption running off both edges. So the iframe is given the
       viewport the clip expects (1600×900) and the whole stage is
       scaled down to the mount instead. Both mounts are 16/9, as is
       1600×900, so one factor fits both axes and nothing is cropped. */
    #upsellFilm iframe, .filmbox-stage iframe {
      position: absolute; left: 0; top: 0;
      width: 1600px; height: 900px;
      transform-origin: 0 0;
      border: 0; display: block;
    }
    /* The offer's box carries the clip's own ink-night rather than this
       page's ground, so it does not flash the wrong colour for the
       instant before the iframe's first paint. */
    #upsellFilm.upsell-media { background: #080c1a; }


    /* ── First run · the tooltip ──────────────────────────────────
       The panel is crunched by default, so the only thing a new user
       ever sees of Context is a 24px tile with a dot on it. This is the
       one moment that tile gets a sentence. Unlike the review page's
       looping demo, here it appears once, waits to be read, and does
       not come back: a coach mark that returns is an interruption, not
       an introduction.
       Both sit above the rail's own z-index 80 — the panel would paint
       over them otherwise — and below the offer card's 95, because if
       the card is up the tooltip has already done its job. */
    .coach-ring {
      position: fixed; z-index: 88; width: 36px; height: 36px;
      border-radius: 11px; pointer-events: none;
      box-shadow: 0 0 0 2px var(--backgrounds-button-primary);
      opacity: 0; transition: opacity .3s ease;
    }
    .coach-ring::after {
      content: ""; position: absolute; inset: 0; border-radius: 11px;
      box-shadow: 0 0 0 2px var(--backgrounds-button-primary);
      opacity: .45;
    }
    .coach-tip {
      position: fixed; z-index: 89; width: 320px;
      display: none; align-items: flex-start; gap: 10px;
      padding: 12px 14px; border-radius: 12px;
      background: var(--backgrounds-card-bg-2);
      border: 1px solid var(--strokes-line-3);
      box-shadow: var(--shadow-tiq);
      opacity: 0; transform: translateX(-8px);
      transition: opacity .22s ease, transform .28s cubic-bezier(.2,.8,.2,1);
    }
    .coach-tip.is-open { display: flex; }
    .coach-tip.is-shown { opacity: 1; transform: none; }
    .coach-ring.is-shown { opacity: 1; }
    .coach-arrow {
      position: absolute; z-index: 2; left: -5px; top: 50%; margin-top: -4.5px;
      width: 9px; height: 9px; rotate: 45deg;
      background: var(--backgrounds-card-bg-2);
      border-left: 1px solid var(--strokes-line-3);
      border-bottom: 1px solid var(--strokes-line-3);
    }
    .coach-tip .rail-tile { flex: none; }
    .coach-tip b {
      display: block; color: var(--text-primary);
      font: 500 var(--fs-body-3)/var(--lh-body-3) var(--font-geist);
      letter-spacing: -0.56px;
    }
    .coach-x {
      flex: none; width: 20px; height: 20px; margin: -2px -4px 0 auto;
      /* auto on the left, not a fixed gap after the text — pinned to the
         corner regardless of how long the line runs. */
      display: flex; align-items: center; justify-content: center;
      border-radius: 6px; color: var(--text-teritiary);
      transition: background .14s ease, color .14s ease;
    }
    .coach-x:hover { background: var(--backgrounds-card-bg-4); color: var(--text-primary); }
    /* A sheen crossing the card every few seconds, the same idiom as the
       Try pill's glint and for the same reason: a nav tooltip that
       shimmers continuously nags, one that passes and gets out of the way
       reads as emphasis. It is a moving background rather than a moving
       element, so it cannot paint outside the card and the arrow — which
       sticks out of it — is left alone; no overflow clipping needed. */
    .coach-tip::after {
      content: ""; position: absolute; inset: 0; z-index: 0;
      border-radius: inherit; pointer-events: none;
      background-image: linear-gradient(100deg, transparent 36%, var(--coach-sheen) 50%, transparent 64%);
      background-size: 200% 100%; background-repeat: no-repeat;
      background-position: 150% 0;
      animation: coachSheen 3.2s ease-in-out infinite;
    }
    /* The band is only inside the card between 100% and 0%; the rest of
       the travel parks it off one edge or the other. Sweeping 150% to
       -50% spends half the 2s of travel on screen, which is a pass you
       can watch rather than a flicker you catch by accident. */
    @keyframes coachSheen {
      0%, 38% { background-position: 150% 0; }
      100%    { background-position: -50% 0; }
    }
    /* The sheen is painted behind everything the card says. A flex item's
       implicit tier does not reliably beat a positioned ::after. */
    .coach-tip > *:not(.coach-arrow) { position: relative; z-index: 1; }
    /* The halo pulses only while the tooltip is up, and stops with it. */
    .coach-ring.is-shown::after { animation: coachHalo 2s ease-out infinite; }
    @keyframes coachHalo {
      0%        { transform: scale(1); opacity: .45; }
      70%, 100% { transform: scale(1.55); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .coach-ring.is-shown::after,
      .coach-tip::after { animation: none; }
      .coach-tip { transition: none; }
    }

    /* ── Main content ───────────────────────────────────────────── */
    .main { flex: 1 1 auto; min-width: 0; padding: 8px 8px 8px 0; }
    .content-wrapper {
      height: 100%;
      display: flex; flex-direction: column;
      border: 1px solid var(--strokes-line-3);
      border-radius: 12px;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────────────── */
    .header {
      flex: none; height: 48px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 16px;
      background: var(--backgrounds-card-bg-5);
      border-bottom: 1px solid var(--strokes-line-3);
    }
    .header-left { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 12px; }
    .header-left .sub { color: var(--text-teritiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .icon-btn-32 {
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-teritiary);
      transition: background .15s ease;
    }
    .icon-btn-32:hover { background: var(--backgrounds-card-bg-4); }
    .ws-dropdown {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 8px; border-radius: 8px;
      color: var(--text-teritiary);
      transition: background .15s ease;
    }
    .ws-dropdown:hover { background: var(--backgrounds-card-bg-4); }
    .ws-dropdown .name { color: var(--text-primary); }
    .avatar { position: relative; width: 20px; height: 20px; flex: none; }
    .avatar svg { width: 20px; height: 20px; }
    .avatar span {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font: 400 var(--fs-caption)/var(--fs-body-2) var(--font-geist); letter-spacing: -0.24px;
    }
    .header-avatar { width: 32px; height: 32px; border-radius: 100px; display: block; }

    /* ── Main section ───────────────────────────────────────────── */
    .main-section { flex: 1 1 auto; min-height: 0; display: flex; }

    /* ══════════════════════════════════════════════════════════════
       HOME — a gradient sky over a quiet ground.

       The sky is built the way the best examples of it are: not a
       blurred blob field, but a stack of horizontal bands, each one a
       90° sweep through three neighbouring hues. The stack runs cool
       at the top and warm at the bottom, so the whole panel reads as
       one spectrum; a heavy blur melts the seams so the bands become a
       mesh rather than a flag.

       Two clocks move it. The colour stops of every band slide back
       and forth on their own staggered loop — that is the ambient
       drift. And the cursor's distance from the centre drives a shared
       --multiplier that pushes every stop the same way at once, so
       moving the mouse sweeps the whole spectrum sideways.

       Every colour is a step off the library ramps above.
       ══════════════════════════════════════════════════════════════ */

    /* Registered so they interpolate: an unregistered custom property
       is a string to the animation engine and would jump between
       keyframes instead of sweeping. */
    @property --stop-1     { syntax: "<percentage>"; inherits: false; initial-value: 0%; }
    @property --stop-2     { syntax: "<percentage>"; inherits: false; initial-value: 50%; }
    @property --multiplier { syntax: "<percentage>"; inherits: true;  initial-value: 0%; }

    /* Dark is the design's default, so it is the one written on the
       bare :root — the same way every other token on this page is
       keyed. Light is the override the header toggle stamps. */
    :root {
      /* The sky is the one place the product runs its colour hot, so it
         takes a ramp of its own rather than the interface rungs: those
         are picked to sit under text at small sizes and go chalky when
         a 76px blur averages them together. These are each family's
         most saturated point instead — electric through the blues,
         full violet, and a magenta that holds its chroma all the way
         into the warm end rather than sliding to amber. */
      --sky-cyan:   #0d99ff;   /* blue-500 */
      --sky-blue:   #007be5;   /* blue-600 */
      --sky-indigo: #0768cf;   /* blue-700 */
      --sky-purple: #8638e5;   /* purple-600 */
      --sky-pink:   #7c2bda;   /* purple-700 */
      --sky-orange: #681abb;   /* purple-800 */
      --sky-amber:  #4b0d87;   /* purple-900 */
      --sky-bloom:      rgba(90, 170, 255, .42);
      --sky-bloom-warm: rgba(151, 71, 255, .36);
      /* Held back from what it was: every point of darkening here comes
         straight off the panel's chroma, and the headline has its own
         shadow for contrast. */
      --sky-veil:   rgba(18, 18, 18, .20);
      --sky-scrim:  rgba(18, 18, 18, .12);
      /* The panel the colour is painted on. Its depth is the only
         thing that decides how far down the page the gradient reaches:
         every stop in the bands, the hump and the wave is a percentage
         of it, so lengthening the panel carries the whole spectrum
         down together rather than stretching one end of it. */
      --hero-h:     92.82vh;
      /* The hero's share of the panel, and the one number that keeps
         the layout still while the panel's depth moves: the hero is
         given exactly this much of it, so 48px of header plus that,
         less the cards' own -52px pull, is where the cards start —
         both as a length here and as a fraction of the panel in the
         glyph field's mask below. Re-derived on every change of
         --hero-h so the product stays 36.4vh. */
      --hero-share: .3922;
      --band-blur:  76px;
      /* The bottom of the sky. An ellipse anchored above the top edge and
         narrower than the panel, so the colour hangs lowest at the centre
         and lifts away at both sides — a hump rather than a band. The
         falloff is spread over seven stops across more than half the
         height: a short ramp ends somewhere the eye can find, and that
         reads as an edge. This one never finishes anywhere in particular. */
      --hump: radial-gradient(66% 104% at 50% -8%,
                #000 0%, #000 24%,
                rgba(0,0,0,.96) 36%, rgba(0,0,0,.84) 48%,
                rgba(0,0,0,.62) 60%, rgba(0,0,0,.36) 71%,
                rgba(0,0,0,.14) 82%, transparent 93%);
      /* One crest, tiled. An ellipse hung just above the tile's top
         edge, so the colour reaches lowest at the crest's centre and
         lifts away to either side — the hump again, at the scale of a
         wavelength instead of a page. */
      --crest: radial-gradient(58% 96% at 50% -6%,
                #000 0%, rgba(0,0,0,.86) 34%,
                rgba(0,0,0,.50) 58%, rgba(0,0,0,.18) 78%,
                transparent 94%);
    }
    :root[data-mode="light"] {
      /* The same ramp a shade brighter — light mode lifts the panel
         rather than washing it out, so the colour stays as saturated
         as it is in dark and simply sits higher. */
      --sky-cyan:   #44aaf3;   /* blue-450 */
      --sky-blue:   #0d99ff;   /* blue-500 */
      --sky-indigo: #007be5;   /* blue-600 */
      --sky-purple: #9747ff;   /* purple-500 */
      --sky-pink:   #bb7fff;   /* purple-450 */
      --sky-orange: #d9b8ff;   /* purple-400 */
      --sky-amber:  #e4ccff;   /* purple-300 */
      --sky-bloom:      rgba(120, 190, 255, .28);
      --sky-bloom-warm: rgba(187, 127, 255, .26);
      /* The hero type is white in both modes, so light keeps its colour
         vivid behind the words and darkens fractionally for contrast
         rather than washing back toward white. */
      --sky-veil:   rgba(18, 18, 18, .10);
      --sky-scrim:  rgba(18, 18, 18, .055);
      /* Light already sits high, so the bloom only has to keep the
         panel from going chalky where the two glows overlap. */
    }

    /* The frame is the ground; the sky is a layer laid over its top. */
    .content-wrapper.is-home {
      background: var(--backgrounds-page-bg-3);
      position: relative;
    }

    .home { position: relative; flex: 1 1 auto; min-width: 0; display: flex; }

    /* ── The sky ────────────────────────────────────────────────── */
    .hero-sky {
      position: absolute; left: 0; right: 0; top: 0; height: var(--hero-h);
      overflow: hidden; pointer-events: none; z-index: 0;
    }
    /* Everything after the sky is stacked over it. */
    .hero, .ground { position: relative; z-index: 1; }
    .hero-bands {
      /* Dropped down its own panel: the top of the stack clears the
         header, so the colour reads as a band across the page rather
         than as paint applied to the chrome. */
      position: absolute; inset: -4% -6% 0;
      display: flex; flex-direction: column;
      /* The chroma the bands are asked for. The ramps themselves are
         library tokens and stay where they are; the lift happens here,
         once, so every band moves together and none of them drifts off
         its own hue. */
      filter: blur(var(--band-blur)) saturate(1.62) brightness(1.14) contrast(1.04);
      /* An ellipse anchored above the top centre rather than a flat fade:
         every point below the middle is nearer its origin than a point out
         at the sides is, so the colour bulges lowest under the headline and
         lifts away at both edges.
         no-repeat matters as much as the stops do: a mask image tiles by
         default, so past the bottom of the gradient the next tile starts
         opaque again and paints the blur spill back in — a bright seam
         exactly where the colour was supposed to have gone. */
      -webkit-mask-image: var(--hump);
              mask-image: var(--hump);
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      -webkit-mask-size: 100% 100%;   mask-size: 100% 100%;
    }
    .band {
      flex: 1 1 0;
      background: linear-gradient(90deg,
        var(--c1) calc(var(--stop-1) + var(--multiplier)),
        var(--c2) calc(var(--stop-2) + var(--multiplier)),
        var(--c3) 100%);
      animation: band-slide 22s ease-in-out infinite alternate;
      /* The cursor sweep is a tween, not a jump — the same ease and
         duration the reference gives it. */
      transition: --multiplier 1.6s cubic-bezier(.22, .61, .36, 1);
    }
    /* Cool at the top, warm at the bottom; each band overlaps its
       neighbour by one hue so the stack reads continuous. */
    /* Not an even five: the blues carry the top in less depth than they
       had, which walks the magenta up into the part of the panel the
       hump still holds at full strength. Evenly split, the hottest
       colour in the ramp only arrived where the mask had already taken
       most of it away. */
    .band.n1 { flex-grow: .80; --c1: var(--sky-cyan);   --c2: var(--sky-blue);   --c3: var(--sky-indigo); animation-delay: -0s;   }
    .band.n2 { flex-grow: .90; --c1: var(--sky-blue);   --c2: var(--sky-indigo); --c3: var(--sky-purple); animation-delay: -16s;  }
    .band.n3 { flex-grow: 1.02; --c1: var(--sky-indigo); --c2: var(--sky-purple); --c3: var(--sky-pink);   animation-delay: -8s;  }
    .band.n4 { flex-grow: 1.14; --c1: var(--sky-purple); --c2: var(--sky-pink);   --c3: var(--sky-orange); animation-delay: -12s;  }
    .band.n5 { flex-grow: 1.14; --c1: var(--sky-pink);   --c2: var(--sky-orange); --c3: var(--sky-amber);  animation-delay: -4s;  }
    @keyframes band-slide {
      from { --stop-1: 0%;  --stop-2: 50%; }
      to   { --stop-1: 11%; --stop-2: 61%; }
    }

    /* The wash the headline sits in. Elliptical and centred on the
       words, so the panel keeps full chroma at its edges. */
    .hero-veil {
      position: absolute; inset: 0;
      background:
        radial-gradient(64% 52% at 50% 46%, var(--sky-veil), transparent 78%),
        linear-gradient(180deg, var(--sky-scrim), transparent 62%);
    }

    /* ── The bloom ───────────────────────────────────────────────
       Screen, not a white overlay: it multiplies up whatever hue is
       under it, so the blue reads as lit blue and the magenta as lit
       magenta, instead of both being tinted toward the same white.
       Two sources rather than one — the panel is wider than it is
       tall, and a single centred glow leaves the sides looking flat. */
    .hero-bloom {
      position: absolute; inset: 0;
      mix-blend-mode: screen;
      pointer-events: none;
      background:
        radial-gradient(46% 38% at 50% 30%, var(--sky-bloom), transparent 72%),
        radial-gradient(58% 34% at 38% 62%, var(--sky-bloom-warm), transparent 76%);
    }

    /* ── The wave at the water line ──────────────────────────────
       The hump's colour runs out somewhere in the lower half of the
       panel, and that boundary is the only near-straight line the sky
       owns. Two trains of crests drift across it in opposite
       directions at different wavelengths; because the two periods
       don't divide into each other, they never line up the same way
       twice, so the line breathes rather than marches. The paint is
       the panel's own warm end and the blur matches the bands', which
       is what keeps this a movement of the colour itself instead of a
       shape sliding over it.

       Everything that moves, moves by transform. Each train's crests
       are cut by a mask anchored to the train's own box, so sliding
       the box carries the crests with it, while the paint underneath —
       a purely vertical gradient, identical at every horizontal
       offset — gives the slide nothing to show. The travel is exactly
       one mask tile, so the loop has no seam. */
    .hero-wave {
      position: absolute; inset: 46% -6% 0; overflow: hidden;
      filter: blur(calc(var(--band-blur) * .72)) saturate(1.38);
      opacity: .5;
      /* Open at the top, closed before the bottom edge: the layer has
         to arrive and leave inside the panel, or the container's own
         edge becomes the line the wave was there to break. */
      -webkit-mask-image: linear-gradient(180deg, transparent 0%, rgba(0,0,0,.68) 26%, #000 52%, rgba(0,0,0,.58) 80%, transparent 100%);
              mask-image: linear-gradient(180deg, transparent 0%, rgba(0,0,0,.68) 26%, #000 52%, rgba(0,0,0,.58) 80%, transparent 100%);
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    }
    .wave {
      position: absolute; top: 0; bottom: 0; left: -100%; width: 300%;
      background: linear-gradient(180deg,
        var(--sky-pink), var(--sky-orange) 58%, var(--sky-amber));
      -webkit-mask-image: var(--crest);  mask-image: var(--crest);
      -webkit-mask-repeat: repeat-x;     mask-repeat: repeat-x;
      will-change: transform;
    }
    /* A wavelength the width of the panel — long enough that the eye
       reads a swell rather than a ripple. */
    .wave.w1 {
      -webkit-mask-size: 33.3333% 100%; mask-size: 33.3333% 100%;
      animation: wave-drift-a 34s linear infinite;
    }
    /* Three fifths of that, running the other way and fainter, so the
       two only ever agree in passing. */
    .wave.w2 {
      opacity: .7;
      -webkit-mask-size: 20% 100%; mask-size: 20% 100%;
      animation: wave-drift-b 47s linear infinite;
    }
    @keyframes wave-drift-a { from { transform: translateX(0); }    to { transform: translateX(-33.3333%); } }
    @keyframes wave-drift-b { from { transform: translateX(-20%); } to { transform: translateX(0); } }

    /* ── The glyph field ─────────────────────────────────────────
       The canvas dots, promoted. Instead of a fixed pattern they are
       a field of glyphs on a 7px lattice, each one taking its tone
       from a slow three-dimensional noise: 16% of the field at full
       strength, 16% one step down, the rest a whisper. Nothing in it
       moves — what drifts is which dots are bright, which is why a
       field this dense can animate without pulling the eye.

       The pointer is the field's fourth input. It pulls the noise
       value down inside a soft radius, promoting every glyph under
       it a tone or two, so the dots are not revealed on hover so
       much as lit — brightest under the cursor, falling off to the
       ambient field within about 170px.

       Ported from Glyph Field Studio with its settings carried over
       as they were set there — shimmer, 0.40x speed, 0.115 field
       scale, 22% grain, 7px cells, 44% element size, 16/16 tone
       split, filled square — and only the palette swapped: three
       alphas of white, because here the field sits on the sky rather
       than on paper. */
    :root {
      --glyph-1: .66;   /* accent: the 16% the noise puts lowest */
      --glyph-2: .25;   /* mid tone: the next 16% */
      --glyph-3: .08;   /* base: the two thirds that are only tooth */
    }
    :root[data-mode="light"] {
      /* Light's sky is the paler of the two and gives white less to
         push against, so every rung is carried harder. */
      --glyph-1: .74;
      --glyph-2: .35;
      --glyph-3: .13;
    }
    /* Under the veil, not over it. The veil is an ellipse of shade
       centred on the headline, and putting the field beneath it hands
       the field the same treatment the colour gets: quiet behind the
       words, full strength out at the panel's edges where there is
       nothing to read. */
    .hero-glyphs {
      position: absolute; inset: 0; width: 100%; height: 100%;
      /* The field belongs to the headline's half of the panel, and it
         leaves on the same shape the colour does. A flat fade drew a
         horizontal line across the page — the one straight edge the
         sky had spent a hump and a wave avoiding. This is that hump
         again: an ellipse hung above the top centre, so the field
         reaches lowest under the headline and lifts away at both
         sides, gone by 40% out at the edges and carrying to 62% down
         the middle.

         The vertical radius is what puts the centre's full-strength
         edge on the top of the two cards, and it is derived rather
         than measured: the cards start --hero-share of the way down
         the panel, the ellipse's origin sits 6% above it, and the
         opaque stop is at 66% of the radius — so the radius is that
         distance over 0.66. The horizontal radius, 68%, is smaller
         than half the panel is wide, which is exactly why the far
         corners start out already a step down the ramp.

         The falloff is bent rather than straight: a linear ramp across
         a grid of hard little squares shows its own edge. */
      --fade: radial-gradient(68% calc((var(--hero-share) * 100% + 6%) / .66) at 50% -6%,
                #000 0%, #000 66%,
                rgba(0, 0, 0, .78) 74%, rgba(0, 0, 0, .42) 84%,
                rgba(0, 0, 0, .14) 92%, transparent 100%);
      -webkit-mask-image: var(--fade); mask-image: var(--fade);
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    }

    /* ── The column ─────────────────────────────────────────────── */
    .home-scroll {
      position: relative;
      flex: 1 1 auto; min-width: 0;
      display: flex; flex-direction: column; overflow-y: auto;
      padding-top: 48px;                 /* the height of the floating header */
    }

    .hero {
      /* Just over half the sky, so the words land in its upper third and
         the cards follow close underneath — the rest of the gradient
         carries on down behind them. */
      /* Measured off the panel through the share above, which is
         re-tuned every time the panel's depth moves — so the gradient
         travels and the layout does not. */
      flex: none; min-height: calc(var(--hero-h) * var(--hero-share));
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 24px 24px 28px;
    }
    .hero-eyebrow {
      /* On the gradient in both modes, so both take white rather than a
         theme ink that would vanish into the colour. */
      margin: 0 0 14px; color: rgba(255, 255, 255, .82);
      font: 400 var(--fs-body-2)/var(--lh-body-2) var(--font-geist);
      letter-spacing: -0.64px;
    }
    .hero-title {
      margin: 0;
      /* Regular, and set to hold one line: the width is what gives the
         line its scale, so the size tracks the viewport and the whole
         sentence stays unbroken. */
      font: 400 clamp(34px, 3.63vw, 50px)/1.22 var(--font-geist);
      letter-spacing: -1.6px;
      color: #fff;
      white-space: nowrap;
    }
    /* Below the width where one line would start clipping, let it break. */
    @media (max-width: 720px) {
      .hero-title { white-space: normal; text-wrap: balance; max-width: 16ch; }
    }

    /* The changing word. It is the only thing on the page wearing the
       sky's own colours, so the headline and the panel are visibly the
       same idea. */
    .rotor {
      position: relative; display: inline-block;
      vertical-align: baseline;
      transition: width .42s cubic-bezier(.22, .61, .36, 1);
    }
    .rotor-word {
      display: inline-block; white-space: nowrap;
      color: #fff;
    }
    .rotor-word.is-out { animation: rotor-out .34s cubic-bezier(.4, 0, 1, 1) forwards; }
    .rotor-word.is-in  { animation: rotor-in  .42s cubic-bezier(.22, .61, .36, 1) backwards; }
    @keyframes rotor-out {
      to { opacity: 0; transform: translateY(-38%) rotateX(42deg); filter: blur(3px); }
    }
    @keyframes rotor-in {
      from { opacity: 0; transform: translateY(38%) rotateX(-42deg); filter: blur(3px); }
      to   { opacity: 1; transform: none; filter: none; }
    }
    /* Measures the next word before it is shown, so the span can be
       given a width to transition to rather than snapping. */
    .rotor-ghost {
      position: absolute; left: 0; top: 0;
      visibility: hidden; pointer-events: none; white-space: nowrap;
    }

    /* ── The ground ─────────────────────────────────────────────── */
    .ground {
      flex: 1 1 auto;
      padding: 0 24px 56px;
    }
    /* Wide enough for three tutorial cards; the hero cards and chips keep
       their narrower measure inside it. */
    .ground-inner {
      width: min(1120px, 100%); margin: 0 auto;
      display: flex; flex-direction: column; align-items: center;
    }
    .home-cards, .home-more { max-width: 760px; }

    .home-cards {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
      width: 100%;
      /* Lifted so the pair breaks the line where the sky ends —
         the cards are what the gradient hands you off to. */
      margin-top: -52px;
    }
    @media (max-width: 860px) { .home-cards { grid-template-columns: 1fr; } }

    /* The darkest ground the system publishes, so the two cards read
       as cut out of the sky rather than laid on it. Light keeps the
       card surface it had — there is no rung below white. */
    :root            { --home-card-bg: var(--backgrounds-page-bg-1); }
    :root[data-mode="light"] { --home-card-bg: var(--backgrounds-card-bg-2); }
    .hero-card {
      position: relative;
      display: flex; flex-direction: column; align-items: flex-start; gap: 16px;
      padding: 22px 20px; border-radius: 20px;
      background: var(--home-card-bg);
      /* No stroke: the card is dark enough against the sky to hold its
         own edge, and a line around it only re-draws what the shadow
         already says. Kept as a transparent border rather than dropped,
         so the box is the same size it was and focus still has an edge
         to colour. */
      border: 1px solid transparent;
      box-shadow: var(--shadow-pop);
      text-align: left;
      transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease;
    }
    .hero-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-tiq);
    }
    /* Keyboard focus keeps the blue: there it is the only thing saying
       where you are. */
    .hero-card:focus-visible {
      border-color: var(--strokes-card-selected);
      transform: translateY(-3px);
      box-shadow: var(--shadow-tiq);
    }
    .hero-card:focus-visible { outline: 2px solid var(--strokes-card-selected); outline-offset: 2px; }
    /* The Figma draws these two marks itself — they are artwork, not
       glyphs, so they carry their own gradient and sit unboxed rather
       than on one of the rail's coloured tiles. */
    .hero-tile {
      width: 48px; height: 48px; flex: none;
      display: flex; align-items: center; justify-content: center;
    }
    .hero-tile .ic { width: 48px; height: 48px; }
    .hero-copy { display: flex; flex-direction: column; gap: 4px; }
    .hero-name { color: var(--text-primary); }
    .hero-desc { color: var(--text-secondary); }
    .hero-go {
      position: absolute; top: 22px; right: 20px;
      color: var(--text-teritiary);
      opacity: 0; transform: translateX(-4px);
      transition: opacity .18s ease, transform .18s ease, color .18s ease;
    }
    .hero-card:hover .hero-go, .hero-card:focus-visible .hero-go {
      opacity: 1; transform: none; color: var(--text-coloured-blue);
    }

    .home-more {
      width: 100%; margin-top: 40px;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    .home-more-lbl {
      display: flex; align-items: center; justify-content: center;
      gap: 12px; width: 100%;
      color: var(--text-teritiary);
      font: 500 var(--fs-caption)/var(--fs-body-2) var(--font-geist);
      letter-spacing: .72px; text-transform: uppercase; white-space: nowrap;
    }
    /* Short rules rather than rules that run the width of the column.
       A line only has to say the label is a divider; carried out to the
       cards' own edges it stops being a mark on the label and starts
       being a second horizontal edge across the page. Sized, not
       stretched, so the group centres on the label and not on whatever
       the two rules had left over. */
    .home-more-lbl::before, .home-more-lbl::after {
      content: ""; flex: 0 0 auto; width: clamp(40px, 7vw, 88px);
      height: 1px; background: var(--strokes-line-1);
    }
    .home-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .chip {
      display: flex; align-items: center; gap: 8px;
      height: 36px; padding: 0 14px; border-radius: 999px;
      background: var(--backgrounds-card-bg-2);
      border: 1px solid var(--strokes-card-default);
      color: var(--text-secondary);
      transition: color .15s ease, border-color .15s ease, background .15s ease;
    }
    .chip .ic { color: var(--text-teritiary); transition: color .15s ease; }
    .chip:hover, .chip:focus-visible {
      color: var(--text-primary); border-color: var(--strokes-card-selected);
    }
    .chip:hover .ic, .chip:focus-visible .ic { color: var(--text-coloured-blue); }
    .chip:focus-visible { outline: 2px solid var(--strokes-card-selected); outline-offset: 2px; }

    /* ── Tutorials for you ──────────────────────────────────────────
       A panel of its own on the ground, holding a rail of cards that
       runs past the right edge — the row scrolls rather than wrapping,
       which is what tells you there are more than fit. ── */
    /* The sky now reaches past this panel, so the panel stops hiding
       it: a thin wash over a blur, which lets the colour through as
       tone while the cards inside stay on an opaque surface of their
       own. The blur is what keeps it a surface rather than a hole —
       without it the gradient's own detail would read through and the
       titles would sit on noise. */
    :root            { --panel-glass: rgba(33, 33, 33, .52); }
    :root[data-mode="light"] { --panel-glass: rgba(255, 255, 255, .58); }
    .panel {
      width: 100%; margin-top: 76px;
      background: var(--panel-glass);
      -webkit-backdrop-filter: blur(24px) saturate(1.25);
              backdrop-filter: blur(24px) saturate(1.25);
      border: 1px solid var(--strokes-card-default);
      border-radius: 20px;
      padding: 24px 0 24px 24px;
    }
    .panel-head {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 16px; padding-right: 24px; margin-bottom: 16px;
    }
    .panel-title { margin: 0; color: var(--text-primary); }
    .panel-sub { margin: 2px 0 0; color: var(--text-teritiary); }
    .panel-link {
      flex: none; display: flex; align-items: center; gap: 4px;
      color: var(--text-coloured-blue);
      transition: gap .15s ease;
    }
    .panel-link:hover { gap: 8px; }
    .panel-link:focus-visible { outline: 2px solid var(--strokes-card-selected); outline-offset: 3px; border-radius: 4px; }

    .tut-rail {
      display: flex; gap: 12px;
      overflow-x: auto; scroll-snap-type: x proximity;
      padding: 2px 24px 8px 0;
      scrollbar-width: thin;
      scrollbar-color: var(--strokes-line-2, var(--strokes-card-default)) transparent;
    }
    .tut-rail::-webkit-scrollbar { height: 8px; }
    .tut-rail::-webkit-scrollbar-track { background: transparent; }
    .tut-rail::-webkit-scrollbar-thumb {
      background: var(--strokes-card-default); border-radius: 999px;
    }

    .tut {
      position: relative; flex: none; scroll-snap-align: start;
      width: 340px; height: 128px;
      border-radius: 12px; overflow: hidden;
      /* The card surface proper — white in light, dark in dark — so
         the cards sit on the glass rather than dissolving into it. */
      background: var(--backgrounds-card-bg-2);
      border: 1px solid var(--strokes-card-default);
      text-align: left;
      transition: border-color .18s ease, transform .18s ease;
    }
    .tut:hover, .tut:focus-visible {
      border-color: var(--strokes-card-selected); transform: translateY(-2px);
    }
    .tut:focus-visible { outline: 2px solid var(--strokes-card-selected); outline-offset: 2px; }

    /* Each card carries a colour wash keyed to its subject — the rail is
       scannable by colour before it is read — and the piece of artwork
       Figma draws for that lesson sitting on top of it. */
    .tut-art {
      position: absolute; inset: 0 0 0 auto; width: 200px;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 42%);
              mask-image: linear-gradient(90deg, transparent, #000 42%);
    }
    .tut-art::before {
      content: ""; position: absolute; inset: -30%;
      background: var(--art);
      filter: blur(22px);
      opacity: .78;
    }
    /* The artwork itself is not masked — only the wash behind it is. It is
       laid over the whole card so each piece can be placed at the fraction
       of the card Figma places it at. */
    .tut-figure { position: absolute; inset: 0; pointer-events: none; }
    .tut-figure img { position: absolute; display: block; width: auto; }
    .tut.a1 { --art: radial-gradient(60% 60% at 62% 44%, var(--orange-500), transparent 70%),
                     radial-gradient(58% 58% at 92% 78%, var(--pink-500), transparent 72%); }
    .tut.a2 { --art: radial-gradient(60% 60% at 60% 40%, var(--blue-500), transparent 70%),
                     radial-gradient(58% 58% at 94% 82%, var(--indigo-600), transparent 72%); }
    .tut.a3 { --art: radial-gradient(60% 60% at 58% 46%, var(--indigo-500), transparent 70%),
                     radial-gradient(58% 58% at 92% 80%, var(--purple-500), transparent 72%); }
    .tut.a4 { --art: radial-gradient(60% 60% at 60% 42%, var(--cyan-450), transparent 70%),
                     radial-gradient(58% 58% at 92% 80%, var(--green-500), transparent 72%); }

    .fig-1  { height: 64%; right:  7%; top: 18%; }
    /* The flow runs off the right edge in the frame too — the Agent pill is
       meant to be cut by the card. */
    .fig-3  { height: 76%; right: -5%; top: 12%; }
    .fig-4  { height: 82%; right:  4%; top: 10%; }
    .fig-2a { height: 36%; right: 22%; top: 26%; }
