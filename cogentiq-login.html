  :root{
    --text-primary:#121212;
    --text-secondary:#616161;
    --text-tertiary:#8c8c8c;
    --text-disabled:#bdbdbd;
    --bg-page:#fafafa;
    --bg-input:#f5f5f5;
    --stroke-default:#e0e0e0;
    --bg-disabled:#eeeeee;
    --btn-primary:#0d99ff;
    --blue-600:#007be5;
    --font:'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    /* master loop for the workflow illustration */
    --cycle:9s;
    --ease-out:cubic-bezier(.16,1,.3,1);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:#f0f0f0;color:var(--text-primary);display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
  img,svg{display:block}

  .frame{position:relative;width:1440px;height:820px;background:var(--bg-page);border-radius:8px;overflow:hidden}

  /* ============================================================
     LEFT PANEL — animated illustration
     ============================================================ */
  .panel{position:absolute;left:8px;top:8px;width:540px;height:804px;border-radius:16px;overflow:hidden;background:#c65a4e}

  .g-fill{border-radius:132px}
  .g1{left:-124.12px;top:-85.74px;width:785.633px;height:956.786px;animation:drift1 34s ease-in-out infinite}

  .g2{left:-374.76px;top:-262.54px;width:1297.662px;height:1289.297px;animation:drift2 42s ease-in-out infinite}
  .g2 .g-rot{transform:rotate(-36.2deg)}
  .g2 .g-fill{width:944.857px;height:906.214px;opacity:.3;background:linear-gradient(100.602deg,#0d99ff 16.299%,#5860ed 35.144%,#f24822 67.965%,#ffca28 85.355%)}
  .g3{left:-145px;top:-41.37px;width:624.457px;height:900.56px;mix-blend-mode:overlay;animation:drift3 30s ease-in-out infinite}
  .g3 .g-rot{transform:rotate(-6.37deg) skewX(1.63deg)}
  .g3 .g-fill{width:509.079px;height:852.396px;opacity:.4;background:linear-gradient(95.048deg,#ffffff 18.453%,#5860ed 28.812%,#f24822 69.937%,#ffca28 87.265%)}
  .g4{left:-659px;top:-617px;width:1849.87px;height:1923.574px;mix-blend-mode:plus-lighter;animation:drift4 48s ease-in-out infinite}

  .g5 .g-fill{width:1149.337px;height:963.91px;opacity:.99;filter:blur(20px);background:linear-gradient(100.002deg,#ffffff 18.453%,#5860ed 28.812%,#f24822 69.937%,#ffca28 87.265%)}

  @keyframes drift1{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(26px,-30px) rotate(3deg)}}
  @keyframes drift2{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(-34px,24px) rotate(-4deg)}}
  @keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(20px,34px) scale(1.05)}}
  @keyframes drift4{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(30px,40px) rotate(2.5deg)}}
  @keyframes drift5{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-28px,-22px) scale(1.06)}}

  /* --- logo lockup --- */
  .logo-row{position:absolute;left:88px;top:24px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;animation:fadeDown .9s var(--ease-out) both}
  .logo-mark{width:36px;height:36px;border-radius:100px;background:#fff;display:flex;align-items:center;justify-content:center}
  .logo-mark svg{width:20px;height:17.5px}
  .logo-word{width:90px;height:21.392px}
  .logo-word svg{width:100%;height:100%}
  @keyframes fadeDown{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

  /* --- tagline + pager dots --- */
  .tagline{position:absolute;left:50%;top:628px;transform:translateX(-50%);width:356px;font-weight:500;font-size:36px;line-height:38px;letter-spacing:-1.44px;color:#fff;text-align:center;animation:fadeUp 1s .25s var(--ease-out) both}
  @keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(14px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
  .pager{position:absolute;left:50%;top:764px;transform:translateX(-50%);width:34px;height:8px}
  .pager svg{width:100%;height:100%}

  /* ============================================================
     WORKFLOW ILLUSTRATION — looped choreography
     Sequence per cycle: trigger card ▸ line draws ▸ agent card
     ▸ sheen + badge pop ▸ line draws ▸ result card ▸ check pop
     ============================================================ */
  .node{position:absolute;display:flex;flex-direction:column;align-items:center}
  .node-tab{display:flex;align-items:center;justify-content:center;gap:4px;width:100px;padding:4px 6px;background:rgba(255,255,255,.16);border-radius:8px 8px 0 0;font-weight:500;font-size:14px;line-height:20px;letter-spacing:-.56px;color:#fff}
  .node-tab .ic{width:16px;height:16px}
  .node-tab .ic svg{width:100%;height:100%}
  .node-card{position:relative;display:flex;align-items:center;gap:4px;padding:8px 12px;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(33,33,33,.3);overflow:hidden}
  .node-card .label{font-weight:500;font-size:14px;line-height:20px;letter-spacing:-.56px;color:var(--text-primary);white-space:nowrap}

  .n-trigger{left:179px;top:159px;animation:stepTrigger var(--cycle) infinite}
  .n-trigger .ic-doc{width:24px;height:24px}
  .n-trigger .ic-doc svg{width:100%;height:100%}

  .n-agent{left:72px;top:299px;animation:stepAgent var(--cycle) infinite;z-index:2}
  .agent-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;width:396px;padding:12px;background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(33,33,33,.3);overflow:hidden}
  .agent-status{display:flex;align-items:center;gap:4px}
  .agent-status .ic{width:20px;height:20px}
  .agent-status .ic svg{width:100%;height:100%}
  .agent-status .grad-text{font-weight:500;font-size:12px;line-height:16px;letter-spacing:-.24px;white-space:nowrap;background:linear-gradient(219.423deg,#d9b8ff 7.946%,#0d99ff 36.765%,#007be5 85.953%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .agent-body{display:flex;flex-direction:column;gap:8px;width:100%}
  .agent-title{font-weight:500;font-size:16px;line-height:24px;letter-spacing:-.64px;color:var(--text-primary);white-space:nowrap}
  .agent-desc{font-weight:400;font-size:14px;line-height:20px;letter-spacing:-.56px;color:var(--text-secondary)}
  .badge{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:4px 8px;background:var(--bg-input);border-radius:80px;animation:badgePop var(--cycle) var(--ease-out) infinite}
  .badge img{width:14px;height:14px;object-fit:cover}
  .badge span{font-weight:500;font-size:12px;line-height:16px;letter-spacing:-.24px;color:var(--blue-600)}
  /* sheen sweep across the agent card right after it lands */
  .agent-card::after{content:"";position:absolute;top:-20%;bottom:-20%;left:0;width:60%;background:linear-gradient(105deg,rgba(255,255,255,0) 0%,rgba(160,205,255,.35) 50%,rgba(255,255,255,0) 100%);transform:translateX(-140%) skewX(-12deg);animation:sheen var(--cycle) ease-in-out infinite;pointer-events:none}

  .n-result{left:194px;top:509px;animation:stepResult var(--cycle) infinite}
  .result-card{gap:6px}
  .avatars{display:flex;align-items:center}
  .avatars img{width:20px;height:20px;border-radius:50%}
  .avatars img:first-child{margin-right:-6px;position:relative;z-index:1}
  .ic-check{width:20px;height:20px;animation:checkPop var(--cycle) infinite}
  .ic-check svg{width:100%;height:100%}

  /* connectors: masked draw-down + travelling light pulse */
  .connector{position:absolute;left:265px;width:9px;height:96px;z-index:1}
  .c1{top:207px}
  .c2{top:417px}
  .connector .line{width:100%;height:100%;transform-origin:top;animation-duration:var(--cycle);animation-iteration-count:infinite;animation-timing-function:linear}
  .c1 .line{animation-name:drawC1}
  .c2 .line{animation-name:drawC2}
  .connector .line svg{width:100%;height:100%}
  .connector .spark-dot{position:absolute;left:50%;top:2px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#fff;box-shadow:0 0 8px 3px rgba(255,255,255,.75);animation-duration:var(--cycle);animation-iteration-count:infinite;animation-timing-function:linear;opacity:0}
  .c1 .spark-dot{animation-name:pulseC1}
  .c2 .spark-dot{animation-name:pulseC2}

  /* ---- master timeline keyframes (percent of --cycle) ---- */
  @keyframes stepTrigger{
    0%,2%{opacity:0;transform:translateY(14px) scale(.96)}
    8%{opacity:1;transform:translateY(0) scale(1)}
    89%{opacity:1;transform:translateY(0) scale(1)}
    96%,100%{opacity:0;transform:translateY(14px) scale(.96)}
  }
  @keyframes drawC1{
    0%,8%{transform:scaleY(0);opacity:1}
    17%{transform:scaleY(1)}
    89%{transform:scaleY(1);opacity:1}
    95%,100%{transform:scaleY(1);opacity:0}
  }
  @keyframes pulseC1{
    0%,8%{opacity:0;transform:translateY(0)}
    10%{opacity:1}
    16%{opacity:1;transform:translateY(78px)}
    19%,100%{opacity:0;transform:translateY(84px)}
  }
  @keyframes stepAgent{
    0%,15%{opacity:0;transform:translateY(16px) scale(.96)}
    22%{opacity:1;transform:translateY(0) scale(1)}
    89%{opacity:1;transform:translateY(0) scale(1)}
    96%,100%{opacity:0;transform:translateY(16px) scale(.96)}
  }
  @keyframes sheen{
    0%,23%{transform:translateX(-140%) skewX(-12deg)}
    34%,100%{transform:translateX(320%) skewX(-12deg)}
  }
  @keyframes badgePop{
    0%,25%{opacity:0;transform:scale(.5)}
    31%{opacity:1;transform:scale(1.1)}
    34%,100%{opacity:1;transform:scale(1)}
  }
  @keyframes drawC2{
    0%,36%{transform:scaleY(0);opacity:1}
    45%{transform:scaleY(1)}
    89%{transform:scaleY(1);opacity:1}
    95%,100%{transform:scaleY(1);opacity:0}
  }
  @keyframes pulseC2{
    0%,36%{opacity:0;transform:translateY(0)}
    38%{opacity:1}
    44%{opacity:1;transform:translateY(78px)}
    47%,100%{opacity:0;transform:translateY(84px)}
  }
  @keyframes stepResult{
    0%,45%{opacity:0;transform:translateY(14px) scale(.96)}
    52%{opacity:1;transform:translateY(0) scale(1)}
    89%{opacity:1;transform:translateY(0) scale(1)}
    96%,100%{opacity:0;transform:translateY(14px) scale(.96)}
  }
  @keyframes checkPop{
    0%,52%{opacity:0;transform:scale(.2)}
    58%{opacity:1;transform:scale(1.2)}
    62%,100%{opacity:1;transform:scale(1)}
  }

  /* --- sparkles: continuous staggered twinkle --- */
  .spark{position:absolute;animation:twinkle 3.2s ease-in-out infinite}
  .spark svg{width:100%;height:100%}
  @keyframes twinkle{
    0%,100%{opacity:.25;transform:scale(.65)}
    50%{opacity:1;transform:scale(1.12)}
  }
  .sp1{left:271px;top:273px;width:10px;height:10px;animation-delay:.2s}
  .sp2{left:131px;top:483px;width:10px;height:10px;animation-delay:1.4s;animation-duration:4s}
  .sp3{left:311px;top:283px;width:10px;height:10px;animation-delay:2.1s;animation-duration:2.7s}
  .sp4{left:170px;top:252px;width:12px;height:12px;animation-delay:.8s;animation-duration:3.6s}
  .sp5{left:361px;top:243px;width:12px;height:12px;animation-delay:2.8s}
  .sp6{left:141px;top:293px;width:8px;height:8px;animation-delay:1.9s;animation-duration:2.5s}
  .sp7{left:331px;top:303px;width:8px;height:8px;animation-delay:.5s;animation-duration:3.8s}
  .sp8{left:331px;top:483px;width:8px;height:8px;animation-delay:2.4s;animation-duration:3s}
  .sp9{left:361px;top:463px;width:8px;height:8px;animation-delay:1.1s;animation-duration:4.2s}

  @media (prefers-reduced-motion: reduce){
    .frame *{animation:none !important}
    .connector .line{transform:scaleY(1)}
    .connector .spark-dot{display:none}
    .agent-card::after{display:none}
    .n-trigger,.n-agent,.n-result,.badge,.ic-check,.logo-row,.tagline{opacity:1;transform:none}
    .spark{opacity:.9}
  }

  /* ============================================================
     RIGHT — sign-in form
     ============================================================ */
  .form-col{position:absolute;left:814px;top:calc(50% - 12px);transform:translateY(-50%);width:360px;display:flex;flex-direction:column;gap:32px;align-items:center}
  .form-title{width:100%;font-weight:500;font-size:36px;line-height:40px;letter-spacing:-1.44px;color:var(--text-primary)}
  .form-stack{display:flex;flex-direction:column;gap:32px;align-items:center;width:100%}
  .fields{display:flex;flex-direction:column;gap:24px;width:100%}
  .field-group{display:flex;flex-direction:column;gap:16px}
  .field{display:flex;flex-direction:column;gap:4px;width:360px}
  .field-label{font-weight:400;font-size:14px;line-height:20px;letter-spacing:-.56px;color:var(--text-primary)}
  .input{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px;background:var(--bg-input);border:1px solid var(--stroke-default);border-radius:8px}
  .input input{border:none;outline:none;background:transparent;flex:1;font-family:var(--font);font-weight:400;font-size:14px;line-height:20px;letter-spacing:-.56px;color:var(--text-primary)}
  .input input::placeholder{color:var(--text-tertiary)}
  .input .ic-hide{width:20px;height:20px;flex:none;cursor:pointer}
  .input .ic-hide svg{width:100%;height:100%}
  .btn-signin{display:flex;align-items:center;justify-content:center;width:100%;padding:12px 16px;background:var(--bg-disabled);border:none;border-radius:8px;font-family:var(--font);font-weight:500;font-size:14px;line-height:20px;letter-spacing:-.56px;color:var(--text-disabled);cursor:not-allowed}
  .divider{display:flex;align-items:center;gap:2px}
  .divider .rule{width:135px;height:1px;background:var(--stroke-default)}
  .divider .or{padding:0 6px;font-weight:500;font-size:12px;line-height:16px;letter-spacing:-.24px;color:var(--text-tertiary)}
  .btn-sso{display:flex;align-items:center;justify-content:center;width:100%;padding:10px 16px;background:var(--btn-primary);border:1px solid var(--stroke-default);border-radius:8px;font-family:var(--font);font-weight:500;font-size:14px;line-height:20px;letter-spacing:-.56px;color:#fff;cursor:pointer;transition:background .2s}
  .btn-sso:hover{background:var(--blue-600)}
  .terms{position:absolute;left:994px;bottom:24px;transform:translateX(-50%);width:326px;font-weight:400;font-size:12px;line-height:16px;letter-spacing:-.24px;color:var(--text-secondary);text-align:center}
  .terms a{color:var(--text-primary);font-weight:500;text-decoration:underline;text-underline-position:from-font}
</style>
</head>
