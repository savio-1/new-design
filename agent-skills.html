<meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cogentiq Builder — Skills</title>
  <meta name="description" content="Every skill the workspace agents can use, with its files and doc previews." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    /* ══════════════════════════════════════════════════════════════
       DESIGN VARIABLES — taken verbatim from the Figma library
       (Cogentiq · Builder, "Models- with tags", dark mode)
       ══════════════════════════════════════════════════════════════ */
    :root {
      /* Backgrounds ------------------------------------------------ */
      --backgrounds-page-bg-1:            #121212;
      --backgrounds-page-bg-2:            #212121;
      --backgrounds-page-bg-3:            #1b1b1b;
      --backgrounds-page-bg-4:            #121212;
      --backgrounds-card-bg-2:            #212121;
      --backgrounds-card-bg-3:            #323232;
      --backgrounds-card-bg-4:            #323232;
      --backgrounds-card-bg-5:            #1b1b1b;
      --backgrounds-table-select:         #0d193f;
      --backgrounds-type-search-default:  #121212;
      --backgrounds-button-primary:       #0d99ff;
      --backgrounds-button-tonal-1:       #093077;
      --backgrounds-seg-control-tabs-1:   #424242;
      --backgrounds-icon-blue-2:          #0d99ff33;
      --backgrounds-checkbox-default:     #1b1b1b;
      --backgrounds-checkbox-focus:       #0d99ff;
      --backgrounds-badge-blue:           #09112b;
      --backgrounds-badge-cyan:           #051b29;
      --backgrounds-badge-green:          #031d11;
      --backgrounds-badge-light-green:    #14280c;
      --backgrounds-table-default:         #121212;

      /* Strokes ---------------------------------------------------- */
      --strokes-card-default:   #424242;
      --strokes-card-selected:  #0d99ff;
      --strokes-type-default:   #424242;
      --strokes-type-focus:     #007be5;
      --strokes-line-1:         #424242;
      --strokes-line-3:         #323232;
      --strokes-icon-default:   #9e9e9e;
      --strokes-checkbox-default: #616161;
      --strokes-checkbox-focus: #0d99ff;
      --strokes-colour-blue:        #093077;
      --strokes-colour-cyan:        #093c53;
      --strokes-colour-light-green: #214314;

      /* Text ------------------------------------------------------- */
      --text-primary:              #ffffff;
      --text-secondary:            #bdbdbd;
      --text-teritiary:            #8c8c8c;
      --text-coloured-blue:        #44aaf3;
      --text-coloured-indigo:      #a0a5f7;
      --text-coloured-green:       #85e0a3;
      --text-coloured-cyan:        #35caf0;
      --text-coloured-light-green: #7cb342;
      --text-button-white:   #ffffff;
      --text-button-tonal-1: #80caff;
      --text-button-tonal-2: #bdbdbd;

      /* Palette (used by the platform-rail gradients) --------------- */
      --blue-300: #bde3ff;  --blue-500: #0d99ff;  --blue-600: #007be5;
      --purple-300: #e4ccff; --purple-500: #9747ff; --purple-600: #8638e5;
      --indigo-300: #c2c5fa; --indigo-500: #5860ed; --indigo-600: #454de0;
      --orange-300: #fcd19c; --orange-600: #fc9e24; --orange-800: #dd7c0e;
      --green-300: #aff4c6;  --green-500: #14ae5c;  --green-600: #009951;

      /* Two badge families the Figma library does not yet publish a
         token for; derived in the same key as the published pairs so
         the tag palette stays consistent. */
      --backgrounds-badge-indigo: #0b0f2e;
      --strokes-colour-indigo:    #2b3180;
      --strokes-colour-green:     #0a3a22;

      /* Type ------------------------------------------------------- */
      --font-geist: "Geist", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-geist-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --fs-caption:  12px;   /* Type/Font Size/Body/Caption */
      --fs-body-3:   14px;   /* Type/Font Size/Body/Body 3 */
      --fs-body-2:   16px;   /* Type/Font Size/Body/Body 2 */
      --lh-body-2:   24px;   /* Type/Line Height/Body/Body 2 */
      --lh-body-3:   20px;   /* Type/Line Height/Body/Body 3 */

      /* Effects ---------------------------------------------------- */
      --shadow-sidebar: drop-shadow(1px 0 1px rgba(18, 18, 18, .12));
      --shadow-bar:     drop-shadow(0 1px 1px rgba(18, 18, 18, .12));
      --shadow-card:    drop-shadow(0 1px 1.5px rgba(18, 18, 18, .16));
      --shadow-panel:   -8px 0 24px rgba(0, 0, 0, .2);
      --shadow-pop:     0 -1px 2px rgba(0, 0, 0, .04), 0 4px 8px rgba(0, 0, 0, .12), 0 2px 16px rgba(33, 33, 33, .16);
      --shadow-tab:     0 1px 2px rgba(33, 33, 33, .2);

      --backgrounds-type-default-bg-1: #323232;
      --backgrounds-type-default-bg-2: #323232;
      --backgrounds-disabled-tonal-1:  #093077;
      --backgrounds-disabled-tonal-2:  #424242;
      --text-disabled-tonal-1: #0768cf;
      --text-disabled-tonal-2: #757575;
      --shadow-modal: 0 4px 12px rgba(33, 33, 33, .16);
      --scrim: rgba(18, 18, 18, .6);

      /* The exported OpenAI mark is a single shape; it inverts per theme. */
      --logo-openai: #ffffff;

      /* Layout constants straight off the frame -------------------- */
      --rail-w:    68px;
      --sidebar-w: 240px;
      --panel-w:   420px;
      --card-h:    120px;
    }


    /* ══════════════════════════════════════════════════════════════
       LIGHT MODE — the same Figma variables in their light values.
       Dark is the default, as designed; the header toggle stamps
       data-mode="light" on the root element to switch.
       ══════════════════════════════════════════════════════════════ */
    :root[data-mode="light"] {
      /* Backgrounds */
      --backgrounds-page-bg-1:            #fafafa;
      --backgrounds-page-bg-2:            #ffffff;
      --backgrounds-page-bg-3:            #f5f5f5;
      --backgrounds-page-bg-4:            #f0f0f0;
      --backgrounds-card-bg-2:            #ffffff;
      --backgrounds-card-bg-3:            #ffffff;
      --backgrounds-card-bg-4:            #f5f5f5;
      --backgrounds-card-bg-5:            #ffffff;
      --backgrounds-table-select:         #e5f4ff;
      --backgrounds-type-search-default:  #f5f5f5;
      --backgrounds-button-primary:       #0d99ff;
      --backgrounds-button-tonal-1:       #e5f4ff;
      --backgrounds-seg-control-tabs-1:   #eeeeee;
      --backgrounds-icon-blue-2:          #0d99ff33;
      --backgrounds-checkbox-default:     #ffffff;
      --backgrounds-checkbox-focus:       #0d99ff;
      --backgrounds-badge-blue:           #f2f9ff;
      --backgrounds-badge-cyan:           #effcff;
      --backgrounds-badge-green:          #ebffee;
      --backgrounds-badge-light-green:    #f1f8e9;
      /* No light value is published for this token; the component's
         own fallback in the exported markup is white. */
      --backgrounds-table-default:         #ffffff;

      /* Strokes */
      --strokes-card-default:     #eeeeee;
      --strokes-card-selected:    #0d99ff;
      --strokes-type-default:     #e0e0e0;
      --strokes-type-focus:       #0d99ff;
      --strokes-line-1:           #eeeeee;
      --strokes-line-3:           #f5f5f5;
      --strokes-icon-default:     #616161;
      --strokes-checkbox-default: #bdbdbd;
      --strokes-checkbox-focus:   #0d99ff;
      --strokes-colour-blue:        #e5f4ff;
      --strokes-colour-cyan:        #cef0f8;
      --strokes-colour-light-green: #c5e1a5;

      /* Text */
      --text-primary:              #121212;
      --text-secondary:            #616161;
      --text-teritiary:            #8c8c8c;
      --text-coloured-blue:        #0d99ff;
      --text-coloured-indigo:      #5860ed;
      --text-coloured-green:       #14ae5c;
      --text-coloured-cyan:        #00a2c2;
      --text-coloured-light-green: #689f38;
      --text-button-white:   #ffffff;
      --text-button-tonal-1: #007be5;
      --text-button-tonal-2: #757575;

      /* Derived pairs, keyed off the palette like the published ones */
      --backgrounds-badge-indigo: #f0f1fe;
      --strokes-colour-indigo:    #c2c5fa;
      --strokes-colour-green:     #aff4c6;

      /* Effects */
      --shadow-sidebar: drop-shadow(1px 0 1px rgba(18, 18, 18, .06));
      --shadow-bar:     drop-shadow(0 1px 1px rgba(18, 18, 18, .06));
      --shadow-card:    drop-shadow(0 1px 1.5px rgba(18, 18, 18, .08));
      --shadow-panel:   -8px 0 24px rgba(18, 18, 18, .12);
      --shadow-pop:     0 -1px 2px rgba(0, 0, 0, .04), 0 4px 8px rgba(18, 18, 18, .08), 0 2px 16px rgba(33, 33, 33, .10);
      --shadow-tab:     0 1px 2px rgba(33, 33, 33, .12);

      --backgrounds-type-default-bg-1: #f5f5f5;
      --backgrounds-type-default-bg-2: #ffffff;
      --backgrounds-disabled-tonal-1:  #e5f4ff;
      --backgrounds-disabled-tonal-2:  #eeeeee;
      /* Text/Disabled/Tonal-1 publishes no light value; keyed off Blue/400
         the way the dark pair is keyed off its own ramp. */
      --text-disabled-tonal-1: #80caff;
      --text-disabled-tonal-2: #bdbdbd;
      --shadow-modal: 0 4px 12px rgba(33, 33, 33, .12);
      --scrim: rgba(18, 18, 18, .45);

      --logo-openai: #121212;
    }

    /* Body1/Med, Body2/Reg … as reusable type ramps */
    .t-subhead1-med { font: 500 24px/32px var(--font-geist); letter-spacing: -0.96px; }
    .t-subhead2-med { font: 500 18px/24px var(--font-geist); letter-spacing: -0.72px; }
    .t-body1-med    { font: 500 var(--fs-body-2)/var(--lh-body-2) var(--font-geist); letter-spacing: -0.64px; }
    .t-body2-med    { font: 500 var(--fs-body-3)/var(--lh-body-3) var(--font-geist); letter-spacing: -0.56px; }
    .t-body2-reg    { font: 400 var(--fs-body-3)/var(--lh-body-3) var(--font-geist); letter-spacing: -0.56px; }
    .t-caption1-med { font: 500 var(--fs-caption)/var(--fs-body-2) var(--font-geist); letter-spacing: -0.24px; }
    .t-caption1-reg { font: 400 var(--fs-caption)/var(--fs-body-2) var(--font-geist); letter-spacing: -0.24px; }

    /* ══════════════════════════════════════════════════════════════
       RESET
       ══════════════════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--backgrounds-page-bg-1);
      color: var(--text-primary);
      font-family: var(--font-geist);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    input  { font: inherit; color: inherit; background: none; border: 0; outline: 0; }
    .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    .ic { display: block; flex: none; }

    /* ══════════════════════════════════════════════════════════════
       APP SHELL   (Figma frame "Models" · 1440 × 820)
       ══════════════════════════════════════════════════════════════ */
    .app { display: flex; height: 100vh; background: var(--backgrounds-page-bg-1); }

    /* ── Platform panel (left rail, 68px) ───────────────────────── */
    .rail {
      width: var(--rail-w); flex: none;
      background: var(--backgrounds-page-bg-1);
      display: flex; flex-direction: column; align-items: flex-start; gap: 16px;
      padding: 8px 16px;
      overflow: hidden;
    }
    .rail-logo { width: 36px; display: flex; align-items: center; justify-content: center; padding: 8px 0; }
    .rail-logo > span {
      width: 32px; height: 32px; border-radius: 100px; overflow: hidden;
      background: var(--backgrounds-page-bg-2);
      display: flex; align-items: center; justify-content: center;
    }
    .rail-group { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
    .rail-brandtile {
      width: 36px; height: 36px; border-radius: 8px; overflow: hidden;
      background: var(--backgrounds-card-bg-3);
      display: flex; align-items: center; justify-content: center; position: relative;
    }
    .rail-brandtile .bg { position: absolute; inset: 0; overflow: hidden; }
    .rail-brandtile .bg svg { position: absolute; }
    .rail-brandtile .mark { position: relative; width: 24px; height: 15.6px; }
    .rail-rule { width: 36px; height: 1px; background: var(--strokes-line-1); }
    .rail-btn {
      width: 36px; height: 36px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: var(--strokes-icon-default);
      transition: background .15s ease, color .15s ease;
    }
    .rail-btn:hover { background: var(--backgrounds-card-bg-4); color: var(--text-secondary); }
    .rail-btn.is-active {
      background: var(--backgrounds-button-tonal-1);
      border: 1px solid var(--strokes-card-selected);
    }
    .rail-stack { display: flex; flex-direction: column; align-items: flex-start; }
    .rail-tile { width: 36px; display: flex; align-items: center; justify-content: center; }
    .rail-tile > span {
      width: 24px; height: 24px; border-radius: 6px; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .grad-blue   { background-image: linear-gradient(225.24deg, var(--blue-600) 8.84%, var(--blue-500) 54.42%, var(--blue-300) 100%); }
    .grad-purple { background-image: linear-gradient(225.24deg, var(--purple-600) 8.84%, var(--purple-500) 54.42%, var(--purple-300) 100%); }
    .grad-indigo { background-image: linear-gradient(225.24deg, var(--indigo-600) 8.84%, var(--indigo-500) 54.42%, var(--indigo-300) 100%); }
    .grad-orange { background-image: linear-gradient(225.24deg, var(--orange-800) 8.84%, var(--orange-600) 54.42%, var(--orange-300) 100%); }
    .grad-green  { background-image: linear-gradient(225.24deg, var(--green-600) 8.84%, var(--green-500) 54.42%, var(--green-300) 100%); }

    /* ── Main content ───────────────────────────────────────────── */
    .main { flex: 1 1 auto; min-width: 0; padding: 8px 8px 8px 0; }
    .content-wrapper {
      height: 100%;
      display: flex; flex-direction: column;
      border: 1px solid var(--strokes-line-3);
      border-radius: 12px;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────────────── */
    .header {
      flex: none; height: 48px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 16px;
      background: var(--backgrounds-card-bg-5);
      border-bottom: 1px solid var(--strokes-line-3);
    }
    .header-left { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 12px; }
    .header-left .sub { color: var(--text-teritiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .icon-btn-32 {
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-teritiary);
      transition: background .15s ease;
    }
    .icon-btn-32:hover { background: var(--backgrounds-card-bg-4); }
    .ws-dropdown {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 8px; border-radius: 8px;
      color: var(--text-teritiary);
      transition: background .15s ease;
    }
    .ws-dropdown:hover { background: var(--backgrounds-card-bg-4); }
    .ws-dropdown .name { color: var(--text-primary); }
    .avatar { position: relative; width: 20px; height: 20px; flex: none; }
    .avatar svg { width: 20px; height: 20px; }
    .avatar span {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font: 400 var(--fs-caption)/var(--fs-body-2) var(--font-geist); letter-spacing: -0.24px;
    }
    .header-avatar { width: 32px; height: 32px; border-radius: 100px; display: block; }

    /* ── Main section ───────────────────────────────────────────── */
    .main-section { flex: 1 1 auto; min-height: 0; display: flex; }

    /* ── Sidebar (240px) ────────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w); flex: none;
      background: var(--backgrounds-card-bg-5);
      border-right: 1px solid var(--strokes-line-3);
      padding: 20px 12px 24px;
      overflow-y: auto;
      filter: var(--shadow-sidebar);
    }
    .side-item {
      width: 100%; height: 36px;
      display: flex; align-items: center; gap: 6px;
      padding: 0 12px; border-radius: 8px;
      border: 1px solid transparent;
      color: var(--text-teritiary);
      text-align: left;
      transition: background .15s ease, color .15s ease;
    }
    .side-item .lbl { flex: 1 1 auto; min-width: 0; }
    .side-item:hover { background: var(--backgrounds-card-bg-4); }
    .side-item.is-active {
      background: var(--backgrounds-table-select);
      border-color: var(--strokes-colour-blue);
      color: var(--text-coloured-blue);
      font-weight: 500;
    }
    .side-item.is-active:hover { background: var(--backgrounds-table-select); }
    .prov {
      flex: none; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      color: var(--logo-openai);
    }
    .prov img, .prov svg { display: block; }

    /* ── Model containers wrapper ───────────────────────────────── */
    .models { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }

    /* Filters container (title + search + New model) */
    .filters-bar {
      flex: none; height: 60px;
      display: flex; align-items: center; gap: 16px;
      padding: 12px 24px;
      background: var(--backgrounds-card-bg-5);
      border-bottom: 1px solid var(--strokes-line-3);
      filter: var(--shadow-bar);
    }
    .filters-bar .title-row { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 8px; }
    .count-pill {
      display: flex; align-items: center; gap: 4px;
      height: 24px; padding: 0 6px; border-radius: 8px;
      background: var(--backgrounds-card-bg-4);
      border: 1px solid var(--strokes-type-default);
      color: var(--text-teritiary);
    }
    .bar-actions { flex: none; display: flex; align-items: center; gap: 12px; }
    .search-field {
      width: 239px; height: 36px;
      display: flex; align-items: center; gap: 8px;
      padding: 0 12px; border-radius: 8px;
      background: var(--backgrounds-type-search-default);
      border: 1px solid var(--strokes-type-default);
      color: var(--text-teritiary);
      transition: border-color .15s ease;
    }
    .search-field:focus-within { border-color: var(--strokes-type-focus); }
    .search-field input { flex: 1 1 auto; min-width: 0; color: var(--text-primary); }
    .search-field input::placeholder { color: var(--text-teritiary); }
    .btn-primary {
      display: flex; align-items: center; justify-content: center; gap: 4px;
      padding: 8px 12px; border-radius: 8px;
      background: var(--backgrounds-button-primary);
      color: var(--text-button-white);
    }
    .btn-primary:hover { filter: brightness(1.08); }

    /* Scroll region */
    .model-scroll {
      flex: 1 1 auto; min-height: 0; overflow-y: auto;
      padding: 16px 24px 24px;
      background: var(--backgrounds-page-bg-4);
    }
    .model-scroll::-webkit-scrollbar { width: 10px; }
    .model-scroll::-webkit-scrollbar-thumb { background: var(--strokes-type-default); border: 3px solid transparent; background-clip: content-box; border-radius: 8px; }

    /* Filter row (Tags / Created by / All time + view toggle) */
    .filter-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; height: 32px; }
    .filter-left { display: flex; align-items: flex-start; gap: 8px; }
    .filter-group { position: relative; }
    .dropdown {
      height: 32px;
      display: flex; align-items: center; gap: 4px;
      padding: 0 8px 0 12px; border-radius: 8px;
      background: var(--backgrounds-card-bg-5);
      border: 1px solid var(--strokes-line-3);
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .dropdown:hover { border-color: var(--strokes-line-1); }
    .dropdown .chev { color: var(--text-teritiary); }
    .dropdown.is-open { border-color: var(--strokes-checkbox-focus); }
    .dropdown .badge {
      display: none;
      min-width: 20px; height: 20px; justify-content: center; align-items: center; gap: 4px;
      padding: 0 4px; border-radius: 8px;
      background: var(--backgrounds-badge-blue);
      border: 1px solid var(--strokes-colour-blue);
      color: var(--text-coloured-blue);
    }
    .dropdown.has-count .badge { display: flex; }
    .seg-view {
      display: flex; align-items: center; gap: 4px;
      padding: 4px; border-radius: 10px;
      background: var(--backgrounds-page-bg-2);
    }
    .seg-view button {
      display: flex; align-items: center; justify-content: center;
      padding: 4px; border-radius: 8px;
      color: var(--text-teritiary);
    }
    .seg-view button.is-active { background: var(--backgrounds-icon-blue-2); color: var(--text-coloured-blue); }

    /* Tags popover */
    .tag-pop {
      position: absolute; top: 36px; left: 0; z-index: 40; width: 277px;
      max-width: calc(100vw - 32px);
      display: none; flex-direction: column;
      padding: 4px 0 8px;
      background: var(--backgrounds-card-bg-3);
      border: 1px solid var(--strokes-card-default);
      border-radius: 12px;
      box-shadow: var(--shadow-pop);
    }
    .tag-pop.is-open { display: flex; }
    .tag-pop-head { display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
    .tag-pop-head .search-field { width: 180px; height: 32px; }
    .tag-pop-head .btn-tonal { height: 32px; }
    .btn-tonal {
      display: flex; align-items: center; justify-content: center; gap: 4px;
      padding: 6px 8px; border-radius: 8px;
      background: var(--backgrounds-button-tonal-1);
      color: var(--text-button-tonal-1);
    }
    .btn-tonal:hover { filter: brightness(1.18); }
    .tag-pop-list { display: flex; flex-direction: column; padding: 0 8px; max-height: 288px; overflow-y: auto; }
    .tag-opt {
      width: 100%; height: 36px;
      display: flex; align-items: center; gap: 8px;
      padding: 0 16px; border-radius: 8px;
      color: var(--text-secondary);
      text-align: left;
    }
    .tag-opt:hover { background: var(--backgrounds-card-bg-4); }
    .tag-opt .lbl { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tag-opt .tick { display: none; flex: none; color: var(--text-coloured-blue); }
    .tag-opt.is-picked { color: var(--text-primary); }
    .tag-opt.is-picked .tick { display: block; }
    .pop-empty { padding: 10px 16px 14px; color: var(--text-teritiary); }
    .tag-opt .box {
      width: 16px; height: 16px; flex: none; border-radius: 4px;
      background: var(--backgrounds-checkbox-default);
      border: 1px solid var(--strokes-checkbox-default);
      display: flex; align-items: center; justify-content: center;
    }
    .tag-opt .box svg { display: none; width: 12px; height: 12px; color: #fff; }
    .tag-opt.is-checked .box { background: var(--backgrounds-checkbox-focus); border-color: var(--backgrounds-checkbox-focus); }
    .tag-opt.is-checked .box svg { display: block; }
    .tag-opt.is-checked { color: var(--text-primary); }

    /* ── Model cards ────────────────────────────────────────────── */
    .card-area { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
    /* `.card-area`/`.table-area` both set their own `display`, which as an
       author rule outranks the UA stylesheet's `[hidden]{display:none}` —
       so the boolean attribute needs restating here to actually hide them. */
    .card-area[hidden], .table-area[hidden] { display: none; }
    @media (max-width: 1180px) { .card-area { grid-template-columns: minmax(0, 1fr); } }

    .card {
      height: var(--card-h);
      display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
      padding: 16px; border-radius: 12px;
      background: var(--backgrounds-page-bg-2);
      border: 1px solid transparent;
      text-align: left; width: 100%;
      filter: var(--shadow-card);
      transition: border-color .15s ease, background .15s ease;
    }
    .card:hover { border-color: var(--strokes-line-1); }
    .card.is-selected { border-color: var(--strokes-type-focus); }
    .card.is-selected:hover { border-color: var(--strokes-type-focus); }

    .card-top { width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
    .card-title-row { width: 100%; display: flex; align-items: center; gap: 8px; padding: 2px 0; }
    .logo-box {
      width: 32px; height: 32px; flex: none; border-radius: 6px; overflow: hidden;
      background: var(--backgrounds-page-bg-3);
      position: relative;
    }
    .card-title { color: var(--text-primary); }
    .card-desc {
      width: 100%;
      font: 400 12px/16px var(--font-geist); letter-spacing: -0.24px;
      color: var(--text-teritiary);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      transition: color .15s ease;
    }
    .card:hover .card-desc, .card.is-selected .card-desc { color: var(--text-secondary); }

    .card-bottom { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .tag-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .tag-group { display: flex; align-items: center; gap: 6px; }

    /* Model tag — Backgrounds/Page/bg-1 + Strokes/Card/Default, r12 */
    .tag-model {
      height: 16px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 8px; border-radius: 12px; line-height: 1;
      background: var(--backgrounds-page-bg-1);
      border: 1px solid var(--strokes-card-default);
      font: 400 11px/normal var(--font-geist-mono); letter-spacing: -0.11px;
      color: var(--text-teritiary);
      white-space: nowrap;
    }
    /* Category tag — Strokes/Line-1, r6. Text turns coloured on hover / select. */
    .tag {
      height: 16px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 6px; border-radius: 6px; line-height: 1;
      border: 1px solid var(--strokes-line-1);
      font: 400 11px/normal var(--font-geist-mono); letter-spacing: -0.11px;
      color: var(--text-teritiary);
      white-space: nowrap;
      transition: color .15s ease;
    }
    .card:hover .tag[data-tone="blue"],        .card.is-selected .tag[data-tone="blue"]        { color: var(--text-coloured-blue); }
    .card:hover .tag[data-tone="indigo"],      .card.is-selected .tag[data-tone="indigo"]      { color: var(--text-coloured-indigo); }
    .card:hover .tag[data-tone="green"],       .card.is-selected .tag[data-tone="green"]       { color: var(--text-coloured-green); }
    .card:hover .tag[data-tone="cyan"],        .card.is-selected .tag[data-tone="cyan"]        { color: var(--text-coloured-cyan); }
    .card:hover .tag[data-tone="light-green"], .card.is-selected .tag[data-tone="light-green"] { color: var(--text-coloured-light-green); }

    .card-props { flex: none; display: flex; align-items: center; gap: 6px; }
    .icon-btn-24 {
      width: 24px; height: 24px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-teritiary);
      transition: background .15s ease;
    }
    .icon-btn-24:hover { background: var(--backgrounds-card-bg-4); }


    /* ══════════════════════════════════════════════════════════════
       TABLE VIEW  (Figma "Table" frame — same catalog, tabular layout)
       ══════════════════════════════════════════════════════════════ */
    .table-area {
      --t-cols: 360px minmax(140px, 1fr) 200px 160px minmax(120px, 1fr) 100px;
      margin-top: 16px;
      border: 1px solid var(--strokes-line-3);
      border-radius: 12px;
      overflow: hidden;
    }
    .t-head, .t-row {
      display: grid; grid-template-columns: var(--t-cols); align-items: center;
    }
    .t-head {
      height: 32px;
      background: var(--backgrounds-page-bg-3);
    }
    .t-head span {
      padding: 8px 12px;
      color: var(--text-secondary);
    }
    .t-row {
      width: 100%; height: 66px;
      background: var(--backgrounds-table-default);
      border-top: 1px solid var(--strokes-line-3);
      text-align: left; cursor: pointer;
      transition: background .15s ease;
    }
    .t-row:hover { background: var(--backgrounds-page-bg-3); }
    .t-row .tag { transition: color .15s ease; }
    .t-row:hover .tag[data-tone="blue"],        .t-row.is-selected .tag[data-tone="blue"]        { color: var(--text-coloured-blue); }
    .t-row:hover .tag[data-tone="indigo"],      .t-row.is-selected .tag[data-tone="indigo"]      { color: var(--text-coloured-indigo); }
    .t-row:hover .tag[data-tone="green"],       .t-row.is-selected .tag[data-tone="green"]       { color: var(--text-coloured-green); }
    .t-row:hover .tag[data-tone="cyan"],        .t-row.is-selected .tag[data-tone="cyan"]        { color: var(--text-coloured-cyan); }
    .t-row:hover .tag[data-tone="light-green"], .t-row.is-selected .tag[data-tone="light-green"] { color: var(--text-coloured-light-green); }
    .t-row.is-selected {
      background: var(--backgrounds-table-select);
      box-shadow: inset 3px 0 0 var(--strokes-card-selected);
    }
    .t-cell { min-width: 0; padding: 12px; display: flex; align-items: center; }
    .t-model-cell { gap: 8px; }
    .t-model-cell .logo-box { flex: none; }
    .t-model-info { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .t-model-info .name {
      color: var(--text-primary);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .t-model-info .desc {
      color: var(--text-teritiary);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .t-tags-cell { gap: 6px; flex-wrap: wrap; }
    .t-by-cell { gap: 6px; }
    .t-by-cell .nm {
      color: var(--text-primary);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .t-updated-cell { color: var(--text-teritiary); }
    .t-muted { color: var(--text-teritiary); }
    .t-actions-cell { gap: 4px; }
    .t-empty { padding: 48px 0; text-align: center; color: var(--text-teritiary); }

    @media (max-width: 1180px) {
      .table-area { overflow-x: auto; }
      .t-head, .t-row { width: max-content; min-width: 100%; }
    }

    .empty {
      grid-column: 1 / -1;
      padding: 48px 0; text-align: center; color: var(--text-teritiary);
    }

    /* ══════════════════════════════════════════════════════════════
       MODEL DETAIL PANEL  (420px overlay, right edge)
       ══════════════════════════════════════════════════════════════ */
    .panel {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 60;
      width: var(--panel-w);
      display: flex; flex-direction: column; align-items: flex-start;
      padding: 20px 0 16px;
      background: var(--backgrounds-page-bg-2);
      border-left: 1px solid var(--strokes-line-3);
      box-shadow: var(--shadow-panel);
      overflow-y: auto;
      transform: translateX(100%);
      visibility: hidden;
      transition: transform .28s cubic-bezier(.4, 0, .2, 1), visibility .28s;
    }
    .panel.is-open { transform: translateX(0); visibility: visible; }

    .panel-head {
      width: 100%; flex: none;
      display: flex; flex-direction: column; gap: 16px;
      padding: 8px 16px 20px;
      border-bottom: 1px solid var(--strokes-line-1);
    }
    .panel-tags-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .panel-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    /* Panel tag — coloured badge background + coloured stroke */
    .tag-badge {
      height: 18px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 6px; border-radius: 6px; line-height: 1;
      font: 400 12px/normal var(--font-geist-mono); letter-spacing: -0.12px;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .tag-badge[data-tone="blue"]        { background: var(--backgrounds-badge-blue);        border-color: var(--strokes-colour-blue);        color: var(--text-coloured-blue); }
    .tag-badge[data-tone="indigo"]      { background: var(--backgrounds-badge-indigo);      border-color: var(--strokes-colour-indigo);      color: var(--text-coloured-indigo); }
    .tag-badge[data-tone="green"]       { background: var(--backgrounds-badge-green);       border-color: var(--strokes-colour-green);       color: var(--text-coloured-green); }
    .tag-badge[data-tone="cyan"]        { background: var(--backgrounds-badge-cyan);        border-color: var(--strokes-colour-cyan);        color: var(--text-coloured-cyan); }
    .tag-badge[data-tone="light-green"] { background: var(--backgrounds-badge-light-green); border-color: var(--strokes-colour-light-green); color: var(--text-coloured-light-green); }

    .panel-close { width: 16px; height: 16px; color: var(--text-teritiary); flex: none; }
    .panel-close:hover { color: var(--text-primary); }
    .panel-title-block { display: flex; flex-direction: column; gap: 6px; }
    .panel-title-row { display: flex; align-items: center; gap: 8px; }
    .panel-title { color: var(--text-primary); }
    .panel-desc { color: var(--text-teritiary); margin: 0; }

    .panel-actions { display: flex; align-items: center; gap: 12px; }
    .panel-actions .btn-primary { height: 32px; padding: 6px 12px; }
    .panel-actions .btn-tonal { flex: 1 1 auto; height: 32px; padding: 6px 12px; }
    .panel-actions .icon-btn-32 { border-radius: 8px; }

    .panel-seg-wrap { width: 100%; flex: none; padding: 16px; }
    .seg-control {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px; border-radius: 12px;
      background: var(--backgrounds-seg-control-tabs-1);
    }
    .seg-control button {
      padding: 4px 8px; border-radius: 8px;
      color: var(--text-button-tonal-2);
      white-space: nowrap;
    }
    .seg-control button.is-active {
      background: var(--backgrounds-card-bg-2);
      color: var(--text-primary);
      box-shadow: var(--shadow-tab);
    }

    .panel-section {
      width: 100%; flex: none;
      display: flex; flex-direction: column; gap: 8px;
      padding: 20px 16px;
      border-bottom: 1px solid var(--strokes-line-1);
    }
    .panel-section:last-child { border-bottom: 0; }
    .section-header { color: var(--text-teritiary); margin: 0; }
    .rows { display: flex; flex-direction: column; }
    .row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid var(--strokes-line-3);
    }
    .row:last-child { border-bottom: 0; }
    .row.row-pill { padding: 6px 0; border-bottom: 0; }
    .row .k { color: var(--text-teritiary); }
    .row .v { color: var(--text-secondary); text-align: right; }
    .provider-pill {
      height: 24px;
      display: flex; align-items: center; gap: 4px;
      padding: 0 8px; border-radius: 12px;
      background: var(--backgrounds-card-bg-4);
      border: 1px solid var(--strokes-line-3);
      color: var(--text-secondary);
    }
    .provider-pill .divider { width: 1px; height: 14px; background: var(--strokes-line-1); flex: none; }
    .created-by { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
    .created-by .nm { color: var(--text-primary); }
    .status-pill {
      height: 24px;
      display: flex; align-items: center; gap: 4px;
      padding: 0 8px; border-radius: 12px;
      background: var(--backgrounds-badge-green);
      color: var(--text-coloured-green);
    }


    /* ══════════════════════════════════════════════════════════════
       NEW MODEL MODAL  (840px, two panes, two steps)
       ══════════════════════════════════════════════════════════════ */
    .modal-scrim {
      position: fixed; inset: 0; z-index: 80;
      display: none; align-items: center; justify-content: center;
      background: var(--scrim);
      -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
      padding: 24px;
    }
    .modal-scrim.is-open { display: flex; }

    .modal {
      width: 840px; max-width: 100%; max-height: 100%;
      display: flex; flex-direction: column;
      background: var(--backgrounds-page-bg-2);
      border: 1px solid var(--strokes-card-default);
      border-radius: 12px;
      box-shadow: var(--shadow-modal);
      overflow: hidden;
    }

    .mm-head {
      flex: none; height: 48px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--strokes-card-default);
    }
    .mm-head .icon-btn-32 { width: 20px; height: 20px; border-radius: 4px; }

    .mm-body { flex: 1 1 auto; min-height: 448px; display: flex; overflow: hidden; }

    .mm-left {
      width: 480px; flex: none;
      display: flex; flex-direction: column; gap: 12px;
      border-right: 1px solid var(--strokes-line-1);
      overflow-y: auto;
    }
    .mm-right {
      width: 360px; flex: none;
      display: flex; flex-direction: column; justify-content: space-between;
      background: var(--backgrounds-page-bg-1);
    }
    /* Step 1 has nothing to test yet — the settings pane takes the
       full width and the modal narrows to match. */
    .modal.is-basic { width: 520px; }
    .modal.is-basic .mm-left { width: 100%; border-right: 0; }
    .modal.is-basic .mm-right { display: none; }

    .mm-sec-head {
      flex: none;
      display: flex; align-items: center; gap: 6px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--strokes-line-1);
      background: var(--backgrounds-page-bg-2);
      color: var(--text-primary);
    }
    .mm-block { flex: none; padding: 0 24px; }

    /* Step tabs */
    .mm-steps {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px; border-radius: 12px;
      background: var(--backgrounds-seg-control-tabs-1);
    }
    .mm-steps button {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 4px 8px; border-radius: 8px;
      color: var(--text-teritiary);
      white-space: nowrap;
    }
    .mm-steps button.is-active {
      background: var(--backgrounds-card-bg-2);
      color: var(--text-primary);
      box-shadow: var(--shadow-tab);
    }

    /* Fields */
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field > label,
    .field-label { color: var(--text-primary); }
    .field-label-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .field-label-row .ic { color: var(--text-teritiary); }

    .control {
      width: 100%;
      display: flex; align-items: center; gap: 8px;
      padding: 12px; border-radius: 8px;
      background: var(--backgrounds-type-default-bg-1);
      border: 1px solid var(--strokes-type-default);
      color: var(--text-primary);
      transition: border-color .15s ease;
    }
    .control:focus-within { border-color: var(--strokes-type-focus); }
    .control input,
    .control select,
    .control textarea {
      flex: 1 1 auto; min-width: 0;
      color: var(--text-primary);
      background: none; border: 0; outline: 0;
      font: 400 var(--fs-body-3)/var(--lh-body-3) var(--font-geist);
      letter-spacing: -0.56px;
    }
    .control input::placeholder,
    .control textarea::placeholder { color: var(--text-teritiary); }
    .control textarea { resize: none; height: 72px; }
    .control.is-textarea { align-items: flex-start; height: 96px; }
    .control select { appearance: none; cursor: pointer; }
    .control select option { background: var(--backgrounds-page-bg-2); color: var(--text-primary); }
    .control .ic { color: var(--text-teritiary); }

    /* Temperature */
    .temp-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
    .temp-slider { width: 296px; display: flex; flex-direction: column; gap: 12px; }
    .temp-scale {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 6px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }
    .temp-row .control { width: 116px; flex: none; }

    input[type="range"] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 6px; padding: 0; margin: 0;
      border-radius: 9999px; cursor: pointer;
      background: linear-gradient(
        to right,
        var(--backgrounds-button-primary) 0 var(--fill, 35%),
        var(--strokes-card-default) var(--fill, 35%) 100%);
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--backgrounds-button-primary);
      border: 2px solid var(--text-button-white);
      box-shadow: var(--shadow-card);
    }
    input[type="range"]::-moz-range-thumb {
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--backgrounds-button-primary);
      border: 2px solid var(--text-button-white);
    }
    input[type="range"]:focus-visible { outline: 2px solid var(--strokes-type-focus); outline-offset: 4px; }


    /* ══════════════════════════════════════════════════════════════
       WRITE WITH TIQ  — a prompt bar that drafts the description and
       then refines it. Follows the Tiq pattern from the flow builder.
       ══════════════════════════════════════════════════════════════ */
    @property --ang { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
    @keyframes tiqSpin { to { --ang: 360deg; } }

    .control.is-textarea { position: relative; height: 104px; }
    .control.is-textarea textarea { height: 60px; }

    /* 20px tall, 12px type, gradient stroke — sits inside the field. */
    .tiq-btn {
      position: absolute; right: 8px; bottom: 8px; z-index: 2;
      height: 20px; padding: 0 8px; border-radius: 6px;
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--backgrounds-page-bg-2);
      color: var(--text-secondary);
      font: 500 12px/1 var(--font-geist); letter-spacing: -0.12px;
      white-space: nowrap;
    }
    .tiq-btn::before {
      content: ""; position: absolute; inset: 0; border-radius: 6px; padding: 1px;
      background: conic-gradient(from var(--ang), #0d99ff, #5860ed, #f24822, #ffca28, #ffffff, #0d99ff);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      animation: tiqSpin 6s linear infinite;
      pointer-events: none;
    }
    .tiq-btn:hover { color: var(--text-primary); }
    .tiq-btn:active { transform: scale(.96); }
    .tiq-btn.is-on { color: var(--text-primary); }
    .tiq-btn .tiq-mark { width: 13px; height: 13px; flex: none; }

    /* Fixed, so the modal's scroll container and overflow can't clip it.
       Placed beside the description field by positionTiqBar(). */
    .tiq-bar {
      position: fixed; z-index: 90; width: 360px;
      display: none; flex-direction: column;
      background: var(--backgrounds-card-bg-2);
      border: 1px solid var(--strokes-line-3);
      border-radius: 14px;
      box-shadow: var(--shadow-pop);
      opacity: 0; transform: translateY(-4px) scale(.98);
      transition: opacity .16s ease, transform .2s cubic-bezier(.2,.8,.2,1);
    }
    .tiq-bar.is-open { display: flex; }
    .tiq-bar.is-shown { opacity: 1; transform: none; }

    .tb-row {
      position: relative;
      display: flex; align-items: center; gap: 9px;
      margin: 12px; padding: 7px 7px 7px 12px;
      background: var(--backgrounds-type-default-bg-1);
      border: 1px solid var(--strokes-type-default);
      border-radius: 10px;
    }
    .tb-row::before {
      content: ""; position: absolute; inset: -1px; border-radius: 10px; padding: 1px;
      background: conic-gradient(from var(--ang), #0d99ff, #5860ed, #f24822, #ffca28, #ffffff, #0d99ff);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      opacity: 0; transition: opacity .3s ease;
      animation: tiqSpin 5s linear infinite;
      pointer-events: none;
    }
    .tiq-bar.is-focused .tb-row::before { opacity: 1; }
    .tb-row > * { position: relative; z-index: 1; }
    .tb-logo { width: 20px; height: 20px; flex: none; }
    .tb-in {
      flex: 1 1 auto; min-width: 0;

  <style>
    /* ══════════════════════════════════════════════════════════════
       SKILLS MODULE — everything below is this screen's own.
       The chrome above is untouched Model-hub chrome; per the page
       guidelines it must hold still across modules.
       ══════════════════════════════════════════════════════════════ */

    .skills { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }

    /* 3-up grid: min card width, never a hard repeat(3, 1fr), so the
       grid drops a column on a narrow window instead of squeezing. */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .skills-grid[hidden] { display: none; }

    /* ── Skill card ──────────────────────────────────────────────
       Figma: Cogentiq · Builder › "Model Card 7" (node 2818:497285).
       Wrapper is page-bg-2 with a card-bg-4 title strip across the
       top; body is inset 16px and carries the description over a
       right-aligned avatar + options group. Every value below is the
       Figma variable, mapped to its token here. ────────────────────── */
    .skill-card {
      position: relative;
      width: 100%;
      display: flex; flex-direction: column; align-items: flex-start;
      justify-content: center; gap: 12px;
      padding-bottom: 16px;                 /* Figma: pb-16, no top pad */
      border-radius: 12px;
      background: var(--backgrounds-page-bg-2);
      filter: var(--shadow-card);           /* 0 1px 1.5px rgba(18,18,18,.16) */
      text-align: left;
    }
    /* The stroke rides on a positioned overlay rather than the card's own
       background layer: the title strip paints its own background over
       that layer, which swallowed the top and shoulders of the ring.
       Being positioned, this paints above the strip, and inset keeps the
       stroke inside the box the way a Figma stroke does. */
    .skill-card::after {
      content: "";
      position: absolute; inset: 0;
      border: 1px solid transparent;
      border-radius: 12px;
      pointer-events: none;
      transition: border-color .15s ease;
    }
    .skill-card:hover::after { border-color: var(--strokes-line-1); }
    .skill-card.is-selected::after,
    .skill-card.is-selected:hover::after { border-color: var(--strokes-type-focus); }

    /* Title strip — the table header's own surface (page-bg-3), which
       sits far closer to the card than card-bg-4 did, and no stroke.
       Figma specifies card-bg-4 here; this is a deliberate departure to
       take the contrast down. */
    .skill-card__head {
      width: 100%;
      display: flex; align-items: center; gap: 8px;
      padding: 6px 16px;
      border-radius: 12px 12px 0 0;
      background: var(--backgrounds-page-bg-3);
    }
    .skill-card__head .cq-skill-ic { flex: none; color: var(--text-teritiary); }

    /* Skill id — Geist Mono Medium, Body/Body-2 (16/24), tracking -0.64px */
    .skill-card__name {
      flex: 1 1 auto; min-width: 0;
      color: var(--text-primary);
      font: 500 var(--fs-body-2)/var(--lh-body-2) var(--font-geist-mono);
      letter-spacing: -0.64px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .skill-card__body {
      width: 100%;
      display: flex; flex-direction: column; gap: 12px;
      padding: 0 16px;
    }
    /* Description — Caption (12) on Body-2 line height (16), tertiary */
    .skill-card__desc {
      width: 100%;
      font: 400 var(--fs-caption)/var(--fs-body-2) var(--font-geist);
      letter-spacing: -0.24px;
      color: var(--text-teritiary);
      min-height: 32px;                     /* two lines, so cards stay even */
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
      transition: color .15s ease;
    }
    .skill-card:hover .skill-card__desc,
    .skill-card.is-selected .skill-card__desc { color: var(--text-secondary); }

    .skill-card__props {
      width: 100%; height: 24px;
      display: flex; align-items: center; justify-content: flex-end; gap: 6px;
    }

    /* .btn-tonal/.btn-primary set their own display, which outranks the
       [hidden] attribute — restore it so hiding an action works. */
    .btn-tonal[hidden], .btn-primary[hidden] { display: none; }

    /* Source tabs — the chrome's .seg-control, with a muted count. */
    .seg-count { color: var(--text-teritiary); }

    /* ── Table view ──────────────────────────────────────────────
       Columns are this screen's business; the row shell, header and
       selected state come from the chrome. ─────────────────────────── */
    .skills-table {
      --t-cols: minmax(300px, 1.6fr) 100px 170px minmax(130px, 1fr) 92px;
    }
    .t-skill-cell { gap: 8px; }
    .t-skill-cell .cq-skill-ic { flex: none; color: var(--text-teritiary); }
    .t-skill-info { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    /* Same mono Medium voice as the card, at the row's smaller size. */
    .t-skill-name {
      color: var(--text-primary);
      font: 500 14px/20px var(--font-geist-mono); letter-spacing: -0.28px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .t-skill-info .desc {
      color: var(--text-teritiary);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .t-files-cell, .t-updated-cell { color: var(--text-teritiary); }

    /* Empty state — content area only; the chrome stays put. */
    .skills-empty {
      display: none; flex-direction: column; align-items: center; gap: 4px;
      padding: 64px 24px; text-align: center;
      color: var(--text-teritiary);
    }
    .skills-empty.is-on { display: flex; }
    .skills-empty b { color: var(--text-secondary); font-weight: 500; }

    /* ── Detail panel additions ─────────────────────────────────── */
    /* A skill carries no tags, so that row holds only the close button. */
    .panel-tags-row { justify-content: flex-end; }

    /* Panel logo tile is the chrome's .logo-box, centring the skill mark. */
    .panel-logo { display: flex; align-items: center; justify-content: center; color: var(--text-teritiary); }
    /* The skill id keeps its mono Medium voice at the panel's heading size. */
    .panel-skill-name {
      color: var(--text-primary);
      font: 500 18px/24px var(--font-geist-mono); letter-spacing: -0.72px;
    }

    /* File list + markdown preview */
    .file-rows { display: flex; flex-direction: column; gap: 2px; }
    .file-row {
      width: 100%;
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-radius: 8px;
      border: 1px solid transparent;
      color: var(--text-secondary);
      text-align: left;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }
    .file-row:hover { background: var(--backgrounds-card-bg-4); }
    .file-row.is-active {
      background: var(--backgrounds-table-select);
      border-color: var(--strokes-colour-blue);
      color: var(--text-coloured-blue);
    }
    .file-row .fic { flex: none; color: var(--text-teritiary); }
    .file-row.is-active .fic { color: var(--text-coloured-blue); }
    .file-row .fname {
      flex: 1 1 auto; min-width: 0;
      font: 400 12px/16px var(--font-geist-mono); letter-spacing: -0.24px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .file-row .fsize { flex: none; color: var(--text-teritiary); }

    /* The preview is the last section, so it takes the height left in the
       panel and scrolls inside itself. min-height keeps it usable on a
       short window, where the panel scrolls instead. */
    .panel-section--fill {
      flex: 1 1 auto; min-height: 240px;
      display: flex; flex-direction: column;
    }
    .md-preview {
      width: 100%;
      flex: 1 1 auto; min-height: 0; overflow-y: auto;
      padding: 12px 14px;
      border: 1px solid var(--strokes-line-3);
      border-radius: 8px;
      background: var(--backgrounds-page-bg-1);
      color: var(--text-secondary);
      font: 400 12px/18px var(--font-geist); letter-spacing: -0.24px;
    }
    .md-preview::-webkit-scrollbar { width: 10px; }
    .md-preview::-webkit-scrollbar-thumb { background: var(--strokes-type-default); border: 3px solid transparent; background-clip: content-box; border-radius: 8px; }
    .md-fm {
      margin: 0 0 10px; padding: 8px 10px;
      border: 1px solid var(--strokes-line-3); border-radius: 6px;
      background: var(--backgrounds-page-bg-3);
      font: 400 11px/16px var(--font-geist-mono); letter-spacing: -0.11px;
      color: var(--text-teritiary);
      white-space: pre-wrap;
    }
    .md-preview h1, .md-preview h2 {
      margin: 12px 0 4px;
      color: var(--text-primary);
      font: 500 13px/18px var(--font-geist); letter-spacing: -0.26px;
    }
    .md-preview h1:first-child, .md-preview h2:first-child { margin-top: 0; }
    .md-preview p { margin: 0 0 8px; }
    .md-preview ul { margin: 0 0 8px; padding-left: 18px; }
    .md-preview li { margin: 2px 0; }
    .md-preview code {
      font: 400 11px/16px var(--font-geist-mono); letter-spacing: -0.11px;
      color: var(--text-primary);
      background: var(--backgrounds-card-bg-4);
      border: 1px solid var(--strokes-line-3);
      border-radius: 4px;
      padding: 0 4px;
    }
    .md-preview strong { color: var(--text-primary); font-weight: 500; }
  </style>

const SKILLS = [

  { name: 'ticket-triage',       desc: 'Labels, routes and prioritizes incoming tickets from their content and history.',          agent: 'Support agent',  type: 'Action',     by: 'pn', version: 'v1.9.1' },
  { name: 'policy-lookup',       desc: 'Answers from the latest policy docs only, and cites the exact clause it used.',            agent: 'Support agent',  type: 'Retrieval',  by: 'dk', version: 'v1.1.0' },
  { name: 'meeting-scheduler',   desc: 'Finds a slot that works across calendars and time zones, then sends the invites.',         agent: 'Ops agent',      type: 'Action',     by: 'mr', version: 'v1.5.2' },
  { name: 'slack-notifier',      desc: 'Posts run summaries and alerts to the right channel with the right mentions.',             agent: 'Ops agent',      type: 'Action',     by: 'sc', version: 'v1.3.0' },

/* Skills published to the org marketplace — the other side of a
   workspace skill's "Publish to marketplace" action. Not installed
   here, so the panel offers to add them rather than to edit them. */
const MARKETPLACE = [
  { name: 'invoice-parser',     desc: 'Reads line items, totals and tax off a scanned invoice into a typed record.',           agent: 'Finance agent',  type: 'Data',       by: 'rk', version: 'v2.0.0' },
  { name: 'contract-reviewer',  desc: 'Flags non-standard clauses against the playbook and drafts the redline note.',          agent: 'Legal agent',    type: 'Retrieval',  by: 'lw', version: 'v1.6.1' },
  { name: 'churn-predictor',    desc: 'Scores accounts on churn risk from usage, tickets and renewal history.',                agent: 'Sales agent',    type: 'Data',       by: 'rk', version: 'v3.2.0' },
  { name: 'brand-voice-check',  desc: 'Rewrites copy to the brand guide and calls out anything off-tone.',                     agent: 'Support agent',  type: 'Generation', by: 'ty', version: 'v1.1.4' },
  { name: 'competitor-watch',   desc: 'Tracks named competitors for pricing, launches and headcount moves each week.',         agent: 'Research agent', type: 'Retrieval',  by: 'lw', version: 'v1.0.9' },
  { name: 'expense-auditor',    desc: 'Checks submitted expenses against policy and routes only the exceptions.',              agent: 'Finance agent',  type: 'Action',     by: 'ty', version: 'v2.4.0' },
  { name: 'transcript-notes',   desc: 'Turns a call recording into decisions, owners and dated follow-ups.',                   agent: 'Ops agent',      type: 'Generation', by: 'rk', version: 'v1.8.2' },
  { name: 'pii-redactor',       desc: 'Strips names, emails and account numbers before anything leaves the workspace.',        agent: 'Ops agent',      type: 'Action',     by: 'lw', version: 'v4.0.1' },
  { name: 'survey-clusterer',   desc: 'Groups open-text survey answers into themes and sizes each one.',                       agent: 'Research agent', type: 'Data',       by: 'ty', version: 'v1.3.0' },

const COLLECTIONS = { workspace: SKILLS, marketplace: MARKETPLACE };

/* Stable last-updated dates spread back across the past year, so the
   range filter and the table column agree with each other. */
Object.values(COLLECTIONS).forEach(list => list.forEach((s, i) => {
  const d = new Date();
  d.setDate(d.getDate() - (i * 26 + (i % 4) * 5));
  s.updatedAt = d;
}));

/* Every skill folder carries the same four docs. Contents are
   templated off the skill so each preview reads real. */
function docsFor(s) {
  return [
    { file: 'SKILL.md', size: '2.4 KB', md:
`---
name: ${s.name}
description: ${s.desc}
version: ${s.version}
---
## When to use
Use ${'`'}${s.name}${'`'} when the ${s.agent.toLowerCase()} needs this capability: ${s.desc.charAt(0).toLowerCase() + s.desc.slice(1)}

## How it works
- Validates the request against the skill's input contract
- Runs the ${s.type.toLowerCase()} step with workspace credentials
- Returns a structured result the agent can cite

## Guardrails
- Read-only against production systems
- Every output carries its source for review` },
    { file: 'reference.md', size: '3.1 KB', md:
`# ${s.name} reference

## Inputs
- ${'`'}query${'`'} — what the agent is asking for (**required**)
- ${'`'}limit${'`'} — max results to return, default ${'`'}10${'`'}
- ${'`'}format${'`'} — ${'`'}json${'`'} or ${'`'}markdown${'`'}

## Output
A structured payload with ${'`'}results[]${'`'}, ${'`'}sources[]${'`'} and a one-line ${'`'}summary${'`'}.

## Errors
- ${'`'}NO_ACCESS${'`'} — the workspace connection is missing a scope
- ${'`'}EMPTY${'`'} — nothing matched; the agent should rephrase` },
    { file: 'examples.md', size: '1.8 KB', md:
`# Examples

## Typical call
${'`'}${s.name}(query="quarterly revenue by region", limit=5)${'`'}

The ${s.agent.toLowerCase()} passes the user's ask straight through and cites the returned sources.

## With formatting
${'`'}${s.name}(query="…", format="markdown")${'`'}

Returns a ready-to-paste block for reports and replies.` },
    { file: 'evaluation.md', size: '1.2 KB', md:
`# Evaluation

## Checks before publishing
- **Accuracy** — 25 golden queries, ≥ 95% pass
- **Latency** — p95 under 4s on the shared runner
- **Safety** — no writes, no PII in logs

## Last run
${fmtDate(s.updatedAt)} · all checks passing on ${s.version}` },
  ];
}
const DOC_COUNT = 4;

const state = { tab: 'workspace', search: '', people: new Set(), range: 'any', view: 'grid', selected: null, file: 0 };

const activeList = () => COLLECTIONS[state.tab];

/* ── Filtering ────────────────────────────────────────────────────
   Both views read this one list, so switching mid-filter loses nothing. */
function filterList(list) {
  const q = state.search.trim().toLowerCase();
  const range = DATE_RANGES.find(r => r.id === state.range);
  const floor = range && range.days ? Date.now() - range.days * 86400000 : null;

  return list.map((s, i) => ({ s, i })).filter(({ s }) => {
    if (q && !`${s.name} ${s.desc} ${s.type}`.toLowerCase().includes(q)) return false;
    if (state.people.size && !state.people.has(s.by)) return false;
    if (floor !== null && s.updatedAt.getTime() < floor) return false;
    return true;
  });
}
const visibleSkills = () => filterList(activeList());

const avatarHTML = s =>
  `<span class="avatar" aria-label="Creator"><svg viewBox="0 0 20 20"><use href="#ic-avatarA"/></svg><span>${esc(PEOPLE[s.by].initial)}</span></span>`;

/* ── Card view ────────────────────────────────────────────────── */
function cardHTML({ s, i }) {
  return `
  <button class="skill-card${state.selected === i ? ' is-selected' : ''}" data-index="${i}" aria-pressed="${state.selected === i}">
    <span class="skill-card__head">
      <svg class="cq-skill-ic" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><use href="#ic-skill"/></svg>
      <span class="skill-card__name" data-name="${esc(s.name)}">${esc(s.name)}</span>
    </span>
    <span class="skill-card__body">
      <span class="skill-card__desc">${esc(s.desc)}</span>
      <span class="skill-card__props">
        ${avatarHTML(s)}
        <span class="icon-btn-24" role="button" title="Skill options" aria-label="Options for ${esc(s.name)}" data-menu="${i}">
          <svg class="ic" width="16" height="16" viewBox="0 0 16 16"><use href="#ic-optionsh"/></svg>
        </span>
      </span>
    </span>
  </button>`;
}

/* ── Skill-name hover effect ──────────────────────────────────────
   Scrambles the part of the id after the first hyphen, locking one
   character at a time left to right until the real name is back —
   web-|search, brand-|voice-check. The name is set in Geist Mono, so
   substituting characters costs no layout shift. Only letters and
   digits scramble; hyphens hold their place. */
const GLYPHS = 'abcdefghijklmnopqrstuvwxyz'.split('');
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)');
const FRAME_MS = 1000 / 30;
const DURATION_MS = 800;         /* the whole tail settles in this long,
                                    however long the tail is */

/* One card is hovered at a time, so a single timer covers the page. */
let hyperTimer = null, hyperEl = null;

function hyperStop(restore = true) {
  if (hyperTimer) { clearInterval(hyperTimer); hyperTimer = null; }
  if (hyperEl) {
    if (restore && hyperEl.isConnected) hyperEl.textContent = hyperEl.dataset.name;
    hyperEl = null;
  }
}

function hyperStart(el) {
  const full = el.dataset.name;
  const cut = full.indexOf('-');
  if (cut === -1 || REDUCED.matches) return;   /* nothing to scramble */

  const head = full.slice(0, cut + 1);
  const tail = full.slice(cut + 1);

  hyperStop();
  hyperEl = el;
  let locked = 0;
  /* Lock rate scales with the tail, so a long name is not slower. */
  const perFrame = tail.length / (DURATION_MS / FRAME_MS);

  const step = () => {
    if (!el.isConnected) { hyperStop(false); return; }
    el.textContent = head + [...tail].map((ch, i) =>
      i < locked || !/[a-z0-9]/i.test(ch)
        ? ch
        : GLYPHS[Math.floor(Math.random() * GLYPHS.length)]
    ).join('');
    if (locked >= tail.length) { clearInterval(hyperTimer); hyperTimer = null; return; }
    locked += perFrame;
  };

  hyperTimer = setInterval(step, FRAME_MS);
  step();
}

/* ── Table view ───────────────────────────────────────────────── */
function rowHTML({ s, i }) {
  return `
  <div class="t-row${state.selected === i ? ' is-selected' : ''}" data-index="${i}" role="button" tabindex="0" aria-label="${esc(s.name)}">
    <span class="t-cell t-skill-cell">
      <svg class="cq-skill-ic" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><use href="#ic-skill"/></svg>
      <span class="t-skill-info">
        <span class="t-skill-name">${esc(s.name)}</span>
        <span class="desc t-caption1-reg">${esc(s.desc)}</span>
      </span>
    </span>
    <span class="t-cell t-files-cell t-body2-reg">${DOC_COUNT} files</span>
    <span class="t-cell t-by-cell">
      ${avatarHTML(s)}
      <span class="nm t-body2-med">${esc(PEOPLE[s.by].name)}</span>
    </span>
    <span class="t-cell t-updated-cell t-body2-reg">${esc(fmtDate(s.updatedAt))}</span>
    <span class="t-cell t-actions-cell">
      <button class="icon-btn-32" data-edit="${i}" aria-label="Edit ${esc(s.name)}">
        <svg class="ic" width="20" height="20" viewBox="0 0 20 20"><use href="#ic-rowedit"/></svg>
      </button>
      <button class="icon-btn-32" data-delete="${i}" aria-label="Delete ${esc(s.name)}">
        <svg class="ic" width="20" height="20" viewBox="0 0 20 20"><use href="#ic-rowdelete"/></svg>
      </button>
    </span>
  </div>`;
}

function render() {
  hyperStop(false);
  const list = visibleSkills();
  $('skillsGrid').innerHTML = list.map(cardHTML).join('');
  $('tableBody').innerHTML = list.length
    ? list.map(rowHTML).join('')
    : `<p class="t-empty t-body2-reg">No skills match these filters.</p>`;
  $('skillCount').textContent = filterList(SKILLS).length;

  const empty = !list.length;
  $('skillsEmpty').classList.toggle('is-on', empty && state.view === 'grid');
  $('skillsGrid').hidden = state.view !== 'grid' || empty;
  $('tableArea').hidden = state.view !== 'table';
}

function setTab(tab) {
  if (state.tab === tab) return;
  state.tab = tab;
  if (state.selected !== null) closePanel();   /* indices are per-list */
  ['workspace', 'marketplace'].forEach(id => {
    const btn = $(id === 'workspace' ? 'tabWorkspace' : 'tabMarketplace');
    btn.classList.toggle('is-active', id === tab);
    btn.setAttribute('aria-selected', String(id === tab));
  });
  /* Creating a skill belongs to the workspace, not to the marketplace. */
  $('newSkillBtn').hidden = tab !== 'workspace';
  render();
}

function setView(view) {
  state.view = view;
  $('viewGridBtn').classList.toggle('is-active', view === 'grid');
  $('viewTableBtn').classList.toggle('is-active', view === 'table');
  $('viewGridBtn').setAttribute('aria-pressed', String(view === 'grid'));
  $('viewTableBtn').setAttribute('aria-pressed', String(view === 'table'));
  render();
}

/* ── Markdown preview ─────────────────────────────────────────────
   A tiny renderer for the docs above: frontmatter, #/## headings,
   bullet lists, `code`, **bold**, paragraphs. */
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}
function mdToHTML(md) {
  let out = '', body = md;
  if (body.startsWith('---\n')) {
    const end = body.indexOf('\n---', 4);
    out += `<pre class="md-fm">${esc(body.slice(4, end))}</pre>`;
    body = body.slice(end + 4);
  }
  let list = null;
  const flush = () => { if (list) { out += `<ul>${list}</ul>`; list = null; } };
  body.trim().split('\n').forEach(line => {
    const t = line.trim();
    if (!t) { flush(); return; }
    if (t.startsWith('## ')) { flush(); out += `<h2>${inline(t.slice(3))}</h2>`; }
    else if (t.startsWith('# ')) { flush(); out += `<h1>${inline(t.slice(2))}</h1>`; }
    else if (t.startsWith('- ')) { list = (list || '') + `<li>${inline(t.slice(2))}</li>`; }
    else { flush(); out += `<p>${inline(t)}</p>`; }
  });
  flush();
  return out;
}

/* ── Detail panel ─────────────────────────────────────────────── */
function renderPanelFiles(s) {
  const docs = docsFor(s);
  $('panelFiles').innerHTML = docs.map((d, j) => `
    <button class="file-row${state.file === j ? ' is-active' : ''}" data-file="${j}">
      <svg class="ic fic" width="16" height="16" viewBox="0 0 16 16"><use href="#sk-file"/></svg>
      <span class="fname">${esc(d.file)}</span>
      <span class="fsize t-caption1-reg">${esc(d.size)}</span>
    </button>`).join('');
  const doc = docs[state.file];
  $('panelPreviewLabel').textContent = 'PREVIEW · ' + doc.file;
  $('panelPreview').innerHTML = mdToHTML(doc.md);
  $('panelPreview').scrollTop = 0;
}

function openPanel(i) {
  const s = activeList()[i];
  const fromMarket = state.tab === 'marketplace';
  state.file = 0;

  /* A marketplace skill isn't yours to edit or to publish onward — the
     offer is to bring it into the workspace. */
  $('panelPublish').innerHTML = fromMarket
    ? `<svg class="ic" width="20" height="20" viewBox="0 0 20 20"><use href="#ic-plus"/></svg>Add to workspace`
    : `<svg class="ic" width="20" height="20" viewBox="0 0 20 20"><use href="#ic-share"/></svg>Publish to marketplace`;
  $('panelEdit').hidden = fromMarket;
  $('panelTitle').textContent = s.name;
  $('panelDesc').textContent = s.desc;
  renderPanelFiles(s);
  $('panel').classList.add('is-open');
  $('panel').setAttribute('aria-hidden', 'false');
}
function closePanel() {
  state.selected = null;
  $('panel').classList.remove('is-open');
  $('panel').setAttribute('aria-hidden', 'true');
  render();
}
function toggleSelect(i) {
  if (state.selected === i) { closePanel(); return; }
  state.selected = i;
  render();
  openPanel(i);
}

/* ── Filter popovers ──────────────────────────────────────────── */
function renderPeoplePop() {
  $('peoplePopList').innerHTML = Object.entries(PEOPLE).map(([id, p]) => `
    <button class="tag-opt t-body2-reg${state.people.has(id) ? ' is-checked' : ''}" data-person="${id}">
      <span class="box"><svg viewBox="0 0 12 12" fill="none"><path d="M2.5 6.5L5 9L9.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="lbl">${esc(p.name)}</span>
    </button>`).join('');
  $('peopleCount').textContent = state.people.size;
  $('peopleDropdown').classList.toggle('has-count', state.people.size > 0);
}
function renderDatePop() {
  $('datePopList').innerHTML = DATE_RANGES.map(r => `
    <button class="tag-opt t-body2-reg${state.range === r.id ? ' is-picked' : ''}" data-range="${r.id}">
      <span class="lbl">${esc(r.label)}</span>
      <svg class="ic tick" width="16" height="16" viewBox="0 0 16 16"><use href="#ic-check"/></svg>
    </button>`).join('');
  $('dateLabel').textContent = DATE_RANGES.find(r => r.id === state.range).label;
}

function closePops(except) {
  ['peoplePop', 'datePop'].forEach(id => {
    if (id === except) return;
    $(id).classList.remove('is-open');
    const btn = $(id.replace('Pop', 'Dropdown'));
    btn.classList.remove('is-open');
    btn.setAttribute('aria-expanded', 'false');
  });
}
[['peopleDropdown', 'peoplePop'], ['dateDropdown', 'datePop']].forEach(([btnId, popId]) => {
  $(btnId).addEventListener('click', e => {
    e.stopPropagation();
    closePops(popId);
    const open = $(popId).classList.toggle('is-open');
    $(btnId).classList.toggle('is-open', open);
    $(btnId).setAttribute('aria-expanded', String(open));
  });
});
/* Created by is multi-select, so keep its popover open while ticking. */
$('peoplePop').addEventListener('click', e => e.stopPropagation());
$('peoplePopList').addEventListener('click', e => {
  const opt = e.target.closest('[data-person]'); if (!opt) return;
  const v = opt.dataset.person;
  state.people.has(v) ? state.people.delete(v) : state.people.add(v);
  renderPeoplePop(); render();
});
$('datePopList').addEventListener('click', e => {
  const opt = e.target.closest('[data-range]'); if (!opt) return;
  state.range = opt.dataset.range;
  renderDatePop(); render();
  closePops();
});

/* ── Wiring ───────────────────────────────────────────────────── */
$('tabWorkspace').addEventListener('click', () => setTab('workspace'));
$('tabMarketplace').addEventListener('click', () => setTab('marketplace'));
$('viewGridBtn').addEventListener('click', () => setView('grid'));
$('viewTableBtn').addEventListener('click', () => setView('table'));
$('skillSearch').addEventListener('input', e => { state.search = e.target.value; render(); });

$('skillsGrid').addEventListener('mouseover', e => {
  const card = e.target.closest('.skill-card');
  const name = card && card.querySelector('.skill-card__name');
  if (!name || name === hyperEl) return;      /* ignore moves inside a card */
  hyperStart(name);
});
$('skillsGrid').addEventListener('mouseleave', () => hyperStop());

$('skillsGrid').addEventListener('click', e => {
  if (e.target.closest('[data-menu]')) { e.stopPropagation(); return; }
  const card = e.target.closest('[data-index]'); if (!card) return;
  toggleSelect(Number(card.dataset.index));
});
$('tableBody').addEventListener('click', e => {
  if (e.target.closest('[data-edit],[data-delete]')) { e.stopPropagation(); return; }
  const row = e.target.closest('[data-index]'); if (!row) return;
  toggleSelect(Number(row.dataset.index));
});
$('tableBody').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const row = e.target.closest('[data-index]'); if (!row) return;
  e.preventDefault();
  toggleSelect(Number(row.dataset.index));
});

$('panelFiles').addEventListener('click', e => {
  const row = e.target.closest('[data-file]'); if (!row) return;
  state.file = Number(row.dataset.file);
  if (state.selected !== null) renderPanelFiles(activeList()[state.selected]);
});
$('panelClose').addEventListener('click', closePanel);

/* One outside-click handler: dropdowns always close, the panel closes
   unless the click landed on an item, a filter or the panel itself. */
document.addEventListener('click', e => {
  closePops();
  if (state.selected === null) return;
  if (e.target.closest('.skill-card, .t-row, #panel, .filter-group, .seg-view, .seg-control')) return;
  closePanel();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  closePops();
  if (state.selected !== null) closePanel();
});

/* ── Theme ────────────────────────────────────────────────────── */
function applyMode(mode) {
  root.dataset.mode = mode;
  const dark = mode !== 'light';
  $('themeIcon').querySelector('use').setAttribute('href', dark ? '#ic-sun' : '#ic-moon');
  $('themeToggle').setAttribute('title', dark ? 'Switch to light mode' : 'Switch to dark mode');
  $('themeToggle').setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
}
$('themeToggle').addEventListener('click', () => {
  const next = root.dataset.mode === 'light' ? 'dark' : 'light';
  applyMode(next);
  try { localStorage.setItem('cq-theme', next); } catch (e) { /* private mode */ }
});
let stored = null;
try { stored = localStorage.getItem('cq-theme'); } catch (e) { /* private mode */ }
applyMode(stored === 'light' ? 'light' : 'dark');

renderPeoplePop();
renderDatePop();
render();
</script>
