<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketplace — guideline test</title>
<style>
  /* ============================================================
     TOKENS — transcribed from ARTIFACT_LANDING_PAGE_GUIDELINES.md
     ============================================================ */
  :root{
    /* Backgrounds */
    --bg-page-1:#fafafa; --bg-page-2:#ffffff; --bg-page-3:#f5f5f5;
    --bg-card:#ffffff; --bg-seg:#eeeeee; --bg-search:#f5f5f5;
    --bg-btn-primary:#0d99ff; --bg-btn-tonal:#e5f4ff;
    /* Text */
    --text-primary:#121212; --text-secondary:#616161; --text-tertiary:#8c8c8c;
    --text-btn-white:#ffffff; --text-btn-tonal:#007be5;
    /* Strokes */
    --stroke-card:#eeeeee; --stroke-line-2:#e0e0e0; --stroke-hover:#bdbdbd;
    --stroke-selected:#0d99ff; --stroke-icon:#757575;
    /* Accent ramps (for icon tiles) */
    --blue-500:#0d99ff; --blue-600:#007be5; --cyan-400:#75d7f0;
    --purple-500:#9747ff; --purple-600:#8638e5;
    --indigo-500:#5860ed; --indigo-600:#454de0;
    --orange-500:#fc9e24; --orange-800:#dd7c0e;
    --green-500:#14ae5c; --green-600:#009951;
    --pink-500:#e91e63; --pink-600:#d81b60;
    /* Radius */
    --r-card:12px; --r-tile:10px; --r-control:8px; --r-pill:6px;
    /* Spacing scale: 4 6 8 10 12 16 20 24 32 */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg-page-1);}
  body{
    font-family:"Geist","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--text-primary);
    letter-spacing:-0.01em;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex;width:1440px;height:820px;overflow:hidden;background:var(--bg-page-2);}

  /* ---------- Nav rail (68px) ---------- */
  .rail{width:68px;flex:0 0 68px;background:var(--bg-page-2);border-right:1px solid var(--stroke-card);
        display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:14px;}
  .rail .brand{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:20px;}
  .rail .ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--stroke-icon);}
  .rail .ico svg{width:22px;height:22px}
  .rail .ico.active{background:#e5f4ff;color:var(--blue-500);}
  .rail .spacer{flex:1}

  /* ---------- Right of rail ---------- */
  .shell{flex:1;display:flex;flex-direction:column;min-width:0;}

  /* Header 48px */
  .header{height:48px;flex:0 0 48px;display:flex;align-items:center;justify-content:space-between;
          padding:0 16px;border-bottom:1px solid var(--stroke-card);background:var(--bg-page-2);}
  .header .title{font-size:18px;font-weight:500;line-height:24px;letter-spacing:-0.02em;}
  .userbar{display:flex;align-items:center;gap:12px;}
  .icobtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--stroke-icon);position:relative;}
  .icobtn svg{width:20px;height:20px}
  .wsdrop{height:32px;display:flex;align-items:center;gap:6px;padding:0 8px;border:1px solid var(--stroke-line-2);
          border-radius:8px;font-size:14px;font-weight:500;color:var(--text-primary);}
  .wsdrop .badge{width:20px;height:20px;border-radius:50%;background:var(--orange-500);color:#fff;font-size:11px;
                 display:grid;place-items:center;font-weight:600;}
  .avatar{width:32px;height:32px;border-radius:50%;background:#d0d0d0 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg"/>');
          background-size:cover;overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover}

  /* Segment control bar */
  .segbar{height:52px;flex:0 0 52px;display:flex;align-items:center;padding:0 24px;border-bottom:1px solid var(--stroke-card);}
  .seg{display:inline-flex;gap:4px;background:var(--bg-seg);border-radius:8px;padding:4px;}
  .seg .tab{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:6px;
            font-size:14px;font-weight:500;color:var(--text-secondary);white-space:nowrap;}
  .seg .tab svg{width:16px;height:16px}
  .seg .tab.active{background:#fff;color:var(--text-primary);box-shadow:0 1px 2px rgba(0,0,0,.06);}
  .seg .tab.active.purple{color:var(--purple-500);}

  /* Body: sidebar + content */
  .body{flex:1;display:flex;min-height:0;}
  .sidebar{width:288px;flex:0 0 288px;padding:24px 12px;border-right:1px solid var(--stroke-card);}
  .eyebrow{font-size:12px;font-weight:500;line-height:16px;letter-spacing:0.02em;color:var(--text-tertiary);
           text-transform:uppercase;padding:0 8px;margin-bottom:12px;}
  .filter{height:34px;display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:8px;
          font-size:14px;color:var(--text-primary);cursor:pointer;}
  .filter .fico{width:16px;height:16px;display:grid;place-items:center;font-size:13px}
  .filter .lbl{flex:1}
  .filter .check{width:16px;height:16px;color:var(--blue-500)}
  .filter.active{font-weight:500}
  .filter:hover{background:var(--bg-page-3)}

  .content{flex:1;padding:16px 32px;min-width:0;overflow:auto;}
  .content-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .content-head h2{font-size:16px;font-weight:500;color:var(--text-primary);}
  .search{width:440px;height:40px;display:flex;align-items:center;gap:8px;background:var(--bg-page-2);
          border:1px solid var(--stroke-line-2);border-radius:8px;padding:0 12px;color:var(--text-tertiary);font-size:14px;}
  .search svg{width:18px;height:18px}

  /* Card grid */
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
  .card{background:var(--bg-card);border:1px solid var(--stroke-card);border-radius:12px;padding:16px;
        display:flex;flex-direction:column;gap:6px;}
  .card:hover{border-color:var(--stroke-hover)}
  .card .top{display:flex;gap:8px;align-items:flex-start;}
  .tile{width:40px;height:40px;flex:0 0 40px;border-radius:10px;display:grid;place-items:center;color:#fff;}
  .tile svg{width:20px;height:20px}
  .card .head-txt{flex:1;min-width:0}
  .card .name{font-size:16px;font-weight:500;line-height:20px;color:var(--text-primary);
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{display:flex;align-items:center;gap:8px;font-size:12px;line-height:14px;color:var(--text-tertiary);margin-top:4px}
  .meta .m{display:flex;align-items:center;gap:4px}
  .meta .divider{width:1px;height:12px;background:var(--stroke-line-2)}
  .meta .star{color:#ff8f00}
  .meta svg{width:12px;height:12px}
  .desc{font-size:14px;line-height:18px;color:var(--text-secondary);margin-top:2px;
        display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
  .tags{display:flex;gap:8px}
  .tag{font-size:12px;font-weight:500;line-height:16px;color:var(--text-secondary);background:var(--bg-page-3);
       border-radius:6px;padding:1px 6px;}
  .tag.hl{color:var(--text-btn-tonal);background:#e5f4ff}
  .mini-avatar{width:16px;height:16px;border-radius:50%;background:#c9a48a;overflow:hidden}
  .mini-avatar img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div class="app">
  <!-- NAV RAIL -->
  <nav class="rail">
    <div class="brand">🔺</div>
    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></div>
    <div class="ico active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></div>
    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M6 8.5v3a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-3M12 13.5v2"/></svg></div>
    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h10"/></svg></div>
    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></div>
    <div class="ico active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4l-6 6V21h3.3l6-6a4 4 0 0 0 5.4-5.4l-2 2-1.7-1.7z"/></svg></div>
    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v14H4zM4 9h16"/></svg></div>
    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7l9-4 9 4-9 4zM3 7v10l9 4 9-4V7"/></svg></div>
    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg></div>
    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/></svg></div>
    <div class="spacer"></div>
    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.5 2.5a2 2 0 0 0 1.4.6H19a2 2 0 0 1 2 2v3.1a2 2 0 0 0 .6 1.4L21 18l-2.5-.6"/><circle cx="12" cy="12" r="3"/></svg></div>
    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v12H4zM4 9l8 5 8-5"/></svg></div>
  </nav>

  <div class="shell">
    <!-- HEADER -->
    <header class="header">
      <div class="title">Marketplace</div>
      <div class="userbar">
        <div class="icobtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg></div>
        <div class="wsdrop"><span class="badge">F</span>Finance<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></div>
        <div class="avatar"><img src="https://i.pravatar.cc/64?img=12" alt=""></div>
      </div>
    </header>

    <!-- SEGMENT CONTROL -->
    <div class="segbar">
      <div class="seg">
        <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>Explore</div>
        <div class="tab active purple"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M12 8V4M9 4h6M9 14h.01M15 14h.01"/></svg>Agents</div>
        <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/></svg>Assistants</div>
        <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4l-6 6V21h3.3l6-6a4 4 0 0 0 5.4-5.4l-2 2-1.7-1.7z"/></svg>Tools</div>
        <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.5 5 5.5.8-4 3.9.9 5.5L12 16.5 7.1 18l.9-5.5-4-3.9L9.5 8z"/></svg>Skills</div>
        <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/></svg>Guardrails</div>
      </div>
    </div>

    <!-- BODY -->
    <div class="body">
      <aside class="sidebar">
        <div class="eyebrow">Industry</div>
        <div class="filter active"><span class="fico">▦</span><span class="lbl">All</span><svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12l5 5 9-11"/></svg></div>
        <div class="filter"><span class="fico">🛍️</span><span class="lbl">Consumer products &amp; goods</span></div>
        <div class="filter"><span class="fico">💲</span><span class="lbl">Financial services</span></div>
        <div class="filter"><span class="fico">🛡️</span><span class="lbl">Insurance</span></div>
        <div class="filter"><span class="fico">✦</span><span class="lbl">Technology</span></div>
        <div class="filter"><span class="fico">🎬</span><span class="lbl">Media &amp; Entertainment</span></div>
        <div class="filter"><span class="fico">📡</span><span class="lbl">Telecommunications</span></div>
        <div class="filter"><span class="fico">❤️</span><span class="lbl">Healthcare &amp; Lifesciences</span></div>
      </aside>

      <main class="content">
        <div class="content-head">
          <h2>24 Agents</h2>
          <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>Search for agents</div>
        </div>
        <div class="grid" id="grid"></div>
      </main>
    </div>
  </div>
</div>

<script>
  const briefcase = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/></svg>';
  const grad = {
    blue:'linear-gradient(135deg,#0d99ff,#75d7f0)',
    green:'linear-gradient(135deg,#14ae5c,#8bc34a)',
    pink:'linear-gradient(135deg,#e91e63,#fc9e24)',
    purple:'linear-gradient(135deg,#9747ff,#c2c5fa)',
    indigo:'linear-gradient(135deg,#5860ed,#75d7f0)',
    orange:'linear-gradient(135deg,#fc9e24,#ffc107)',
  };
  const cards = [
    ['Customer Feedback Analyzer','4.2','2.5k','Aggregates and interprets customer reviews to identify key satisfaction drivers.',['Healthcare','Marketing'],'blue'],
    ['Customer Feedback Analyzer','4.2','2.5k','Aggregates and interprets customer reviews to identify key satisfaction drivers.',['Healthcare','Marketing'],'green'],
    ['Customer Feedback Analyzer','4.2','2.5k','Aggregates and interprets customer reviews to identify key satisfaction drivers.',['Healthcare','Marketing'],'pink'],
    ['Sales Forecast Predictor','4.7','3.1k','Uses historical sales data to generate accurate future sales projections.',['Retail','Sales'],'pink'],
    ['Sales Prospect Tracker','4.8','1.1k','Monitors potential client interactions and prioritizes leads for sales teams.',['Retail','Sales'],'blue'],
    ['Inventory Management Pro','4.5','3.3k','Automates stock tracking and optimizes supply chain workflows.',['Manufacturing','Operations'],'purple'],
    ['Employee Performance Tracker','4.5','1.8k','Monitors and analyzes employee productivity metrics to optimize workflows.',['Technology','Human Resources'],'blue'],
    ['Employee Engagement Monitor','4.3','900','Tracks employee morale through surveys and activity metrics.',['Technology','Human Resources'],'indigo'],
    ['Social Sentiment Gauge','4.0','4.7k','Analyzes social media trends to gauge public opinion on brands.',['Entertainment','Marketing'],'orange'],
    ['Financial Risk Evaluator','4.3','2.3k','Assesses potential financial risks and suggests mitigation strategies.',['Finance','Risk Management'],'blue'],
    ['E-commerce Conversion Booster','4.6','2.0k','Optimizes online shopping funnels to increase sales and reduce cart abandonment.',['Retail','E-commerce'],'pink'],
    ['Financial Risk Evaluator','4.7','1.8k','Assesses credit and investment risk using historical and real-time data.',['Finance','Risk Management'],'purple'],
  ];
  const g = document.getElementById('grid');
  cards.forEach((c,i)=>{
    const [name,rate,dl,desc,tags,hue]=c;
    const el=document.createElement('div');el.className='card';
    el.innerHTML=`
      <div class="top">
        <div class="tile" style="background:${grad[hue]}">${briefcase}</div>
        <div class="head-txt">
          <div class="name">${name}</div>
          <div class="meta">
            <span class="m star"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9 6.8 19.2l1-5.8L3.5 9.2l5.9-.9z"/></svg><span style="color:var(--text-tertiary)">${rate}</span></span>
            <span class="divider"></span>
            <span class="m"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 11l5 5 5-5M5 21h14"/></svg>${dl}</span>
          </div>
        </div>
      </div>
      <div class="desc">${desc}</div>
      <div class="foot">
        <div class="tags">${tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        <div class="mini-avatar"><img src="https://i.pravatar.cc/32?img=${(i%10)+1}" alt=""></div>
      </div>`;
    g.appendChild(el);
  });
</script>
</body>
</html>
