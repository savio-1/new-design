<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Happy 15, My Love</title>
<meta name="theme-color" content="#030604" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&family=Manrope:wght@500;600&display=swap" rel="stylesheet" />
<style>
  /* Layout: a phone-shaped column. The WebGL garden fills it; the letter floats in the
     centre; progress and sound sit along the bottom. On wide screens the column becomes
     a framed phone so it always reads at mobile size. */
  :root {
    --night: #030604;        /* ground behind the garden, fog colour */
    --moss: #0d1a0f;         /* soft ground around the phone frame on desktop */
    --petal-white: #f6f1ea;  /* letter text */
    --pollen: #f2c94c;       /* accent: progress fill, focus ring, final glow */
    --mist: rgba(246, 241, 234, 0.62);
    --glass: rgba(246, 241, 234, 0.10);
    --glass-edge: rgba(246, 241, 234, 0.18);
    --shadow: rgba(3, 6, 4, 0.55);

    --font-display: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --font-ui: "Manrope", "Avenir Next", "Segoe UI", system-ui, sans-serif;

    --step-letter: clamp(1.9rem, 8.4vw, 2.45rem);
    --step-final: clamp(2.9rem, 13.5vw, 3.7rem);
    --step-letter-c: clamp(1.9rem, 8.4cqw, 2.45rem);
    --step-final-c: clamp(2.9rem, 13.5cqw, 3.7rem);
    --step-label: 0.6875rem;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--night);
    color: var(--petal-white);
    font-family: var(--font-ui);
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none;
  }

  .app {
    position: fixed; top: 0; bottom: 0; left: 50%;
    width: min(100%, 440px);
    transform: translateX(-50%);
    overflow: hidden;
    background: var(--night);
    container-type: size;
  }
  @media (min-width: 640px) and (min-height: 560px) {
    body { background: radial-gradient(80% 70% at 50% 50%, var(--moss), var(--night) 75%); }
    .app {
      top: 50%; bottom: auto;
      height: min(calc(100% - 48px), 880px);
      width: auto; max-width: 100%;
      aspect-ratio: 9 / 19.5;
      transform: translate(-50%, -50%);
      border-radius: 40px;
      box-shadow: 0 0 0 1px var(--glass-edge), 0 40px 120px var(--shadow);
    }
  }

  #gl {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    background: radial-gradient(120% 80% at 50% 60%, var(--moss), var(--night) 70%);
  }

  .veil {
    position: absolute; inset: 0;
    background: var(--night);
    pointer-events: none;
    transition: opacity 1.8s ease 0.2s;
  }
  .ready .veil { opacity: 0; }

  /* ── the letter ─────────────────────────────────────────── */
  .stage {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    padding-inline: 24px;
    padding-bottom: 14%;
    pointer-events: none;
    transition: opacity 0.7s ease;
  }
  .rewind .stage { opacity: 0; }
  .phrase {
    grid-area: 1 / 1;
    display: grid; justify-items: center; gap: 1rem;
    text-align: center;
    transform-origin: 50% 50%;
    will-change: transform;
  }
  .phrase h2 { margin: 0; font-weight: inherit; display: grid; gap: 0.1em; }
  .kicker {
    font-family: var(--font-ui);
    font-size: var(--step-label);
    font-weight: 600;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--mist);
  }
  .line {
    display: block;
    font-family: var(--font-display);
    font-weight: 300;
    font-size: var(--step-letter);
    font-size: var(--step-letter-c);
    line-height: 1.12;
    letter-spacing: -0.01em;
    font-optical-sizing: auto;
    text-wrap: balance;
    text-shadow: 0 0 28px var(--shadow), 0 1px 2px var(--shadow);
  }
  .final .line {
    font-size: var(--step-final);
    font-size: var(--step-final-c);
    line-height: 1.02;
    letter-spacing: -0.04em;
    text-shadow: 0 0 36px rgba(242, 201, 76, 0.28), 0 0 22px var(--shadow), 0 1px 2px var(--shadow);
  }
  .w { display: inline-block; will-change: opacity, transform, filter; }
  .w em { font-style: italic; font-weight: 300; }

  /* ── bottom chrome ──────────────────────────────────────── */
  .progress {
    position: absolute; left: 24px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 38px);
    width: 64px; height: 2px; border-radius: 1px;
    background: var(--glass-edge);
    overflow: hidden;
    transition: opacity 0.6s ease;
  }
  .progress span {
    display: block; height: 100%;
    background: var(--pollen);
    transform-origin: left center;
    transform: scaleX(0);
  }

  .sound {
    pointer-events: auto;
    position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    transform: translateX(-50%);
    width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--glass);
    border: 1px solid var(--glass-edge);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    color: var(--petal-white);
    cursor: pointer;
    padding: 0;
  }
  .sound:focus-visible, .again:focus-visible { outline: 2px solid var(--pollen); outline-offset: 3px; }
  .bars { display: flex; align-items: center; gap: 2.5px; height: 16px; }
  .bars span {
    width: 2px; height: 4px; border-radius: 1px; background: currentColor;
    transition: height 0.3s ease;
  }
  .sound[aria-pressed="true"] .bars span { animation: eq 1.1s ease-in-out infinite; }
  .bars span:nth-child(2) { animation-delay: -0.3s !important; }
  .bars span:nth-child(3) { animation-delay: -0.6s !important; }
  .bars span:nth-child(4) { animation-delay: -0.15s !important; }
  .bars span:nth-child(5) { animation-delay: -0.45s !important; }
  @keyframes eq { 0%, 100% { height: 4px; } 50% { height: 15px; } }

  .again {
    position: absolute; left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 92px);
    transform: translate(-50%, 10px);
    display: inline-flex; align-items: center; gap: 10px;
    padding: 13px 22px 13px 18px;
    border-radius: 999px;
    background: var(--glass);
    border: 1px solid var(--glass-edge);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    color: var(--petal-white);
    font: 600 var(--step-label) / 1 var(--font-ui);
    letter-spacing: 0.2em; text-transform: uppercase;
    cursor: pointer;
    opacity: 0; visibility: hidden;
    transition: opacity 0.9s ease 0.4s, transform 0.9s ease 0.4s, visibility 0s linear 1.3s;
  }
  .again svg { width: 16px; height: 16px; }
  .at-end .again {
    opacity: 1; visibility: visible; transform: translate(-50%, 0);
    transition: opacity 0.9s ease 0.6s, transform 0.9s ease 0.6s, visibility 0s;
  }
  .at-end .progress { opacity: 0; }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    .sound[aria-pressed="true"] .bars span { animation: none; }
  }
</style>
</head>
<body>

<div class="app" id="app">
  <canvas id="gl" aria-hidden="true"></canvas>

  <main class="stage" id="stage" aria-live="polite"></main>

  <div class="progress" aria-hidden="true"><span id="progressFill"></span></div>

  <button class="sound" id="sound" type="button" aria-pressed="false" aria-label="Play ambient sound">
    <span class="bars" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></span>
  </button>

  <button class="again" id="again" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    Read it again
  </button>

  <div class="veil" aria-hidden="true"></div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

/* ────────────────────────────────────────────────────────────
   The letter. Wrap a word in *asterisks* for italic,
   use " / " for a line break. The last entry is the ending.
   ──────────────────────────────────────────────────────────── */
const CHAPTERS = [
  { kicker: "A letter for you", text: "To the love who came / into my life / as a *surprise*" },
  { text: "Thank you / for *finding* your way to me" },
  { text: "You turned my world / into a *garden* in bloom" },
  { text: "Almost a year together, / and I still can't quite / *believe* it" },
  { text: "And now, / you're *fifteen*" },
  { text: "I hope life brings you / every *success* / you're dreaming of" },
  { text: "So smart, so caring, / so full of *love* to give" },
  { text: "I'm so *proud* / of who you are" },
  { text: "I wish you a whole life / of *happiness*" },
  { text: "And may every hard day / pass you by *gently*, / without any pain" },
  { text: "Happy 15, / my *love*", final: true },
];

const SPACING = 34;            // world units travelled per chapter
const END = (CHAPTERS.length - 1) * SPACING;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const TAU = Math.PI * 2;
const root = document.documentElement;
const app = document.getElementById("app");

/* ── build the letter DOM ─────────────────────────────────── */
const stage = document.getElementById("stage");
const phraseEls = CHAPTERS.map((c, i) => {
  const el = document.createElement("section");
  el.className = "phrase" + (c.final ? " final" : "");
  el.setAttribute("aria-hidden", i === 0 ? "false" : "true");
  const parts = [];
  if (c.kicker) {
    const k = document.createElement("span");
    k.className = "kicker";
    k.textContent = c.kicker;
    el.appendChild(k);
    parts.push(k);
  }
  const h = document.createElement("h2");
  c.text.split(" / ").forEach((ln) => {
    const line = document.createElement("span");
    line.className = "line";
    ln.split(" ").forEach((word, wi, arr) => {
      const w = document.createElement("span");
      w.className = "w";
      const m = word.match(/^\*(.+?)\*(\W*)$/);
      if (m) { const em = document.createElement("em"); em.textContent = m[1]; w.appendChild(em); if (m[2]) w.append(m[2]); }
      else w.textContent = word;
      line.appendChild(w);
      if (wi < arr.length - 1) line.append(" ");
    });
    h.appendChild(line);
  });
  el.appendChild(h);
  stage.appendChild(el);
  return { el, words: [...parts, ...el.querySelectorAll(".w")] };
});
const progressFill = document.getElementById("progressFill");

const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const mod = (a, n) => ((a % n) + n) % n;

let lastChapter = -1;
function updateText(dist) {
  const n = CHAPTERS.length;
  const pos = dist / SPACING;
  phraseEls.forEach((p, i) => {
    let t = pos - i;                          // −0.5 … 0.5 around its slot
    if (i === 0) t = Math.max(t, 0);          // the opening holds when pulled back
    if (i === n - 1) t = Math.min(t, 0);      // the ending holds once reached
    const vis = Math.abs(t) < 0.5;
    p.el.style.visibility = vis ? "visible" : "hidden";
    if (!vis) return;
    const scale = 1 + t * 0.22;
    p.el.style.transform = `translate3d(0, ${(-t * 18).toFixed(2)}px, 0) scale(${scale.toFixed(4)})`;
    const count = p.words.length;
    p.words.forEach((w, j) => {
      const stagger = count > 1 ? (j / (count - 1) - 0.5) * 0.13 : 0;
      const tw = t - stagger;
      const a = 1 - smooth(0.13, 0.38, Math.abs(tw));
      w.style.opacity = a.toFixed(3);
      const blur = reduceMotion ? 0 : (1 - a) * 9;
      w.style.filter = blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : "none";
      w.style.transform = reduceMotion ? "none" : `translate3d(0, ${(-tw * 46).toFixed(2)}px, 0)`;
    });
  });
  progressFill.style.transform = `scaleX(${Math.min(1, Math.max(0, dist / END)).toFixed(4)})`;
  const ch = Math.min(n - 1, Math.max(0, Math.round(pos)));
  if (ch !== lastChapter) {
    lastChapter = ch;
    phraseEls.forEach((p, i) => p.el.setAttribute("aria-hidden", i === ch ? "false" : "true"));
  }
}

/* ── input: virtual scroll from the first line to the last ── */
let target = 0, current = 0, velocity = 0, dragging = false, lastY = 0, lastT = 0, travelled = 0;
const outside = (v) => (v < 0 ? v : v > END ? v - END : 0);

addEventListener("wheel", (e) => {
  e.preventDefault();
  const d = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
  let step = Math.max(-120, Math.min(120, d)) * 0.03;
  if (outside(target) * step > 0) step *= 0.25;
  target += step;
}, { passive: false });

addEventListener("pointerdown", (e) => {
  if (e.target.closest("button")) return;
  dragging = true; lastY = e.clientY; lastT = performance.now(); velocity = 0;
});
addEventListener("pointermove", (e) => {
  if (!dragging) return;
  const now = performance.now();
  const dy = lastY - e.clientY;
  let step = dy * (e.pointerType === "touch" ? 0.06 : 0.04);
  if (outside(target) * step > 0) step *= 0.3;          // rubber band at either end
  target += step;
  const dt = Math.max(1, now - lastT);
  velocity = velocity * 0.6 + (step * 16.67 / dt) * 0.4;
  lastY = e.clientY; lastT = now;
});
const endDrag = () => {
  if (!dragging) return;
  dragging = false;
  if (performance.now() - lastT > 90) velocity = 0;
  velocity = Math.max(-3, Math.min(3, velocity));
};
addEventListener("pointerup", endDrag);
addEventListener("pointercancel", endDrag);
addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest("button") && (e.key === " " || e.key === "Enter")) return;
  if (["ArrowDown", "PageDown", " "].includes(e.key)) { target = Math.min(END, target + SPACING * 0.5); e.preventDefault(); }
  if (["ArrowUp", "PageUp"].includes(e.key)) { target = Math.max(0, target - SPACING * 0.5); e.preventDefault(); }
});

/* ── read it again: the garden keeps flying forward, the letter restarts ── */
let camBase = 0, camFly = 0, camFlyTarget = 0, rewinding = false;
const againBtn = document.getElementById("again");
againBtn.addEventListener("click", () => {
  if (rewinding) return;
  rewinding = true;
  root.classList.add("rewind");
  camFlyTarget += SPACING * 0.9;
  setTimeout(() => {
    camBase += current;
    current = target = 0; velocity = 0; travelled = 0;
    root.classList.remove("at-end", "moved");
    updateText(0);
    root.classList.remove("rewind");
    rewinding = false;
  }, 750);
});

/* ── ambient sound (generated, starts on tap) ─────────────── */
const soundBtn = document.getElementById("sound");
let audio = null;
function buildAudio() {
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
  // wind: pink-ish noise through a wandering band-pass
  const len = ac.sampleRate * 4, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  let b0 = 0, b1 = 0, b2 = 0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    b0 = 0.997 * b0 + w * 0.029; b1 = 0.985 * b1 + w * 0.032; b2 = 0.95 * b2 + w * 0.048;
    d[i] = (b0 + b1 + b2) * 0.5;
  }
  const noise = ac.createBufferSource(); noise.buffer = buf; noise.loop = true;
  const band = ac.createBiquadFilter(); band.type = "bandpass"; band.frequency.value = 420; band.Q.value = 0.6;
  const lfo = ac.createOscillator(); lfo.frequency.value = 0.06;
  const lfoAmt = ac.createGain(); lfoAmt.gain.value = 260;
  lfo.connect(lfoAmt).connect(band.frequency);
  const wind = ac.createGain(); wind.gain.value = 0.35;
  noise.connect(band).connect(wind).connect(master);
  // pad: soft open chord
  const low = ac.createBiquadFilter(); low.type = "lowpass"; low.frequency.value = 900; low.connect(master);
  [146.83, 220.0, 277.18, 329.63, 493.88].forEach((f, i) => {
    const o = ac.createOscillator(); o.type = i % 2 ? "sine" : "triangle"; o.frequency.value = f; o.detune.value = (i - 2) * 3;
    const g = ac.createGain(); g.gain.value = 0.028;
    const t = ac.createOscillator(); t.frequency.value = 0.05 + i * 0.023;
    const tg = ac.createGain(); tg.gain.value = 0.018; t.connect(tg).connect(g.gain);
    o.connect(g).connect(low); o.start(); t.start();
  });
  noise.start(); lfo.start();
  return { ac, master, wind };
}
soundBtn.addEventListener("click", () => {
  if (!audio) audio = buildAudio();
  const on = soundBtn.getAttribute("aria-pressed") !== "true";
  if (audio.ac.state === "suspended") audio.ac.resume();
  audio.master.gain.setTargetAtTime(on ? 0.7 : 0, audio.ac.currentTime, on ? 0.9 : 0.35);
  soundBtn.setAttribute("aria-pressed", String(on));
  soundBtn.setAttribute("aria-label", on ? "Mute ambient sound" : "Play ambient sound");
});

/* ────────────────────────────────────────────────────────────
   The garden
   ──────────────────────────────────────────────────────────── */
THREE.ColorManagement.enabled = false;
const canvas = document.getElementById("gl");
let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: "high-performance" });
  renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
} catch (err) { renderer = null; }

// seeded random so the garden is identical on every visit
let seed = 20261008;
const rand = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

// closed winding path → seamless loop
const PATH_PTS = [];
for (let i = 0; i < 14; i++) {
  const a = (i / 14) * TAU;
  const r = 62 + 14 * Math.sin(3 * a + 0.5) + 6 * Math.sin(5 * a);
  PATH_PTS.push(new THREE.Vector3(Math.cos(a) * r, 6 * Math.sin(2 * a) + 3 * Math.sin(3 * a + 1), Math.sin(a) * r));
}
const curve = new THREE.CatmullRomCurve3(PATH_PTS, true, "centripetal");
const LOOP = curve.getLength();

// sampled frames along the path (world-up based, so no twist)
const FS = 4096;
const FP = new Float32Array(FS * 3), FT = new Float32Array(FS * 3), FB = new Float32Array(FS * 3), FN = new Float32Array(FS * 3);
{
  const up = new THREE.Vector3(0, 1, 0), p = new THREE.Vector3(), t = new THREE.Vector3(), b = new THREE.Vector3(), n = new THREE.Vector3();
  for (let i = 0; i < FS; i++) {
    const u = i / FS;
    curve.getPointAt(u, p); curve.getTangentAt(u, t);
    b.crossVectors(t, up).normalize(); n.crossVectors(b, t).normalize();
    p.toArray(FP, i * 3); t.toArray(FT, i * 3); b.toArray(FB, i * 3); n.toArray(FN, i * 3);
  }
}
function frameAt(u, P, T, B, N) {
  const f = mod(u, 1) * FS, i0 = Math.floor(f) % FS, i1 = (i0 + 1) % FS, k = f - Math.floor(f);
  const lerp = (arr, out) => out.set(
    arr[i0 * 3] + (arr[i1 * 3] - arr[i0 * 3]) * k,
    arr[i0 * 3 + 1] + (arr[i1 * 3 + 1] - arr[i0 * 3 + 1]) * k,
    arr[i0 * 3 + 2] + (arr[i1 * 3 + 2] - arr[i0 * 3 + 2]) * k);
  if (P) lerp(FP, P); if (T) lerp(FT, T).normalize(); if (B) lerp(FB, B).normalize(); if (N) lerp(FN, N).normalize();
}
const radiusAt = (u) => 5.6 + 0.9 * Math.sin(u * TAU * 6 + 1) + 0.4 * Math.sin(u * TAU * 17);
const RX = 1.14, RY = 0.86;   // slightly wide, low tunnel

/* ── geometry builders ───────────────────────────────────── */
function flowerGeometry({ petals, len, wid, cup, center, tip = 0.1, K = 3, jitter = 0.18 }) {
  const pos = [], shade = [], cen = [], idx = [];
  let v = 0;
  for (let p = 0; p < petals; p++) {
    const a = (p / petals) * TAU + (rand() - 0.5) * jitter;
    const ca = Math.cos(a), sa = Math.sin(a), l = len * (0.86 + rand() * 0.28);
    const base = v;
    for (let k = 0; k <= K; k++) {
      const t = k / K, r = center * 0.55 + t * l;
      const hw = wid * Math.pow(Math.sin(Math.PI * (0.12 + (0.88 - tip) * t)), 0.75);
      const z = cup * t * t * l;
      for (const side of [-1, 0, 1]) {
        const ly = side * hw, lz = z + (side === 0 ? 0.02 * Math.sin(Math.PI * t) * l : 0);
        pos.push(r * ca - ly * sa, r * sa + ly * ca, lz);
        shade.push(0.22 + 0.78 * Math.pow(t, 0.6) - (side === 0 ? 0 : 0.06));
        cen.push(0);
      }
    }
    for (let k = 0; k < K; k++) {
      const r0 = base + k * 3, r1 = base + (k + 1) * 3;
      idx.push(r0, r1, r0 + 1, r1, r1 + 1, r0 + 1, r0 + 1, r1 + 1, r0 + 2, r1 + 1, r1 + 2, r0 + 2);
    }
    v += (K + 1) * 3;
  }
  const c0 = v, CS = 8;
  pos.push(0, 0, center * 0.6); shade.push(1); cen.push(1); v++;
  for (let i = 0; i < CS; i++) { const a = (i / CS) * TAU; pos.push(Math.cos(a) * center, Math.sin(a) * center, center * 0.15); shade.push(0.6); cen.push(1); v++; }
  for (let i = 0; i < CS; i++) idx.push(c0, c0 + 1 + i, c0 + 1 + ((i + 1) % CS));
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("aShade", new THREE.Float32BufferAttribute(shade, 1));
  g.setAttribute("aCenter", new THREE.Float32BufferAttribute(cen, 1));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
function leafGeometry(len, wid, K = 4) {
  const pos = [], shade = [], cen = [], idx = [];
  for (let k = 0; k <= K; k++) {
    const t = k / K, x = t * len, hw = wid * Math.pow(Math.sin(Math.PI * Math.min(t * 1.05 + 0.04, 1)), 0.8);
    const droop = -0.35 * t * t * len * 0.3;
    pos.push(x, -hw, droop - hw * 0.35, x, 0, droop + 0.03 * len, x, hw, droop - hw * 0.35);
    shade.push(0.35 + 0.65 * t, 0.45 + 0.65 * t, 0.35 + 0.65 * t); cen.push(0, 0, 0);
  }
  for (let k = 0; k < K; k++) {
    const r0 = k * 3, r1 = (k + 1) * 3;
    idx.push(r0, r1, r0 + 1, r1, r1 + 1, r0 + 1, r0 + 1, r1 + 1, r0 + 2, r1 + 1, r1 + 2, r0 + 2);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("aShade", new THREE.Float32BufferAttribute(shade, 1));
  g.setAttribute("aCenter", new THREE.Float32BufferAttribute(cen, 1));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}

/* ── shaders ─────────────────────────────────────────────── */
const FOG = new THREE.Color("#030604");
const shared = {
  uTime: { value: 0 },
  uFogColor: { value: FOG },
  uFogDensity: { value: 1 / 30 },
  uWind: { value: reduceMotion ? 0 : 1 },
};
const plantVert = /* glsl */`
  attribute float aShade;
  attribute float aCenter;
  uniform float uTime;
  uniform float uWind;
  varying vec3 vCol;
  varying float vShade;
  varying float vCenter;
  varying vec3 vN;
  varying vec3 vV;
  void main() {
    vec4 world = modelMatrix * instanceMatrix * vec4(position, 1.0);
    vec3 ip = instanceMatrix[3].xyz;
    float ph = dot(ip, vec3(0.31, 0.17, 0.23));
    world.xyz += vec3(sin(uTime * 1.1 + ph), sin(uTime * 0.83 + ph * 1.3), cos(uTime * 0.97 + ph * 0.7))
               * 0.04 * uWind * (0.3 + aShade);
    vec4 mv = viewMatrix * world;
    vV = mv.xyz;
    vN = normalize(mat3(viewMatrix) * mat3(modelMatrix) * mat3(instanceMatrix) * normal);
    vCol = instanceColor;
    vShade = aShade;
    vCenter = aCenter;
    gl_Position = projectionMatrix * mv;
  }`;
const plantFrag = /* glsl */`
  uniform vec3 uCenterColor;
  uniform vec3 uFogColor;
  uniform float uFogDensity;
  uniform float uSheen;
  varying vec3 vCol;
  varying float vShade;
  varying float vCenter;
  varying vec3 vN;
  varying vec3 vV;
  void main() {
    vec3 base = mix(vCol * (0.4 + 0.8 * vShade), uCenterColor * (0.75 + 0.35 * vShade), vCenter);
    vec3 V = normalize(-vV);
    float facing = abs(dot(normalize(vN), V));
    float d = length(vV);
    float lamp = 0.42 + 1.05 * exp(-d * 0.075);         // lantern carried by the camera
    vec3 col = base * (0.22 + 0.82 * facing) * lamp;
    col += base * pow(1.0 - facing, 3.0) * uSheen;       // petal edge glow
    float f = 1.0 - exp(-pow(d * uFogDensity, 2.0));
    gl_FragColor = vec4(mix(col, uFogColor, f), 1.0);
  }`;
function plantMaterial(centerHex, sheen = 0.35) {
  return new THREE.ShaderMaterial({
    uniforms: { ...shared, uCenterColor: { value: new THREE.Color(centerHex) }, uSheen: { value: sheen } },
    vertexShader: plantVert, fragmentShader: plantFrag, side: THREE.DoubleSide,
  });
}

/* ── species & colour drifts ─────────────────────────────── */
const SPECIES = [
  { name: "cosmos",    geo: flowerGeometry({ petals: 8,  len: 0.46, wid: 0.15, cup: 0.22, center: 0.09, tip: 0.18 }), mat: plantMaterial("#f0c23e"), size: [0.75, 1.25] },
  { name: "aster",     geo: flowerGeometry({ petals: 16, len: 0.38, wid: 0.05, cup: 0.12, center: 0.085, tip: 0.05 }), mat: plantMaterial("#e7b42c"), size: [0.7, 1.2] },
  { name: "buttercup", geo: flowerGeometry({ petals: 5,  len: 0.25, wid: 0.16, cup: 0.6, center: 0.05, tip: 0.32 }), mat: plantMaterial("#fff1a6", 0.5), size: [0.75, 1.3] },
  { name: "blossom",   geo: flowerGeometry({ petals: 5,  len: 0.19, wid: 0.12, cup: 0.35, center: 0.035, tip: 0.3 }), mat: plantMaterial("#ffe7b0"), size: [0.7, 1.4] },
];
const LEAF = { geo: leafGeometry(0.62, 0.13), mat: plantMaterial("#000000", 0.18) };

// each drift: a palette and how likely each species is inside it
const DRIFTS = [
  { colors: ["#8d5ae0", "#a57cf2", "#6d42c9", "#c9a6ff", "#f2c94c", "#f6d860"], mix: [0.12, 0.58, 0.25, 0.05] }, // violet & gold
  { colors: ["#e8457f", "#ff6fa3", "#c92f6a", "#ffb3c9", "#f7eef2"],            mix: [0.52, 0.08, 0.05, 0.35] }, // rose
  { colors: ["#ff6a2b", "#ff8a3d", "#e5432e", "#ffb38a", "#ffd2b0"],            mix: [0.18, 0.04, 0.18, 0.60] }, // ember
  { colors: ["#f5d33f", "#ffe066", "#9b6cf0", "#ffffff", "#e6c2ff"],            mix: [0.18, 0.25, 0.47, 0.10] }, // meadow
  { colors: ["#5b4bd6", "#c05ad6", "#ff7fbf", "#7c66f0", "#f7c6e8"],            mix: [0.34, 0.42, 0.04, 0.20] }, // dusk
];
const GREENS = ["#163a19", "#21491f", "#2e5f28", "#10281a", "#3a6e2e", "#1b4022"];

// periodic fields (integer frequencies keep the loop seamless)
const driftField = (u, th) => Math.sin(TAU * u * 11 + 1.4 * Math.cos(th) + 0.8 * Math.sin(TAU * u * 5));
const densityField = (u, th) => 0.5 + 0.5 * (0.6 * Math.sin(TAU * u * 23 + 2 * Math.sin(th + 0.5) + 1.3) + 0.4 * Math.sin(TAU * u * 41 + th * 3));

const scene = new THREE.Scene();
const SEGMENTS = 40;
const FLOWERS_PER_SEG = 720, LEAVES_PER_SEG = 1900;

function pickWeighted(w) { let r = rand() * w.reduce((a, b) => a + b, 0); for (let i = 0; i < w.length; i++) { r -= w[i]; if (r <= 0) return i; } return w.length - 1; }

if (renderer) {
  const P = new THREE.Vector3(), T = new THREE.Vector3(), B = new THREE.Vector3(), N = new THREE.Vector3();
  const pos = new THREE.Vector3(), nrm = new THREE.Vector3(), scl = new THREE.Vector3();
  const q = new THREE.Quaternion(), qt = new THREE.Quaternion(), qs = new THREE.Quaternion(), m = new THREE.Matrix4(), col = new THREE.Color();
  const Z = new THREE.Vector3(0, 0, 1), X = new THREE.Vector3(1, 0, 0);

  function placeOnWall(u, th, inset, tilt) {
    frameAt(u, P, T, B, N);
    const R = radiusAt(u), c = Math.cos(th), s = Math.sin(th);
    nrm.copy(B).multiplyScalar(-c * RY).addScaledVector(N, -s * RX).normalize();   // ellipse normal, inward
    pos.copy(P).addScaledVector(B, c * R * RX).addScaledVector(N, s * R * RY).addScaledVector(nrm, inset);
    q.setFromUnitVectors(Z, nrm);
    qt.setFromAxisAngle(X, (rand() - 0.5) * tilt); q.multiply(qt);
    qs.setFromAxisAngle(Z, rand() * TAU); q.multiply(qs);
  }

  for (let sgi = 0; sgi < SEGMENTS; sgi++) {
    const buckets = SPECIES.map(() => ({ m: [], c: [] }));
    let placed = 0, tries = 0;
    while (placed < FLOWERS_PER_SEG && tries < FLOWERS_PER_SEG * 4) {
      tries++;
      const u = (sgi + rand()) / SEGMENTS, th = rand() * TAU;
      const top = Math.sin(th);                                  // +1 = ceiling
      const keep = (0.25 + 0.75 * densityField(u, th)) * (1 - 0.55 * smooth(0.25, 1, top));
      if (rand() > keep * 1.25) continue;
      const drift = DRIFTS[Math.floor((driftField(u, th) * 0.5 + 0.5) * 0.9999 * DRIFTS.length)];
      const sp = pickWeighted(drift.mix);
      placeOnWall(u, th, 0.05 + rand() * 0.38, 1.0);
      const [a, b] = SPECIES[sp].size, k = (a + rand() * (b - a)) * 0.95;
      scl.set(k, k, k);
      m.compose(pos, q, scl);
      const hex = rand() < 0.86 ? drift.colors[Math.floor(rand() * drift.colors.length)] : DRIFTS[Math.floor(rand() * DRIFTS.length)].colors[0];
      col.set(hex).multiplyScalar(0.85 + rand() * 0.3);
      buckets[sp].m.push(m.clone()); buckets[sp].c.push(col.clone());
      placed++;
    }
    buckets.forEach((bk, i) => {
      if (!bk.m.length) return;
      const mesh = new THREE.InstancedMesh(SPECIES[i].geo, SPECIES[i].mat, bk.m.length);
      bk.m.forEach((mm, j) => { mesh.setMatrixAt(j, mm); mesh.setColorAt(j, bk.c[j]); });
      mesh.computeBoundingSphere();
      scene.add(mesh);
    });
    // foliage
    const leaves = new THREE.InstancedMesh(LEAF.geo, LEAF.mat, LEAVES_PER_SEG);
    for (let j = 0; j < LEAVES_PER_SEG; j++) {
      const u = (sgi + rand()) / SEGMENTS, th = rand() * TAU;
      placeOnWall(u, th, rand() * 0.3, 1.9);
      const k = 0.65 + rand() * 0.9;
      scl.set(k, k, k);
      m.compose(pos, q, scl);
      leaves.setMatrixAt(j, m);
      col.set(GREENS[Math.floor(rand() * GREENS.length)]).multiplyScalar(0.7 + rand() * 0.5);
      leaves.setColorAt(j, col);
    }
    leaves.computeBoundingSphere();
    scene.add(leaves);
  }

  /* tunnel wall: dark mottled moss behind the planting */
  {
    const AL = 1400, RAD = 36, verts = [], uvs = [], idx = [];
    for (let i = 0; i <= AL; i++) {
      const u = i / AL; frameAt(u, P, T, B, N); const R = radiusAt(u) + 0.3;
      for (let j = 0; j <= RAD; j++) {
        const th = (j / RAD) * TAU, c = Math.cos(th), s = Math.sin(th);
        pos.copy(P).addScaledVector(B, c * R * RX).addScaledVector(N, s * R * RY);
        verts.push(pos.x, pos.y, pos.z); uvs.push(u, j / RAD);
      }
    }
    for (let i = 0; i < AL; i++) for (let j = 0; j < RAD; j++) {
      const a = i * (RAD + 1) + j, b = a + RAD + 1;
      idx.push(a, b, a + 1, b, b + 1, a + 1);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(verts, 3));
    g.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
    g.setIndex(idx);
    const wall = new THREE.Mesh(g, new THREE.ShaderMaterial({
      uniforms: { ...shared },
      side: THREE.DoubleSide,
      vertexShader: `varying vec2 vUv; varying float vD;
        void main(){ vUv = uv; vec4 mv = modelViewMatrix * vec4(position,1.0); vD = length(mv.xyz); gl_Position = projectionMatrix * mv; }`,
      fragmentShader: `uniform vec3 uFogColor; uniform float uFogDensity; varying vec2 vUv; varying float vD;
        float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
          return mix(mix(h(i), h(i+vec2(1,0)), f.x), mix(h(i+vec2(0,1)), h(i+vec2(1,1)), f.x), f.y); }
        void main(){
          vec2 p = vec2(vUv.x * 2200.0, vUv.y * 64.0);
          float m = n(p) * 0.6 + n(p * 3.1) * 0.4;
          vec3 col = mix(vec3(0.015, 0.035, 0.018), vec3(0.06, 0.13, 0.05), m) * (0.8 + 0.8 * exp(-vD * 0.08));
          float f = 1.0 - exp(-pow(vD * uFogDensity, 2.0));
          gl_FragColor = vec4(mix(col, uFogColor, f), 1.0);
        }`,
    }));
    wall.frustumCulled = false;
    scene.add(wall);
  }

  /* drifting petals & pollen in the air */
  {
    const COUNT = 3600, p = new Float32Array(COUNT * 3), c = new Float32Array(COUNT * 3), s = new Float32Array(COUNT);
    for (let i = 0; i < COUNT; i++) {
      const u = rand(), th = rand() * TAU, rr = 0.25 + rand() * 0.7;
      frameAt(u, P, T, B, N); const R = radiusAt(u) * rr;
      pos.copy(P).addScaledVector(B, Math.cos(th) * R * RX).addScaledVector(N, Math.sin(th) * R * RY);
      pos.toArray(p, i * 3);
      const pick = rand();
      col.set(pick < 0.55 ? GREENS[Math.floor(rand() * GREENS.length)] : DRIFTS[Math.floor(rand() * DRIFTS.length)].colors[Math.floor(rand() * 4)]);
      if (pick < 0.55) col.multiplyScalar(1.4);
      col.toArray(c, i * 3);
      s[i] = 0.5 + rand() * 1.5;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(p, 3));
    g.setAttribute("aColor", new THREE.BufferAttribute(c, 3));
    g.setAttribute("aSize", new THREE.BufferAttribute(s, 1));
    const pts = new THREE.Points(g, new THREE.ShaderMaterial({
      uniforms: { ...shared, uPx: { value: 1 } },
      transparent: true, depthWrite: false,
      vertexShader: `attribute vec3 aColor; attribute float aSize; uniform float uTime; uniform float uWind; uniform float uPx;
        varying vec3 vC; varying float vD;
        void main(){
          vec3 p = position;
          float ph = dot(p, vec3(0.7, 1.3, 0.9));
          p += vec3(sin(uTime*0.4+ph), sin(uTime*0.31+ph*1.7)*1.4, cos(uTime*0.37+ph)) * 0.35 * uWind;
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          vD = -mv.z; vC = aColor;
          gl_PointSize = clamp(aSize * uPx * 26.0 / max(vD, 0.1), 0.0, 48.0);
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: `uniform vec3 uFogColor; uniform float uFogDensity; varying vec3 vC; varying float vD;
        void main(){
          vec2 q = gl_PointCoord - 0.5; q.x *= 1.8;
          float a = smoothstep(0.5, 0.15, length(q));
          float f = 1.0 - exp(-pow(vD * uFogDensity * 1.1, 2.0));
          if (a * (1.0 - f) < 0.02) discard;
          gl_FragColor = vec4(vC, a * 0.85 * (1.0 - f));
        }`,
    }));
    pts.frustumCulled = false;
    scene.add(pts);
    shared.uPx = pts.material.uniforms.uPx;
  }
}

/* ── camera & post (edge blur, chromatic fringe, glow, grain) ── */
const camera = new THREE.PerspectiveCamera(70, 1, 0.05, 72);
let rt = null, post = null, postScene = null, postCam = null;
if (renderer) {
  rt = new THREE.WebGLRenderTarget(2, 2, {
    generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter, magFilter: THREE.LinearFilter,
    samples: renderer.capabilities.isWebGL2 ? 4 : 0,
  });
  post = new THREE.ShaderMaterial({
    uniforms: { tScene: { value: rt.texture }, uRes: { value: new THREE.Vector2(1, 1) }, uTime: { value: 0 }, uSpeed: { value: 0 }, uBlur: { value: reduceMotion ? 0.6 : 1 } },
    depthTest: false, depthWrite: false,
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
    fragmentShader: `
      uniform sampler2D tScene; uniform vec2 uRes; uniform float uTime; uniform float uSpeed; uniform float uBlur;
      varying vec2 vUv;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
      void main(){
        float aspect = uRes.x / uRes.y;
        vec2 c = vUv - vec2(0.5, 0.47);
        vec2 cp = c * vec2(aspect, 1.0);
        float d = length(cp) / length(vec2(aspect, 1.0) * 0.5);   // 0 centre → 1 corner
        float edge = smoothstep(0.34, 1.0, d) * uBlur;            // sharp centre, soft rim
        vec2 dir = normalize(c + 1e-5);
        float rad = edge * 0.016 + uSpeed * 0.004;
        float ca = edge * 0.006 + uSpeed * 0.003;
        float lod = edge * 2.0;
        vec3 col = vec3(0.0);
        for (int i = 0; i < 8; i++) {
          float fi = float(i);
          float a = fi * 2.39996;
          float r = sqrt((fi + 0.5) / 8.0) * rad;
          vec2 o = vec2(cos(a), sin(a)) * r * vec2(1.0 / aspect, 1.0) - c * uSpeed * 0.015 * (fi / 8.0);
          vec2 uv = vUv + o;
          col.r += texture2D(tScene, uv + dir * ca, lod).r;
          col.g += texture2D(tScene, uv, lod).g;
          col.b += texture2D(tScene, uv - dir * ca, lod).b;
        }
        col /= 8.0;
        vec3 glow = texture2D(tScene, vUv, 4.0).rgb * 0.5 + texture2D(tScene, vUv, 6.0).rgb * 0.5;
        col += glow * glow * 0.8 + glow * 0.08;
        col *= mix(1.0, 0.3, smoothstep(0.6, 1.2, d));           // vignette
        col += (hash(vUv * uRes + fract(uTime) * 91.0) - 0.5) * 0.03;
        gl_FragColor = vec4(col, 1.0);
      }`,
  });
  postScene = new THREE.Scene();
  postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post);
  quad.frustumCulled = false;
  postScene.add(quad);
}

function resize() {
  const w = app.clientWidth || innerWidth, h = app.clientHeight || innerHeight;
  camera.aspect = w / h;
  camera.fov = w < h ? 74 : 58;
  camera.updateProjectionMatrix();
  if (!renderer) return;
  const dpr = Math.min(devicePixelRatio || 1, 1.75);
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);
  rt.setSize(Math.floor(w * dpr), Math.floor(h * dpr));
  post.uniforms.uRes.value.set(w * dpr, h * dpr);
  if (shared.uPx) shared.uPx.value = dpr * h / 800;
}
addEventListener("resize", resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(app);
resize();

const cP = new THREE.Vector3(), cT = new THREE.Vector3(), cB = new THREE.Vector3(), cN = new THREE.Vector3();
const aP = new THREE.Vector3(), aT = new THREE.Vector3(), aN = new THREE.Vector3(), look = new THREE.Vector3();
let roll = 0;
function placeCamera(dist, time) {
  const u = dist / LOOP;
  frameAt(u, cP, cT, cB, cN);
  frameAt(u + 9 / LOOP, aP, aT, null, aN);
  const turn = new THREE.Vector3().crossVectors(cT, aT).y;
  roll += (Math.max(-0.22, Math.min(0.22, -turn * 4)) - roll) * 0.05;
  const sway = reduceMotion ? 0 : 1;
  camera.position.copy(cP)
    .addScaledVector(cN, -0.9 + Math.sin(time * 0.23) * 0.18 * sway)
    .addScaledVector(cB, Math.sin(time * 0.31) * 0.35 * sway);
  look.copy(aP).addScaledVector(aN, -0.25 + Math.sin(time * 0.19 + 1) * 0.3 * sway).addScaledVector(cB, Math.sin(time * 0.17) * 0.4 * sway);
  camera.up.copy(cN).multiplyScalar(Math.cos(roll)).addScaledVector(cB, Math.sin(roll));
  camera.lookAt(look);
}

/* ── loop ────────────────────────────────────────────────── */
const DRIFT = reduceMotion ? 0 : 0.35;   // the garden keeps breathing forward, even at the end
let prevT = performance.now(), elapsed = 0, speedSmooth = 0, running = true, drift = 0, lastCam = 0;
document.addEventListener("visibilitychange", () => { running = !document.hidden; prevT = performance.now(); if (running) requestAnimationFrame(frame); });

function frame(now) {
  if (!running) return;
  const dt = Math.min(0.05, (now - prevT) / 1000); prevT = now; elapsed += dt;
  const f60 = dt * 60;
  if (!dragging) {
    target += velocity * f60; velocity *= Math.pow(0.95, f60);
    if (Math.abs(velocity) < 0.002) velocity = 0;
    const over = outside(target);
    if (over) { target -= over * (1 - Math.pow(0.82, f60)); if (over * velocity > 0) velocity *= 0.5; }
  }
  const before = current;
  current += (target - current) * (1 - Math.pow(1 - 0.075, f60));
  travelled += Math.abs(current - before);
  if (travelled > 4) root.classList.add("moved");
  if (!rewinding && current > END - SPACING * 0.12) root.classList.add("at-end");
  else if (current < END - SPACING * 0.4) root.classList.remove("at-end");

  drift += DRIFT * dt;
  camFly += (camFlyTarget - camFly) * (1 - Math.pow(1 - 0.035, f60));
  const camDist = camBase + current + drift + camFly;
  const speed = Math.abs(camDist - lastCam) / Math.max(dt, 1e-3);
  lastCam = camDist;
  speedSmooth += (Math.min(speed / 40, 1) - speedSmooth) * 0.08;
  if (audio) audio.wind.gain.setTargetAtTime(0.3 + speedSmooth * 0.9, audio.ac.currentTime, 0.3);

  if (!rewinding) updateText(current);
  if (renderer) {
    shared.uTime.value = elapsed;
    placeCamera(camDist, elapsed);
    renderer.setRenderTarget(rt);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    post.uniforms.uTime.value = elapsed;
    post.uniforms.uSpeed.value = reduceMotion ? 0 : speedSmooth;
    renderer.render(postScene, postCam);
  }
  requestAnimationFrame(frame);
}
updateText(0);
requestAnimationFrame((t) => { prevT = t; root.classList.add("ready"); frame(t); });
</script>
</body>
</html>
