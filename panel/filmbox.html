<!-- The big view the preview's expand button opens. Empty until first
     use; the clip is mounted into it on the way in. -->
<div class="filmbox" id="filmBox" role="dialog" aria-modal="true"
     aria-label="Context Studio preview">
  <div class="filmbox-stage" id="filmBoxStage">
    <button class="filmbox-close" id="filmBoxClose" type="button" aria-label="Close the preview">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M4 4 12 12M12 4 4 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</div>
