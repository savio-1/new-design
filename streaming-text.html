<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Streaming Text — component preview</title>
<meta name="description" content="Words resolve out of blur, inline citations appear in context, then actions and follow-up prompts become usable." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  /* ══════════════════════════════════════════════════════════════
     Standalone port of components/streaming-text.tsx.
     Same tokens, same keyframes, same timings — no build step.
     ══════════════════════════════════════════════════════════════ */
  :root{
    --canvas:#fbfbfa; --surface:#fff; --inset:#f1f0ee;
    --hover:#00000010; --hover-2:#0000000a;
    --line:#00000012; --hairline:#0000001f;
    --ink:#1c1b19; --ink-2:#6d6b66; --ink-3:#9c9a94;
    --font:'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --ease:cubic-bezier(.23,1,.32,1);
    --shadow-hairline:0 0 0 1px var(--hairline);
  }
  :root[data-theme="dark"]{
    --canvas:#121212; --surface:#1d1d1c; --inset:#242423;
    --hover:#ffffff14; --hover-2:#ffffff0d;
    --line:#ffffff14; --hairline:#ffffff1f;
    --ink:#eeedeb; --ink-2:#a4a29c; --ink-3:#706e69;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--canvas);color:var(--ink);
    -webkit-font-smoothing:antialiased;min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:48px 24px;
    transition:background .3s var(--ease),color .3s var(--ease)}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none}
  img{display:block;max-width:100%}

  /* ---------- preview frame ---------- */
  .stage{width:100%;max-width:492px}
  .stage-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .stage-title{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
  .theme-btn{display:flex;align-items:center;gap:6px;border-radius:7px;padding:4px 8px;
    font-size:11.5px;color:var(--ink-2);box-shadow:var(--shadow-hairline);
    transition:background .15s ease,color .15s ease}
  .theme-btn:hover{background:var(--hover);color:var(--ink)}
  .card{border-radius:14px;background:var(--surface);padding:22px;box-shadow:var(--shadow-hairline);
    transition:background .3s var(--ease)}

  /* ---------- streamed paragraph ---------- */
  .stream{min-height:15.5rem;width:100%;max-width:23.75rem}
  .stream-copy{font-size:13px;line-height:1.625;color:var(--ink)}
  .word{display:inline;will-change:filter,opacity;animation:stream-in 420ms cubic-bezier(.22,.61,.25,1) both}
  .caret{display:inline-block;height:12px;width:2px;margin-left:2px;translate:0 2px;
    border-radius:9999px;background:var(--ink);animation:fade-in 150ms ease-out both}

  /* inline citation chip */
  .chip{display:inline-flex;align-items:center;gap:4px;height:1.125rem;
    margin-right:4px;padding:0 3px;translate:0 -1px;vertical-align:middle;
    border-radius:5px;background:var(--inset);box-shadow:var(--shadow-hairline);
    font-family:var(--mono);font-size:10.5px;color:var(--ink-2);
    transition:background .15s ease,color .15s ease;
    animation:pop-in 250ms var(--ease) both}
  .chip:hover{background:var(--hover);color:var(--ink)}
  .chip img{width:12px;height:12px;border-radius:3px}

  /* ---------- actions row ---------- */
  .actions{display:flex;align-items:center;gap:2px;margin-top:8px;
    opacity:0;pointer-events:none;transition:opacity .4s ease}
  .is-done .actions{opacity:1;pointer-events:auto}
  .icon-btn{display:flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:6px;color:var(--ink-3);transition:background .1s ease,color .1s ease}
  .icon-btn:hover{background:var(--hover-2);color:var(--ink-2)}
  .sources-btn{display:flex;align-items:center;gap:6px;margin-left:6px;
    border-radius:6px;padding:2px 4px;text-align:left;transition:background .15s ease}
  .sources-btn:hover{background:var(--hover)}
  .stack{display:flex}
  .stack img{width:14px;height:14px;border-radius:9999px;background:var(--surface);
    box-shadow:0 0 0 1.5px var(--canvas)}
  .stack img+img{margin-left:-4px}
  .sources-count{font-size:12px;color:var(--ink-2)}

  /* ---------- expanding source list ---------- */
  .drawer{display:grid;grid-template-rows:0fr;opacity:0;
    transition:grid-template-rows .3s var(--ease),opacity .3s var(--ease)}
  .is-done.is-open .drawer{grid-template-rows:1fr;opacity:1}
  .drawer>div{overflow:hidden}
  .source-list{display:flex;flex-direction:column;margin-top:6px;
    border-radius:10px;background:var(--inset);padding:4px;box-shadow:var(--shadow-hairline)}
  .source-row{display:flex;align-items:center;gap:8px;border-radius:6px;padding:4px 6px;
    font-size:12px;color:var(--ink-2);transition:background .15s ease,color .15s ease}
  .source-row:hover{background:var(--hover);color:var(--ink)}
  .source-row img{width:16px;height:16px;border-radius:4px}
  .source-domain{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}

  /* underline that wipes in from the left */
  .animated-underline{position:relative}
  .animated-underline::after{content:"";position:absolute;inset-inline:0;bottom:-1px;height:1px;
    background:currentColor;scale:0 1;transform-origin:left center;
    transition:scale .24s var(--ease)}
  .source-row:hover .animated-underline::after{scale:1 1}

  /* ---------- follow-ups ---------- */
  .followups{margin-top:10px;opacity:0;pointer-events:none;transition:opacity .4s ease}
  .is-done .followups{opacity:1;pointer-events:auto}
  .followups-label{font-size:12px;font-weight:500;color:var(--ink-2)}
  .followup-list{display:flex;flex-direction:column;margin-top:2px}
  .followup{display:flex;align-items:center;gap:8px;margin:0 -6px;
    border-bottom:1px solid var(--line);border-radius:7px;padding:6px;
    text-align:left;font-size:12.5px;color:var(--ink);opacity:0;
    transition:background .1s ease}
  .followup:hover{background:var(--hover-2)}
  .followup svg{flex-shrink:0}
  .is-done .followup{animation:fade-up 350ms var(--ease) both}
  .is-done .followup:nth-child(2){animation-delay:90ms}

  /* ---------- keyframes ---------- */
  @keyframes stream-in{from{opacity:0;filter:blur(5px)}to{opacity:1;filter:blur(0)}}
  @keyframes pop-in{from{opacity:0;scale:.86}to{opacity:1;scale:1}}
  @keyframes fade-in{from{opacity:0}to{opacity:1}}
  @keyframes fade-up{from{opacity:0;translate:0 6px}to{opacity:1;translate:0 0}}

  @media (prefers-reduced-motion:reduce){
    @keyframes stream-in{from{opacity:0}to{opacity:1}}
    @keyframes pop-in{from{opacity:0}to{opacity:1}}
    @keyframes fade-up{from{opacity:0}to{opacity:1}}
    .animated-underline::after{transition-duration:1ms}
  }
</style>
</head>
<body>

<main class="stage">
  <div class="stage-head">
    <span class="stage-title">Streaming text</span>
    <button class="theme-btn" id="theme-btn" type="button" aria-label="Toggle color theme">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19" />
      </svg>
      <span id="theme-label">Light</span>
    </button>
  </div>

  <div class="card">
    <div class="stream" id="stream">
      <p class="stream-copy" id="copy"></p>

      <!-- action icons row -->
      <div class="actions">
        <button class="icon-btn" type="button" aria-label="Copy">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="12" height="12" rx="2.5" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
          </svg>
        </button>
        <button class="icon-btn" type="button" aria-label="Retry">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6" />
          </svg>
        </button>
        <button class="icon-btn" type="button" aria-label="Good response">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 10v12M15 5.88L14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88z" />
          </svg>
        </button>
        <button class="icon-btn" type="button" aria-label="Bad response">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 14V2M9 18.12L10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88z" />
          </svg>
        </button>

        <button class="sources-btn" id="sources-btn" type="button" aria-expanded="false">
          <span class="stack" id="stack"></span>
          <span class="sources-count">10 sources</span>
        </button>
      </div>

      <!-- expanding source list -->
      <div class="drawer">
        <div><div class="source-list" id="source-list"></div></div>
      </div>

      <!-- follow-ups -->
      <div class="followups">
        <p class="followups-label">Follow-ups</p>
        <div class="followup-list" id="followup-list"></div>
      </div>
    </div>
  </div>
</main>

<script>
  /* ── content ─────────────────────────────────────────────── */
  const WORD_MS = 55;
  const HOLD_MS = 3400;

  const TOKENS = [
    ..."Pistachio is your fastest-growing flavor — sales are up 23% this month and margins beat vanilla by 8 points."
      .split(" ").map((text) => ({ text })),
    { text: "", cite: true },
    ..."Stone-fruit flavors are trending in the same range."
      .split(" ").map((text) => ({ text })),
  ];

  const FOLLOW_UPS = [
    "Which flavors sell best in winter",
    "Compare gelato and soft serve margins",
  ];

  const SOURCE_IMAGES = {
    scoop: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231f7a5f'/%3E%3Cpath d='M20 36c0 7 5.4 12 12 12s12-5 12-12H20Z' fill='%23fff'/%3E%3Ccircle cx='32' cy='25' r='11' fill='%23bff3dd'/%3E%3Cpath d='M24 24c4-7 13-7 17 0' fill='none' stroke='%231f7a5f' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E",
    trends: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232f6fec'/%3E%3Cpath d='M15 43 27 31l8 7 14-18' fill='none' stroke='%23fff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='49' cy='20' r='5' fill='%23bfe0ff'/%3E%3C/svg%3E",
    market: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23e56d24'/%3E%3Cpath d='M17 45V25h8v20h-8Zm11 0V16h8v29h-8Zm11 0V30h8v15h-8Z' fill='%23fff'/%3E%3Cpath d='M16 49h32' stroke='%23ffd6b8' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E",
  };

  const SOURCES = [
    { name: "Scoop Data",    domain: "scoopdata.io",      href: "https://scoopdata.io/",             image: SOURCE_IMAGES.scoop  },
    { name: "Trends Index",  domain: "trends.google.com", href: "https://trends.google.com/trends/", image: SOURCE_IMAGES.trends },
    { name: "Market Basket", domain: "marketbasket.io",   href: "https://marketbasket.io/",          image: SOURCE_IMAGES.market },
  ];

  /* ── static chrome ───────────────────────────────────────── */
  const stack = document.getElementById("stack");
  const sourceList = document.getElementById("source-list");
  SOURCES.forEach((source) => {
    const avatar = document.createElement("img");
    avatar.src = source.image;
    avatar.alt = "";
    stack.append(avatar);

    const row = document.createElement("a");
    row.className = "source-row";
    row.href = source.href;
    row.target = "_blank";
    row.rel = "noreferrer";
    row.innerHTML =
      `<img src="${source.image}" alt="" />` +
      `<span class="animated-underline">${source.name}</span>` +
      `<span class="source-domain">${source.domain}</span>`;
    sourceList.append(row);
  });

  const followupList = document.getElementById("followup-list");
  FOLLOW_UPS.forEach((text) => {
    const button = document.createElement("button");
    button.className = "followup";
    button.type = "button";
    button.innerHTML =
      `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--ink-3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">` +
      `<path d="M9 10l-5 5 5 5" /><path d="M20 4v7a4 4 0 0 1-4 4H4" /></svg>`;
    button.append(document.createTextNode(text));
    followupList.append(button);
  });

  /* ── the stream ──────────────────────────────────────────── */
  /* Tokens are appended one at a time and never re-created — rebuilding
     the paragraph each tick would restart every word's stream-in
     animation, so nothing would ever resolve out of blur. (React gets
     this for free via keyed reconciliation.) */
  const stream = document.getElementById("stream");
  const copy = document.getElementById("copy");

  function makeToken(token) {
    if (token.cite) {
      const source = SOURCES[0];
      const chip = document.createElement("a");
      chip.className = "chip";
      chip.href = source.href;
      chip.target = "_blank";
      chip.rel = "noreferrer";
      chip.innerHTML = `<img src="${source.image}" alt="" /><span>${source.domain}</span>`;
      return chip;
    }
    const word = document.createElement("span");
    word.className = "word";
    word.textContent = token.text + " ";
    return word;
  }

  const sourcesBtn = document.getElementById("sources-btn");
  let count = 0;
  let caret;

  function restart() {
    count = 0;
    caret = document.createElement("span");
    caret.className = "caret";
    copy.replaceChildren(caret);
    stream.classList.remove("is-done", "is-open");
    sourcesBtn.setAttribute("aria-expanded", "false");
  }

  function tick() {
    if (count < TOKENS.length) {
      copy.insertBefore(makeToken(TOKENS[count]), caret);
      count += 1;
      setTimeout(tick, WORD_MS);
      return;
    }
    caret.remove();
    stream.classList.add("is-done");
    setTimeout(() => { restart(); tick(); }, HOLD_MS);
  }

  /* ── source drawer ───────────────────────────────────────── */
  sourcesBtn.addEventListener("click", () => {
    const open = stream.classList.toggle("is-open");
    sourcesBtn.setAttribute("aria-expanded", String(open));
  });

  restart();
  tick();

  /* ── theme toggle ────────────────────────────────────────── */
  const themeBtn = document.getElementById("theme-btn");
  const themeLabel = document.getElementById("theme-label");
  themeBtn.addEventListener("click", () => {
    const dark = document.documentElement.dataset.theme === "dark";
    document.documentElement.dataset.theme = dark ? "light" : "dark";
    themeLabel.textContent = dark ? "Dark" : "Light";
  });
</script>

</body>
</html>
