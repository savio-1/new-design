<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ontology Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b0d;
    --bg2:#0e1013;
    --edge:#2a2e35;
    --edge-hi:#8a93a3;
    --text:#d7dbe2;
    --text-dim:#5c626c;
    --chip:#141619;
    --chip-br:#282c33;
    --amber:#e0a244;
    --blue:#3e7bea;
    --red:#e5544b;
    --green:#33b06a;
    --purple:#9b6bff;
    --teal:#2bb6c4;
    --font:'Geist','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --mono:'Geist Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:var(--font)}
  #stage{position:fixed;inset:0;cursor:grab}
  #stage.panning{cursor:grabbing}
  /* radial vignette + faint depth */
  #stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(1200px 900px at 50% 45%, rgba(30,36,46,.35), rgba(10,11,13,0) 60%),
      radial-gradient(100% 100% at 50% 50%, rgba(10,11,13,0) 55%, rgba(0,0,0,.55) 100%);}
  svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;display:block}

  .edge{stroke:var(--edge);stroke-width:1.4;fill:none;stroke-linecap:round;
    stroke-dasharray:1 6;transition:stroke .2s,opacity .2s;}
  .edge.hi{stroke:var(--edge-hi);stroke-width:1.6;opacity:1!important}

  .comet{pointer-events:none;mix-blend-mode:screen;}
  .rel-pill{pointer-events:none;}
  .rel-pill rect{fill:#15171b;stroke:#2a2e35;stroke-width:1;}
  .rel-pill text{fill:#a9afb9;font-size:10.5px;font-family:var(--font);letter-spacing:-.01em;
    text-anchor:middle;dominant-baseline:middle;}
  .rel-pill.hi rect{stroke:#4a4030;fill:#1c1710}
  .rel-pill.hi text{fill:#e4c98a}

  .node{cursor:pointer;transition:opacity .35s ease;}
  .node text{font-size:12px;fill:var(--text);paint-order:stroke;pointer-events:none;
    letter-spacing:-.01em;dominant-baseline:middle;}
  .node .halo{opacity:0;transition:opacity .2s;}
  .node.hover .halo{opacity:1}

  /* label chip (shows on hover / for focus) */
  .node .chip{fill:var(--chip);stroke:var(--chip-br);stroke-width:1;rx:8;opacity:0;transition:opacity .18s;}
  .node.hover .chip,.node.focus .chip{opacity:1}
  .node.focus{cursor:default}
  .node.focus text{fill:#fff;font-weight:600}
  .node.focus .chip{stroke:var(--amber);stroke-width:1.4;}
  .node.focus .ring{opacity:0}
  .ring{opacity:0}

  /* marker glyphs */
  .mk-circle{stroke:rgba(255,255,255,.12);stroke-width:1}
  .mk-init{font-size:10px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
  .mk-item{stroke:rgba(255,255,255,.14);stroke-width:1}

  /* ---------- chrome ---------- */
  .topbar{position:fixed;z-index:5;top:16px;left:16px;display:flex;align-items:center;gap:10px}
  .brand{display:flex;align-items:center;gap:9px;background:rgba(18,20,24,.72);backdrop-filter:blur(8px);
    border:1px solid #22262d;border-radius:11px;padding:8px 12px;}
  .brand .dot{width:16px;height:16px;border-radius:5px;background:linear-gradient(135deg,var(--amber),#c77d2e)}
  .brand b{color:#eef1f5;font-size:13px;font-weight:600;letter-spacing:-.01em}
  .brand span{color:var(--text-dim);font-size:12px}
  .crumbs{display:flex;align-items:center;gap:6px;background:rgba(18,20,24,.72);backdrop-filter:blur(8px);
    border:1px solid #22262d;border-radius:11px;padding:6px 8px 6px 6px;max-width:60vw;overflow:hidden}
  .crumbs button{all:unset;cursor:pointer;color:var(--text-dim);font-size:12px;padding:4px 8px;border-radius:7px;white-space:nowrap}
  .crumbs button:hover{background:#1d2128;color:var(--text)}
  .crumbs .sep{color:#3a3f47;font-size:11px}
  .crumbs .cur{color:#f0d9a8;background:#241d10;border:1px solid #3a2f18}

  .search{position:fixed;z-index:5;top:16px;right:16px;display:flex;align-items:center;gap:8px;
    background:rgba(18,20,24,.72);backdrop-filter:blur(8px);border:1px solid #22262d;border-radius:11px;padding:8px 12px;width:230px}
  .search svg{position:static;width:15px;height:15px;flex:0 0 15px;opacity:.5}
  .search input{all:unset;color:var(--text);font-size:12.5px;width:100%;font-family:var(--font)}
  .search input::placeholder{color:var(--text-dim)}

  .legend{position:fixed;z-index:5;left:16px;bottom:16px;display:flex;flex-direction:column;gap:7px;
    background:rgba(18,20,24,.72);backdrop-filter:blur(8px);border:1px solid #22262d;border-radius:11px;padding:11px 13px}
  .legend .row{display:flex;align-items:center;gap:8px;color:#aeb4bd;font-size:11.5px}
  .legend .sw{width:12px;height:12px;border-radius:50%}
  .legend .sw.sq{border-radius:4px}

  .hint{position:fixed;z-index:5;right:16px;bottom:16px;color:var(--text-dim);font-size:11px;
    background:rgba(18,20,24,.6);border:1px solid #1c2027;border-radius:9px;padding:7px 11px;line-height:1.5}
  .hint b{color:#8b929c;font-weight:500}

  .zoom{position:fixed;z-index:5;right:16px;bottom:64px;display:flex;flex-direction:column;
    background:rgba(18,20,24,.72);backdrop-filter:blur(8px);border:1px solid #22262d;border-radius:10px;overflow:hidden}
  .zoom button{all:unset;cursor:pointer;color:#aeb4bd;font-size:16px;width:32px;height:30px;text-align:center;line-height:30px}
  .zoom button:hover{background:#1d2128;color:#fff}
  .zoom button+button{border-top:1px solid #22262d}
</style>
</head>
<body>
  <div id="stage">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="cometGlow" x="-300%" y="-300%" width="700%" height="700%">
          <feGaussianBlur stdDeviation="3.2" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <radialGradient id="cometGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff0d0" stop-opacity="1"/>
          <stop offset="55%" stop-color="#f0c26a" stop-opacity=".9"/>
          <stop offset="100%" stop-color="#f0c26a" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <g id="camera">
        <g id="ambient"></g>
        <g id="edges"></g>
        <g id="pills"></g>
        <g id="comets"></g>
        <g id="nodes"></g>
      </g>
    </svg>
  </div>

  <div class="topbar">
    <div class="brand"><span class="dot"></span><b>Ontology</b><span id="stat">— explore</span></div>
    <div class="crumbs" id="crumbs"></div>
  </div>

  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="#8b929c" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" placeholder="Search entities…" autocomplete="off" />
  </div>

  <div class="legend" id="legend"></div>

  <div class="zoom">
    <button id="zin">+</button><button id="zout">−</button>
  </div>
  <div class="hint"><b>Click</b> a node to re-center · <b>Drag</b> canvas to pan · <b>Scroll</b> to zoom</div>

<script>
/* =========================================================================
   DATA — replace this block with the real ontology (nodes + links).
   type controls the marker style & colour:
     'entity' amber ring · 'doc' blue square · 'role' avatar · 'value' green ·
     'policy' purple · 'system' teal
   ========================================================================= */
const NODES = [
  {id:'Supplier',      type:'entity'},
  {id:'Tier',          type:'entity'},
  {id:'Category',      type:'entity'},
  {id:'RiskScore',     type:'value'},
  {id:'PaymentTerm',   type:'doc'},
  {id:'PurchaseOrder', type:'doc'},
  {id:'Invoice',       type:'doc'},
  {id:'Contract',      type:'doc'},
  {id:'Approval',      type:'entity'},
  {id:'Policy',        type:'policy'},
  {id:'Buyer',         type:'role'},
  {id:'Approver',      type:'role'},
  {id:'CostCenter',    type:'entity'},
  {id:'Budget',        type:'value'},
  {id:'GLAccount',     type:'system'},
  {id:'Warehouse',     type:'entity'},
  {id:'DeliveryNote',  type:'doc'},
  {id:'TaxCode',       type:'system'},
];
const LINKS = [
  ['Supplier','Tier','classified as'],
  ['Supplier','Category','belongs to'],
  ['Supplier','RiskScore','scored by'],
  ['Supplier','PaymentTerm','has default'],
  ['Supplier','Contract','party to'],
  ['PurchaseOrder','Supplier','raised for'],
  ['PurchaseOrder','PaymentTerm','applies'],
  ['PurchaseOrder','Approval','requires'],
  ['PurchaseOrder','CostCenter','charged to'],
  ['PurchaseOrder','Invoice','generates'],
  ['PurchaseOrder','Warehouse','delivers to'],
  ['Approval','Policy','governed by'],
  ['Approval','Approver','authorised by'],
  ['Policy','Tier','applies to'],
  ['Buyer','Category','manages'],
  ['Buyer','PurchaseOrder','creates'],
  ['Invoice','GLAccount','posted to'],
  ['Invoice','TaxCode','taxed by'],
  ['Invoice','PurchaseOrder','references'],
  ['CostCenter','Budget','funded by'],
  ['Contract','PaymentTerm','defines'],
  ['Warehouse','DeliveryNote','issues'],
  ['DeliveryNote','PurchaseOrder','confirms'],
];
const START = 'Supplier';
/* ===================================================================== */

const TYPE = {
  entity:{color:'#e0a244', kind:'ring',   label:'Entity'},
  doc:   {color:'#3e7bea', kind:'square', label:'Document'},
  role:  {color:'#e5544b', kind:'avatar', label:'Role / person'},
  value: {color:'#33b06a', kind:'ring',   label:'Value'},
  policy:{color:'#9b6bff', kind:'ring',   label:'Policy'},
  system:{color:'#2bb6c4', kind:'square', label:'System'},
};

// ---- adjacency -----------------------------------------------------------
const byId = Object.fromEntries(NODES.map(n=>[n.id,n]));
const adj = Object.fromEntries(NODES.map(n=>[n.id,[]]));
const relOf = {};
for(const [a,b,r] of LINKS){ if(!byId[a]||!byId[b])continue;
  adj[a].push(b); adj[b].push(a); relOf[a+'|'+b]=r; relOf[b+'|'+a]=r; }

const NS='http://www.w3.org/2000/svg';
const el=(t,a={})=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
const initials = s => s.replace(/[^A-Za-z0-9 ]/g,'').split(/(?=[A-Z])|\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();

// ---- camera --------------------------------------------------------------
let W=innerWidth, H=innerHeight;
const cam={x:W/2,y:H/2,k:1};
const camG=document.getElementById('camera');
function applyCam(){camG.setAttribute('transform',`translate(${cam.x},${cam.y}) scale(${cam.k})`);}

// ---- ambient depth field (decorative "rest of the graph") ---------------
(function ambient(){
  const g=document.getElementById('ambient');
  let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  const names=NODES.map(n=>n.id);
  for(let i=0;i<70;i++){
    const ang=rnd()*Math.PI*2, rad=520+rnd()*1500;
    const x=Math.cos(ang)*rad, y=Math.sin(ang)*rad*0.82;
    const op=0.05+rnd()*0.16;
    const grp=el('g',{transform:`translate(${x},${y})`,opacity:op.toFixed(3)});
    grp.appendChild(el('circle',{r:2.4,fill:'#6a7180'}));
    const tx=el('text',{x:8,y:0,fill:'#7c828d','font-size':11,'dominant-baseline':'middle'});
    tx.textContent=names[Math.floor(rnd()*names.length)];
    grp.appendChild(tx); g.appendChild(grp);
    // a few faint connector stubs, anchored at the scatter point
    if(rnd()>0.5){const l=el('line',{x1:x,y1:y,x2:x+(rnd()-.5)*160,y2:y+(rnd()-.5)*160,stroke:'#1b1f25','stroke-width':1,opacity:op.toFixed(3)});g.insertBefore(l,grp);}
  }
})();

// ---- physics state -------------------------------------------------------
const pos={};                 // id -> {x,y,vx,vy}
function ensure(id, near){
  if(pos[id])return pos[id];
  const a=Math.random()*Math.PI*2, r=40+Math.random()*40;
  pos[id]={x:(near?near.x:0)+Math.cos(a)*r, y:(near?near.y:0)+Math.sin(a)*r, vx:0, vy:0};
  return pos[id];
}
pos[START]={x:0,y:0,vx:0,vy:0};

let focusId=START;
let active=new Set();          // ids currently in the ego view
const nodeEls={};              // id -> {g, refs}
const edgeEls=[];              // {line, a, b}
let hoverId=null, dragId=null, dragMoved=false;
let clock=0;
const history=[];

function neighbors(id){return adj[id];}

// ---- build / rebuild ego view -------------------------------------------
function setFocus(id, pushHist=true){
  if(!byId[id]) return;
  if(pushHist && id!==focusId) history.push(focusId);
  focusId=id;
  const want=new Set([id, ...neighbors(id)]);

  // seed positions for new nodes near current focus screen-center
  const f=ensure(id);
  neighbors(id).forEach((nb,i)=>{
    if(!pos[nb]){const a=(i/neighbors(id).length)*Math.PI*2; ensure(nb);
      pos[nb].x=f.x+Math.cos(a)*180; pos[nb].y=f.y+Math.sin(a)*180;}
  });

  // remove elements no longer wanted (fade out)
  for(const nid of Array.from(active)){
    if(!want.has(nid)){
      const rec=nodeEls[nid]; if(rec){rec.g.style.opacity=0; const gg=rec.g; setTimeout(()=>gg.remove(),350);}
      delete nodeEls[nid]; active.delete(nid);
    }
  }
  // add new
  for(const nid of want){ if(!nodeEls[nid]) createNode(nid); active.add(nid); }

  buildEdges();
  updateChrome();
  markFocusClasses();
}

function markFocusClasses(){
  for(const id in nodeEls){
    nodeEls[id].g.classList.toggle('focus', id===focusId);
  }
}

function createNode(id){
  const n=byId[id], t=TYPE[n.type]||TYPE.entity;
  const g=el('g',{class:'node'}); g.dataset.id=id; g.style.opacity=0;
  // halo (hover glow)
  g.appendChild(el('circle',{class:'halo', r:22, fill:t.color, opacity:0, 'fill-opacity':.14}));
  // focus ring
  g.appendChild(el('circle',{class:'ring', r:20, fill:'none', stroke:t.color, 'stroke-width':1.5, 'stroke-opacity':.5}));

  // label chip + text (positioned later based on side)
  const chip=el('rect',{class:'chip', height:24, rx:8, ry:8, x:16, y:-12});
  const label=el('text',{x:24, y:1}); label.textContent=id;
  g.appendChild(chip); g.appendChild(label);

  // marker
  const mk=el('g',{});
  if(t.kind==='square'){
    mk.appendChild(el('rect',{class:'mk-item', x:-11,y:-11,width:22,height:22,rx:6, fill:t.color}));
    mk.appendChild(el('path',{d:'M-4 0 L-1 3 L5 -4', fill:'none', stroke:'#fff','stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round'}));
  } else if(t.kind==='avatar'){
    mk.appendChild(el('circle',{class:'mk-circle', r:13, fill:t.color}));
    const ini=el('text',{class:'mk-init'}); ini.textContent=initials(id); mk.appendChild(ini);
  } else { // ring/entity
    mk.appendChild(el('circle',{r:13, fill:'#111318', stroke:t.color,'stroke-width':2}));
    mk.appendChild(el('circle',{r:4.2, fill:t.color}));
  }
  g.appendChild(mk);

  // events
  g.addEventListener('pointerenter',()=>setHover(id));
  g.addEventListener('pointerleave',()=>setHover(null));
  g.addEventListener('pointerdown',e=>{e.stopPropagation();startNodeDrag(id,e);});

  document.getElementById('nodes').appendChild(g);
  nodeEls[id]={g, chip, label, mk};
  requestAnimationFrame(()=>{g.style.opacity=1;});
}

function buildEdges(){
  const layer=document.getElementById('edges');
  const pillLayer=document.getElementById('pills');
  const cometLayer=document.getElementById('comets');
  edgeEls.length=0; layer.innerHTML=''; pillLayer.innerHTML=''; cometLayer.innerHTML='';
  const seen=new Set(); let idx=0;
  for(const a of active){
    for(const b of neighbors(a)){
      if(!active.has(b))continue;
      const key=a<b?a+'|'+b:b+'|'+a; if(seen.has(key))continue; seen.add(key);
      const line=el('line',{class:'edge'});
      layer.appendChild(line);

      // direction: comet always travels OUT from the focus node
      const from = a===focusId ? a : (b===focusId ? b : a);
      const to   = from===a ? b : a;

      // relationship pill at the edge midpoint
      const rel = relOf[a+'|'+b] || '';
      const pg = el('g',{class:'rel-pill'});
      const prect = el('rect',{rx:7,ry:7,height:20});
      const ptext = el('text',{y:1}); ptext.textContent=rel;
      pg.appendChild(prect); pg.appendChild(ptext); pillLayer.appendChild(pg);

      // traveling shimmer comet, staggered phase per edge
      const comet = el('circle',{class:'comet', r:3.4, fill:'url(#cometGrad)', filter:'url(#cometGlow)'});
      cometLayer.appendChild(comet);

      edgeEls.push({line,a,b,from,to,pg,prect,ptext,comet,phase:(idx%7)/7, speed:0.55+((idx*37)%5)/20});
      idx++;
    }
  }
}

// ---- hover highlight -----------------------------------------------------
function setHover(id){
  hoverId=id;
  document.getElementById('stat').textContent = id ? '— '+ (relCount(id)) : '— explore';
  for(const nid in nodeEls){
    const g=nodeEls[nid].g;
    g.classList.toggle('hover', nid===id);
  }
  const connected = id ? new Set([id,...neighbors(id)]) : null;
  for(const nid in nodeEls){
    const g=nodeEls[nid].g;
    if(!id){ g.style.opacity=1; }
    else g.style.opacity = connected.has(nid)?1:0.28;
  }
  for(const e of edgeEls){
    const on = id && (e.a===id||e.b===id);
    e.line.classList.toggle('hi', !!on);
    e.line.style.opacity = id ? (on?1:0.12) : 0.85;
  }
}
function relCount(id){const n=adj[id].length;return n+' relationship'+(n===1?'':'s');}

// ---- node drag / click ---------------------------------------------------
function startNodeDrag(id,e){
  dragId=id; dragMoved=false;
  const start={x:e.clientX,y:e.clientY};
  const move=ev=>{
    if(Math.hypot(ev.clientX-start.x,ev.clientY-start.y)>4)dragMoved=true;
    const p=pos[id]; const wx=(ev.clientX-cam.x)/cam.k, wy=(ev.clientY-cam.y)/cam.k;
    p.x=wx; p.y=wy; p.vx=0; p.vy=0;
  };
  const up=ev=>{
    window.removeEventListener('pointermove',move);
    window.removeEventListener('pointerup',up);
    if(!dragMoved && id!==focusId) setFocus(id);
    dragId=null;
  };
  window.addEventListener('pointermove',move);
  window.addEventListener('pointerup',up);
}

// ---- pan / zoom ----------------------------------------------------------
const stage=document.getElementById('stage');
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('.node'))return;
  stage.classList.add('panning');
  const s={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};
  const move=ev=>{cam.x=s.cx+(ev.clientX-s.x);cam.y=s.cy+(ev.clientY-s.y);applyCam();};
  const up=()=>{stage.classList.remove('panning');window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);};
  window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
});
stage.addEventListener('wheel',e=>{
  e.preventDefault();
  const factor=Math.exp(-e.deltaY*0.0016);
  const nk=Math.min(2.4,Math.max(0.35,cam.k*factor));
  const wx=(e.clientX-cam.x)/cam.k, wy=(e.clientY-cam.y)/cam.k;
  cam.k=nk; cam.x=e.clientX-wx*nk; cam.y=e.clientY-wy*nk; applyCam();
},{passive:false});
document.getElementById('zin').onclick=()=>zoomBy(1.2);
document.getElementById('zout').onclick=()=>zoomBy(1/1.2);
function zoomBy(f){const nk=Math.min(2.4,Math.max(0.35,cam.k*f));const wx=(W/2-cam.x)/cam.k,wy=(H/2-cam.y)/cam.k;cam.k=nk;cam.x=W/2-wx*nk;cam.y=H/2-wy*nk;applyCam();}

// ---- simulation ----------------------------------------------------------
function tick(){
  const ids=[...active];
  const REST = 150 + ids.length*7;          // ring radius grows with degree
  // focus glides smoothly to the world origin instead of snapping
  {const f=pos[focusId]; f.vx=0; f.vy=0; f.x*=0.86; f.y*=0.86;
   if(Math.abs(f.x)<0.3)f.x=0; if(Math.abs(f.y)<0.3)f.y=0;}
  // repulsion among active
  for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){
    const a=pos[ids[i]],b=pos[ids[j]];
    let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy||0.01,d=Math.sqrt(d2);
    const f=4200/d2; const ux=dx/d,uy=dy/d;
    if(ids[i]!==focusId&&ids[i]!==dragId){a.vx+=ux*f;a.vy+=uy*f;}
    if(ids[j]!==focusId&&ids[j]!==dragId){b.vx-=ux*f;b.vy-=uy*f;}
  }
  // spring: each neighbor to focus at REST
  const F=pos[focusId];
  for(const id of ids){ if(id===focusId||id===dragId)continue;
    const p=pos[id]; let dx=p.x-F.x,dy=p.y-F.y,d=Math.hypot(dx,dy)||0.01;
    // single gentle spring toward the rest ring radius
    p.vx-=(dx/d)*(d-REST)*0.03; p.vy-=(dy/d)*(d-REST)*0.03;
  }
  // integrate
  for(const id of ids){ if(id===focusId){continue;} const p=pos[id]; if(id===dragId){continue;}
    p.vx*=0.86; p.vy*=0.86; p.x+=p.vx; p.y+=p.vy; }

  clock+=0.012;
  render();
  requestAnimationFrame(tick);
}

function render(){
  for(const id of active){
    const rec=nodeEls[id]; if(!rec)continue;
    const p=pos[id];
    rec.g.setAttribute('transform',`translate(${p.x},${p.y})`);
    const w=estW(id);
    if(id===focusId){
      // one amber capsule wrapping marker + name
      rec.chip.setAttribute('x',-21); rec.chip.setAttribute('y',-16);
      rec.chip.setAttribute('height',32); rec.chip.setAttribute('rx',16); rec.chip.setAttribute('ry',16);
      rec.chip.setAttribute('width',21+18+w+14);
      rec.label.setAttribute('x',20); rec.label.setAttribute('text-anchor','start'); rec.label.setAttribute('y',1);
      continue;
    }
    // reset chip geometry (node may have been focus before)
    rec.chip.setAttribute('y',-13); rec.chip.setAttribute('height',26);
    rec.chip.setAttribute('rx',8); rec.chip.setAttribute('ry',8);
    rec.label.setAttribute('y',1);
    // label side: left if node is left of focus
    const left = p.x < pos[focusId].x - 2;
    if(left){
      rec.label.setAttribute('x',-22); rec.label.setAttribute('text-anchor','end');
      rec.chip.setAttribute('x',-22-w-8); rec.chip.setAttribute('width',w+16);
    }else{
      rec.label.setAttribute('x',22); rec.label.setAttribute('text-anchor','start');
      rec.chip.setAttribute('x',14); rec.chip.setAttribute('width',w+16);
    }
  }
  for(const e of edgeEls){
    const a=pos[e.a],b=pos[e.b]; if(!a||!b)continue;
    e.line.setAttribute('x1',a.x);e.line.setAttribute('y1',a.y);
    e.line.setAttribute('x2',b.x);e.line.setAttribute('y2',b.y);

    // relationship pill — biased away from the focus node's wide capsule
    if(e.ptext.textContent){
      let tf=0.5, F=null, O=null;
      if(e.a===focusId){F=a;O=b;} else if(e.b===focusId){F=b;O=a;}
      if(F){
        const L=Math.hypot(O.x-F.x,O.y-F.y)||1;
        const focusReach = O.x>=F.x ? (32+estW(focusId)) : 21; // capsule only extends rightward
        tf = Math.min(0.76, Math.max(0.5, (focusReach+46)/L));
      }
      const mx = F ? F.x+(O.x-F.x)*tf : (a.x+b.x)/2;
      const my = F ? F.y+(O.y-F.y)*tf : (a.y+b.y)/2;
      const tw=estW(e.ptext.textContent, 10.5, 500);
      e.pg.setAttribute('transform',`translate(${mx},${my})`);
      e.prect.setAttribute('x',-tw/2-8); e.prect.setAttribute('y',-10); e.prect.setAttribute('width',tw+16);
      const on = hoverId && (e.a===hoverId||e.b===hoverId);
      e.pg.classList.toggle('hi', !!on);
      e.pg.style.opacity = hoverId ? (on?1:0.12) : 1;
    } else { e.pg.setAttribute('transform','translate(-9999,-9999)'); }

    // traveling shimmer comet: always runs FROM the focus node outward
    const fp=pos[e.from], tp=pos[e.to];
    const t = (clock*e.speed + e.phase) % 1;
    const cx = fp.x + (tp.x-fp.x)*t, cy = fp.y + (tp.y-fp.y)*t;
    const fade = Math.pow(Math.sin(Math.PI*t), 0.6);
    const dimmed = hoverId && !(e.a===hoverId||e.b===hoverId);
    e.comet.setAttribute('cx',cx); e.comet.setAttribute('cy',cy);
    e.comet.setAttribute('opacity', (dimmed?0.05:(0.15+0.85*fade)).toFixed(3));
  }
}
const _m=document.createElement('canvas').getContext('2d');
function estW(s,size,weight){_m.font=`${weight||600} ${size||12}px Geist, Inter, sans-serif`;return Math.ceil(_m.measureText(s).width);}

// ---- chrome (breadcrumbs / legend) --------------------------------------
function updateChrome(){
  const c=document.getElementById('crumbs'); c.innerHTML='';
  const trail=[...history.slice(-3), focusId];
  trail.forEach((id,i)=>{
    if(i>0){const s=document.createElement('span');s.className='sep';s.textContent='›';c.appendChild(s);}
    const b=document.createElement('button'); b.textContent=id;
    if(id===focusId)b.className='cur';
    b.onclick=()=>{ if(id!==focusId){ // jump back
      const idx=history.lastIndexOf(id); if(idx>=0)history.length=idx; setFocus(id,false);} };
    c.appendChild(b);
  });
  if(history.length){const back=document.createElement('button');back.textContent='← back';
    back.onclick=()=>{const prev=history.pop(); if(prev)setFocus(prev,false);};
    c.insertBefore(back,c.firstChild);}
}
(function legend(){
  const L=document.getElementById('legend');
  const used=[...new Set(NODES.map(n=>n.type))];
  for(const k of used){const t=TYPE[k];const row=document.createElement('div');row.className='row';
    row.innerHTML=`<span class="sw ${t.kind==='square'?'sq':''}" style="background:${t.color}"></span>${t.label}`;
    L.appendChild(row);}
})();

// ---- search --------------------------------------------------------------
document.getElementById('q').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const v=e.target.value.trim().toLowerCase(); if(!v)return;
  const hit=NODES.find(n=>n.id.toLowerCase().includes(v));
  if(hit){setFocus(hit.id); e.target.blur();}
});

// ---- resize --------------------------------------------------------------
addEventListener('resize',()=>{W=innerWidth;H=innerHeight;});

// ---- go ------------------------------------------------------------------
applyCam();
setFocus(START,false);
tick();
</script>
