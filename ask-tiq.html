<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1440" />
<title>Cogentiq Builder — Ask Tiq</title>
<meta name="description" content="Ask Tiq — the Cogentiq AI assistant that builds on the canvas with you." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ══════════════════════════════════════════════════════════════════════
   DESIGN TOKENS — Cogentiq design system
   (pulled from Figma file Cq3g1NA1RzLfySk1EM2n2V, node 27:80311)
   ══════════════════════════════════════════════════════════════════════ */
:root{
  /* Dock */
  --dock:360px;
  --dock-wide:560px;

  /* Backgrounds */
  --canvas-builder:#121212;
  --page-bg-2:#212121;
  --card-bg-2:#212121;
  --card-bg-3:#323232;
  --card-bg-5:#1b1b1b;
  --card-bg-6:#212121;
  --type-bg-2:#323232;
  --badge-indigo:#06082a;
  --disabled-tonal-2:#424242;

  /* Strokes */
  --line-1:#424242;
  --line-2:#545454;
  --line-3:#323232;
  --stroke-card:#424242;
  --stroke-type:#424242;
  --stroke-icon:#9e9e9e;
  --stroke-indigo:#292fa3;
  --canvas-dots:#323232;

  /* Text */
  --text-primary:#ffffff;
  --text-secondary:#bdbdbd;
  --text-tertiary:#8c8c8c;
  --text-four:#616161;
  --text-disabled:#757575;
  --text-indigo:#a0a5f7;
  --text-green:#7cb342;
  --text-blue:#44aaf3;

  /* Accent */
  --blue-500:#0d99ff;
  --blue-700:#0768cf;

  /* Type scale */
  --fs-caption:12px;   --lh-caption:16px;   --ls-caption:-0.24px;
  --fs-body-3:14px;    --lh-body-3:20px;    --ls-body-3:-0.56px;
  --fs-body-2:16px;    --lh-body-2:24px;    --ls-body-2:-0.64px;

  --font:'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  /* Motion */
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.16,1.12,.3,1);
}

/* AI gradient — the Tiq mark's stroke ramp, reused for glow + borders */
@property --ang{ syntax:'<angle>'; initial-value:0deg; inherits:false; }

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#0a0a0a;
  font-family:var(--font);
  color:var(--text-primary);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;
  padding:24px 0;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font:inherit;color:inherit;background:none;border:none;outline:none}
svg{display:block}

/* ── 1440 artboard ───────────────────────────────────────────────── */
.frame{
  width:1440px;height:821px;position:relative;overflow:hidden;
  background:var(--canvas-builder);
  border-radius:10px;
  box-shadow:0 40px 120px rgba(0,0,0,.7);
  isolation:isolate;
}

/* ══════════════════════════════════════════════════════════════════
   TOP NAV  (Figma: Automations nav bar · 40:95058)
   ══════════════════════════════════════════════════════════════════ */
.topbar{
  position:absolute;top:0;left:0;right:0;height:48px;z-index:40;
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 16px;
  background:rgba(33,33,33,.86);
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  border-bottom:1px solid var(--line-1);
}
.crumbs{display:flex;align-items:center;gap:8px}
.icon-btn{
  display:flex;align-items:center;justify-content:center;padding:4px;
  border-radius:6px;transition:background .18s var(--ease), transform .18s var(--spring);
}
.icon-btn:hover{background:var(--card-bg-3)}
.icon-btn:active{transform:scale(.92)}
.crumb-back{
  background:var(--card-bg-2);border:1px solid var(--stroke-type);
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.12));
}
.trail{display:flex;align-items:center;gap:2px}
.trail-seg{display:flex;align-items:center;gap:4px;padding:2px 4px;border-radius:6px;transition:background .18s}
.trail-seg:hover{background:rgba(50,50,50,.6)}
.trail-seg.muted{font-size:var(--fs-body-3);line-height:var(--lh-body-3);letter-spacing:var(--ls-body-3);font-weight:500;color:var(--text-tertiary)}
.trail-sep{font-size:var(--fs-caption);line-height:var(--lh-body-2);letter-spacing:var(--ls-caption);color:var(--text-four)}
.trail-cur{display:flex;align-items:center;gap:10px;padding:2px 4px;font-size:var(--fs-body-3);line-height:var(--lh-body-3);letter-spacing:var(--ls-body-3);font-weight:500;color:var(--text-primary)}
.nav-actions{display:flex;align-items:center;gap:8px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  padding:6px 12px;border-radius:8px;
  font-size:var(--fs-body-3);line-height:var(--lh-body-3);letter-spacing:var(--ls-body-3);font-weight:500;
  transition:background .18s var(--ease),transform .18s var(--spring),box-shadow .18s var(--ease);
}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--blue-500);color:#fff;width:80px}
.btn-primary:hover{background:#2ba6ff;box-shadow:0 4px 16px rgba(13,153,255,.34)}
.btn-disabled{background:var(--disabled-tonal-2);color:var(--text-disabled);width:80px;cursor:default}
.btn-disabled:active{transform:none}
.btn-primary.pulse{animation:btnPulse 1.4s var(--ease) 2}
@keyframes btnPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(13,153,255,0)}
  40%{box-shadow:0 0 0 7px rgba(13,153,255,.20)}
}

/* ══════════════════════════════════════════════════════════════════
   CANVAS
   ══════════════════════════════════════════════════════════════════ */
.canvas{
  position:absolute;top:48px;right:0;bottom:0;left:0;overflow:hidden;
  transition:left .52s var(--ease);
}
.frame.panel-open .canvas{left:var(--dock,380px)}
.frame.panel-expanded .canvas{left:var(--dock-wide,560px)}
.dots{
  position:absolute;inset:-240px;
  background-image:radial-gradient(circle, var(--canvas-dots) 1.1px, transparent 1.2px);
  background-size:16px 16px;
  transition:transform .9s var(--ease);
  will-change:transform;
}
/* soft indigo bloom that wakes up while Tiq is working */
.canvas-bloom{
  position:absolute;left:50%;top:34%;width:900px;height:620px;translate:-50% -50%;
  background:radial-gradient(ellipse at center, rgba(88,96,237,.16), rgba(13,153,255,.05) 45%, transparent 70%);
  opacity:0;transition:opacity .8s var(--ease);pointer-events:none;
}
.frame.tiq-working .canvas-bloom{opacity:1}

.stage{position:absolute;inset:0}

.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
/* connector: a straight grey line from the middle of one node to the middle of the next,
   capped with an open chevron arrowhead — no flow animation, just a quiet fade-in on arrival */
.wire-arrow{fill:none;stroke:var(--stroke-icon);stroke-width:1.5;opacity:0;transition:opacity .5s var(--ease)}
.wire-arrow.show{opacity:1}

/* ── canvas nodes ─────────────────────────────────────────────── */
.node{position:absolute;transition:transform .5s var(--spring),box-shadow .3s var(--ease)}
.node-start{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 14px 5px 10px;border-radius:999px;
  background:var(--card-bg-5);border:1px solid var(--line-1);
  font-size:var(--fs-body-3);line-height:var(--lh-body-3);letter-spacing:var(--ls-body-3);font-weight:500;
  box-shadow:0 2px 10px rgba(0,0,0,.4);
}
.node-start:hover{border-color:var(--line-2)}

.node-group{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.badge-agent{
  display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 6px;border-radius:8px;
  box-sizing:border-box;background:var(--badge-indigo);border:1px solid var(--stroke-indigo);
  font-size:var(--fs-caption);line-height:16px;letter-spacing:-0.48px;font-weight:500;
  color:var(--text-indigo);
}
.badge-tool{
  display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 6px;border-radius:8px;
  box-sizing:border-box;background:#0a1f2e;border:1px solid #0768cf;
  font-size:var(--fs-caption);line-height:16px;letter-spacing:-0.48px;font-weight:500;
  color:var(--text-blue);
}
.card-node{
  width:320px;padding:16px;border-radius:12px;
  background:var(--card-bg-6);border:1px solid var(--line-3);
  display:flex;flex-direction:column;gap:12px;
  box-shadow:0 8px 28px rgba(0,0,0,.42);
  transition:border-color .25s var(--ease),box-shadow .25s var(--ease),transform .25s var(--spring);
}
.card-node:hover{border-color:var(--line-1);transform:translateY(-1px);box-shadow:0 14px 40px rgba(0,0,0,.5)}
.card-title{font-size:var(--fs-body-3);line-height:var(--lh-body-3);letter-spacing:var(--ls-body-3);font-weight:500;color:var(--text-primary)}
.card-sub{
  font-size:var(--fs-caption);line-height:var(--lh-body-2);letter-spacing:var(--ls-caption);
  color:var(--text-secondary);height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.card-meta{display:flex;align-items:center;gap:6px}
.tool-chip{
  display:flex;align-items:center;padding:4px;border-radius:6px;background:var(--card-bg-3);
  filter:drop-shadow(0 1px 1px rgba(18,18,18,.1));
  transition:transform .2s var(--spring)
}
.tool-chip:hover{transform:translateY(-2px)}
.count-badge{
  display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:80px;
  box-sizing:border-box;border:1px solid var(--line-1);
  font-size:var(--fs-caption);line-height:16px;letter-spacing:var(--ls-caption);
  font-weight:500;color:var(--text-tertiary);
}

/* node Tiq just created */
.node-created{opacity:0;transform:translateY(16px) scale(.94)}
.node-created.landed{animation:nodeLand .72s var(--spring) forwards}
@keyframes nodeLand{
  0%{opacity:0;transform:translateY(16px) scale(.94)}
  60%{opacity:1}
  100%{opacity:1;transform:none}
}
.node-created.landed .card-node{
  animation:nodeHalo 2.2s var(--ease) 1;
}
@keyframes nodeHalo{
  0%{box-shadow:0 0 0 0 rgba(88,96,237,.55),0 8px 28px rgba(0,0,0,.42)}
  70%{box-shadow:0 0 0 12px rgba(88,96,237,0),0 8px 28px rgba(0,0,0,.42)}
  100%{box-shadow:0 8px 28px rgba(0,0,0,.42)}
}

/* ══════════════════════════════════════════════════════════════════
   BOTTOM PANEL  (Figma: Bottom panel- automation · 40:96086)
   ══════════════════════════════════════════════════════════════════ */
.bottombar{
  position:absolute;left:50%;bottom:8px;translate:-50% 0;z-index:30;
  transition:opacity .4s var(--ease);
  display:flex;align-items:center;gap:8px;padding:8px;border-radius:12px;
  background:var(--card-bg-2);
  box-shadow:0 1px 4px 2px rgba(33,33,33,.12),0 1px 4px 0 rgba(33,33,33,.08),0 10px 34px rgba(0,0,0,.45);
}
.bb-add{
  display:flex;align-items:center;justify-content:center;padding:6px;border-radius:6px;
  background:var(--blue-500);border:1px solid var(--blue-700);
  transition:transform .2s var(--spring),box-shadow .2s var(--ease)
}
.bb-add:hover{transform:rotate(90deg);box-shadow:0 4px 14px rgba(13,153,255,.4)}
.bb-div{width:1px;height:20px;background:var(--line-2);flex:none}
.bb-zoom{
  display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:8px;
  background:var(--type-bg-2);border:1px solid var(--stroke-card);
  font-size:var(--fs-body-3);line-height:var(--lh-body-3);letter-spacing:var(--ls-body-3);color:var(--text-secondary);
}
.bb-btn{
  display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:8px;
  font-size:var(--fs-body-3);line-height:var(--lh-body-3);letter-spacing:var(--ls-body-3);font-weight:500;
  color:var(--text-secondary);transition:background .18s var(--ease)
}
.bb-btn:hover{background:var(--card-bg-3)}
.bb-icon{display:flex;align-items:center;justify-content:center;padding:4px;border-radius:8px;transition:background .18s var(--ease)}
.bb-icon:hover{background:var(--card-bg-3)}

/* ══════════════════════════════════════════════════════════════════
   ASK TIQ LAUNCHER  (Figma: 2634:485564 — bg-5, gradient stroke)
   ══════════════════════════════════════════════════════════════════ */
.tiq-launcher{
  position:absolute;left:12px;bottom:12px;z-index:45;
  display:flex;align-items:center;gap:4px;padding:6px;
  border-radius:12px;border:1px solid transparent;
  background:
    linear-gradient(var(--card-bg-5),var(--card-bg-5)) padding-box,
    conic-gradient(from var(--ang), #0d99ff, #5860ed, #f24822, #ffca28, #ffffff, #0d99ff) border-box;
  animation:spinAng 6s linear infinite;
  font-size:var(--fs-body-3);line-height:var(--lh-body-3);letter-spacing:var(--ls-body-3);font-weight:500;
  color:var(--text-primary);
  transition:transform .42s var(--spring),opacity .28s var(--ease),box-shadow .3s var(--ease);
}
@keyframes spinAng{to{--ang:360deg}}
.tiq-launcher::after{
  content:"";position:absolute;inset:-2px;border-radius:14px;z-index:-1;
  background:conic-gradient(from var(--ang), #0d99ff, #5860ed, #f24822, #ffca28, #ffffff, #0d99ff);
  filter:blur(11px);opacity:.30;
  transition:opacity .3s var(--ease);
  animation:auraBreathe 3.6s var(--ease) infinite;
}
@keyframes auraBreathe{0%,100%{opacity:.22}50%{opacity:.46}}
.tiq-launcher:hover{transform:translateY(-2px) scale(1.035)}
.tiq-launcher:hover::after{opacity:.62}
.tiq-launcher:active{transform:scale(.96)}
.tiq-launcher .kbd{
  margin-left:4px;padding:1px 5px;border-radius:5px;background:var(--card-bg-3);
  font-size:11px;line-height:16px;color:var(--text-tertiary);font-family:var(--mono);
}
.frame.panel-open .tiq-launcher{opacity:0;transform:translateX(-24px) scale(.9);pointer-events:none}

/* the mark itself keeps turning */
.tiq-mark{flex:none}
.tiq-launcher .tiq-mark{animation:markSpin 26s linear infinite}
@keyframes markSpin{to{transform:rotate(360deg)}}
.tiq-mark path{stroke-linecap:round;stroke-linejoin:round}

/* ══════════════════════════════════════════════════════════════════
   TIQ PANEL
   ══════════════════════════════════════════════════════════════════ */
.tiq-panel{
  position:absolute;left:0;top:48px;bottom:0;z-index:50;
  width:var(--dock,380px);
  display:flex;flex-direction:column;overflow:hidden;
  background:var(--card-bg-5);
  opacity:0;transform:translateX(-100%);pointer-events:none;
  transition:opacity .28s var(--ease),
             transform .52s var(--ease),
             width .52s var(--ease);
}
.frame.panel-open .tiq-panel{opacity:1;transform:none;pointer-events:auto}
.frame.panel-expanded .tiq-panel{width:var(--dock-wide,560px)}
.frame.panel-expanded .hero-mark,
.frame.panel-expanded .hero-mark svg{width:64px;height:64px}
.frame.panel-expanded .hero-greet{font-size:28px;line-height:36px;letter-spacing:-1.12px}

/* header */
.tiq-head{
  flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 10px 10px 12px;border-bottom:1px solid var(--line-3);
  background:var(--card-bg-5);
}
.tiq-title{display:flex;align-items:center;gap:8px;min-width:0}
.chat-switch{
  display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:8px;
  border:1px solid var(--line-3);background:var(--card-bg-2);
  font-size:var(--fs-body-3);line-height:var(--lh-body-3);letter-spacing:var(--ls-body-3);font-weight:500;
  transition:border-color .2s var(--ease),background .2s var(--ease)
}
.chat-switch:hover{border-color:var(--line-1);background:var(--card-bg-3)}
.head-actions{display:flex;align-items:center;gap:2px}
.head-btn{
  display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;
  color:var(--text-tertiary);
  transition:background .18s var(--ease),color .18s var(--ease),transform .18s var(--spring)
}
.head-btn:hover{background:var(--card-bg-3);color:var(--text-primary)}
.head-btn:active{transform:scale(.9)}

/* body */
.tiq-body{
  flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding:16px 14px 8px;
  scrollbar-width:thin;scrollbar-color:#3a3a3a transparent;
}
.tiq-body::-webkit-scrollbar{width:8px}
.tiq-body::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
.tiq-body::-webkit-scrollbar-track{background:transparent}

/* ── empty state ─────────────────────────────────────────────── */
.empty{display:flex;flex-direction:column;justify-content:center;min-height:100%}
.empty.gone{display:none}
.hero{
  flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0;position:relative;
}
.hero-mark{position:relative;width:56px;height:56px}
.hero-mark svg{position:absolute;inset:0;width:56px;height:56px}
.hero-mark .glyph{
  stroke-dasharray:var(--dash,120);stroke-dashoffset:var(--dash,120);
  animation:drawGlyph 1.5s var(--ease) .12s forwards;
}
@keyframes drawGlyph{to{stroke-dashoffset:0}}
/* spin, ease to a stop, hold, repeat — timing lives on the keyframe stops themselves */
.mark-spin{animation:spinPause 5s infinite}
@keyframes spinPause{
  0%   { transform:rotate(0deg);   animation-timing-function:cubic-bezier(.16,1,.3,1); }
  44%  { transform:rotate(360deg); animation-timing-function:linear; }
  100% { transform:rotate(360deg); }
}
.hero-eyebrow{
  margin-top:16px;
  font-size:var(--fs-body-2);line-height:var(--lh-body-2);letter-spacing:-0.16px;
  font-weight:500;color:var(--text-four);
}
.hero-greet{
  margin-top:3px;text-align:center;white-space:nowrap;
  font-size:24px;line-height:32px;letter-spacing:-0.96px;font-weight:400;
}
.hero-greet .grad{
  background:linear-gradient(96deg,#0d99ff,#5860ed 32%,#f24822 62%,#ffca28 88%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  background-size:220% 100%;animation:gradSlide 7s var(--ease) infinite;
}
@keyframes gradSlide{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
/* suggested actions */
.suggest{flex:none;display:flex;flex-direction:column;gap:2px;padding-top:30px}
.suggest-label{
  padding:0 4px 6px;
  font-size:var(--fs-caption);line-height:var(--lh-body-2);letter-spacing:var(--ls-caption);
  color:var(--text-four);font-weight:500;
}
.sg{
  display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:10px;
  text-align:left;border:1px solid transparent;
  opacity:0;transform:translateY(10px);
  animation:sgIn .5s var(--spring) forwards;
  transition:background .18s var(--ease),border-color .18s var(--ease),transform .18s var(--spring)
}
@keyframes sgIn{to{opacity:1;transform:none}}
.sg:hover{background:rgba(13,153,255,.12);border-color:rgba(13,153,255,.3);transform:translateX(3px)}
.sg:active{transform:scale(.985)}
.sg-ico{
  flex:none;display:flex;align-items:center;justify-content:center;width:30px;height:30px;
  border-radius:8px;border:1px solid var(--line-3);background:var(--card-bg-2);color:var(--text-tertiary);
  transition:border-color .18s var(--ease),background .18s var(--ease),color .18s var(--ease)
}
.sg:hover .sg-ico{border-color:rgba(13,153,255,.4);background:rgba(13,153,255,.16);color:var(--text-blue)}
.sg-txt{
  min-width:0;font-size:var(--fs-body-3);line-height:var(--lh-body-3);letter-spacing:var(--ls-body-3);
  color:var(--text-secondary);
}
.sg:hover .sg-txt{color:var(--text-blue)}
.sg-arrow{margin-left:auto;opacity:0;transform:translateX(-4px);transition:all .2s var(--ease);color:var(--text-tertiary)}
.sg:hover .sg-arrow{opacity:1;transform:none;color:var(--text-blue)}

/* ── conversation ─────────────────────────────────────────────── */
.thread{display:flex;flex-direction:column;gap:16px}
.thread.hidden{display:none}

.msg-user{display:flex;justify-content:flex-end;animation:msgIn .45s var(--spring)}
.msg-user span{
  max-width:84%;padding:8px 12px;border-radius:14px 14px 4px 14px;
  background:var(--card-bg-3);border:1px solid var(--line-1);
  font-size:var(--fs-body-3);line-height:var(--lh-body-3);letter-spacing:var(--ls-body-3);
  color:var(--text-primary);
}
@keyframes msgIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}

.msg-tiq{display:flex;gap:9px;animation:msgIn .45s var(--spring)}
.msg-tiq .avatar{flex:none;width:22px;height:22px;margin-top:1px}
.msg-tiq .stream{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.reply{
  font-size:var(--fs-body-3);line-height:21px;letter-spacing:var(--ls-body-3);
  color:var(--text-secondary);white-space:pre-wrap;
}
.reply strong{color:var(--text-primary);font-weight:500}
.reply code{
  font-family:var(--mono);font-size:12.5px;padding:1px 5px;border-radius:5px;
  background:var(--card-bg-3);color:var(--text-blue);
}
.caret{
  display:inline-block;width:7px;height:14px;translate:0 2px;border-radius:2px;
  background:var(--blue-500);animation:blink .9s steps(2,start) infinite;
}
@keyframes blink{50%{opacity:0}}

/* thinking shimmer */
.thinking{
  display:inline-flex;align-items:center;gap:8px;
  font-size:var(--fs-body-3);line-height:var(--lh-body-3);letter-spacing:var(--ls-body-3);font-weight:500;
  background:linear-gradient(90deg,#5c5c5c 12%,#ffffff 34%,#a0a5f7 52%,#5c5c5c 76%);
  background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shimmer 1.5s linear infinite;
}
@keyframes shimmer{to{background-position:-220% 50%}}
.dots3{display:inline-flex;gap:3px;align-items:center}
.dots3 i{width:4px;height:4px;border-radius:50%;background:var(--text-tertiary);animation:bounce3 1.1s var(--ease) infinite}
.dots3 i:nth-child(2){animation-delay:.14s}
.dots3 i:nth-child(3){animation-delay:.28s}
@keyframes bounce3{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-4px);opacity:1}}

/* tool-run trace */
.trace{
  border:1px solid var(--line-3);border-radius:10px;background:var(--card-bg-2);overflow:hidden;
}
.trace-head{
  display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;
  font-size:var(--fs-caption);line-height:var(--lh-body-2);letter-spacing:var(--ls-caption);font-weight:500;
  color:var(--text-tertiary);
}
.trace-head:hover{background:var(--card-bg-3)}
.trace-head .chev{margin-left:auto;transition:transform .25s var(--ease)}
.trace.collapsed .chev{transform:rotate(-90deg)}
.trace-steps{
  display:flex;flex-direction:column;gap:2px;padding:2px 10px 9px;
  border-top:1px solid var(--line-3);
  overflow:hidden;
  transition:height .32s var(--ease),opacity .25s var(--ease),padding .32s var(--ease);
}
.trace.collapsed .trace-steps{height:0 !important;opacity:0;padding-top:0;padding-bottom:0;border-top-color:transparent}
.step{
  display:flex;align-items:center;gap:8px;padding:5px 0;
  font-size:var(--fs-caption);line-height:var(--lh-body-2);letter-spacing:var(--ls-caption);
  color:var(--text-four);
  opacity:0;transform:translateX(-6px);
}
.step.on{animation:stepIn .4s var(--ease) forwards}
@keyframes stepIn{to{opacity:1;transform:none}}
.step.done{color:var(--text-secondary)}
.step .ms{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text-four);opacity:0}
.step.done .ms{opacity:1;transition:opacity .3s}
.spin{
  flex:none;width:13px;height:13px;border-radius:50%;
  border:1.6px solid var(--line-1);border-top-color:var(--blue-500);
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.tick{flex:none;width:13px;height:13px;color:var(--text-green)}
.tick path{stroke-dasharray:16;stroke-dashoffset:16;animation:drawTick .3s var(--ease) forwards}
@keyframes drawTick{to{stroke-dashoffset:0}}

/* generated artifact card */
.artifact{
  border-radius:12px;border:1px solid transparent;
  background:
    linear-gradient(var(--card-bg-2),var(--card-bg-2)) padding-box,
    conic-gradient(from var(--ang), rgba(13,153,255,.8), rgba(88,96,237,.8), rgba(242,72,34,.6), rgba(255,202,40,.7), rgba(13,153,255,.8)) border-box;
  animation:spinAng 9s linear infinite, artifactIn .55s var(--spring);
  overflow:hidden;
}
@keyframes artifactIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.artifact-head{
  display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line-3);
  font-size:var(--fs-caption);line-height:var(--lh-body-2);letter-spacing:var(--ls-caption);font-weight:500;
  color:var(--text-tertiary);
}
.artifact-body{padding:10px;display:flex;flex-direction:column;gap:8px}
.mini-node{
  border-radius:10px;border:1px solid var(--line-3);background:var(--card-bg-6);padding:10px;
  display:flex;flex-direction:column;gap:8px;
}
.mini-title{font-size:var(--fs-body-3);line-height:var(--lh-body-3);letter-spacing:var(--ls-body-3);font-weight:500}
.mini-sub{font-size:var(--fs-caption);line-height:var(--lh-body-2);letter-spacing:var(--ls-caption);color:var(--text-tertiary)}
.artifact-actions{display:flex;align-items:center;gap:8px;padding:0 10px 10px}
.act{
  display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;
  font-size:var(--fs-caption);line-height:var(--lh-body-2);letter-spacing:var(--ls-caption);font-weight:500;
  transition:background .18s var(--ease),transform .18s var(--spring),box-shadow .18s var(--ease)
}
.act:active{transform:scale(.95)}
.act-primary{background:var(--blue-500);color:#fff}
.act-primary:hover{background:#2ba6ff;box-shadow:0 4px 14px rgba(13,153,255,.35)}
.act-ghost{color:var(--text-tertiary);border:1px solid var(--line-3)}
.act-ghost:hover{background:var(--card-bg-3);color:var(--text-secondary)}
.act-done{background:rgba(124,179,66,.14);color:var(--text-green);border:1px solid rgba(124,179,66,.35);cursor:default}

/* follow-up chips */
.followups{display:flex;flex-wrap:wrap;gap:6px}
.fu{
  padding:5px 10px;border-radius:80px;border:1px solid var(--line-3);background:var(--card-bg-2);
  font-size:var(--fs-caption);line-height:var(--lh-body-2);letter-spacing:var(--ls-caption);
  color:var(--text-tertiary);
  opacity:0;transform:translateY(6px);animation:sgIn .42s var(--spring) forwards;
  transition:border-color .18s var(--ease),color .18s var(--ease),transform .18s var(--spring)
}
.fu:hover{border-color:var(--blue-700);color:var(--text-primary);transform:translateY(-1px)}

/* message toolbar */
.msg-tools{display:flex;align-items:center;gap:2px;margin-left:-4px;opacity:0;transition:opacity .25s}
.msg-tiq:hover .msg-tools{opacity:1}
.mt{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--text-four)}
.mt:hover{background:var(--card-bg-3);color:var(--text-secondary)}
.mt.ok{color:var(--text-green)}

/* ── composer ─────────────────────────────────────────────────── */
.tiq-foot{flex:none;padding:8px 12px 10px;position:relative}
.composer{
  border-radius:14px;border:1px solid var(--line-3);background:var(--card-bg-2);
  padding:10px 10px 8px;position:relative;
  transition:border-color .25s var(--ease),box-shadow .3s var(--ease),background .25s var(--ease);
}
.composer::before{
  content:"";position:absolute;inset:-1px;border-radius:15px;padding:1px;z-index:0;pointer-events:none;
  background:conic-gradient(from var(--ang), #0d99ff, #5860ed, #f24822, #ffca28, #ffffff, #0d99ff);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  opacity:0;transition:opacity .3s var(--ease);
  animation:spinAng 5s linear infinite;
}
.composer.focused::before{opacity:1}
.composer.focused{background:#1f1f1f;box-shadow:0 0 30px rgba(88,96,237,.18)}
.composer.busy{opacity:.72}
.composer > *{position:relative;z-index:1}
.ta{
  width:100%;resize:none;min-height:44px;max-height:130px;
  font-size:var(--fs-body-3);line-height:21px;letter-spacing:var(--ls-body-3);
  color:var(--text-primary);
}
.ta::placeholder{color:var(--text-four)}
.comp-row{display:flex;align-items:center;gap:6px;margin-top:6px}
.cbtn{
  display:flex;align-items:center;justify-content:center;gap:4px;
  height:28px;min-width:28px;padding:0 6px;border-radius:8px;color:var(--text-tertiary);position:relative;
  font-size:var(--fs-caption);line-height:var(--lh-body-2);letter-spacing:var(--ls-caption);font-weight:500;
  transition:background .18s var(--ease),color .18s var(--ease),transform .18s var(--spring)
}
.cbtn:hover{background:var(--card-bg-3);color:var(--text-primary)}
.cbtn:active{transform:scale(.92)}
.spacer{flex:1}
.send{
  width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:var(--disabled-tonal-2);color:var(--text-disabled);
  transition:background .22s var(--ease),color .22s var(--ease),transform .22s var(--spring),box-shadow .22s var(--ease)
}
.send.ready{background:var(--blue-500);color:#fff;box-shadow:0 4px 16px rgba(13,153,255,.35)}
.send.ready:hover{transform:translateY(-1px) scale(1.05)}
.send.ready:active{transform:scale(.9)}
.send.stop{background:var(--card-bg-3);color:var(--text-primary);box-shadow:none}

.foot-note{
  margin-top:8px;text-align:center;
  font-size:11px;line-height:16px;letter-spacing:-0.2px;color:var(--text-four);
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.foot-note a{color:var(--text-four);text-decoration:none;display:inline-flex;align-items:center;gap:3px}
.foot-note a:hover{color:var(--text-secondary)}

/* ── slash / mention menu ─────────────────────────────────────── */
.menu{
  position:absolute;left:12px;right:12px;bottom:calc(100% - 4px);
  border-radius:12px;border:1px solid var(--line-1);background:#242424;
  box-shadow:0 18px 50px rgba(0,0,0,.62);
  padding:6px;z-index:20;
  opacity:0;transform:translateY(8px) scale(.98);pointer-events:none;
  transition:opacity .2s var(--ease),transform .28s var(--spring);
  max-height:284px;overflow-y:auto;
}
.menu.open{opacity:1;transform:none;pointer-events:auto}
.menu-title{
  padding:6px 8px 4px;font-size:11px;letter-spacing:.4px;text-transform:uppercase;
  color:var(--text-four);font-weight:500;
}
.mi{
  display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border-radius:8px;text-align:left;
  font-size:var(--fs-body-3);line-height:var(--lh-body-3);letter-spacing:var(--ls-body-3);color:var(--text-secondary);
}
.mi:hover,.mi.sel{background:var(--card-bg-3);color:var(--text-primary)}
.mi-txt{display:flex;flex-direction:column;min-width:0}
.mi-nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi-ds{
  font-size:11px;line-height:15px;letter-spacing:-0.1px;color:var(--text-four);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.mi .k{margin-left:auto;padding-left:8px;flex:none;font-family:var(--mono);font-size:11px;color:var(--text-four)}
.mi .dot{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:var(--card-bg-3);flex:none}

/* model popover */
.pop{
  position:absolute;bottom:calc(100% + 8px);right:0;width:210px;
  border-radius:12px;border:1px solid var(--line-1);background:#1f1f1f;padding:6px;
  box-shadow:0 18px 50px rgba(0,0,0,.6);z-index:25;
  opacity:0;transform:translateY(8px) scale(.97);pointer-events:none;
  transition:opacity .2s var(--ease),transform .28s var(--spring);
}
.pop.open{opacity:1;transform:none;pointer-events:auto}
.pop-i{display:flex;align-items:flex-start;gap:8px;width:100%;padding:7px 8px;border-radius:8px;text-align:left}
.pop-i:hover{background:var(--card-bg-3)}
.pop-i .nm{font-size:var(--fs-body-3);line-height:var(--lh-body-3);letter-spacing:var(--ls-body-3);font-weight:500;color:var(--text-primary)}
.pop-i .ds{font-size:11px;line-height:15px;color:var(--text-four);margin-top:1px}
.pop-i .ck{margin-left:auto;color:var(--blue-500);opacity:0}
.pop-i.on .ck{opacity:1}

/* ── toast ───────────────────────────────────────────────────── */
.toast{
  position:absolute;left:50%;bottom:70px;translate:-50% 0;z-index:60;
  display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:10px;
  background:#1f1f1f;border:1px solid var(--line-1);
  box-shadow:0 16px 44px rgba(0,0,0,.6);
  font-size:var(--fs-body-3);line-height:var(--lh-body-3);letter-spacing:var(--ls-body-3);
  color:var(--text-secondary);
  opacity:0;transform:translate(-50%,12px);pointer-events:none;
  transition:opacity .3s var(--ease),transform .45s var(--spring);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast b{color:var(--text-primary);font-weight:500}

/* hint strip under the artboard */
.hint{
  width:1440px;margin:14px auto 0;display:flex;align-items:center;justify-content:center;gap:18px;
  font-size:12px;color:#5a5a5a;letter-spacing:-.2px;
}
.hint kbd{
  font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:5px;
  background:#1b1b1b;border:1px solid #2e2e2e;color:#8c8c8c;
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.06s !important}
}
</style>
</head>

/* ══════════════════════════════════════════════════════════════════
   CONNECTOR — a straight grey arrow, middle to middle, chevron head
   ══════════════════════════════════════════════════════════════════ */

function connectArrow(fromEl, toEl){
  const stageBox = $('#stage').getBoundingClientRect();
  const f = fromEl.getBoundingClientRect(), t = toEl.getBoundingClientRect();
  const a = { x: f.left + f.width / 2 - stageBox.left, y: f.bottom - stageBox.top };
  const b = { x: t.left + t.width / 2 - stageBox.left, y: t.top  - stageBox.top };

  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
  const inset = 7; // leaves room for the chevron marker so it isn't buried in the node
  const end = { x: b.x - (dx / len) * inset, y: b.y - (dy / len) * inset };

  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('class', 'wire-arrow');
  path.setAttribute('d', `M${a.x.toFixed(1)} ${a.y.toFixed(1)} L${end.x.toFixed(1)} ${end.y.toFixed(1)}`);
  path.setAttribute('marker-end', 'url(#chevronHead)');
  $('#wires').appendChild(path);
  requestAnimationFrame(() => path.classList.add('show'));
  return path;
}

/* ══════════════════════════════════════════════════════════════════
   CONTENT

const SUGGESTIONS = [

/* ══════════════════════════════════════════════════════════════════
   EMPTY STATE

function renderSuggestions(){

  host.innerHTML = '<div class="suggest-label">Suggested</div>';

/* ══════════════════════════════════════════════════════════════════
   PANEL OPEN / CLOSE / EXPAND
   ══════════════════════════════════════════════════════════════════ */

function openPanel(){

/* ══════════════════════════════════════════════════════════════════
   COMPOSER
   ══════════════════════════════════════════════════════════════════ */

function sync(){
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 130) + 'px';
  sendBtn.classList.toggle('ready', ta.value.trim().length > 0 && !busy);
}
ta.addEventListener('input', () => { sync(); maybeMenu(); });
ta.addEventListener('focus', () => composer.classList.add('focused'));
ta.addEventListener('blur',  () => setTimeout(() => composer.classList.remove('focused'), 120));

ta.addEventListener('keydown', e => {
  if (menu.classList.contains('open')){
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); moveSel(e.key === 'ArrowDown' ? 1 : -1); return; }
    if (e.key === 'Enter' || e.key === 'Tab'){ e.preventDefault(); const s = $('.mi.sel', menu); if (s) s.click(); return; }
    if (e.key === 'Escape'){ closeMenu(); return; }
  }
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); submit(ta.value); }
});

sendBtn.addEventListener('click', () => busy ? null : submit(ta.value));

/* model popover */
const modelPop = $('#modelPop');
$('#modelBtn').addEventListener('click', e => { e.stopPropagation(); modelPop.classList.toggle('open'); });
$$('.pop-i').forEach(b => b.addEventListener('click', () => {

document.addEventListener('click', e => {

});

/* ══════════════════════════════════════════════════════════════════
   SLASH / MENTION MENU
   ══════════════════════════════════════════════════════════════════ */

function maybeMenu(){
  const v = ta.value;
  const last = v.slice(v.lastIndexOf(' ') + 1);
  if (last.startsWith('/'))      openMenu('slash', last.slice(1));
  else if (last.startsWith('@')) openMenu('at',    last.slice(1));
  else closeMenu();
}

function openMenu(kind, q){
  q = q.toLowerCase();
  let rows;
  if (kind === 'slash'){
    rows = SLASH.filter(r => r[1].toLowerCase().includes(q)).map(([i, n, d, key]) =>
      `<button class="mi" data-run="${key}" data-label="${n}">
         <span class="dot">${ico(i, 14, '#8c8c8c')}</span>
         <span class="mi-txt"><span class="mi-nm">${n}</span><span class="mi-ds">${d}</span></span>
       </button>`);
  } else {
    rows = MENTIONS.filter(r => r[1].toLowerCase().includes(q)).map(([i, n, t]) =>
      `<button class="mi" data-insert="${n}">
         <span class="dot">${ico(i, 14, '#8c8c8c')}</span>
         <span class="mi-nm">${n}</span>
         <span class="k">${t}</span></button>`);
  }
  if (!rows.length){ closeMenu(); return; }
  menu.innerHTML = `<div class="menu-title">${kind === 'slash' ? 'Actions' : 'Mention a node'}</div>` + rows.join('');
  $('.mi', menu).classList.add('sel');
  menu.classList.add('open');

  $$('.mi', menu).forEach(mi => mi.addEventListener('mousedown', e => {
    e.preventDefault();
    if (mi.dataset.insert){
      const v = ta.value;
      ta.value = v.slice(0, v.lastIndexOf('@')) + '@' + mi.dataset.insert + ' ';
      ta.focus(); sync(); closeMenu();
    } else {
      ta.value = '';
      sync(); closeMenu();
      submit(mi.dataset.label, mi.dataset.run);
    }
  }));
}
function closeMenu(){ menu.classList.remove('open'); }
function moveSel(dir){
  const items = $$('.mi', menu);
  const i = items.findIndex(x => x.classList.contains('sel'));
  items.forEach(x => x.classList.remove('sel'));
  items[(i + dir + items.length) % items.length].classList.add('sel');
}

/* ══════════════════════════════════════════════════════════════════
   RESPONSE ENGINE
   ══════════════════════════════════════════════════════════════════ */

const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const md  = s => esc(s)
  .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
  .replace(/`(.+?)`/g, '<code>$1</code>')
  .replace(/\n/g, '<br>');

function pickScenario(text, key){
  if (key && SCENARIOS[key]) return SCENARIOS[key];
  const t = text.toLowerCase();
  if (/(fail|error|broke|debug|wrong|didn.?t run)/.test(t)) return SCENARIOS.debug;
  if (/(explain|what does|how does|walk me|understand)/.test(t)) return SCENARIOS.explain;
  if (/(add|build|create|draft|make|wire|generate)/.test(t)) return SCENARIOS.build;
  if (/(schedul|weekly|daily|digest|cron|every)/.test(t)) return SCENARIOS.schedule;
  return SCENARIOS.default;
}

async function submit(raw, key){
  const text = (raw || '').trim();
  if (!text || busy) return;

  busy = true;
  composer.classList.add('busy');
  sendBtn.classList.remove('ready');
  sendBtn.classList.add('stop');
  sendBtn.innerHTML = ico('stop', 16);
  ta.value = ''; sync(); closeMenu();

  emptyEl.classList.add('gone');
  thread.classList.remove('hidden');
  frame.classList.add('tiq-working');

  /* user turn */
  const u = document.createElement('div');
  u.className = 'msg-user';
  u.innerHTML = `<span>${md(text)}</span>`;
  thread.appendChild(u);
  scroll();

  await wait(reduced ? 60 : 330);

  /* tiq turn */
  const m = document.createElement('div');
  m.className = 'msg-tiq';
  m.innerHTML = `<svg class="avatar" width="22" height="22"><use href="#i-tiq"/></svg>
                 <div class="stream"></div>`;
  thread.appendChild(m);
  const stream = $('.stream', m);
  scroll();

  /* thinking */
  const think = document.createElement('div');
  think.innerHTML = `<span class="thinking">Reading your canvas</span>
                     <span class="dots3"><i></i><i></i><i></i></span>`;
  think.style.display = 'flex';
  think.style.alignItems = 'center';
  think.style.gap = '8px';
  stream.appendChild(think);
  await wait(reduced ? 80 : 700);
  think.remove();

  const sc = pickScenario(text, key);

  /* tool trace */
  const trace = buildTrace();
  stream.appendChild(trace);
  scroll();
  await runSteps(trace, sc.steps);

  /* streamed reply */
  const reply = document.createElement('div');
  reply.className = 'reply typing';
  stream.appendChild(reply);
  await typeInto(reply, sc.reply);
  reply.classList.remove('typing');

  /* artifact */
  if (sc.artifact){
    stream.appendChild(buildArtifact(sc.artifact));
    scroll();
    await wait(reduced ? 40 : 240);
  }

  /* message toolbar */
  const tools = document.createElement('div');
  tools.className = 'msg-tools';
  tools.innerHTML = `<button class="mt" data-act="copy" title="Copy">${ico('copy', 14)}</button>
                     <button class="mt" data-act="retry" title="Try again">${ico('refresh', 14)}</button>`;
  tools.addEventListener('click', e => {
    const b = e.target.closest('.mt'); if (!b) return;
    if (b.dataset.act === 'copy'){
      b.classList.add('ok'); b.innerHTML = ico('check', 14);
      toast(ico('copy', 15, '#8c8c8c'), 'Copied', 'reply on your clipboard');
    } else { submit(text, key); }
  });
  stream.appendChild(tools);

  /* follow-ups */
  if (sc.followups){
    const fus = document.createElement('div');
    fus.className = 'followups';
    sc.followups.forEach((f, i) => {
      const b = document.createElement('button');
      b.className = 'fu';
      b.textContent = f;
      b.style.animationDelay = (i * 0.06) + 's';
      b.addEventListener('click', () => submit(f));
      fus.appendChild(b);
    });
    stream.appendChild(fus);
  }

  scroll();
  busy = false;
  frame.classList.remove('tiq-working');
  composer.classList.remove('busy');
  sendBtn.classList.remove('stop');
  sendBtn.innerHTML = ico('send', 16);
  sync();
}

/* ── tool trace ─────────────────────────────────────────────────── */
function buildTrace(){
  const t = document.createElement('div');
  t.className = 'trace';
  t.innerHTML = `<button class="trace-head">
                   <span class="spin"></span>
                   <span class="lbl">Working…</span>
                   <span class="chev">${ico('chev-down', 14)}</span>
                 </button>
                 <div class="trace-steps"></div>`;
  $('.trace-head', t).addEventListener('click', () => {
    const box = $('.trace-steps', t);
    if (t.classList.contains('collapsed')){
      t.classList.remove('collapsed');
      box.style.height = box.scrollHeight + 'px';
    } else {
      box.style.height = box.scrollHeight + 'px';
      requestAnimationFrame(() => t.classList.add('collapsed'));
    }
  });
  return t;
}

async function runSteps(trace, steps){
  const box = $('.trace-steps', trace);
  const t0 = performance.now();
  for (const [label, ms] of steps){
    const row = document.createElement('div');
    row.className = 'step on';
    row.innerHTML = `<span class="spin"></span><span>${esc(label)}</span><span class="ms"></span>`;
    box.appendChild(row);
    box.style.height = box.scrollHeight + 'px';
    scroll();
    await wait(reduced ? 40 : ms);
    row.classList.add('done');
    $('.spin', row).outerHTML =
      `<svg class="tick" viewBox="0 0 16 16"><path d="M3.2 8.4l3.1 3.1 6.5-6.9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`;
    $('.ms', row).textContent = ms + 'ms';
  }
  const total = Math.round(performance.now() - t0);
  $('.spin', trace).outerHTML = `<span class="tick" style="display:flex">${ico('check', 13)}</span>`;
  $('.lbl', trace).textContent = `${steps.length} steps · ${(total / 1000).toFixed(1)}s`;
  await wait(reduced ? 20 : 340);
  box.style.height = box.scrollHeight + 'px';
  requestAnimationFrame(() => trace.classList.add('collapsed'));
}

/* ── streamed typing ────────────────────────────────────────────── */
function typeInto(el, source){
  el.innerHTML = md(source);
  const nodes = [];
  (function walk(n){
    n.childNodes.forEach(c => {
      if (c.nodeType === 3){ nodes.push([c, c.nodeValue]); c.nodeValue = ''; }
      else walk(c);
    });
  })(el);

  if (reduced){ nodes.forEach(([n, v]) => n.nodeValue = v); return Promise.resolve(); }

  return new Promise(done => {
    let i = 0, pos = 0;
    (function tick(){
      if (i >= nodes.length){ done(); return; }
      const [node, full] = nodes[i];
      pos += 2 + Math.floor(Math.random() * 3);
      node.nodeValue = full.slice(0, pos);
      if (pos >= full.length){ node.nodeValue = full; i++; pos = 0; }
      scroll();
      setTimeout(tick, 16);
    })();
  });
}

function scroll(){ bodyEl.scrollTop = bodyEl.scrollHeight; }

/* ══════════════════════════════════════════════════════════════════
   ARTIFACT  →  CANVAS
   ══════════════════════════════════════════════════════════════════ */

const APP_ICON = { slack:['slack',''], doc:['doc','#0d99ff'], automations:['automations','#8c8c8c'] };

function buildArtifact(a){
  const el = document.createElement('div');
  el.className = 'artifact';
  const apps = (a.apps || []).map(k => {
    const [id, c] = APP_ICON[k] || ['doc', ''];
    return `<span class="tool-chip">${ico(id, 16, c)}</span>`;
  }).join('');
  const meta = (a.meta || []).map(([id, n]) => `<span class="count-badge">${ico(id, 16)}${n}</span>`).join('');

  el.innerHTML = `
    <div class="artifact-head">${ico('sparkle', 14, '#a0a5f7')}${esc(a.head)}</div>
    <div class="artifact-body">
      <div class="mini-node">
        <div>
          <div class="mini-title">${esc(a.title)}</div>
          <div class="mini-sub">${esc(a.sub)}</div>
        </div>
        <div class="card-meta">${apps}${meta}</div>
      </div>
    </div>
    <div class="artifact-actions">
      <button class="act act-primary" data-go>${ico(a.icon || 'plus', 13)}${esc(a.primary)}</button>
      <button class="act act-ghost" data-skip>Discard</button>
    </div>`;

  const go = $('[data-go]', el);
  go.addEventListener('click', () => {
    if (go.classList.contains('act-done')) return;
    go.classList.remove('act-primary');
    go.classList.add('act-done');
    go.innerHTML = ico('check', 13) + (a.build ? 'Added to canvas' : 'Applied');
    $('[data-skip]', el).remove();
    if (a.build) addToCanvas(a.build);
    else {
      toast(ico('check', 15, '#7cb342'), 'Slack reconnected', '3 runs queued for replay');
      pulseSave();
    }
  });
  $('[data-skip]', el).addEventListener('click', () => {
    el.style.transition = 'opacity .25s, transform .25s';
    el.style.opacity = 0; el.style.transform = 'scale(.97)';
    setTimeout(() => el.remove(), 250);
  });
  return el;
}

/* drops a real node on the canvas and draws the edge into it */
function addToCanvas(spec){
  const slot = $('#builtSlot');
  const top  = 438 + builtCount * 210;
  builtCount++;

  const isTool = spec.badge === 'Tool';
  const node = document.createElement('div');
  node.className = 'node node-group node-created';
  node.style.left = '690px';
  node.style.top  = top + 'px';
  node.innerHTML = `
    <span class="${isTool ? 'badge-tool' : 'badge-agent'}">
      ${ico(isTool ? 'bolt' : 'agent', 16, isTool ? '#44aaf3' : '#5860ed')}${esc(spec.badge)}
    </span>
    <div class="card-node">
      <div style="display:flex;flex-direction:column;gap:4px">
        <div class="card-title">${esc(spec.title)}</div>
        <div class="card-sub">${esc(spec.sub)}</div>
      </div>
      <div class="card-meta">
        <span class="tool-chip">${ico('slack', 16)}</span>
        <span class="tool-chip">${ico('doc', 16, '#0d99ff')}</span>
        <span class="count-badge">${ico('tools', 16)}2</span>
        <span class="count-badge">${ico('skill', 16)}3</span>
        <span class="count-badge">${ico('guard', 16)}1</span>
      </div>
    </div>`;
  slot.appendChild(node);
  requestAnimationFrame(() => node.classList.add('landed'));

  /* edge — drawn once the node has settled into its resting position,
     so the arrow measures real geometry rather than mid-animation transform */
  const newBadge = node.querySelector('.badge-agent, .badge-tool');
  setTimeout(() => {
    connectArrow(lastBadgeEl, newBadge);
    lastBadgeEl = newBadge;
  }, reduced ? 0 : 720);

  toast(ico('check', 15, '#7cb342'), `${spec.title} added`, 'wired to Feedback Analyzer');
  pulseSave();
}

function pulseSave(){
  const s = $('#saveBtn');
  s.classList.remove('pulse');
  void s.offsetWidth;
  s.classList.add('pulse');
}

/* ══════════════════════════════════════════════════════════════════
   TOAST
   ══════════════════════════════════════════════════════════════════ */
let toastT;
function toast(iconHtml, title, note){
  toastEl.innerHTML = `${iconHtml}<b>${title}</b>${note ? `<span>· ${note}</span>` : ''}`;
  toastEl.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => toastEl.classList.remove('show'), 2600);
}

/* ══════════════════════════════════════════════════════════════════
   AMBIENT + SHORTCUTS
   ══════════════════════════════════════════════════════════════════ */

if (!reduced){
  let rx = 0, ry = 0, tx = 0, ty = 0, raf = 0;
  frame.addEventListener('mousemove', e => {
    const r = frame.getBoundingClientRect();
    tx = ((e.clientX - r.left) / r.width  - .5) * -16;
    ty = ((e.clientY - r.top)  / r.height - .5) * -12;
    if (!raf) raf = requestAnimationFrame(drift);
  });
  const dots = $('#dots');
  function drift(){
    rx += (tx - rx) * .06; ry += (ty - ry) * .06;
    dots.style.transform = `translate(${rx.toFixed(2)}px, ${ry.toFixed(2)}px)`;
    raf = (Math.abs(tx - rx) > .1 || Math.abs(ty - ry) > .1) ? requestAnimationFrame(drift) : 0;
  }
}

document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    frame.classList.contains('panel-open') ? closePanel() : openPanel();
  }
  if (e.key === 'Escape' && frame.classList.contains('panel-open')){
    if (menu.classList.contains('open')) closeMenu();
    else if (modelPop.classList.contains('open')) modelPop.classList.remove('open');
    else closePanel();
  }
});

/* ══════════════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════════════ */
renderSuggestions();
sync();
setTimeout(openPanel, reduced ? 0 : 620);

requestAnimationFrame(() => requestAnimationFrame(() => {
  lastBadgeEl = $('#agentBadge');
  connectArrow($('#startNode'), lastBadgeEl);
}));

})();
</script>
