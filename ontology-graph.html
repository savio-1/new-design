<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ontology Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    /* Cogentiq Builder palette */
    --bg:#121212;
    --panel:#212121;
    --panel-br:#323232;
    --panel-br2:#424242;
    --text:#f5f5f5;
    --text-dim:#bdbdbd;
    --text-dimmer:#8c8c8c;
    --indigo:#5860ed;
    --indigo-d:#454de0;
    --blue:#0d99ff;
    --blue-l:#80caff;
    --red:#f24822;
    --green:#14ae5c;
    --green-l:#7cb342;
    --orange:#fc9e24;
    --orange-d:#f79722;
    --font:'Geist','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --mono:'Geist Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:var(--font)}
  #stage{position:fixed;inset:0;cursor:grab}
  #stage.panning{cursor:grabbing}
  /* dot-grid canvas, Cogentiq-style, plus a soft central lift */
  #stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
    background-image:
      radial-gradient(rgba(255,255,255,.06) 1px, transparent 1.6px),
      radial-gradient(1100px 850px at 50% 42%, rgba(255,255,255,.025), rgba(0,0,0,0) 62%);
    background-size:26px 26px, 100% 100%;
    background-position:-3px -3px, 0 0;}
  svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;display:block}

  /* default: dotted grey relation lines */
  .edge{fill:none;stroke:#4d5158;stroke-linecap:round;stroke-width:1.6;
    stroke-dasharray:2 7;opacity:.75;transition:opacity .25s,stroke .25s;}
  /* edges touching the focused node: solid blue */
  .edge.solid{stroke:var(--blue);stroke-dasharray:none;stroke-width:1.7;opacity:.85}
  .edge.hi{opacity:1;stroke-width:2.1}
  .shimmer{fill:none;stroke-linecap:round;stroke-width:2.4;mix-blend-mode:screen;pointer-events:none;}

  .rel-pill{pointer-events:none;}
  .rel-pill rect{fill:#1c1c1cf0;stroke:var(--panel-br2);stroke-width:1;}
  .rel-pill text{fill:var(--text-dim);font-size:10.5px;font-family:var(--font);font-weight:500;
    letter-spacing:-.01em;text-anchor:middle;dominant-baseline:middle;}
  .rel-pill.hi rect{stroke:#5c5c5c;fill:#232323f5}
  .rel-pill.hi text{fill:#fff}

  .node{cursor:pointer;transition:opacity .35s ease;}
  .node text{font-size:12px;fill:var(--text);paint-order:stroke;pointer-events:none;
    letter-spacing:-.01em;dominant-baseline:middle;font-weight:500;}

  /* plain chip (non-focus entity) */
  .chip-rect{fill:var(--panel);stroke:var(--panel-br);stroke-width:1;rx:8;ry:8;}
  .node.hover .chip-rect{stroke:var(--panel-br2)}
  .chip-sq{rx:2.5;ry:2.5;}

  /* focus node: avatar + capsule with animated gradient ring */
  .avatar-init{font-size:11px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
  .cap-rect{fill:#1a1a1af5;stroke:url(#focusGrad);stroke-width:1.8;}
  .cap-glow{fill:none;stroke:url(#focusGrad);stroke-width:5;filter:url(#capGlowBlur);
    pointer-events:none;opacity:0;}
  .node.focus text{font-weight:600}

  .halo{opacity:0;transition:opacity .2s;pointer-events:none;}
  .node.hover .halo{opacity:.5}

  /* rest of the ontology: real nodes/edges, kept faded until selected */
  .bg-chip{cursor:pointer}
  .bg-chip .chip-rect{stroke:#2a2a2a}
  .bg-edge{fill:none;stroke:#3a3d42;stroke-linecap:round;stroke-width:1.2;
    stroke-dasharray:2 7;pointer-events:none;transition:opacity .3s ease;}

  /* ---------- chrome ---------- */
  .panel{background:rgba(28,28,28,.82);backdrop-filter:blur(9px);border:1px solid var(--panel-br);border-radius:11px;}
  .topbar{position:fixed;z-index:5;top:16px;left:16px;display:flex;align-items:center;gap:10px}
  .brand{display:flex;align-items:center;gap:9px;padding:8px 12px;}
  .brand .dot{width:16px;height:16px;border-radius:5px;background:linear-gradient(135deg,var(--orange),var(--orange-d))}
  .brand b{color:var(--text);font-size:13px;font-weight:600;letter-spacing:-.01em}
  .brand span{color:var(--text-dimmer);font-size:12px}
  .crumbs{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 6px;max-width:60vw;overflow:hidden}
  .crumbs button{all:unset;cursor:pointer;color:var(--text-dimmer);font-size:12px;padding:4px 8px;border-radius:7px;white-space:nowrap}
  .crumbs button:hover{background:#2a2a2a;color:var(--text-dim)}
  .crumbs .sep{color:#4a4a4a;font-size:11px}
  .crumbs .cur{color:#fff;background:#2a2a2a;border:1px solid var(--panel-br2)}

  .search{position:fixed;z-index:5;top:16px;right:16px;display:flex;align-items:center;gap:8px;padding:8px 12px;width:230px}
  .search svg{position:static;width:15px;height:15px;flex:0 0 15px;opacity:.5}
  .search input{all:unset;color:var(--text);font-size:12.5px;width:100%;font-family:var(--font)}
  .search input::placeholder{color:var(--text-dimmer)}

  .fullscr{position:fixed;z-index:5;top:16px;right:262px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-dim)}
  .fullscr:hover{color:#fff;border-color:var(--panel-br2)}

  .legend{position:fixed;z-index:5;left:16px;bottom:16px;display:flex;flex-direction:column;gap:7px;padding:11px 13px}
  .legend .row{display:flex;align-items:center;gap:8px;color:var(--text-dimmer);font-size:11.5px}
  .legend .sw{width:9px;height:9px;border-radius:2.5px}

  .hint{position:fixed;z-index:5;right:16px;bottom:16px;color:var(--text-dimmer);font-size:11px;
    padding:7px 11px;line-height:1.5}
  .hint b{color:#9a9a9a;font-weight:500}

  .zoomwrap{position:fixed;z-index:5;left:50%;bottom:16px;transform:translateX(-50%);
    display:flex;align-items:center;gap:2px;padding:5px;}
  .zoomwrap button{all:unset;cursor:pointer;color:var(--text-dim);font-size:15px;width:28px;height:28px;
    text-align:center;line-height:28px;border-radius:8px;}
  .zoomwrap button:hover{background:#2a2a2a;color:#fff}
  .zoomwrap .pct{color:var(--text-dim);font-size:12px;width:46px;text-align:center;font-family:var(--mono);}

  /* hover definition card */
  #tip{position:fixed;z-index:8;max-width:280px;pointer-events:none;
    background:rgba(26,26,26,.95);backdrop-filter:blur(10px);
    border:1px solid var(--panel-br2);border-radius:12px;padding:12px 14px;
    opacity:0;transform:translateY(4px);transition:opacity .16s ease,transform .16s ease;}
  #tip.show{opacity:1;transform:translateY(0)}
  #tip .t-head{display:flex;align-items:center;gap:7px;margin-bottom:6px}
  #tip .t-dot{width:8px;height:8px;border-radius:2.5px;flex:0 0 8px}
  #tip .t-type{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-dimmer)}
  #tip .t-name{font-size:13px;font-weight:600;color:#fff;margin-bottom:4px;letter-spacing:-.01em}
  #tip .t-def{font-size:12px;line-height:17px;color:var(--text-dim)}
</style>
</head>
<body>
  <div id="stage">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="shimmerBlur" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="1.1"/>
        </filter>
        <filter id="capGlowBlur" x="-120%" y="-200%" width="340%" height="500%">
          <feGaussianBlur stdDeviation="5.5"/>
        </filter>
        <!-- rainbow-button-style multi-hue sweep; first/last stop match so the
             loop has no seam as it rotates through -->
        <linearGradient id="focusGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"   stop-color="#0d99ff"/>
          <stop offset="25%"  stop-color="#9747ff"/>
          <stop offset="50%"  stop-color="#e91e63"/>
          <stop offset="75%"  stop-color="#fc9e24"/>
          <stop offset="100%" stop-color="#0d99ff"/>
        </linearGradient>
      </defs>
      <defs id="edgeDefs"></defs>
      <g id="camera">
        <g id="bgEdgeLayer"></g>
        <g id="bgLayer"></g>
        <g id="edges"></g>
        <g id="shimmers"></g>
        <g id="pills"></g>
        <g id="nodes"></g>
      </g>
    </svg>
  </div>

  <div class="topbar">
    <div class="brand panel"><span class="dot"></span><b>Ontology</b><span id="stat">— explore</span></div>
    <div class="crumbs panel" id="crumbs"></div>
  </div>

  <div class="fullscr panel" id="fullscr" title="Fullscreen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
  </div>
  <div class="search panel">
    <svg viewBox="0 0 24 24" fill="none" stroke="#8b929c" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" placeholder="Search entities…" autocomplete="off" />
  </div>

  <div class="legend panel" id="legend"></div>

  <div class="zoomwrap panel">
    <button id="zout">−</button><span class="pct" id="pct">100%</span><button id="zin">+</button>
  </div>
  <div class="hint"><b>Click</b> a node to re-center · <b>Hover</b> for definition · <b>Drag</b> to pan · <b>Scroll</b> to zoom</div>

  <div id="tip">
    <div class="t-head"><span class="t-dot"></span><span class="t-type"></span></div>
    <div class="t-name"></div>
    <div class="t-def"></div>
  </div>

<script>
/* =========================================================================
   DATA — CPG demand-planning ontology (from the current Cogentiq graph).
   Structure (names + relationships) shows by default; each node's `def`
   is revealed in a card only on hover.
   ========================================================================= */
const NODES = [
  {id:'Forecast Deviation', type:'derived',
   def:'A computed comparison between actual demand and the calibrated forecast, used to visualize forecast accuracy.'},
  {id:'Calibrated Actual Demand', type:'measure',
   def:'Actual demand calibrated with org-specific POS lag rules.'},
  {id:'Observed Actual Demand', type:'measure',
   def:'Actual demand as the observed half of the forecast-accuracy comparison.'},
  {id:'Consensus Demand Forecast', type:'forecast',
   def:'Demand forecast defaulting to the consensus scenario for the account.'},
  {id:'Calibrated Demand Forecast', type:'forecast',
   def:'Demand forecast calibrated with org-specific bias corrections.'},
  {id:'Walmart', type:'account',
   def:'Major retail account with strict OTIF and full-truckload requirements.'},
  {id:'Monitored Inventory Position', type:'inventory',
   def:'Inventory position monitored against org-specific DOS (days of supply) risk thresholds.'},
  {id:'Retailer Replenishment Policy', type:'policy',
   def:'Replenishment policy shaped by retailer-specific service levels.'},
];
const LINKS = [
  ['Calibrated Demand Forecast','Forecast Deviation','produces deviation'],
  ['Calibrated Actual Demand','Forecast Deviation','produces deviation'],
  ['Observed Actual Demand','Calibrated Actual Demand','calibrated by lag rules'],
  ['Consensus Demand Forecast','Calibrated Demand Forecast','bias-corrected into'],
  ['Walmart','Consensus Demand Forecast','plans account for'],
  ['Walmart','Observed Actual Demand','sells through'],
  ['Forecast Deviation','Monitored Inventory Position','adjusts timing'],
  ['Monitored Inventory Position','Retailer Replenishment Policy','stockout risk rule'],
  ['Walmart','Retailer Replenishment Policy','sets service levels'],
];
const START = 'Forecast Deviation';
/* ===================================================================== */

// colors pulled directly from the Cogentiq variable-collection tokens (500/600 tier)
const TYPE = {
  measure:  {color:'#14ae5c', label:'Measure'},    // Green/500
  forecast: {color:'#5860ed', label:'Forecast'},   // Indigo/500
  derived:  {color:'#00a2c2', label:'Derived metric'}, // Cyan/500
  account:  {color:'#f24822', label:'Account'},    // Red/500
  inventory:{color:'#0d99ff', label:'Inventory'},  // Blue/500
  policy:   {color:'#fc9e24', label:'Policy'},     // Orange/600
};

// ---- adjacency -----------------------------------------------------------
const byId = Object.fromEntries(NODES.map(n=>[n.id,n]));
const adj = Object.fromEntries(NODES.map(n=>[n.id,[]]));
const relOf = {};
for(const [a,b,r] of LINKS){ if(!byId[a]||!byId[b])continue;
  adj[a].push(b); adj[b].push(a); relOf[a+'|'+b]=r; relOf[b+'|'+a]=r; }
function colorOf(id){ return (TYPE[byId[id].type]||TYPE.entity).color; }
function shade(hex,amt){ // amt -1..1, negative darkens toward black, positive lightens toward white
  const c=hex.replace('#','');
  const r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);
  const mix=(v)=> amt<0 ? Math.round(v*(1+amt)) : Math.round(v+(255-v)*amt);
  return `rgb(${mix(r)},${mix(g)},${mix(b)})`;
}

const NS='http://www.w3.org/2000/svg';
const el=(t,a={})=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
const initials = s => s.replace(/[^A-Za-z0-9 ]/g,'').split(/(?=[A-Z])|\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();

// ---- camera --------------------------------------------------------------
let W=innerWidth, H=innerHeight;
const cam={x:W/2,y:H/2,k:1};
const camG=document.getElementById('camera');
const focusGradEl=document.getElementById('focusGrad');
function applyCam(){camG.setAttribute('transform',`translate(${cam.x},${cam.y}) scale(${cam.k})`);
  document.getElementById('pct').textContent=Math.round(cam.k*100)+'%';}

// ---- full-graph layout, computed once: gives every node (not just the
// active ego cluster) a stable slot so the un-selected rest of the
// ontology can be shown for real, faded, instead of decorative filler.
function computeFullLayout(){
  const P={}; let seed=42; const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  for(const n of NODES){ const a=rnd()*Math.PI*2, r=110+rnd()*70; P[n.id]={x:Math.cos(a)*r,y:Math.sin(a)*r}; }
  for(let iter=0; iter<260; iter++){
    for(let i=0;i<NODES.length;i++)for(let j=i+1;j<NODES.length;j++){
      const A=P[NODES[i].id],B=P[NODES[j].id];
      let dx=A.x-B.x,dy=A.y-B.y,d2=dx*dx+dy*dy||0.01,d=Math.sqrt(d2);
      const f=9000/d2, ux=dx/d,uy=dy/d;
      A.x+=ux*f*0.02; A.y+=uy*f*0.02; B.x-=ux*f*0.02; B.y-=uy*f*0.02;
    }
    for(const [a,b] of LINKS){
      const A=P[a],B=P[b]; if(!A||!B)continue;
      let dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||0.01;
      const f=(d-230)*0.02;
      A.x+=dx/d*f; A.y+=dy/d*f; B.x-=dx/d*f; B.y-=dy/d*f;
    }
    for(const n of NODES){ const p=P[n.id]; p.x*=0.995; p.y*=0.995; }
  }
  // push the whole arrangement out just beyond the active-cluster radius,
  // preserving each node's angle so related nodes stay together
  for(const n of NODES){
    const p=P[n.id], r=Math.hypot(p.x,p.y)||1, ang=Math.atan2(p.y,p.x);
    const newR=380+r*0.4;
    p.x=Math.cos(ang)*newR; p.y=Math.sin(ang)*newR*0.85;
  }
  return P;
}
const FULLPOS = computeFullLayout();
const bgEls={};
const BG_OPACITY=0.32, BG_DIM=0.07;

// ---- physics state -------------------------------------------------------
const pos={};                 // id -> {x,y,vx,vy}
function ensure(id, near){
  if(pos[id])return pos[id];
  const a=Math.random()*Math.PI*2, r=40+Math.random()*40;
  pos[id]={x:(near?near.x:0)+Math.cos(a)*r, y:(near?near.y:0)+Math.sin(a)*r, vx:0, vy:0};
  return pos[id];
}
for(const n of NODES) pos[n.id]={x:FULLPOS[n.id].x, y:FULLPOS[n.id].y, vx:0, vy:0};
pos[START]={x:0,y:0,vx:0,vy:0};

let focusId=START;
let active=new Set();          // ids currently in the ego view
const nodeEls={};              // id -> {g, refs}
const edgeEls=[];              // {line,a,b,from,to,pg,prect,ptext,shimmer,edgeGrad,shGrad,stops,phase,speed}
let hoverId=null, dragId=null, dragMoved=false;
let clock=0, gradSeq=0;
const history=[];

function neighbors(id){return adj[id];}

// ---- build / rebuild ego view -------------------------------------------
function setFocus(id, pushHist=true){
  if(!byId[id]) return;
  if(pushHist && id!==focusId) history.push(focusId);
  const prevFocus=focusId;
  focusId=id;
  const want=new Set([id, ...neighbors(id)]);

  const f=ensure(id);
  neighbors(id).forEach((nb,i)=>{
    if(!pos[nb]){const a=(i/neighbors(id).length)*Math.PI*2; ensure(nb);
      pos[nb].x=f.x+Math.cos(a)*180; pos[nb].y=f.y+Math.sin(a)*180;}
  });

  for(const nid of Array.from(active)){
    if(!want.has(nid)){
      const rec=nodeEls[nid]; if(rec){rec.g.style.opacity=0; const gg=rec.g; setTimeout(()=>gg.remove(),350);}
      delete nodeEls[nid]; active.delete(nid);
      pos[nid]={x:FULLPOS[nid].x, y:FULLPOS[nid].y, vx:0, vy:0}; // return to its background slot
    }
  }
  for(const nid of want){ createNode(nid); active.add(nid); } // rebuild all (chip<->avatar swap on focus change)

  buildEdges();
  renderBackground();
  updateChrome();
}

// ---- background layer: the rest of the real ontology, faded ------------
function renderBackground(){
  const layer=document.getElementById('bgLayer');
  const edgeLayer=document.getElementById('bgEdgeLayer');
  layer.innerHTML=''; edgeLayer.innerHTML='';
  for(const k in bgEls) delete bgEls[k];

  const bgIds=NODES.map(n=>n.id).filter(id=>!active.has(id));
  const bgSet=new Set(bgIds);
  const seen=new Set();
  for(const a of bgIds){
    for(const b of neighbors(a)){
      if(!bgSet.has(b))continue;
      const key=a<b?a+'|'+b:b+'|'+a; if(seen.has(key))continue; seen.add(key);
      const A=FULLPOS[a],B=FULLPOS[b];
      edgeLayer.appendChild(el('line',{class:'bg-edge',x1:A.x,y1:A.y,x2:B.x,y2:B.y}));
    }
  }

  const _mm=document.createElement('canvas').getContext('2d'); _mm.font='500 11px Geist, sans-serif';
  for(const id of bgIds){
    const P=FULLPOS[id];
    const color=colorOf(id);
    const w=Math.ceil(_mm.measureText(id).width);
    const g=el('g',{class:'node bg-chip'}); g.dataset.id=id;
    g.setAttribute('transform',`translate(${P.x},${P.y})`);
    const rect=el('rect',{class:'chip-rect', x:0, y:-13, height:26, width:w+26});
    g.appendChild(rect);
    g.appendChild(el('rect',{class:'chip-sq', x:8, y:-3.5, width:7, height:7, fill:color}));
    const label=el('text',{x:21, y:1}); label.textContent=id;
    g.appendChild(label);
    g.addEventListener('pointerenter',()=>setHover(id));
    g.addEventListener('pointerleave',()=>setHover(null));
    g.addEventListener('pointerdown',e=>{e.stopPropagation(); setFocus(id);});
    layer.appendChild(g);
    bgEls[id]={g, label, chipRect:rect};
  }
  applyDim();
}

function createNode(id){
  if(nodeEls[id]){ nodeEls[id].g.remove(); }
  const isFocus = id===focusId;
  const color = colorOf(id);
  const g=el('g',{class:'node'+(isFocus?' focus':'')}); g.dataset.id=id; g.style.opacity=0;

  g.appendChild(el('circle',{class:'halo', r:isFocus?26:18, fill:color, opacity:0, 'fill-opacity':.16}));

  let label, chipRect, capRect, capGlow, w;
  const _mm=document.createElement('canvas').getContext('2d');
  _mm.font=(isFocus?'600 13px':'500 12px')+' Geist, sans-serif';
  w=Math.ceil(_mm.measureText(id).width);

  if(isFocus){
    const cw=21+27+w+18;
    capGlow=el('rect',{class:'cap-glow', x:-21, y:-19, height:38, width:cw, rx:19, ry:19});
    g.appendChild(capGlow);
    capRect=el('rect',{class:'cap-rect', x:-21, y:-19, height:38, width:cw, rx:19, ry:19});
    g.appendChild(capRect);
    const avatar=el('circle',{r:14, fill:color});
    g.appendChild(avatar);
    const ini=el('text',{class:'avatar-init'}); ini.textContent=initials(id); g.appendChild(ini);
    label=el('text',{x:25, y:1}); label.textContent=id; label.style.fill='#fff';
    g.appendChild(label);
  } else {
    chipRect=el('rect',{class:'chip-rect', x:0, y:-15, height:30, width:w+30});
    g.appendChild(chipRect);
    g.appendChild(el('rect',{class:'chip-sq', x:9, y:-4, width:8, height:8, fill:color}));
    label=el('text',{x:25, y:1}); label.textContent=id;
    g.appendChild(label);
  }

  g.addEventListener('pointerenter',()=>setHover(id));
  g.addEventListener('pointerleave',()=>setHover(null));
  g.addEventListener('pointerdown',e=>{e.stopPropagation();startNodeDrag(id,e);});

  document.getElementById('nodes').appendChild(g);
  nodeEls[id]={g, label, chipRect, capRect, capGlow, isFocus, w};
  requestAnimationFrame(()=>{g.style.opacity=1;});
}

function buildEdges(){
  const layer=document.getElementById('edges');
  const shLayer=document.getElementById('shimmers');
  const pillLayer=document.getElementById('pills');
  const defs=document.getElementById('edgeDefs');
  edgeEls.length=0; layer.innerHTML=''; shLayer.innerHTML=''; pillLayer.innerHTML=''; defs.innerHTML='';
  const seen=new Set(); let idx=0;
  for(const a of active){
    for(const b of neighbors(a)){
      if(!active.has(b))continue;
      const key=a<b?a+'|'+b:b+'|'+a; if(seen.has(key))continue; seen.add(key);

      const from = a===focusId ? a : (b===focusId ? b : a);
      const to   = from===a ? b : a;
      const touchesFocus = (a===focusId||b===focusId);
      const sid='sh'+(gradSeq++);

      // shimmer gradient: a soft light window travelling the line
      const glow = touchesFocus ? '#cfe9ff' : '#e8ecf4';
      const sg=el('linearGradient',{id:sid, gradientUnits:'userSpaceOnUse'});
      const ss0=el('stop',{offset:'0%', 'stop-color':glow,'stop-opacity':0});
      const ss1=el('stop',{offset:'50%','stop-color':'#ffffff','stop-opacity':.95});
      const ss2=el('stop',{offset:'100%','stop-color':glow,'stop-opacity':0});
      sg.appendChild(ss0); sg.appendChild(ss1); sg.appendChild(ss2); defs.appendChild(sg);

      const line=el('line',{class:'edge'+(touchesFocus?' solid':'')});
      layer.appendChild(line);
      const shimmer=el('line',{class:'shimmer', stroke:`url(#${sid})`, filter:'url(#shimmerBlur)'});
      if(!touchesFocus) shimmer.setAttribute('stroke-dasharray','2 7');
      shLayer.appendChild(shimmer);

      const rel = relOf[a+'|'+b] || '';
      const pg = el('g',{class:'rel-pill'});
      const prect = el('rect',{rx:7,ry:7,height:20});
      const ptext = el('text',{y:1}); ptext.textContent=rel;
      pg.appendChild(prect); pg.appendChild(ptext); pillLayer.appendChild(pg);

      edgeEls.push({line,shimmer,a,b,from,to,pg,prect,ptext,ss0,ss1,ss2,idx});
      idx++;
    }
  }
  // spread pulse phases evenly across the period so pulses ripple one after another
  edgeEls.forEach((e,i)=>{ e.phase=i/edgeEls.length; });
}

// ---- hover highlight + definition card -----------------------------------
const tip=document.getElementById('tip');
function applyDim(){
  const id=hoverId;
  const connected = id ? new Set([id,...neighbors(id)]) : null;
  for(const nid in nodeEls){
    const g=nodeEls[nid].g;
    g.classList.toggle('hover', nid===id);
    if(!id){ g.style.opacity=1; }
    else g.style.opacity = connected.has(nid)?1:0.28;
  }
  for(const nid in bgEls){
    const g=bgEls[nid].g;
    g.classList.toggle('hover', nid===id);
    if(!id){ g.style.opacity=BG_OPACITY; }
    else g.style.opacity = connected.has(nid)?1:BG_DIM;
  }
}
function setHover(id){
  hoverId=id;
  document.getElementById('stat').textContent = id ? '— '+ (relCount(id)) : '— explore';
  applyDim();
  // definition card
  if(id && byId[id].def){
    const t=TYPE[byId[id].type]||{};
    tip.querySelector('.t-dot').style.background=t.color||'#888';
    tip.querySelector('.t-type').textContent=t.label||'';
    tip.querySelector('.t-name').textContent=id;
    tip.querySelector('.t-def').textContent=byId[id].def;
    placeTip(id);
    tip.classList.add('show');
  } else {
    tip.classList.remove('show');
  }
}
function placeTip(id){
  const p=pos[id]; if(!p)return;
  const sx=p.x*cam.k+cam.x, sy=p.y*cam.k+cam.y;
  const r=tip.getBoundingClientRect();
  let x=sx+26*cam.k, y=sy+22*cam.k;                       // below-right of the node
  if(x+r.width>innerWidth-14)  x=sx-r.width-26*cam.k;     // flip left
  if(y+r.height>innerHeight-14) y=sy-r.height-22*cam.k;   // flip above
  tip.style.left=Math.max(14,x)+'px';
  tip.style.top =Math.max(14,y)+'px';
}
function relCount(id){const n=adj[id].length;return n+' relationship'+(n===1?'':'s');}

// ---- node drag / click ---------------------------------------------------
function startNodeDrag(id,e){
  dragId=id; dragMoved=false;
  const start={x:e.clientX,y:e.clientY};
  const move=ev=>{
    if(Math.hypot(ev.clientX-start.x,ev.clientY-start.y)>4)dragMoved=true;
    const p=pos[id]; const wx=(ev.clientX-cam.x)/cam.k, wy=(ev.clientY-cam.y)/cam.k;
    p.x=wx; p.y=wy; p.vx=0; p.vy=0;
  };
  const up=ev=>{
    window.removeEventListener('pointermove',move);
    window.removeEventListener('pointerup',up);
    if(!dragMoved && id!==focusId) setFocus(id);
    dragId=null;
  };
  window.addEventListener('pointermove',move);
  window.addEventListener('pointerup',up);
}

// ---- pan / zoom ----------------------------------------------------------
const stage=document.getElementById('stage');
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('.node'))return;
  stage.classList.add('panning');
  const s={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};
  const move=ev=>{cam.x=s.cx+(ev.clientX-s.x);cam.y=s.cy+(ev.clientY-s.y);applyCam();};
  const up=()=>{stage.classList.remove('panning');window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);};
  window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
});
stage.addEventListener('wheel',e=>{
  e.preventDefault();
  const factor=Math.exp(-e.deltaY*0.0016);
  const nk=Math.min(2.4,Math.max(0.35,cam.k*factor));
  const wx=(e.clientX-cam.x)/cam.k, wy=(e.clientY-cam.y)/cam.k;
  cam.k=nk; cam.x=e.clientX-wx*nk; cam.y=e.clientY-wy*nk; applyCam();
},{passive:false});
document.getElementById('zin').onclick=()=>zoomBy(1.2);
document.getElementById('zout').onclick=()=>zoomBy(1/1.2);
function zoomBy(f){const nk=Math.min(2.4,Math.max(0.35,cam.k*f));const wx=(W/2-cam.x)/cam.k,wy=(H/2-cam.y)/cam.k;cam.k=nk;cam.x=W/2-wx*nk;cam.y=H/2-wy*nk;applyCam();}
document.getElementById('fullscr').onclick=()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
};

// ---- simulation ----------------------------------------------------------
function tick(){
  const ids=[...active];
  // ring radius accounts for the focus capsule's width and long chip labels
  const maxChipW = ids.reduce((m,i)=>Math.max(m,estW(i)),0);
  const REST = 140 + ids.length*8 + estW(focusId)*0.55 + maxChipW*0.35;
  {const f=pos[focusId]; f.vx=0; f.vy=0; f.x*=0.86; f.y*=0.86;
   if(Math.abs(f.x)<0.3)f.x=0; if(Math.abs(f.y)<0.3)f.y=0;}
  for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){
    const a=pos[ids[i]],b=pos[ids[j]];
    let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy||0.01,d=Math.sqrt(d2);
    const f=4200/d2; const ux=dx/d,uy=dy/d;
    if(ids[i]!==focusId&&ids[i]!==dragId){a.vx+=ux*f;a.vy+=uy*f;}
    if(ids[j]!==focusId&&ids[j]!==dragId){b.vx-=ux*f;b.vy-=uy*f;}
  }
  const F=pos[focusId];
  for(const id of ids){ if(id===focusId||id===dragId)continue;
    const p=pos[id]; let dx=p.x-F.x,dy=p.y-F.y,d=Math.hypot(dx,dy)||0.01;
    p.vx-=(dx/d)*(d-REST)*0.03; p.vy-=(dy/d)*(d-REST)*0.03;
  }
  for(const id of ids){ if(id===focusId){continue;} const p=pos[id]; if(id===dragId){continue;}
    p.vx*=0.86; p.vy*=0.86; p.x+=p.vx; p.y+=p.vy; }

  clock+=0.016;

  // focus ring: TWO full loops around the capsule, eased smoothly (slow to
  // start, slow to finish), then the glow fades out and it rests before repeating.
  {const SPIN=1.95, FADE=0.9, REST=4.0, PERIOD=SPIN+REST; // 30% slower than the original 1.5s
   const t=clock%PERIOD;
   let angle, glow;
   if(t<SPIN){
     const p=t/SPIN;
     const eased = p<.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2;   // easeInOutCubic
     angle=eased*720;                                // 2 full 360° loops, eased in/out
     glow=Math.min(1, t/0.22);                        // slightly slower glow-in to match
   } else {
     angle=720;                                      // frozen at the end of the second loop
     const rt=t-SPIN;
     glow = rt<FADE ? 1-(rt/FADE) : 0;                // smooth fade-out, then dark rest
   }
   focusGradEl.setAttribute('gradientTransform',`rotate(${angle%360} 0.5 0.5)`);
   for(const id in nodeEls){ const rec=nodeEls[id]; if(rec.capGlow) rec.capGlow.style.opacity=glow; }
  }

  render();
  if(hoverId) placeTip(hoverId);   // card tracks the node while physics settle
  requestAnimationFrame(tick);
}

function render(){
  for(const id of active){
    const rec=nodeEls[id]; if(!rec)continue;
    const p=pos[id];
    rec.g.setAttribute('transform',`translate(${p.x},${p.y})`);
    if(rec.isFocus)continue;
    const sq=rec.g.querySelector('.chip-sq');
    const left = p.x < pos[focusId].x - 2;
    if(left){
      rec.chipRect.setAttribute('x',-(rec.w+30));
      if(sq)sq.setAttribute('x',-(rec.w+21));
      rec.label.setAttribute('x',-(rec.w+5)); rec.label.setAttribute('text-anchor','start');
    } else {
      rec.chipRect.setAttribute('x',0);
      if(sq)sq.setAttribute('x',9);
      rec.label.setAttribute('x',25); rec.label.setAttribute('text-anchor','start');
    }
  }
  for(const e of edgeEls){
    const a=pos[e.a],b=pos[e.b]; if(!a||!b)continue;
    e.line.setAttribute('x1',a.x);e.line.setAttribute('y1',a.y);
    e.line.setAttribute('x2',b.x);e.line.setAttribute('y2',b.y);

    if(e.ptext.textContent){
      let tf=0.5, F=null, O=null;
      if(e.a===focusId){F=a;O=b;} else if(e.b===focusId){F=b;O=a;}
      if(F){
        const L=Math.hypot(O.x-F.x,O.y-F.y)||1;
        const focusReach = O.x>=F.x ? (48+estW(focusId)) : 26;
        tf = Math.min(0.76, Math.max(0.5, (focusReach+46)/L));
      }
      const mx = F ? F.x+(O.x-F.x)*tf : (a.x+b.x)/2;
      const my = F ? F.y+(O.y-F.y)*tf : (a.y+b.y)/2;
      const tw=estW(e.ptext.textContent, 10.5, 500);
      e.pg.setAttribute('transform',`translate(${mx},${my})`);
      e.prect.setAttribute('x',-tw/2-8); e.prect.setAttribute('y',-10); e.prect.setAttribute('width',tw+16);
      const on = hoverId && (e.a===hoverId||e.b===hoverId);
      e.pg.classList.toggle('hi', !!on);
      e.pg.style.opacity = hoverId ? (on?1:0.12) : 1;
    } else { e.pg.setAttribute('transform','translate(-9999,-9999)'); }

    // shimmer: one pulse per PERIOD, travelling the FULL length from the
    // focus node to the neighbor in TRAVEL seconds, then resting quietly.
    const PERIOD=5.5, TRAVEL=1.1;
    const fp=pos[e.from], tp=pos[e.to];
    e.shimmer.setAttribute('x1',fp.x);e.shimmer.setAttribute('y1',fp.y);
    e.shimmer.setAttribute('x2',tp.x);e.shimmer.setAttribute('y2',tp.y);
    const tt=(clock + e.phase*PERIOD) % PERIOD;
    let visible=false;
    if(tt<TRAVEL){
      visible=true;
      const p=tt/TRAVEL;                       // 0 → 1 across the whole edge
      const ease=p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;   // easeInOutQuad
      const band=13;                            // glow half-width in % of length
      const c=-band + ease*(100+2*band);        // slides fully in and fully out
      const cl=v=>Math.min(100,Math.max(0,v));
      e.ss0.setAttribute('offset', cl(c-band)+'%');
      e.ss1.setAttribute('offset', cl(c)+'%');
      e.ss2.setAttribute('offset', cl(c+band)+'%');
    }

    const dimmed = hoverId && !(e.a===hoverId||e.b===hoverId);
    e.line.classList.toggle('hi', !!(hoverId && !dimmed));
    e.line.style.opacity = hoverId ? (dimmed?0.1:'') : '';
    e.shimmer.style.opacity = !visible ? 0 : (dimmed ? 0.04 : 1);
  }
}
const _m=document.createElement('canvas').getContext('2d');
function estW(s,size,weight){_m.font=`${weight||600} ${size||13}px Geist, Inter, sans-serif`;return Math.ceil(_m.measureText(s).width);}

// ---- chrome (breadcrumbs / legend) --------------------------------------
function updateChrome(){
  const c=document.getElementById('crumbs'); c.innerHTML='';
  const trail=[...history.slice(-3), focusId];
  trail.forEach((id,i)=>{
    if(i>0){const s=document.createElement('span');s.className='sep';s.textContent='›';c.appendChild(s);}
    const b=document.createElement('button'); b.textContent=id;
    if(id===focusId){b.className='cur'; b.style.borderColor=colorOf(id); b.style.color='#fff';}
    b.onclick=()=>{ if(id!==focusId){
      const idx=history.lastIndexOf(id); if(idx>=0)history.length=idx; setFocus(id,false);} };
    c.appendChild(b);
  });
  if(history.length){const back=document.createElement('button');back.textContent='← back';
    back.onclick=()=>{const prev=history.pop(); if(prev)setFocus(prev,false);};
    c.insertBefore(back,c.firstChild);}
}
(function legend(){
  const L=document.getElementById('legend');
  const used=[...new Set(NODES.map(n=>n.type))];
  for(const k of used){const t=TYPE[k];const row=document.createElement('div');row.className='row';
    row.innerHTML=`<span class="sw" style="background:${t.color}"></span>${t.label}`;
    L.appendChild(row);}
})();

// ---- search --------------------------------------------------------------
document.getElementById('q').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const v=e.target.value.trim().toLowerCase(); if(!v)return;
  const hit=NODES.find(n=>n.id.toLowerCase().includes(v));
  if(hit){setFocus(hit.id); e.target.blur();}
});

// ---- resize --------------------------------------------------------------
addEventListener('resize',()=>{W=innerWidth;H=innerHeight;});

// ---- go ------------------------------------------------------------------
applyCam();
setFocus(START,false);
tick();
</script>
</body>
