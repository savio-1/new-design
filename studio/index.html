<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Collage Studio</title>
  <meta name="description" content="A layered photo & graphic editor for scrapbook-style posts: text styles, stickers, frames, calendars, templates and snap-to-grid layout." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="studio.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark"></span><span class="brand-name">Collage Studio</span></div>
      <button class="tb-btn" id="btn-home" title="New design / templates"><i data-icon="plus"></i><span>New</span></button>
      <input id="doc-name" class="doc-name" value="Untitled design" spellcheck="false" aria-label="Design name" />
      <div class="tb-group">
        <button class="tb-icon" id="btn-undo" title="Undo (⌘Z)"><i data-icon="undo"></i></button>
        <button class="tb-icon" id="btn-redo" title="Redo (⇧⌘Z)"><i data-icon="redo"></i></button>
      </div>
      <div class="tb-spacer"></div>
      <div class="tb-group tb-toggles">
        <button class="tb-icon toggle" id="tg-grid" title="Show grid (G)"><i data-icon="grid"></i></button>
        <button class="tb-icon toggle" id="tg-snapgrid" title="Snap to grid"><i data-icon="magnet"></i></button>
        <button class="tb-icon toggle" id="tg-guides" title="Smart guides & centre lines"><i data-icon="guides"></i></button>
        <button class="tb-icon" id="btn-gridsize" title="Grid size"><span id="gridsize-label">40</span></button>
      </div>
      <div class="tb-group zoom">
        <button class="tb-icon" id="btn-zoom-out" title="Zoom out (⌘−)"><i data-icon="minus"></i></button>
        <button class="tb-zoom" id="btn-zoom-fit" title="Fit to screen (⌘0)">100%</button>
        <button class="tb-icon" id="btn-zoom-in" title="Zoom in (⌘+)"><i data-icon="plus"></i></button>
      </div>
      <button class="tb-btn" id="btn-size" title="Canvas size"><i data-icon="resize"></i><span id="size-label">1080 × 1350</span></button>
      <button class="tb-icon" id="btn-help" title="Shortcuts (?)"><i data-icon="help"></i></button>
      <button class="tb-btn" id="btn-project" title="Save / open project file"><i data-icon="folder"></i><span>Project</span></button>
      <button class="tb-btn primary" id="btn-export"><i data-icon="download"></i><span>Export</span></button>
    </header>

    <nav class="rail" id="rail">
      <button data-tab="templates" class="active"><i data-icon="layout"></i><span>Templates</span></button>
      <button data-tab="text"><i data-icon="type"></i><span>Text</span></button>
      <button data-tab="stickers"><i data-icon="sticker"></i><span>Stickers</span></button>
      <button data-tab="shapes"><i data-icon="shapes"></i><span>Shapes</span></button>
      <button data-tab="photos"><i data-icon="image"></i><span>Photos</span></button>
      <button data-tab="planner"><i data-icon="calendar"></i><span>Calendar</span></button>
      <button data-tab="background"><i data-icon="palette"></i><span>Canvas</span></button>
      <button data-tab="layers"><i data-icon="layers"></i><span>Layers</span></button>
    </nav>

    <aside class="panel" id="panel"></aside>

    <main class="stage-area" id="stage-area">
      <div id="stage"></div>
      <div id="overlay-layer"></div>
      <div class="stage-hint" id="stage-hint"></div>
      <div class="drop-veil" id="drop-veil"><div>Drop photos to add them</div></div>
    </main>

    <aside class="inspector" id="inspector"></aside>
  </div>

  <div id="popover-root"></div>
  <div id="modal-root"></div>
  <div class="toast" id="toast"></div>
  <input type="file" id="file-input" accept="image/*" multiple hidden />
  <input type="file" id="project-input" accept=".json,application/json" hidden />

  <script src="https://cdn.jsdelivr.net/npm/konva@9.3.22/konva.min.js"></script>
  <script src="fonts.js"></script>
  <script src="stickers.js"></script>
  <script src="render.js"></script>
  <script src="templates.js"></script>
  <script src="app.js"></script>
  <script src="ui.js"></script>
</body>
</html>
