/* ══════════════════════════════════════════════════════════════════
   APPROVALS — four-eyes. The requester can cancel, never approve.
   ══════════════════════════════════════════════════════════════════ */
function pageApprovals() {
  if (UI.scope === 'all') return allApprovals();
  if (UI.scope === 'inst') return instEmpty('Approvals', 'Installation requests need another platform admin.', 'ds-HITL');
  let h = banners();
  const pend = pending(), hist = S.requests.filter(r => r.status !== 'pending');
  head('Approvals', 'Turning on Enforce, and new rules while enforcing, need a second admin. Requesters can cancel, never approve.');
  PG.left = segTabs([{ k: 'pending', label: 'Waiting', n: pend.length, dot: pend.length > 0 }, { k: 'history', label: 'History', n: hist.length }], UI.appr, 'apprTab');
  if (UI.appr === 'pending') {
    if (!pend.length) return h + `<section class="gv-card"><div class="gv-empty"><span class="gv-well" data-tone="green">${ic('i-check', 20)}</span><div class="gv-empty__title cq-body1-med">Nothing to approve</div><div class="gv-empty__desc cq-body2-reg">When an admin asks to turn on Enforce, or to make new rules live while enforcing, the request shows up here.</div></div></section>`;
    return h + pend.map(requestCard).join('');
  }
  if (!hist.length) return h + `<section class="gv-card"><div class="gv-empty"><div class="gv-empty__title cq-body1-med">No decisions yet</div></div></section>`;
  const tone = { approved: ['Approved', 'green', 'i-check'], rejected: ['Rejected', 'red', 'ds-Disable'], cancelled: ['Cancelled', 'grey', 'i-close'] };
  return h + `<section class="gv-card gv-card--flush" style="padding:0"><div class="cq-table gv-table" style="--cq-cols:minmax(220px,1.3fr) 130px 160px 170px minmax(220px,1.6fr);border:0;border-radius:0"><div class="cq-thead"><span>Request</span><span>Status</span><span>Asked by</span><span>Decided</span><span>Decision reason</span></div>
    ${hist.map(r => `<div class="cq-row"><span class="cq-cell"><span class="gv-cell-main"><span class="cq-body2-med">${r.kind === 'mode_change' ? 'Turn on Enforce' : `Make “${esc(V(r.versionId).name)}” live`}</span><span class="cq-caption-reg">“${esc(r.reason)}”</span></span></span><span class="cq-cell">${chip(...tone[r.status], 1)}</span><span class="cq-cell"><span class="gv-who">${avatar(USERS[r.by])}<span class="cq-caption-reg">${USERS[r.by].short}</span></span></span><span class="cq-cell gv-cell-time">${fmtWhen(r.decidedAt)}${r.decidedBy ? ` · ${USERS[r.decidedBy].short}` : ''}</span><span class="cq-cell cq-caption-reg gv-sec"><span class="cq-truncate">${esc(r.decisionReason || '—')}</span></span></div>`).join('')}</div></section>`;
}
function requestCard(r) {
  const mine = r.by === UI.user;

  const lv = V(r.liveId) || live();
  const target = isMode ? lv : V(r.versionId);
  const chk = rulesCheck(target.rules);
  const would = S.records.filter(x => x.verdict === 'deny' && !x.enforced).length;
  const d = !isMode ? diffRules(live().rules, target.rules) : null;
  const diffN = S.records.filter(x => x.candidate && x.candidate.differs).length;
  return `<section class="gv-card gv-req gv-fade" style="margin-bottom:12px">
    <div class="gv-req__head"><span class="gv-well" data-tone="${isMode ? 'green' : 'blue'}">${ic(isMode ? 'ds-Guardrails' : 'ds-Checklist', 16)}</span><div>
      <div class="gv-req__title cq-body1-med">${isMode ? `Turn on Enforce for ${esc(WSN())}` : `Make “${esc(target.name)}” live`} ${chip('Waiting for approval', 'orange', 'i-clock', 1)}</div>

    <div class="gv-req__quote cq-body2-reg">“${esc(r.reason)}”</div>
    ${isMode ? `<div class="gv-req__grid">
      <div class="gv-req__cell"><span class="k cq-caption-reg">What changes</span><span class="v cq-body2-med">${modeChip('monitor', 1)} → ${modeChip('enforce', 1)}</span></div>
      <div class="gv-req__cell"><span class="k cq-caption-reg">Rules that will enforce</span><span class="v cq-body2-med"><button class="cq-btn cq-btn--link cq-body2-med cq-truncate" data-act="openVersion" data-id="${lv.id}">${esc(lv.name)}</button> <span class="gv-muted cq-caption-reg">${plural(lv.rules.length, 'rule')}</span></span></div>
      <div class="gv-req__cell"><span class="k cq-caption-reg">If governance can’t answer</span><span class="v cq-body2-med">${FAIL[r.failMode]}</span></div></div>`
    : `<div class="gv-req__grid"><div class="gv-req__cell"><span class="k cq-caption-reg">Replaces</span><span class="v cq-body2-med">${esc(live().name)}</span></div><div class="gv-req__cell"><span class="k cq-caption-reg">Trial</span><span class="v cq-body2-med">${dur(S.windowH)} · ${diffN} decisions differ</span></div><div class="gv-req__cell"><span class="k cq-caption-reg">Changes</span><span class="v">${diffChips(d)}</span></div></div>`}
    <div class="gv-req__body">
      ${!isMode && d.list.length ? `<div class="gv-rules">${d.list.map(c => ruleRow(c.r, 'is-' + c.k)).join('')}</div>` : ''}
      <div><div class="cq-caption-med gv-muted" style="margin-bottom:8px">Rules check</div><div class="gv-checks cq-caption-reg">${chk.map(checkRow).join('')}</div></div>
      <div class="cq-row-flex">${isMode ? `<button class="cq-btn cq-btn--xs cq-btn--tonal-2" data-act="goAct" data-filter="would">${ic('i-alert', 14)}Review what would have been blocked (${would})</button><span class="cq-caption-reg gv-muted">Observed for ${dur((NOW - S.monitorSince) / H)} · window ${dur(r.windowH)}</span>`
        : `<button class="cq-btn cq-btn--xs cq-btn--tonal-2" data-act="goAct" data-filter="differs">${ic('ds-ClockOrTime', 14)}Review trial activity (${diffN} differ)</button>`}</div>
    </div>
    <div class="gv-req__foot"><span class="note cq-caption-reg">${ic('ds-UserRole', 14)}${isMode ? `Another admin of ${esc(WSN())}, or any platform admin, can approve.` : 'A different admin must approve.'} The requester can only cancel.</span>
      ${mine ? `<button class="cq-btn cq-btn--sm cq-btn--tonal-2" data-act="decide" data-id="${r.id}" data-ok="cancel">Cancel my request</button>` : ''}

/* ══════════════════════════════════════════════════════════════════

/* ── Version lifecycle: make live, trial, propose, stop, roll back ─── */

function evaluate(rules, asst, call, args) {
  if (S.mode !== 'off' && (pauseFor(asst) || scopePause())) return { verdict: 'paused', reason: 'This assistant is paused by an administrator.' };

      }
      if (r.tpl === 'block_tools' && r.values.tools.includes(call.name) && ok(r, asst)) return { verdict: 'deny', rule: r, reason: `Blocked by rule ‘${r.id}’.` };
    }
    const allow = rules.find(r => (r.id === `starter-${asst}-tools` && r.tools.includes(call.name)) || (r.tpl === 'allowed_tools' && r.values.tools.includes(call.name) && ok(r, asst)));

    return { verdict: 'deny', reason: 'No rule allows this call.' };
  }
  const allow = rules.find(r => r.id === `starter-${asst}-models` || (r.tpl === 'allowed_models' && r.values.models.includes(call.name) && ok(r, asst)));
  if (allow) return { verdict: 'allow', rule: allow, reason: `Allowed by rule ‘${allow.id}’.` };

}
function runTest() {
  let args = {};

    try { args = JSON.parse(T.inputs || '{}'); } catch (e) { T.err = 'Inputs must be a JSON object.'; return refreshDrawer(); }
    if (!args || typeof args !== 'object' || Array.isArray(args)) { T.err = 'Inputs must be a JSON object.'; return refreshDrawer(); }
  }
  T.err = '';
  const rules = T.src === 'draft' && B ? B.rules : T.src === 'version' ? (V(T.version) || {}).rules || [] : (live() || {}).rules || [];
  const call = T.kind === 'tool' ? { kind: 'tool', name: T.tool } : { kind: 'model', name: T.model };
  const e = evaluate(rules, T.asst, call, args);
  const facts = [], unsup = [];
  Object.entries(args).forEach(([k, v]) => { if (v && typeof v === 'object') unsup.push({ name: k, type: Array.isArray(v) ? 'list' : 'object' }); else if (typeof v === 'string' && v.length > 200) unsup.push({ name: k, type: 'long text' }); else facts.push(k); });

  bWriteCheck: () => { const p = parseWritten(B.write); B.writeErr = p.ok ? '' : p.err; paintModal(); if (p.ok) toast('Rule text is valid', `Rule “${p.rule.id}” — ${p.rule.effect === 'allow' ? 'allows' : 'blocks'} calls.`); },
  bWriteAdd: () => { const p = parseWritten(B.write); if (!p.ok) { B.writeErr = p.err; return paintModal(); } if (B.rules.some(r => r.id === p.rule.id)) { B.writeErr = `Rule name “${p.rule.id}” is already used. Rename it.`; return paintModal(); } B.rules.push(p.rule); B.write = ''; B.writeErr = ''; B.view = 'list'; paintModal(); },
  ruleMenu: (d, el) => { const r = B.rules[+d.i]; openPop(el, `${popItem('ruleText', 'ds-Code', 'Show rule text', `data-i="${d.i}"`)}${r.source === 'starter' ? popItem('ruleUpdate', 'i-refresh', 'Update from the assistant', `data-i="${d.i}"`) : ''}<div class="gv-pop__sep"></div>${popItem('ruleRemove', 'ds-Delete', 'Remove from this version', `data-i="${d.i}"`, 'is-danger')}`); },
  ruleText: d => { closePop(); const r = B.rules[+d.i]; const prev = M; openModal('md', () => mHead(esc(r.label), 'ds-Code') + `<div class="gv-modal__body"><pre class="gv-code">${ruleText(r)}</pre></div><div class="cq-modal__foot"><button class="cq-btn cq-btn--sm cq-btn--tonal" data-act="backToBuilder">Back</button></div>`); M.prev = prev; },
  backToBuilder: () => { const prev = M.prev; M = prev; paintModal(); },
  ruleUpdate: d => { closePop(); const r = B.rules[+d.i]; const fresh = starterRules(A(r.asst)).find(x => x.id === r.id); B.rules[+d.i] = fresh; paintModal(); toast('Starter rules updated', `Now includes everything ${A(r.asst).name} uses.`); },
  ruleRemove: d => { closePop(); B.rules.splice(+d.i, 1); paintModal(); },
  decide: d => openDecide(d), dSave: () => saveDecide(), dSwitchCancel: () => { M.ok = 'cancel'; M.err = null; paintModal(); },
  apprTab: d => { UI.appr = d.k; render(); },
  covTab: d => { UI.cov = d.k; render(); },
  asstMenu: (d, el) => {
    const a = A(d.asst), st = asstRuleState(a, live() && live().rules), ps = pauseFor(a.id);
    openPop(el, `${popItem('openBuilder', 'ds-Plus', st && st.k === 'ok' ? 'Update starter rules' : 'Add starter rules', `data-starter="${a.id}"`)}${popItem('openTest', 'ds-Play', 'Test a call', `data-asst="${a.id}"`)}${popItem('actFor', 'ds-Log', 'View activity', `data-asst="${a.id}"`)}<div class="gv-pop__sep"></div>${ps ? popItem('resume', 'ds-Play', 'Resume', `data-id="${ps.id}"`) : popItem('openPause', 'ds-Stop', 'Pause', `data-asst="${a.id}"`, 'is-danger')}`);
  },
  actFor: d => { closePop(); UI.act = { filter: 'all', asst: d.asst, type: 'all', shown: 25, find: '', ws: '', time: '' }; UI.aq = ''; go('activity'); },
  actFilter: d => { UI.act.filter = d.k || d.filter; UI.act.shown = 25; render(); },
  actClear: () => { Object.assign(UI.act, { asst: '', ws: '', type: 'all', shown: 25 }); UI.aq = ''; render(); },
  actMore: () => { UI.act.shown += 25; render(); },
  openWhy: d => openDrawer('why', d.id, d.wsview),
  copyId: d => { try { navigator.clipboard.writeText(d.id); } catch (e) {} toast('Decision id copied', d.id); },
  openTest: d => { closePop(); openTest(d); },
  tKind: d => { T.kind = d.k; T.result = null; refreshDrawer(); }, tSrc: d => { T.src = d.k; T.result = null; refreshDrawer(); }, tRun: () => runTest(),
  closeModal: () => { if (M && M.prev) return ACT.backToBuilder(); closeModal(); }, closeDrawer: () => closeDrawer(),
  scopeMenu: (d, el) => openPop(el, `<button class="gv-pop__item${UI.scope === 'all' ? ' is-picked' : ''}" data-act="setScope" data-scope="all"><span class="cq-avatar" style="background:var(--backgrounds-card-bg-4);color:var(--text-secondary)">${ic('i-layers', 12)}</span><span>All workspaces</span><span class="end"><span class="cq-badge" data-tone="grey">${WORKSPACES.length}</span></span></button>
      <div class="gv-pop__sep"></div><div class="gv-pop__label cq-caption-reg">Workspaces you administer</div>
      ${WORKSPACES.map(w => `<button class="gv-pop__item${UI.scope === 'ws' && CUR === w.id ? ' is-picked' : ''}" data-act="setScope" data-scope="ws" data-ws="${w.id}"><span class="cq-avatar" style="background:${w.color}">${w.letter}</span><span>${esc(w.name)}</span><span class="end">${modeChip(WSD[w.id].mode, 1)}</span></button>`).join('')}
      <div class="gv-pop__sep"></div><div class="gv-pop__label cq-caption-reg">Platform admins</div>
      <button class="gv-pop__item${UI.scope === 'inst' ? ' is-picked' : ''}" data-act="setScope" data-scope="inst"><span class="cq-avatar" style="background:var(--backgrounds-card-bg-4);color:var(--text-secondary)">∗</span><span>Installation settings</span><span class="end">${modeChip(S.installMode, 1)}</span></button>`, 'right'),
  setScope: d => { closePop(); closeDrawer(); if (d.ws) useWs(d.ws); UI.scope = d.scope; UI.act.ws = ''; if (UI.scope === 'inst' && UI.page === 'coverage') UI.page = 'overview'; render(); },
  openInstMode: () => openInstMode(),
  instSave: () => { if (M.sel === 'enforce') { closeModal(); return toast('Approval requested', 'Another platform admin must approve it.', 'info'); } S.installMode = M.sel; closeModal(); render(); toast(`Installation mode changed to ${MODE[S.installMode].label}`, 'This affects every workspace.'); },
  openErase: () => openErase(), eraseSave: () => { closeModal(); toast('Link erased', 'Their records now show “Unknown or erased user”.'); },
  protoScenario: (d, el) => openPop(el, `<div class="gv-pop__label cq-caption-reg">Jump to a point in the rollout</div>${SCENARIOS.map((s, i) => `<button class="gv-pop__item${S.scenario === s.key ? ' is-picked' : ''}" data-act="setScenario" data-k="${s.key}" style="height:auto;padding:8px 10px;align-items:flex-start"><span class="gv-step__mark" style="margin-top:1px">${i + 1}</span><span style="display:flex;flex-direction:column;white-space:normal"><span class="cq-body2-med">${s.label}</span><span class="cq-caption-reg gv-muted">${s.hint}</span></span></button>`).join('')}`),
  setScenario: d => { closePop(); closeModal(); closeDrawer(); load(d.k); if (UI.scope === 'inst') UI.scope = 'ws'; lastPage = null; render(); toast(SCENARIOS.find(s => s.key === d.k).label, SCENARIOS.find(s => s.key === d.k).hint, 'info'); },
  protoUser: () => {
    UI.user = UI.user === 'priya' ? 'rahul' : 'priya';
    const img = document.querySelector('.hdr-avatar');
    if (img) img.style.filter = UI.user === 'rahul' ? 'grayscale(1) brightness(.8)' : '';
    if (M && M.err && M.render === renderDecide) M.err = null;
    render(); if (M) paintModal();
    toast(`Signed in as ${USERS[UI.user].name}`, 'Admin of these workspaces. Approvals need a different admin than the requester.', 'info');
  },
};

/* ── Events ───────────────────────────────────────────────────────── */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (B && B.dd && !e.target.closest('.gv-dd')) { B.dd = null; if (!t) paintModal(); }
  if (!t) { if (!e.target.closest('#pop')) closePop(); if (e.target === $('scrim')) ACT.closeModal(); return; }
  if (!['ruleMenu', 'asstMenu', 'scopeMenu', 'protoScenario', 'fddOpen'].includes(t.dataset.act)) closePop();
  const act = t.dataset.act;
  if (t.dataset.ws && act !== 'setScope') { useWs(t.dataset.ws); UI.scope = 'ws'; UI.act.ws = ''; }
  else if (D && D.ws && t.closest('#drawer') && !['closeDrawer', 'copyId'].includes(act)) { useWs(D.ws); UI.scope = 'ws'; D.ws = null; }
  const fn = ACT[act];
  if (fn) { e.preventDefault(); fn(Object.assign({}, t.dataset), t); }
});
function setPath(path, val) {
  const parts = path.split('.'), base = { B, M, T, UI }[parts[0]];
  let o = base; for (let i = 1; i < parts.length - 1; i++) o = o[parts[i]];
  o[parts[parts.length - 1]] = val;
}
let lazyT = null;
function onBind(e) {
  const el = e.target; if (!el.dataset || !el.dataset.bind) return;
  setPath(el.dataset.bind, el.value);
  document.querySelectorAll(`[data-count="${el.dataset.bind}"]`).forEach(c => c.textContent = `${el.value.length} / 2000`);
  const rr = el.dataset.rerender;
  const inModal = el.closest('#modal'), inDrawer = el.closest('#drawer');
  if (rr === '1' && e.type === 'change') { if (inModal) paintModal(); else if (inDrawer) refreshDrawer(); else { if (el.dataset.bind.startsWith('UI.act')) UI.act.shown = 25; if (el.dataset.bind.startsWith('UI.rules.')) UI.rules.page = 0; render(); } return; }
  if (rr === 'drawer' && e.type === 'change') { if (el.dataset.bind === 'T.asst') { const a = A(T.asst); T.tool = a.tools[0]; } T.result = null; refreshDrawer(); return; }
  if (rr === 'page' && e.type === 'input') {
    clearTimeout(lazyT);
    lazyT = setTimeout(() => {
      const b = el.dataset.bind, pos = el.selectionStart;
      if (b === 'UI.rules.q') UI.rules.page = 0; if (b === 'UI.rules.hq') UI.rules.hpage = 0; if (b === 'UI.allq') UI.covPage = 0; if (b === 'UI.aq') UI.act.shown = 25;
      render();
      const n = document.querySelector(`#bar [data-bind="${b}"], #content [data-bind="${b}"]`); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {} }
    }, 180);
    return;
  }
  if (rr === 'lazy' && e.type === 'input') { clearTimeout(lazyT); lazyT = setTimeout(() => { if (inModal) paintModal(); }, 350); }
  if (inModal) { if (B && M && M.render === renderBuilder) syncBuilder(); else if (M && M.sync) M.sync(); }
}
document.addEventListener('input', onBind);
// Search inside a filter menu narrows its options in place.
document.addEventListener('input', e => {
  if (!e.target.classList || !e.target.classList.contains('gv-popq')) return;
  const q = e.target.value.trim().toLowerCase(), list = e.target.closest('#pop').querySelector('.gv-pop__list');
  let shown = 0;
  list.querySelectorAll('[data-q]').forEach(b => { const on = !q || b.dataset.q.includes(q); b.hidden = !on; if (on) shown++; });
  list.querySelector('.gv-pop__sep').hidden = !!q; list.querySelector('.gv-pop__none').hidden = shown > 0;
});
document.addEventListener('change', onBind);
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role=button][data-act]')) { e.preventDefault(); e.target.click(); return; }
  if (e.key === 'Escape') { if ($('pop')) return closePop(); if (M) return ACT.closeModal(); if (D) return closeDrawer(); }
  if (e.key === 'Enter' && (e.target.id === 'findId' || (e.target.dataset && e.target.dataset.bind === 'UI.aq' && /^[0-9a-f-]{36}$/i.test(e.target.value.trim())))) {
    const v = e.target.value.trim(); UI.act.find = v;
    if (!/^[0-9a-f-]{36}$/i.test(v)) return toast('That doesn’t look like a decision id', 'Decision ids look like 7f3a2c10-0000-4000-8000-000000000012.', 'warn');
    openDrawer('why', v.toLowerCase());
  }
});

/* ── Theme: dark by default, like the platform ─────────────────────── */
function setTheme(mode) {
  if (mode === 'light') root.setAttribute('data-mode', 'light'); else root.removeAttribute('data-mode');
  const dark = mode !== 'light';
  $('themeIcon').setAttribute('href', dark ? '#i-sun' : '#i-moon');
  $('themeToggle').title = dark ? 'Switch to light mode' : 'Switch to dark mode';
  $('themeToggle').setAttribute('aria-label', $('themeToggle').title);
  try { localStorage.setItem('gv-theme', mode); } catch (e) {}
}
$('themeToggle').addEventListener('click', () => setTheme(root.getAttribute('data-mode') === 'light' ? 'dark' : 'light'));
// The viewer's own theme choice wins; otherwise the platform's dark default.
let saved = null; try { saved = localStorage.getItem('gv-theme'); } catch (e) {}
const viewer = root.getAttribute('data-theme');
setTheme(viewer === 'light' || viewer === 'dark' ? viewer : saved === 'light' ? 'light' : 'dark');

/* ── Boot ─────────────────────────────────────────────────────────── */
loadAll();
const h0 = (location.hash || '').replace('#', '').split('?')[0];
if (!window.GV_ONLY && NAV.some(n => n.k === h0)) UI.page = h0;
render();
const dq = (location.hash.match(/decision=([0-9a-f-]{36})/i) || [])[1];
if (dq) openDrawer('why', dq);
})();
</script>
</body>
